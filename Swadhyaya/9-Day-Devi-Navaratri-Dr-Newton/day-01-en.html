</style></head><body><div class="app lang-en"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-02-en.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">Bathukamma · The Asura and the Hara Centre · Devi Navaratri · Day 1 (English)</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">Bathukamma · The Asura and the Hara Centre</span></div><div class="tools"><span class="lang-switch"><a href="day-01-te.html">TE</a><a href="day-01-en.html" class="active">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-02-en.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"Opening Meditation · Anapanasati and Sahasrara","paras":["Welcome to the 561st day of the Jnanodayam programme conducted by Quantum Life University. From today, for the next ten days, Navaratri will be kept, and on the tenth day Vijayadashami. Each of those days begins here. It is the fortune of this gathering that the founder, Dr Newton, comes and gives the message. As on every other morning, the session opens with meditation: forty to forty-five minutes of practice, and at the end the Sahasrara sankalpa, the resolve offered at the crown. A few minutes after that, Dr Newton is welcomed, and the knowledge he brings is received.","Settle for Anapanasati, mindfulness of breathing. Close both eyes. Join the fingers. Cross the feet. Watch the breath as it happens of itself. If thoughts arise, smile a little and bring the attention back. A gentle music plays behind the silence, to help the attention return. For these forty minutes sit in a steady, comfortable posture. Be still. In this present moment, keep the attention on the breath.","Then, for about five minutes, offer the meditation and the sankalpa for the welfare of the world. Draw the resolve toward the Sahasrara pyramid. There is a light of knowledge in all of us. Let this Sahasrara kindle the inner knowing of humankind. The pyramid is being raised by that resolve, so that it may serve everyone. Soon, the sankalpa says, we should see it in physical form, sit within it, and meditate. Take the attention to the top of the head and experience the power of the Sahasrara.","By the collective resolve of everyone here, look with the divine eye and see the pyramid coming into being. With its coming, an exalted power abides. Many are becoming knowers of the Self and knowers of Brahman. Now release the sankalpa, with faith, into the universe. In this joy, bring the attention back to the breath. Remain in that awareness for a minute, then return slowly to waking: a short countdown, both hands rested for a moment over the eyes, and the eyes opened gently, with a smile.","Welcome again. Today is the first day of Navaratri. Across these nine days, and on Vijayadashami, a rare gift has been given. The founder and chairman, Brahmarshi Chakravarti Dr Newton Kondaveti, guru of everyone gathered, had said the day before that he himself would take all of these classes. To learn from him what Navaratri means, and how a celebration is made with knowledge, is a privilege. Those present are asked to put their cameras on and welcome him with a smile.","He greets the friends of Jnanodayam. Day after day the participation is a fine thing. In the Brahma muhurta, this hour before dawn, the meditation goes on with attention, and Jnanodayam helps each person inspire himself or herself. To meditate together, and to come to know, is the work of the morning. The special nature of these ten days is the first thing to be understood."],"minutes":4,"words":492},{"title":"Navaratri · Bathukamma and the Girl Child","paras":["These are festivals with an inner meaning. All over India Devi Navaratri is kept, and that meaning has to be known. Otherwise the celebration stays a ritual: some dancing, some joy, and then ordinary life returns. Every festival has a paramartha, an ultimate purpose. The ancestors watched, recognised, and only then set the methods down. For sadhakas, for those intent on knowledge of the Self, for those who meditate, these days are of the highest use. In the Telangana region the same season is kept as Bathukamma.","Bathukamma has a story, and the story is in the Bhagavatam. A soul plan had already been drawn: Sri Krishna was to come as the eighth child and bring Kamsa's destruction to an end. According to that plan they came. The infants were killed by Kamsa. When the eighth was due, Sri Krishna was exchanged, and a girl child was brought to Kamsa instead.","That girl was the Mother of the world, bearing jaganmaya, the illusion that plays through the universe. She is Durga Mata, remembered as Maha Mahamaya, the great enchantment. The story says Kamsa seized her by the feet and tried to dash her against a stone. She was only an infant, and yet the touch of the earth came to her. She asked Mahavishnu. She is his sister, Parameshwari. Why has the earth touched me? The answer is that in the ages to come a great deal will happen on this earth, and the role of Parameshwari will then be very great. Behind the puranic story stands a soul plan.","Parameshwara is the root of creation. Parameshwari is the one who is to complete it, the whole of it. She is the Mother of the world, and she is to come here. Once she has come, the creation is she. The whole of Prakriti, Nature, is she. This is why a story is told behind every festival. Taken with its inner sense, in the way of meditation, it yields something. Taken only as a story, the spiritual knowledge set inside it does not open."],"minutes":3,"words":344},{"title":"Immersion · The Asura and the Hara Centre","paras":["In this festival an image of the deity is made, and the image is immersed. The tradition is still kept. Only last month the Ganesh festival was celebrated, and Ganesh too was immersed. Creation, sustenance, and dissolution — srishti, sthiti, and laya — belong together. Whatever has been created is gathered back. It has to return to laya. We have come in the same way, into this round of form, and we too will be dissolved.","Once, in a Shiva temple, the same law stood in a sculpture. Dr Newton watches when he enters a temple. He sits, and he tries to read the inner sense of the architecture and the images. In meditation, something of the power of the place can be known by experience. There an asura had been set. He had a name; the name is not the point. His nature was to eat whatever appeared. He consumed everything he saw. When nothing else remained, he began to eat himself. The legs went, the hands, the trunk, up to the neck. Only the bare head was left. If he ate that too, he would no longer be there. Then awareness came. If I eat this, I am finished. I am dissolving. I will not remain.","So the science of the Self, this knowledge, this path of meditation, is a finishing of ourselves. We came forth in creation. We have to be brought to an end: immersion again, and a withdrawal. As one moves toward moksha, liberation, one dissolves. What dissolves is the aham that lives here, the sense of I.","Where is aham? This is the voice that says I, I am here, my name, my town, this is mine. It sits in the belly. That is why Rama could send arrow after arrow at the head, and strike the heads away, and still that many-headed asura, Ravana, did not die. Rama could not end him by the head. He struck the belly. The seat of it is the Manipura chakra, the centre at the navel. That is the will. It is also called the Hara centre. However often the head is cut, the one in the belly remains.","Spirituality is the ending of that aham, the complete dissolving of our I. Otherwise the I and the mine block the way. For any progress in meditation, the one obstruction is this limited I. The definition we live inside is very small. Our truth is the unlimited I, spread through everything. To come to know that, Haraki is required. Haraki means the will that sits in the Hara centre: our private sankalpa, I must do this, I must do that. Haraki is the finishing of ourselves. That is the real immersion.","A festival has a structure for this reason. Behind the customs set down by the ancestors, the yogis and the rishis, yogic secrets have been spoken. The immersion at the end is one of those secrets, acted out where everyone can see it."],"minutes":5,"words":496},{"title":"Nights for the Sadhaka · One Shakti, Many Names","paras":["Why are these called Navaratri, nine nights? Could the worship not be done in the morning? This too has an inner meaning. Bathukamma means living. It means life, and the celebrating of this life. When a word is born, a secret stands behind it. In these days the nine Durgas are worshipped, or a fresh decoration is made each day, with flowers and with different colours, and on the last day the whole is dissolved. Every festival has an outline because the outline matches creation, sustenance, and dissolution.","Whatever is in the brahmanda, the great cosmos, is in the pindanda, the small body. It happens in the subtle, in the causal world, in the great causal, and in the gross world as well. As above, so below. What has taken place in the higher worlds takes place here, and in us.","Night, in ordinary speech, is a symbol of tamoguna, the quality of heaviness. For yogis, for those who meditate, night means that time for sadhana has been given. It is a most sacred hour. No one disturbs it. Everyone else is asleep. The sadhaka wakes at three and sits. The morning is for work and for the matters of our several worlds. The night is for practice.","This Devi Navaratri belongs to Devi Shakti. Parameshwari is the root of everything, the support of this Prakriti and of whatever has been created. That support is worshipped as Durga Mata. The same Shakti is Lalita Mata. The same Shakti is the Mother of the world. In every village the gramadevata, the village goddess, is Parameshwari too. One power, many names. The confusion — how many powers, how many names — comes because the one is seen in many forms. Different regions gave different names. The root has to be held.","We call these days Sri Devi Navaratri. Sri means Prakriti shining. Devi means that which shines. All of Prakriti stands in the radiance of this Shakti. We do not see it, because Prakriti meets the eyes as a feast for the eyes. In every beauty we are absorbed. Behind the beauty a Shakti is standing. The whole moving and unmoving creation is made by this divine power. Without Shakti there is no creation. On that support this life itself is she. We are only calling her by separate names. The name Durga has to be opened."],"minutes":4,"words":395},{"title":"Sri and Durga · Crossing What Is Hard","paras":["Durga means difficulty. The power that carries us across difficulties, and gives the capacity to overcome them, is Durga Mata. Durgamu is what is hard to pierce and hard to accomplish. On this earth difficulties come to everyone. Sri Ramachandra and Sita Mata had a full measure of them. To have taken a human body is to have come from above, from other worlds, and to find that here there is trouble. The aim is not a life from which difficulty is absent. If our shakti increases, we gain the strength to cross what is hard, however many the forts.","As the nine Durgas, the Mother is decorated afresh each day. Those forms are saguna, Shakti seen with qualities and with a face. For those who meditate, the inner meaning is held: this is Shakti. Without that power, difficulties stay, and they do not end. Increase it by meditation, and any difficulty can be met. Many people say, I must do this, I must do that, and remain dreamers. They make plans and do not acquire the power. Ideas may be there, but an idea manifested here needs the shakti it requires. There is a saying: the anchor stays where it is thrown. We remain exactly there.","The nine days are also the nine months in the mother's womb, set down as a sign. The number nine is a sign. They are called the navavaranas, the nine enclosures. In the body the same number is the navarandhras, the nine apertures, which distract us all the time. The body is a leather bag of nine holes, and we are caught in it. Aham thickens the feeling I am the body. The Shakti that supports the body and drives it is known through meditation.","Practice in this season is of another order. Done on these days it is a hundredfold, a thousandfold. These nine days can bring the fruit of a hundred ordinary days, or of a thousand, according to the quality we bring. There is another reading of the same nine, and it lives in the Sri Chakra."],"minutes":3,"words":347},{"title":"Nine Enclosures · Gunas and the Nirguna","paras":["She dwells in the Sri Chakra, and that Sri Chakra is here itself. Belonging to it are the navavaranas. Across these nine days the one who practises crosses them. The names are Sanskrit, and each name says what that enclosure does.","The first is Trailokya Mohana, the enclosure that enchants the three worlds. She is the dweller in the Sri Chakra: Sri Mata, the auspicious Mother; Sri Maharajni, the great queen; Srimat Simhasaneshwari, sovereign upon the lion throne. Lalita, Durga, and the Mother of the world are she. Sarvasha Paripuraka fulfils every hope. We have desires and expectations; if what we dream is to come true, this Shakti is required, and devotion with it. Sarva Sankshobhana stirs everything. Sarva Saubhagyadayaka grants good fortune. Sarvartha Sadhaka accomplishes every aim. Sarva Rakshakara extends every protection. Sarva Rogahara lessens our diseases and removes them. Sarva Siddhiprada grants the siddhis, the accomplished powers. Sarvanandamaya gives paramananda, the supreme bliss. Nine months, nine nights, nine enclosures. The sadhaka is not collecting nine goddesses. The sadhaka is being led, enclosure by enclosure, toward the one Shakti.","The whole of creation also stands in the trigunas, the three qualities, in every combination. And we live in three states: jagrat, waking; svapna, dream; sushupti, deep sleep. Three times three. Each state can be tamas, rajas, or sattva, according to our condition. Tamas is the lowest vibration. Rajas is a middle condition. Sattva is a finer one. The most excellent lies beyond them. Only when the gunas are crossed does nirguna arrive, the state without qualities. That is the true nature of the Atman. No quality remains. It is Parabrahman, Parameshwari, the supreme Parameshwara. Here on earth, everything still stands with some quality.","Night is a symbol of tamas, and with night come sleep and laziness. For the sadhaka that same hour is the hour of practice, about three hours at ease, watching inhalation and exhalation. The breath itself is prana. When people say the prana has gone, they mean the breath has stopped. As one expression, this prana-shakti carries out many functions and drives the body. The Shakti on whose support creation runs has to be known, experienced, become. We become Durga Mata herself through meditation. These nine days are for that daily practice."],"minutes":3,"words":376},{"title":"The Practice · Shivaji, Food, and the Tenth Day","paras":["Chhatrapati Shivaji is remembered among us as a hero. In this telling he drove the British out, and the question is how. He received the inspiration of Durga Devi, and through her that Shakti. His guru was a sadhaka, a master of knowledge of the Self and of Brahman, who knew Durga Mata. This is why the vows of Durga Bhavani are undertaken. Different regions of India keep the same observance under different names. These nights are not to be let go.","Each day, a little beyond the ordinary: one further hour of meditation. Reduce the night's sleep by an hour and sit. Wake at three, and in the Brahma muhurta meditate at ease. Less sleep is less tamoguna. Rajas keeps us too restless, too much on the move. Live more in sattva. Food changes for the same reason. People keep one meal, or they fast. A full stomach of rice brings sleep, and that is not the food this season asks for. The food to be taken is the cosmic Shakti. Eat once, ekabhukta, or twice, dwibhukta. The more limited the meal, the more unlimited the power that can be received. Cosmic energy itself becomes food.","Every festival in India was given an inner meaning. The land has been called a punya bhumi, a sacred land, a jnana bhumi, a land of knowledge, a karma bhumi, a land of action, and a land of yogis. The ancestors experienced these energies and only then established the days. What is being kept this October is Sharad Navaratri, the autumn observance. Vasanta Navaratri, in the spring, comes at Sri Ramanavami, and its speciality is different. This season is pushti sadhana, a practice of nourishment: the Shakti taken on the physical plane, so that difficulties can be crossed. Body, mind, and buddhi come into alignment, and the root is caught.","The root of everything is Shakti. The root of Shakti is Chaitanya, consciousness. First the Mother, Parameshwari. If she is held, the Father, Parameshwara, becomes known, because Shakti leads us to him. The Mother comes first. These nine days are a return to her womb. As we grew there, without worry and without anxiety, so meditation takes us back to that condition, and we are born anew. On the tenth day Vijayadashami is celebrated with victory. It is a great celebration. Do the sadhana with a certain splendour. Take this Shakti inwardly as nourishment, and conserve it. Then what is to be gained is gained, and what is meant to come, comes."],"minutes":4,"words":419},{"title":"The Atman · Kundalini, Vemana, and Three Goals","paras":["Three things are always named in this science. Shakti, power. Chaitanya, consciousness. Jnana, knowledge. The nature of the Atman is the three together. Navaratri sadhana is the sadhana of Shakti. Talk and theory are not enough. Only practice brings the experience. What is that Shakti? It is Kundalini Mata within us. Parameshwari, spread through everything, is in us as well.","Vemana sang it. The Shakti sunk in the muladhara must be seen to rise and float, and seen with intelligence. Brahman in the form of the bindu, the point, must be beheld. Vishwadabhirama, listen, Vema. In this body, at the base of the spinal column, in the muladhara chakra, that Chaitanya Shakti sleeps. We call it Kundalini. Only meditation, and a complete vigilance, wakes it. Then it shines as the radiance of Devi. In a subtle bindu, the reality of Parabrahman is within us. To know this is the sadhana of these nights.","He sang a second verse. The body is a durgam, a fort. Look at it with care, and know it with a clear buddhi. Unable to see the Hari who is inside, people wander. The true fort is this body, because everything here distracts us from our main purpose. The five jnanendriyas, the organs of knowing, and the five karmendriyas, the organs of action, pull us outward. The ears hunt for praise. The eyes must always be seeing someone. The tongue and the skin want taste and touch. We remain in pleasure, and the supreme bliss stays unreached. The fort has to be crossed. Hari and Hara, Shiva and Keshava, are both inside. We wander outside asking where God is, and the time is wasted.","These nine days ask for a full practice. When the hard things have been overcome, Bathukamma is truly danced, and joy overflows. Without Shakti there is no joy. When the cosmic power fills us, whatever is undertaken gets done, because that Shakti does it. So write down three goals. On Vijayadashami some of what is hard is to be crossed. What is troubling you? The Mother who is in us as Kundalini is the one who solves it. The method does not change. Attention on the breath. The breath grows subtler and smaller, awakens the sushumna, the central channel, and introduces Kundalini.","We ourselves make the blocks. A promotion is wanted, or the work should move to its next stage. Financial trouble, once cleared, leaves a freedom in which sadhana is easier. A relationship hurts, and the energy is wasted there. Health may be the thing that is stuck. Set three such goals. Through this Shakti a change comes inside. The angle of seeing changes, and the obstacles leave. The energy of these days is of that order. Parameshwari's look falls on those who meditate. Durga Mata sees that the sadhana is being done well, and she is pleased. She is everywhere as nirguna, in the form of Shakti, and that Shakti is in us. It clears what has to be cleared.","Each day some knowledge is taken, and the more important movement is into further practice. Tomorrow the story of Mahishasura Mardini will be told, and decoded. Each story holds an inner meaning, a yogic sense, a knowledge set inside it."],"minutes":5,"words":540},{"title":"Mahishasura Mardini · A Stotram to Decode","paras":["Dr Newton asked Harika to sing the stotram of Mahishasura Mardini. For everyone listening, it is homework. Tomorrow, when the story is taken up, it is to be decoded. If the hymn is taken only as praise, nothing of it is really known. Yogic secrets have been placed in it. Adi Shankaracharya composed it. The listening itself is the work: look at it two or three times, chant it, and find the meaning. In meditation a great deal becomes known.","Harika sang. The hymn opened with its first line, Ayi giri nandini nandita medini: O daughter of the mountain, delight of the earth. She carried it through to the close. While it was sung, a meditative state opened, and those who listened entered it. Among the knowledges Shankaracharya gave, this is one, and his description of that Shakti is finely made. The decoding remains the sadhaka's work. From there the morning opened into sharing."],"minutes":2,"words":154},{"title":"Swapna Jyothi · Karma and a Changed Home","paras":["Swapna Jyothi of Ganapuram, a village in Bapatla district about four kilometres from the Bay of Bengal, spoke first. She had felt like a frog in a well, far from a teacher she called a guru of the universe, and she had never dreamed she would speak with him. The mind had gone blank. What she had been able to keep was this. As cotton burns when it is held before fire, her karmas had burnt, and she could see it. She had looked at as many as eighty karmas and dissolved them. Meditation alone, she said, is not the whole. A transformation has to come, and that is the main thing. The people in front of her were recognising it more clearly than she was.","At home she and her husband had fought like Tom and Jerry. That had ended. They were living with a real concord. Formerly she heard, what has this meditation achieved, the wrong in you has not gone. Now her husband was telling her that it was time to sit, and to go. She had also begun to see the cause behind a person's suffering, and the cause behind laughter, and to notice how speech can leave the other person happy. Words that wound, spoken for no need, were no longer what she wanted to say. She wants her family to be a help to the universe, and she asks this of Hanuman every day. The mind had grown steady. The old pressure to ask large questions had subsided.","Dr Newton said the account would inspire many. She was not a frog in a well. She had become a whale in the great sea, and they were seeing her as a master. As she spoke, it felt as though Durga Mata herself were standing there. This is the transformation wanted: from a state of many limits to the unlimited. Her question, what can I do for the universe, speaks of the condition of the soul. The lotus has opened. Its fragrance is ready to go to everyone. He thanked her, and her family with her."],"minutes":3,"words":350},{"title":"Ellayya · Sleep, Food, and the Three Principles","paras":["Ellayya spoke next. He offered namaskaram at the feet of his parents, of Dr Newton and of Lakshmi, and to the kindred souls before him. While the hymn was sung he had seen the deities: the screen empty, and yet the nine goddesses visible, the song rising from within. Then he asked, as of a doctor, how many hours of sleep a meditator needs.","Three hours or four can be enough, or six. It is decided by the build of the body, by one's condition, by one's life, and a sadhaka comes to know it from within. Too much sleep increases tamas. Too little is also wrong. The right amount is the practice. Ellayya was in Saudi Arabia, rising at about half past two by that clock, bathing, and joining near three. From midnight he was sitting three hours, sometimes four, and he had been in this way since 2019. For the past week he had eaten only rotis, hot food, no rice, where once he ate three or four or five. The chest burned. The head spun. He could not tell whether it was sleep, or whether the practice had become too much.","The body, Dr Newton said, has to be given rest. It must not be overstrained. Parameshwara and Parameshwari are in this body. To strain it is to give them difficulty. Give it the sleep it needs. Eat as much as the hunger is. Do not kill hunger, and do not take even one measure more than enough. Eat a little less than the hunger, and stop. The burning he described is acidity. A heat had arisen. The jatharagni, the digestive fire, had grown excessive, and hydrochloric acid was being released from the stomach because the stomach was hungry. This is not the moment to refuse food on a self-made rule. Eat a fruit, or one roti more. The body should be comfortable. There is a song which says that if, of three rotis, one is left, the eater is a yogi. That condition comes slowly, known from inside, and only then is one roti reduced. It is not imposed all at once. In the same way the inner knowing says how many hours of sleep are enough.","The attention was honoured: another country, the middle of the night, and still he joined. He spoke of eight years in Dubai, and of sufferings from about 2009 until 2019, through which the practice grew intense. In thirteen days, he said, a problem had left him. Since then he had not wanted injections or tablets. It felt wrong, and his Atman was clear, so he had chosen sadhana. Two pyramids had come through the work, and hundreds of people, and elders had trusted him, among them a chance connected with Jyothi and with Vijayabhaskar. When trust of that kind is given, why abandon the practice? He was keeping it at three. The pyramid he had seen was half built, the base ready. It would be complete next year.","He asked about the Trimurti. People speak of Vishnu, Brahma, and Ganesha as uncle and elder uncle. Are there family bonds of that kind? Those three, Dr Newton said, are states, three principles: creation, sustenance, and dissolution, held as representatives, a symbol. They are not to be seen with the sense of difference. Bonds of that domestic sort are not there. We look from a human angle and say that these are brothers, that Vinayaka is the son, that Subrahmanya is the son of Parameshwara. What is there is one God, one Shakti, one Chaitanya, Parameshwara and Parameshwari, present as many forms.","Hari and Hara are one. Shiva and Keshava are not two to be followed apart. That dividing intellect is where we get stuck. It is one figure and the other side of the same figure: approach from this side and one face appears. Meditation makes the oneness known. The divinity in each person is God. Animals are divine to us, and trees, and the whole earth is held as a divine sphere. These nine days, he was told, are for overcoming what he had described."],"minutes":6,"words":686},{"title":"Questions and Close · Children, Karma, and Tomorrow","paras":["A deputy health education officer spoke next. Dr Newton recognised Nellore, and that the speaker's brother had been his classmate. It was his first time speaking, and the words hardly came. He was serving in that post, and had come to a remote place near Maripadu mandal for his mother-in-law, continuing the work from Duttaluru. He remembered Atmakur, in the early days of Patri Sir, some twenty years before. Around 2006 he had studied in Madurai, and from then had entered meditation. From the age of six there had been hostels and travelling, though he had not known what the restlessness was. Now the wish to know, and to go forward, was strong.","While Harika sang, the verse seemed to move through every organ, and he wondered whether even singers sing so beautifully. He attends the class; when duty shifts the hours, he follows on YouTube. The classes help people like him motivate not only themselves but the society they meet. However busy he was, the knowledge was resonating, and Dr Newton received that as important news: the programme helps everyone. The officer had gathered books on life after death and on the deathless, and was reading them. Even so, the way these masters speak moves the body, and shows, like a question mark, what is not to be done and what is. God is not elsewhere. God is here. He hoped to come with his family. The children had done MBBS abroad and were preparing for the FMGE, the foreign-medical examination.","Lakshmi Kalyani had been waiting her turn. After many months, this was her first time speaking with him. What bond, in earlier births, had she with her husband, or with her children? In this birth the children had become enemies. She had never seen it directly. Even one word would be enough. For months she had held a hard instruction: do not think, we raised them, we fed them, we educated them. However they insulted her, she could see that she had brought it. When they spoke, she would be saying inwardly, this is me. In front of her they said she had eaten while keeping the food to herself. Somewhere she must have failed to serve someone, and it had returned. She knew this. Even so, the sorrow continued for months. Why? She is an actress. Outside, everyone calls her Amma and honours the mother-roles she plays. At home the children do not call her Amma at all.","The answer, Dr Newton said, is already in the question. Which karma of an earlier birth made them enemies? Daughter, daughter-in-law, son-in-law, four at once: what exists is cause and effect. On this earth that is the truth. Without a cause, no effect. When sadhana is done, the knowledge that belongs to it is given, but one has to wait, and to listen. Sometimes a breeze of knowing comes from within, and the angle changes. She had already reported that change. Because I gave this, they are giving it. She could remember a clear case. She had done the same to her own mother-in-law, out of ego, when she was young, and had not known. The same matter was happening now.","One further angle is available. Regard them as gurus — the son, the daughter, the daughter-in-law, and the mother-in-law with them — indirect teachers. Through them, what she has recognised in herself is being reminded. They may speak, and there is no need to react, and no need to suffer. Take it as a lesson. Bring up forgiveness, and compassion, and love the children unconditionally. Unconditional love is what was due when they were small. If they did not receive it, they later say: you were not there, you gave no time, you are always scolding. What was received in childhood is projected again. All of this can clear. Through these nine days, do one hour more. Raise the energy. The angle changes further.","Suppose they were born into her house in order to bring certain lessons. Taken that way, the sorrow goes, and she learns from them. She answered that she had been asking their forgiveness every day, from a year before they left, and still more after they had gone. There is still something to learn. They behave harshly so that the lesson can be taught. When it actually arrives, the feeling of an enemy drops, and they will call her Amma. Patience is needed, and endurance, and forbearance. The sadhana is not to be dropped. She had been waiting to hear this, and her time had come.","Tomorrow morning everyone meets again in Jnanodayam. With auspicious resolves and auspicious blessings, for each person, for the family, for the surroundings, and for whatever work is in hand: may it be accomplished, may the work reach its siddhi."],"minutes":7,"words":801}];
const nav=document.getElementById('nav'),mobileNav=document.getElementById('mobile-nav'),columns=document.getElementById('columns');let chapter=0,spreadIndex=0,spreadCount=1;
function makeNav(root){chapters.forEach((c,i)=>{let li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+c.title+'<small>~'+c.minutes+' min read</small></span>';b.onclick=()=>{chapter=i;spreadIndex=0;render();document.getElementById('mobile-side').classList.remove('open')};li.append(b);root.append(li)})}makeNav(nav);makeNav(mobileNav);
function render(){let c=chapters[chapter];document.getElementById('heading').textContent=c.title;document.getElementById('time').textContent='~'+c.minutes+' min';columns.innerHTML='';let title=document.createElement('h2');title.className='section-title';title.textContent=c.title;columns.append(title);for(let p of c.paras){let el=document.createElement('p');el.textContent=p;columns.append(el)}document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i%chapters.length===chapter));requestAnimationFrame(()=>requestAnimationFrame(measure))}
function measure(){const width=columns.clientWidth;const one=window.matchMedia('(max-width:800px)').matches;const total=Math.max(width,columns.scrollWidth);spreadCount=Math.max(1,Math.ceil((total-2)/width));spreadIndex=Math.min(spreadIndex,spreadCount-1);columns.scrollLeft=spreadIndex*width;document.getElementById('position').textContent='Section '+(chapter+1)+' / '+chapters.length+' · '+(one?'Page ':'Spread ')+(spreadIndex+1)+' / '+spreadCount;document.getElementById('prev').disabled=chapter===0&&spreadIndex===0;document.getElementById('next').disabled=chapter===chapters.length-1&&spreadIndex===spreadCount-1}
function move(dir){if(dir===1){if(spreadIndex<spreadCount-1)spreadIndex++;else if(chapter<chapters.length-1){chapter++;spreadIndex=0;render();return}}else{if(spreadIndex>0)spreadIndex--;else if(chapter>0){chapter--;spreadIndex=9999;render();return}}measure()}
document.getElementById('next').onclick=()=>move(1);document.getElementById('prev').onclick=()=>move(-1);document.getElementById('font').onclick=()=>{document.body.classList.toggle('font-large');spreadIndex=0;requestAnimationFrame(measure)};document.getElementById('menu').onclick=()=>document.getElementById('mobile-side').classList.toggle('open');window.addEventListener('resize',()=>{spreadIndex=0;requestAnimationFrame(measure)});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});render();</script></body></html>
