</style></head><body><div class="app lang-te"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-02-te.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">బతుకమ్మ · అసురుడు · హర కేంద్రం · దేవీ నవరాత్రులు · Day 1</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">బతుకమ్మ · అసురుడు · హర కేంద్రం</span></div><div class="tools"><span class="lang-switch"><a href="day-01-te.html" class="active">TE</a><a href="day-01-en.html">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-02-te.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"ధ్యాన ప్రారంభం · ఆనాపానసతి","paras":["ఓం ఓం ఓం ధ్యానోదయం కార్య కార్యక్రమంలో 561వ రోజుకి స్వాగతం. ఈరోజు నుంచి వచ్చే 10 రోజులు ఈ నవరాత్రులు అండ్ అలానే దశమి రోజు విజయదశమి మనము ఇంచక్క సెలబ్రేట్ చేసుకోబోతున్నాం ప్రతి రోజుని జ్ఞానోదయంతో ప్రారంభించుకుంటూ ఈ జ్ఞానోదయంలో మనకి ఎంతో అదృష్టం క్వాంటం లైఫ్ యూనివర్సిటీ ఫౌండర్ డాక్టర్ న్యూటన్ గారు అండ్ ఆయన వచ్చి మనకి సందేశాన్ని ఇస్తారు. మరి ప్రతిరోజు లాగానే ఈ జ్ఞానోదయం కార్యక్రమం మనమంతా ధ్యానంతో ప్రారంభించుకుందాం. ఫస్ట్ 40 45 నిమిషాలు మనం ధ్యానం చేస్తాము. లాస్ట్ లో సహస్రార సంకల్పం చెప్పుకుంటాము.","ఫైవ్ మినిట్స్ 10 మినిట్స్ అలాగా ఆ తర్వాత డాక్టర్ న్యూటన్ గారిని వెల్కమ్ చేసుకుంటూ ఆయన అందించే జ్ఞానాన్ని స్వీకరిద్దాము. సో అందరం చక్కగా ఆనాపానా సతి ధ్యానానికి సిద్ధమైపోదాం. కళ్ళు రెండు మూసుకుందాం. వేళ్ళలో వేలు పెట్టుకొని పాదాలు రెండు క్రాస్ చేసుకొని సహజంగా జరిగే శ్వాసని గమనించడమే. చిరునవ్వుతో మరి ఆలోచనలు వస్తే తిరిగి మన ధ్యాసని శ్వాస మీదకి తీసుకువద్దాం. బ్యాక్గ్రౌండ్ లో ఒక జెంటిల్ మ్యూజిక్ ప్లే అవుతూ ఉంటుంది. మన ధ్యాసతే తిరిగి తీసుకురావడం కోసం ఈ మ్యూజిక్ మనకి సహకరిస్తుంది.","చక్కగా ఈ 40 నిమిషాలు స్థిర సుఖాసనంలో కూర్చుని ఉందాం స్థిరంగా ఉందాం నిశ్చలంగా ఉందాం చలనము లేకుండా ఈ ప్రస్తుత క్షణంలో శ్వాస మీద ధ్యాస ఉంచుదాం ఓం ఓం ఓం ఓం పూర్తి ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఆం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఎరుకతో ఉన్నా ఒక ఐదు నిమిషాలు మన ఈ ధ్యానాన్ని మన ధ్యాన సంకల్పాన్ని లోక కళ్యాణాన్ని అడిగేలాగా మన సంకల్పం సహస్రార పిరమిడ్ వైపుకి తీసు మనందరిలోనూ ఉన్న జ్ఞానపు వెలుగు ఈ సహస్రార మానవాళలో అంతర్గత జ్ఞానాన్ని నిన్ను కొలపాలని","సంకల్పంతో నిర్మిస్తున్న ఈ సహస్ర ప్రతి కలిగి ఉపకడేలా అదే త్వరలో మనమంతా భౌతికంలో సహస్రార పిరమిడ్ చూడాలని అందులో కూర్చుని ధ్యానం చేయాలని సంకల్పిద్దాం మీ దృష్టిని ధ్యాసని తలపై భాగం వైపుకి తీసుకువెళ్ళండి ఈ సహస్రార శక్తిని అనుభవం పొందండి.","మనందరి సామూహిక సంకల్పంతో ఈ సహస్రారా పిరమిడ్ ఆవిర్భవం అవుతున్నట్లుగా ఈ దివ్య నేత్రంతో చూడండి అనుభవం పొందండి ఈ సహస్రారా పిరమిడ్ రావడంతో మేదా ఎంత ఉన్నతమైన శక్తి ఉండిపోతూ ఉంది. ఎంతో మంది ఆత్మజ్ఞానులుగా బ్రహ్మజ్ఞానులుగా మారినవారు తెలుసుకుంటున్నారు.","ఇప్పుడు ఈ సంకల్పాన్ని నమ్మకంతో విశ్వానికి విడుదల చేద్దాం ఈ ఆనందంతో ఈ సంతృప్తితో తిరిగి మీ ధ్యాసని శ్వాస మీదకి తీసుకురండి ఓం ఓం ఓం అరే ఒక్క నిమిషం ఈ ఎరుకతోనే ఉండి నెమ్మది నెమ్మదిగా పూర్తి నెలుకువ స్థితిలోకి వస్తూ ఉన్నాను 30 సెకండ్లు 10 సెకండ్లు ఐదు నాలుగు మూడు రెండు ఒకటి సున్నా నెమ్మది నెమ్మదిగా మీ చేతులు రెండు కొద్ది క్షణాలు పెట్టు కళ్ళ మీద ఉంచుకొని ఒక చిరునవ్వుతో నెమ్మదిగా కలరణం పెరుద్దాం. అందరికీ మరొక్కసారి స్వాగతం. ఈరోజు నవరాత్రుల్లో మొదటి రోజు అండ్ ఈ తొమ్మిది రోజులు అలానే విజయదశమి రోజున కూడా మనకి ఒక అద్భుతమైన బహుమానం అందించారు.","మన క్వాంటం [గొంతు సవరించుకోవడం] లైఫ్ యూనివర్సిటీ ఫౌండర్ అండ్ చైర్మన్ బ్రహ్మర్షి చక్రవర్తి డాక్టర్ న్యూటన్ కొండవీటి గారు మనందరి గురువు ఆయన స్వయంగా ఈ క్లాసెస్ అన్నీ కూడా తీసుకుంటూ ఉన్నానని చెప్పారు నిన్న అండ్ ఇట్ ఇస్ సో సచ్ ఏ ప్రివిలెజ్ నిజంగా నవరాత్రులు అంటే ఏంటి ఆ అర్థం ఏంటి మనం ఎలా సెలబ్రేషన్ అనేది జ్ఞానంతోనే అని ఆయన నుంచే మనం తెలుసుకోబోతూ ఉన్నాము. అండ్ మరి అందరూ కూడా జూమ్ లో ఉన్న మిత్రులంతా కూడా కెమెరాస్ ఆన్ చేసుకొని సర్ కి ఒక చిరునవ్వుతో మనం స్వాగతం పలుకుదాం.","థాంక్యూ సో మచ్ సర్ మీరు ఇంత చక్కని అదృష్టం మాకు కలిగించినందుకు ఈ అవకాశం మాకు కలిగించినందుకు మీ టైం మాకు ఇచ్చినందుకు అండ్ వి ఆర్ సో లుకింగ్ ఫార్వర్డ్ మీ నుంచి నేర్చుకోవడానికి థాంక్యూ సో మచ్ అండ్ ఓవర్ టు సర్ థాంక్యూ హారిక మేడం థాంక్యూ డియర్ ఫ్రెండ్స్ జ్ఞానోదయంకి ప్రతిరోజు కూడా మనం అద్భుతంగా పార్టిసిపేట్ చేస్తూ ఈ బ్రాహ్మిణీ ముహూర్త సమయంలో మనం ఈ ధ్యానం నిరంతరం ప్రతిరోజు అనునిత్యం శ్రద్ధ శ్రద్ధతో మనల్ని మనం ఇన్స్పైర్ చేసుకుంటూ ఉండడానికి జ్ఞానోదయం మనందరికీ కూడా హెల్ప్ చేస్తుంది.","ప్రతి రోజు అందరితో కలిసి ధ్యానం చేయడము జ్ఞానాన్ని తెలుసుకోవడము మరి ఈ 10 రోజులు నవరాత్రులు మరి విజయదశమి వీటి యొక్క విశిష్టత ఫస్ట్ మనం తెలుసుకుందాం ఎందుకంటే ఇవన్నీ ఒక అంతరార్థ సహితమైనటువంటి పండుగలు మన భారతదేశం అంతా మనం ఈ దేవీ నవరాత్రుల ఉత్సవాలు చేసుకుంటాం. ఆ అర్థాన్ని తెలుసుకోవాలి ఎందుకంటే లేకపోతే ఏదో రిచువలిస్టిక్ గా ఉత్సవం అంటే డాన్స్ చేయడము లేకపోతే కొంత ఆనంద పడతాం తర్వాత మామూలు మన లైఫ్ మళలా మామూలు అయిపోతుంది.","కానీ ప్రతి పండగకి ఒక గొప్ప అర్థం ఉంది పరమార్థం ఉంది ఎన్నో పద్ధతులు సాంప్రదాయాలు ఇవన్నీ కూడా మన పూర్వీకులు గుర్తించి గమనించి వీటిని పెట్టారు. పర్టికులర్గా సాధకులకు ఆత్మజ్ఞాన పరాయణులకు ధ్యాన సాధకులకు ఉత్తమమైనటువంటి ఈ రోజులు అన్నమాట నవరాత్రులు మరి దేవీ నవరాత్రులు అంటాం తెలంగాణ ప్రాంతంలో అయితే బతుకమ్మ పండగ అంటాం బతుకమ్మ పండగ కూడా ఇలానే మనం చేసుకుంటాం ఇక్కడ ఎందుకంటే ఒక స్టోరీ ఉంది అది భాగవతంలోని స్టోరీ కృష్ణ భగవానులు ఎనిమిదవ సంతానంగా వచ్చి కంసుడి సంహారం చేయడానికి ఒక సోల్ ప్లాన్ ఆత్మ ప్రణాళిక అనేది డిజైన్ అనేది అయిపోయింది.","దాని ప్రకారంగానే మరి వాళ్ళంతా కూడా వచ్చారు ఆ శిశువులంతా కూడా చంపబడ్డారు కంసుడు ద్వారా ఎనిమిదవ సంతానంగా శ్రీకృష్ణుల వారు ఎక్స్చేంజ్ కాబడ్డారు. అక్కడ ఆడబిడ్డని ఇటు కంసుడికి దగ్గరికి చేర్చడం ఆ ఆడబిడ్డ ఎవరో కాదు ఆమె ఈ జగన్మాయా శక్తితో ఉన్నటువంటి జగన్మాత దుర్గామాత మహా మహామాయగా ఆమెని మనం చెప్పుకుంటాం. సో ఆవిడ్ని కంసుడు పట్టుకొని కాళ్ళను పట్టుకొని బండకేసి బాది కొట్టి చంప చంపడానికి ప్రయత్నం చేసినట్టుగా రాయబడింది ఆ స్టోరీలో సో ఆవిడ ఆయన స్పర్శ తగిలింది. ఆమె పాదాలను పట్టుకున్నాడు. ఆ దుర్గామాత పాదాలని పట్టుకున్నాడు.","చిన్న బాలికగా పసిబిడ్డగా ఉన్న పట్టుకున్నాడు భూస్పర్శ తగిలింది ఆవిడ మహావిష్ణువుని అడిగింది మహావిష్ణువు సోదరి కదా ఆమె మహావిష్ణువుకి సోదరి పరమేశ్వరి ఎందుకు నాకు ఎందుకు భూస్పర్శ ఎందుకు ఇది జరిగింది అంటే వచ్చే కాలాల్లో ఇక్కడ భూమండలం మీద చాలా జరగబో పోతుంది అప్పుడు ఆ పరమేశ్వరి యొక్క రోల్ చాలా ఉంటుంది అని చెప్పి చెప్పబడింది. పురాణ కథల్లో అంటే మనం కనెక్ట్ చేసుకుంటే దీని వెనకాల స్టోరీ బిహైండ్ ద స్టోరీ అంటే ఒక సోల్ ప్లాన్ కూడా ఉంటుంది.","అంటే పరమేశ్వరుడు పరమేశ్వరి ఆ సృష్టి మూలానికి అన్నిటికీ మూలంగా ఉన్నటువంటి ఆ యొక్క పరమేశ్వరుడు ఈ పరమేశ్వరి ఈ సృష్టిని చేయాలి కంప్లీట్ గా మొత్తం సృష్టి చేయాలి ఆ పరమేశ్వరి సాక్షాత్తు ఆ జగన్మాత మరి ఇక్కడికి రావాలి వచ్చి సృష్టి అంతటా ఆవిడే మొత్తం మొత్త ప్రకృతి అంతా కూడా ఆవిడే ఆవిడే నిండిపోయింది. అందుకే ప్రతి పండగకు కూడా ఒక విశిష్టత ఉంటుంది దాని వెనకాల ఒక కథ చెప్పబడుతుంది. ఆ కథని మనం అంతరార్థ సహితంగా తీసుకుంటే ధ్యానపరంగా ఆధ్యాత్మిక పరంగా తీసుకోవాలి అంతే లేకపోతే స్టోరీస్ కి మీనింగ్ ఉండదు.","బాహ్యంగా తెలుసుకుంటాం స్టోరీస్ మీనింగ్ బాహ్యంగా తెలుసుకుంటే దానిలో ఆఆ చెప్పబడినటువంటి ఆధ్యాత్మిక జ్ఞానం గాని ఆధ్యాత్మిక రహస్యాలు మనకు తెలియవు. ఇప్పుడు ఈ పండుగలో కూడా ఆమె దేవతా మూర్తిని తయారు చేసి ఈని కూడా నిమజ్జనం చేస్తారు. ఆ సంప్రదాయాలు కూడా ఉన్నాయి. మొన్నే మనం పోయిన మాసంలో గణేష్ ఉత్సవాలు చేసుకున్నాము గణేష్ నిమర్జనం కూడా చేసేసుకున్నాం. దీనికి కూడా ఒక అంతరార్థం ఉంది. సృష్టి స్థితి లయ లయ కావాలి ఏదైనా సరే లయం కావాలి. డిజాల్వ్ కావాలి ఏది సృష్టింపబడుతుందో ఆ సృష్టి మళ్లా కూడా దాన్ని లయం చేసేసుకుంటుంది. లయం కావాలి.","మనం కూడా అంతే వచ్చాము గుండాలానికి వచ్చాము మనం కూడా లయం అయిపోతాం. మనం కూడా ఏది సృష్టిలో వచ్చిందో అది కూడా మళ్లా లయం అయిపోవాలి. ఎప్పుడో ఒకసారి శివాలయంలో నేను అన్ని గమనిస్తూంటాను వెళ్ళినప్పుడు దేవాలయాలకి వెళ్ళినప్పుడు ధ్యానం చేస్తుంటాను అక్కడ ఉండే ఆర్కిటెక్చర్ ని శిల్పాల్ని వాటి అంతరార్థాన్ని తెలుసుకోవడానికి ప్రయత్నం చేస్తుంటాం అక్కడ ఉండే శక్తి ఎలాంటిది అనేది ధ్యానంలోకి వచ్చినప్పుడు మనం కొంత అనుభవపూర్వకంగా తెలుసుకుంటూఉంటాం.","అప్పుడు ఒకటి గమనించాను ఒక అసురుని గురించి వాడు పెట్టారఅన్నమాట ఆ దేవాలయంలో ఆ అసురుడి యొక్క పేరు ఏదో ఉంది కానీ ఆ అసురుడి యొక్క గుణం ఏంటంటే ఏది కనిపిస్తే అది తినేస్తుంటాడు అన్నిటిని తినేస్తుంటాడు ఏది కనిపిస్తే దాన్ని భక్షిస్తాడు తినేస్తూ ఉంటాడు ఆకలి ఆకలితో తినేస్తూఉంటాడు.","ఒకసారి ఏమి దొరక్క తను తాను తినడం స్టార్ట్ చేశడంట కాళ్ళు అయిపోయినాయి చేతులు అయిపోయింది మండం అయిపోయింది మెడ వరకు వచ్చేసాడంట తను తాను తినేయడం స్టార్ట్ చేసేసాడు ఇంకా ఒట్టి తల మాత్రం మిగిలింది అది ఒక్కటే మిగిలింది అది కూడా తింటే ఇంకా ఉండడు కానీ అప్పుడు ఎరుక కలిగింది ఓకే ఇది తింటే నేను అయిపోయాను ఇంకా అయిపోతుంది. నేను ఇంకా డిజల్వ్ అయిపోతున్నాను నేను ఉండను ఇంకా సో ఆత్మ ఆధ్యాత్మిక ఈ శాస్త్రము జ్ఞానము ఈ ధ్యాన మార్గము అంతా కూడా మనల్ని మనం ఖతం చేసేసుకోవడమే మనం సృష్టిలో వచ్చాము మళ్లా ఖతం కావాలి మళ్లా నిమజ్జనం మళ్లా విత్డ్రా అయిపోతుంటాం.","మనం మోక్షం వెళ్లే కొద్ది అక్కడ డిజల్వ్ అయిపోతుంటాం అంటే ఇక్కడ ఉండే అహం ఉంటుంది. అహం ఎక్కడ ఉంటుంది అందరికీ అహంకారం అనేది ఎక్కడ ఉంటుంది ఈ అహమే నేను నేను నేను ఇక్కడ ఉన్నాను నేను నా పేరు నా ఊరు ఇది నాది ఇన్నీ చెప్పేదే అహం ఈ అహం ఎక్కడ ఉంటుంది మన పొట్టలో ఉంటుంది. అందుకే రాముడు బాణం తల మీద ఎన్నిసార్లు వేసి తలలు తేగలగొట్టినా కూడా ఆయన చావలేదు రాముడు సంహారం కాలేదు పొట్ట మీద కొట్టాడు పొట్టలో బాణం వేసి కొట్టాడు మణిపూర్ చక్రంలో ఉంటుంది. అదే విల్ అన్నమాట ఇది చాలా ఇంపార్టెంట్ సెంటర్ కదా దీన్నే హరా సెంటర్ అని కూడా అంటారు.","దీన్ని కతం చేయడం అన్నమాట అహాన్ని ఖతం చేయడం ఆధ్యాత్మికత దీన్ని ఫినిష్ చేయడం దీన్ని సంహరించడం అంటే మన అహం కంప్లీట్ గా డిజల్వ్ చేయడం లేకపోతే ఆ నేను నాదే మనల్ని చాలా ప్రివెంట్ చేసేస్తుంది. ఆధ్యాత్మికంగా మనం వెళ్ళడానికి ధ్యానంలో మనం ప్రోగ్రెస్ కావడానికి ఒకటే ఒకటి ఆ పరిమితమైన నేను నేను అనే మన డెఫినిషన్ నిర్వచనము చాలా చిన్నది చాలా పరిమితుల్లో ఉంటుంది."],"minutes":8,"words":1205},{"title":"హర కేంద్రం · నిమజ్జనం","paras":["మన సత్యం ఏంటంటే మనం అపరమితమైనటువంటి నేను అంతటా నిండినటువంటి మనం మనమంతా కూడా అంతటా నిండి ఉన్నాం అది తెలుసుకోవడానికి ఈ హరాకి అనేది కావాలన్నమాట హరాకి అంటే ఈ హరా సెంటర్ లో ఉన్నటువంటి ఈ మనం విల్ అనేది ఉంటుందన్నమాట విల్ అంటే మన ఓన్ సంకల్పం ఉంటుంది. మన ఇండివిడ్యువల్ గా నేను ఇది చేయాలి నేను అది చేయాలి ఇది అది నేను ఇది అట్లాంటివన్నీ ఉంటాయి.","సో హరాకి మనల్ని మనం ఫినిష్ చేసుకోవడము అదే నిమజ్జనం అందుకే పండుగల్లో ఒక స్ట్రక్చర్ ఉంటుంది మన పద్ధతులన్నీ గమనిస్తూ ఉండాల పూర్వీకులు మన యోగులు ఋషులు ఈ పెట్టినటువంటి ఇ ఆచారాలు సంప్రదాయాలు వెనకాల ఎంతో సూక్ష్మాలు ఉన్నాయి యోగ రహస్యాలు చెప్పబడ్డాయి. చాలా చక్కని జ్ఞానం పొందుపరచబడింది. సో ఈ నవరాత్రులు ఎందుకు నవరాత్రులే అని చెప్పబడింది పొద్దున పూట చేయకూడదా దేవీ నవరాత్రులు ఎందుకు రాత్రులు అంటారు దీనికి కూడా అంతరార్థం ఉంది. ఇప్పుడు తెలంగాణలో బతుకమ్మ పండుగ అంటాం.","బతుకమ్మ అంటే ఏంటి బతకడం లైఫ్ [గురకలు] లైఫ్ ని ఈ లైఫ్ సెలబ్రేట్ చేసుకోవడం దీనికి కూడా అంతరార్థం ఉంటుంది ప్రతి ఒక్కటి మనం అంతరార్థాలని తెలుసుకుంటూ ఉండాలి. ఒక పదం పుట్టింది అంటే ఒక వర్డ్ అనేది వ్యక్తపరచబడింది సృష్టింపబడింది అంటే దాని వెనకాల ఒక మర్మం ఉంటుంది. ఒక అర్థం ఉంటుంది ఇది పట్టుకోవాలి అది దాన్ని పట్టుకోవాలి మనం బతుకమ్మ పండగ ఈ నవరాత్రులు ఎంతో నవదుర్గల్ని పూజలు చేస్తుంటారు లేకపోతే రోజుకఒక అలంకారం చేస్తారు రోజుకొక చక్కని కలర్స్ తోను పుష్పాలు కలర్ డిఫరెంట్ కలర్స్ తో ఎవ్రీడే తర్వాత లాస్ట్ డే లయం చేసేస్తాం ఈ మధ్య ఇది స్ట్రక్చర్ అన్నమాట.","పండగల్లో ప్రతి ఒక్కటి ఒక స్ట్రక్చర్ ఉంటుంది అంటే ఒక ఆ ఒక బ్రాడ్ అవుట్లైన్ ఉంటుంది. ఎందుకంటే అది మన ఈ సృష్టి స్థితి లయ దీనికి కరెక్ట్ గా మ్యాచ్ అవే విధమైనటువంటి స్ట్రక్చర్ ఇది ఇదే విధంగా ఏదైతే బ్రహ్మాండంలో ఉందో అదే ఈ పిండాండంలో కూడా ఉంది. ఏదైతే అంతటా జరుగుతుందో అది ఇక్కడ కూడా జరుగుతుంది మనలో కూడా జరుగుతుంది. సూక్ష్మంగా కూడా జరుగుతుంది కారణ జగత్తులో జరుగుతుంది మహాకారణ జగత్తులో కూడా జరుగుతుంది. ఇస్తుల జగత్తులో కూడా అదే జరుగుతుంది. యస్ అబవ్ సో బిలో ఏదైతే ఆ పైన ఉద్ధలోకాల్లో జరిగిందో అది ఇక్కడ జరుగుతుంది.","సో ఈ నవరాత్రులు రాత్రి అంటేనే మామూలుగా అందరూ కూడా ఒక తమోగుణానికి ప్రతీకగా మనం చెప్పుకుంటాం. కానీ యోగులకి అది డిఫరెంట్ ధ్యానులకి యోగేశ్వరులకి ఇది డిఫరెంట్ యోగేశ్వరులకి రాత్రి అంటేనే సాధన సాధనకి [గొంతు సవరించుకోవడం] టైం దొరికినట్టు అన్నమాట ఏమంటే అత్యంత పవిత్రమైనటువంటి సమయం ఎవ్వరు డిస్టర్బ్ చేయరు హాయిగా ధ్యానం చేసుకుంటాం అందరూ పడుకుంటారు మనం మూడు గంటలకు నిద్ర లేచేసి సాధన చేసుకోవడానికి సాధకులకి టైం అంటే రాత్రి సమయం అంట రాత్రి సమయం మనం చేసుకుంటాం.","ఉదయం సమయం మనం చక్కగా పని చేస్తుంటాం మన జాబు మన లోకాల లోకానికి సంబంధించిన విషయాలన్నీ కూడా మనం చేసుకుంటూ ఉంటాం కానీ రాత్రి మాత్రం మన సాధన ఈ దేవీ నవరాత్రులు ఈ దేవీ శక్తి ఏ పరమేశ్వరి అయితే అన్నిటికీ మూలంగా ఉండు ఈ సృష్టికి ఈ ప్రకృతి ఏదైతే మనం చూస్తున్నామో ఏదైతే సృష్టింపబడిందో వాటికి ఆధారంగా ఉన్నది ఈ శక్తియే ఆ శక్తినే ఈ పరమేశ్వరి యొక్క శక్తినే మనం దుర్గామాతగా కొలుస్తుంటాం. ఆ శక్తియే లలితామాత. ఆ శక్తియే జగన్మాత. ఎన్నో పేర్లతో పిలవబడుతుంది ఆవిడ.","ఎన్నో పేర్లు ఇప్పుడు ప్రతి గ్రామంలో ఒక గ్రామ దేవత ఉంటుంది ఆమె కూడా పరమేశ్వరినే ప్రతి గ్రామ దేవత కూడా ఆ దేవతా శక్తియే ఆ ఒకే ఒక్క శక్తి ఎన్నో పేర్లతో పిలవబడుతుంది.","మనం కన్ఫ్యూజ్ అయిపోతాం ఓ ఎన్ని శక్తులు ఎన్ని పేర్లు ఉన్నాయి ఏంటి ఎందుకంటే ఒకటే దాన్ని ఎన్నో రూపాల్లో అందరూ కూడా చూస్తుంటారు వివిధ ప్రాంతాల్లో వివిధ పేర్లు పెట్టబడ్డాయి అంతే మూలాన్ని పట్టుకోవాలి మనం సూత్రాన్ని పట్టుకోవాలి ఈ దేవీ నవరాత్రుల్లో దేవి శ్రీదేవి నవరాత్రులు అంటాం శ్రీదేవి సో ఈ శ్రీదేవి అంటే శ్రీ అంటేనే ప్రకృతి ప్రకాశించున్నది దేవి అంటేనే ప్రకాశించునది ఈ ప్రకృతి అంతా కూడా ఈ శక్తి ప్రకాశంతో ఉన్నదంట ప్రకాశిస్తుంది కానీ మనం గుర్తించలేము చూడలేము ఎందుకంటే ప్రకృతి మన కళ్ళకి కళ్ళ వాళ్ళని కనువింపుగా కనిపిస్తూ ఉంటది అంతా ప్రతి సౌందర్యంలో మైమర్చిపోతుంటాం తన్మయం చెందుతుంటాం.","కానీ దాని వెనకాల ఒక శక్తి ఉంది ఈ సృష్టి అంతా కూడా ఈ భూమండలం ఎన్నో మండలాలు సృష్టి చేయబడ్డాయి సృష్టి అంతా చరాచర సృష్టి అంతా కూడా ఈ దేవతా శక్తియే సృష్టి చేస్తుంది. శక్తి లేకపోతే సృష్టి లేదు.","ఈ శక్తి ఆధారంగానే ఈ సృష్టి అంతా జరిగింది ఈ ప్రకృతి అంతా వచ్చింది ఈ బతుకంతా మనం జీవించే ఈ బతుకంతా ఆవిడే ఆవిడే ఉంది ఆ దేవతా శక్తియే ఆ జగన్మాతయే ఆ దుర్గామాతయే వేరు వేరు పేర్లతో పిలుచుకుంటున్నాం అంతే ఇప్పుడు దుర్గామాత ఆ పేరుకి అంతరార్థం తెలుసుకోవాలి అంతే దుర్గము అంటే దుర్గా అంటే కష్టము ఏ దేవతా శక్తి అయితే కష్టాల నుంచి మనల్ని దాటవేస్తుందో ఏ శక్తి అయితే మనల్ని అన్నిటిని అధిగమించగలిగే ఆ యొక్క శక్తి సామర్థ్యాలని కలిగిస్తుందో ఆవిడే దుర్గామాత దుర్గాదేవి దుర్గము అంటే దుర్భేద్యమైనటువంటి","కష్ట సాధ్యమైనటువంటిది అందుకే ఇక్కడ భూమండలంలో చాలా మనకి కష్టాలు వస్తుంటాయి కష్టాలు లేని వాళ్ళు ఎవ్వరూ ఉండరు అందరికీ వస్తాయి శ్రీరామచంద్ర ప్రభువులకి సీతామాతకి ఫుల్ కష్టాలు కష్టాలు లేకుండా మానవ శరీరం ధరించాము అంటే ఆ పైన నుంచి వచ్చాం ఓద లోకాల నుంచి వచ్చాం ఇక్కడికి వస్తే కష్టాలు ఉంటాయి.","కష్టాలు లేకుండా ఉండడం కాదు మన శక్తిని పెంచుకుంటే ఆ దుర్భేద్యమైనటువంటి ఎలాంటి కష్టమైన దుర్గాలు అంటే ఎన్నో కష్టాలు వాటిని దాటగలే శక్తి మనం పొందుతాం.","అందుకే దుర్గాదేవి దుర్గాదేవి ఆ దుర్గామాత అంటేనే శక్తి నవదుర్గులుగా మనం మన ఆంధ్రప్రదేశ్లో మనం సాధనలు చేస్తుంటారు దుర్గామాత ప్రతిరోజు అలంకారాలు చేసి మనం ఎందుకంటే ఇవన్నీ కూడా ఆ శక్తి రూపాన్ని మనం వేరువేరుగా సగుణంగా చూడడానికి ట్రై చేస్తున్నాం కానీ ధ్యాన సాధకులకి ఏంటంటే మనం అంతరార్థం పట్టుకుంటున్నాం కాబట్టి అంతరార్థాన్ని తెలుసుకుంటున్నాం కాబట్టి అది శక్తి అని తెలుసు శక్తి విహీనులుగా ఉంటే మన కష్టాలు అలానే ఉంటాయి. మన శక్తి లేకపోతే ఎన్నో కష్టాలు ఉంటాయి కానీ కష్టాలు ఎప్పుడూ తీరవు అన్నమాట.","అవి ఎప్పుడూ అలానే ఉంటాయి మీరు మీ శక్తిని పెంచుకోండి ధ్యాన సాధన చేసి చక్కగా ఎలాంటి కష్టమైనా కూడా ఎదుర్కునే శక్తి ఉంటుంది కదా ఆ శక్తితో మీరు ఎదుర్కుంటారు. ఎలాంటివి వచ్చినా కూడా చాలామంది నేను ఇది చేయాలి అది చేయాలి అంటారు వాళ్ళకి ఊరికే డ్రీమర్స్ డ్రీమ్ చేస్తూంటారు కానీ వాళ్ళ శక్తిని సంపాదించరు ధ్యానం చేయరు.","ఊరికే ప్లాన్లు వేస్తుంటారు ఐడియాస్ అయితే ఉంటాయి కానీ ఐడియాస్ ని మనం మరి ఇక్కడ మేనిఫెస్ట్ చేసుకోవాలి అంటే దానికి కావలసిన శక్తి కావాలి శక్తి లేకపోతే ఏమి చేయలేం ఎక్కడ వేసిన గొంగలి అక్కడే ఉంటాం అందుకే ఈ దేవీ నవరాత్రులలో ఈ తొమ్మిది రోజులు కూడా మన తల్లి గర్భంలో నవ మాసాలు మన తల్లి గర్భంలో మనం ఉన్నట్టుగా అలానే ఈ తొమ్మిది రోజులు కూడా సంకేత రూపంలో పెట్టారు నైన్ ఈ నైన్ నెంబర్ అనేది సంకేతం నవావరణలు అని కూడా చెప్పబడింది నవావరణలు అంటే మనకి మన శరీరంలో ఉన్నటువంటి తొమ్మిది ఈ అంకకి చాలా ప్రాముఖ్యత ఉంది.","నవరంద్రాలు ఈ నవరంద్రాలు కూడా మనల్ని ఎప్పుడూ డిస్ట్రాక్ట్ చేస్తుంటాయంట నవరంద్రాల తోలు తిత్తి అంటాం కదా ఈ శరీరాన్ని ఇక్కడ ఇరుక్కుపోయాం దీనిలో మన నాహం ఏం చేస్తుందంటే నేను శరీరాన్ని అనే భావనని ఎక్కువ కలిగించేస్తుంది దీంతో ఐడెంటిఫై అయిపోయిఉంటాం కానీ దీనికి ఆధారమైనటువంటి ఏ శక్తి నడిపిస్తుందో దాన్ని తెలుసుకోవాలి ధ్యానం ద్వారానే సాధ్యంవుతుంది.","అందుకే నవమాసాలలాగా ఈ నవరాత్రులు ఎవరైతే బాగా సాధన చేస్తారో మేమ మామూలుగా చేసిన సాధనకి దీనికి ఏంటి ఆ డిఫరెన్స్ అంటే ఈ పర్టికులర్ రోజుల్లో చేసిన సాధన 100 రెట్లు 1000 రెట్లు ఎక్కువ ఉంటుందంట అంటే ఈ ఒక్క రోజు చేసే ఈ తొమ్మిది రోజులు చేశారు మామూలుగా మీరు 100 రోజులు చేస్తే వచ్చే ఫలితం 1000 రోజులు చేస్తే వచ్చే ఫలితం ఇప్పుడు వస్తుంది ఇంటూ 100 ఆర్ 1000 మన క్వాలిటీ బట్టి అందుకే ఈ ప్రాముఖ్యత మళ్లా మన ఇంకో విధంగా కూడా తీసుకోవచ్చు ఆవిడ శ్రీ చక్రంలో శ్రీ చక్ర నివాసిని ఆ పరమేశ్వరి ఆ శ్రీ చక్రం ఇక్కడే ఉంది.","ఆ శ్రీ చక్రం ఇదే శ్రీ చక్రం ఇక్కడ నివసిస్తుందంట ఆ పరమేశ్వరి సో ఆ శ్రీ చక్రానికి సంబంధించినటువంటి నవావరణలు అని ఉంటాయి. ఈ తొమ్మిది రోజుల్లో వాటిని కూడా దాడుతారు అందరూ కూడా సాధన చేస్తే ఈ నవావరణలలో త్రైలోక్య మోహన చక్రము అని చెప్పబడింది ఇవన్నీ కూడా పేర్లు సాంస్క్రిట్ నేమ్స్ అంటే మూడు లోకాలని మోహింప చేసేది ఆవిడే శ్రీ చక్ర నివాసిని ఆవిడే శ్రీమాత శ్రీ మహారాగ్ని శ్రీమత్ సింహాసనేశ్వరి ఆ లలితమాతియే ఆ దుర్గామాత ఆ జగన్మాత త్రైలోక్య మోహన చక్రం సర్వాసా పరిపూరక చక్రం అంటే మనంఅన్న అన్ని కోరికలు ఉంటాయి ఆశాపూర్వక ఆశలు ఉంటాయి ఎన్నో కోరికలు ఉంటాయి.","వీటిని అన్ని కోరికల్ని నెరవేర్చేదంట అంటే మనం ఏది డ్రీమ్ చేస్తామో దాన్ని ఫుల్ఫిల్ చేసుకోవాలంటే ఈ శక్తి కావాలి భక్తి ఇది సర్వాసాపూర్క చక్రం ద్వారా జరుగుతుంది సర్వ సంక్షోభణ చక్రము సమస్తాన్ని కదిలించేది సర్వ సౌభాగ్యదాయక చక్రము సౌభాగ్యాన్ని ప్రసాదించేది సర్వాత్పాదక చక్రము అన్ని ప్రయోజనాలని సాధించేది సర్వ రక్షాకర చక్రము సమస్త రక్షణను అందించేది ఈ శక్తియే అన్ని రక్షణను అందించేది సర్వ రోగహర చక్రము మన అన్ని రోగాలని తగ్గించేది తొలగించేది కూడా ఈ శక్తియే సర్వ సిద్ధి ప్రద చక్రము అన్ని"],"minutes":8,"words":1102},{"title":"నవావరణలు · త్రిగుణాలు","paras":["సిద్ధుల్ని ప్రసాదించేది సర్వానందమయ చక్రము పరమానందాన్ని కలిగించేది ఈ నవావరణలు ఇవి కూడా నవ తొమ్మిది నవమాసాలు తొమ్మిది నవరాత్రులు ఇవి కూడా తొమ్మిది సో ఈ దేవీ నవరాత్రులు ఇంకొక విధంగా తీసుకుంటే కూడా ఈ సృష్టి అంతా కూడా త్రిగుణాలతో ఉంది.","ఏది సృష్టి చేయబడిందో మూడు గుణాలతోనే అన్ని కాంబినేషన్ పర్ముటేషన్స్ తో క్రియేట్ కాబడ్డాయి. ప్లస్ మనం మూడు అవస్థల్లో ఉంటాము జాగృతవస్థ స్వప్నావస్థ సుషుప్తవస్థల్లో సో ఈ కాంబినేషన్ పర్ముటేషన్స్ తో ఈ అవస్థలు ఈ త్రిగుణాలు కలిసి 3 * 3 అన్నమాట అంటే ఒక్కొక్క అవస్థ ఈ మూడు గుణాలు కలిగి ఉంటాయంట జాగృతావస్థలో మనం మనం తమోగుణంలో ఉండొచ్చు రజోగుణంలో ఉండొచ్చు సత్వగుణంలో కూడా ఉండొచ్చు.","మన స్థితి బట్టి తమోగుణం అంటే లోయెస్ట్ వైబ్రేషన్ రజోగుణం అంటే కొంచెం దానికంటే మధ్యమ స్థితి సత్వగుణం అంటే చాలా కొంచెం ఉత్తమమైనటువంటి స్థితి ఉత్తమోత్తమైన స్థితి ఏంటి దీన్ని మించాలి దీనికి దాటాలి ఈ త్రిగుణాల్ని దాటాలి ఈ త్రిగుణాలని దాటితేనే మన నిర్గుణ స్థితి లభిస్తుంది. మన అదే మన అసలైన ఆత్మ స్వరూపం ఏందంటే నిర్గుణము అక్కడ ఏ గుణము లేదు అదే పరబ్రహ్మ స్వరూపము అదే పరమేశ్వరి స్వరూపం అదే పరమా పరమేశ్వరుడి యొక్క స్వరూపం నిర్గుణము కానీ ఇక్కడ భూమిలో సృష్టిలో అంతా కూడా గుణంతో ఉంటాయి.","అందుకే ఈ నవరాత్రులు కూడా ఈ తమోగుణం రాత్రి అంటేనే తమోగుణానికి ప్రతీక ఇంకొక విషయం రాత్రి రాంగానే నిద్ర వచ్చేస్తుంది మనకి సోమరితనం వచ్చేస్తుంది. కానీ యోగులకి అది అత్యంత సాధకులకి ఇంపార్టెంట్ టైం అది సాధన చేసుకోవడానికి ఒక మూడు గంటలు చక్కగా హాయిగా ధ్యానం చేసుకోవచ్చు సో సాధకులకు ఈ తొమ్మిది రోజులు కూడా ఈ రాత్రి సమయం చాలా ఇంపార్టెంట్ సాధకులకు సాధన చేసుకుంటాం ఏం సాధన చేస్తాం ధ్యాన సాధనే చేస్తాం శ్వాస సాధనే చేస్తాం. మనం ఉచ్వాస నిశ్వాసాలను గమనించడం అనే సాధనే చేస్తాం. ఎందుకంటే శ్వాసయే ప్రాణశక్తిగా ఉంది ప్రాణంగా ఉంది.","ఈ శ్వాసయే ప్రాణం శ్వాస లేకపోతే ప్రాణం లేదు ప్రాణం పోతుందంట శ్వాస లేకపోతే ప్రాణం పోయింది. ఈ ప్రాణశక్తి ఒకానొక ఎక్స్ప్రెషన్ మనలో అంతర్గతంగా ఎన్నో వివిధ ఫంక్షన్స్ చేస్తూ ఆ శక్తియే నడిపిస్తుంది ఈ శరీరాన్నంతా కూడా ఏది ఆధారంగా సృష్టి నడుస్తుందో ఆ శక్తిని తెలుసుకోవాలి ఆ అనుభూతిని చెందాలి ఆ శక్తియే మనం అయిపోవాలి. ఆ దుర్గామాతయే మనం అయిపోతాం. ధ్యాన సాధన ద్వారా అందుకే తొమ్మిది రోజులు కూడా మనం రోజు చేద్దాం సాధన చేద్దాం. ఇప్పుడు ఛత్రపతి శివాజీ గురించి మనందరికీ తెలుసు వీరుడిగా మనం కొలుస్తాం. ఆయన్ని ఇప్పటికీ తలుచుకుంటూ ఉంటాం.","శివాజీ అంటేనే మన భారతదేశంలో బ్రిటిష్ వారిని తరిమికొట్టాడు ఆయన ఎలా తరిమికొట్టాడు దుర్గాదేవి స్ఫూర్తిని పొందాడు దుర్గాదేవి ద్వారా ఆ శక్తిని ఆయన వాళ్ళ గురువుగారు కూడా ఒక సాధకులు ఆత్మజ్ఞానం పొందినటువంటి మాస్టర్ ఆయన బ్రహ్మజ్ఞానం పొందినటువంటి మాస్టర్ సో ఆ దుర్గామా మాత గురించి ఆయనకు తెలుసు అందుకే ఎప్పుడు దుర్గా భవాని దీక్షలను చేస్తుంటారు. ఇవన్నీ కూడా డిఫరెంట్ ప్రాంతాల్లో భారతదేశంలో డిఫరెంట్ పేర్లతో మనం చెప్పుకుంటాం.","సో ఇది మనం ఈ అద్భుతమైనటువంటి ఈ రాత్రులు నవరాత్రులని వదలకూడదుఅన్నమాట ప్రతిరోజు మామూలు చేసే దానికంటే కొంచెం ఎక్స్ట్రా ఒక గంట ఎక్కువ స్పెండ్ చేసుకోవాలి ధ్యానానికి రాత్రిపూట నిద్ర ఒక గంట తగ్గించుకొని కూర్చుందాం ధ్యానం కూర్చుందాం ఉదయాన్నేమూడు గంటలకే లేచేద్దాం పొద్దున్నే లేచేసి ఆ చక్కని బ్రాహ్మి ముహూర్త సమయంలో హాయిగా ధ్యానం చేసుకుందాం. ఆ నిద్ర తగ్గించాల అదే తమో గుణాన్ని తగ్గించుకోవాలి.","రజోగుణం అంటే మనం ఎక్కువగా డైనమిక్ గా ఎక్కువ మూవ్ కాకుండా మనం ఎక్కువ సత్వగుణంలో ఉండాలి అందుకే మనం తినే ఆహారము అంతా కూడా ఈ సమయంలో ఒకే పూట భోజనము ఉపవాసాలు చేస్తారు మామూలుగా దీనికి కూడా ఒక ప్రత్యేకత ఉంది అంతరార్థం ఉంది అంటే బాగా తిన్నామ అనుకోండి అన్నం తినేసి నిద్ర వస్తుది తినాల్సిన ఆహారం ఇది కాదు ఆ శక్తిని విశ్వశక్తి ఆహారం అనేది తీసుకోవాలి అంటే ఇది ఏకభుక్తం లేకపోతే ద్విభుక్తం రెండు రెండు ఆహారాలు తినొచ్చు లేదా ఒక ఆహారం తినొచ్చు ఒక పూట ఓకే ఎంత తక్కువ తింటే లిమిటెడ్ లిమిటెడ్ ఆహారము మనం చక్కగా అన్లిమిటెడ్ శక్తిని తీసుకోగలుగుతాం.","ఆ కాస్మిక్ ఎనర్జీనే ఆహారంగా మనం స్వీకరించగలుగుతాం. ఆ శక్తిని ఆహారంగా తీసుకోవాలి. సోతీ అందుకే ఇవన్నీ కూడా భారతదేశంలో పెట్టబడిన ప్రతి పండగకి ఒక విశిష్టమైనటువంటి అంతరార్థం ఉంది. చాలా ప్రత్యేకత ఉంది. అందుకే భారతదేశం ఎప్పుడూ కూడా ఒక పుణ్యభూమి ఒక జ్ఞానభూమి కర్మభూమి ఒక యోగుల భూమి అని చెప్పబడింది. అందుకే మన భారతదేశంలో ప్రతి రోజు ఒక పండగ కింద మనం ఏదో ఒక మీనింగ్ మనం క్రియేట్ చేసుకున్నాం.","మన పూర్వీకులు మన యోగులు ఋషులు వారు ఇవన్నీ గుర్తించి ఇవన్నీ ఎనర్జీని అన్నీ కూడా అనుభూతిని చెంది వాళ్ళు పెట్టారున్నమాట ఈ దేవీ నవరాత్రులు పర్టికులర్గా ఈ మాసంలో మనం అక్టోబర్ మాసం ఏదైతే చేసుకుంటున్నామో శరత్ నవరాత్రులు అంటాం మళ్ళ వసంత దేవీ నవరాత్రులు కూడా ఉన్నాయి అది శ్రీరామనవమి అప్పుడు కూడా దేవీ నవరాత్రులు వస్తాయి దాని విశిష్టత వేరు దీని విశిష్టత వేరు ఇది మనల్ని పుష్టి సాధన అన్నమాట అంటే మనల్ని బాగా ఈ ఫిజికల్ ప్లేన్ లో ఈ శక్తి అంతా కూడ తీసుకున్నప్పుడు ఎలాంటి కష్టాలన్నీ కూడా మనం దాన్ని ఓవర్కమ్ చేయడానికి ఈ శక్తి ఉపయోగపడుతుంది.","ఈ శక్తియే మనల్ని అన్నిటిని దాటివేసే ఆ గొప్ప శక్తిని మనం పొందగలుగుతాం సాధనల ద్వారా నవరాత్రి పుష్టి సాధన చక్కగా మనం మన శరీరము మనసు బుద్ధి ఇవన్నీ కూడా మనం చక్కగా అలైన్మెంట్ లో అనుసంధానంలో ఉంటూ ఈ నవరాత్రుల సాధనలో మనం మూలాన్ని పట్టుకుంటాం.","మూలాలనే పట్టుకోవాలి ఇప్పుడు మూలం అన్నిటికీ మూలం శక్తి ఆ శక్తికి మూలం చైతన్యం ఒకదాని తర్వాత ఒకటి ఫస్ట్ పరమేశ్వరి అమ్మవారు అమ్మవారిని పట్టుకుంటే అయ్యవారు మనకి తెలుస్తారు అయ్యవారు తర్వాత అయ్యవారి దగ్గరికి మనల్ని తీసుకెళ్తుంది శక్తియే అయ్యవారు అంటేనే పరమేశ్వరుడు పరమేశ్వరియే అమ్మవారు ఫస్ట్ అమ్మే అమ్మే ఇంపార్టెంట్ మనకి అమ్మ దగ్గరికే వెళ్ళాలి మనం మనం ఈ తొమ్మిది రోజులు కూడా అమ్మ కడుపులో ఎలా ఉండి మనం పెరిగామో అలానే ఆ అమ్మ కడుపులో మనం ఉండబోతున్నాం చక్కగా ధ్యానంలో మనం శిశువుగా అంటే","తల్లి కడుపులో హాయిగా ధ్యానం చేసుకున్నాం అంట ఆ తొమ్మిది మాసాలు ఏ చింకు లేదు చీతా లేదు ఏమి లేదు హాయిగా ఏ చింతలు లేకుండా హాయిగా ధ్యానం చేసుకున్నప్పుడు మళ్లా ఆ స్థితికి వెళ్ళాలి మళ్ళ కొత్తగా మనం పుడతాం అన్నమాట ఆ 10వ రోజున మనం విజయ దశమి చేసుకోవాల విజయంతో మనం చక్కగా 10వ రోజున సెలబ్రేషన్ అది గ్రేట్ సెలబ్రేషన్ ఇదంతా సాధన దేవీ నవరాత్రుల సాధన ప్రతిరోజు కూడా చాలా అత్యద్భుతంగా మనం వైభవపేతంగా మనం సాధన చేసుకోవాలి మన అంతరంగా మనం ఎంతో అద్భుతంగా ఈ శక్తిని కూడు తీసుకోవాల కన్సర్వ్ చేసుకోవాల","తర్వాత మనం ఏది పొందాలో అన్ని పొందుతాం.","మన దగ్గరికి ఏం రావాలో అన్ని వస్తాయి. సో మై డియర్ ఫ్రెండ్స్ మరి ఈ ఆధ్యాత్మిక శాస్త్రంలో మూడు చెప్పుకుంటూ ఉంటాం మూడిటి గురించి ఎప్పుడు కూడా ఒకటి శక్తి రెండవది చైతన్యము మూడవది జ్ఞానము మన ఆత్మ యొక్క స్వరూపం ఏంటి ఆత్మ అంటే ఏంటి అంటే ఆత్మ అంటే శక్తి చైతన్యము జ్ఞానము అనే ఈ సకలాల యొక్క కలయక సముదాయమే ఆత్మ అని చెప్పబడింది. మరి శక్తి ఈ శక్తి తెలుసుకోవాలి ఇది నవరాత్రి సాధన అంటే శక్తి సాధన చక్కగా ఆ శక్తిని అనుభూతి చెందాలి ఊరికే మాట్లాడుకుంటే సరిపోదు. థిరీస్ థియరీ మనం సాధన చేస్తేనే ఆ అనుభూతి పొందుతాం.","ఆ అనుభవం పొందాల ఆ శక్తి ఏంటి ఆ దుర్గామాత అసలుకి ఏ శక్తి ఏ కుండల్ని మాత మనలో ఉందో ఆ కుండల్ని శక్తి ఆ పరమేశ్వరి అంతటా నిండి ఉన్న పరమేశ్వరి మనలో కూడా ఉందంట మూలధాతువునను మునిగి ఉండెడి శక్తి తేల చూడవలయు తెలివితోను బిందు రూపమైన బ్రహ్మంబు కనవలే విశ్వదాభిరామ వినురవేమా ఈమాన మానవ శరీరంలో వెన్నుపాములో వెన్నుపూసలో చివర మూలాధార చక్రంలో నిద్రాణమై నిద్రిస్తున్నటువంటి ఈ చైతన్య శక్తిని కుండల్ని శక్తిగా మనం చెప్పుకుంటాం ఇది ధ్యాన సాధన ద్వారానే సంపూర్ణమైనటువంటి జాగరూకతో అది జాగృతి అై తర్వాత దేవి దేవీ ప్రకాశమై చాలా ప్రకాశవంతమై వెలిగిపోతుంది.","అది సూక్ష్మమైన బిందు రూపంలో ఆ పర పరబ్రహ్మ తత్వం అనేది ఉంటుంది మనలో దీన్ని తెలుసుకోవాలి ఇదే నవరాత్రుల సాధన కాయమనడి దుర్గము కడులెస్సగా చూసి తేట బుద్ధి తోడ తెలియ తేలివలేవు లోననున్న హరిని గనగలేక తిరుగురు విశ్వదాభిరామ వినురవేమా ఈ కాయం అనేదే పెద్ద దుర్గం అంట ఎక్కడలే లేదు నిజమైన దుర్గం అంటే ఈ కాయమే అంటాం. ఎందుకంటే ఇక్కడ అన్నీ డిస్ట్రాక్షన్స్ే మొత్తం మనంతా కూడా ప్రతి ఒక్కటి కూడా మనల్ని మన యొక్క మెయిన్ పర్పస్ ని తెలుసుకోనేకుండా డిస్ట్రాక్ట్ చేస్తుంటాయి. మన పంచజ్ఞానేంద్రియాలు పంచకర్మేంద్రియాలు ఎప్పుడూ కూడా మనల్ని బాహ్యంలోకి తీసుకువెళ్తుంటాయి.","ఈ చెవులు పొగడ్తలకి ప్రశంసలకి అలవాటు అయిపోయిఉంటుంది ఎప్పుడు ఎక్కడ ప్రశంసలు కావాలి ఎవరు నన్ను పొగడుతారు అని వెతుక్కుంటూ ఉంటుంది ఈ కళ్ళు కూడా అంతే ఎప్పుడు ఇది చూడాలి అది చూడాలి వీళ్ళని చూడాలి వాళ్ళని చూడాలి ఎప్పుడు ఈ కళ్ళు రుచి కూడా ఈ నాలుక ఈ చర్మం కూడా ఎప్పుడు ఈ టచ్ కావాలి ఇది కావాలి అది కావాలి అందుకే కాయ యాన్ని శరీరాన్ని దుర్గం అని చెప్పారు ఇదే కష్టం అంట దీన్ని దాటాలి శరీరాన్ని లో ఉన్నటువంటి జ్ఞానేంద్రియాలతో మనం ఎప్పుడు ప్లెజర్స్ లో ఉంటామ అన్నమాట ఎప్పుడు ప్లెజర్ ప్లెజర్ సుఖం","సుఖం సుఖం ఎప్పుడు నిజమైన పరమానందాన్ని ఎప్పుడు పొందుతాం ఈ దుర్గం అనే ఈ కాయాన్ని మనం దాటాలి అదే వేమనాచార్యుల వారు ఇక్కడ చెప్తున్నారు కాయమనడి దుర్గము కడులెస్సగాచూ చూసి తేట బుద్ధితోడ తెలియవలయవు అది తెలుసుకోవాలి బుద్ధితో తెలుసుకోవాలి లోననున్న హరిని గనలేక తిరుగురు లోనే ఉన్నాడంట హరి ఆ హరి హరులు ఆ శివకేశవులు ఇద్దరు కూడా మన లోపలే ఉన్నారంట బాహ్యంలో తిరుగుతున్నాం అంతటా ఎక్కడున్నాడు దేవుడు ఎక్కడున్నాడు దేవుడు ఎక్కడున్నాడు అని తిరుగుతున్నాం ఆ పరమాత్మ తత్వం ఎక్కడ దొరుకుతుందో తెలియక"],"minutes":8,"words":1143},{"title":"సాధకుల రాత్రులు · బతుకమ్మ","paras":["తిరుగుతున్నాం వేస్ట్ చేసుకున్నాం టైం సో ఈ నవరాత్రులు అనేవి మనకి చాలా ముఖ్యమైనటువంటి ఆ సాధకులుగా మనం ఇష్టమై మనకి ముఖ్యమైనటువంటి రోజులు సాధన చేసుకోవడానికి సాధన చేయాలి ఎంత చేసుకుంటే అంత తక్కువ చేస్తే తక్కువ ఎంత ఎక్కువ చేసుకుంటే అంత ఈ తొమ్మిది రోజులు బాగా సాధన చేసుకోవాలి.","ఏదైతే దుర్గమంగా ఏంకా అబ్స్టకల్స్ అన్ని ఉన్నాయో వాటినన్నీ ఓవర్కమ్ చేసుకోవడానికి అప్పుడే మన ఈ బతుకమ్మ పండగ అనేది మనం నిజంగా ఒక డాన్స్ నిజంగా చేస్తాం అన్నమాట నిజంగా ఉత్సవం అనేది వస్తుంది మనలో ఆనందం పొంగిపోతుంది ఈ శక్తి లేకపోతే ఆనందం లేదు శక్తిని సంపాదించాలి శక్తి దేహం సాధన ఆ విశ్వశక్తి అంతా మనని నింపేస్తుంది. అప్పుడు ఎప్పుడూ మనం ఆనందంతో ఉంటాం ఓ డాన్స్ చేయగలం పాట పాడగలం ఏదైనా చేయగలుగుతాం ఏది చేస్తే అది అయిపోతుంది పని అయిపోతుంది ఎందుకంటే ఆ శక్తి చేస్తుంది.","సో మిమ్మల్ని మీరు క్వశ్చన్ చేసుకోండి ఈ దేవీ నవరాత్రిలో ఒక మూడు గోల్స్ రాసుకోండి ఎందుకంటే తొమ్మిది రోజులు సాధన చేస్తున్నాం విజయదశమి 10వ రోజున మీరు ఆ దుర్గమమైనటువంటివి కొన్ని ఏదైతే అబ్స్టకల్స్ ఉన్నాయో వాటిని ఓవర్కమ్ చేయడానికి ఇది సాధన పెట్టుకుందమ్మ మనల్ని మనం గోల్స్ పెట్టుకోవాల ఏవి మిమ్మల్ని ఇబ్బంది పెడుతున్నాయి మీ జీవితంలో ఆ ఇబ్బందిని దాటాలి కదా ఈ శక్తిని సంపాదిద్దాం ఈ మాతే ఈ అమ్మవారే మనలో ఉన్న కుండల్ని శక్తిగా ఉన్న ఈ అమ్మవారే సాల్వ్ చేస్తుంది మొత్తం మన శక్తిని పొందాలి అంతే","సింపుల్ మన శ్వాస మీద ధ్యాస అంతే టెక్నిక్ సేమ్ మనం చేయాల్సిన ధ్యాన పద్ధతి ఇదే శ్వాసని గమనిస్తూ ఏమంటే ఈ శ్వాసే సూక్ష్మమైన సూక్ష్మై ఆ శ్వాస చిన్నదై చిన్నదై చిన్నదై మరి ఆ సుషున్న నాడిని యాక్టివేట్ చేసి మన కుండల్ని శక్తిని మనకి పరిచయం చేస్తుంది.","ఎక్కడెక్కడో బ్లాక్స్ ఉంటాయి మనకి బ్లాక్స్ అన్ని క్రియేట్ చేసుకుంటుంది. మన జీవితంలో ఏ బ్లాక్స్ ఉన్నాయో ఏ అంతరాయాలు వస్తున్నాయో ఏవి ఎక్కడ ఎక్కడ స్టక్ అయిపోయామో ఈ యొక్క తొమ్మిది రోజులు ఈ శక్తి సాధన ద్వారా ఈ ధ్యాన సాధన ద్వారా మనం దీన్ని ఓవర్కమ్ చేద్దాం ఒక మూడు గోల్స్ రాయండి మీరు ఎంతో కాలంగా ఏదో అనుకుంటున్నారు నేను ఇది సాధిద్దాము ఇది సాధిద్దాము ఇది సాధ్యమే అని తెలుసు కానీ ఎలా చేయాలో తెలియదు.","అంటే గోల్స్ అనేవి పెట్టుకుంటాం ఇది చేయాలి నేను నాకు ప్రమోషన్ రావాలి లేకపోతే నా ఉద్యోగంలో ఇంకా నెక్స్ట్ స్టేట్ కి వెళ్ళాలి లేకపోతే ఎప్పటినుంచో కొన్ని ఇబ్బందులు ఉన్నాయి ఆర్థిక ఇబ్బందులు ఉన్నాయి దానినుంచి కూడా బయట పడితే మీరు ఫ్రీ అయిపోతారు. కొంత స్వేచ్ఛ వస్తుంది మీరు సాధన చేసుకోవడానికి ఇంకా బాగుంటుంది. లేకపోతే మీ రిలేషన్షిప్ ప్రాబ్లమ్స్ ఉన్నాయి. రిలేషన్ ఎప్పుడు ఏదో ఒకటి మిమ్మల్ని బాధిస్తున్నాయి. అక్కడ స్టక్ అయిపోయారు మీ ఎనర్జీ అంతా వేస్ట్ అవుతుంది. సో ఇది కూడా పెట్టుకోండి గోల్ని ఈ శక్తి ద్వారా అది క్లియర్ చేస్తుంది.","మీలో ఒక మార్పుని తీసుకొస్తుంది మీరు చూసే కోణం మారిపోతుంది. ఇవన్నీ మారే కొద్ది మొత్తం ఏదైతే అబ్స్టకల్స్ ఉన్నాయో ఒక్కటే వెళ్ళిపోతాయి మీ హెల్త్ ప్రాబ్లం ఉంది హెల్త్ ప్రాబ్లం పెట్టుకోండి గోల్ దట్ ఈస్ యువర్ గోల్ ఈ తొమ్మిది రోజుల్లో క్లియర్ అవుతాయి. ఎందుకంటే అంత ఎనర్జీ ఉంటుంది భూమండలం మీద అంత శక్తి ఉంది. ఆ దేవతా శక్తి పరమేశ్వరి ఆ దేవతా శక్తి ఎవరు ధ్యానం చేస్తారో ఆమె దృష్టి వాళ్ళ మీద పడుతుందంట ఆ దుర్గామాత వాళ్ళ వైపు దృష్టి సాధించివస్తుంది అబ్బా బాగా ధ్యాన సాధన చేస్తున్నారు.","ప్రసన్నం అవుతుంది ఆవిడ ఆ పరమేశ్వరి నిర్గుణంగా అంతటా ఉంది శక్తి రూపంలో మనం ధ్యాన సాధన చేస్తే మన వైపు దృష్టి సాధిస్తుంది. ఎన్నో క్లియర్ అవుతుంది ఆ శక్తి మనలో కూడా ఉంది.","ఆ శక్తి ఆ పరమేశ్వరు శక్తి అన్ని క్లియర్ చేస్తుంది మీకు దట్స్ వండర్ఫుల్ ఫ్రెండ్స్ రియలీ వండర్ఫుల్ మరి దీంతో ప్రతిరోజు కూడా మనం ఈ ఈరోజుతో ప్రారంభం చేశము రోజు మనం కొంత జ్ఞానాన్ని తెలుసుకొని ఆ మోర్ సాధనలోకి వెళ్ళడం అనేది ఇంపార్టెంట్ ఎన్నో చక్కని కథలు ఉన్నాయి మరి రేపు మహిషాశుర మర్ధిని గురించి మనం చెప్పుకుందాం కథ దాన్ని డీకోడ్ చేసుకోవాలి అంతరార్థాలు చాలా ఉంటాయి ఒక్కొక్క కథలో అద్భుతమైనటువంటి అంతరార్థాలు ఉన్నాయి యోగార్థం ఉంది ఆధ్యాత్మిక జ్ఞానం పొందపరచబడింది.","ఇప్పుడు యాక్చువల్ గా ఒక హారిక మేడం ని రిక్వెస్ట్ చేస్తున్నాను మహిషాశు మతిని గురించి మీరు ఆ స్తుతిని ఆ స్తోత్రాన్ని పాడగలిగితే అద్భుతంగా ఉంటుంది ఎందుకంటే మీ అందరికీ కూడా అది హోమ వర్క్ రేపు మీరు కూడా దాన్ని డీకోడ్ చేయండి. మహిషాశ్రీ మద్యని మీరు కూడా విని ఎందుకంటే దానిలో ఎంతో జ్ఞానం ఉంది. దాన్ని ఒక స్తోత్రంగా స్తుతిగా మీరు తీసుకుంటే ఏమి మనకేం తెలియదు దానిలో అంత యోగ రహస్యాలు దానిలో పెట్టబడ్డాయి ఇంత అద్భుతమైనటువంటి జ్ఞానం పొందుపరచబడింది.","సో ఆదిశంకరాచార్యులు రచించినటువంటి మరి ఈ మహిషాశుర మర్ధిని అనే ఈ స్తోత్రము హారిక మేడంని పాడవలసిందిగా కోరుతున్నాను. అందరూ విందాము ఈరోజు అది విందాము మీరు మీ హోం వర్క్ కూడా అంటే మీరు కూడా దాన ్ చేసింది ఏంటంటే సార్ ఒక మనిషి బాధపడటానికి వెనక కారణము నవ్వటానికి","వెనక కారణం ఏంటో అవి నాకు బాగా నోటీస్ అవుతున్నాయి సార్ దాని వెనక అంతరార్థం ఏంటో అవి నేను గమనిస్తలుగుతున్నాను సార్ ఇంకోటి సార్ ఎదుటి వ్యక్తితో ఎలా మాట్లాడాలి ఎలా మాట్లాడితే సంతోషంగా ఉండగలుగుతాడు అనవసరంగా ంగా వాళ్ళని బాధపడే మాటలు మాట్లాడకూడదు ఎలా మాట్లాడితే సంతోషపడతాడని ఈ రెండు నేను నోటిస్ చేయగలిగాను సార్ ఇంత ఇంత పరివర్తన వచ్చింది సార్ నాలో సార్ మీరు అంత పెద్ద పెద్ద చదువులు చదివి జీవితాన్నే త్యాగం చేశారు సార్ మీరు ఆ అమ్మాయి ధ్యానం కోసం ఆ కుదరట్లేదు సార్ చెవటానికి ఆ మాకు కూడా ఆ","విశ్వానికి సహాయం చేసి ఆ సహాయకారులుగా ఉండాలని నా కుటుంబం కూడా విశ్వానికి సహాయకారులుగా పని చేయాలని నేను రోజు కోరుకుంటున్నాను సార్ ఆ విశ్వానికి అలాంటి అదృష్టం కూడా మాకు కలగాలని రోజు హనుమంతుల వారిని కూడా కోరుకుంటున్నాను సార్ మా కుటుంబం మొత్తం సాధ్యమైనంత వరకు విశ్వ విశ్వానికి సహాయకారులుగా పని చేయాలని చెప్పి నేను ప్రతిక్షణం కోరుకుంటున్నాను సార్ నాకు నాకు ఇంతటి అదృష్టాన్ని ఇస్తున్నారు సార్ మీరు ప్రతిసారి థాంక్యూ సార్ థాంక్యూ సో మచ్ సార్ నా క్వశ్చన్లు కూడా పెద్దగా కొంచం కొంచం మనసు","స్థిమితించింది సార్ పెద్ద పెద్దగా క్వశ్చన్లు అయి అయి అడగాలి ఇి అడగాలి అనిపించేది సార్ ఇప్పుడు మనసు కూడా కాస్త స్థిమితించింది సార్ అయి అడగాలనే ఇది కూడా ఇప్పుడు ఉండట్లేదు సార్ థాంక్యూ సార్ థాంక్యూ సో మచ్ సార్ థాంక్యూ జ్యోతి మేడం స్వప్న జ్యోతి మేడం మీరు చెప్పిన ఈ పరివర్తన ఎంతమందిని ఇన్స్పైర్ చేస్తుంది అంటే స్ఫూర్తిని ఇస్తుంది అంటే వారు కూడా కచ్చితంగా మీపరి పరివర్తన వింటే మీరు చెప్పిన ఈ అనుభవం వింటే అంటే మీరు ఒక పదాన్ని ఉపయోగించారు బావిలో కప్పగా ఉన్నాను అని కాదు మీరు సముద్రంలో","తిమింగలంలా అయిపోయారు మేడం పెద్ద మహా సముద్రంలో తిమింగలం అయిపోయారు మీరు బావిలో కప్ప కాదు ఒక అద్భుతమైనటువంటి మాస్టర్ గా మీరు మేము చూస్తున్నాం మేడం మిమ్మల్ని ఎందుకంటే ఆ ఈరోజు ఆ సాక్షాత్తు దుర్గా మాతే మా ముందు ఉన్నట్టుగా భావన కలిగింది నాకు మీరు చెప్తుంటే మీ నుంచి వింటుంటే అద్భుతం మహా అద్భుతం ఇదే కావాల్సింది ఎంత అంతర పరివర్తన ఈ లోపల మనం అన్నీ కూడా ఒక్కొక్కటి ఒక్కొక్క ఆ ఛేదించుకొని ఆ అధిగమించి అన్ని స్థితుల్ని అధిగమించి ఎన్నో పరిమితుల స్థితి నుంచి ఆ అపరిమితమైనటువంటి స్థితికి","చేరుకోవడం మీరు లోకానికి నేను ఈ విశ్వానికి ఏమి చేయగలను అనే ప్రశ్న ఉదయించింది కదా మేడం ఇదే మీ యొక్క ఆత్మ పరిణామ స్థితి గురించి చెప్తుంది.","ఎవరు వాళ్ళు నేను విశ్వానికి ఏమి చేయగలనో అది చేస్తాను అని అనుకుంటారో అనుకున్నారు అంటేనే వాళ్ళు ఆ పుష్పము పద్మము ఆ రెక్కలన్నీ విచ్చుకున్నాయని వాళ్ళ యొక్క పరిమళం అందరికీ వెళ్ళాలని రెడీ అయిపోయినారు.","మీ కుటుంబం మీరు మీ కుటుంబం అంతా కూడా మీ అందరికీ కూడా ధన్యవాదాలు థాంక్యూ మేడం వండర్ఫుల్ వండర్ఫుల్ నెక్స్ట్ అలయ్య గారు నమస్కారం మాస్టర్ వినబడుతుంది మాట ఆ వినపడుతుందండి ఎలాయ గారు పత్రిస మళ్ళ మ్యూట్ అయిపోయింది మళ్ళ ఒక్కసారి అన్మ్యూట్ చేసుకోండి ఓకే ఇప్పుడు వస్తుందా ఆ ఇప్పుడు వచ్చింది నా [గొంతు సవరించుకోవడం] తల్లిదండ్రుల పాదాలకు నమస్కారం నా పత్రి సారు తర్ణమాలమ్మ పాదాలకు నమస్కారం నూటన్సార్ లక్ష్మి మేడం పాదాలకు నమస్కారం నా ముంగటు ఉన్న ఆత్మ బంధువులందరికీ నమస్కారం.","మాస్టర్ [గొంతు సవరించుకోవడం] అద్భుతమైన మాస్టర్లను తయారు చేసినావు ఇప్పుడు నాకు బలరు కాసినోడికి నేను సుగా అద్భుతం తయారైన మేడం ఇప్పుడు పాట వాడితే అల తొమ్మిది దేవతలను నేను చూసుకున్న మాస్టర్ ఎందుకంటే నాకు కనబడుతుంది అలా మేడము ఖాళీ ఆడ ఉత్తనే ఉన్నది కానీ మొత్తం దేవతలు కనబడుతుంది ఆ పాటల మొత్తం ఇట్లా భోజప వస్తున్నాయి మొత్తం లోపటి నుంచి అయితే మాస్టర్ ఇప్పుడు నిదుర ఎన్ని గంటలు అవసరం మీరు డాక్టర్ కాబట్టి నేను అడుగుతున్నా నిద్ర ఎన్ని మన ధ్యానులకు ఎన్ని గంటల నిద్ర అవసరం ఓకే ధ్యానులకి అసలు","ఆ ఒక మూడు గంటలు నాలుగు గంటలు సరిపోతుంది ఆరు గంటలు లేకపోతే ఒక్కొక్క శరీరం యొక్క నిర్మాణం బట్టి వాళ్ళ స్థితులను బట్టి వాళ్ళ యొక్క ఆ జీవితం బట్టి ఆధారంగా వాళ్లే నిర్ణయించుకోవచ్చు అన్నమాట ఇప్పుడు ఒక ధ్యాని సాధకులు ఉంటారు వాళ్ళకే తెలుస్తుంది మనం ఎక్కువ నిద్రపోయి పోయామా మనము మనలో తమోగుణాన్ని పెంచుకుంటాం తమోగుణమే ఎక్కువైపోద్ది ఎక్కువ నిద్రపోతే ఎక్కువ నిద్రపోకూడదు కానీ తక్కువ నిద్రపోకూడదు కరెక్ట్ గా నిద్రపోవాలి అది ఏది అనేది ప్రతి ఒక్కళ్ళకి వాళ్ళకే లోపల నుంచి అంతరంలోనుంచి వస్తుంది","దాన్ని బట్టి నిద్రపో అంతే ఇప్పుడు నేను నేను పండుకుంటాన్నా నిద్ర వస్తలేదు నేను పండుకుంటాన్నా నిద్ర వస్తలేదు ఎందుకంటే ఇప్పుడు అక్కడ ఇంటికాడ ఇక్కడ రెండున్నరకు రెండు గంటలన్నర పరకి సౌదీకి మన ఇండియాకు ఇక్కడరెండున్నరకు అక్కడ ఐదు అయితదిరెండున్నరకు లేసి స్నానం చేసి మూడుమూడు 10 నిమిషాలు అట్లా ఒక 10 నిమిషాలు అటు ఇటు జాయిన్ అవుతున్నా అయితే నేను రాత్రి 12త నుంచి 12మూడు గంటలు చేస్తామూడు గంటలునాలుగు గంటలు ఎప్పుడన్నా అంతే మిస్టేక్ పంటున్నా ఇప్పుడు 2019 నుంచి మొన్నటిదాకా ఏం కాలే మొన్న వారం","రోజుల నుంచి వేడి వస్తువులు తింటున్నాగా రొట్టెలే తింటున్నా అన్నం లేదు ఆరు నెలల ఇప్పుడు చుట్టి మూడు నెలలు వచ్చిన అప్పటి ంచి ఆ గోధుమ రొట్టెలు చేసుకుంటా తింటున్నా రెండు రెండు పత్రి సార్ అన్నాడు కదా అప్పుడు మూడు నాలుగు ఐదు తింటుంటే ఇప్పుడు రెండు తింటున్నా అయితే ఇక్కడ చాతిల మండుతున్నట్లు మళ్ళ తల తిరుగుతున్నది అది ఏమన్నా నిదుర ప్రాబ్లమా లేకపోతే సాధన ఎక్క అయిందా అది తెలుస్తలేదు మాస్టర్ ఆ ఓకే మీరు అట్లాంటప్పుడు రెస్ట్ ఇవ్వాలి శరీరానికి కూడా మరీ ఎక్కువ కష్టపెట్టకూడదు ఎందుకంటే ఈ పరమాత్మ","ఈ పరమేశ్వరుడు పరమేశ్వరి ఈ శరీరంలోనే ఉన్నారు ఇక్కడలో లోపల ఉన్నారు వాళ్ళకి మనం కష్టమే ఇవ్వకూడదు మనం ఈ శరీరంలో కష్ట పెట్టకూడదు దానికి అందుకే మీ శరీరం కష్టపడకుండా ఇబ్బంది పడకుండగా ఎంత నిద్ర కావాలో అంత ఇవ్వండి దానికి ఆ శరీరానికి ఇప్పుడు ఒకసారి ఆకలి మనకి ఎంత ఆకలి ఉంటుందో అంతే తినాలి మరి ఆకలిని చంపుకోకూడదు కూడా ఇప్పుడు నియమమ ఏం లేదు మీ ఆకలి ఐదు రొట్లు తింటే తీలుతుంది అంటే ఐదు రొట్టెలు తినొచ్చు మనం తగ్గించాలనే రూల్ ఏమీ లేదు ఎంత సరిపోతుందో అంతకంటే ఒక్క మోతాదు కూడా ఎక్కువ తీసుకోకూడదు","అంతే అదే నియమం అన్నమాట మన ఆకలి ఎంత ఉంటుందో దానికంటే కొంచెం తక్కువ తినాలి అంతే అది కూడా చూడండి ఇప్పుడు రొట్టె తింటున్నారు ఇప్పుడు కడుపులో మంట వస్తుంది అన్నారు చాతీలో మంట వస్తుంది అన్నారు అది అసిడిటీ ఈ అసిడిటీ పెరిగింది అంటే మీలో ఒక వేడి పుట్టి జటరాగ్ని బాగా ఎక్కువ ఈ హైడ్రోక్లోరిక్ యసిడ్ ఆమ్ల రసం అనేది మన పొట్టలో నుంచి రిలీజ్ అవుతుంది.","ఎందుకు రిలీజ్ అవుతుంది అంటే అది దానికి ఆకలి వేసింది కడుపుకి ఆకలి ఉంది. ఆకలి కొంత తినాలి. అట్లాంటప్పుడు మనం నేను నియమం పెట్టుకున్నాను తినకూడదు అని మనం తినకుండా ఉండకూడదు ఆకలి వేస్తే ఏదో ఒక ఫలం ఏది ఉంటే అది తినొచ్చు. ఇప్పుడు ఫలం తినొచ్చు ఒక రొట్టె ఎక్కువ తినండి దాని వల్ల ఏమి ప్రాబ్లం లేదు. మన శరీరం ఎప్పుడూ సౌష్టంగా ఉండాలి."],"minutes":8,"words":1129},{"title":"శరీరం · నిద్ర · నియమం","paras":["ఒక కంఫర్టబుల్ గా ఉండాలన్నమాట సౌకర్యంగా ఉండాలి ఎప్పుడూ శరీరాన్ని ఇబ్బంది పెట్టకూడదు కష్టపెట్టకూడదు అది నియమం పెట్టుకోవాలి ఎందుకంటే ఈ దేవుడే సాక్షాత్తు ఈ దేవుడు శరీరంలో ఉన్నాడు ఇది ఎవరిని కష్టపెట్టినట్టే మనం పత్రి సార్ పాటలో ఉన్నది కదా మూడు రొట్టెలు ఒకటి రొట్టె దుంటే యోగి అన్నట్లు ఆ పాట పాటి అది నేను ట్రై చేసి ఇప్పుడు ఆ అది స్లోగా అన్నమాట ఆ స్థితి వస్తుంది మనం గ్రాడ్యువల్ గా మనకి తెలుస్తూ ఉంటుంది ఓకే ఇప్పుడు నేను ఆ స్థితికి చేరుకున్నాను ఇప్పుడు ఒకటికి తగ్గిస్తాను ఒక రొట్టి తగ్గించేస్తాను అంతే మన అంతేగాని ఒక్కసారిగా ఆ నియమం ప్రకారం ఇలా చేసేస్తే అలా అయిపోతుందని కాదు స్లోగా మన శరీరం మన లోపల నుంచే తెలుస్తుంది.","నిద్ర నాకు ఇన్ని గంటలు సరిపోతుందని లోపల తెలుస్తుంటుంది దాన్ని బట్టి మనం నిద్రపోవచ్చు.","కానీ మీ యొక్క సాధన మీ యొక్క ఆ ఆ ఆసక్తి ఇంట్రెస్ట్ లెవెల్స్ మీరు దీని పట్ల ఉన్నటువంటి అంత అద్భుతమైనటువంటి శ్రద్ధ ఎక్కడో ఉన్నారు ఏదో వేరే దేశంలో ఉన్నారు నిద్ర లేచి అర్ధరాత్రి లేచి ఇన్నీ ఈ జూమ్ జాయిన్ అయ్యి సాధన చేయడం మీ చాలా మేము ఆనంద పడుతున్నాం చాలా అద్భుతం ఎలయ గారు మీరు ఎన్ని ఓవర్కమ్ చేశారు ఎన్ని గొప్ప ఎన్నో స్థితుల్ని చక్కగా చేదించ ంచుకొని ఉన్నత స్థితులకు వెళ్తున్నారు మీరు ఆధ్యాత్మికంగా అద్భుతం అంటే బాధలు నా బాధలే నన్ను ఎందుకంటే దుబాయ్లో ఎనిమిది సంవత్సరాలు ఉన్న ఎనిమిది","సంవత్సరాలు ఉన్నప్పటి నుంచి స్టార్ట్ అయింది తొమ్మిది తొమ్మిదిల 2009లో ఆ బాధలు చాల అయినాయి అంటే 2019 దాకా నాకు బాధలే అప్ప ఆ బాధల ద్వారానే నేను ఈ సాధన ఎక్క సాధన చేసి 13 రోజులలో నా ప్రాబ్లం పోడగొట్టుకున్న పోడగొట్టుకొని ఇప్పుడు 2023 నుంచి పాంప్లెట్లు వంచి 24 జ్యోతి 25 జ్యోతి ఆరు నెలలు అత్త ఉంటా మళ్ళీ ఇట అత్తా అందుకే పెద్ద పెద్ద మాస్టర్లు కలిసేటల కంటే నవపేడు మండల్లోనే మొన్న ఒక మాస్టర్ చెప్పిన మాస్టర్ ఫోన్లో చూసి చెప్పిన మాస్టర్ శరీరం వదిలిపెట్టిండు ఇప్పుడు నేనే నవపేట మండల్ నెంబర్","వన్ల నేనే ఉన్నా నా ద్వారా ఇప్పుడు రెండు పిరమిట్లు వచ్చినాయి వందల మంది వచ్చింరు అందుకే అక్షరం రాయాలి లేదని అప్పుడు ఫీల్ అయినా కానీ మీ వీడియో విని మీ ద్వారా నేను వచ్చిన కాబట్టి నేను ఫీల్ అయితలేను ఇప్పుడు అయితే అసుంటిది ఇప్పుడు పెద్ద పెద్దోళ్ళ నరేంద్ర సార్ అసుర అది బొంబై తీసుకెళ్ళిండు ఆ ఇప్పుడు మన ఆ వరంగల్ సార్ నాకు జ్యోతింబట అవకాశం ఇచ్చింరు విజయభాస్కర్ సార్ పెద్ద పెద్దోళ్ళు నాకు తేజ్ మీద అవకాశాలు ఇచ్చిరు ఇవి నాకు గొప్పతన ్యూ థాంక్యూ మాస్టర్ థాంక్యూ థాంక్యూ వండర్ఫుల్ మేడం థాంక్యూ థాంక్యూ అండి లక్ష్మీ కళ్యాణి గారు గారు ఆ మేడం మేము మేము ప్రతిరోజు అందరి షేరింగ్స్ తీసుకుంటాము మీరు మీ టర్న్ వచ్చేదాకా వెయిట్ చేస్తే మీది కూడా మేము విని ఉండేవాళ్ళం ఇప్పుడు మీరు మాట్లాడితే చాలా బాగుంటుంది","చెప్పండి మేడం అన్మ్యూట్ చేసుకోండి.","ఆ థాంక్యూ [గొంతు సవరించుకోవడం] సో మచ్ సార్ థాంక్యూ మేడం తుందా సార్ ఇన్ని నెలలకి మీతో మాట్లాడడం అనేది చాలా ఆనందంగా ఉంది సార్ నాకు నిన్న నిన్న ఒక్కరోజు నాకు అవకాశం దొరికింది నిన్న సార్తో కూడా మాట్లాడాను మీతో మాత్రం ఎప్పుడు మాట్లాడలే ఇదే ఫస్ట్ టైం నాకు నా పూర్వ జన్మల్లో నాకు నా భర్తకి గాని నాకు నాకు నా పిల్లలకి గాని ఉన్న బంధం ఏమిటి ఈ జన్మలో నా పిల్లలే నాకు శత్రువులుఅయ్యారు అది ఎందుకయింది అని తెలుసుకోవాలనే క్యూరియాసిటీ చాలా బాగా ఉంది సార్ కానీ నాకు అలాంటి అనుభవాలు గాని అవి","ఎప్పుడూ జరగలేదు అది ఒక్కటి ఒకవేళ అలా నేను తెలుసుకోలేకపోయినా మీ ద్వారా చిన్న మాటయినా నా చెవిలో పడితే అది నాకు ఆనందం అని నేను మాట్లాడాలను సరే ఇన్ని నెలలుగా నా పిల్లలకి అంటే మనం పెంచి పెద్ద చేసాము మనం పెట్టాము మనం చదివి ఇవన్నీ అనుకోకూడదు అంటారు ఇంకొకటి ఏంటంటే వాళ్ళు ఏమన్నా కూడా వాళ్ళు ఎన్ని విధాలుగా అవమానించినా కూడా ఇది నేను తెచ్చుకున్నదే కదా ఆహా ఇది నేను చేశాను అందుకే నాకు తిరిగి వచ్చింది కానీ నాకు తెలుస్తుంది సార్ ప్రతిదీ కూడా వాళ్ళు ఏ మాట అన్నా ఓహో ఇది నేను అని ఉంటాను ఇప్పుడు","నన్ను అంటున్నారు.","అవమానిస్తారు నా ఎదురుగానే పెట్టుకొని తిన్నావో నేను ఎప్పుడో చేసి ఉంటాను ఎవరికో నేను పెట్టకుండా అది నాకు తిరిగి వచ్చింది ఇవన్నీ నాకు తెలుస్తున్నాయి అయినా బాధ ఎందుకు కలుగుతుంది బాధ అనేది కలుగుతుంది ఆ క్షణానికి నేను తెలుసుకున్నట్టే ఉంటున్నాను ఇది నాకు తెలుస్తుంది నేను చేసుకున్నది నాకు వస్తుందని మళ్ళీ బాధ మాత్రం ఒక నెలల తరబడి బాధపడుతూనే ఉంటున్నా అది ఎందుకు జరుగుతోంది దీనికి కొంచెం వివరా ఇవ్వండి సార్ లక్ష్మీ కళ్యాణి మేడం ఆ మీరు ఈ ప్రోగ్రాంని అటెండ్ అవుతూ ఈ జ్ఞానంతో మీరు ఎన్నో నేర్చుకుంటూ ఈ ధ్యాన సాధన చేస్తూ ఉన్నారు.","మీరు అడిగిన ప్రశ్నలోనే జవాబు కూడా ఉందన్నమాట. మీరు అడిగారు ఇది ఇది ఏ పూర్వజన్మలో చేసుకున్న కర్మలో ఇప్పుడు మా చిల్డ్రన్ మా కొడుకులు వాళ్ళు నాకు శత్రువులు అయిపోయారు అన్నారు అక్కడే ఉంది కూతురు కోడలు అల్లుడు
