</style></head><body><div class="app lang-en"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-01-en.html">Prev</a><a href="day-03-en.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">The Empty Vessel · Shakti and Chaitanya · Devi Navaratri · Day 2 (English)</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">The Empty Vessel · Shakti and Chaitanya</span></div><div class="tools"><span class="lang-switch"><a href="day-02-te.html">TE</a><a href="day-02-en.html" class="active">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-01-en.html">Prev</a><a href="day-03-en.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"Opening Meditation · The Empty Vessel","paras":["Welcome to the 562nd day of the Jnanodayam programme. Today is the second day of Navaratri, and once again this knowledge is being received from Dr. Newton. Before that, we have to make ourselves ready. If knowledge is to fill us, we must first become an empty vessel.","Meditation is the way. Let us all practise Anapanasati, mindfulness of the natural breath, for the next forty-five minutes. Sit comfortably in sukhasana, a steady and easy posture. Cross the legs, let the fingers rest together, and if you are wearing glasses, take them off. With a small smile, close both eyes, and simply watch the breath as it is already moving.","By watching in this way we draw the senses inward. Placing the attention on the breath, we become antarmukha, turned toward the inside. These forty-five minutes belong only to the inner journey, with the outer world left aside. When thoughts come, bring the attention back to the breath.","Thoughts never stand in the present moment. We live only in this moment. We cannot live in the past, and we cannot live in the future. Thoughts waste our energy. When the attention is kept on the breath, the energy stays within us, and it gathers in an upward movement. Let us remain in full awareness. Let us be inward. Let us be with the breath.","In the closing minutes the sitting was offered as a sankalpa, an intention for the welfare of all. The prayer was that the knowledge lying hidden within everyone might awaken, and that joy might stir in every heart. The Sahasrara pyramid, the pyramid of the crown, was remembered as a pillar of the lamp of knowledge, a light of knowledge giving direction to everyone. From the four corners of the world many come to this place, sit in meditation, and come to know themselves, receiving atma jnana, knowledge of the Self, and brahma jnana, knowledge of the absolute. Through this modern seat of learning, many are becoming compassionate, and many are becoming wise.","Then, very slowly, the count came down: five, four, three, two, one, zero. Place both hands over the eyes for a few moments, and with a smile open the eyes gently. Welcome back, friends. We have come to the second day of Navaratri.","Everyone in the gathering was invited to turn the cameras on and, with a smile, to welcome the founder and chairman of Quantum Life University, Brahmarshi Chakravarti Dr. Newton Kondaveti. He greeted the friends of Jnanodayam. In these days of Devi Navaratri we are learning the inner meaning as well. The inner meaning has to be known. Only then can these days truly be celebrated."],"minutes":4,"words":445},{"title":"Shakti and Chaitanya · Celebration, Not Enjoyment","paras":["This whole creation is Shakti. Para Shakti, the supreme power, and Apara Shakti, the power that has become manifest, come here as Devi Shakti and create the entire creation. That Parameshwari, the supreme Goddess, pervades the whole universe. This entire brahmanda, the cosmos, is nothing other than Shakti and Chaitanya. In the whole science of this spiritual knowledge there are only two things to be grasped. One is Shakti. The other is Chaitanya, pure consciousness.","Shakti is what we call Mother Parvati. We have given her many names. We call her Durga. We call her Adi Shakti, the primordial power, Para Shakti, Parameshwari. That Chaitanya we call Shiva. We call him Ishwara, Sarveshwara, the Lord of all, Sarvantaryami, the inner ruler of everyone, Sarvavyapaka, the one who pervades all, the Paramatma, the supreme Self. The points to be known are only these two. Yet if Shakti is not known, Chaitanya cannot be known. That is why, in our India, these nine days of Devi Navaratri are kept: so that this Shakti may be known, and so that she may be experienced. The celebration is for that.","Many people do not know the difference between enjoyment and celebration. Enjoyment belongs to a person's own wanting. A desire is there, and when that desire is fulfilled it is called enjoyment. Going out to drink, or watching a film, is taken for enjoyment. Celebration stands apart from that. In the feeling 'I want this, I enjoy this,' a want is present. There is trishna, craving. That is enjoyment. In celebration that wanting is absent. There is ananda, bliss. There is utsava, a festival. However things stand, a person is able to rejoice.","These observances of Devi Navaratri are kept as celebrations. They are festivals. This joy is an all-pervading joy, a great celebration. These are days favourable to the sadhana of Shakti. Whoever is still struggling in life, whoever is still stuck, whoever feels that the answers have not yet come — if that person practises, the fruit of the practice will certainly be received. On these favourable days the power of Para Shakti, of Adi Shakti, is available a thousandfold.","The nature of this energy is of two kinds, and it can be recognised by watching the direction. One movement of energy comes inward. The other goes outward. According to its nature and its direction, the energy we take into ourselves and use within is what we call mahila tattva, the feminine principle. When the direction of the energy is outward, we call it masculine. One is feminine and the other is masculine. The feminine is internal. The masculine is external. These two have to be known first, because today's sadhana is a process we are all going to learn, and it is a practice for every day.","The feminine principle always abides within. What travels outward is the masculine quality, the quality of purusha tattva, the masculine principle. On the physical plane the masculine is always external. That is why women, on the whole, remain closer to their own natural state. They stay nearer the principle of the Self, nearer the heart, nearer intuition. The masculine principle expresses itself outside.","These nine days are the Navaratri of the Mother. All of us are to see only Devi Mata. In everyone, and in ourselves as well, we are to see the Mother. A feeling of samarpana, of offering, is needed. What we practise through these nine days is this: not travelling outward, not scattering the energy, not spending our power outside, but keeping it within. Women and men alike are to do this sadhana. It is a change of direction. For these nine days we do it. Afterwards, whatever is to be done can be done.","Through these nine days we do not scatter the energy outside, and we do not waste it. We contain it within. We let this Shakti multiply inside. It is astonishing, because Para Shakti herself is lying dormant, hidden within us. That power has to be contained. To contain her is to practise with her completely, inwardly, and to bring that Shakti into our experience, into our feeling. From that, something is gained."],"minutes":6,"words":696},{"title":"Three Mothers · Meditation, Service, Knowledge","paras":["In these days of Devi Navaratri we worship her in many forms, and we call her by many names. We give forms to Para Shakti. When a form is given, a saguna aspect, a form with qualities, we work with that form each day. In some regions this Devi Shakti is worshipped chiefly in three forms: as Mother Saraswati, as Mother Lakshmi, and as Mother Durga, who is also Mother Kali.","Certain bija aksharas, seed syllables, have been spoken for them: Aim, Kreem, and Kleem. These seed syllables belong to the divine powers. Through vibrations of sound, the vibration of Devi Shakti was recognised, and those energies were identified by sound.","Aim is Mother Saraswati: vidya, learning, and knowledge. Kreem is aishwarya, prosperity, Mother Lakshmi. Kleem is Mother Kali, and Kali is Durga, and Durga is meditation. Mother Lakshmi is service. Mother Saraswati is atma jnana, knowledge of the Self. These three points have to be held. Three powers: this is the sadhana of the tri-shakti, the three powers. The whole of Navaratri is only these three — meditation, service, and Self-knowledge, which is brahma jnana, knowledge of the absolute. When these three powers are understood well, an activation happens. For anyone still stuck on the spiritual path and wishing to move to the next level, this sadhana is of great use.","So through these nine days let us remain in a feeling of offering. We call it Devi Samarpan, the offering of oneself to the Mother. In that offering we have to stay connected with ourselves in every matter. In everyone, the Mother is to be seen. Only Devi is to be seen. Even when we look at ourselves in a mirror, the darshan we take should be the darshan of Devi alone.","We are to say Amma, Amma. Whomever we meet: Amma, please tell me. Even when the person met is a man: please tell me, Amma. Only the Mother is to be seen there. Everyone is the Mother. Every person you meet, and every person you speak with, is Amma, the very form of the Mother. Para Shakti herself has manifested here in this way. This whole creation is she.","We began by naming Shakti and Chaitanya. Chaitanya means Shiva. If Shakti is absent, that Shiva too remains Shiva only in name. What would he do? He can do nothing. Shakti comes first. Shakti is the one that matters. Without Shakti, Shiva himself becomes a shava, a corpse. Without her there is nothing. This is why our texts have given a form, a beautiful picture in symbols. When she came as Mahishasura Mardini, the slayer of the buffalo demon, she took an incarnation and assumed a form, and she fought with a terrible force. She destroyed them all. She destroyed every asura, and such was the energy that she was on the point of destroying the gods as well. Shiva then had to go and stop her.","He lay down beneath her. She placed one foot upon him, and she placed that foot upon his heart. At that touch she came into a state of awareness. This is Chaitanya. This is Shiva.","That is why, through these nine days, the way we sit is particular. Ordinarily we sit cross-legged. Now the left foot should rest above, upon the right foot. Even on a chair, the left leg is placed over the right. Let us practise it as a symbol. The hands are usually kept with the right hand above and the left hand within. Instead of that, the left hand should lie above, covering the right. We are changing, a little, the way we sit, and we are doing it with awareness.","From childhood our parents nourished us and brought us up. We spent a great deal of time with them. We passed many hours in their company, and we felt their presence. We feel it even now. In memory, the sweet moments spent with one's parents never scatter. They remain, laid down within. They can be felt. Even if those parents have already left the body and gone on to the higher worlds, their presence can still be felt, because a connection was formed. By living close to them, the sense of their presence — you are here, you are with me — became printed in us.","That same presence, through these nine days of Devi Navaratri, is now to be felt as the presence of Para Shakti, of Adi Shakti. Presence is what matters. Feel her presence. She, that Shakti, is our mother. Chaitanya is our father. For this physical body there is a mother, and for this physical body there is a father. What is being spoken of now is the spiritual sense of it. Our mother is Shakti.","Through these nine days let us feel the presence of Devi Shakti, of Devi Mata. If the presence is to be felt, the experience has to come. The feeling has to be gained. A form is not required for that. She keeps giving darshan in many forms. The nirguna, that which is without qualities, becoming saguna, with qualities — Adi Shakti, Para Shakti, who has neither shape nor name, taking a form upon herself — many yogis and many rishis have seen how she then appears.","The pictures we see, and what stands in the temples, include her form as Mahishasura Mardini. Why did that particular darshan happen? So many people of meditation, seated in the meditative state, wished to behold the form of Para Shakti. What is nirguna and nirakara, without form, gives the eyes nothing to rest on. We cannot find a relation with it. When a name and a form arise, that is the darshan which came to them. On these days of Devi Navaratri, though, what matters is to feel the presence. Presence does not ask for a form, and it does not ask for a name. It is Shakti. By whatever name you call, hold her as Amma. That is enough. By whatever name she is called, she comes in that name. Child, Mother is coming. She gathers everyone close. She draws them near.","So the points to be practised through these nine days are these. First, the feeling of presence. Devi Mata is right here. She is within us. She is not someone else, and we are not someone else. We become her. We are not apart from that Shakti. That Shakti is what we are. At the beginning, though, we see her as apart, and if the feeling is to arise the presence has to be felt. Second, the Lakshmi mudra, which is the way of sitting. The left foot rests on the right foot. The left hand rests above the right hand. Greater place is given to the feminine principle.","These nine days are offered wholly to the Mother, wholly to Mata Shakti, in surrender. Without Shakti, Shiva too is only a corpse."],"minutes":11,"words":1156},{"title":"The Clod That Stays · Total Acceptance","paras":["The Lakshmi mudra also means this. We are not to scatter our energy outward, nor waste it, nor misuse it. For these nine days it is to be used for sadhana, so that we may become inward. We misuse this energy in many ways, and it is a priceless power. It has to be used well, for the sake of the inward state. Within us many secrets lie hidden. Many great knowledges are there inside. This energy is required if they are to be known. Where there is no energy, we remain exactly where we were set down. There is a saying: the clod stays where it is thrown. It is the same with us.","In life we dream any number of dreams, and in the spiritual life also we dream many. I must reach the ajna chakra. I want the Sahasrara. I must attain the state of the crown. I must obtain the knowledge of liberation. I must cross the round of birth and death. So many karmas lie heavy on me. I must set down my whole burden. Thinking in this way, a great many people remain stuck in the practice. The clod must not be left lying where it was thrown.","This energy must not be misused. Through words, and through our actions, a great deal leaks outward. We keep travelling out. We have to become inward-facing. The more we turn inward and come to feel that Shakti within, the more its direction changes. It begins to travel upward. It should not turn downward and run out into the outer world. It should move buddhi-mukha, toward the awakened intelligence.","Then, through these nine days, one further practice is to be done. It is called acceptance. Every single matter, and every situation, is to be accepted. Our past also is to be accepted. The past has to be accepted completely. If only I had done it in that way, it would have been better. Now I am in pain. I am suffering over the decision I took. In the past it ought not to have happened so. It ought to have been otherwise. The past has to be received whole. It has to be accepted.","In this present also, from the circumstances you are actually in, every single thing is to be accepted. The people who are with you, and the conditions around you, however they are — receive them as they are. Acceptance means to take in, and to agree. Very well. This difficulty is here. This hardship has come. I accept it completely. It has come with a cause.","Nothing is to be refused. No situation is to be rejected. It is to be accepted. If the food you are eating tastes bitter, accept that. You have eaten bitter gourd, kakarakaya, and you do not like it. Accept the bitter gourd as well. Accept whatever is arriving, the sweet along with everything else. There are people, too, who are like bitter gourd. There are people who are sweet. There are people who are salty. There are people who speak with sweetness. Each of them, as that person is, we have to agree to receive.","Drop the expectations. No expectations. They ought to change. They ought to be like this, or like that. None of that is required. Accept, accept, accept. Accept yourself. Whatever state we are in now, that present state has to be accepted. Only then is the next state available. From the state in which we stand, we move into another. This state, though, has to be accepted first. It has to be agreed to completely, and received completely.","This is the practice of these nine days. Write it down clearly. What expectations are still there? What is it you are unable to accept? It may be people in your life. It may be circumstances. Of everything that is happening, what remains unaccepted? For these nine days let us practise acceptance — complete acceptance, total acceptance. From the hour we wake in the morning until we lie down at night, we remain inside celebration."],"minutes":6,"words":680},{"title":"From the Soul · Red, the Dynamic Colour","paras":["Celebration is a different matter from going out to drink and to dance. When many people hear the word festival, they turn to drink, or to something of that kind. A name has been given to that, and the name is enjoyment. Celebration comes from the soul. It is what arises from our Shakti, from atma chaitanya, the consciousness of the Self. To live each moment as a wonder, in a great joy — that is celebration. Nothing further has to be arranged in order to celebrate. Devi Navaratri itself means celebration for us, because we are joined to our own Shakti.","We are connected with that divine power, our Devi Mata, Kundalini Mata, the Mother as the Shakti within. We are near her. This nearness itself is the great celebration, a festival full of spirit. That is why the festival carries the name Dasara. Reverse Dasara, and the name becomes Sharada, to be lived with a light and playful gladness. Dasara means celebration.","Among the points of practice is Devi Samarpan: a complete offering to that Mother, Jagadamba, Mother of the world. Feel her presence completely. Shakti is that presence. Mother means Devi Mata, means Jagadamba, means the one whose very form is Shakti. Within us she shines as Adi Shakti, as the root power, as Kundalini. We have to surrender to that Mother. The feeling of offering has to remain.","There are two mudras here, the Vishnu mudra and the Lakshmi mudra. The Lakshmi mudra is the way you sit, and the way you place the body. The left foot, or the left hand, stays above. Through these nine days we remain inward, rather than pouring ourselves outward. Let us set aside, for these nine days, the small pleasures and the small enjoyments. After the nine days they may be taken up again. These nine days are dedicated to realising our own energy, and to entering that experience. Let us give the nine days to that.","In our India this festival is also kept through signs. Red clothes are worn. Dr. Newton himself had dressed in red, a red border, white together with red. In the food as well, let there be what is red. Tomatoes are red. Among the capsicums there is a green one and a red one. Among the vegetables, some are red and some are yellow. This is the dynamic energy of that Shakti. When Adi Shakti, in her saguna form, manifests in the physical and expresses herself physically, the colour of that dynamic energy is red. That is why kumkum, the vermilion, is so deeply red. All of this has been set in place among us as a symbol, so that we may stay near her. If she is to be known, and if there is to be surrender to that Mother, then red clothing and red-coloured food — red, or white and red. Red is a very dynamic colour. These are signs.","Behind every story we read, a symbol is waiting. In that symbolic form our rishis and maharshis composed the Devi Bhagavatam and the puranas. Many inner meanings are held there. A great knowledge was placed inside those stories. All of it was set down for sadhana. These festivals exist for sadhana. One part is celebration, the keeping of the festival. The other part is coming to know, and the practice itself.","The breath, too, ordinarily moves. It happens of itself. After we rise in the morning, Devi Samarpan is an offering, made in a symbolic form, to the Shakti which conducts this whole creation — the Shakti on whose support this entire brahmanda goes on."],"minutes":6,"words":605},{"title":"Chandra Nadi · Bowing the Head","paras":["That breath keeps changing through the two nostrils. Moment by moment it shifts, left and right, right and left. In everyone it changes about every hour and a half, or every two hours. After we have sat in meditation, the two become equal. When they are equal, the energy flows upward through the sushumna, the central channel. The direction changes.","When you are active and dynamic, the right side is the one that runs. That is the masculine, the movement toward the outside, the greater activity. You may be doing some work, or you may be thinking a great deal, and thinking too is a work. Whenever you are somewhat quiet, whenever you are going into yourself and withdrawing, the chandra nadi, the lunar channel, is the first to become active. The breath then moves through the left nostril.","This is the sign of Shakti. If the right side is taken as Chaitanya, the left side is Shakti. The meeting of the two travels inward and touches the ajna chakra, the centre between the eyebrows. It is the union of Shiva and this Shakti, the union of Shakti and Chaitanya, the union of the lunar channel and the surya nadi, the solar channel. That union expresses itself as the sushumna, and as the agni nadi, the channel of fire. So every day, after rising in the morning, a process is to be done. Through these nine days let us do it, and in the evening as well — once, and a second time. It is a way of reminding ourselves. Devi Samarpan: remaining in the feeling of offering toward Adi Shakti, toward Para Shakti.","In our culture, bowing is something learned in childhood from the elders. We offer namaskara at a person's feet. We bend the head. When we went near God, mother and father would say: bend the head, and offer your namaskara. Sometimes a sashtanga pranam is offered, the homage of the whole body. This matters greatly. We bow to our parents as well. We salute their feet, bending the head.","A temple is built in the same knowledge. There are many crossings, and as one goes inward, toward the garbhagudi, the inner sanctum, the doorway grows small. Door by door, the openings become smaller. The head has to bend. This head is ahamkara, the ego, and it can become a very large ego. We say that pride has risen into the head. We say it has gone to his head. Money comes, power comes, status comes, a position comes, and for many people all of it goes straight into the head. The ego arrives.","The head has to bow. To Devi Mata, to this Shakti, the head has to bow. Upon this Shakti the whole creation rests. Every single thing happens only through Shakti. Bow the head. These things were taught to us, toward our parents, when we were small. If they were not learned then, they can be learned now. Bow at the feet of your parents. Whether they are present or absent, even if they live only in the heart, bow to the feet of our mother and our father. Had they not been, we would not have come here at all. To Shakti and to Chaitanya also — mother and father of the soul that has come onto this earthly sphere — we offer namaskara. Through these nine days we bow to that Mother. In Devi Samarpan the head bends. Let us learn the process."],"minutes":5,"words":581},{"title":"Devi Samarpan · Nine Breaths, Nine Times","paras":["Sit at ease. On a chair, sit as was shown. The left leg rests above the right leg. Seated on a chair, place the left leg over the right. In this sign we give the preference to the feminine principle, to Adi Shakti. In the same manner that Mother Kali set her foot upon Shiva's chest, we tune ourselves to Shakti, and a connection forms.","The hand is held in Vishnu mudra. Close the index finger and the middle finger, and leave the thumb and the other fingers open. The mudra stands in the shape of the shankha, Vishnu's conch, and with it the right nostril is closed. The right nostril is the surya nadi, the solar channel. It is closed because the chandra nadi, the lunar channel, is Shakti. As a sign, and in order to tune to the feminine principle, this lunar channel is what first helps us become inward. Watch the placing of the hand before you begin.","Near the right nostril apply only a little pressure. Do not press hard. Without troubling the nose, close it gently and slowly. Then draw the breath in nine times, through the left nostril, one sip after another, step by step. Do not breathe out between them. The nine breaths are a filling. The breath is taken in until it is complete. If each sip is too large, the nine cannot be finished, because the lungs are already full. So draw slowly, a little at a time, nine times, until the breath is held inside, in kumbhaka, the inner retention.","Then both hands leave the Vishnu mudra and join in namaskara. Place the joined palms upon the head, because the head is about to bow. Those nine inhalations are still within. Now bend the head with the feeling of Devi Samarpan: I offer myself. The feeling is the whole of it. A merely mechanical bow is not the practice. With the sense that the offering to the Mother has been made, the head comes down, and as the head bows, the breath is released outward.","The inner hold cannot be kept for long. So, with the hands joined, bow slowly, as one bows at the feet, and let the breath go out while the head descends. If the earth can be touched, so much the better. Sitting cross-legged on the floor, let the namaskara meet the ground, and let the head meet the ground if it will. The feeling of the touch is Devi Samarpan. This Shakti of the Mother of the world, this Para Shakti who has made the whole creation, this Para Shakti who is within me — I surrender. I offer myself. If the head cannot reach the earth, let the hands touch the earth at least. The head itself must bend. In that bowing the ego is laid down completely. Our ego is our chief enemy.","As we have bowed to mother and to father, we bow to this Mother also: Jagadamba, Mother Durga, Mother Kali in her many forms, Mother Lakshmi, Mother Saraswati. When she came as Mahishasura Mardini, all the gods came and gave their powers into her. All of them are in her. The shakti of every god joined wholly into her. Mother Lakshmi is in her. Mother Saraswati is in her. Mother Durga is in her. All are she — Adi Shakti, in whom every power is gathered. She became the slayer of Mahishasura. On one of the coming days that inner meaning will be decoded. Today the process is what we learn.","When the breath has gone fully out, remain there. That is bahir kumbhaka, the outer retention. Do not draw the breath in again yet. Stay bowed. For how long? For a count of nine. Or, if you wish, for nine repetitions of Shreem. Shreem, the seed syllable Shrim, belongs to Devi Mata and is for joining with her. At the para level, the subtle level of sound, it is not pronounced aloud outside. It repeats within the consciousness. Nine times Shreem, or nine quiet counts. In that surrender, with the head bowed, remain. Sharanu, sharanu, sharanu: I take refuge. I surrender to that Shakti. Today I surrender to Shakti. After the nine, return slowly, and raise the head again.","This is one round, and the round is done nine times. Done with care, the whole of it takes about three minutes. It is to be learned today and practised each day. This is Devi Samarpan.","He guided the gathering through the rounds, and asked that each round be done consciously, with the feeling kept awake. On the later rounds the head was to touch the earth where it could, the breath was to be emptied completely, and in that emptiness Shreem was thought inside, never thrown outward. Along with the bowing he asked that the ego be offered, and everything with it. Let every single thing be placed at her feet. Surrender to Shakti. Whatever problems are here, these hard and difficult troubles, however many they are, surrender them. There are many sankalpas, many resolves. That state has to be reached, and her power is what is needed. Take refuge.","In one round the offering was of all the problems. In another it was of the concerns and the worries as well: surrender them to Adi Shakti, to Para Shakti, the power that has made this whole creation, and remain in a complete feeling of refuge while Shreem sounds nine times within, as a vibration of sound. Then the head comes slowly upright, back to its ordinary place. Between rounds, a little rest is allowed. The breath is never forced.","The last round he left to each person alone, with no further instruction, so that what had been learned could be done in one's own feeling of surrender.","There are many things we are not able to solve. And our own power, however much sadhana we have done and however much energy we have gathered within, remains a limited power. If we can trust this Shakti completely, and surrender, then that force — the divine force — is what solves them. She makes us able to cross them, whatever the obstacle may be. She is our mother. After rising in the morning, in a meditative state, let us do this offering, and let us remain in a complete surrender to Shakti."],"minutes":10,"words":1062},{"title":"Amma First · The Nine Openings","paras":["Through the whole of the day that presence has to be felt. The presence of Devi Mata. Everywhere, Amma is present. Jagadamba is there. The whole of it is the Mother. For these nine days the attention rests with her. Love for the Father may be there, and love for Shiva may be there. The approach begins with Amma. The bond has to be made with the Mother, and a connection has to form with her. We neglect this Jagadamba when we try to arrive at Shiva first. Shakti comes before that. Where Shakti is missing, Chaitanya is missing. The Mother is needed first. She is the one who takes us to the Father. She makes the introduction: this is your father. So each day the presence has to be felt.","Then acceptance, again and again. Let every single thing be accepted. No complaints, and no problems carried as complaints. Accept the past. Accept the present. Accept yourself as you are. Accept each person as that person is. And do not spend the energy in a critical way, going about finding fault. None of that is required, because through these nine days the energy has to be conserved. This is the sadhana.","Spiritually, take it that there is a ladder, and on it many steps waiting to be climbed. If these nine days are done rightly, then by Vijayadashami, the tenth day, that Vijayadashami can truly be celebrated. Wonderfully, a person becomes able to move into another state. Spirituality means obtaining, from the state one is in, a higher state, a different state. That state matters. You become that very Shakti. You become Adi Shakti. When the nine days have been done truly — total acceptance, total surrender, Devi Samarpan, the feeling of offering — the surrender is to this Shakti, and Shakti is not somewhere else. She is within, as Kundalini Mata. The Kundalini Shakti inside us is she herself.","Together with this, the Lakshmi mudra is remembered: the way of sitting, and also the way of seeing. In everyone, see the Mother. See the power of Jagadamba. Whether the one who stands before you has come as a man or as a woman, that Shakti is what created them. This whole Prakriti, the whole of nature, is the Mother. She is in every tree. She is in every animal. This feeling has to live in us. She created the entire world. The pancha mahabhutas, the five great elements, stand under her command as well.","The practice is done in the morning, and it is done again at night. Night means whenever it is possible: from six until seven, or from five until six, or before sleep. Any of these hours will do. Once more, as a reminder to oneself. And the nine, done nine times, is a sign. Why nine? There are the nine months. There are the nava avaranas, the nine coverings, which here are the nine openings. These openings govern the human system: two eyes, two ears, the nose, the mouth, the organ of excretion, and the generative organ. He called them the nine coverings, and they are to be crossed. This Shakti is what carries us across. We are not to remain caught in them.","What is asked is a feeling beyond deha bhava, the identity with the body. I am of the form of this Shakti. I am Shakti svarupa, of the very nature of Shakti. We tend to stay instead inside the other feeling. I am a gross person. I am gross matter. I am this physical body. I am the body. The body, understood rightly, is our house and our dwelling. It is not a mistake that it is here. Our Shakti, though, has also to be known, and for that these nine days of sadhana are given.","Then meditation, two or three times, whenever it can be done. Close the eyes, be at ease, turn inward, and keep the attention on the breath. The breath grows subtle. Every change in the breath is to be noticed. That is the whole of it. Do as much of the meditation as you are able.","And celebrate. Enjoyment is the smaller movement. I want an ice cream; I enjoy an ice cream; I celebrate an ice cream. The third of these is a very different thing, because in celebration the want has dropped away. I celebrate my birthday. Enjoyment belongs only to the physical dimension, only to the physical aspect. We are more than the physical, and that is why the word is celebration. With this feeling the nine days are lived. Afterwards it becomes natural. Every day is a celebration. Life is one great celebration. Every single thing in your life is that supreme bliss. Joy, and joy, and joy."],"minutes":7,"words":797},{"title":"Krishnakumari · The Terrace Garden","paras":["It was time for friends to share what had been happening in their practice. Krishnakumari was invited to speak. She offered her namaskara. She is from Vizianagaram. Three years earlier, depression had come upon her, and for a year and a half she had been taking medicines. Bhanu garu came to Vizianagaram, and only then did she hear of meditation. She went, she met him, and she told him her difficulty. He spoke with her, and then he said: Amma, the Jnanodayam classes are going on — please watch them.","From that day she watched the classes. She spoke with Bhanu garu, and she spoke with Harika. Harika guided her, led her in the grounding meditation, and showed her how to practise. As she continued, a change arrived slowly. She stopped the medicines. A year and a half has now passed since she laid them down. She is doing her work well. On the terrace they have also made a garden. In the doing of these things, and in the work of the house, a deep change has come in her. She is going on with the sadhana. She had hoped, as well, to come to Quantum Life University, and she had been told that a little more time was still needed, and that for the present these practices were enough. She had raised her hand because she wished to speak with Dr. Newton. As she is now, she is well, and she is happy. She offered her thanks, and her gratitude.","He received the sharing with warmth. Coming out of that depression, he said, has happened through the sadhana, because, seen rightly, this whole of nature is Jagadamba herself. And how near that Mother are you now? You are with the trees. The terrace garden is beautiful — wonderful, full of flowering plants, kept with such care. To sit there in meditation, and to spend time with those flowering plants, is a great and wonderful thing.","In November, Dr. Newton and those with him are themselves coming to Vizianagaram, and to Visakhapatnam. For the friends who are watching, on YouTube as well: from the sixth of November there will be classes in three places — Rajahmundry, Vizag, and Vizianagaram. Krishnakumari said she would certainly meet them there.","Harika added that she had already spoken with him, a day or two before, about Krishnakumari, and that Krishnakumari had told it beautifully. She telephones, and she reports what she has done and the benefit that has come. It is deeply inspiring. If everyone will follow in this way, then what has been learned from the Gurus truly bears fruit. The result certainly comes."],"minutes":4,"words":442},{"title":"Vikram · What the Body Carries","paras":["Vikram then offered his namaskara. He had taken part in the Family Constellation a couple of days before, and Dr. Newton had conducted the constellation. The result had come. The difficulty he had shared there — that process has begun, and very amicably. Things are moving forward. He thanked him for it.","There was something further. The acceptance spoken of in the teaching comes to his mind every day. Why are we here? We are in the midst of some fight. Again and again Dr. Newton says it: what is in the way is the way. When the obstacles seem to increase, when in ordinary life they appear to be growing, when it feels as though a testing is under way, that sentence returns with force. He remembers it, and he acts from it.","One matter he placed before the gathering. For almost eight years there has been a great deal of inflammation in the body, and pain in the shoulder as well. Somewhere in the classes it had been said how a person is likely to feel when responsibility is taken on. What Vikram has come to see is that this may be happening because he has been carrying, beyond measure, the responsibility for other people's emotions. Recently an operation for hemorrhoids had also been suggested. He was on the point of going for it, and he had written to ask whether this was the right time. It would be a laser surgery, not a major one. Should it be done, or should he simply continue, meditating quietly, since changes have already come in his life? He had also been given the chance to speak in Jnanodayam. He thanked Dr. Newton, he thanked Mother, and he thanked Harika. Everything is moving forward, and still the inflammation remains. So something, he feels, is yet to be learned.","Dr. Newton congratulated him. Already those changes are being observed. When the knowledge we receive is implemented, when it is placed in conduct, its fruits arrive, and its results become known. The transmission becomes known inside us.","The body itself is a great indicator. It is always informing us about our progress. Some matters still pending, some issues, some burdens, we go on carrying without even knowing that we carry them. A heaviness is felt. In one region of the body there is a weight. The shoulders are bearing something, and it is something that is not one's own. Vikram himself had named it: I am carrying emotions. Recognise that, and let it go. Whatever we are able to recognise, we become able to release.","Hemorrhoids are of the same order, and so is any physical complaint. Behind it an emotion lies hidden, and that emotion has to be dealt with. It certainly has to be dealt with. A person may go for the laser surgery, and there is also an emotion related to the condition. It is called an identity conflict. At home, many difficulties gather around identity. In hemorrhoids there is blood, and the bleeding continues, and a great deal of blood is lost. So there is a difficulty in the blood relationships. It is also a matter of territory. You are questioning your own identity, and your identity has been questioned. While we live on the physical plane we are meant to stand in our own place. That place has not been given. All of this, once we are seated in meditation, is known from the body with still greater accuracy, very precisely. This is what I have to learn. I am carrying this. In the mind I am carrying this burden — this limiting thought, this limiting belief, this emotion, however many of them there are. I let them go. In the state of knowledge, all of this can be clearly received.","Always, before a decision, the intuition has to be asked. Question yourself. Is this the right way? What should I decide? What is my decision? When any decision is to be taken, the answer comes from one's own Atma, and it comes in a symbolic form. That answer is always the right answer. The answer that rises from within, after one has sat in meditation, arrives in one form or another. Whether it comes as yes or as no, that is the answer to be followed.","It was added that Vikram has been with the Jnanodayam classes and is doing very well, and that the feedback has been very good. The hour had moved a little past seven, and there was still room for one more sharing."],"minutes":7,"words":760},{"title":"Naresh · The Eighteen Seats of Shakti","paras":["Naresh offered his namaskara. He has been meditating for seven years, though without a steady regularity. For one month now he has been attending Jnanodayam. He has listened to the twelve classes of Shwasa Mahavidya, the great teaching of the breath. The answer to every question, he said, is here itself, inside Jnanodayam. And today, through this class, he had been able to learn how pranama, the reverent bow, is offered to Jagadamba, to Shakti. Then he asked that the Ashtadasha Shakti Peethas, the eighteen seats of Shakti, might be explained.","Every Shakti Peetha, Dr. Newton said, is a continuity. Look at the way these seats are built. They are raised with enormous weight, with many tons of stone. In a Shakti Peetha there is a temple, and it is very ancient. Why should it be so? For the sake of continuity. There the Shakti is held in an unbroken stream. A Jyotirlinga, a linga of light, or any one of the eighteen Shakti Peethas: always there is a parampara, a succession reaching back a very long way. That great power, present from so long ago, keeps being built up. The sadhakas who go there and sit in meditation are deeply fulfilled, and the energy of the place is put to use.","The eighteen seats would be spoken of in the classes still to come. Seven days of this Navaratri remain. They can be taken up in detail, and if they are taken up properly the telling occupies more than an hour. It is, for him, a deeply interesting subject. These peethas are power spots. He and those who travel with him are wanderers upon them. They go, they practise, they sit in meditation, in order to feel that energy. The account of them would certainly be given. He thanked Naresh for the sharing."],"minutes":3,"words":304},{"title":"Mahishasura Mardini · Until Tomorrow","paras":["He then asked Harika to let them hear the Mahishasura Mardini once more today. While she sings, the hymn can be received in a meditative state. The eyes may be closed, or they may stay open. Either way, the stotram is simply listened to.","Harika sang the Mahishasura Mardini Stotram through to its traditional close. It opens with the line, Ayi girinandini nanditamedini viśvavinodini nandinute. The inner meaning of her coming as Mahishasura Mardini had already been left for another day, when it would be decoded. Today the listening itself was the practice.","When the hymn ended, he thanked her. Such a divine experience, he said. Very profound.","Friends of Jnanodayam, we meet again tomorrow in the class. Surya was asked to share the slide, and the second day of Devi Navaratri came to its close."],"minutes":2,"words":136}];
