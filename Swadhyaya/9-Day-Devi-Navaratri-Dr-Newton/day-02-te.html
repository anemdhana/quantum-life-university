</style></head><body><div class="app lang-te"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-01-te.html">Prev</a><a href="day-03-te.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">ఖాళీ పాత్ర · శక్తి · చైతన్యం · దేవీ నవరాత్రులు · Day 2</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">ఖాళీ పాత్ర · శక్తి · చైతన్యం</span></div><div class="tools"><span class="lang-switch"><a href="day-02-te.html" class="active">TE</a><a href="day-02-en.html">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-01-te.html">Prev</a><a href="day-03-te.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"ధ్యాన ప్రారంభం · ఖాళీ పాత్ర","paras":["జ్ఞానోదయం కార్యక్రమంలో 562వ రోజుకి స్వాగతం. నవరాత్రులలో రెండవ రోజు ఈరోజు అండ్ మనం ఈరోజు కూడా డాక్టర్ న్యూటన్ గారి నుంచి జ్ఞానం స్వీకరిస్తాం మరి దానికి ముందురా మనల్ని మనం సిద్ధం చేసుకోవాలి. జ్ఞానం మనలో నిండాలని అంటే ఫస్ట్ మనము ఖాళీ పాత్రగా తయారవ్వాలి.","సో ధ్యానమే దానికి మార్గం అందరం చక్కగా ఆనాపానసతి ధ్యానం ప్రాక్టీస్ చేద్దాము 40 నిమిషాల పాటు 45 నిమిషాల పాటు చక్కగా సుఖాసనంలో కూర్చుందాం పాదాలు రెండు క్రాస్ చేసుకొని వేళ్ళలో వేలు పెట్టుకొని కళ్ళజోడు ఉంటే కళ్ళజోడు తీసేసి హాయిగా ఒక చిరునవ్వుతో కళ్ళు రెండు మూసుకొని సహజంగా జరిగే శ్వాస క్రియని గమనిస్తూ ఉందాం. ఇలా గమనించడం ద్వారా మన ఇంద్రియాల్ని లోపలికి తీసుకుంటున్నాం. మన ధ్యాసని శ్వాస మీద ఉంచటం ద్వారా అంతర్ముఖులం అవుతున్నాం. బాహ్యంతో పని లేదు.","ఈ 45 నిమిషాలు అంతర ప్రయాణం కోసం మాత్రమే ఆలోచనలు వస్తే మళ్ళీ తిరిగి మీ ధ్యాసని శ్వాస మీదకి తీసుకురండి. ఆలోచనలు ఎప్పుడూ ప్రస్తుత క్షణంలో ఉండవు. కానీ మనం జీవించేది ఈ క్షణంలో మాత్రమే మనం గతంలోనూ భవిష్యత్తులోనూ జీవించలేం. ఆలోచనలు మన శక్తిని వృధా చేస్తూ ఉంటాయి. మన ధ్యాసని శ్వాస మీద ఉంచినప్పుడు మన శక్తి మన లోపల ఉంటుంది. మూత్వ ముఖంగా చేరుతూ ఉంటుంది.","పూర్తి ఎరుకతో ఉందాం అంతర్ముఖలం అవుదాం శ్వాసగా ఉందాం ఓం ఆ ఆ ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఆ ఆ ఆం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం అలా 10 నిమిషాలు శ్వాసతో ఉందా ఎరుకతో ఉందా గమనిస్తూ ఉన్నాం.","ఆ మన ధ్యాసని కళ్యాణం కోసం ఈ సంకల్పం ధ్యానం చేద్దాం థాంక్యూ ఇప్పటికీ నాగా మైన పిరమిడ్ నిర్మాణం నానవారి అంతర్గతంగా తాకి ఉన్న జ్ఞానం మేల్కోవాలని అందరి హృదయాలు నా మై ఆనందం జాగృతమఅవ్వాలని సంకర్త ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం భారమైన పోతూ ఉంది ప్రపంచ నలుమూలల నుండి ఎంతో మంది ఇక్కడికి వచ్చి ధ్యానం చేసి తానే తాను తెలుసుకుంటూ ఉన్నారు. ఆత్మజ్ఞానాన్ని బ్రహ్మ జ్ఞానాన్ని పొందుతూ ఉన్నారు.","ఈ ఆధునిక దక్షశిల ద్వారా ఎంతో మంది కరుణామయులుగా జ్ఞానవంతులుగా తయారవు తూ ఉన్నారు ఇందులో ఈ సహస్రారా పిరమిడ్ అజ్ఞాన దీప స్తంభంగా జ్ఞానపు వెలుగుగా అందరికీ మార్గ నిర్దేశం అవుతుంది. ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఆ ఆ ఓం వెరీ ఒక్క నిమిషం ఐ సెకండ్ అది సెకండ్లు ఐదు నాలుగు మూడు రెండు ఒకటి సున్నా నెమ్మది నెమ్మదిగా మీ చేతులు రెండు కొద్ది క్షణాల పాటు కళ్ళ మీద ఉంచుకొని ఒక చిరునవ్వుతో నెమ్మది నెమ్మదిగా కళ్ళు రెండు తెరుద్దాం. వెల్కమ్ బ్యాక్ టు యువర్ ఫ్రెండ్స్ మరి నవరాత్రుల్లో రెండవ రోజుకి వచ్చేసాం.","ఈరోజు కూడా మనం చక్కగా అందరం జూమ్ లో ఉన్నవారంతా కూడా కెమెరాస్ ఆన్ చేసుకొని మన క్యూఎల్యూ ఫౌండర్ అండ్ చైర్మన్ బ్రహ్మర్షి చక్రవర్తి డాక్టర్ న్యూటన్ కొండవీటి గారిని ఆహ్వానించుకుందాం. ఈరోజు జ్ఞానానికి అందరూ సిద్ధమే కదా అందరం కెమెరాస్ ఆన్ చేసుకొని ఒక చిరునవ్వుతో సర్ ని వెల్కమ్ చేసుకుందాం. థాంక్యూ సర్ అండ్ ఓవర్ టు యు సర్ వండర్ఫుల్ జ్ఞానోదయం శుభోదయం వండర్ఫుల్ ఫ్రెండ్స్ దేవీ నవరాత్రులలో మనం అంతరార్థ సైతంగా తెలుసుకుంటున్నాం. అంతరార్థాన్ని తెలుసుకోవాలి అప్పుడే మనం ఈ దేవీ నవరాత్రులను సెలబ్రేషన్ చేసుకోగలం. నిన్న కొన్ని విషయాల గురించి మాట్లాడుకుందాం.","ఈ సృష్టి అంతా కూడా ఈ శక్తి పరాశక్తి అపరాశక్తిగా ఇక్కడికి వచ్చి దేవీ శక్తిగా ఈ సర్వ సృష్టినింతా సృష్టి చేస్తుంది ఆ పరమేశ్వరి మొత్తం అంతా యూనివర్స్ అంతా కూడా ఈ బ్రహ్మాండం అంతా కూడా శక్తి చైతన్యములే ఈ రెండే శక్తి చైతన్యము పట్టుకోవాల్సిన పాయింట్స్ రెండే రెండు ఆధ్యాత్మిక ఈ జ్ఞానము సంబంధించిన ఈ శాస్త్రం సంబంధించిన దానిలో రెండే రెండు ఉన్నాయి. ఒకటి శక్తి రెండు చైతన్యము శక్తిని మనము పార్వతీ మాత అంటాం.","అంటే ఎన్నో నామాలు ఇచ్చాము ఎన్నో దుర్గాదేవి అంటాము లేకపోతే వేరే వేరే పేర్లు ఎన్నో నామాలు ఆదిశక్తి అంటాం పరాశక్తి అంటాం పరమేశ్వరి అంటాం ఆ చైతన్యాన్ని శివుడు అంటాం ఈశ్వరుడు అంటాం సర్వేశ్వరుడు సర్వాంతర్యామి సర్వవ్యాపకుడు సర్వ పరమాత్మ అని అంటాం. సో తెలుసుకోవాల్సిన పాయింట్స్ ఓన్లీ రెండే కానీ శక్తిని గురించి తెలుసుకోకపోతే చైతన్యం గురించి తెలియదు. అందుకే మన భారతదేశంలో ఈ దేవీ నవరాత్రులు ఈ తొమ్మిది రోజులు కూడా ఈ శక్తి గురించి తెలుసుకోవడానికి అనుభవం చెందడాని కోసంగా ఈ పండగని మనం చేసుకుంటాం.","ఈ సెలబ్రేషన్స్ మనం చేసుకుంటాం ఇది ఎంజాయ్మెంట్ కాదు చాలామంది ఎంజాయ్మెంట్ సెలబ్రేషన్ ఆ తేడా తెలియదు చాలామందికి ఎవరి ఎంజాయ్మెంట్ వాళ్ళది ఒక కోరిక ఉంటుంది ఆ కోరిక తీరితే అది ఎంజాయ్మెంట్ అనుకుంటారు వెళ్లి తాగడము ఒక సినిమా చూస్తే అది ఎంజాయ్మెంట్ అనుకుంటారు. కానీ సెలబ్రేషన్ వేరు ఐ వాంట్ దిస్ ఐ ఎంజాయ్ దిస్ అక్కడ వాంట్ ఉంది అంటే కోరిక ఉంది తృష్ణ ఉంది అది ఎంజాయ్మెంట్ సెలబ్రేషన్ లో అది లేదు ఆనందం ఆనందం ఉత్సవం అది ఎలా ఉన్నా కూడా మీరు ఆనంద పడుతుంటారు.","అందుకే దేవీ నవరాత్రులని సెలబ్రేషన్స్ కింద మనం చేసుకున్న ఉత్సవాలు ఇవి మామూలుగా ఇది జస్ట్ జాయ్ కాదు ఇది ఒక ఆల్ పర్వేడింగ్ జాయ్ గ్రేటెస్ట్ సెలబ్రేషన్ శక్తి సాధనకు అనుకూలమైనటువంటి రోజులు ఈ దేవి నవరాత్రులు ఎవరైతే ఇంకా లైఫ్ లో స్ట్రగుల్ అవుతున్నారో ఎవరైతే ఇంకా స్టక్ అయిపోయిన్నారో ఎవరైతే ఇంకా వాళ్ళు ఆన్సర్స్ గురించి నాకు ఇంకా ఆన్సర్స్ లేవు రాలేదు అంటే వాళ్ళు సాధన చేస్తే డెఫినెట్లీ ఆ సాధన ఫలం పొందుతారు ఎందుకంటే వెయి రెట్లు ఎక్కువ ఆ పరాశక్తి ఆదిశక్తి యొక్క ఆ శక్తి ఇక్కడ అవ అవైలబుల్ గా ఉంటుంది అనుకూలమైనటువంటి దినాలు ఇప్పుడు శక్తి స్వభావము రెండు రకాలుగా ఉంటుంది అది మీరు గుర్తించగలరు గమనించగలరు.","ఒకటి మన మన లోపలికి వచ్చే శక్తి రెండోది బాహ్యంలోకి వెళ్లే శక్తి రెండు ఉంటాయి అంటే స్వభావాన్ని బట్టి డైరెక్షన్ బట్టి మన లోపలికి వచ్చేది మన లోపలికి మనం తీసుకొని మన లోపల ఉండే ఆ శక్తిని వినియోగించుకుంటాం అంతరంలో దాన్నే మనం మహిళా తత్వము అంటాం. మహిళా తత్వము బాహ్యంలో ఏదైతే ఆ శక్తి ఏదైతే ఉందో అది డైరెక్షన్ బాహ్యంలోకి ఉంటే మాస్క్లైన్ అంటాం. ఒకటి ఫెమినైన్ రెండోది మాస్కులైన్ ఫెమినైన్ ఇంటర్నల్ మాస్కులైన్ ఎక్స్టర్నల్ ఈ రెండు మనం తెలుసుకోవాలి ఫస్ట్ ఎందుకంటే ఈ సాధన ఈరోజు సాధన గురించి ఎక్కువ ఒక ప్రాసెస్ మనం అందరం కూడా నేర్చుకుందాం.","ఇది ప్రతిరోజు ఇది ప్రాక్టీస్ చేయడానికి ఈ సాధన గురించి మనం తెలుసుకుందాం. ఈ శక్తి స్వభావము ఒకటి ఫెమినైన్ ఫెమినైన్ అంటే మహిళా తత్వము మహిళ తత్వము ఎప్పుడూ కూడా అంతరంలో ఉంటుంది.","బాహ్యంలోకి వెళ్ళేది మాస్క్లైన్ ఆ మాస్కులైన్ క్వాలిటీ ఏంటంటే అంటే పురుష తత్వం యొక్క క్వాలిటీ ఈ ఫిజికల్ డైమెన్షన్ లో అది ఎప్పుడు కూడా బాహ్యం పాస్కలైన్ ఎప్పుడు కూడా బాహ్యమే ఎక్స్టర్నల్ అందుకే ఎక్కువ మహిళ మహిళలంతా కూడా ఎక్కువగా వాళ్ళ సహజ తత్వానికి సహజత్వానికి దగ్గరగా ఉంటారు చేరువుగా ఉంటారు వాళ్ళు ఆత్మతత్వానికి గాని వారి యొక్క హార్ట్ కి గాని వారి యొక్క ఇంట్యూషన్ కి గాని చాలా దగ్గరగా ఉంటారు వారు పురుషతత్వం బయట బాహ్యంగా ఇక్కడ ఎక్స్ప్రెస్ అవుతుంది ఈ శక్తి ఈ తొమ్మిది రోజులు కూడా మనం","ఇది దేవీ నవరాత్రులు ఫెమినైన్ అంటే మనంఅందరం కూడా మొత్తం అంతా ఆ దేవీ మాతనే చూడాలన్నమాట అంతా కూడా మనలో కూడా మనం దేవీ మాతనే చూసుకోవాలి డెడికేటెడ్ ఇది మనం ఆ దేవీ మాతకు సమర్పణం చేసుకుంటున్నాం ఒక సమర్పణ భావన కావాలి మనకి ఈ తొమ్మిది రోజులు మనం చేసే ప్రాక్టీస్ ఏందంటే మన బాహ్యంగా వెళ్ళకుండా ఎక్కువగా ఎనర్జీని స్కాటర్ చేసుకోకుండా మన శక్తిని బయట బాహ్యంగా వినియోగించకుండా మన లోపలికి పెట్టుకొని ప్రతి కూడా మహిళ మరియు పురుషులు అందరూ కూడా చేయాల్సిన సాధన ఇది ఇది డైరెక్షన్ మార్చడం మనం ఈ తొమ్మిది","రోజులు మాత్రం ఇది చేస్తాం తర్వాత మళ్ళ మనం ఎన్నైనా చేసుకోవచ్చు.","ఈ తొమ్మిది రోజులు కూడా మన ఎనర్జీని మన శక్తిని బయట బాహ్యంగా స్కాటర్ చేయం ఆర్ వేస్ట్ చేయం మన లోపల కంటెన్ చేయాలి మన లోపల మల్టిప్లై చేయాలి ఈ శక్తిని ఇద క్షన్ అనేది ఏర్పడింది.","వాళ్ళలో వాళ్ళతో మనం సన్నిహితంగా దగ్గరగా ఉండడం వలన వాళ్ళ ప్రెసెన్స్ అంటే మీరు ఉన్నారు నాతో ఉన్నారు అనే భావన మనలో ముద్రించిపోయింది. ఆ ప్రెసెన్స్ నే ఈ తొమ్మిది రోజులు కూడా దేవి నవరాత్రుల సందర్భంగా ఆ పరాశక్తి ఆ ఆదిశక్తి ప్రెసెన్స్ ని మనం ఫీల్ కావాలి. ప్రెసెన్స్ ఇంపార్టెంట్ ఫీల్ హర్ ప్రెసెన్స్ ఆమెకు మన తల్లి ఆ శక్తియే మన తల్లి చైతన్యమే మన తండ్రి ఆ శక్తియే మన తల్లి మన మాతృమూర్తి మన భౌతిక దేహానికి మన తల్లి మన భౌతిక దేహానికి మన తండ్రి ఉన్నారు కానీ ఇది మనం ఆధ్యాత్మిక పరంగా చెప్పుకుంటున్నాం.","మన తల్లి శక్తి ఈ తొమ్మిది రోజులు కూడా ఆ యొక్క దేవీ శక్తి ఆ దేవీ మాత ప్రెసెన్స్ ని ఫీల్ అవుదాం. ఫస్ట్ ప్రెసెన్స్ ఫీల్ కావాలంటే ఆ అనుభవం చెందాల. అనుభూతిని పొందాల మనమేమి ఆ అనుభవము ఎలా పొందుతామ అంటే రూపం అక్కర్లేదు ఎన్నో రూపాల్లో ఆవిడకి దర్శనం ఇస్తుంటుంది. ఒక నిర్గుణము సగుణంగా అవ్వడానికి అంటే ఏ ఆకారము ఏ షేపు ఏ రూపము లేనటువంటిది ఏ నామము లేనటువంటి ఆ దేవతా శక్తి ఆదిశక్తి పరాశక్తి ఒక రూపాన్ని ధరిస్తే ఎలా ఉంటుంది అలా ఎంతో మంది యోగులు ఋషులు దర్శించారు.","మనం ఇప్పుడు చూసే పిక్చర్స్ గాని మనం దేవాలయంలోకి వెళ్తాం దేవాలయాల్లో ఉండే అవన్నీ కూడా మహిషాశుర మర్దినే ఆవిడ పిక్చర్ అనేది అక్కడ ఉంటుంది. ఎందుకు అలా దర్శనం జరిగింది.","వారందరూ ఎంతో మంది ధ్యానులు ధ్యాన స్థితిలో ఆ యొక్క పరాశక్తి రూపాన్ని దర్శించాలి అనుకున్నారు ఎందుకంటే ఆ నిర్గుణంగా ఉన్నది నిరాకారంగా ఉన్నది ఏం చూస్తాం ఏమీ ఉండదు రిలేట్ చేసుకోలేము ఒక నామము ఒక రూపము ఏర్పడితే ఎలా ఉంటుందో అది దర్శనం అయింది వారందరికీ కానీ కానీ ఈ ఈ దేవీ నావరాత్రుల సందర్భంగా ప్రెసెన్స్ ఫీల్ కావడం ఇంపార్టెంట్ ప్రెసెన్స్ ప్రెసెన్స్ దానికి రూపం అక్కర్లేదు నామం అక్కర్లేదు అది శక్తి మీరు ఏ పేరులో పిలిచినా అమ్మ అమ్మే అమ్మ అనుకోండి అంతే ఆమె ఏ పేరుతో పిలిస్తే ఆ పేరుతో ఆ నాయనా అమ్మ నేను వస్తున్నాను అందరినీ హత్తుకుంటుంది.","దగ్గరికి తీసుకుంటుంది. సో ఈ యొక్క తొమ్మిది రోజులు కూడా మనం ప్రాక్టీస్ చేయాల్సిన పాయింట్స్ మీకు చెప్తున్నాను. ప్రెసెన్స్ ఫీల్ కావడము ఆ దేవీ మాత ప్రెసెన్స్ అమ్మ మన దగ్గరే ఉంది మనలో ఉంది ఆమె వేరు కాదు మనం వేరు కాదు ఆమె మనం అయిపోతాం ఆ శక్తి మనం వేరు కాదు ఆ శక్తే మనం కానీ ఫస్ట్ వేరుగా చూస్తాం ఆ అనుభూతి చెందాలంటే ఆ ప్రెసెన్స్ ఫీల్ కావాలి. రెండవది లక్ష్మీ ముద్ర అంటే మీరు కూర్చునే విధానము మీ ఎడమకాలు కుడి కాళ్ళ మీద ఉండాలి. ఎడమ చెయ్యి కుడి చేయి మీదగా పైన ఉండాలి. అంటే మహిళా తత్వానికి ఎక్కువగా మనం ప్రాధాన్యత ఇస్తాం.","ఈ తొమ్మిది రోజులు ఓన్లీ మహిళలకు కంప్లీట్ గా అంకితం మాతా శక్తికి అంకితం సరెండర్ ఎందుకంటే శక్తి లేకపోతే శివుడు కూడా శేవమే."],"minutes":6,"words":893},{"title":"లక్ష్మీ ముద్ర · అంతర్ముఖం","paras":["సో ఇంకొకటి లక్ష్మీ ముద్ర అంటే కూడా మనం బాహ్యంలోకి మన ఎనర్జీని స్కాటర్ చేయకుండా వేస్ట్ చేసుకోకుండా దుర్వినియోగ పరుచుకోకుండా ఈ తొమ్మిది రోజులు సాధన కోసం అంతర్ముఖం కావడానికి వినియోగించుకోవాలి మన శక్తిని చాలా విధాలుగా దుర్వినియోగ పరుస్తుంటాం ఇది చాలా అమూల్యమైనటువంటి శక్తి దీన్ని చక్కగా మనం అంతర్ముఖ స్థితిని పొందడానికి వినియోగించుకోవాలి మన లోపల ఎన్నో ఉన్నాయి రహస్యాలు దాగి ఉన్నాయి ఎన్నో గొప్ప గొప్ప జ్ఞానాలు ఉన్నాయి మనలో వాటిని తెలుసుకోవడానికే ఈ శక్తి కావాలి మనకి శక్తి లేకపోతే మనం ఎక్కడ ఉన్న గొంగలి అక్కడే ఉంటుంది.","ఎక్కడ వేసిన గొంగలి అక్కడే ఉంటుంది. అనే సామెత ఉంది కదా అలానే మనం కూడా మన జీవితంలో ఎన్నెన్నో కళ్ళలు కంటాం ఆధ్యాత్మికంగా కూడా ఎన్నో కళ్ళలు కంటాం నేను నా అజ్ఞా చక్రాన్ని చేరుకోవాలి సహస్రారం కావాలి సహస్రార స్థితిని పొందాలి మోక్ష జ్ఞానం పొందాలి ఈ జన్మ మరణ చక్రాలు దాటాలి ఓ ఎన్నో కర్మలు ఎంతో భారంగా ఉంది నాకు నా భారాన్నంతా వదిలేయాలి ఇవన్నీ మనకి మనకి అనుకుంటూ ఉంటాము సాధనలో చాలా మంది వరకు స్టక్ అయిపోయిఉంటారు. ఎక్కడ వేసిన బొంగలి అక్కడే ఉండకూడదు.","ఈ శక్తిని దుర్వినియోగ పరుచుకోకూడదు మాటల ద్వారా గాని చేష్టల ద్వారా గాని బాహ్యంలో ఎక్కువగా పారిపోతుంటాం బాహ్యంలోకి వెళ్తుంటాం బాహ్యంలో ఎక్కువ అంతర్ముఖులం కావాలి అంతర్ముఖులం కావాలి మన లోపలే ఈ శక్తి ఎంతగా మన లోపల చక్కగా మనం అంతర్ముఖులం చెంది ఆ శక్తిని మన లోపల అనుభూతి చెందుతుంటే ఆ శక్తి డైరెక్షన్ చేంజ్ అవుతుంది ఊర్ధముఖంగా వెళ్తుంది.","అధవ ముఖంగా వెళ్లి బాహ్యంలోకి వెళ్ళిపోకూడదు బుద్ధి ముఖంగా వెళ్ళాలి తర్వాత ఈ తొమ్మిది రోజులు కూడా ఒకటి ప్రాక్టీస్ చేయాలి దీన్నే యక్సెప్టెన్స్ అని అంటామట ప్రతి ఒక్క విషయాన్ని ప్రతి పరిస్థితిని మనం యక్సెప్ట్ చేయాలి అంతే మన గతాన్ని కూడా యక్సెప్ట్ చేయాలి. గతాన్ని పాస్ట్ ని కంప్లీట్ గా యక్సెప్ట్ చేయాలి. ఓ గతంలో నేను ఇలా చేసిుంటే బాగుండేది నేను ఇప్పుడు బాధ నేను తీసుకున్న నిర్ణయంకి బాధపడుతున్నాను.","ఓ గతంలో ఇలా జరగకుండా ఉండాల్సింది ఇలా కావాలి సో గతాన్ని కంప్లీట్ గా మనం స్వీకరించాలి యక్సెప్ట్ చేయాలి ఈ ప్రెసెంట్ వర్తమానంలో మీ పరిస్థితుల నుంచి ప్రతి ఒక్కటి కూడా యాక్సెప్ట్ చేయాలి మీతో ఉన్న వ్యక్తులు గాని మీ పరిస్థితులు గాని ఎలా ఉన్నారో దాన్ని దానిగానే స్వీకరించాలి యాక్సెప్ట్ చేయాలి యక్సెప్ట్ అంటే స్వీకరించడం అంగీకరించడం ఓకే ఏముంది నాకు ఈ డిఫికల్టీ ఉంది ఇది ఈ కష్టం వచ్చింది దీన్ని నేను కంప్లీట్ గా అంగీకరిస్తున్నాను ఒక కారణంతో వచ్చింది.","దాన్ని నిరాకరించకూడదు ఏ పరిస్థితిని ఏది నిరాకరించకూడదు రిజెక్ట్ చేయకూడదు యక్సెప్ట్ చేయాలి మీరు తినే ఆహారంలో వగరుగా అనిపించింది యక్సెప్ట్ చేయాలి బిటర్ గాడ్ వచ్చింది కాకరకాయ తిన్నారు మీకు ఇష్టం లేదు కానీ యక్సెప్ట్ చేయండి కాకరకాయని కూడా యక్సెప్ట్ చేయాలి. మధురమే కాదు ఏవి వస్తుంటే వాటినఅన్నిటిని యాక్సెప్ట్ చేయడమే అన్నిటిని యాక్సెప్ట్ చేయడం కాకరకాయ లాంటి మనుషులు కూడా ఉంటారు.","మధురంగా ఉండే మనుషులు ఉంటారు ఉప్పగా ఉండే మనుషులు ఉంటారు తీయగా మాట్లాడే మనుషులు ఉంటారు అందరినీ వారిని వారుగా మనం అంగీకరించాలి ఎక్స్పెక్టేషన్స్ డ్రాప్ చేయండి నో ఎక్స్పెక్టేషన్స్ నో ఎక్స్పెక్టేషన్ వీళ్ళు మారాలి వీరు ఇలా కావాలి అలా కావాలి ఏమీ వద్దు యక్సెప్ట్ యక్సెప్ట్ యక్సెప్ట్ మిమ్మల్ని మీరు యాక్సెప్ట్ చేసుకోండి మీ మనం ఉన్న స్థితిలో మనం ఏ ఉన్న స్థితిలో ఉన్నామో ఇప్పుడు ఉన్న స్థితిని మనం యక్సెప్ట్ చేసుకోవాలి అప్పుడే నెక్స్ట్ స్టేట్ కి మనం వెళ్ళగలుగుతాం నెక్స్ట్ స్థితికి వెళ్తాం. ఇప్పుడు ఉండే స్థితి నుంచి ఇంకొక స్థితికి వెళ్తాం.","కానీ ఈ స్థితిని మనం యక్సెప్ట్ చేయాలి. దాన్ని కంప్లీట్ గా అంగీకరించాలి స్వీకరించాలి. ఇది మనం ఈ తొమ్మిది రోజులు ప్రాక్టీస్ చేయాలి. మీరు చక్కగా రాసుకోండి ఏదే ఏ ఎక్స్పెక్టేషన్స్ ఉన్నాయి ఏ యాక్సెప్ట్ చేయలేకపోతున్నారు మీ లైఫ్ లో మీ వ్యక్తులు కావచ్చు పరిస్థితులు కావచ్చు మీ లైఫ్ లో జరుగుతున్న ఏవైతే జరుగుతున్నాయో అవన్నీ కూడా ఏవి యాక్సెప్ట్ చేయలేకపోతున్నారు. ఈ తొమ్మిది రోజులు యాక్సెప్టెన్స్ అనేది కంప్లీట్ యాక్సెప్టెన్స్ అనేది ప్రాక్టీస్ చేద్దాం. టోటల్ యక్సెప్టెన్స్ పొద్దున్న లేసినప్పటి నుంచి పడుకు రాత్రి పడుకునేంతవరకు మనం సెలబ్రేషన్ లో ఉంటాం.","సెలబ్రేషన్ అంటే వెళ్లి తాగి తంగనాలు ఆడటం కాదు అది కాదు సెలబ్రేషన్ అం  మనం చైతన్యం అనుకుంటే ఇది శక్తి ఈ రెండిటి యొక్క కలక సృషం నాడు వెళ్లి హిట్ చేస్తుంది అజ్ఞా చక్రం దగ్గర శివ ఈ శక్తి శివుడు యొక్క కలయక శక్తి చైతన్యం యొక్క కలయక చంద్రనాడి సూర్యనాడి యొక్క కలయక అది సుషమణ నాడిగా అగ్ని నాడిగా వ్యక్తపరచబడుతుంది ఆయన ఫైనల్గా కాబట్టి రోజు ఉదయం లేచిన తర్వాత మనం ఒక ప్రాసెస్ చేయాలి.","ఈ తొమ్మిది రోజులు మనం చేద్దాం మళ్లా సాయంత్రం కూడా చేద్దాం ఒకసారి రెండు సార్లు చేసుకుందాం అంటే రిమైండింగ్ అబౌట్ మనల్ని మనం రిమైండ్ చేసుకోవడానికి దేవీ సమర్పణ ఆ శక్తికి ఆదిశక్తికి పరాశక్తికి సమర్పణ భావంతో ఉండడానికిఅని మనం మనం మన కల్చర్ లో మనకి బవిబింగ్ డౌన్ అనేది మనం చిన్నప్పుడే మనకి మన పెద్దల నుంచి నేర్చుకున్నాం ఎవరికీ పాదనమస్ నమస్కారం చేస్తాం ఎవరికి మనం శిరస్సు వంచి నమస్కరిస్తాం భగవంతుడికి దేవుడి దగ్గరికి వెళ్ళినప్పుడు మన అమ్మ నాన్నలు చెప్తారు శిరస్సు వంచి నమస్కరించు శిరస్సు వంచాలి ఒకసారి సాష్టాంగం చేస్తాం నమస్కరిస్తాం ఇది చాలా ఇంపార్టెంట్ మన తల్లిదండ్రులకు కూడా మనం నమస్కరిం ంచుకుంటాం ఎట్లా పాదాలు నమస్కరించుకుంటాం.","మన శిరస్సుని వంచి నమస్కరిస్తాం. ఒక గుడిలోకి మనం వెళ్ళాం ఆ గుడిలో కూడా ఆ నిర్మాణం కూడా ఎలా ఉంటుంది ఎన్నో క్రాస్ అయి లోపలికి వెళ్తే గర్భగుడి ఆ ద్వారం చిన్నది అవుతూ ఉంటుంది ఒక్కొక్క ద్వారం ద్వారా వెళ్లి లోపలికి వెళ్ళే కొద్ది చిన్న చిన్న ద్వారాలు ఉంటాయి తల వంచాలి అప్పుడు ఈ తల అనేది ఈ శిరస్సు అనేది అహంకారం చాలా అహంకారం అవుతుంది. తల పొగురు వచ్చింది అంటాం తలకఎక్కింది అంటాం వాడి తలకి బాగా ఇప్పుడు మనీ వస్తుంది పవర్ వస్తుంది స్టేటస్ వస్తుంది ఒక పొజిషన్ వస్తుంది చాలామందికి హెడ్ లోకి వెళ్ళిపోతారు కదా అహంకారం వస్తుంది.","తలవంచాలి ఈ దేవీ మాత అంటే ఈ శక్తికి తలవంచాలి మనం ఈ శక్తి ఆధారంగా మొత్తం సృష్టి అంతా జరుగుతుంది. ప్రతి ఒక్కటి శక్తి ద్వారానే జరుగుతుంది. తెలవంచాలు శిరస్సు వంచాలు మన తల్లిదండ్రులకి మనం చిన్నప్పుడు మనం నేర్చి నేర్పించబడ్డాయి ఇవన్నీ కూడా ఒకవేళ మనకి నేర్చుకోకపోతే ఇప్పుడన్నా నేర్చుకోవాలి మన తల్లిదండ్రులు పాదాలకు నమస్కరించుకోవాలి.","వాళ్ళు ఉన్నా లేకపోయినా లోపల మీ హార్ట్ లో ఉన్నా కూడా మీరు వాళ్ళ పాదాలకి మన తల్లి మన తండ్రి వారు లేకపోతే మనం ఇక్కడ వచ్చి ఉండేవాళ్ళం కాదు భూమండలాన్ని మన ఆత్మకి తల్లి తండ్రి అయినటువంటి శక్తి చైతన్యానికి కూడా మనం నమస్కరించుకుంటాం ఈ తొమ్మిది రోజులు మనం ఆ తల్లికి నమస్కరించుకోవాలి దేవీ సమర్పణం తలవంచాలి సో మనమందరం ఒక ప్రాసెస్ ఇప్పుడు మనం తెలుసుకుందాం. ఒకటి మన ఎడమ నాసికారంద్రం ద్వారా శ్వాసని తొమ్మిది సార్లు లోపల తీసుకో తొమ్మిది సంకేత రూపంలో ఎలా అనేది నేను మీకు డెమన్స్ట్రేట్ చేసి చూపిస్తాను.","ఆ శ్వాస తొమ్మిది సార్లు తీసుకున్న తర్వాత అంటే స్టెప్ వైస్ తీసుకోవాలి. తీసుకున్న తర్వాత మన శిరస్సుని బెండ్ చేసి నమస్కార ముద్రలో నమస్కార ముద్రలో బెండ్ చేయాలి శరస్సుని మంచాలి. ఎంత వీలైతే అంత భూమిని తాకగలిగితే ఇంకా వెరీ గుడ్ మీరు కింద కూర్చుని ఉంటే పాస్ పెట్టలు వేసుకొని కూర్చుని ఉంటే మీ నమస్కార ముద్రలో చక్కగా నమస్కారాన్ని భూమికి తాకేట్లుగా మీ తల భూమికి తాకేట్లుగా తాకండి.","ఏ భావంతో తాకుతారు ఏ భావంతో మీ శరస్సు అంతారు దేవీ సమర్పణ నన్ను నేను ఈ శక్తి ఏ జగన్మాత శక్తి ఏ పరాశక్తి అయితే సృష్టి అంతా చేసిందో ఏ పరాశక్తి అయితే నాలో ఉందో నేను సరెండర్ అవుతున్నాను నేను సమర్పించుకుంటున్నాను సమర్పణ భావము ఈ భావంతో మనం మన హెడ్ ని మన శిరస్సుని వంచి ఆ భూమికి తాకే విధంగా తాకలేకపోతే పర్లేదు మీ చేతుల్ని అన్నా భూమిని తాపించండి. ఈ శరస్సు వంచాలి ఇక్కడ అహంకారం మనం కంప్లీట్ గా తెలియించాలి.","మన అహంకారమే మన ప్రధాన శత్రువు మన తల్లి తండ్రి ఎలా నమస్కరించుకున్నామో ఈ తల్లికి కూడా ఆ జగన్మాత ఆ దుర్గామాత కాళీమాత ఎన్నో రూపాల్లో ఉంది ఆ లక్ష్మీ మాత ఆ సరస్వతి మాత ఆ మాత ఎందుకంటే మహిషాశుర మధ్యనగా ఆవిడ వచ్చినప్పుడు అందరూ దేవతలు వచ్చి వాళ్ళ శక్తులన్నీ ఆమెక ఇచ్చారంట అంటే ఆమెలో అన్నీ ఉన్నాయన్నమాట అందరూ దేవతల యొక్క శక్తి ఆమెలోకి మొత్తం జాయిన్ అయిపోయింది ఆమెలో లక్ష్మీ మాత ఉంది సరస్వతి మాతం ఉంది దుర్గా మాత ఉంది అన్నీ ఆవిడే అన్ని శక్తులు కలిటి ఉన్నటువంటి ఆదిశక్తి ఆవిడ ఆవిడ మహిషాశుర మధ్యన అయింది మనం అది వన్ ఆఫ్ ది డేస్ లో మనం డీకోడ్ చేసుకుంటాం అంతరార్థాన్ని తెలుసుకుందాం.","కానీ ఈరోజు ప్రాసెస్ నేర్చుకుందాం.","ఈ ప్రాసెస్ చక్కగా హాయిగా కూర్చోండి చైర్లో కూర్చుంటే చైర్లో ఎలా కూర్చోవాలి అనేది కూడా ఇందాక చెప్పాను నేను మీ యొక్క లెఫ్ట్ లెగ్ పైన ఉండాలి రైట్ లెగ్ పైన ఉండాలి కూర్చునే విధానం ఒకవేళ మీరు కుర్చిలో కూర్చునిఉంటే మీ లెఫ్ట్ లెగ్ మీ ఎడమకాలు కుడికాలు పైన పెట్ట సంకేత రూపంలో మనం మహిళా గత్వాన్ని కి ఆదిశక్తికి ప్రిఫరెన్స్ ఎక్కువ అన్నమాట ఎలా కాళికామాత మరి ఆ ఆదిశక్తి శివుడి [గురకలు] చెస్ట్ మీద కాళ్ళు పెట్టిందో ఆ విధంగా అన్నమాట ఎందుకంటే శక్తికి మనం ట్యూన్ అవుతున్నాం అనుసంధానం అవుతుంది","మనందరికీ తెలుసు విష్ణు ముద్ర అని ఇది విష్ణు ముద్ర అంటే ఈ రెండు ఇండెక్స్ ఫింగర్ మిడిల్ ఫింగర్ ఈ రెండిటిని క్లోజ్ చేసి మిగతా వేళ్ళని మన బొటన్ వేలు ఈ రెండు వేళ్ళు కూడా ఓపెన్ చేసి ఉండడం దీన్ని విష్ణు చూడండి శంఖ రూపంలో ఉంటుంది విష్ణు ముద్ర ఎందుకంటే ఈ నాస్టిల్ క్లోజ్ చేస్తాం రైట్ రైట్ నాస్ట్రిల్ ని క్లోజ్ చేయడానికి మనం ఇది ఉపయోగిస్తా ఉన్నాం.","ఈ రైట్ నాస్ట్రిల్ రైట్ నాస్ట్రిల్ అంటే సూర్యనాడిని క్లోజ్ చేస్తాం ఎందుకంటే చంద్రనాడి అంటేనే శక్తి కాబట్టి సంకేత రూపంలో మహిళా తత్వానికి ట్యూన్ కావడానికి ఆ చంద్రనాడి మహిళా తత్వము మన అంతర్ముఖం చెందడానికి ఇది ఫస్ట్ ఉపయోగపడుతుంది కాబట్టి ఒకసారి చూడండి మీరు చేయొద్దు చూడండి ఫస్ట్ ఇలా పెట్టిన తర్వాత ఈ రైట్ నాస్ట్రిల్ దగ్గర లిటిల్ ప్రెషర్ అప్లై చేయాలి ఎక్కువగా గట్టిగా వెళ్లి నొక్కకూడదు. ముక్కుకి ఇబ్బంది కలిగించకుండా నిదానంగా అలా బ్లాక్ చేయాలి. ఈ నాస్టిల్ని తర్వాత తొమ్మిది సార్లు లోపల పిలుచుకోవాలి ఎలా అని చెప్తాను.","తొమ్మిది సార్లు సక్సెసివ్ గా స్టెప్ వైస్ తీసుకున్నా అంటే నేను లోపలికి మళ్లా బయటకి వదలకూడదు ఇప్పుడు అట్లా కాదు తొమ్మిది సార్లు అంటే నాలో ఫుల్ గా నింపుకున్నాను ఆ యొక్క శ్వాసని కంప్లీట్ గా నింపుకున్నా ఆ తర్వాత తర్వాత మన రెండు చేతిని విష్ణు ముద్ర నుంచి తీసేసి ఇక్కడ నమస్కారం ఇలా ఈ విధంగా నమస్కారం చేసుకోవాలి. తలపైన పెట్టండి ఎందుకంటే మనం తల వంచబోతున్నాం శిరస్సును వంచుతాం తర్వాత అంటే ఇప్పుడు మీరు లోపల బ్రెత్ ఉంది తొమ్మిది సార్లు తీసుకున్న ఆ ఇన్హలేషన్స్ ఉన్నాయి.","ఇన్హలేషన్ అంటే మనం లోపల తీసుకున్న శ్వాస తొమ్మిది సార్లు తీసుకున్నది లోపల ఉంది కదా ఇప్పుడు మన శిరస్సుని వంచి దేవీ సమర్పణం నేను సమర్పించుకుంటున్నాను అనే భావనతో ఆ భావన ఇంపార్టెంట్ ఊరికి మెకానికల్ గా కాదు ఆ దేవీ సమర్పణ చేసుకున్నా అనే భావనతో తలవంచాలి. తలవంచే సమయంలో బ్రీదింగ్ అవుట్ చేయాలి.","ఇప్పుడు ఎంతసేపు మనం కుంభకం చేస్తాం చేయలేం అంటే కొంత హోల్డ్ చేస్తాము వెంటనే ఇలా పెట్టుకొని స్లోగా మనం బబింగ్ డౌన్ అనేది చేస్తాం అన్నమాట స్లోగా మన పాద నమస్కారం చేస్తున్నట్టుగా భావన చేస్తూ మన తలని శిరస్సుని కిందకి వంచి భూమికి తాగగలిగితే వెరీ గుడ్ వెల్ అండ్ గుడ్ ఆ దేవీ మాతకి శరణు శరణు శరణు అని ిది సార్లు లోపల అనుకోండి.","సౌండ్ వైబ్రేషన్ అది నిదానంగా మీ తలని యదా స్థాయికి తీసుకురండి. ఆరో రౌండ్ కి వెళ్దాం ఆరోసారి చేద్దాం. తొమ్మిది సార్లు ఎడమనాసిక ద్వారా చంద్రనాడి ద్వారా లోపలికి శ్వాస పిల్చండి తొమ్మిది సార్లు తర్వాత నమస్కార ముద్రలో శిరస్సుని వంచి భూమిని తాకి సరెండర్ లో కంప్లీట్ శరణాభావంతో ఆ శక్తికి ఆదిశక్తి పరాశక్తి ఏ సృష్టి అంతా చేసింది ఆ శక్తికి సరెండర్ మన ప్రాబ్లమ్స్ అన్నీ అన్నీ సరెండర్ మన కన్సర్న్స్ వరీస్ అన్నీ అప్పుడు స్ట్రీమ్ స్ట్రీమ్ తొమ్మిది సార్లు అనుకోండి. నిదానంగా మన కల మళ్ళ యదా స్థాయికి నిటారుగా తీసుకురండి.","ఇప్పుడు ఏడవ సారి చేద్దాం నమస్కార ముద్ర శిరస్సుని వంచండి ఎంత వంచగలిగితే అంత శ్వాసని బయటకి వదులుతూ శ్వాస కంప్లీట్ గా బయటకి వదిలేయండి. వదిలేస్తూ ఆ బహిర్కుంబక స్థితిలో శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం నిదానంగా మళ్లా తిరిగి అలా స్థాయికి వెళ్ళండి. ఇప్పుడు లాస్ట్ రౌండ్ మీరు మీరుగా చేయండి. ఎందుకంటే ఈరోజు మనం ప్రాక్టీస్ చేయబోతున్నాం మనం నో ఇన్స్ట్రక్షన్స్ మీరే చేయండి. మనము పరిష్కరించలేనటువంటివి ఎన్నో ఉన్నాయి ఎన్నో ఉంటాయి. మన శక్తి కూడా మనం మన సాధన ఎంత చేసుకుంటే అంత శక్తిని మనం లోపల పోగు చేసుకున్నాం.","అది కూడా లిమిటెడ్ గానే ఉంది. కానీ ఈ శక్తిని మనం కంప్లీట్ గా ట్రస్ట్ చేయగలిగితే సరెండర్ కాగలిగితే ఈ శక్తికి ఆ ఫోర్స్ అన్నమాట. డివైన్ ఫోర్స్ ఆ శక్తి సాల్వ్ చేస్తుంది. వాటిని మనం దాటగలిగేట్లు చేస్తుంది. ఏ ఆబ్స్టకల్ అయినా సరే ఎందుకంటే ఇందాక మనం చెప్పుకున్నాం మన తల్లి మనం ఉదయం లేసిన తర్వాత ధ్యాన స్థితిలో మనం ఇది చేద్దాం. సమర్పణ భావంతో శక్తికి సరెండర్ కంప్లీట్ సరెండర్ లో ఉందాం.","ఆ రోజంతా కూడా మనం ఆ ప్రెసెన్స్ ఫీల్ కావాలి ప్రెసెన్స్ ప్రెసెన్స్ ఆ దేవీ మాత యొక్క ప్రెసెన్స్ అంతా అమ్మే ఉన్నారు ఆ అమ్మ జగన్మాత అమ్మే ఉన్నారు అంతా మొత్తం అమ్మే నాన్న మర్చిపోదాం ఇప్పుడు ఈ తొమ్మిది రోజులు నాన్న గురించి మాట్లాడొద్దు మనం నాన్న అంటే ఇష్టం ఉండొచ్చు శివుడు అంటే ఇష్టం ఉండొచ్చు కానీ తక్కువ అని కాదు ఫస్ట్ అమ్మ అమ్మ దగ్గర మనం ఈ బాండింగ్ కావాలి మన అమ్మతో కనెక్షన్ ఫామ్ కావాలి.","మన అమ్మ చాలా ఇంపార్టెంట్ ఈ జగన్మాత నెగ్లెక్ట్ చేస్తాం మనంతా శివుడి దగ్గరికి వెళ్ళిపోతాం మనం డైరెక్ట్ గా శివుడి దగ్గరికి వెళ్ళిపోవాలి కాదు ఫస్ట్ శక్తి శక్తి శక్తి లేకపో ోర్ట్ కూడా చేస్తారు నేను ఇలా చేశాను నాకు ఇలా బెనిఫిట్ అయింది అని సో నాకు చాలా ఇన్స్పైరింగ్ గా అనిపిస్తారు థాంక్యూ మేడం అందరూ ఇలా పాటిస్తే మనం ఏదైతే గురువుల నుంచి నేర్చుకున్నామో మనకి నిజంగా రిజల్ట్ వస్తుంది కచ్చితంగా థాంక్యూ థాంక్యూ హారిక మేడం థాంక్యూ విక్రం గారు నమస్కారం సార్ ఆ మొన్న ఫ్యామిలీ కాన్సలేషన్ లో కూడా పాల్గొన్నాను సర్ మీరు కాన్స్టలేషన్ చేశారు.","అండ్ మీరు చేసిన దానికి ఐ గాట్ ద రిజల్ట్ సర్ ఆ సో ఏదైతే ప్రాబ్లం అక్కడ నేను షేర్ చేశనో ఆ ప్రాసెస్ స్టార్ట్ అయింది సర్ వెరీ అమికలీ అండ్ థింగ్స్ ఆర్ మూవింగ్ ఫార్వర్డ్ సో థాంక్యూ సో మచ్ సర్ ఫర్ దట్ ఆ ఇది కాకుండా ఇంకా లైఫ్ లో మీరు యక్సెప్టెన్స్ ఏదైతే అన్నారో ఇది ఎవ్రీడే అది నాకే థాట్ వస్తుంది సర్.","మనం ఇక్కడ ఎందుకుఉన్నామ అంటే మనం ఏదో ఫైట్ చేస్తున్నాం మనం ఏదో ఫైట్ చేస్తున్నాం మీరు ఎప్పుడు అంటారు కదా వాట్ ఇస్ వాట్ ఇస్ ఇన్ ద వే ఇస్ ద వే అంటారు కదా సో ఎప్పుడైతే ఆటంకలు ఎందుక ఆటంకలు కూడా కొన్ని పెరుగుతాయి నార్మల్ లైఫ్ లో పెరుగుతున్నాయి అనిపిస్తుంది టెస్టింగ్ జరుగుతుందని సో అప్పుడు ఆ థాట్ బాగా ఆ గుర్తెచ్చుకని అలా చేస్తున్నాను సార్ అయితే ఒకటి సార్ ఆ ఆల్మోస్ట్ఎయిట్ ఇయర్స్ నుంచి ఒక ఇన్ఫ్లమేషన్ బాడీలో లో చాలా ఎక్కువ ఉంది. షోల్డర్ పెయిన్ కూడా ఉంది.","ఇది మీరు ఒకసారి అన్నారు కూడా క్లాసెస్ లో రెస్పాన్సిబిలిటీ మనం తీసుకున్నప్పుడు ప్రాబ్లీ ఎలా ఫీల్ అవుతామ అని ఆ నేను రియలైజ్ అయింది ఏంటంటే ప్రాబబ్లీ వేరే వాళ్ళ ఎమోషన్స్ ని ఓవర్ గా రెస్పాన్సిబిలిటీ తీసుకోవడం వల్ల ఇలా జరుగుతుందేమో అని నేను రియలైజ్ అవుతున్నాను సర్ అండ్ అలాగే రీసెంట్లీ హామరాయిడ్ ఆపరేషన్ కూడా సజెస్ట్ చేశారు సర్ జస్ట్ అబౌట్ టు గో ఫర్ దట్ మీకు మెయిల్ చేశను సర్ ఆ టైంలో దట్ ఇస్ దిస్ ద రైట్ టైం టు గో ఫర్ ఇట్ ఇట్స్ ఏ లేజర్ సర్జరీ నాట్ ఏ మేజర్ వన్ కానీ చేయాలా లేకపోతే షుడ్ ఐ","జస్ట్ కంటిన్యూ మాల్గా మెడిటేట్ చేసుకుంటూ ఎందుకంటే లైఫ్ లో చేంజెస్ వచ్చినాయి సర్ జ్ఞానోదయంలో కూడా చెప్పే ఛాన్స్ దొరికింది థాంక్స్ టు యు థాంక్స్ టు మమ్ థాంక్స్ టు హరిక మమ్ సో ఎవ్రీథింగ్ ఇస్ గోయింగ్ ఫార్వర్డ్ అండ్ ఇన్ఫ్లమేషన్ ప్రాబ్లం ఇస్ స్టిల్ దేర్ సో దర్ ఇస్ సంథింగ్ దట్ ఐ హవ్ టు ఏదో ఇంకా నేర్చుకోవాల్సింది ఉంది అని అనిపిస్తుంది థాంక్యూ విక్రం గారు మీకు కంగ్రాాచులేషన్స్ మీరు ఆల్రెడీ ఆ చేంజెస్ మీరు అబ్సర్వ్ చేస్తున్నారు.","మనం ఏదైతే జ్ఞానాన్ని తెలుసుకుంటామో దాన్ని ఇంప్లిమెంట్ చేసినప్పుడు ఆచరణలో పెట్టినప్పుడు దాని యొక్క ఫలాలు మనకు వస్తాయి దాని రిజల్ట్స్ మనకు తెలుస్తాయి. ఆ ట్రాన్స్మిషన్ మనలో తెలుస్తుంది.","ఇప్పుడు మన శరీరం అనేది కూడా ఒక గొప్ప ఇండికేటర్ మన యొక్క పురోభివృద్ధి పురోగతి గురించి ఎప్పుడు కూడా మన శరీరం మనకు తెలియజేస్తుంది కొన్ని ఏదైతే ఇంకా పెండింగ్ ఉన్నాయో ఇష్యూస్ లాగా కొన్ని భారాలు మనం మోస్తుంటాం మనకు తెలియకుండానే అది భారంగా అనిపిస్తుంది ఒక శరీరం భాగంలో ఒక భారంగా ఉంది మీకు ఏదో మోస్తున్నారు మీరు షోల్డర్స్ మోస్తున్నారు ఏదో మీది కానిది మీరు మోస్తున్నారు ఏదో అంటే మీరే చెప్పారు ఎమోషన్స్ మోస్తున్నాను అది రికగ్నైజ్ చేసి అది లెడ్గో చేయాలి అంే మనం ఏదైతే గుర్తించగలుగుతామో అలానే హెమరాయిడ్స్ కూడా అంతే హెమరాయిడ్స్ గాని ఎనీ ఫిజికల్ ఎలిమెంట్ దాని వెనకాల ఒక ఎమోషన్ దాగి ఉంది.","ఆ ఎమోషన్ ని మనం డీల్ చేయాలి కచ్చితంగా చేయాలి. యు మే గో ఫర్ లేజర్ సర్జరీ కానీ ఎమోషన్ దానికి రిలేటెడ్ ఎమోషన్ కూడా ఉంటది ఇస్ కాల్డ్ ఐడెంటిటీ కాన్ఫ్లిక్ట్ ఇంట్లో మనకి ఎన్నో ప్రాబ్లమ్స్ వస్తుంటాయి ఐడెంటిటీ ఎందుకంటే ఇంకోటి హెమరాయిడ్స్ లో బ్లడ్ బ్లీడింగ్ అవుతుంటుంది. బ్లడ్ బ్లడ్ చాలా వెళ్ళిపోతుంది. సో మనం మన బ్లడ్ రిలేషన్షిప్స్ లో ప్రాబ్లం అన్నమాట.","అది కూడా టెర్రిటరీ మీ ఐడెంటిటీని మీరు క్వశ్చన్ చేసుకుంటున్నారు మిమ్మల్ని క్వశ్చన్ చేయబడ్డారు మీ ఐడెంటిటీనే మీకు తెలుసుకోవడానికి మీ ఫిజికల్ ఐడెంటిటీ మన ఫిజికల్ ప్లేన్ లో ఉన్నప్పుడు మన స్థానంలో మనం ఉండాలి కానీ మీ స్థానం మీకు ఇవ్వబడలేదు సో ఇవన్నీ కూడా మనం ధ్యాన స్థితిలో ఉన్నప్పుడు ఇంకా యక్యూరేట్ గా వెరీ ప్రిసైస్ గా మన శరీరం నుంచి మనకు తెలుస్తుంది ఓకే నేను నేర్చుకోవాల్సింది ఇది నేను ఇది క్యారీ చేస్తున్నాను నా మనసులో ఈ భారాన్ని మోస్తున్నాను ఈ లిమిటింగ్ థాట్ లిమిటింగ్ బిలీఫ్ ఎమోషన్ ఎన్ని ఉన్నాయి లెట్ గో చేస్తాను.","ఇవన్నీ కూడా మనకి చక్కగా జ్ఞాన స్థితిలో ఇవన్నీ పొందవచ్చు."],"minutes":7,"words":1064},{"title":"అనుభవాలు · సంకేతాలు","paras":["సో ఆల్వేస్ బిఫోర్ యు డిసైడ్ యు నీడ్ టు ఆస్క్ యువర్ ఇంట్యూషన్ మిమ్మల్ని మిమ్మల్ని క్వశన్ చేసుకోవాల ఇస్ ఇట్ ద రైట్ వేవాట్ ఇస్ వాట్ షుడ్ ఐ డిసైడ్ వాట్ ఇస్ మై deసిషన్ ఏ నిర్ణయం తీసుకోవాలంటే మీరు మీ యొక్క ఆత్మ నుంచి ఆ సంకేత రూపంలో మనకు వస్తుంది ఆన్సర్ వస్తుంది ఎప్పుడు కూడా దట్ ఇస్ ద రైట్ ఆన్సర్ ఎప్పుడు కూడా మన అంత అంతరంలో నుంచి వచ్చిన ఆన్సర్ ఒక ధ్యాన స్థితిలో కూర్చున్న తర్వాత ఆ ధ్యాన స్థితిలో మనకి ఆ ఆన్సర్ వచ్చేస్తుంది ఏదో ఒక రూపంలో మనకి అందించబడుతుంది ఆన్సర్ వెదర్ ఎస్ ఆర్ నో","దాన్ని ఫాలో కావాల్సింది థాంక్యూ ఓకే అండి విక్రం గారు థాంక్యూ ఎక్సలెంట్ థాంక్యూ విక్రం గారు క్లాసెస్ తీసుకున్నారు సార్ జ్ఞానోదయంలో అండ్ హి ఇస్ డూయింగ్ వెరీ వెల్ చాలా మంచి మంచి ఫీడ్బ్యాక్ ఉంది అండ్ సర్ టైం 77 అయింది ఇంకొకటి తీసుకుందాం ఇంకొక షేర్ ఇంకొక షేరింగ్ ఓకే నరేష్ గారు నమస్కారం సార్ నమస్కారం నరేష్ గారు సార్ నేను సెవెన్ ఇయర్స్ గా మెడిటేషన్ చేస్తున్నా సార్ అంటే రెగ్యులారిటీ లేకుండే వన్ మంత్ నుంచి జ్ఞానోదయం అటెండ్ అవుతున్నాను సార్ మీ శ్వాస మహావిద్య 12 క్లాసెస్ విన్నాను సార్","ప్రతి క్వశ్చన్ కి ఆన్సర్ ఇక్కడే ఉంది సార్ జ్ఞానోదయంలో అయితే సార్ ఇప్పుడు జగన్మాతకి శక్తికి ఎలా దా ప్రణామం చేయాలో అది కూడా ఈరోజు నేర్చుకో నేర్చుకోగలిగాను మీ ద్వారా సర్ ఇప్పుడు అష్టాదశ శక్తి పీఠాలు ఉన్నాయి కదా సార్ దాని గురించి మనం ఎక్స్ప్లెయిన్ చేయాలి సార్ ప్రతి శక్తిపీఠం కూడా ఒక కంటిన్యూటీ అన్నమాట అందుకే ఈ శక్తిపీఠాల్లో నిర్మాణాలు చూశరనుకోండి ఎంత పెద్ద పెద్ద హెవీ టన్స్ ఆఫ్ వెయిట్ తో కన్స్ట్రక్ట్ చేస్తారు శక్తిపెడలో ఒక దేవాలయం ఉంటుంది కదా అది ఎంతో ప్రాచీనంగా ఉంటుంది ఎందుకు","కంటిన్యూటీ గురించి అక్కడ ఆ శక్తిని కంటిన్యూటీ గురించి అక్కడ ఒక జ్యోతిర్లింగం గాని ఒక అష్టాదశ శక్తి పీఠాలఅన్నీ కూడా అవి ఎప్పుడూ కూడా ఒక పరంపర ఎప్పటినుంచో ఉన్నటువంటి ఆ గొప్ప శక్తి బిల్డ్ అవుతూ ఉంటుంది.","అక్కడికి వెళ్లి ధ్యాన సాధన చేసిన సాధకులంతా కూడా చాలా తరిస్తారు. ఆ శక్తి వినియోగంచబడుతుంది. సో వీటి గురించి మనం నెక్స్ట్ ఆ ఏడు రోజులు ఇంకా మనకు ఉన్నాయి క్లాస్ లో మీకు ఈ అష్టాదశ శక్తి విటాల గురించి కూడా మనం చెప్పుకుందాం.","డీటెయిల్డ్ గా చెప్పుకోవచ్చు ఇప్పుడు అది ఈజీగా వన్ అవర్ పైనే పడుతుంది మనం చెప్పుకోవాలంటే ఎందుకంటే నాకు ఇంట్రెస్టింగ్ సబ్జెక్ట్ కూడా చాలు ఎందుకంటే ఈ అష్టాదశ శక్తిపీఠాలు ఇవన్నీ కూడా ఎన్నో పవర్ స్పాట్స్ ఇవన్నీ తిరుగుతుంటాం మేము వెళ్లి ఎప్పుడు సంచారకులం వెళ్లి అక్కడ వెళ్లి సాధన చేసుకుంటాం ధ్యాన సాధన చేస్తాం ఆ ఎనర్జీని ఫీల్ కావడానికి సో కచ్చితంగా మాట్లాడుకుందాం గురించి వండర్ఫుల్ నరేష్
