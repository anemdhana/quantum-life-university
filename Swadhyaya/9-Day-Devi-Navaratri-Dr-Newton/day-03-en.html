</style></head><body><div class="app lang-en"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-02-en.html">Prev</a><a href="day-04-en.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">Sura and Asura · Svara and Apasvara · Devi Navaratri · Day 3 (English)</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">Sura and Asura · Svara and Apasvara</span></div><div class="tools"><span class="lang-switch"><a href="day-03-te.html">TE</a><a href="day-03-en.html" class="active">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-02-en.html">Prev</a><a href="day-04-en.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"Opening Meditation · Sahasrara Sankalpa","paras":["Welcome to the five hundred and sixty-fourth day of Jnanodayam, the third day of this Navaratri series on the essence of knowledge. The two days already gone had taught a great deal. Yesterday the gathering learned how to remain one with that great Consciousness and, from that oneness, how to see this whole world. A sadhana was taken home, so that the principle might be filled into the whole of oneself. Today that practice continues.","As on the day before, the hour begins with meditation. Glasses come off and are set aside. Sit relaxed, on a chair or on the floor. On a chair, cross the legs. On the floor, a basic posture is enough. Let the fingers rest in the fingers. Place the attention on the breath, and, watching inhalation and exhalation, enter the meditative state. A fine music plays. Let it be there, and go on into the practice.","For forty minutes, be with yourself. Do not carry the attention off toward any thought. Watch the breath as it goes in. In the middle a gap comes of itself; watch it. The breath then turns and goes out. Watch the next gap, and watch the outgoing breath return as the next inhalation. If a thought arises, see it and come back to the breath. Whatever experience comes, see that too, and remain as the witness.","The power of the sitting is then turned toward the welfare of the world. A collective sankalpa is taken for the Sahasrara Pyramid: may that Pyramid, for this divine knowledge, for knowledge of the Self and of Brahman, soon take physical form on this earth, and may the knowledge lying within everyone here awaken. Attention moves to the crown. The Sahasrara power is in every one of us. Feel it as a waterfall from the top of the head, through the whole body, into every cell and every organ, joining us, drawing us into oneness.","That oneness is Vasudhaiva Kutumbakam, the earth as one family — every person, every plant, every animal, every mineral. See the light of knowledge in all of them. From this height, see the resolve as already being fulfilled. People come from every place to the Pyramid, meditate, and come to know themselves. The earth is filled with knowers of the Self, and the Pyramid bears a great part in that. With the faith that it is being fulfilled, release the resolve to the universe. In the right way, through the right people, it is coming to completion, and soon. Tathastu, tathastu, tathastu: so be it.","Attention returns to the breath. The last minute, thirty seconds, ten. Five, four, three, two, one, zero. Both hands rest over the eyes for a moment. With a small smile, the eyes open. Welcome back. Friends on Zoom were asked to turn their cameras on and welcome the founder of Quantum Life University, Brahmarshi Chakravarti Dr. Newton Kondaveti. He thanked them, and thanked Harika. A good morning of Jnanodayam: the days of Devi Navaratri were being celebrated wonderfully, each day something belonging to sadhana. This day also, a few things were to be understood."],"minutes":5,"words":521},{"title":"Sura and Asura · Svara and Apasvara","paras":["Who are the suras, and who are the asuras? Every festival has its distinction, and a puranic story. Those stories are written largely about asuras, and still more about rakshasas. Asura means rakshasa. Sura means the devata. Mahishasura is told at length in the Devi Bhagavatam, the Markandeya Purana, the Vamana Purana, and two or three other books. Films work the same way. The stronger the villain, the higher the hero is lifted. The contrast is enormous. Many rakshasas are heard of for that reason.","Before those two words, svara, and its opposite, apasvara, the missed note. In speech a mistake slips in. A meeting is going on, the microphone is in the hand, and what should not be said in that meeting gets said. Only what belongs to the context is to be spoken. When speech leaves rhythm and connection, apasvara has happened. A musician treats the note with that seriousness. Those who love music hear it at once: the svara is beautiful, or a phrase should have fallen higher, or lower, or the sequence was missed. Both are in us.","When life runs in rhythm, that is svara. When it slips, that is apasvara. The heart beats in a rhythm every day, whether we notice or not. Arrhythmia is the loss of it: too fast, a sudden double beat, then too slow, erratically, as it pleases. Breath too goes on in an order. This also is svara, which is why it is named Chandra-svara, the lunar channel, Surya-svara, the solar channel, and Sushumna-svara, the central channel. Breath becomes speech. Breath comes out as the word. It makes every action happen, and it changes into prana, the life-power, working in the body, the mind, and at the subtle level. If the breathing itself is off the note, the problems are all there.","Suras are those who remain in rhythm, in connection: body, mind, heart, the Self, the full Self, the supreme Self, the Self of all, in one link. Asuras are those from whom the link has gone. Then one thing is thought, another done, a third spoken. The body wants sleep. The mind is elsewhere. The wish inside is something else again. The mouth is making large promises: I meditate so much, I will change my whole life. The body is heavy with tamas, the mind restless with rajas, and word, deed, and thought do not agree.","Live inside the delusion of the body — I am the body — and the rhythm has already gone. What remains is laziness, fatigue, and the postponement of everything. What is to be done today: tomorrow, later, next month. These are marks by which the asura can be recognized."],"minutes":4,"words":448},{"title":"Three Gunas · The Crown in the Mind","paras":["Ravana was an asura. He was born a Brahmin, in a Brahmin line, and no one is a Brahmin by birth. He became a rakshasa all the same. He plays the veena beautifully, he meditates, he keeps up his recitation, and the asura-nature remains. The Brahmin is the one in whom knowledge of the Self has come, knowledge of Brahman. A bodily inheritance does pass down — a vegetarian way, certain rules, so that the genes express themselves well — but that is not Brahminhood. In terms of the Self, everyone gathered here is a meditator.","Mahishasura meditates too. Many rakshasas do tapas, and the question is why. For powers. For a life without death. So that no one can touch them, so that they alone may rule and command. There is no alignment. Desire follows the guna. Tamas desires one way, rajas another. Sattva is what we mean by a good person: the sattvic wish the good of all. The purely sattvic, and those beyond the gunas, wish differently again. Along with me, everyone. The joy I am receiving, everyone should receive. My share of the help; I too will make the effort. The support of the world.","He called those who have crossed the three gunas the amaras, the deathless. The Self in me is the Self in everyone. The supreme Self is everything: sarvam khalvidam Brahma, all this is indeed Brahman. They offer only for the welfare of the world. Service without a break, practice without a break, and the prayer sarve janah sukhino bhavantu, may all people be happy. A life ruled by tamas is gripped by two things, ego and the sense of mine. From that ego, often unnoticed, everything else is born.","A wish is not a fault. Without desire there is no creation. Hope is not a fault. Atyasha, the excess, is what makes us asuras. Wishing for wealth is not wrong. Wishing to be richer than everyone is where the trouble starts. The asura has slid from alignment into misalignment. A proportion is meant to be kept. Tamas is in sadhakas too, a small share, in the meditator perhaps one percent. Some rajas is required. With none, a person would not step out of the house; there would be no dynamism. Perhaps eight or nine percent. In meditators the greater share is sattva, the heart open, the person kind. The world, which has not practised, sees this and says: good people. Three proportions remain in everyone. In the asura, tamas and rajas are simply heavier. What is needed is symmetry.","Where tamas is more, violence is done, and laziness sets in. Things are thought and not done, and what is done asks for praise without a pause. Praise becomes an addiction. Where rajas is intense, fame is hunted. If it comes, let it come. The crawling for it, the willingness to do anything for name and position, is the trouble.","A king once went to a guru, wanting knowledge of the Self. He went as kings go: crown, golden armour, diamonds, vaidurya, every jewel. Take off what is weighing on you, the guru said. The king took off a crown of three or four kilos, and the armour, and called it easy. This is not what I meant, the guru said. A crown is set in the mind: I am a king, a very great man. Remove that. The armours that matter are worn inside. Ornaments, prestige — leave them, and then meditation settles, and the mind becomes empty. The outer crown can come off while the inner one has not moved. People hold a new resolve for forty days, ten days of not being angry, and then the anger returns, because the mind never let go. Rajas at that pitch is the same asura-nature. In the puranic stories a war between suras and asuras is always being staged. Every story is the same one story."],"minutes":6,"words":654},{"title":"One Story · The Battle Inside","paras":["The lesson is one. A battle, and the two sides are not somewhere else. They are in us. Enemies are not outside. Rakshasas are not outside. Mahishasura is within us, and so are Shumbha and Nishumbha, Rambha and Karambha, and the many other names the books give. Another way of defining them is by quality. Bad qualities are called rakshasa qualities. They do what ought not to be done. Harm is adharma, at every hour and in every place. True Sanatana Dharma is ahimsa: to live without doing violence. The stories say that when munis and rishis sit in tapas, hot oil is poured on them and they are shaken out of meditation. That is the violent tendency. So is saying what should not be said, saying whatever comes to the mouth, having no right speech, no right conduct, no right way of seeing or of thinking. These express themselves as violence.","After his birth Mahishasura also did tapas. Rakshasas meditate well. Ego and the sense of mine remain, at an intense degree. Ravana crossed a boundary. In a disguise he took Sita to Lanka, without her consent, by force. He did violence to a woman, hurt her, and separated husband and wife. Rama grieved, longed for her, and suffered the separation. Sita thinks when she will see him. Mahishasura, Bhandasura, Vritrasura: the names are many, and all of them arise from the three gunas alone, in differing proportions, combinations, and permutations. Each villain has a character of his own because the ratio is his own.","The nine nights were set apart for sadhana, parva days, favourable to practice, and they are to be used. Inner change asks a great deal of practice. Used well, these days open a power already shining over the whole earth. On the first day the three powers were spoken of. Many join; principally there are three, which is why the festival speaks of three mothers. Durga, who is the avatara of Kali; then Lakshmi; Mahadurga, Mahalakshmi, Mahasaraswati. The first three days belong to Mahadurga, the power that carries a person across whatever is hard, whatever obstructs, whatever interrupts. In plain words, blocks. They are internal. Outside, they are not found. Whatever happens, happens within. These first three days, that is what is to be cleared first."],"minutes":3,"words":382},{"title":"Three Mothers · Will, Action, Knowledge","paras":["Durga is Ichcha Shakti, the power of will. Mahalakshmi is Kriya Shakti, the power of action. Mahasaraswati is Jnana Shakti, the power of knowledge. Before that Mother we are children. A small child runs and embraces the mother first. She kisses the child, lays the child against her, sings a lullaby. The Mother of the world does the same. These nine days we are to stay near her. When we were small and trouble came, we told mother first, and she helped at once. Father is asked less readily; there is a little inhibition, and he is asked at the end. Mother is the one who convinces him. Dr. Newton told it of himself. As a boy he wanted a toy, and he asked his mother, because asking his father was hard. She spoke to his father, gathered what was needed, and had the gift bought.","Mother means Shakti. Adi Shakti, Para Shakti, has come here as Apara Shakti, in many forms: Durga, Mahadurga, Mahakali, or one name a day — Shailaputri, Brahmacharini, Kushmanda. Each name is one expression of the one Mother. When a problem comes we often run outside. We are to go to our own Shakti and tell her. It is not enough to decide that she already knows. Even hunger has to be said. She might notice of herself and set out the meal. Still, we are to ask. A certain ego says: I will not ask; she ought to know, and come, and give. These nine days, and afterwards, we are to be a child in her lap. She is the power by whom the universes, the galaxies, the solar systems have come to be. Whatever we need, the sentence is simply: Amma, I want this. She is compassionate, and ready. They say her heart moves when a child asks, and she gives it.","With that power of will, the hard blockages are to be cleared — the limitations we are stuck in, the things that repeat, the things that trouble sadhana without our even knowing. Some people have come to a completion in practice. They live mostly in their purpose, spreading meditation or teaching a vegetarian way, immersed in the work. Sadhana is never finished. What has changed is that more of their time goes to teaching, because that completion has come. For the rest of us the blocks do not clear by themselves. Attention is required, the recognition that this block is here.","There is a bird, the ostrich, called nippukodi. When a predator comes it runs, and then hides its head in the sand, imagining that no enemy exists. The enemy is beside it. We do the same. Problems are there, the practice is not happening, and we tell ourselves that we have no blocks. The power of will is not a mistake. Right desires, and right resolves, matter greatly. These first three days are for the blocks inside.","The next three are for resources. Mahalakshmi means abundance, balance, equanimity, the inner store. Confidence is such a resource. If it is there, what you think of, you do. If it is not, you plan and then stop. Divine qualities are to be grown just as the negative ones are real. After that inward abundance finds outward expression, the last three days are Mahasaraswati: knowledge of the Self and of Brahman, received from her. From that mother we learn who we are. Will, action, and knowledge. She is Mahishasura-mardini, the power that brings the asura down."],"minutes":5,"words":583},{"title":"Suratva · The Nine-Day Fast","paras":["Among musicians, sur means rhythm, and asur means the rhythm has gone. How near we come to ourselves is suratva. How far we go is asuratva. Nearness is the yearning for knowledge of the Self, the Self joined to the Self, and the felt knowledge: I am the Self. Distance is: I am the body, I am not the Self, there is no path. Think that, and every problem follows, because a very high importance is then given to feeding the body alone. Beauty does not last. Form, money, and house all go. From that delusion come the sense of mine, attachment, clinging, and hatred.","To be meditating is suratva. Meditation itself is suratva. If you are meditating, you are a deva, in this sense: every sadhaka trying to know the divinity within is near the God who lives as the indweller of all. The other life is a turning away, a wandering outside. Then violence comes. Look at the world — wars, killing, the young with no direction. This generation searches outside for all its joy. A new phone every year, and joy expected from the smartphone, as if the world arrived with it.","These days ask a fast of the mind: thoughts set down, outer silence and inner silence, so that energy is conserved. A fast from social media, from Instagram, from the reels. Time disappears into them. They are addictions, and they take us far from ourselves. Whatever creates that distance is to be recognized, and the move back made at once. If the habit is three meals, let it be two. If it is already two, let it be one, ekabhukta, and even that meal very small. Malls, films, and outings are not forbidden for the rest of life. During these nine days the time is to be used.","The internal blocks are to be told to the Mother. These should leave me. They are hard, and I want to cross them. On the first day a piece of work was given: write three goals. Energy has to be given a direction, or it is misused. The purpose itself — the aim of a life, the plan with which the soul came — becomes clear only after some practice. Until then, goals are still to be set. These first three days are Ichcha Shakti. The resolves have to be the right ones. Tell her. Write it clearly. This is my desire."],"minutes":4,"words":405},{"title":"What Do You Want · Lahiri Mahasaya","paras":["Lahiri Mahasaya had one desire left, from earlier births: to live in a royal palace. Born as Lahiri, he did his work, and he did not neglect the dharma of that employment. When the work took him to Ranikhet and a little free time appeared, he felt he should climb the mountain. Near a cave a man was waiting. Have you recognized me? I am meeting you for the first time; I do not remember. The man was a guru, and he had been waiting. I have been here more than fifty years, he said — a guru waiting through a hundred and fifty years. Some of your things are here. My things are at home, Lahiri answered. Not these. Inside, the yogi showed him a kamandalu, the water-pot, the seat he used to sit on, and the darbha grass. A memory stirred, and still was not fully known. Without meditation, such a thing is not known.","Mahavatar Babaji had seen what remained. That single wish was what stopped the disciple. He was already a knower of Brahman, already at the height of knowledge of the Self. One step more, if the desire were fulfilled. This is what gurus do, and what Devi the Mother does. Whatever blocks the journey, they remove, so that the journey can be smooth — especially where the desire is the welfare of the world, the wish that this knowledge should reach everyone. Babaji created a palace and fulfilled the desire for twenty-four hours. The cave is still there. People go to it, at Ranikhet in northern India, and behind it, it is said, the palace was brought into being. For those twenty-four hours Lahiri stayed content. The desire was finished.","Ichcha Shakti puts a question many people never ask. What do you want? From childhood, no one has asked us what we really want. According to where the soul's unfolding has reached, the answer comes from inside. We do know. Clarity is the missing piece. And if the wish stands in line with the higher purpose, this power makes it manifest and complete. This is the truth. Some wishes belong to life here. Some belong to liberation: enlightenment, the light of divine knowledge, the opening of the third eye, a meeting with the gurus who abide in the great causal body.","Underneath a wish, what is actually needed may be something else, and that is what has to be caught. Suppose the wish is money. Debts, loans that cannot be repaid, calls that arrive during meditation, the electricity bill, the phone bill, taxes, the cost of a family. Suppose the money then came, completely. How would you feel? When I get what I want, what do I feel? Ask it several times. The real need may not be the first answer. He asked someone on the Zoom to try it aloud, so that everyone could see the process. Harika chose Jameela."],"minutes":4,"words":487},{"title":"Jameela · The Desire Under the Desire","paras":["Jameela's wish was that her husband, a man with his doctorate, his NET and his SLET, should at last have a good and high position. If he were settled, if the family were settled, she herself could grow spiritually. If that came about, what would she feel? Contentment of the soul, atma-tripti. That would be enough. While she served for the welfare of the world, nature itself, she believed, would see to the children. He took the next step. Suppose that contentment has fully come, the children are well, and you are able to do the spiritual work. What then? She would be ready for whatever the masters would have her do. She would surrender. That, he said, is the purpose for which a person is born. Fulfil it, and the feeling is the same contentment, more fully. She went carefully toward the large words, liberation, birth and death. As long as desires remain, we keep coming and going. A mind brought to quiet. Because this birth has been taken, there are responsibilities. Whatever nature gives today — planting a tree, feeding people, teaching a meditation — doing that with the whole heart is the plan. Done that way, contentment arises, and the joy of the soul.","So the wish to place before Adi Shakti is, in truth, the wish to be content. If she is, the spiritual life goes on, the children do what is theirs, the husband is well, and because a fine vibration also comes from her, he may come to meditate. That cannot be known ahead. She added that the whole family already meditates, and that she had come to meditation through her husband. They lean on their own Shakti. Settled a little better, larger work could be done: ordinary happiness, spiritual growth, and along the way ten people helped to grow. Lakshmi, he said, stays near people of that kind, and from such a life many works can be done that hold the world up. The sankalpa was contentment in abundance, the financial difficulty cleared, and the money used so that good comes to everyone. She was saying it to her own Shakti. Mother means that power.","The question is to be asked three or four times. What do I really want? If I came out of this outer difficulty, how would I feel? Suppose the answer is peace. If peace were complete, what then? Joy. If joy came, I would want to share it. If I have shared it, what feeling is that? At the level of the Self it becomes clear what you are actually looking for. The same ladder, with a family conflict. If the tangle is resolved, peace of mind. If peace of mind, more meditation. If more meditation, I am able to be with myself. If I am with myself, the joy of the Self, and knowledge of the Self. If that knowledge has come, fulfilment, fullness. And if a sense of incompleteness comes, what is that feeling? Ask. Outside, one thing is being wished. Inside, the goal is another. On this third day, two desires or three are to be found and placed near the Mother. She will see to them.","Ichcha Shakti takes the hard places away. That power, it is said, can grind down even a mountain. Near Lalita there is a great army. Varahi is there. A minister is there, Raja Shyamala. Around Adi Shakti, many forms, divine forces with different names. The names do not have to be known. It is said she can make a mute person into a great musician. She wrote upon the tongue of an innocent man who knew nothing, and made a master: Kalidasa, Tenali Ramalinga. There was the vision of Kalika. If she wills a thing, nothing impossible is left standing."],"minutes":6,"words":632},{"title":"Devi Samarpan · Nine Rounds of Shreem","paras":["The offering of the day before, Devi Samarpan, was to be done again. The left leg is placed over the right. If that cross is uneasy, a basic posture is enough: the right leg nearer the body, the left a little farther out, or laid on top. On a chair the crossing is the same, left over right. To sit this way is to be tuned, in a high focus, to the Mother. It is a sign. It is also called the Lakshmi mudra.","Close the right nostril. Through the left, draw the breath in nine times, one sip after another, with no exhalation between them. Then a slight pause. While the breath is slowly released, the hands come into namaskara and the head bows. If it can touch the earth, well. If not, the hands touch. The breath is let out completely and held out. This is sharanagati, coming for refuge. While the head is bowed and the breath held out, the seed-syllable Shreem is placed nine times. It is not spoken aloud, and not formed on the lips. Speech uttered outside is vaikhari. On the lips it is madhyama. Thought in the mind is pashyanti. Para is the level of the soul, finer than fine. At that level Shreem simply streams. Then come slowly back to an ordinary upright posture. That is one round.","He led the first three rounds this way. The remaining six, each person was to do alone, silently, the feeling coming from the heart. When the head bows, the ego is brought to an end: a total surrender to the Mother of the world, because this power is the one that takes charge of everything. After the nine rounds, sit quietly, steady, still.","At the feet of Mahadurga, who has charge of the power of will, every resolve is placed. What is ours to do, we do: the resolve, and a little of the action. All the rest she sees to. She is already within as prana, as divine power, as Kundalini. Whatever is most difficult, whatever will not solve, has been set at her feet. Nine times, done rightly, is enough. More is not required. Nine days and nine times are a matching. It is done on the lunar breath, Chandra-svara, because the practice belongs to the Mother and is a going inward. Outward activity belongs to the solar breath, Surya-svara. The steps are logical. There is a science in them, a shastra."],"minutes":4,"words":410},{"title":"Shailaja and Nagaveni · Not Punishment, Training","paras":["Shailaja's mind had been badly entangled. A property going back forty-three years, forty-five, was still unsettled. They are five doctors. They want the money for the welfare of the world, and the property is tangled in every direction. Everyone in the family is already in practice. Only if a real sum comes free can it be used, and it is not coming. Her wish, together with the money, is the world's good: peace, the practice toward liberation, service of the nation. It is her grandparents' property. It should be set right, and it should go to that welfare. They are five sisters. If they stand as one, a path should appear. She was writing it as he had taught: abundance, peace, liberation, and every person in the house. She placed it at Devi's feet.","She had been trying for a long time. What is not in our hands, he said, the beings of the higher worlds can solve. Divine powers resolve such things in a moment. What she herself had to do, she should do: these nine days of sadhana, done well. If it were possible, three sittings, three hours of meditation, in silence, feeling that Presence more. This had been said the day before. Devi's presence is to be felt continuously, and the wish then offered. She had already said it to the universe. Now she had said it to Prakriti. It would reach. Things would come into alignment.","Nagaveni would share tomorrow the change that had come since she learned meditation, and she would ask her questions then. What she wanted to say now was about the demonstration. Before this knowledge, if a question was invited, her hand went up: ask me, ask me. Today that had not arisen. Whoever is meant to receive a thing, receives it, at the time the universe and the gurus give it. No excitement and no anxiety had shown themselves. She thanked him for that state of mind.","Her question: we have learned that karma is training, not punishment. After a certain age, and after meditation, we can see that a trouble arrived so something might be learned. Children, and all of us before meditation, have no such seeing. Chronic illness comes, and the child does not know, I brought this. Does it not then become punishment?","Until eighteen, children live under their parents' protection, inside their energy field. The first three years are the mother's care. Then the father draws the child close, girl or boy, and holds the child. From the first school, from LKG, the protection of teachers comes in. Learning begins with mother, then father, then guru, and continues until eighteen. After the menstrual cycle begins, a girl comes more fully into the mother's care. A boy goes toward the father. With a masculine energy, the father teaches how outer challenges are met. That energy helps. A girl remains with the mother.","A child of five with a chronic illness knows nothing of karma or rebirth, and cannot yet practise. Because the child is inside the parents' care, their part is very large. If illness expresses itself through the children, the parents carry the responsibility until the problem is solved. An autistic child needs a great deal of unconditional love, cannot communicate, is sometimes hyperactive and sometimes shouting. The love is given without anger. If the parents are living a meditation, the children learn by seeing. They mimic: I will sit as mother sits. Force them, and they stiffen and will not. Children are never to be forced. The adult becomes the example.","In the universe there is no punishment, only training: lessons of the soul. A cold teaches. A fever teaches. Eating, even without hunger, from a want that rose inside — junk food, pizza, pasta — and an upset stomach: that too is a lesson, and the next time only the food that keeps the body comfortable is taken. Parents can convey this as a seed. The child catches the point. Children cannot solve it alone.","Most often it is a karmic situation shared with the parents. A son is angry with his father from the beginning, speaks well with his mother, rejects whatever the father says. The child cannot yet see why. The father, meditating daily, can. In that other birth we were enemy kings. A conflict was never resolved. Unfinished business. Now he is born as my son, and the enmity is still there. The father receives the lesson himself. No judgment, no criticism: acceptance, and love. When he does that, it resolves. The bond is runanubandha, karmic debt. In meditation the parent comes to know what this boy or this girl needs, and that if the help is given through him, they come out of it. At the level of the soul we plan a life and then arrive. The lessons are compulsory. That compulsory learning is the training. Even in childhood, the offering can be made in this way."],"minutes":8,"words":827},{"title":"Co-Created Reality · The Song in the Heart","paras":["Nagaveni had watched a film a couple of days before. She spoke of it as a film of Hanuman's amsha, a portion of Hanuman. People who do not meditate like such a film, she said, because it shows a power beyond the senses, and it pleases them to think that gods have power of that kind. In it a swami opens the lock of a prison. Food in his hand multiplies many times over. During the British time, sadhakas of this kind were here. They know beforehand. Why did they not stop what was coming? So many heroes were going to die.","Some realities are co-created. Many people together keep creating them. The British made this country a slave country and wielded their power. That was against free will. They killed many heroes. It was inhuman. At Jallianwala Bagh they fired as if shooting birds. Even now it boils in us; those who died are our brothers and sisters. A massacre was done. And the events sit inside a reality that was made together.","If a guru wished, a snap of the fingers and it would be over. If Krishna snapped his fingers, it would be over, and then there would be no play. Every soul has to come to that level by going through what is there to go through. There is no shortcut. The British too could have been handed enlightenment long ago. Himalayan gurus are many, gurus like Neem Karoli Baba. A snap of the fingers would do it. It is otherwise, because every soul and every soul's plan is to be respected. Only for some, and only in such a presence, is there an intervention. A life that is ending may be lengthened by forty years, because by remaining in that body the person does a great good for the world. In a co-created reality they do not interfere. A dissolution comes, a flood, a storm, an earthquake, and they do not stop it. They know a hundred thousand will die. Each soul, in its evolution, has experiences it must pass through.","They see with the vision of the Self, and so they can accept every thing. They do not sort the world into right and wrong. They are beyond right and wrong, beyond victim and perpetrator, beyond plus and minus. The defect of sattva is that we get stuck there, judging. They are past that. We too have seen this film, he said. It has been made wonderfully: the life of Neem Karoli Baba. Every sadhaka should see it. From childhood he was in practice. Without the seeds of many births, a child does not sit like that, always in meditation, with none of the ordinary playing and wanting. Rama, continuously. Such people were yogis through many births, and are born again with a purpose.","Through Harika, each of these days, a song of the Mother is heard, and heard in that way it remains in the heart. Her melody is something expressed out of knowledge of the Self, and what is expressed from there does a great deal of good. She sang. The hymn opens on the Mother as Omkara rupini, she whose form is Om. When the song ended he said it was wonderful. Tomorrow, again, in Jnanodayam."],"minutes":5,"words":545}];
const nav=document.getElementById('nav'),mobileNav=document.getElementById('mobile-nav'),columns=document.getElementById('columns');let chapter=0,spreadIndex=0,spreadCount=1;
function makeNav(root){chapters.forEach((c,i)=>{let li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+c.title+'<small>~'+c.minutes+' min read</small></span>';b.onclick=()=>{chapter=i;spreadIndex=0;render();document.getElementById('mobile-side').classList.remove('open')};li.append(b);root.append(li)})}makeNav(nav);makeNav(mobileNav);
function render(){let c=chapters[chapter];document.getElementById('heading').textContent=c.title;document.getElementById('time').textContent='~'+c.minutes+' min';columns.innerHTML='';let title=document.createElement('h2');title.className='section-title';title.textContent=c.title;columns.append(title);for(let p of c.paras){let el=document.createElement('p');el.textContent=p;columns.append(el)}document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i%chapters.length===chapter));requestAnimationFrame(()=>requestAnimationFrame(measure))}
function measure(){const width=columns.clientWidth;const one=window.matchMedia('(max-width:800px)').matches;const total=Math.max(width,columns.scrollWidth);spreadCount=Math.max(1,Math.ceil((total-2)/width));spreadIndex=Math.min(spreadIndex,spreadCount-1);columns.scrollLeft=spreadIndex*width;document.getElementById('position').textContent='Section '+(chapter+1)+' / '+chapters.length+' · '+(one?'Page ':'Spread ')+(spreadIndex+1)+' / '+spreadCount;document.getElementById('prev').disabled=chapter===0&&spreadIndex===0;document.getElementById('next').disabled=chapter===chapters.length-1&&spreadIndex===spreadCount-1}
function move(dir){if(dir===1){if(spreadIndex<spreadCount-1)spreadIndex++;else if(chapter<chapters.length-1){chapter++;spreadIndex=0;render();return}}else{if(spreadIndex>0)spreadIndex--;else if(chapter>0){chapter--;spreadIndex=9999;render();return}}measure()}
document.getElementById('next').onclick=()=>move(1);document.getElementById('prev').onclick=()=>move(-1);document.getElementById('font').onclick=()=>{document.body.classList.toggle('font-large');spreadIndex=0;requestAnimationFrame(measure)};document.getElementById('menu').onclick=()=>document.getElementById('mobile-side').classList.toggle('open');window.addEventListener('resize',()=>{spreadIndex=0;requestAnimationFrame(measure)});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});render();</script></body></html>
