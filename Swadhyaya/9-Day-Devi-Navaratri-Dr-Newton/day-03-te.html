</style></head><body><div class="app lang-te"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-02-te.html">Prev</a><a href="day-04-te.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">సుర · అసుర · స్వర · అపస్వర · దేవీ నవరాత్రులు · Day 3</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">సుర · అసుర · స్వర · అపస్వర</span></div><div class="tools"><span class="lang-switch"><a href="day-03-te.html" class="active">TE</a><a href="day-03-en.html">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-02-te.html">Prev</a><a href="day-04-te.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"ధ్యాన ప్రారంభం · సహస్రార సంకల్పం","paras":["ఓం ఓం ఓం ఓం ఓం ఓం అందరికీ శుభోదయం జ్ఞానోదయంలో లో 564వ రోజుకి స్వాగతం. అండ్ మనం ఈ బ్యూటిఫుల్ సిరీస్ లో మనం మూడవ రోజులోకి వచ్చేసాం. నవరాత్రి జ్ఞానసారం సిరీస్ లో గత రెండు రోజులు ఎంతో నేర్చుకున్నాం. మనం గత రెండు రోజులు నిన్న మనం ఆ గ్రేట్ కాన్షియస్నెస్ తో ఒకటై ఉండి ఎలా ఈ లోకం మొత్తం చూడాలో నేర్చుకున్నాం. ఒక హోమ వర్క్ కూడా తీసుకున్నాం మనం ఒక సాధనని కూడా తీసుకున్నాం. ఆ మొత్తం మనలో ఆ తత్వాన్ని మొత్తం ఎలా నింపుకోవాలో మనం తెలుసుకుందాం ఆ సాధన ద్వారా అండ్ ఇవాళ మనం దాన్ని కంటిన్యూ చేసుకోబోతున్నాం.","దానికి ముందు రోజు లాగే మనం ధ్యాన సాధనతో మొదలు పెట్టుకుందాం. సో మనందరం కూడా కళ్ళజోడు ఉంటే తీసి పక్కన పెడదాం. ఎంతో రిలాక్స్డ్ గా మన కుర్చీలో కూర్చోవచ్చు లేదా కింద అయినా కూర్చోవచ్చు. పైన కూర్చుంటే కాళ్ళని క్రాస్ చేసుకుందాం. కింద కూర్చుంటే కింద కూర్చుంటే బాసిక్ పట్టంలో కూర్చోవచ్చు. మన వేళ్ళని వేళ్ళలో పెట్టుకుందాం. ఎంతో రిలాక్స్డ్ గా కూర్చుందాం. మన ధ్యాసను మన శ్వాస పైన పెడదాం. ఆ ఉశ్వాస నిశ్వాసలను గమనిస్తూ ధ్యాన స్థితిలోకి వెళ్దాం. బ్యాక్గ్రౌండ్ లో ఒక చక్కటి మ్యూజిక్ ప్లే అవుతా ఉంటుంది. ఆ మ్యూజిక్ ని గమనిస్తూ మనం ధ్యాన సాధనలోకి వెళ్దాం.","జరిగే ఉచ్వాస నిశ్వాసలని గమనిస్తూ ఎంతో రిలాక్స్డ్ గా ఈ 40 నిమిషాల పాటు మనతో లో మనం ఉందాం. ఈ 40 నిమిషాల పాటు ఎటువంటి ఆలోచన వైపు మన దృష్టిని తీసుకువెళ్ళకుండా ఆ లోపలికి వెళ్లే ఉశ్వాసను గమనిస్తూ మధ్యలో సహజంగా ఆ వచ్చే ఆ గ్యాప్ ని గమనిస్తూ ఆ లోప వెళ్ళినప్పుడు శ్వాసం మళ్ళీ నిశ్వాస కింద బయటికి వస్తుంది. మళ్ళీ ఆ సహజంగా వచ్చే ఆ గ్యాప్ ని గమనిస్తూ మళ్ళీ ఆ బయటకి వెళ్ళిన నిశ్వాస ఉచ్వాసగా మన లోపలికి వస్తుందని గమనిస్తూ ఉందాం. ఆ ఓం ఓ ఆ ఏ ఆలోచన వచ్చినా పర్వాలేదు.","దానిని కూడా గమనిస్తూ తిరిగి మన శ్వాస పైకి తీసుకుపోద్దాం అత్యాసం ఏ అనుభవం వచ్చినా కూడా దానిని గమనిస్తూ దాక్షి భావంతగా ఆ ఆ ఓం ఓం ఓం ఓం ఆ ఓం ఓం ఆ ఓం ఆ ఆ ఆ ఓం ఓం ఆ ఓం ఆ ఆ ఓం ఓం ఆ ఆ ఆ ఓం ఓం ఓం ఓం ఓం ఆ ఆ నట్టరి అదే నిమిషాలు ఇక ఇప్పుడు మన ఈ ధ్యాన శక్తిని సంకల్పాన్ని లోక కళ్యాణం కోసం ఉపయోగిద్దాం. మనమంతా ఈ సామూహిక ధ్యానంలో సహస్రార పిరమిడ్ గురించి సంకల్పం తీసుకుందాం.","ఈ దివ్యమైన జ్ఞానానికి చేనం ఆత్మజ్ఞానం బ్రహ్మ జ్ఞానానికి చేహనమైన సహస్రారా పిరమిడ్ అతి త్వరలో ఈ భూమిమీద భౌతికంగా రూపుదిద్దుకోవాలని ఈ భూమండలం పై అందరిలో ఉన్న అంతర్గత జ్ఞానం మేలుకోవాలని సంకల్పిద్దాం. నీ ధ్యాసని తలపై భాగం వైపుక తీసుకువెళ్ళండి తలపై భాగం వద్ద ఉన్న ఈ సహస్రారా శక్తి మనందరిలోనూ ఉంది. ఈ శక్తిని అనుభవం పొందుదాం. ఈ శక్తి ఒక జలపాతంగా తల పై భాగం నుంచి మీ శరీరమంతా ప్రవహిస్తూ ప్రతి కణంలోకి ప్రతి అవం అవయవంలోకి ఈ శక్తి మనందరినీ కలుపుతోంది. మనల్ని ఏకత్వ భావంలోకి తీసుకువెళ్తుంది.","ఓం ఏకత్వ భావమే మసుదైక కుటుంబకం అన్ని జీవరాశులు ఈ భూమండలంలో ఉన్న ప్రతి వ్యక్తి ముక్క జంతువు ఖనిజము అన్నింటితో ఏకత్వ భావం అందరిలో ఉన్న జ్ఞానపు వెలుగును చూద్దాం. ఈ ఉన్నత స్థితిలో మన ఈ సహస్రార సంకల్పం నెరవేరుతున్నట్లుగా చూడండి ఈ సహస్రారా పిరమిడ్ లో అన్ని చోట్ల నుండి ఎంతో మంది వచ్చి ధ్యానం చేసి తమని తాము తెలుసుకుంటున్నారు. ఈ భూమండలమంతా ఆత్మ జ్ఞానులతో నిండిపోయి ఉంది. దీని వెనుక ఈ సహస్రారా శక్తి సహస్రార పిరమిడ్ ఎంతో ముఖ్యమైన భాగం పోషిస్తుంది. ఈ సంకల్పం నెరవేరుతుందనే ఉద్దేశంతో నమ్మకంతో ఈన్ని విశ్వానికే విడుదల చేద్దాం.","సరైన మార్గంలో సరైన విధంగా సరైన వ్యక్తుల ద్వారా ఈ పిరమిడ్ అతి త్వరగా పూర్తవుతూ ఉంది. తథాస్ట్ తథాస్ట్ తథాస్ట్ ఇప్పుడు కొద్ది క్షణాల పాటు తిరిగి మీ ధ్యాసని శ్వాస మీదకి తీసుకురండి. ఆఖరి ఒక నిమిషం 30 సెకండ్లు 10 సెకండ్లు ఐదునాలుగు మూడు రెండు ఒకటి సున్నా నెమ్మది నెమ్మదిగా మీ చేతులు రెండు కొద్ది క్షణాల పాటు కళ్ళ మీద ఉంచుకొని ఒక చిరునవ్వుతో కల రెండు తెరుద్దాం వెల్కమ్ బ్యాక్ ఎవ్రీవన్ మరొక్కసారి అందరికీ స్వాగతం.","మరి జూమ్ లో ఉన్న మిత్రులందరూ కూడా కెమెరా ఆన్ చేసుకొని ఒక చిరునవ్వుతో మన క్వాంటం లైఫ్ యూనివర్సిటీ వ్యవస్థాపకులు బ్రహ్మర్షి చక్రవర్తి డాక్టర్ న్యూటన్ కొండవీటి గారిని ఆహ్వానించుకుందాం. థాంక్యూ సో మచ్ సర్ ఫర్ బీయింగ్ హియర్ టుడే ఆల్ ఆఫ్ యు థాంక్యూ హారిక గారు అందరికీ జ్ఞానోదయం శుభ్రోదయం ఉషోదయం దేవీ నవరాత్రులు అద్భుతంగా మనం సెలబ్రేట్ చేసుకుంటున్నాం. ప్రతిరోజు కొన్ని ముఖ్యమైనటువంటి సాధనకు సంబంధించినటువంటి విషయాలను చెప్పుకుంటున్నాం. మరి ఈరోజు కూడా మనం కొన్ని విషయాలు తెలుసుకుందాం. సురులు అసురులు అంటే ఎవరు?","ఎందుకంటే మన పౌరాణిక గ్రంథాలని చదివినప్పుడు ప్రతి పండగకి ఒక విశిష్టత ఉంది ప్రతి పండగకి ఒక చక్కని పౌరాణిక కథ ఉంది ఆ కథలో అంతా కూడా అసురుల గురించి రాస్తుంటారు ఎక్కువ రాక్షసుల గురించి అసురులు అంటే రాక్షసులు సురులు అంటే దేవతలు సో ఆ రాక్షసులకే ఎక్కువగా ఆ పౌరాణిక గ్రంధాల్లో ఎక్కువ గ్రంథాల్లో ఎక్కువ రాసింది ఆ రాక్షసుల గురించే ఇప్పుడు మహిషాశురుడు గురించి దేవీ భాగవతంలోనూ మార్కండేయ పురాణంలోనూ వామన పురాణంలోనూ ఇంకొక రెండు మూడు గ్రంథాల్లో కూడా ఆయన గురించి బాగా రాస్తారన్నమాట విలన్ క్యారెక్టర్స్ గురించి మన సినిమాలో కూడా మామూలుగా ప్రతి సినిమా కూడా ఒక విలన్ క్యారెక్టర్ ఉంటారు ఒక హీరో క్యారెక్టర్ ఉంటారు.","ఎంత స్ట్రాంగ్ గా ఉంటే విలన్ క్యారెక్టర్ అంత హీరో క్యారెక్టర్ కి కూడా ఎలివేషన్ వస్తుంది ప్రొజెక్షన్ వస్తుంది. కాంట్రాస్ట్ బ్రహ్మాండంగా ఉంటుంది. అలానే మనం ఎంతోమంది రాక్షసుల గురించి వింటుంటాం.","అసురులు అసురులు అనే శబ్దం గురించి తెలుసుకుందాం అసలు సురులు అంటే ఏంటి అసురులు అంటే ఏంటి దానికి ముందు స్వర అంటే ఏంటో తెలుసుకుందాం స్వర అపస్వర అంటాం రెండు ఉన్నాయి అపస్వరం అంటే ఏంటి స్వరం అంటే ఏంటి అపస్వరం అంటే అటే మనం మాట్లాడే మాట మనం తప్పులు దొర్లాయి ఏదో మాట్లాడుతున్నాం అపస్వరం ఒక సభ జరుగుతుంది ఆ సభలో మనం మైక్ పట్టుకొని మాట్లాడకూడనివన్నీ మాట్లాడుతున్నాం అపస్వరం ఆ సందర్భంలో ఏం మాట్లాడాలో అదే మాట్లాడాలి ఆ కాంటెక్స్ట్ లో ఏం చెప్పాలో అదే చెప్పాలి అది కాకుండా మనం ఒక రిథంలో ఒక అనుసంధానంలో లేకుండా ఏదేదో మాట్లాడితే అది అపస్వరం అంట అపస్వరం జరిగింది.","ఒక సంగీత విద్వాంసుడు కూడా పాట పాడుతున్నప్పుడు వారు ఎంత ప్రాముఖ్యత ఇస్తారంటే ఈ స్వరం గురించి ఎక్కడైనా అపస్వరం వచ్చిందా వాళ్ళు పట్టుకోవలుతారు సంగీతంలో సంగీత అభిలాషులకు సంగీతం పాడుకునే పాటలు పాడుకునే వాళ్ళకి తెలుసు ఎవరైనా ఒక రాగాన్ని ఆలాపిస్తుంటే పాడుతుంటే వాళ్ళు అట్లా పట్టేస్తారు వాళ్ళు అబ్బా స్వరం చాలా బాగుందంటారు. ఓ ఇక్కడ అపస్వరం వచ్చింది కొంచెం హెచ్చు స్థాయిలో పడాలి ఇక్కడ తగ్గు స్థాయిలో పడాలి లేకపోతే ఎక్కడో సీక్వెన్స్ రిథం మిస్ అయింది. మనం కూడా అంతే మనలో కూడా ఈ స్వరము అపస్వరము రెండు ఉన్నాయి.","ఒక రిథంలో మన జీవితం నడుస్తుంటే అది స్వరం అది తప్పిందా అది అపస్వరం ఇప్పుడు మన హార్ట్ ఒక రిథంలో కొట్టుకుంటుంది. నిరంతరం నిత్యం కొట్టుకుంటుంది. మనకు తెలిసినా తెలియకపోయినా హార్ట్ చాలా పనిచేస్తుంది. మన హృదయము నిరంతరం పనిచేస్తుంది. ఒక కండిషన్ ఉంది మెడికల్ కండిషన్ దాన్ని అరిదిమియా అంటారు.","అంటే రిథము పోవడం ఆ హార్ట్ కొట్టుకోవాల్సిన గుండె ఎన్ని సార్లు కొట్టుకోవాలో అది కాకుండా ఎక్కువ కొట్టుకుంది అనుకోండి హరిదినియా అంటారు అంటే సరిగ్గా కాకుండా ఒకసారి డబ్బ డబ్బ ఎక్కువ కొట్టుకోవడం మళ్ళా తక్కువ సడన్ గా తక్కువ కొట్టుకోవడం మళ్ళా ఎక్కువ కొట్టుకోవడం తక్కువ కొట్టుకోవడం చాలా వ్యత్యాసంతో దాని ఎర్రటిక్ గా దాని ఇష్టం వచ్చినట్టు కొట్టుకుంటూ ఉంటే అరిదిమియా అంటాం స్వరం పోయింది మన శ్వాస ఇది కూడా ఒక క్రమంగా మన శ్వాస జరుగుతూ ఉంటుంది నిరంతరం సహజంగా జరుగుతూ ఉంటుంది శ్వాస ఇది కూడా స్వరమే అందుకే కుడి స్వరము లే చంద్ర స్వరము సూర్య స్వరము సుషుమన స్వరము ఈ పేర్లతో మనం పిలుచుకుంటాం ఇది కూడా స్వరమే మన శ్వాసే మాటగా మారుతుంది మన శ్వాసే ఒక వాక్కుగా బయటక వస్తుంది.","ఈ శ్వాసే అన్ని క్రియలని చేయిస్తుంది. ఈ శ్వాసే ప్రాణశక్తిగా రూపాంతరం చెందుతుంది. ఈ శ్వాసే మన బాడీలో మన మనసులోనూ మన ఎన్నో స్థాయిల్లో మన చైతన్య స్థాయిల్లో సూక్ష్మ స్థాయిల్లో కూడా ఈ శ్వాసే ఎన్నో చేస్తుంది.","ఇది అపస్వరం ఉందనుకోండి ఇది ఈ స్వరము సరిగ్గా లేదు శ్వాస సరిగ్గా లేదు అన్ని ప్రాబ్లమ్స్ే సో సురులు అసురులు సురులు ఒక రిథంలో ఉండేవాళ్ళు అనుసంధానంలో ఉండేవాళ్ళు వాళ్ళ శరీరము మనసు హృదయము ఆత్మ పూర్ణాత్మ పరమాత్మ సర్వాత్మ ఒక అనుసంధానంలో ఉన్నవాళ్ళు అసురులు ఈ అనుసంధానం పోయినవారు రిథం పోయినవారు ఎప్పుడైతే మనలో ఈ రిథం ఒక క్రమం అనేది పోతుందో మనకి ఆ అనుసంధానం ఉండదు. మనం ఒకటి తలుస్తుంటాం ఇంకొకటి చేస్తాం ఇంకొకటి మాట్లాడతాం. మన మాటలకి చేతలకి మనం ఆలోచించే ఆలోచనలకు పొంతన ఉండదు. ఎందుకు అనుసంధానం పోయింది.","మన శరీరం ఒక విధంగా ఉంది ఒక శరీరం యొక్క స్థితి దాన్ని నిద్రపోవాలనిపిస్తుంది. మీ మనసులో వేరే ఆలోచనలు మళ్లా మీ లోపల ఒక ఇచ్చ ఒక వేరే కోరిక మీ మాట్లాడే మాటలు ఏవో మాట్లాడుతున్నారు పెద్ద పెద్ద మాటలు మాట్లాడుతున్నారు.","ఈ శరీరానికేమో తమోగుణం మనసుకేమో రజోగుణం మాటలేమో నేను ఇంత ధ్యానం చేసేస్తాను నేను ఇన్ని చేస్తాను నా జీవితంలో ఇన్ని మార్పులు తెచ్చుకుంటాను చాలా చాలా వాగ్దానాలు కూడా చేసేస్తాను నేను ఇది చేసేస్తాను అది చేసేస్తాను ఒక అనుసంధానం లేదు ఒక రిథం లేదు దేహ భ్రాంతితో దేహ నేనే దేహము నేను అంటే దేహమే అనే భావనతో ఉన్నామ అనుకోండి రిథం పోయినట్టే తమోగుణంలో మాత్రమే జీవిస్తూ తమోగుణ ప్రధానులై ఉంటాం.","సోమరితనము అలసట ఎప్పుడు లేజీగా ప్రతి ఒక్కటి పోస్ట్పోన్మెంట్ ప్రతి ఒక్కటి కూడా ఈరోజు చేయాల్సింది ఇప్పుడు చేయాల్సింది రేపు చేద్దాము వెళ్ళని చేస్తాను తర్వాత చేస్తాను వచ్చే నెల చేస్తాను ఇన్ని తమోగుణం అంటే అసురులకి ఉండే లక్షణాలు మనం గుర్తించగలం ఎంతోమంది రాక్షసుల గురించి మనం స్టోరీస్ లో విన్నాం అసురుల గురించి రావణాసురుడు కూడా అసురుడే బ్రాహ్మణుడు బ్రాహ్మణుడుగా పుట్టాడు బ్రాహ్మణుడు కులంలో పుట్టాడు కానీ పుట్టుకతో ఎవరు బ్రాహ్మణులు కారు కదా కానీ రాక్షసుడు అయ్యాడు అసురుడు రావణ అసురుడు","రావణ అసురుడు అ రావణాసురుడు రాక్షసుడుఅయ్యాడు చక్క వీణ వాయిస్తాడు ధ్యానం చేస్తాడు చాత జాతం చేస్తాడు కానీ అసురత్వం ఉంది రాక్షస గుణాలు ఉన్నాయి అదే పుట్టుకతో ఎవ్వరు బ్రాహ్మణులు కారంట ఆత్మజ్ఞానం బ్రహ్మజ్ఞానం వచ్చిన వారే బ్రాహ్మణులు బ్రహ్మణత్వం బ్రహ్మజ్ఞానం పొందిన వారు బ్రాహ్మణులు పుట్టుకతో ఎవరు బ్రాహ్మణులు కాదు ఒక జెనటిక్స్ వస్తుంది మనక అంతే ఎందుకంటే శాఖహారము కొన్ని కొన్ని నియమాలు పాటిస్తుంటారు ఆ శరీరంలో ఆ జెన్యూల్లో కరెక్ట్ ఎక్స్ప్రెషన్ బాగుంటుంది.","కానీ ఆత్మ పరంగా మీరంతా కూడా ధ్యానులే ఇప్పుడు మహిషాసురుడు ఈయన కూడా రాక్షసుడే కానీ ధ్యానం చేసేవాళ్ళు అందుకే చాలామంది రాక్షసులంతా అసరులంతా ధ్యానం చేస్తారు. కానీ ఎందుకు చేస్తారు వాళ్ళు ధ్యానం తపస్సు చేస్తారు అంటారు సిద్ధుల కోసం లేకపోతే నాకు మరణం లేకుండా నేను ఎప్పుడూ చావకూడదు నన్ను ఎవరు ఏది చేయకూడదు నేనే గొప్పగా ఉండాలి అందరికంటే నేనే పరిపాలకుడిగా అందరి మీద శాసించే అధిపతిగా ఉండాలి ఒక అలైన్మెంట్ లేదు మన ఆత్మ ఎప్పుడూ కూడా మన ఆత్మ చైతన్య స్థాయిల్లో ఉన్నవారు వారు ఎప్పుడూ కూడా వారి కోరికలు వేరే విధంగా ఉంటాయి.","తమోగుణ ప్రధానుల యొక్క కోరికలు వేరే విధంగా ఉంటాయి. రజోగుణం వాళ్ళకి వేరేగా ఉంటాయి. సత్వగుణం వాళ్ళు ఎలాంటి కోరికలు ఉంటాయి వాళ్ళు ఎప్పుడూ కూడా చాలా మంచివారు అని అంటాం సత్వగుణ ప్రధానులు అందరూ మంచి కోరుకుంటారు. శుద్ధ సాత్వికులు నిర్గుణులు వారి కోరికలు వేరుగా ఉంటాయి వాళ్ళ ఇచ్చ వేరుగా ఉంటుంది. నాతోపాటు అందరూ అని భావన చేస్తారు. లోకాధారణ నేను ఇన్ని ఇంత ఆనందాన్ని నేను పొందుతున్నాను ఇది అందరూ పొందాలి నేను కూడా సహాయకారకులుగా ఉండాలి. ఉడతా సహాయం నా వంతు నేను నేను కూడా కృషి చేస్తాను."],"minutes":10,"words":1396},{"title":"సుర · అసుర · త్రిగుణాలు","paras":["ఇది నిర్గుణులు నిర్గుణ స్థాయి చేరుకున్నవారు ఉన్నత స్థాయి చేరుకున్నవారు ఈ త్రిగుణాలను దాటిన వారు అమరులు వాళ్ళంతా కూడా నేను ఆత్మను అందరిలో ఉన్న ఆత్మే [గొంతు సవరించుకోవడం] నాలో ఉంది ఆ నాలో ఉన్న ఆత్మే అందరిలో ఉంది ఆ పరమాత్మే అంతా ఉంది సర్వం కల్విదం బ్రహ్మ అనే స్థాయి చేరుకున్నవారు ఎప్పుడు కూడా లోక కళ్యాణ అర్థం ఆ యజ్ఞాలే చేస్తుంటారు ఆ కార్యక్రమాలే దానిలో పాల్గొని ఉంటారు. నిరంతరము సేవ నిరంతరము సాధన నిరంతరము వారు అందరి మేలు కోరుకుంటారు. సర్వేజనా సుఖినో భవంతు అని అనుకుంటూంటారు. తమోగుణ ప్రధానులు అహంకారము మమకారము ఈ రెండే పట్టుకొని పీడిస్తుంటాయి.","అహంకారం చాలా ఉంటుంది అని తెలియకుండానే ఈ అహంకారం నుంచి అన్ని పుడతాయి ఇచ్చ ఉండడం తప్పేమి కాదు అంటే కోరిక ఉండడం తప్పేమి కాదు కోరిక లేకపోత రాక్షసుల పేర్లు చెప్పబడ్డాయి. ఇంకొక నిర్వచనం ఏంటంటే గుణాలతో పోల్చబడింది.","దుర్గుణాలు ఉన్నవారిని రాక్షస గుణాలు అని చెప్పబడ్డాయి.","ఇవన్నీ రాక్షస గుణాలు ఏమి చేయకూడదో అవి చేసుకుంటారు ఫర్ ఎగజాంపుల్ హాని చేస్తున్నారు అది చేయకూడదు అది అధర్మం అన్ని వేళ్ళలా ఎక్కడైనా సరే హింస ఎవరైతే చేస్తున్నారో అది అధర్మమే నిజమైన సనాతన ధర్మం అంటే అహింసయే ఏ హింస చేయకుండా ఉండడమే నిజమైన సనాతన ధర్మం కానీ హింస చేస్తున్నారు అనుకోండి రాక్షసుకు హింసా ప్రవృత్తి ఒకళ్ళకి హాని చేయడం బాధించడం అందుకే రాక్షసులు ఎప్పుడూ కూడా నూనులు ఋషులు వాళ్ళు తపస్సు చేసుకుంటే వాళ్ళ మీద వేడి వేడి నూనె కా పోస్తుంటారు డిస్టర్బ్ చేసేస్తుంటారు వెళ్లి వాళ్ళు","ధ్యానం చేసుకోకుండా వాళ్ళ ధ్యానం నుంచి లేపేస్తుంటారు ఇవన్నీ కథల్లో విన్నాం మనం ఎందుకంటే ఇది హింసా ప్రవృత్తి ఇదంతా అసురుగుణాలే దుర్గుణాలు అంటాం ఏమి చేయకూడదో అది చేయడం [గొంతు సవరించుకోవడం] ఏవి మాట్లాడకూడదో అవి మాట్లాడడం ఏవి వాక్కు ఏది పడితే అది మాట్లాడడం సరిైన వాక్కు లేకపోవడం సరిైన ప్రవర్తన లేకపోవడం సరైన నడవడిక లేకపోవడం సరిైన ధోరణి లేకపోవడం దృక్పదం లేకపోవడం సరిైన ఆలోచన లేకపోవడం ఇవన్నీ కూడా అసురు గుణాలే దుర్గుణాలు మనలో ఉన్నాయి అనుకోండి అవన్నీ ఎట్లా ఎక్స్ప్రెస్ అవుతాయి అంటే ఎలా","వ్యక్తీకరణ వ్యక్తపరచబడుతుంది అంటే ఒక అసర్ గుణాలుగా ఒక హింసగా వ్యక్తప పరచబడుతుంది.","ఇప్పుడు సింపుల్ ఒకటి మహిషాసురుడు ఈ కథలో మనం చెప్తాము చెప్పుకుంటాము. ఆయన జన్మ తీసుకున్న తర్వాత ఆయన కూడా తపస్సు చేశారంట. రాక్షసులంతా తపస్సు చేస్తారు బాగా ధ్యానం చేస్తారు కానీ దుర్గుణాలు ఉంటాయి. వాళ్ళు ఎక్కువ అహంకారము మమకారం వీటిలో ఎక్కువగా ఉంటాయి తీవ్ర స్థాయిల్లో ఉంటాయి. ఏది చేయకూడదో అది చేయడం ఏది మాట్లాడకూడదో అది మాట్లాడడం హింస హింసా ప్రవృత్తి కలిగి ఉండడం ఇవన్నీ అసురు గుణాలే సో రామనాశరుడు కూడా బౌండరీ వైలేషన్ అనేది చేశాడు. సీతామాతని ఒక వేషం వేసుకొని వచ్చి మరి లంకా నగరానికి తీసుకొని వెళ్ళాడు. ఆమె సమ్మతి లేకుండా బలవత్తంగా తీసుకువెళ్ళాడు.","సో ఏది చేయకూడదో అది చేశాడు అక్కడ విలన్ క్యారెక్టర్ అసుర గుణం రాక్షస గుణం ఒక మహిళని హింస చేశాడు బాధించాడు భార్యా భర్తల్ని వేరుపరిచాడు.","సీతామాత కోసం రాములు వారు చాలా దుఃఖించారు ఆమె కోసం తపించారు కలవాలనుకున్నారు వియోగం చెందారు సీతామాత కూడా రాములు వారిని ఎప్పుడు చూస్తాను అని అనుకుంటుంది లంకానగరం ఏవి చేయకూడదో అవన్నీ చేశాడు రామనాశరుడు ఏవి చేయకూడదో అవన్నీ చేశాడు మహిషాసురుడు ఏమి చేయకూడదో అవి చేశాడు భండాసురుడు ఏమి చేయకూడదో అవి చేశాడు వృత్తాసురుడు వీళ్ళంతా అసురులు రాక్షసులు ఈ పేర్లు చాలా చెప్పుకుని ఉంటాం ఇవన్నీ వచ్చేన్నీ కూడా మూడు గుణాల నుంచే మూడే మూడు గుణాలు డిఫరెంట్ ప్రొపోర్షన్స్ కామన్ కాంబినేషన్స్ లో కాంబినేషన్ పర్ముటేషన్స్ లో ఆ రేషియోస్ డిఫరెంట్ గా ఉంటాయి ప్రొపోర్షన్స్ డిఫరెంట్ గా ఉంటాయి.","అందుకే ఆ అసలు కూడా ప్రతి ఒక్కళ్ళకి ఒక్కొక్క విలన్ క్యారెక్టర్ ఒక నిర్దిష్టమైనటువంటి వాళ్ళ ప్రత్యేకంగా ప్రత్యేకతకత ఉంటుంది. సో మనం ఈ నవరాత్రులలో తొమ్మిది రాత్రులు ఈ తొమ్మిది రాత్రులు సాధన కోసం ఎంతో పర్వ దినాల కింద సాధకులకి నిర్దేశి పర్వదినాలు సాధనకు అనుకూలమైనటువంటి దినాలు అని చెప్పేసి చెప్పబడింది.","దాన్ని చక్కగా మనం యూటిలైజ్ చేసుకోవాలి వినియోగించుకోవాలి ఎందుకంటే ఎప్పుడూ మనం ఎంతో సాధన చేసి మనలో అంతర పరివర్తన తీసుకురావడానికి ఎంతో సాధన చేయాలి మీతో ఈ అనుకూలమైనటువంటి దినాల్లో మనం చక్కగా యూటిలైజ్ చేసుకుంటే ఆ దేవతా శక్తులు ఆ దేవీ శక్తి చక్కగా భూమండలం మీదంతా విరాజిల్లుతూ ఉంది మనం చక్కగా దాన్ని ఉపయోగించ ంచుకోవచ్చు మనం త్రిశక్తుల గురించి మొదటి రోజు చెప్పుకున్నాం. మూడు శక్తులు కలిసి ఎన్నో శక్తులు కలిసి ప్రధానంగా మూడు శక్తులు అందుకే ఈ పూజల్లో ఈ పండుగలో మనం ముగ్గురు గురించి మాట్లాడుకుంటూ ఉంటాం.","దుర్గామాత లక్ష్మీ మాత సరస్వతీ మాత దుర్గామాత కాళీ అవతారం తర్వాత లక్ష్మీ మాత మహాలక్ష్మి మహాదుర్గ మహాలక్ష్మి మహాసరస్వతి మొదటి మూడు రోజులు మహాదుర్గ అంటే మనం దుర్గమమైనటువంటివి కష్టమైనటువంటివి ఆటంకాలు అంతరాయాలు కలిగించేటటువంటి విషయాలు వాటినన్నిటిని దాటించగలిగే మహా దుర్గ క శక్తి అన్నమాట ఆ శక్తి ద్వారా మనలో దుర్గమమైనటువంటి వాటిని దాటడం ఛీదించడం మనలో వాటినే మనం మామూలుగా బ్లాకేజెస్ అని అంటాం సింపుల్ లాంగ్వేజ్ లో మనం మాట్లాడుకోవాలంటే బ్లాక్స్ మనలో ఉన్నటువంటి ఇంటర్నల్ బ్లాక్స్ బాహ్యంలో బ్లాక్స్ ఏం లేవు బాహ్యంలో లేవు మన అంతరంలోనే ఉన్నాయి.","మొత్తం అంతా జరిగేదంతా మన అంతరంలోనే సో ఈ మొదటి మూడు రోజులు కూడా ఫస్ట్ మనం ఇది ఫస్ట్ క్లియర్ చేసుకోమన్నారు దుర్గామాత యొక్క శక్తితో దుర్గామాత యొక్క శక్తి అంటేనే ఇచ్ఛా శక్తి అంటారు ఇచ్చా శక్తి మహాలక్ష్మి అంటేనే క్రియాశక్తి మహాసరస్వతి అంటేనే జ్ఞానశక్తి ఇప్పుడు మన మనమంతా కూడా ఆ తల్లి ముందర ఆ శక్తి మందరం బిడ్డలం చిన్న పసు బిడ్డలమే తల్లి వడిలోకి వెళ్ళిపోతుంటాం ఇప్పుడు చిన్న పిల్లలు ఎప్పుడు కూడా పరిగెత్తి ఫస్ట్ తల్లిని కగులించుకుంటారు. ఆ తల్లి మనకి ముద్దు పెడుతుంది. ఒళళలో పడుకోబెట్టుకుంటుంది జోల్ పాట పాడుతుంది."],"minutes":9,"words":1247},{"title":"జగన్మాత · మూడు మాతలు","paras":["మన తల్లితో మనక ఎన్నో అనుభవాలు ఉన్నాయి.","ఈ జగన్మాత కూడా అంతే ఆ శక్తి కూడా మనల్ని ఆలిస్తుంది పాలిస్తుంది జోల పాటు పాడుతుంది ఆ జగన్మాత వళళలోకి వెళ్ళిపోవాలి మనం ఈ మూడు రోజులు ఫస్ట్ మూడు రోజులు ఈ తొమ్మిది రోజులు ఆ జగన్మాత దగ్గర ఉండాలి మనకి చిన్నప్పుడు మనక ఏదైనా కష్టం కలిగితే ఏం చేస్తాం మనం మనక ఏమన్నా కష్టం వస్తే ఏమన్నా ఇబ్బంది కలిగింది ఫస్ట్ వెళ్లి ఎవరికి చెప్తాము అమ్మకి చెప్తాం అమ్మ దగ్గరికి వెళ్లి అమ్మ అమ్మ ఇది జరిగింది నాకు ఆ పిల్లవాడు కొట్టాడు నన్ను వీళ్ళు తిట్టారు నాకు దెబ్బ తగిలింది నొప్పి వచ్చింది ఏమ వచ్చినా కూడా అమ్మకి రిపోర్ట్ చేస్తాం ఫస్ట్ అమ్మ సహాయం తీసుకుంటాం అమ్మ వెంటనే సహాయం చేస్తది.","అమ్మ నాకు ఇది కావాలి అని అడుగుతాం నాన్న ఎప్పుడు అడగం కొంచెం ఇన్హిబేషన్ ఉంటది నాన్న తర్వాత లాస్ట్ లో అడుగుతాం ఫస్ట్ అమ్మే ఏది కావాలన్నా అమ్మ అమ్మ దగ్గరికే వెళ్లి అడగాల అమ్మ నాన్నను కూడా కన్విన్స్ చేస్తుంది. చిన్నప్పుడు నేను ఒక బొమ్మ కొనుక్కోవాలి అనుకున్నా మా అమ్మని వెళ్లి ఫస్ట్ అడిగావాడిని రోజు నాకు ఈ బొమ్మ కని బొమ్మకు నాన్నని అడగడం కష్టం అన్నమాట నాన్నని అడగలేం అమ్మ ఏదో ఒక విధంగా నాన్నతో చెప్పి ఆ డబ్బులు అన్ని వన్నులన్నీ సేకరించి చక్కగా ఆ బహుమానం ఆ ఆ బొమ్మ కొనిస్తుంది. మనం కూడా ఈ తొమ్మిది రోజులు మన అమ్మ దగ్గర ఉండాలి.","అంటే అమ్మ అంటేనే శక్తి అమ్మంటేనే ఆ గొప్ప శక్తి ఆదిశక్తి పరాశక్తి అపరాశక్తిగా ఎన్నో రూపాల్లో ఇక్కడికి వచ్చింది ఆ తల్లినే మనం దుర్గామాత మహాదుర్గా మహాకాళి ఎన్నో నామాలతో మనం పిలుచుకుందాం లేకపోతే రోజుకొక పేరు శైలపుత్రి, బ్రహ్మచారిణి, కుష్మాండ ఈ పేర్లు ఎన్నో పేర్లతో మనం పిలుచుకుంటూ ఉంటాం.","ఒక్కొక్కటి ఒక్కొక్క ఎక్స్ప్రెషన్ అంతే ఒకటే తల్లి ఒకటే జగన్మాత మన అమ్మ దగ్గరికి వెళ్ళాలి ఫస్ట్ మన సమస్య వచ్చింది మనం ఎవరి దగ్గరికి వెళ్తాం బాహ్యంలో పరిగెడుతున్నాం ఎక్కడికో పరిగెడుతున్నాం మన శక్తి దగ్గరికి వెళ్ళాలి మనం మనం అమ్మతో చెప్పుకోవాల చాల అమ్మకి తెలుసులే అమ్మ చేస్తది అమ్మ అమ్మకే మనకి ఆకలే వేస్తే అమ్మని అడగాల ఆకలి వేసిందని అమ్మని అడగకపోతే ఆకలి వేసిన అమ్మ తను తెలుసుకొని మనకి అన్నం పెడుతుందా పెట్టొచ్చు కానీ మనం అడగాల చాలామందికి కొంత అహంకారం ఉంటుంది ఆ నేను అడగను అమ్మే","ఇవ్వాలి అమ్మే తెలుసుకోవాల అమ్మే ఇవ్వాలి నాకు కొంతమంది అట్లా అనుకుంటారుఅన్నమాట మా అమ్మకే అన్ని నా గురించి తెలుసుకొని నా దగ్గర దగ్గరికి వచ్చి అన్నీ ఇవ్వాల మన అమ్మని అడగాల ఒక చైల్డ్ లాగా ఒక చిన్న బిడ్డలాగా అయిపోవాల అమ్మవాడిలో ఉండాల ఈ తొమ్మిది రోజులు ఎప్పుడు తర్వాత కూడా ఎందుకంటే ఆ పరాశక్తి ఆదిశక్తి ఈ సృష్టి అంతా జరిగింది బ్రహ్మాండాలు ఎన్నో గలాక్సీస్ ఎన్నో ఎన్నో సౌరమండలాలు ఈ విశ్వాలు ఎన్నో విశ్వాలు సృష్టి చేసిన ఆ పరాశక్తి అమ్మన మన అమ్మ మనక ఏం కావాలో ఆ అమ్మని కోరుకోవాల అమ్మ ఇచ్చా","శక్తి అంటేనే అంతే అమ్మ నాకు ఇది కావాలి ఆ శక్తిని వెళ్లి అడగాలి అంతే ఆ శక్తి మనక ఏం కావాలో అన్ని చేస్తుంది అమ్మ అమ్మ కరుణిస్తుంది అమ్మకు తెలుసు మనం అడగాలే కానీ రెడీగా ఇస్తుంది అన్ని అమ్మ కరుణామయి అమ్మ హృదయం కదిలిపోతుందంట మనం ఏమన్నా అడిగామంటే అబ్బా నా బిడ్డ అడుగుతున్నాడు ఇది కావాలని కోరుకుంటున్నాడు అని చెప్పి అదే ఇచ్చాశక్తి ఈ ఇచ్చాశక్తితో మనం మనలో ఉన్నటువంటి దుర్గమయమైనటువంటి ఎన్ని బ్లాకేజెస్ ఉన్నాయో అన్ని తొలగించుకోవాలి వాళ్ళ అమ్మతో ఫస్ట్ మనం ఏవైతే పరిమితుల్లో ఇరుక్కుని ఉన్నామో","ఏవైతే పునరావృత్తం అవుతున్నాయో కొన్ని కొన్ని రిపీట్ అవుతున్నాయో ఇబ్బంది పెడుతున్నాయో మన సాధనకి ఇబ్బంది పెట్టేవి ఎన్నో ఇబ్బంది పెడుతుంటాయి మనకు తెలియకుండానే మనం కొంతమంది సాధన కంప్లీట్ అయిన వాళ్ళు వాళ్ళు ఎక్కువగా వాళ్ళ పర్పస్ లో వాళ్ళు ఉంటారు.","వారు ఎక్కువగా వారి ధర్మాన్ని నిర్వర్తిస్తుంటారు. ధ్యాన ప్రచారం గాన శాఖహారం చెప్పడం గానీ ఏదో ఒక ప్రాజెక్ట్ వర్క్ లో వాళ్ళు నిమగ్నమై ఉంటారు. సాధన కంప్లీట్ అయినవాళ్ళు అంటే సాధన కంప్లీట్ అంటే సాధన ఎప్పుడూ కంప్లీట్ కాదు సాధన చేసుకుంటూ ఉంటాం కానీ ఎక్కువ ధ్యాన ప్రచారానికి టైం ఇస్తుంటారు అందరికీ నేర్పించడానికి టైం ఇస్తుంటారు.","వాళ్లో ఆ కంప్లీషన్ వచ్చింది కాబట్టి సో మనం మన ఇచ్చాశక్తి మనం అయిన ఈ ఇచ్చా శక్తిని మనం వినియోగించుకోవాలి మన అమ్మని మనం అడగాలి మనక ఏం కావాలో అడగాలి మనం చేసే ధ్యానసా సాధన ద్వారా మనలో వస్తున్న శక్తి ఇవన్నీ కూడా ఒక్కొక్కటి ఓవర్కమ్ చేస్తాం మనం ఫస్ట్ దుర్గమం బ్లాక్స్ ని క ఎక్కడెక్కడో తిరుగుతున్నాడు ఎక్కడెక్కడికో వెళ్తున్నాడు బాహ్యంలో తిరుగుతున్నాడు","ఎక్కువగా అసురత్వము అంతా హింస వస్తుంది అప్పుడు అసురులాగా తయారవుతాం ఇప్పుడు లోకంలో చూస్తే మనం అన్ని యుద్ధాలు మారణకాండ మారణ హోమము ఏం చేస్తున్నారో తెలియదు యువత కూడా ఏం చేస్తున్నారో తెలియదు ఒక డైరెక్షన్ లేదు బాహ్యంలోకి వెళ్ళిపోతారు బాహ్యం అంత ఇప్పుడు ఉండే జనరేషన్ అయితే బాహ్యమే అంతా బయటే బయటే బయట వెతుకుతుంటారు అన్ని ఆనందం బయట వెతుకుతున్నారు ఫోన్లు ప్రతి సంవత్సరం కొత్త ఫోన్ కొత్త ఫోన్లో ఆనందం ఎత్తుతుంటారు అన్నమాట కొత్త ఫోన్ ద్వారా ప్రపంచం అంతా వాడు స్మార్ట్ ఫోన్ సో ఈ నవరాత్రిలో కూడా"],"minutes":8,"words":1180},{"title":"సురత్వం · మనసు ఉపవాసం","paras":["మనం కొన్ని ఫాస్టింగ్ చేయాలి.","అంటే ఫాస్టింగ్ అంటే మైండ్ ఫాస్టింగ్ ఎనీవే చేస్తున్నాం మనం మైండ్ ఫాస్టింగ్ అంటే ఏంటి మనసుని మనసులో ఆలోచనలు ఖాళీ చేసుకొని ఉండడం మౌనంగా ఉండాలి బాహ్యమే కాదు అంతరంగా కూడా మౌనంగా ఉండాలి ఎందుకు మన ఎనర్జీని కన్సర్వ్ చేసుకోవాలి బాహ్యంలోకి వెళ్ళకుండా సోషల్ మీడియా ఫాస్టింగ్ కూడా చేయాలి.","లేకపోతేఇస్గ్ర రీల్స్ వాటికి ఫాస్టింగ్ కూడా చేయాలి వాటిని కూడా వాటి నుంచి కొంత వయదగాలి మన టైం అంతా దానిలో వేస్క అయిపోతుంది బాహ్యంలోకి వెళ్ళిపోతున్నాం దానిలోకి ఇవన్నీ అడిక్షనే ఇవన్నీ కూడా మనని దూరంగా చేస్తున్నాయి అసురత్వమే ఇది అంతా కూడా మన నుంచి ఏది దూరం చేస్తుందో వాటిని కూడా గుర్తించాలి మనం ఓ ఇది నన్ను నా దగ్గరగా కాకుండా నా నుంచి నేను దూరంగా ా వెళ్తున్నాను అని తెలుసుకొని మనం వెంటనే మన దగ్గరకి వెళ్లే ప్రయత్నం చేయాలి.","అందుకే ఈ తొమ్మిది రోజులు కూడా మనం ఎక్కువ మౌనము అంతర్మౌనము అంటే ధ్యాన సాధన మనం మూడు పూట్ల తినేవాళ్ళయితే రెండు పూట్లు పుట్ల రెండు పూట్ల తింటున్నారు ఆల్రెడీ ఓన్లీ రెండు పూట్లే తింటున్నారు ఒక్క పూట ఏకభుక్తము అంటే ఒకవేళ తిన్నా కూడా చాలా పరి పరిమితంగా చాలా తక్కువ మోతాదులో తినడము మనసు కూడా ఫాస్టింగ్ చేయడము మైండ్ ఫాస్టింగ్ సోషల్ ఫాస్టింగ్ ఎక్కువగా బయట షాపింగ్ మాల్స్ వెళ్లి సినిమాలు షికార్లు ఇవన్నీ కూడా తర్వాత తొమ్మిది రోజుల సాధన తర్వాత చేయకూడదని కాదు కానీ వినియోగించుకోవాలి సమయాన్ని చక్కగా వినియోగించుకోవాలి.","సో మొదటి మూడు రోజులు మనం బ్లాక్స్ ఇంటర్నల్ బ్లాక్స్ ని అమ్మకే చెప్పేసుకోవాలి నాకు ఈ ఇవి తొలగిపోవాలి అమ్మ నాకు ఈ కష్టం ఉందమ్మ నాకు నేను తొలగించుకోవాలి దీని నుంచి ఓవర్కమ్ చేయాలి బ్లాక్స్ నుంచి అధిగమించాలి ఇవి చాలా దుర్గంగా ఉన్నాయి కష్టంగా ఉన్నాయి దాటాలి అనుకుంటున్నాను అదే సంకల్పం నాది అది ఏదైనా సరే సరే అమ్మకు చెప్పాలి అమ్మ అంటేనే ఇక్కడ శక్తి మొదటి రోజు మనం అనుకున్నాం మూడు గోల్స్ రాయాలను మన శక్తిని డైరెక్షన్ ఇవ్వాలి అందుకే గోల్స్ మనకి పెట్టుకోవాలి ఎప్పుడు కూడా లేకపోతే డైరెక్షన్ లేకపోతే ఆ శక్తి ఎక్కడికి వెళ్తుంది ఒక డైరెక్షన్ ఇవ్వాలి కచ్చితంగా గోల్స్ ఉండాలి.","మన పర్పస్ తెలియకపోయే మన పర్పస్ మనం తెలుసుకునేంతవరకు ఒకసారి తెలుసుకోవాలంటే కొంత సాధన చేసిన తర్వాత మన పర్పస్ ఏంటో తెలుస్తుంది. అంటే ఏ జీవిత లక్ష్యంతో ఏ జీవిత ధ్యయంతో నా ఆత్మ ప్రణాళికతో ఇక్కడ వచ్చాను అనేది తెలుసుకోవడానికి కొంత సాధన చేసిన తర్వాత తెలుస్తుంది. కానీ అంతకుముందు మనం కొన్ని గోల్స్ పెట్టుకోవాలి. నాకేం తెలియదు కాబట్టి నాకేం మన ఎనర్జీ ఒక డైరెక్షన్ లో వెళ్ళకపోతే దుర్వినియోగం అవుతుంది. అందుకే ఎలాంటి సంకల్పాలు ఈ ఇచ్ఛాశక్తి ఈ మొదటి మూడు రోజులు ఇచ్ఛాశక్తి అనుకున్నాను కదా సరిైన సంకల్పాలు సరిైన కోరికలు కావాలి.","అమ్మకి చెప్పండి క్లియర్ గా రాయండి నాకు ఇది నా కోరిక ఇది లాహిర్ మహాసయ గారికి ఒక కోరిక మిగిలిపోయింది. గత జన్మలకు సంబంధించిన ఒక కోరిక. ఒక రాజ్యభావనంలో జీవించాలని అనుకున్నారు. సో ఆయన లాహిర మహాశయగా జన్మ తీసుకున్న తర్వాత ఆయన ఉద్యోగం చేస్తారు చాలా ఉద్యోగ ధర్మం ఎప్పుడూ కూడా విస్మరించేవాళ్ళు కాదు.","రాణికేత్ అనే ఆ ప్రదేశంలో ఉద్యోగ రీతి అక్కడికి వచ్చినప్పుడు కొంత ఖాళీ సమయం దొరికినప్పుడు ఎందుకో లోపల నుంచి ఆ పర్వతం మీదకి ఎక్కాలనిపించింది ఎక్కారు పర్వాతరోపణ చేసి మరి ఒక గుహ దగ్గరికి వచ్చేసరికి ఒకాయన వెయిట్ చేస్తున్నారు ఆయన అడిగారున్నమాట నీ వస్తువులన్నీ నిన్ను నన్ను గుర్తుపట్టావ అంటే నాకేం గుర్తు నేను మిమ్మల్ని ఫస్ట్ టైం కలుస్తున్నాను అని చెప్పారు ఆ గుహలో ఉన్న వ్యక్తితో ఆయన ఒక గురువు కానీ ఆ గురువుగారు ఈయన కోసం వెయిట్ చేస్తున్నారు.","చెప్తున్నారు నేను మోర్ దాన్ ఇన్నినూ 50 సంవత్సరాల నుంచి ఇక్కడే ఉన్నాను నేను నీ కోసం వెయిట్ చేస్తున్నాను 150 సంవత్సరాల నుంచి ఒక గురువు వెయిట్ చేస్తున్నాను ఆయన కోసం నీ వస్తువులు కొన్ని ఉన్నాయి అన్నారు నా వస్తువుల నా వస్తువులు ఏం లేదు నా వస్తువులన్నీ నా ఇంట్లో ఉన్నాయి ఇవి కాదు నేను చెప్పే విషయం అని చెప్పి లోపలికి వెళ్లి చూపించారు. ఆయన కమండలము ఆయన కూర్చునే ఆసనము దర్బలు ఇవన్నీ కూడా కొన్ని అవన్నీ చూపిస్తే ఆయనకి ఏదో స్మృతి తగిలింది ఏదో తెలిసినట్టుగా ఇంకా తెలియలేదు కానీ ఎందుకంటే ధ్యాన సాధన చేయకపోతే తెలియదు.","సో ఆయన మహావతార్ బాబాజీ గుర్తించారు ఈ శిష్యుడికి ఒక కోరిక మిగిలిపోయింది. ఒక రాజభవనంలో నివసించాలనే కోరిక మిగిలిపోయింది ఆ ఒక్క కోరికే ఒక్క ఇచ్చే స్టాప్ చేసేస్తుంది ఆయన బ్రహ్మజ్ఞాని ఆల్రెడీ ఆత్మజ్ఞానంలో పరాకాష్ట చేరుకున్నారు. ఇంకొక్క మెట్టు ఈ ఇచ్చ తీరిపోతే కోరిక తీరిపోతే గురువులు చేసే పని ఇది. మన దేవీ మాత వీరు చేసే పని ఇది మనలో ఏదైతే ఆటంక పరుస్తుందో ఆధ్యాత్మికంగా వాటిని తొలగిస్తారు సో దట్ మన ప్రయాణం ఆత్మ ఆధ్యాత్మిక ప్రయాణం సుగమ్యంగా ఉంటుంది.","పర్టిక్ులర్ గా ఎవరు లోక కళ్యాణార్థం అంటే ఈ మెగా ప్రాజెక్ట్స్ అంటే వాళ్ళు ఇది అందరికీ తెలియాలి అందరిలో ఈ ఇది జ్ఞానం అందరికీ రావాలి ఇద అని ఆ ఇచ్చా కోరికలు ఉన్నవారందరూ కూడా వారి గురువులు గాని వారి ఈ దేవతా శక్తి కచ్చితంగా వారందరికీ కూడా వీటి నుంచి ఉపసమనం వచ్చేట్లు చేస్తుంది.","ఆ లాహిర్ మహాశయ గారు మహతార్ బాబాజీ ఒక రాజభవనం సృష్టి చేసి 24 గంటలు ఆయన కోరిక తీర్చేసారు అక్కడే పక్కనే మహతార్ బాబాజీ గారి గుహ ఇప్పట ఏ గుహలో కలిసారో లాయర్ అది ఇప్పటికే ఉంది చాలామంది వెళ్తుంటారు నార్త్ ఇండియాలో రాణికేత్ అనే ప్రాంతంలో దాని వెనకాల ఆ గుహ వెనకాలే ఒక రాజభవనం సృష్టి చేశారంట రాజభవనంలో ఒక 24 గంటలు ఆయన చక్కగా హాయిగా తృప్తిగా గా ఆయనకి అది ఆ కోరిక తీరింది. సో ఇచ్చాశక్తి వాట్ డు యు వాంట్ మీకేం కావాలి? మీకేం కావాలి? చాలామంది ఈ క్వశ్చన్ అడగరు వాళ్ళు నాకేం కావాలి అని అడగరు.","కానీ అడగాలి నాకేం కావాలి నాకేం కావాలి మనల్ని ఎవరు కూడా అడగలేదు ఇంతవరకు చిన్నప్పటి నుంచి కూడా మీకేం కావాలి నిజంగా ఏం కావాలి ఎవరు అడగలేదు కానీ మనం ఇప్పుడు ఆ క్వశ్చన్ మనల్ని అడుక్కోవాలిన్నమాట మనకు తెలుసు మన మన పరిణామ ఆత్మ పరిణామ స్థితి బట్టి నాకు ఏం కావాలి జీవితంలో నేను ఏం కోరుకుంటున్నాను అంటే మనక ఆన్సర్ లోపల నుంచి వస్తుంది మనకు తెలుసు ఎగజాక్ట్ గా మనక ఏం కావాలో మనకు తెలుసు కానీ క్లారిటీ ఉండాలి స్పష్టత ఉండాలి ఏం కావాలో మనం తెలుసుకోవాలి ఫస్ట్ వాట్ డు యు వాంట్ వాట్ డు ఐ వాంట్ మనం ఏది కోరుకున్నా కూడా అది ఒక అలైన్మెంట్ లో ఉంటే మీ హైయర్ పర్పస్ తో అలైన్మెంట్ లో ఉంటే ఆ ఇచ్చ ఆ సంకల్పం ఆ కోరిక తీరుతుంది.","ఈ శక్తి ఈ దైవిక శక్తి అది మేనిఫెస్ట్ అయ్యేటట్లు అది సంపూర్ణమయ్యేట్లు చేస్తుంది మీ కోరిక తీరేటట్లు చేస్తుంది. ఇది సత్యము చాలామందికి ఐహిక వాంఛలు ఉంటాయి. ఐకవాంచ అంటే మన ఇక్కడ ఈ ప్రపంచంలో సంబంధించిన కోరికలు కూడా ఉంటాయి.","కొంతమందికి వాళ్ళ ఇచ్చ ముక్తికి సంబంధించిన ఇచ్చ ఉంటుంది నేను ఎన్లైటన్మెంట్ పొందాలి నేను జ్ఞానం దివ్యజ్ఞాన ప్రకాశం పొందాలి నేను ఆధ్యాత్మికంగా నా త్రడై ఓపెన్ చేసుకోవాలి లేకపోతే నేను ఆ మహాకారణ శరీరంలో ఉన్న ఆ గురువుల్ని నేను కలవాలి ఇలా ఇలా కూడా ఉంటాయి ఇచ్చలు కోరికలు ఉంటాయి ఒక చిన్న ప్రాసెస్ ఈ ప్రాసెస్ ఏందంటే వాట్ డు ఐ వాంట్ వాట్ డు యు వాంట్ ఆ క్లారిటీని మనం తెలుసుకోవాలి ఫస్ట్ నిజంగా ఏం కావాలనేది తెలుసుకోవాలి ఎందుకంటే అండర్లైన్ గా దాని వెనకాల నిజంగా మనకు కావాల్సింది ఏదో వేరేది ఉంటుంది అది తెలుసుకోవాలి అది పట్టుకోవాలి ఇది కూడా ఇంపార్టెంటే ఫర్ ఎగ్జాంపుల్ నాకు డబ్బు కావాలి ఎందుకంటే ఆర్థిక ఇబ్బంది ఉంది.","ఆర్థిక ఇబ్బందులు ఉంటే మీకు రుణాలు ఉన్నాయి అంటే కొన్ని అప్పులు చేశారు లేకపోతే మీరు కొన్ని పెండింగ్ ఉన్నాయి బ్యాంకు లోన్స్ తీసుకున్నారు తీర్చలేకపోతున్నారు ఆర్థిక ఇంప్రెస్ వారి ఫోన్లు వస్తుంటాయి మీకు మీరు ధ్యానం చేస్తుంటారు ఫోన్లు వస్తున్నాయి.","ఇబ్బంది పెడుతున్నారు ఎప్పుడు కడతారు మీరు మీ లోన్స్ తీరాలి మీరు ప్రతి నెల అద్యకట్టాలి లేకపోతే ఎలక్ట్రిసిటీ బిల్లు ఫోన్ బిల్లు ఈ టాక్స్లు ఆ టాక్స్లు ఎన్నో ఉంటాయి కుటుంబ పోషణ ఆర్థిక ఇబ్బందులు ఆర్థిక సమస్య సో మీరు ఒకవేళ మీ ఇచ్చ ఏంటంటే నాకు డబ్బు కావాలి అనుకున్నారు అనుకుంటే ఒకవేళ డబ్బు మీకు కంప్లీట్ గా సమకూరితే మీరు ఎలా ఫీల్ అవుతారు ఏ అనుభూతి మీకు కలుగుతుంది అని క్వశ్చన్ చేసుకోవాలి. వెన్ ఐ గెట్ వాట్ ఐ వాంట్ వాట్ డు ఐ ఫీల్ అలా చాలాసార్లు అడిగితే మనకి నిజంగా కావాల్సింది వేరేది ఉంటుంది.","నేను ఒకటి ఇప్పుడు ఎవరనా మన మిత్రుల్లో ఇక్కడ జూమ లో పార్టిసిపేట్ చేస్తున్న వారు ఎవరనా ఒక్కళ్ళ వారంటీర్ చేయండి.","వాళ్ళని అడుగుతాను నేను ఎందుకంటే అందరికీ కూడా దాని వలన తెలుస్తుంది మీరు మీ డిజిటల్ హ్యాండ్ ని రైస్ చేయొచ్చు ఎవరైనా సరే లేకపోతే నేనైనా సెలెక్ట్ చేస్తా ఓకే రైట్ అంటే నేను నేను క్వశ్చన్లు అడుగుతున్నాను మీరు క్వశ్చన్లు అడగడానికి కాదు ఇది నేనే క్వశ్చన్ అడుగుతాను వాట్ డు యు వాంట్ అని క్వశ్చన్ అడుగుతాను ఇంకా మెనీ క్వశ్చన్స్ అడుగుతాను ఓకే హారిక గారు మీరు సెలెక్ట్ చేస్తారా ఒకళని ఎస్ సార్ జమీలా మేడం మేడం ఓకే వెరీ గుడ్ రైట్ జమీల మేడం సార్ నమస్కారం సార్ నమస్కారం నేను ఒక ప్రశ్న అడుగుతాను","మిమ్మల్ని ఎందుకంటే ఇది ఒక డెమో లాగా అందరికీ కూడా ఇది ఈ ప్రాసెస్ గురించి అర్థంఅవుతుంది కాబట్టి ఓకే ఈ ప్రశ్న ఏంటంటే మీకు వాట్ డు యు వాంట్ ఓకే అంటే సార్ అంటే నా మనసులో చెప్తున్నాను సార్ నేను మీరు మనసులోనే చెప్పండి అమ్మ సర్ నేను ఎప్పటి నుంచో ఆ అంటే మా భర్త ఎప్పటి నుంచో ఒక హై ఉద్యోగం అంటే అన్ని క్వాలిఫికేషన్స్ ఉన్నాయి సార్ పిహెచ్డి నెట్ స్లీట్లు అన్ని ఉన్నాయి సార్ అంటే ఒక సెంటెన్స్ లో చెప్పేయండి అమ్మ ఆ తను మంచి తను మంచిగా ఉన్నతంగా సెటిల్ అయితే నేను ఆధ్యాత్మికంగా అంటే ఒక ఫ్యామిలీ","లో వెల్ సెటిల్ అయితే నేను స్పిరిచువల్ గా గ్రోత్ అవ్వచ్చు కదా అని వెరీ గుడ్ మంచిగా చెప్పారు సో మా మీరు చెప్పినది నేను మళ్లా చెప్తాను నేను నా భర్త మంచి ఉద్యోగం మంచి పొజిషన్ మంచి వస్తే ఆధ్యాత్మికంగా నాకు ఇబ్బంది ఉండు ప్రోగ్రెస్ అవ్వడానికి ఉంటుంది.","ఇప్పుడు ఆ అనుభూతి ఆ అనుభవం మీ హస్బెండ్ కి జాబ్ ప్రమోషన్ వచ్చి కరెక్ట్ జాబ్ వచ్చింది మంచి జాబ్లో సెటిల్ అయ్యారు మీరు ఆధ్యాత్మికంగా ప్రోగ్రెస్ అయితే మీరు ఎలాంటి అనుభూతి పొందుతారు సార్ చాలా ఆత్మతృప్తి సార్ ఆత్మతృప్తి వెరీ గుడ్ మంచి [గొంతు సవరించుకోవడం] సార్ ఆత్మతృప్తి సార్ ఇఅది చాలు సార్ నాకు లైఫ్ కి ప్రాపంచికంగా పిల్లలు ఆటోమేటిక్గా అంటే లోక కళ్యాణార్థం సేవ చేస్తుంటే ఇక్కడ పిల్లలు అంటే నేను పిల్లల్ని చేర్చ వాళ్ళంతట ప్రకృతే చూసుకుంటాదని ఒక మంచి స్ట్రాంగ్ బిలీవ్ సర్ నాకి కరెక్ట్"],"minutes":9,"words":1286},{"title":"ఆత్మ తృప్తి · జీవిత లక్ష్యం","paras":["సో ఆటోమేటిక్ గా పిల్లల్ని కూడా ప్రకృతే చూసుకుంటాది సో ఇప్పుడు ఆత్మత మీరు ఆత్మ తృప్తి పొందారు అనుకోండి వచ్చేసింది ఆత్మత ఆ అనుభవం పొందిన తర్వాత మీకు లోపల ఎలా అనిపిస్తుంది ఆత్మ తృప్తి ఫుల్ గా వచ్చేసింది మీకు మీ పిల్లలు హాయిగా చక్కగా చేయాల్సింద అన్ని చేస్తున్నారు మీరు ధ్యానం చేస్తున్నారు ఆధ్యాత్మికంగా ఎన్నో చక్కగా అన్ని చేయగలుగుతున్నారు మీరు ఆత్మ తృప్తి వచ్చేసింది ఏ అనుభూతి కలుగుతుంది లోపల ఎలా ఫీల్ ఇంకా చాలు సార్ ఇంకా అంటే ఇంకా మాస్టర్స్ ఇంకా నా చేత ఏం చేయించబడాలో దానికి సిద్ధంగా","ఉంటాను ఇంకా నా తర్వాత వాళ్ళకే సరెండర్ అయిపోతాను సార్ నేను వెరీ గుడ్ అంటే మీ పర్పస్ ఆఫ్ లైఫ్ మీ జీవిత జయం ఏదైతే దేనికోసం అయితే పుట్టారో ఆత్మ ప్రణాళికతతో పుట్టారో దానితో దాని పైప మీరు దృష్టి సారించి అది మీరు చేసేస్తారు మీరు ఫుల్ఫిల్ చేస్తారు అంతే కదమ్మా ఎస్ సార్ వెరీ గుడ్ వెరీ గుడ్ సో మీ పర్పస్ ఆఫ్ లైఫ్ మీ జీవిత లక్ష్యాన్ని మీరు కంప్లీట్ చేశారు చేస్తే మీరు ఏ అనుభూతి పొందుతారు?","అదే సార్ ఇప్పుడు అంటే ఇన్నర్ ఆత్మతృప్తి అంటే సార్ చాలాసార్ అంటే ఇంకా తర్వాత ఇంకేది ఉంది అనేది ఇంకా అంటే పెద్ద పెద్ద మాటలుయతే మాట్లాడ మోక్షం ముక్తి ఇంకా మల్ల ఈ జనన మరణం ఇంకా మన పర్పస్ అంటే ఈ కోరికలు ఉన్నంతవరకు మనం వస్తూనే ఉంటాం పోతూనే ఉంటాం ఇంకా అన్ని నిల్ మైండ్ సార్ అంటే ఈ జన్మ తీసుకున్నాం కాబట్టి ప్రాపంచికంగా వాళ్ళ బాధ్యతలు వాళ్ళు నా పర్పస్ ఏదిఉందో మాస్టర్స్ అంటే నేను నాకు ప్రకృతి ఈరోజు ఇది ఇస్తుందంటే అది నా ప్రణాళికే అనుకుంటాను సార్ ఒక చెట్టు నాటడం సరే ఒక అన్నదానం ఏదైనా సరే","ఒక ధ్యానం చెప్పడం అయినా సరే అంటే ప్రకృతి నాకు ఇది ఇచ్చింది అది నా హార్ట్ ఫుల్ గా చేయడమే నా ప్రణాళిక అనుకుంటున్నాను సార్ రైట్ మీ ప్రణాళిక మీరు అలా చేస్తే మీకు ఆత్మ తృప్తి కలుగుతుంది ఆత్మ ఆనందం కలుగుతుంది అని చెప్పారు కదా ఎస్ సార్ రైట్ సో సో మీ ఫస్ట్ మీరు చెప్పింది మీ భర్త ఉద్యోగం మంచి ఉద్యోగంలో సెటిల్ కావడము మీరు ఆధ్యాత్మికంగా అది చాలా ఉపయోగపడుతుంది మీరు ఇంకా ఆధ్యాత్మికంగా పురోభవృద్ధి చెందొచ్చు అని చెప్పారు మీకు దాని ద్వారా ఆత్మతృప్తి వస్తుంది దాని తర్వాత ఆత్మ తృప్తి బాగా","కలిగినప్పుడు మీ పర్పస్ మీ జీవిత లక్ష్యం వైపు మీరు దృష్టి సారించి మీరు పర్పస్ ని ఫుల్ఫిల్ చేస్తారు మీ పర్పస్ ఫుల్ఫిల్ చేస్తే మళ్ళా మీకు ఆత్మానందం ఆత్మ తృప్తి బాగా కలుగుతుంది ఇంకా బాగా కలుగుతుంది సర్ వెరీ గుడ్ సో ఇప్పుడు ఆ అమ్మని ఆదిశక్తి పరాశక్తి మనలో ఉన్నటువంటి శక్తి అమ్మ శక్తి రూపిని ఆ శక్తికి మీరు ఈ మీ ఇచ్చ ఏంటంటే మీ కోరిక నిజమైన కోరిక యాక్చువల్ గా తృప్తిగా ఉండడం అన్నమాట ఆత్మ తృప్తి మీరు ఆత్మతృప్తిగా ఉన్నారు అనుకోండి మీరు ఆధ్యాత్మి అన్నీ జరుగుతాయి మీ పిల్లలు వాళ్ళు","చేయాల్సింది చేస్తుంటారు తర్వాత మీ భర్త చక్కగా మీ నుంచి కూడా అది సహాయ సహకారాలు ఏంటంటే మీ నుంచి గొప్ప వైబ్రేషన్స్ కూడా వెలువడం వలన కూడా ఆయన కూడా ధ్యానం చేస్తారేమో తెలిీదు.","సర్ ఇంకొక చిన్న విషయం ఏందంటే సార్ మొత్తం ధ్యాన కుటుంబం సార్ మరి నేను మా హస్బెండ్ నుంచే ధ్యానం వచ్చాను సార్ నేను మా ప్రణాళిక చిన్న ఏజ్లోనే నేను ఈ రోగం తెచ్చుకున్నాను అనే అవగాహనం ఉండదు కదా సార్ మరి అప్పుడు అది శిక్షనే అవుతుంది కదా సార్ శిక్షణ ఎలా తెలుసుకుంటారో ఆ ఏజ్లో లేకుంటే ధ్యానానికి ముందు అది మనము శిక్షణంగా ఎలా తీసుకుంటాము అనేది ఒక ప్రశ్న ఓ వెరీ గుడ్ నాగవేణి మేడం ఆ మంచి ప్రశ్న వేశరు 18 సంవత్సరాల వరకు పిల్లలు తల్లిదండ్రుల సంర రక్షణలో ఉంటారున్నమాట.","అంటే వాళ్ళ అంబ్రెల్లా కింద ఉంటారు వాళ్ళ ఎనర్జీ ఫీల్డ్ లోనే ఉంటారు. ఇప్పుడు మొదట మన తల్లి సంరక్షణలో ఉంటాం ఫస్ట్ మూడు సంవత్సరాలుగా తర్వాత తండ్రి కూడా మనం తండ్రి దగ్గరకి కూడా వెళ్తాం. ఒక ఆడబిడ్డ గాని మగబిడ్డ గాని తండ్రి కూడా మన దగ్గరికి తీసుకొని హత్తుకుంటాడు. తర్వాత మనకి ఎల్కేజీ స్కూల్ కి వెళ్తాం అప్పుడు గురువుల సంరక్షణ కూడా వస్తుంది మనకి ఆ టీచర్స్ కూడా మనకి పరిచయం అవుతారు నేర్చుకోవడం అంటే ఫస్ట్ తల్లి దగ్గర నుంచి నేర్చుకుంటాం తండ్రి దగ్గర నుంచి నేర్చుకుంటాం గురువు దగ్గర నుంచి నేర్చుకుంటాం తర్వాత 18 సంవత్సరాల వరకు ఇది కంటిన్యూ అవుతుంది.","ఆడబిడ్డలుయితే ఎక్కువగా మెన్స్ట్రువేషన్ సైకిల్ అయిన తర్వాత తల్లి సంరక్షణలోకి వచ్చేస్తారు కంప్లీట్ గా మగబిడ్డ అయితే తండ్రి దగ్గరికి వెళ్ళాలి తండ్రి నేర్పిస్తాడు మగబిడ్డకి బాహ్యంగా ఎలా ఎదుర్కోవాలి సమస్యలు ఎలాంటి ఛాలెంజెస్ ని ఎదురుకోవాలి ఆ తండ్రి ఎనర్జీ ఆ శక్తి హెల్ప్ చేస్తుంది.","ఎలా ఆ మాస్కులైన్ ఎనర్జీతో ఎలా ప్రతి ఒక్కటి మన సమస్యని పరిష్కరించుకోవాలి బాహ్యంగా ఆడబిడ్డ తల్లి సంరక్షణలో ఇప్పుడు ఏమవుతుందంటే కొంతమంది క్రానిక్ ఇల్నెస్సెస్ వచ్చాయి అనుకుందాం పిల్లలకి వాళ్ళకి ఇంకా ఇప్పుడు ఐదు సంవత్సరాల అప్పటికి పుట్టినవారు వాళ్ళు ఐదు సంవత్సరాల అప్పుడు కొన్ని జబ్బులు వచ్చేసింది.","వారు ఈ కార్యకారణ సంబంధం కర్మ సిద్ధాంతం గాని పునర్జన్మ సిద్ధాంతం గాని లేకపోతే ఇవన్నీ ఏమి తెలియదు కూడా చిన్న పిల్లలు సాధన కూడా చేయలేరు వాళ్ళు సో అలాంటప్పుడు యాక్చువల్ గా తల్లిదండ్రులు కూడా వారి సంరక్షణలో ఉంటారు కాబట్టి తల్లిదండ్రుల యొక్క రోల్ చాలా ఉంటుంది. అందుకే చిన్నప్పుడే ఏమన్నా పిల్లల ద్వారా ఎక్స్ప్రెస్ అయితే ఒక వ్యాధి రూపంలో రుగ్మత రూపంలో కొన్ని సింటమ్స్ వస్తే ఆ తల్లిదండ్రి బాధ్యత తీసుకుంటారు. ఏ బాధ్యత అంటే వారికి ఏ రుగ్మత ఉందో ఏ రోగం ఉందో ఏ ప్రాబ్లం వస్తుందో ఆ ప్రాబ్లం నుంచి ఎలా సమస్యను పరిష్కరించేంత వరకు వాళ్ళు సంరక్షించాలి.","ఇప్పుడు ఆర్టిజం అనే కేస్ చెప్తాను మీకు ఒక ఆర్టిస్టిక్ చైల్డ్ ఆ చైల్డ్ కి చాలా అన్కండిషనల్ లవ్ కావాలి చాలా ప్రేమ అందించాలన్నమాట ఆ చైల్డ్ కమ్యూనికేట్ చేయలేరు ఒకసారి హైపర్ యక్టివ్ గా ఉంటారు ఒకసారి గట్టిగా అరుస్తుంటారు అయినా కూడా ఆ తల్లితండ్రి అన్కండిషనల్ లవ్ అనేది ఇవ్వాలన్నమాట కోపగించుకోకుండా వారిని చక్కగా చూసుకుంటూ ఉంటారు. తర్వాత ఆ తల్లి తండ్రి నిదానంగా వారు ధ్యాన సాధన చేస్తుంటే అది చూసి పిల్లలు కూడా నేర్చుకుంటారు.","ఆ పిల్లలు కూడా మిమిక్రీ చేస్తారున్నమాట అంటే తల్లిదండ్రులు ఏం చేస్తారు అది రెప్లికేట్ చేస్తారు వాళ్ళు కూడా నాన్న ఇలా చేస్తున్నారు అమ్మ ఇలా చేస్తుంది నేను కూడా ఇలా కూర్చుంటాను అని చెప్పి వాళ్ళు కూడా కళ్ళు మూసుకొని కూర్చుంటారు మనం ఫోర్స్ చేశమా వాళ్ళు మొండికేస్తారు చేయరు పిల్లల్ని ఎప్పుడు కూడా ఏది ఫోర్స్ చేయకూడదు వాళ్ళకి స్వేచ్ఛనిస్తూ వాళ్ళు మనల్ని చూసి మనం ఉదాహరణగా తయారు కావాలి పెద్దలు ఈ కాన్సెప్ట్ ప్రతి ఒక్కటి కూడా శిక్షణ శిక్ష అనేది లేనే లేదు యూనివర్స్ లోనే లేదు ఏది శిక్ష లేదు","శిక్షణే ఉంది శిక్షణ అంటే పాఠాలు నేర్చుకోవడమే ఆత్మ పాఠాలు ఒక జలుబు వచ్చింది అది కూడా మనక ఒక పాఠం నేర్పిస్తుంది జ్వరం వచ్చింది పాఠం నేర్పిస్తుంది అంటే ఎలా ఉండాలి ఎలా ఉండకూడదు దేని వల్ల నాకు ఇబ్బంది వస్తుంది నేను ఎక్కువ తినకూడని జంక్ ఫుడ్ అంతా తిన్నాను అనుకోండి ఆ రోజు నా స్టమక్ అప్సెట్ అయింది అంటే అది కూడా ఒక పాఠం కింద నేర్చుకోవాలి అంటే తినకూడని ఆహారం నాకు ఆకలి లేకపోయినా ఇది ఆ లోపల నుంచి ఇది తినాలనిపించి ఎక్కువ తినడము ఆహారాన్ని ఆ జంక్ ఫుడ్ ని పిజ్జా అని పాస్తా అని దీన్ని సో దాని","వల్ల అప్సెట్ అయింది ఇది నేను అదే శిక్షణ కింద తీసుకోవాలి నేర్చుకోవాలి పాఠం నేర్చుకోవాలి క్రమ శిక్షణ ద్వారా మళ్ళా నెక్స్ట్ మనం మనకి ఏది ఏది మన శరీరం కంఫర్టబుల్ గా ఉండేట్లు చేస్తుందో చక్కని ఆహారం అదే మాత్రమే తీసుకుం అలా తల్లి తండ్రి ఈ శిక్షణ గురించి వారికి తెలియచేయవచ్చు ఎందుకంటే వారి సంరక్షణలో ఉంటారు కాబట్టి వాళ్ళు సాల్వ్ చేయలేరు పిల్లలు వాళ్ళకు వాళ్ళుగా సాల్వ్ చేసుకోలేరు.","కానీ ఆ బాధ్యత వారి సంరక్షణలో పెద్దల సంరక్షణలో ఉంటారు కాబట్టి పెద్దవాళ్ళు వాళ్ళు ఏదైనా ఇలాంటి కాన్సెప్ట్స్ ని చాలా విత్తన రూపంలో సూక్ష్మంగా తెలియజేస్తే అది పట్టుకుంటారు పాయింట్స్ పట్టుకుంటారు. చాలా వరకు ఏంటంటే ఇది ఆ తల్లిదండ్రులతో పాటు ఉన్నటువంటి కార్మిక్ సిచువేషన్ అన్నమాట ఇప్పుడు కొడుకు పుట్టాడు ఆ కొడుకు తండ్రి మీద చిన్నప్పటి నుంచి కోపం ఉంటుంది. తల్లితో బాగా మాట్లాడతాడు తండ్రితో ఎప్పుడు ఫైటింగ్ చేస్తుంటాడు."],"minutes":10,"words":1462},{"title":"కార్యకారణం · అనుభవాలు","paras":["తండ్రి ఏం చెప్పినా రిజెక్ట్ చేస్తాది తండ్రితో ఫైటింగ్ ఎప్పుడు ఇది కార్యకారణ సంబంధమే ఇప్పుడు ఆ పిల్లవాడు ధ్యానం చేసి తెలుసుకోడు ఏ కారణంతో నేను నా తండ్రి మీద ఎంత కోపం వస్తుందో తెలియదు తెలుసుకోవాలంటే ధ్యాన సాధన చాలా చేస్తే గాని మనకు తెలిసిపోదు తెలియదు తండ్రి ధ్యానం చేసి తెలుసుకోవచ్చు ఆయన ధ్యాన సాధకులు అనుకోండి ఈ మార్గంలో ఉన్నారు ధ్యాన సాధన రోజు చేస్తున్నారు చక్కగా తెలుసుకుంటారు వాళ్ళు ఓ ఆ జన్మంలో మేము శత్రు రాజులము ఒక ఘర్షణ ఉంది అది రిజల్వ్ కాలేదు అన్ఫినిషడ్ బిజినెస్ అది మళ్లా","ఇప్పుడు నా కొడుకుగా పుట్టి ఇప్పుడు ఆ శత్రుత్వం భావన ఉంది పాఠం ఆత్మ పాఠం ఆ తండ్రికి తెలుసు ఆత్మ పాఠం తను తానుగా స్వీకరించడం ఆ కొడుకుని ఏమి ఒక జడ్జ్మెంట్ ఏమి చేయకుండా ఒక విమర్శంగా ఏమి క్రిటికల్ గా మాట్లాడకుండా చక్కగా తను తాను స్వీకరించడం తన ప్రేమించడం ఎప్పుడైతే ఆ తండ్రి చేస్తాడో అది రిజల్వ్ అయిపోతుంది.","వాళ్ళ శత్రుత్వం పోతుంది కొన్ని సింటమ్స్ కూడా ఇదా ఇలానే ఉంటాయి. అది తల్లి తండ్రి ఆ కొడుకు కూతురు వాళ్ళ ఒక కనెక్షన్ ఉంటుంది అది రుణానుబంధానికి సంబంధించింది. అందుకే వాళ్ళ సంరక్షణలో ఉన్నప్పుడు తల్లిదండ్రులు బాధ్యత తీసుకొని వాళ్ళు ధ్యానం చేస్తారు కదా వాళ్ళకి తెలుస్తూ ఉంటాయి. ధ్యానంలో ఈ పాఠాలు ఈ బాబుకి ఈ పాపకి ఇది కావాలి ఇది అందించాలి నేను ఈ సహాయ సహకారం నా ద్వారా అందిస్తే దీని నుంచి బయటకి వచ్చేస్తారు. ఎందుకంటే లైఫ్ ని మనం ప్లాన్ చేసుకని వస్తాం సోల్ లెవెల్ లో మనమే ప్లాన్ చేసుకొని ఇక్కడికి వస్తున్నాం.","మన పాఠాలు ఆత్మ పాఠాలని ప్లాన్ చేస్తూ ఉంటాం. ఆత్మ పాఠాలు కంపల్సరీగా నేర్చుకోవాలి. అదే శిక్షణ.","ఓకే మేడం నాగవేణి మేడం సో అదే చిన్నప్పుడు కూడా మనం ఈ విధంగా మనం అంద చేయొచ్చు అన్నమాట సర్ ఇంకొక ప్రశ్న ఉంది సార్ సార్ నేను మొన్న హనుమాన్ ఓకే సార్ ఆ సర్ మాకు మొన్న హనుమాన్ అంశ ఫిలిం చూసాను సార్ దాంట్లో చాలా బాగా అనిపించింది సార్ చాలా ఇన్సైట్స్ వచ్చినాయి దాని అన్నిటిని ఇప్పుడు నాన్ మెడిటేటర్స్ ఎందుకు ఇష్టపడతారు అంటే దాంట్లో మనలో ఉన్న అతీంద్రియ శక్తిని చూపి చూశరు కదా సార్ మనము అందుకే ఓకే దైవాల్
