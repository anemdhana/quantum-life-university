</style></head><body><div class="app lang-en"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-03-en.html">Prev</a><a href="day-05-en.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">Cause, Symbol, and a New Birth · Devi Navaratri · Day 4 (English)</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">Cause, Symbol, and a New Birth</span></div><div class="tools"><span class="lang-switch"><a href="day-04-te.html">TE</a><a href="day-04-en.html" class="active">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-03-en.html">Prev</a><a href="day-05-en.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"Opening Meditation · Breath, Crown, and Sankalpa","paras":["Welcome to the 564th day of the Jnanodayam programme. On each of these days we are receiving the knowledge of Devi Navaratri from the founder and chairman of Quantum Life University, Dr. Newton Kondaveti. Today is the fourth day of the observance. As on every morning, the hour begins with meditation. The knowledge comes after the sitting.","Everyone is invited into Anapanasati, attention upon the natural breath. Cross the feet. If you are wearing glasses, set them aside. Let the fingers rest in a simple mudra, and sit in sukhasana, a posture that is easy and steady.","Close the eyes and watch the breath that is already moving. With a slight smile, let these forty minutes be a complete forgetting of the outer world. Travel inward, and do the practice. A collective meditation in the Brahma muhurta, the hour before dawn, is in this Navaratri powerful, special, and fortunate. The power in us has to be known, and the power that is the source of creation. For that the mind has to become empty and still. With full awareness, let the sitting continue.","Give the practice your whole attention. In this moment no other thought matters. The breath itself is the meditation. This awareness is kept for a long stretch of the sitting, about twenty minutes, before the attention is moved.","Then, slowly, bring the attention to the top of the head and observe the Sahasrara, the crown. This energy stands in every one of us as the light of knowledge. Feel it flowing through the whole body, and experience it. From the crown, every organ is being filled.","Round about, the same energy moves still more wonderfully. Everyone in this collective knowing is connected, and the energies together rise as a larger field. Across the earth a sankalpa is taken for the welfare of the world. May the inner knowledge in every person awaken. May compassion, peace, friendship, joy, knowledge of the Self, and knowledge of Brahman awaken in all. The resolve is that the Sahasrara Pyramid will stand behind that sankalpa in a wonderful way.","See your own sankalpa being fulfilled, and the whole earth growing in strength. With trust, release the resolve into the universe. Very soon this Sahasrara Pyramid is to stand before our eyes, and a wonderful meditation is held in it. All of us are coming to know ourselves. On this earth the highest vibrations are moving.","Bring the attention back to the breath for the last two minutes, and then one minute more. The final ten seconds are counted down to zero. Slowly rest both hands over the eyes. With a smile, open them.","Welcome back. The fourth day has arrived. What greater celebration is there than to learn, after the dawn meditation, from a knower of Brahman? With a smile, those on the call turn their cameras on. Brahmarshi Chakravarti Dr. Newton Kondaveti, founder of Quantum Life University, is welcomed in, and the session is placed in his hands."],"minutes":5,"words":497},{"title":"The Fourth Morning · Cause, Symbol, and a New Birth","paras":["Jnanodayam. A good morning, dear friends. Devi Navaratri is being celebrated from inside a great state that can be felt. This fourth day, too, belongs to Jagannmata, the Mother of the world, and to Parashakti, the supreme power, in her many forms and aspects. For a reason, she created herself. Every happening is an effect of a cause. Where there is no cause, there is no effect. Our birth has a cause. So has every creation.","From the first day, the point has been that every story in our scriptures carries a hidden meaning, a knowledge placed beneath the surface. Every festival in India, and every divine power, was given certain days by the maharshis. Devi Navaratri is of that kind. The puranic stories were told in signs. The more clearly they are understood, the more of that knowledge can be taken. They are the secrets and the skill of sadhana. Heard as bare stories, they yield nothing. A festival can feel joyful, and the moment it is over we become ordinary again.","Of Devi Navaratri, this was said at the start. In nine months a new birth is taken from inside the mother. These nine days belong to that same mystery, turned toward an energy and a dimension: Adishakti, Parashakti, Sridevi. We, too, are taking birth newly inside that dimension. The narrative we enter today has a beginning of its own. Mahishasura came into being. He was born. Behind that birth there is another story. There is a background. That background is what this morning is for."],"minutes":2,"words":258},{"title":"Rambha and Karambha · Body and Endless Wanting","paras":["The story opens with Rambha and Karambha. At the start they are asuras. Their father is the danava Dhanu, and in the symbol he is the first ancestor of the danavas. Hear Dhanu, and another word stands beside it: tanu, the body. The name is body-identification, the delusion of the body, a tamasic tendency, the feeling that says I, this body alone. Only a physical identity. That is Dhanu, and that is tanu. To Dhanu two sons were born: Rambha and Karambha.","The names themselves are striking. In these stories, pairs of names are chosen so that duality can be recognized. Shumbha and Nishumbha are used in that way. Rambha and Karambha belong to the same kind of naming. When the two sons had grown a little, they undertook tapas. Rambha meditated. Karambha meditated. They were asuras, and they had set a purpose. They had set a goal. The goal was putra labha, the gaining of a son. Vedavyasa composed the episode in this shape because it is the shape of an ordinary human life.","After youth arrives, the wish appears. A son is wanted. The wish is for a son, a putra, the gain of a son. Rambha and Karambha, the writing says, meditated with severity for many thousands of years. While they were doing so, certain things happened. Those things are the teaching of this day, because Rambha and Karambha are also aspects in us. We, too, sit for meditation.","In Sanskrit, Rambha is said to be that which sounds, a ghosa, a resounding. It is also that which delights and sports. And the word is taken here as sound, as proclamation, and as aihika vancha: desire aimed at this world. I want all of this. The world of objects is full of desires, of thirsts, of wants. The want has a familiar face. We already have a fridge at home, and in the mall a larger fridge appears. Technology changes, and the moment the new thing is seen, that too is wanted. A television is bought, and a newer one is already there. A phone is bought, and next year another model is released, and another thirst begins.","Wherever we go, the mind swells with it. This must be bought. That must be bought. We see one house, and then another, and we feel that the other house must be ours. Each thing, as it appears, feels necessary."],"minutes":4,"words":401},{"title":"The Pond and the Five Fires · Maya and the Senses","paras":["These are fierce wants of the aihika kind. Aihika means here: this gross world of things, and the thought that never stops saying I want this and I want that. When do such thoughts grow less? Rambha was made of them. That is why the name is his. He did his tapas inside a pond, staying in the water to meditate. Meditation can be done at ease, in a kindly place. Why enter the water? This, too, is a symbol.","The water may be taken as emotion. What we expected does not happen, and we are upset: a work left undone today, a hope that never came, a desire that failed. In this gross world things do not happen as they were pictured. It did not happen — why did it not happen? Worry crowds in. Anger comes, and sorrow. If someone has rejected us, the descent can reach depression: I will do nothing, I will sit in the house. In the symbol, this is the life of our passions.","There is another reading. A phone falls from a boat into the river. It is down there, and it cannot be seen. On dry ground a lost thing can be found by lifting what covers it. In water it sinks and stays hidden. Those who study the ocean are searching what the seas contain. The womb of the sea holds many secrets. From outside there is only water. Go inside, and what is there becomes known.","The water is also a sign of maya. Rambha did his tapas while remaining in it. This world of maya feels as though it were the truth, and it is not. It keeps feeling as though other people were the cause of one's sorrow. In Rambha's condition, we live inside that maya. Yet the tapas is for mukti, the longing to be free. He too wants enlightenment, a release from this one day. We are stuck, and everything around us is an entanglement, and still the final goal has to be enlightenment. People say that problems are chasing them, that so many are hurting them, that others or the circumstances are the reason for their pain. Believed in that way, the pain increases. Why did they speak like that yesterday? Why are they looking at me like this? Why those words? No one is the cause of our sorrow. Rambha's condition is one in which tamas is the larger part: laziness, a dullness of mind. He cannot see past it. He looks at the world of things and says that these objects, this situation, produced my sorrow.","We ourselves are the cause of our sorrow. The cause is our ignorance, our avidya. Where true knowledge is absent, every small thing hurts us. The account says Rambha meditated in the pond, and Karambha under a banyan, among the five fires. They were brothers. They could have sat side by side and practised in comfort. That one of them practised in the open, under the banyan, among the five fires, is Vedavyasa Maharshi giving a sign.","Prakriti, nature, is the form of maya, because it is made of the three gunas. What is not appears as though it were. What is appears as though it were not. What truly is never appears as it is. Vemana's line says that the one who conquers maya is the yogi who knows the secret. The yogi has to know it by experience. Karambha is practising there, among the five fires, under the banyan. Those five fires of nature are to be known as our five jnanendriyas, the organs of knowledge. He is in the middle of them, touching and yet not clinging. Eyes, ears, nose, tongue, and skin carry us outward without a break, and so does the mind, another and a chief organ.","Karambha's condition is this: I must attain the knowledge of moksha, I must know myself. He practised in earnest. Yogis do in fact sit amid five fires. A severe heat is borne, the sun overhead, the body burning, and they do not move. They put the body through great difficulty. Taken as a symbol, those same fires are the five organs of knowledge. They pull. The pull has to be withdrawn, and the face turned inward. That is what is said of Karambha. He is an asura. Tamas and rajas are the greater share, and sattva is also present. He has not yet become aware inside this maya. He is practising while maya itself is still unrecognized."],"minutes":7,"words":752},{"title":"Indra the Old Man · The Mind That Interrupts","paras":["While Rambha and Karambha are meditating, jealousy rises in Indra. He becomes afraid that the place of Indra will be lost, that they will strike it down. We hear this in our films and in our stories, and it is the same here. Rambha is doing so much meditation, and doing it so severely. They will obtain boons. They will come against Indra's world and do as they please. My position will be lost. With that fear he comes, and he comes in the form of an old man.","Rambha is in the pond. The old man, it is said, caught him by the leg. He pulls, and he keeps pulling. This, too, is a symbol, and Vedavyasa's metaphor is a great one. What does Indra stand for? Among the organs, the chief organ is not only the five organs of knowledge. It is the mind, itself an organ. That Indra is this mind. Indra is the sign of the mind. Whoever sits for meditation, this mind is the first obstruction. The mind itself stands in the way. It gives birth to all the thoughts.","Our tendencies arrive, and they arrive from this mind. This is why the mind has to be made empty. The mind has to be cleared. The state without thought has to be reached first. Attention is placed on the breath, and placed there again, so that the movements of the chitta, the mind-stuff, may be stilled. The effort is there. And the Indra called mind puts on the form of an old man. Rambha is in the middle of his practice. The old man seizes him, pulls him, and in the end kills him. Rambha vacates the body. So the story says.","This is the condition of Rambha. In a form of maya, the Indra who is the mind will not let us practise. How he does it is what the story, in its symbol, has told."],"minutes":3,"words":322},{"title":"The Offered Head · Putra and the Twice-Born","paras":["They were elder and younger. When Indra had killed the brother, Karambha began a practice still more severe. He offered his own head into one of the five fires. He cut it away and surrendered it. A tapas of that severity is itself a symbol. He had seen Rambha caught in the mind, and the younger brother's practice stopped. He would not become like that. The head, here, is the mind. Karambha surrendered it to the fire and merged it there. To merge the mind into the Atman: that is the meaning. Fire stands for the tattva of Paramatman, the tattva of the Atman. Then Agni appeared and said, ask for a boon. A wish was already there. Karambha asked for a son of great strength. This, too, is a symbol.","Agni means truth, and truth is the Atman: satya, eternal, ancient, permanent, the tattva of Paramatman. In the form of fire the Vedas and the Upanishads have always spoken of it. What is it like? The Katha Upanishad says: anor aniyan mahato mahiyan — smaller than the atom, subtler than the subtle, and greater than the great. By the measure of our science, he said, this universe has spread across some ninety-six billion light years. How many such universes are there? How vast is even this one? Greater than the great: that is said of the field of the Atman.","The word putra is a symbol in the same way. A saying, a sukti, and a verse say that the son saves one from the hell called Put. Put means that hell. Tra means that which protects. In India this was read as a demand for a male child only. If a daughter was born, people grieved. From that reading came female foeticide: scans and ultrasound, and if the child is a girl, an abortion. It is a great sin. Vedavyasa's symbol was taken wrongly. A girl comes as Lakshmi. A girl is the form of Lakshmi Mata, of Durga Mata, of Saraswati Mata.","In the real sense of the text, putra is the new you that arises from you, the new birth you take from yourself. A knower of the Self is called a dvija, twice-born, born a second time in this same life: once before meditation, and once after. If the knowledge of the practice has been done, you are born again as a new knower of the Self. Before meditation, life is one story. Practise, and you come to know a great deal about yourself. Every petal of the flower of Self-knowledge opens. After meditation, the story is another.","This is why the books of India can be misread. The line about the hell called Put has been followed by many terrible things. The real meaning is punah, again: hell as repeated birth. The cycles of birth and death are the actual hell. Thousands of crores of times we keep coming. An old reckoning says we entered eighty-six lakhs of yonis before we came to this earth. It is a symbol, a number: subtle living things, animals, many beings, and at last a human birth. Even then, six hundred to eight hundred human births, many of them wasted, and some people take still more. It is beyond counting. Eighty-six lakhs of lifetimes: from the mineral kingdom we became plants, from plants animals, cruel beasts and then gentle animals, and then human. Inside the human birth itself there are many stages. Many of those births are wasted.","Putra, in this meaning, is the one who can cross birth and death. Thirst and unfinished business, held in ignorance, become the cause of another life. Projects are taken up and left pending. Each birth offers certain experiences. We arrive having decided what this life is for, and then we postpone. The birth is wasted.","Many people were not born merely in order to survive, or for a nine-to-five post. They have already done a great deal of meditation, and they were born for another purpose. After some practice the job no longer resonates. They decide to live this spiritual life completely, through the whole day.","After my medical studies were finished, not for a moment did I feel I should remain there. Medicine is a great science. The science of the spirit is higher. I did not feel this birth should be wasted. Money can be earned, a hospital built, many surgeries done. That was not the purpose. A birth is taken for a reason, and it has to be tuned to that purpose. What we were born to do has to be done. Otherwise the dissatisfaction remains inside."],"minutes":7,"words":770},{"title":"Two Desires · The Inner Teacher and the Balance","paras":["That birth then stays an incomplete life. It has to be repeated. Whatever we meant to do, the clarity of it becomes known in meditation. This is why the practice is done. First we have to know who we are. Second, we have to know what we are to do. We speak of a purpose of life. What is the aim of this life? That has to be known.","Rambha remains inside his maya, the wants of this world. Karambha's wish is liberation, though asura qualities remain in him, as tamas and rajas remain in everyone. He goes on. When the mind had been dissolved, Agni appeared, and the tattva of Paramatman was known: subtler than the smallest particle, and vast through many universes. That is the tattva of the Atman. From it his prabodha came, the inner teaching. Step out of the field of feeling and into the field of the Atman, and instruction comes from there. The wish to hear it only from outside falls away. We hear it within. The Guru is inside us, a great Guru. Paramatman waits within as this jivatma. The God who lives inside is waiting for the moment we connect. That teaching is atma-prabodha. The Atman, Paramatman, makes many things known.","The wish for a son means the wish to cross birth and death. That is the great goal. Through moksha-jnana those cycles stop. In school the same class is failed, and the same lesson studied, again and again. He recited Bhaja Govindam: punarapi jananam punarapi maranam, punarapi janani jathare shayanam; iha samsare bahu dustare, kripaya pare pahi murare. Again birth, again death, again lying in a mother's womb. This samsara is hard to cross. By your grace, O Murari, protect me. Bhaja Govindam. We keep coming. Many births go to waste, and this is not even realized.","Here, while a child is still unborn, once conception has happened, the first thought of the parents is the school fee, paid in advance. These days they decide the school, an international school, and they programme a small child. They write the child's life-script beforehand. He must become a doctor. The two parents argue. No: this child must become a scientist. She says, a doctor. From childhood the programming is finished.","After the birth there is confusion. The child does not know what to do. The parents carry their own projects. She could not become a doctor, so my son must become a doctor, my daughter must, she must do all of this. We are born for an agenda that belongs to the one who is born. There is a soul's agenda. There is a soul's plan.","We are not here for survival alone. Survival is important. It is very important, certainly, on this physical plane. The dharma of a profession is done. We remain in that profession. We should not become occupied by that alone. Be as Lahiri Mahasaya was. He did the dharma of his work. He kept a nine-to-five post, and all night he practised. He held the two in balance.","Rambha and Karambha are brothers, which means that within us one jivatma wishes to practise, and two desires are present. One desire says: I must also survive here. I must work. I need a salary. I must maintain a family. I need a family. I need comfort. I need enjoyment on the physical plane. That is the state of Rambha. Karambha says: I must attain moksha. I must attain that supreme bliss. I must experience what Sri Krishna, Paramatman, has said in the Bhagavad Gita. I must attain knowledge of the Self and knowledge of Brahman. That is the mental state of Karambha.","Inside the jiva itself, both are there. There are dualities. On one side, samsara. On the other, nirvana. In samsara we want every enjoyment. In nirvana we want the state without sorrow, the state of supreme bliss. We want that knowledge of liberation, asking when the sorrows will go.","The two sankalpas contradict each other. One leads toward materialism, the other toward the spiritual life. This duality is Rambha and Karambha, and the doubt is plain: samsara, or nirvana? Many leave the household life on the outside, and by force. I want nothing. I will take sannyasa. I will only meditate. Inside, it keeps pulling. This experience was never had. This was not done, and that was not done. All of it is incomplete. I left my family. I speak to no one. I have become solitary. In samsara the marks are zero, and then in nirvana we fall back down. Are we shining there? Are we progressing? We are at zero on this side because we ran away, and the score is in the negative. Run from samsara, and the problem returns. The sadhaka balances both. Both are important. Neither is to be abandoned."],"minutes":7,"words":808},{"title":"Halwa and the Lotus · Ramana and the Great Thief","paras":["The one who wants liberation can still be caught. You want to eat halwa. You have taken sannyasa from it: I will not eat halwa. A sannyasa of halwa has been made. And it keeps pulling. Sit for meditation, and the first thing remembered is the halwa. The halwa even begins to appear. The experience of halwa comes. Whatever we exclude on the physical plane is included again. All of it returns, and in the practice it comes as an obstruction.","This is why the balance is needed, samsara and nirvana together. In samsara we are to be like a drop of water on a lotus leaf. The drop rests on the leaf, touching and not clinging. We are to live in samsara. We certainly are. If we only delight inside it, when will we delight in the field of the Atman? When will we be in that field? If we indulge only in the physical field, only here and only here, we forget the true goal. Dear friends, both of these states have to be marked and remembered. We have to see where our distractions are, and where we are being pulled away.","Once, at Ramanashram, thieves broke in. An ashram, too, can be entered by thieves. This was a scene that really happened. Bhagavan Sri Ramana Maharshi was there. That night the thieves came. What would an ashram hold? A few articles of worship, and fruits that people had brought. The thieves had their own purpose, their own intention, their own sankalpa. They became upset. In a great anger they began to beat people. They got ready to strike Bhagavan with sticks.","He remained in mauna, silence. The disciples cried out that this should not be done to Swami, and in anger they were going at the thieves. Ramana Maharshi said: they are doing their dharma. Our dharma is to remain in silence, with patience, and in peace. They will take what they have come to take. Why should we lay hands on them? The thieves took the fruits, and whatever else was there, and left.","Afterwards he said that the greatest thief of all is the mind. It kidnaps your joy and, in that very moment, carries it away. It goes on creating sorrow. Catch that thief. The others are petty thieves. This is how a knower of Brahman sees: with the eye of the Atman. How such a person lives on the physical plane is what he was showing."],"minutes":4,"words":413},{"title":"No Enemy Outside · The Mother Who Is Waiting","paras":["In these days of Devi Navaratri the first work is to face our inner enemies. Outside, there are no enemies. Husband, wife, children, circumstances: none of these is the cause of my sorrow. The cause is our ignorance, the absence of a complete knowledge of ourselves. An interpretation is already loaded in the mind. Through that limited knowledge, from that angle and through that lens, the world appears. This world of maya, seen in that way, is the state of Rambha.","He is stuck in maya, and the asura qualities are with him. Karambha is doing his practice, and the asura qualities are still there. From the hell called Put, from these cycles of birth and death, he came forward doing sadhana, wishing to come out. These Navaratri days are also days in which we recognize many things inside ourselves. A state like Rambha's has come in us as well. Once, I had it. You have had it. Everyone keeps having it.","The world of things, the world of maya, keeps pulling us outward. Outward, and outward again, we try to run. These nine days are for going inward. We have to go near Amma. Amma means Shakti, the Mother who is herself the form of that power. Amma is present in us as Kundalini Shakti, and she is waiting. She is waiting for the day we close our eyes and meditate. Will it be done with the eyes closed? She waits. Amma is hidden, and she is asleep, and she is waiting for you. For how long she has been waiting. We have to go near Amma. Then that Kundalini Shakti wakes. She moves upward. Whatever goals are set, they come to be fulfilled. And still, we have to come out from under the great thief called the mind. That great thief has to be caught.","In here, there is an inner purification. These inner enemies have to be conquered. That conquest is Mahishasura-mardini: Sridevi, the Mother who slew Mahishasura. Today the telling has come as far as Rambha and Karambha. After this, Mahishasura himself, and how his arising happened, will also be known. A boon was given to Karambha. At this point in the story a pause is kept. There is no stop here that would finish it. Tomorrow it continues. Karambha asks for the boon, and according to the boon something is given. What boon did he ask? And after that, how was Mahishasura born? Why, when the father was in a human body, was the son born with the body of a buffalo? Mahisha means a male buffalo. Why did Vedavyasa convey it in that symbol? What knowledge does Mahishasura give us? We are not to become like Mahishasura. How does Devi Mata slay him? Inside us, too, there is a Mahishasura. Rambha is there. Karambha is there. Mahishasura is there as well.","That, too, we will come to know. He turned, then, to a story told as a sign of the same work."],"minutes":5,"words":498},{"title":"The Dirty Cloth · Vasanas and the Mine Within","paras":["A man went to a siddha, a perfected person. There was a dirty cloth. The master, in order to teach something, gave him that dirty cloth and told him to clean it. The story is a symbol. The man dipped the cloth in water and brought it back. The dirt was still there. A little of it had gone, and the cloth was otherwise the same. The master said: go, and rub it well with soap.","He went and rubbed it with soap. Two or three times, and the dirt was gone. He came back, and the smell had not gone. The smells were still there. Go again, and wash it thoroughly. He washed it as the master had said, and washed it well. Then the bad odor also left. This is a story in the form of a sign.","We too carry many samskaras and many vasanas, impressions held through many births. The asura qualities are themselves vasanas: tamas, and the ego that belongs to rajas. There is a great deal of dirt, and the angle from which we see is not yet right. The main point of the day is for practice. Whenever sorrow comes, recall it at once. Someone has scolded you, or spoken critically, or not spoken to you at all, and you are disappointed or upset. The cause of that sorrow is my avidya, my ignorance. Other people are not the cause. We ourselves are the cause of our sorrow, and we ourselves are the cause of our joy. Hold that one truth, and let the inner dirt go. There is, they say, a great mine of gold in us, a great treasure, and it is in everyone.","A man was living in poverty. Every day he had to labor hard. A siddha was there, under a tree, and the man would go. Once he offered his namaskara. Swami said: My dear man, do you not know? In the backyard of your own house, dig. Dig three feet down. A mine will be found there. It is in your house. The poor man did not believe it. What, in our house? It is an ordinary house. A master, a yogeshwara, says: it is in you. Everything is in you. A great tattva of the Atman is in you. Your Atman — everything will be found. The Chintamani, the wish-fulfilling gem, will be found. The Akshaya Patra, the vessel that is never exhausted, will be found. Kamadhenu, the wish-yielding cow, will be found. Whatever you think, that will come to pass. You are a very great one. So the master says. We do not believe. It does not seem possible to believe. He, too, did not believe. He lived on in that poverty, and one day he died.","Many people, already, knew the matter the Guru had spoken. Another man then bought that house and came to live in it. The Guru had said it. This man believed. He went and dug. As soon as he dug, a great mine of gold was found there. In us, too, there is a great mine. What the Gurus say is this same matter. In us there is what we call bad, and what we call good: rajas, tamas, and sattva along with them, and divine qualities as well. We are divine beings. We are Atmans. We are those who stand with the tattva of Paramatman. This has to be remembered. In Devi Navaratri, that state is what we are to attain.","An infinite energy is asleep in us, lying dormant. It is Jagannmata, Adishakti. If we practise, we become able to conquer those enemies, one by one. The mind, this chief enemy, and this maya as well, we conquer. We come to know that we ourselves are the cause of our joy."],"minutes":6,"words":634},{"title":"Elephant and Mosquito · The Practice for Today","paras":["Once an elephant was standing under a tree. It was a large elephant, a very large one. A mosquito came there. The mosquito settled on the elephant and took its rest. After a while it prepared to leave, to go from that tree to another place. At that time the mosquito woke from its rest, and it spoke. O Elephant, sir, thank you, thank you, thank you. Resting on you, I also gave you my weight. I gave you too much weight. Because of me you must have felt a great weight. I am sorry. I ask your pardon. I have troubled you.","The elephant's answer was this. I did not even know that you were there. I did not know that you had landed on me, or that you had any weight. These mosquitoes, he said, are the problems in our life. We are people of an elephant's size. Our Atman is the great elephant: magnificent, exalted, strong, of great power. The Atman has all of these qualities. Are we going to live in the state of the mosquito, or in the state of the elephant? That is the decision we have to make. Problems come, and problems go. The mosquito comes, and the mosquito leaves. The mind, though, arrives. The mosquito has landed on me. The mosquito has bitten me. Thinking about it, meditating upon it, we waste the time.","Friends, the points learned in today's class are today's practice. No one is the cause of our sorrow. We ourselves are the makers of our joy. Rambha and Karambha, samsara and nirvana: both are important, first. Afterwards, one of them drops, of itself. Rambha drops. Our samsara, slowly, slowly, becomes something we can live as a drop of water on a lotus leaf. We learn that living through the practice. Nothing is to be abandoned. We have to come into tune with whatever we were born for.","There was another class waiting, and so this morning's class was brought to a close a little early. Harika would speak with people after the class. Before that, one act of offering was still to be done."],"minutes":3,"words":356},{"title":"Devi Samarpan · The Song and the Invitations","paras":["Once more, a Devi samarpana, a surrender to Devi Mata, done together and at ease. The mudra is Lakshmi mudra: the left foot, or the left hand, rests on top, because primacy is given to Shakti, and Shakti is to be known first. Close both eyes. Close the right nostril. Through the left nostril take nine inward breaths, one after another, with no exhalation between them. Inhalations only, not one breath in and then out. It is nine days, and so it is nine. He made this plain for anyone newly joined. Then hold, gently.","Remain in namaskara mudra. While the head bows, breathe out slowly and completely, until the head touches the earth, or until the hands touch. That touch is the surrender. We surrender completely to the Mother, to Jagannmata, to Adishakti, to the Mother who is Kundalini. There, hold again, and within, repeat Shrim nine times. It is not pronounced, and it is not said aloud. Shrim is how we refer to Mahashakti, the great power, at the level of vibration: the para level, where sound is supreme and unmanifest, and the pashyanti level, where it is still subtle. Then bring the head slowly back, and return to the ordinary posture at your own pace. The whole sequence is done nine times today.","While the head bows, the ego is renounced and surrendered completely. It is a bow to the Great Mother, the mother of mothers, the original Mother, our Jagannmata, that Parashakti.","He then asked Harika to chant a praise of Devi, whichever she wished. Every day her chant is heard, poetic and beautiful in the voice. Today, too, it was heard. She sang the kriti Śyāmalē Mīnākṣi sundareśa-sākṣi. He thanked her.","Those who had raised a hand, wishing to speak with him, were asked to bring it tomorrow's class. There was laughter, and no difficulty about it: the sharings would be taken tomorrow. He thanked everyone. Tomorrow, Mahishasura would be taken up. The class is held every day at this same hour. Let everyone you know be told that Dr. Newton's classes are going on. The videos are added to the playlist, and they can be shared easily.","There is also an invitation to One Maitriya, the Vanamaitriya gathering. Everyone is welcome. At the Quantum Life University campus, every month, a free programme of two days is held. We meditate together, and we learn. There are groves of energy there, shakti vanas, which Sir and Madam designed with a sankalpa. For each grove it was planned how many plants, which plants, and how many of each, and each grove was connected with an energy. There is the grove of Iccha Shakti, the power of will; of Kriya Shakti, the power of action; of Jnana Shakti, the power of knowledge. There is a Guru grove, a grove of the mother, a grove of the father, a Lakshmi-Narayana grove. There are many such groves, and each has its own meaning. There is a Dakshinamurti grove, a Dhanvantari grove, and the energy proper to each.","The groves can be visited. When we come for this One Maitriya, we also go to Goloka. A Goloka Dhama has been brought and established here by Sir and Madam. All of it can be visited: the plants, the cows, time spent with everyone. There is sharing. There is the company of good people. Everyone is welcome. The details appear on the slide, and from those details one can register. The request is that everyone come. The coming dates are the 24th and the 25th, Saturday and Sunday. One may arrive on Friday evening, before dark. On Saturday morning at five o'clock the programme begins. After lunch on Sunday afternoon, one may leave. It is a very beautiful programme, and it is a programme that everyone ought to experience.","Soulco Transformation has been kept since 2011, and it was not stopped even in the time of COVID. Thousands have attended, and people have received a transformation through it. Once a year it is conducted in Telugu, and once in Hindi. The last day is 24 November, Dr. Newton's birthday. Book now. If the Soul Coach seva or the full participation is not possible, then at least come on that day, the most important day of the year. He was born on Kartika Purnima, and this year 24 November falls on that full moon again. His birthday and the annual day of Quantum Life University are celebrated together, in this field of energy. Let no one miss it. Plan, and come.","Thank you, friends. We meet tomorrow, early in the morning, at five. Thank you. Until then."],"minutes":7,"words":773}];
const nav=document.getElementById('nav'),mobileNav=document.getElementById('mobile-nav'),columns=document.getElementById('columns');let chapter=0,spreadIndex=0,spreadCount=1;
function makeNav(root){chapters.forEach((c,i)=>{let li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+c.title+'<small>~'+c.minutes+' min read</small></span>';b.onclick=()=>{chapter=i;spreadIndex=0;render();document.getElementById('mobile-side').classList.remove('open')};li.append(b);root.append(li)})}makeNav(nav);makeNav(mobileNav);
function render(){let c=chapters[chapter];document.getElementById('heading').textContent=c.title;document.getElementById('time').textContent='~'+c.minutes+' min';columns.innerHTML='';let title=document.createElement('h2');title.className='section-title';title.textContent=c.title;columns.append(title);for(let p of c.paras){let el=document.createElement('p');el.textContent=p;columns.append(el)}document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i%chapters.length===chapter));requestAnimationFrame(()=>requestAnimationFrame(measure))}
function measure(){const width=columns.clientWidth;const one=window.matchMedia('(max-width:800px)').matches;const total=Math.max(width,columns.scrollWidth);spreadCount=Math.max(1,Math.ceil((total-2)/width));spreadIndex=Math.min(spreadIndex,spreadCount-1);columns.scrollLeft=spreadIndex*width;document.getElementById('position').textContent='Section '+(chapter+1)+' / '+chapters.length+' · '+(one?'Page ':'Spread ')+(spreadIndex+1)+' / '+spreadCount;document.getElementById('prev').disabled=chapter===0&&spreadIndex===0;document.getElementById('next').disabled=chapter===chapters.length-1&&spreadIndex===spreadCount-1}
function move(dir){if(dir===1){if(spreadIndex<spreadCount-1)spreadIndex++;else if(chapter<chapters.length-1){chapter++;spreadIndex=0;render();return}}else{if(spreadIndex>0)spreadIndex--;else if(chapter>0){chapter--;spreadIndex=9999;render();return}}measure()}
document.getElementById('next').onclick=()=>move(1);document.getElementById('prev').onclick=()=>move(-1);document.getElementById('font').onclick=()=>{document.body.classList.toggle('font-large');spreadIndex=0;requestAnimationFrame(measure)};document.getElementById('menu').onclick=()=>document.getElementById('mobile-side').classList.toggle('open');window.addEventListener('resize',()=>{spreadIndex=0;requestAnimationFrame(measure)});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});render();</script></body></html>
