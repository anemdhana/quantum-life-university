</style></head><body><div class="app lang-te"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-03-te.html">Prev</a><a href="day-05-te.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">కారణం · సంకేతం · నూతన జన్మ · దేవీ నవరాత్రులు · Day 4</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">కారణం · సంకేతం · నూతన జన్మ</span></div><div class="tools"><span class="lang-switch"><a href="day-04-te.html" class="active">TE</a><a href="day-04-en.html">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-03-te.html">Prev</a><a href="day-05-te.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"ధ్యాన ప్రారంభం · శ్వాస · సహస్రారం","paras":["జ్ఞానోదయం కార్యక్రమంలో 56 64వ రోజుకి స్వాగతం. దేవీ నవరాత్రుల జ్ఞానం అందుకుంటున్నాం ఎంతో విశేషంగా మన క్వాంటం లైఫ్ యూనివర్సిటీ ఫౌండర్ అండ్ చైర్మన్ డాక్టర్ న్యూటన్ కొండవేటి గారి నుంచి ప్రతిరోజు ఈరోజు ఈ దేవీ నవరాత్రుల ఉత్సవంలో నాలుగవ రోజు అండ్ ఈరోజు కూడా ప్రతిరోజు లాగానే మనం చక్కగా ధ్యానంతో ప్రారంభిద్దాం. ఆ తర్వాత జ్ఞానాన్ని స్వీకరిద్దాం. మరి అందరము ఆనాపానసతి ధ్యానానికి సిద్ధమైపోదాం. చక్కగా పాదాలు రెండు క్రాస్ చేసుకొని కళ్ళజోడు ఉంటే కళ్ళజోడు తీసేసి వేళ్ళలో వేలు పెట్టుకొని సుఖాసనంలో కూర్చుందాం.","కళ్ళు రెండు మూసుకొని హాయిగా సహజంగా జరిగే శ్వాసని గమనిద్దాం. ఒక చక్కని చిరునవ్వుతో మీ ఎంతో ప్రశాంతమైన పద్ధతి ఈ 40 నిమిషాలు పూర్తిగా బాహ్య ప్రపంచాన్ని మర్చిపోదాం. అంతర ప్రపంచాల్లోకి ప్రయాణిద్దాం. సాధన చేద్దాం. ఈ ప్రత్యేకమైన నవరాత్రుల సమయంలో బ్రహ్మ ముహూర్తంలో సామూహిక ధ్యానం ఎంతో శక్తివంతమైనది. ఎంతో విశేషమైనది ఎంతో అదృష్టకరమైనది ముఖ్యమైనది కూడా మనలో ఉన్న శక్తిని మనం తెలుసుకోవాలి. సృష్టికి మూలమైన శక్తిని తెలుసుకోవాలి. అంటే మనసు శూన్యం అవ్వాలి. నిశ్చలంగా ఉండాలి. ఓం హల్లెలూయా ఆం ఓం ఓం ఓం పూర్తి ఎరుకతో ఈ ధ్యాన సాధన కొనసాగిద్దాం.","పూర్తి శ్రద్ధతో సాధనలో లీనమైపోదాం. ఈ క్షణం మరే ఆలోచన ముఖ్యం కాదు ఆ శ్వాసమేద్యాసం ఓం ఓం ఓం ఓం ఆ ఓం ఓం ఆ ఆ ఓం ఆ ఓం ఆ ఓం ఓం ఓం ఓం 20 నిమిషాలు ఈ ఎరుకని కొనసాగిద్దాం. మన ధ్యాన సాధనలో లీనమైపోదాం. పూర్తి ఎరుకతో ఉందాం. శ్వాసతో ఉందాం. ఆ ఆ ఆ ఓం ఓం ఆ ఆ ఆ ఓం నెమ్మదిగా మీ ధ్యాసని తలపై భాగం వైపు తీసుకురండి తలపై భాగం సహస్రార శక్తిని గమనిద్దాం ఈ శక్తి మనందరిలో నిలిచి ల జ్ఞానపు వెలుగు ఈ వెలుగుని శరీరమంతా ప్రవహిస్తున్నట్లుగా భావిద్దాం అనుభవం పొందుదాం. ఈ తలపై భాగం నుండి ఈ శరీరంలో ప్రతి అవయవము కూడా ఈ శక్తితో నిండిపోతూ ఉంది.","ఈ చుట్టూరా ఈ శక్తి మరింత అద్భుతంగా ప్రవహిస్తుంది. ఈ సామూహిక జ్ఞానంలో పాల్గొంటున్న ప్రతి దేరితోను కనెక్ట్ అవుతూ ఉన్నాం. మన అందరి శక్తి కలిపి మరింత శక్తి క్షేత్రంగా ఎదురవుతుంది. ఈ భూమండలమంతా ఈ సామూహిక ధ్యానంలో ఈ అనుభవంలో విశ్వ కళ్యాణం కోసం ఈ సంకల్పం తీసుకుందాం. ప్రతి ఒక్కరిలో ఉన్న అంతర్గత జ్ఞానం మేల్కోవాలని ఈ భూమండలంపై కరుణ శాంతి మైత్రి ఆనందం ఆత్మజ్ఞానం బ్రహ్మజ్ఞానం అందరిలోనూ జాగృతం అవ్వాలని ఈ సంకల్పానికి మన సహస్రారా పిరమిడ్ ఎంతో అద్భుతంగా ఓడ్పడుతుందని మన స్ఫూర్తిగా సంకల్పిద్దాం.","నీ సంకల్పం నెరవేరుతున్నట్లు ఈ భూమండలమంతా శక్తివంతం అవుతున్నట్లు చూడండి ఆ ఓం ఈ సంకల్పాన్ని ఎంతో నమ్మకంతో ఈ విశ్వానికి విడుదల చేద్దాం. అతి త్వరలో మన ఈ సహస్రారా పిరమిడ్ మన కళ్ళ ముందు మనం చూడబోతున్నాం. అందులో అద్భుతమైన ధ్యాన అనుభవం ఉంది మనమంతా మనల్ని మనం తెలుసుకుంటూ ఉన్నాం. ఈ భూమండలంలో అతమైన ఉన్నతమైన ప్రకంపనలు శక్తి ప్రవహిస్తుంది. ఎథాస్ట్ అథాస్టిస్ట్ ఇప్పుడు తిరిగి ఈ ధ్యాసని శ్వాస మీదకి తీసుకురండి.","ఓం ఆ ఓం ఓం ఆఖరి రెండు నిమిషాలు పూర్తి ఎరుకతో ఈ ధ్యాన సాధనలో ఉందాం ఓం ఓం ఓ ఆ ఓం ఆ ఇంకొక్క నిమిషం 10 సెకండ్లు 10 సెకండ్లు ఐదునాలుగు మూడు రెండు ఒకటి సున్నా నెమ్మదిగా మీ చేతులు రెండు కొద్దిగా క్షణ పాటు కళ్ళ మీద ఉంచుకొని ఒక చిరునవ్వుతో కళ్ళ రెండు తెరుద్దాం. వెల్కమ్ బ్యాక్ ఎవ్రీవన్ అందరికీ మరొక్కసారి స్వాగతం. ఈరోజు దేవీ నవరాత్రిలో నాలుగవ రోజుకి వచ్చేసామ అప్పుడే అండ్ ప్రతిరోజు మనం ఎంతో చక్కగా ఈ ఉత్సవాన్ని సెలబ్రేట్ చేసుకుంటూ ఉన్నాము.","పొద్దున్నే ధ్యాన సాధనతో అలానే ఈ జ్ఞానాన్ని మనం స్వీకరిస్తూ మరి ఇంతకన్నా గొప్ప సెలబ్రేషన్ ఏముంటుంది ఒక బ్రహ్మజ్ఞాని నుంచి మనం తెలుసుకోవడం ఉత్సవం అంటే ఏంటి సెలబ్రేషన్ అంటే ఏంటి అనేది సో మరి ఒక చిరునవ్వుతో అందరం జూమ్ లో ఉన్నవారంతా కెమెరాస్ ఆన్ చేసి ఒక స్మైల్ తో వెల్కమ్ చేద్దాం మరి మన క్వాంటం లైఫ్ యూనివర్సిటీ వ్యవస్థాపకులు ప్రమ చక్రవర్తి డాక్టర్ న్యూటన్ కొండవేటి గారిని స్వాగతించుకుందాం ఈరోజు సెషన్ కి సిద్ధమైపోదాం. థాంక్యూ సార్ ఓవర్ టు యు జ్ఞానోదయం శుభోదయం మై డియర్ ఫ్రెండ్స్ దేవీ నవరాత్రులు చక్కగా మనం సెలబ్రేషన్ చేసుకుంటున్నాం.","ఒకొక గొప్ప స్థితిని మనం అనుభూతి చెందుతూ ఆ స్థితి నుంచి సెలబ్రేషన్ చేసుకుందాం. సో ఈరోజు నాలుగో రోజు కూడా మనం ఆ జగన్మాత ఆ పరాశక్తి ఎన్నో రూపాల్లో ఎన్నో అంశలతో మరి ఆవిడ ఒక కారణం చేత తనను తాను సృష్టి చేసుకున్నారు. ప్రతి ఒక్కటి కార్య కారణ సంబంధమే కారణం లేకుండా కార్యం ఉండదు. మన జన్మకు కూడా ఒక కారణం ఉంది. మన సృష్టికి కూడా ఒక కారణం ఉంది. సృష్టి వెనకాల ఒక కారణం ఉంది. ప్రతి సృష్టి వెనకాల ఒక కారణం ఉంటుంది. సో మొదటి రోజు నుంచి మనం మన గ్రంథాల్లో చెప్పబడిన కథలన్నిటికీ కూడా ఒక గూఢార్థం ఉంది నిగూఢమైనటువంటి జ్ఞానం పొందుపరచబడి ఉంది.","ప్రతి పండగ మన భారతదేశంలో జరుపుకునే ప్రతి దేవతా శక్తికి కొన్ని రోజులు మనం వారి కోసం అంకితం మన మహర్షులు అంకితం ఇచ్చేశరు అలానే దేవీ నవరాత్రులు కూడా ఒక సంకేత రూపంలో చిహ్న రూపంలో లో ఈ కథలన్నీ పౌరాణిక కథలన్నీ చెప్పబడ్డాయి. వాటిని మనం ఎంతగా చక్కగా అర్థం చేసుకునే కొద్ది దానిలో ఉన్న జ్ఞానాన్ని మనం తీసుకుంటాం అవన్నీ సాధన రహస్యాలు సాధన మెలుకవలు ఒట్టి కథలాగా తీసుకుంటే దానిలో నుంచి మనం మనక ఏ ప్రయోజనము ఉండదు. ప్రతి పండగ కూడా కొంత ఏదో జాయ్ఫుల్ గా అలా ఊరికే ఫీల్ అవుతుంటాం మళ్లా పండగ అయిపోగానే నార్మల్ అయిపోతుంది.","కానీ దేవి నవరాత్రుల గురించి ఫస్ట్ చెప్పుకున్నాం ఈ తొమ్మిద టే నేను నాకు ఇన్నీ కావాలి ఈ వస్తు ప్రపంచము ఎన్నో డిజైర్స్ ఉంటాయి ఎన్నో తృష్ణలు ఉంటాయి ఎన్నో కోరికలు ఉంటాయి ఈ కోరిక మనం ఒక మాల్లోకి వెళ్తే మన ఇంట్లో ఆల్రెడీ ఫ్రిడ్జ్ ఉంది ఇంకొక పెద్ద ఫ్రిడ్జ్ చూస్తాం ఎవ్రీ టైం టెక్నాలజీ మారుతుంటది అది చూడంగానే మళ్ళ ఇది కూడా కావాలి అక్కడ టీవీ కొంటాము ఆ టీవీ ఇప్పుడు కొత్త అడ్వాన్స్ టీవీ ఫోన్ కొనుక్కున్నారు కొత్త మోడల్ మళ్ళా నెక్స్ట్ ఇయర్ రిలీజ్ అవుతుంది మళ్లా ఇంకో తృష్ణ మొదలవుతుది.","ఎక్కడికి వెళ్తే అన్ని లావుతుంటది మనసు ఇది కొనుక్కోవాలి అది కొనుక్కోవాలి ఈ ఇల్లు చూస్తాం ఇంకొకటి చూస్తాం ఆ నాకు ఆ ఇల్లు కావాలి అనిపిస్తుంది. ప్రతి ఒక్కటి మనకు కావాలనిపిస్తుంటుంది."],"minutes":7,"words":1036},{"title":"రంభ · కరంభ · ఐహిక వాంఛలు","paras":["తీవ్రమైనటువంటి ఈ ఐహిక వాంచలు అంటాం ఐహికం అంటే ఇక్కడ ఐహంగా ఇక ఈ ఈ ప్రపంచం ఈ స్థూల ప్రపంచం ఈ వస్తు ప్రపంచంలో ఇది కావాలి అది కావాలి అనే నిరంతరం ఆలోచనలు పుట్ట ఇంకా ఎప్పుడు ఆలోచనలు తగ్గుతాయి రంబుడికి అలాంటి ఆలోచనలు ఉన్నాయంట అహిక వాంచ అందుకే రంబుడు అనే పేరు ఆయన ఎలా తపస్సు చేశారంటే అంటే ఒక నీటి మడుగులో నీటి వీటి లోపల అక్కడ ఉండి ధ్యానం చేస్తారండి మామూలుగా చక్కగా హాయిగా అనుకూలమైనటువంటి వాతావరణంలో చేయొచ్చు ధ్యానం కానీ ఎందుకు నీళ్లోకి వెళ్లి చేయాలి ఇది కూడా ఒక సంకేత రూపంగా చెప్పబడింది.","ఆ నీటిలో మీరు ఎమోషన్ కి మనం చిహ్నంగా తీసుకోవచ్చు ప్రతీకగా తీసుకోవచ్చు ఎమోషన్స్ ఇప్పుడు మనం అనుకున్నది జరగకపోతే మనం అప్సెట్ అవుతాం అన్నమాట మనం ఒకటి అనుకుంటాం ఈరోజు జరగలేదు అది పని మనం కొంచెం డిసపాయింట్ అవుతాం అనుకున్నది కాలేదు కొంచెం బాధ కలుగుతది ఏదో కోరుకుంటారు అది జరగలేదు అది కూడా మీకు కొంత బాధ కలుగుతుంది. సో ఈ వస్తు ప్రపంచంలో ఎప్పుడూ కూడా ఎన్నో బాధలు మన బాధిస్తూ ఉంటాయి.","మనకు అనుకున్నది అనుకున్నట్టుగా అన్ని జరగవు ఈ వస్తు ప్రపంచంలో ఈ స్థూల జగత్తులో అది జరగలేదని ఎందుకు జరగలేదని తటం పడిపోతుంటాం చాలా చింతన చేసేస్తాం చాలా ఆలోచనలు వచ్చేస్తుంటాయి సో ఎమోషన్స్ వచ్చేస్తాయి డెఫినెట్లీ చాలా భావాలు భావోద్వేగాలు భావావేశాలు కోపం వచ్చేస్తది దుఃఖం వచ్చేస్తది ఇవన్నీ వచ్చేస్తుంటాయి. ఇంకా ఎక్కువగా అలాంటి మీరు అనుకున్నది అనుకో జరగకపోతే ఎవరనా మిమ్మల్ని తిరస్కరించి ఉంటే మీరు డిప్రెషన్ లో కూడా లోన అయతారు.","డిప్రెషన్ లో మీరు ఏమి చేయను నేను ఏమి చేయను నేను ఇంట్లోనే కూర్చుంటాను డిప్రెషన్ లోకి లోతు డిప్రెషన్ లోకి వెళ్ళిపోతారు అంటే ఈ మీరు అనేది సంకేత రూపంలో మన భావావేశాలు ఇంకొక అర్థం కూడా చూడొచ్చు నీటిలో ఏమన్నా పడింది అనుకోండి వస్తువు ఒక మీ ఫోన్ పడిపోయింది నీటిలో నదిలో బోట్లో వెళ్తున్నారు అది కింద పడింది కానీ కనిపించదు అది ఆ వస్తువు కనిపించదు అది భూమ్మీద ఉంటే మీకు ఆ వస్తువుని కొంచెం ఎత్తుగతే దొరుకుతుంది. పోగొట్టుకున్న వస్తువు కానీ నీటిలో ఏమైనా పోయింది అనుకోండి అది మరుగున పడి ఉంటుంది అంటే దాగి ఉంటుంది.","అందుకే మన ఈ ఓషన్ గురించి స్టడీ చేసేవారంతా కూడా అంటే సముద్రాలు లోపల ఏమున్నాయో వెతుకుతుంటారు లోపల చాలా రహస్యాలు లాగా ఉంటాయి సముద్ర గర్భంలో బయట కనిపించదు సముద్రం అంతా నీళ్లు నీళ్లుగా ఉంటుంది లోపలికి వెళ్తే అన్ని తెలుస్తుంటుంది.","ఆ నీరు కూడా మాయ కింద ప్రతీకగా తీసుకోవాలి ఇక్కడ ఇంకొక అర్థం అన్నమాట ఇక్కడ నీటిలో ఉండి ఆయన తపస్సు చేశారు రంబుడు అనడానికి ఏమి ప్రతీకగా తీసుకోవాలంటే మాయ ఇది మాయా ప్రపంచం అది ఇదే సత్యం అని అనిపిస్తుంటుంది కానీ అది అసత్యం అందరూ నీకు దుఃఖానికి ఆ వారే కారణంగానే అనిపిస్తూ ఉంటుంది ఇక్కడ కానీ అది సత్యం కాదు రంభుడు యొక్క స్థితిలో మనం అన్నీ కూడా ఈ మాయలో ఉంటాం.","కానీ ఆయన తపస్సు చేస్తున్నాడు దేనికి ముక్తి కాంక్ష ఆయనకు కూడా నేను ఎన్లైటన్మెంట్ పొందాలి ఒకరోజు దీని నుంచి విముక్తి కావాలి నేను మాయలో ఉండే మనం మాయలో ఉంటాం ఇరుక్కుని ఉంటాం బాగా మన చుట్టూర అన్ని ఇరుక్కుని ఉంటాయి అన్ని ఉంటాయి ఎంటాంగిల్మెంట్స్ కానీ గోల్ కొట్టాలి ఫైనల్ గోల్ ఎన్లైటన్మెంట్ పొందాలి అనే కోరిక కూడా ఉంటుంది చాలామందికి మనం చూస్తూంటాం చెప్తూ ఉంటారు వాళ్ళు చాలా సమస్యలు నన్ను వెంటాడుతున్నాయి. నన్ను ఎంతో మంది బాధిస్తున్నారు ఎంతమంది దుఃఖం కలుగజేస్తున్నారో మన దుఃఖానికి హేతువు మిగతావారు లేకపోతే పరిస్థితులు అని అనుకుంటూ ఉంటాం.","అలా అనుకుంటే మనం ఎప్పుడు కూడా ఇంకా బాధ అయిపోతుంది వాళ్ళు ఎందుకు నిన్న ఇట్లా అన్నారు వాళ్ళు ఎందుకు నన్ను ఇలా చూస్తున్నారు ఈ మాటలు ఎందుకు అన్నారు మన దుఃఖానికి హేతువు కారణము ఎవ్వరు కాదు కానీ రంభుడు ఉన్న స్థితి ఆ స్థామస గుణము ప్రధానంగా ఎక్కువగా ఉంది కాబట్టి సోమరితనము మంద మంద బుద్ధి కొన్ని ఈ టెండెన్సీస్ అన్నీ ఉంటాయి. ఇంకా దానికంటే ఎక్కువ చూడలేకపోతున్నాడు.","ఈ వస్తు ప్రపంచంలో చూసి అది వాటి వలన ఈ పరిస్థితి వలన నా దుఃఖం వచ్చింది మన దుఃఖానికి మ "కరంబుడు కూడా ఒకవేళ అతను అసురుడు అయినప్పటికీ అంటే ఎక్కడో కొన్ని ప్రపోర్షన్లో తామసు గుణము రజోగుణము ఎక్కువ శాతం ఉంది. తత్వగుణం కూడా ఉంది కాబట్టి ఈ మాయలో ఎరుక్కోలేదు మాయ ఎరుక్కోకుండా సాధన చేస్తున్నాడు అని చెప్పడం జరిగింది.","సో రంభుడు కరంబుడు గురించి చెప్పి ఎవరు ధ్యానం చేస్తున్న ఇంద్రుడికి బాగా కొంత జెలసీ వస్తుందంట ఇంద్ర పదవి పోతుంది అని చెప్పేసి వాళ్ళు ఆ ఇంద్ర పదవిని కొట్టేస్తారు అని చెప్పేసి ఎప్పుడు కూడా మన సినిమాల్లోన మన కథల్లోన ఎప్పుడు కూడా వింటుంటాం అట్లానే ఇంద్రుడికి రమ్ముడు ఇంత చేసేస్తున్నాడు ధ్యానము రమ్ముడు ఇంత తీవ్రంగా చేసేస్తున్నారు వరాలు పొందేస్తారు మళ్లా ఇంద్రలోకం మీద వచ్చి వాళ్ళు ఆక్పై చేసేస్తారు నా పదవి పోతుంది ఇందులో పదవి పోతుంది అని చెప్పేసి వచ్చేస్తాడు వచ్చి ముసలి రూపంలో ఉండి ఆ","రమ్ముడు నీటి మడుగులో ఉన్నాడు కదా ముసలి రూపం తీసుకున్నాడంట ఆ కాలు పట్టుకున్నాడంట లాగుతున్నాడు లాగుతున్నాడు ఇది కూడా సంకేత రూపం వేదవ్యాసుల వారు చెప్పిన ఒక గొప్ప మెటఫోర్ ఇది ఒ గొప్ప మెటఫోర్ అంటే ఇంద్రుడు దేనికి ప్రతిది అంటే అంటే ఇంద్రియాలు అన్నిటికంటే ప్రధానమైనటువంటి ఇంద్రియం ఏంటంటే పంచజ్ఞానేంద్రియాలే కాదు మనస్సు అనే ఇంద్రియం ఆ ఇంద్రుడే ఈ మనస్సు ఆ ఇంద్రుడే మనసుకు ప్రతీక ఎవరు ధ్యానం చేసినా ఈ మనస్తే ఫస్ట్ అడ్డుపడుతుందంట ఈ మనసే అడ్డుపడుతుంది ఆలోచనలఅన్నీ పుట్టిస్తుంది."],"minutes":6,"words":901},{"title":"మనసు · ఇంద్రుడు · మాయ","paras":["మన టెండెన్సీస్ అన్నీ వస్తాయి ఈ మనసు నుంచే అందుకే కదా మనం ఈ మనసుని శూన్యం చేసుకోవాలి మనసుని ఖాళీ చేయాలి ఆలోచన రాహిత్య స్థితి ఫస్ట్ పొందాలి అందుకే శ్వాస మీద జాస శ్వాస మీద జాత శ్వాస మీద జాత పెడుతుంటాం చిత్తవృత్తి నిరోధం చేసుకోవాలని ప్రయత్నాలు చేస్తుంది కానీ మనసు అనే ఇంద్రుడు ఆ ఇంద్రుడు ముసలి రూపం ధరించాడు ఈ రంభుడిని సాధన చేస్తున్నాడు పట్టుకొని లాగి మొత్తానికి చంపేస్తాడు రంబుడు బాడీ వెకేట్ చేసేస్తాడు అని స్టోరీలో చెప్పబడింది.","అంటే ఇది రంబుడి స్థితి అంటే ఇంద్రుడు మాయా రూపంలో ఈ మనసు అనే ఇంద్రుడు మనల్ని ఎలా సాధన చేయనీయకుండా ఎలా చేస్తుంది అనేది సంకేత రూపంలో ఈ కథలో ఇక్కడ చెప్పారు.","ఇప్పుడు అన్న తమ్ముళ్ళు కదా వీరిద్దరు మరి సోదరుని ఆ ఇంద్రుడు చంపాడంటే ఇంకా ఎక్కువ తీవ్రమైన సాధన స్టార్ట్ చేశాడు అన్నమాట కరంబుడి ఈ స్టోరీలో ఏం చెప్పారంటే ఇంకా తీవ్రంగా స్టార్ట్ చే ","ఈ పుత్ర అనే శబ్దానికి చెప్తున్నాం మనం మీనింగ్ ఈ జన్మ మరణాల్ని దాటగలిగే ఈ నరకం ఇదే నరకం ఇక్కడికి అజ్ఞానంతో మళలా తిరిగి తిరిగి ఆ తృష్ణ ఏదైతే అన్ఫినిషడ్ బిజినెస్ ఉంటుందో మళ్లా పుట్టిస్తుంది మళ్లా జన్మకి కారణం అవుతుంది. ఎన్నో ప్రాజెక్ట్స్ తీసుకుంటాము అన్ని ఆ పెండింగ్ లో పెట్టేస్తాం ఆ ప్రాజెక్ట్ ని కంప్లీట్ చేయం ఎన్నో జన్మల ఇన్కంప్లీట్ లైఫ్ టైమ్స్ ప్రతి జన్మ కూడా మనకి కొన్ని అనుభవాలని అనుభూతులని మనం ఇస్తుంది.","ఆ జన్మలో చేయాల్సింది ఇదని ఇది చేయాలని నిర్ణయించుకని వస్తుంటాం కానీ అది చేయం పోస్ట్పోన్ ఈ జన్మ మళ్లా వేస్ట్ అయిపోయింది ఇప్పుడు చాలామంది ఈ లౌకికంగా ఈ ప్రాపంచికంగా ఏదో ఉద్యోగాలు చేసుకుంటూ బతకడానికి పుట్టలేదు అంటే రోజున 9 టుఫైవ్ జాబ్ కాదు వారు ఆల్రెడీ ఎంతో ధ్యాన సాధన చేసి ఉంటారు వారు వేరే పర్పస్ తో పుట్టారు వారు అందుకే కొంత కొంత సాధన చేసుకున్న తర్వాత ధ్యానంలోకి వచ్చిన తర్వాత వాళ్ళకి ఇంకా రెజనేట్ కాదు ఆ జాబ్ తో వాళ్ళు చేస్తున్న ఉద్యోగంతో వారు దీని కాదు నేను కంప్లీట్ గా 24/7 ఈ ఆధ్యాత్మిక దీనిలో ఉండాలి అని నిర్ణయం తీసుకుంటారు.","నా మెడికల్ స్టడీస్ అయిపోయిన తర్వాత నాకు ఒక్క క్షణం కూడా అక్కడ ఉండాల అనిపించలేదు. చాలా గొప్ప వైద్యశాస్త్రం చాలా గొప్ప శాస్త్రం అది కానీ దానికంటే ఉన్నతమైనటువంటి శాస్త్రం ఆధ్యాత్మిక శాస్త్రం నా జన్మను వేస్ట్ చేసుకోవాలి అనిపించలేదు డబ్బులు సంపాదించొచ్చు చాలా సంపాదించొచ్చు హాస్పిటల్ కట్టొచ్చు ఎన్నెన్నో చేయొచ్చు సర్జరీలు చేయొచ్చు ఎన్నో చేయొచ్చు కానీ అది కాదు సో ఒక కారణంతో జన్మలు తీసుకుంటూ ఉంటాం వ్యర్థ వ్యర్థం చేసుకోకూడదు మన పర్పస్ కి ట్యూన్ అయిపోవాల మనం దేనికోసం పుట్టామో అది మనం చేయాలి కంపల్సరీగా చేయాలి లేకపోతే మనకి లోపల ఆ అసంతృప్తి ఉంటుంది."],"minutes":6,"words":903},{"title":"పుత్ర · ద్విజ · స్పష్టత","paras":["ఆ జన్మ ఇన్కంప్లీట్ లైఫ్ గా ఉంటుంది అసంపూర్ణంగా ఉంటుంది. మళ్లా ఇంకోసారి రిపీట్ చేయాలి జన్మ సో మనం ఏం చేయదలుచుకున్నామో ఇక్కడ అది ఆ క్లారిటీని ఆ స్పష్టత ధ్యానంలో మనకు తెలుస్తుంది. ధ్యాన సాధన అందుకే చేయాలి మనం ఎవరమో మనం ఫస్ట్ తెలుసుకోవాలి తర్వాత రెండోది మనం ఏం చేయాలో తెలుసుకోవాలి మన పర్పస్ ఆఫ్ లైఫ్ అంటాం కదా జీవిత ధ్యయం ఏంటి అది తెలుసుకోవాలి.","సో కరంబుడు కూడా మరి రంబుడు అయితే తన మాయలో ఉన్నాడు అయక వాంచ కరంబుడు [గొంతు సవరించుకోవడం] స్థితి ఏంటంటే ముక్తిని సాధించాలి కానీ ఇక్కడ కొన్ని ఉన్నాయి అతను కూడా అసుర గుణాలు కొన్ని ఉన్నాయి ఉంటాయి అందరిలో ఉంటాయి అందరిలో కూడా ఈ యొక్క అసుర గుణాలు తమస్సు తమోగుణము రజోగుణం కూడా ఎక్కువగా ఉంటుంది. సో సాధన చేస్తూ ఉన్నాడు.","కొంత సాధన చేసిన తర్వాత అగ్నిదేవుడు ప్రత్యక్షమయ్యాడు ఎందుకంటే తన్ని మనసుని లయం చేసేసాడంట ఆ మనసుని శిరస్సుని శిరస్సునే అర్పించేసాడు అక్కడ మనసుని డ్రాప్ చేసేసాడు కంప్లీట్ గా డిజల్వ్ చేసుకున్నాడు అప్పుడు పరమాత్మ తత్వం తెలిసింది ఆ పరమాత్మ తత్వము అణో అణోయాం రణో రణోయం మహతో మహేయాన్ అణువు కంటే పరమాణువు కంటే అతి సూక్ష్మమైనది ఎంతో సర్వత్ర మొత్తం ఎంతో వాస్ట్ గా ఎన్నో బ్రహ్మాండాలు ఎన్నో విశ్వాలు ఎన్నో విశ్వాలు అంతా వ్యాపించి ఉన్నది.","అదే ఆత్మతత్వం సో ఆత్మతత్వం నుంచి తన ప్రబోధం వచ్చింది ఆత్మ ప్రబోధం టీచింగ్ సూచ మనం ఎప్పుడైతే మన ఆత్మ క్షేత్రంలో మన భావనా క్షేత్రం నుంచి ఆత్మ క్షేత్రంలోకి అడుగుపెడతామో అక్కడి నుంచి మనకి ప్రబోధాలు ఇప్పుడు బయట ఎక్స్టర్నల్ గా మనం వినాలని కూడా అనిపించదు. లోపల వింటాం మన లోపలే గురువు ఉన్నాడు మన లోపలే పెద్ద గురువు ఉన్నాడు.","పరమాత్మ తత్వము ఈ జీవాత్మగా లోపల వెయిట్ చేస్తున్నాడు ఈ దేవుడు లోపల ఉండే దేవుడు వెయిట్ చేస్తున్నాడు ఎప్పుడు మనం కనెక్ట్ అవుతామ అని ప్రబోధం అక్కడి నుంచే వస్తుంది ఆత్మ ప్రబోధము ఆత్మ మనకి ఎన్నో తెలియజేస్తుంది పరమాత్మ తత్వము మనక ఎన్నో తెలియజేస్తుంది.","సో కరంబుడు పుత్రుడు కావాలని కోరుకున్నాడు అంటే జనమరణ చక్రాలని దాటాలని కోరుకున్నాడంట జన మరణ చక్రాలను దాటాలి ఎందుకంటే అదే పెద్ద గోల్ అది మోక్ష జ్ఞానం ద్వారా ఈ సైకిల్స్ ఆఫ్ బర్త్ అండ్ డెత్ ని మనం స్టాప్ చేస్తున్నాం ఎందుకంటే స్కూల్లో ఎన్నిసార్లు ఏడవ తరగతి ఫెయిల్ అయ్యి పాస్ అయి ఫెయిల్ అయి ఫెయిల్ అవుతూ ఫెయిల్ అవుతూ ఎన్నిసార్లు చదువుతాం సేమ్ లెసన్ సేమ్ థింగ్ పునరపి జననం పునరపి మరణం పునరపి జననే జటరే శయనం యహ సంసారే బహుదుస్తారే కృపయాపారే పాహి మురారే భజగోవిందం భజగోవిందం ఎన్నో సార్లు","వస్తున్నాం ఎన్నో సార్లు ఎన్నో సార్లు ఎన్నో వ్యర్థమైనటువంటి జన్మలు వేస్ట్ అయిపోతున్నాయి మనం అది కూడా రియలైజ్ కాకుండానే మనం ఇక్కడ ఏదో చిన్నప్పుడు గర్భం దాల్చిన తర్వాత పేరెంట్స్ ఫస్ట్ ఆలోచించేది స్కూల్ ఫీస్ ముందుగానే కట్టేస్తున్నారు ఈ మధ్య ఏ స్కూల్లో ఇంటర్నేషనల్ స్కూల్లో చదివించాలని ప్రోగ్రామింగ్ చేసేస్తారు చిన్న పిల్లలకి వాడి లైఫ్ స్క్రిప్ట్ ని వీళ్ళ పేరెంట్స్ రాసేస్తారు ముందుగానే వాడు డాక్టర్ కావాలి వాళ్ళద్దరు మళ్ళా ఆర్గ్యుమెంట్ చేసుకుంటారు అన్నమాట తల్లిదండ్రులు నో లేదు లేదు","ఇతడు సైంటిస్ట్ కావాలి డాక్టర్ కావాలి అంటది అట్లా చిన్నప్పుడే ప్రోగ్రామింగ్ అయిపోయింది.","పుట్టిన తర్వాత వాడి కన్ఫ్యూజన్ గందరగోళం ఏం చేయాలో తెలియదు పాపం తల్లిదండ్రులు వాళ్ళు వాళ్ళ ప్రాజెక్టులఅన్నీ ఏదైతే ఆమె డాక్టర్ కాలేదు నా కొడుకు డాక్టర్ కావాలి నా కూతురు డాక్టర్ కావాలి ఇన్నీ ఆమె చేయాలి మన ఓన్ ప్రాజెక్ట్స్ కోసం ప్రతి ఒక్కళ్ళు కూడా వాళ్ళ ఓన్ ఫుల్ఫిల్ చేయడానికే మనం పుడుతుంటాం. ఒక సోల్ అజెండా ఉంటుంది ఒక సోల్ ప్లాన్ ఉంటుంది.","మనం ఎప్పుడు సర్వైవల్ కోసమే కాదు సర్వైవల్ ఇంపార్టెంట్ వెరీ ఇంపార్టెంట్ డెఫినెట్లీ ఇక్కడ ఈ ఫిజికల్ ప్లేన్ లో డైమెన్షన్ లో మనం కచ్చితంగా మనం చేసే వృత్తి ధర్మం చేస్తాం వృత్తిలో ఉంటాం ఆ ప్రొఫెషన్ లో ఉంటాం కానీ దానిలో ఆక్యుపై అయిపోయి కూడా ఉండకూడదు. లాహిర్ మహాశయ లాగా ఉండాలి లాహిర్ మహాశయ గారు తన వృత్తి ధర్మాన్ని చేశారు 9 టుఫైవ్ జాబ్ చేశారు కానీ రాత్రంతా సాధన చేసుకున్నారు. రెండు బ్యాలెన్స్ చేసుకున్నారు.","సో రంబుడు కరంబుడు అంటే అన్నదమ్ములు అంటే మనలో ఒక జీవాత్మ సాధన చేయాలని కోరుకుంది కానీ రెండు కోరికలు ఉంటాయంట ఒకటి ఇక్కడ కూడా సర్వైవ్ కావాలి ఇక్కడ కూడా జాబ్ చేయాలి శాలరీ కావాలి కుటుంబ పోషం చేయాలి కుటుంబం కావాలి సుఖం కావాలి ఇక్కడ సుఖభోగాలు కావాలి ఫిజికల్ ప్లేన్ లో అది రంబుడు స్థితి ఓకే కరంబుడు అంటే నేను మోక్షం పొందాలి ఆ పరమానందం పొందాలి భగవద్గీతలో చెప్పిన శ్రీకృష్ణ పరమాత్మ చెప్పినవన్నీ నేను అనుభవం చెందాలి ఆత్మజ్ఞానం బ్రహ్మజ్ఞానం పొందాలి ఇది కరంబుడు యొక్క మానసిక స్థితి అంటే జీవు","జీవుడిలోనే రెండు ఉన్నాయండి ద్వందవాలు ఉన్నాయి ఒక పక్కన సంసారం రెండో పక్కన నిర్వాణం సంసారంలో సకల భోగాలు నాకు కావాలనుకుంటాం నిర్వాణంలో నాకు ఈ దుఃఖ రాహిత్య స్థితి పరమానంద స్థితి అది కావాలనుకుంటాం ఎప్పుడు పోతుందో దుఃఖాలు అని ఆ మోక్ష జ్ఞానం పొందాలని కోరుకుంటాం.","ఈ రెండు కాంట్రడిక్టరీ ఈ రెండు కూడా విరుద్ధమైన సంకల్పాలు కదా ఒక సంకల్పం ఏమో మెటీరియలిజం కి తీసుకెళ్తుంది ఇంకోటి స్పిరిచువలిజంకి తీసుకెళ్తుంది.","ఇదే రంబుడు కరంబుడు అంటే ఈ ద్వందం ఇక్కడ గందరగోళం మనం డౌట్ వచ్చేస్తది ఇక్కడ ఉండాలా సంసారంలో ఉండాలా నిర్వాణంలో ఉండాలా సంసారాన్ని మనం చదించామా రిజెక్ట్ చేశమా నా సంసారం ఏమవద్దు మనం చాలామంది బాహ్యంగా ఈ సంసారాన్ని వదిలిపెడతారు బాహ్యంగా ఎక్స్టర్నల్ గా ఫోర్సబుల్ గా నాకు ఏమవద్దు సన్యాసం తీసుకుంటాను నేను ఎప్పుడు ఓన్లీ ధ్యానంలో చేసుకుంటా ధ్యానంలో ఉంటా కానీ లోపల లాగుతూ ఉంటుంది మళ్ళ ఆ లోపల మనసులో ఓ ఇది నేను ఎక్స్పీరియన్స్ పొందలేదు ఇన్నీ ఇది చేయలేదు అది చేయలేదు ఇన్నీ ఇన్కంప్లీట్ గా ఉన్నాయి","ఓ నా కుటుంబాన్ని వదిలేసాను నేను ఎవరితో నేను మాట్లాడట్లేదు ఏకాగ్న అయిపోయాను సంసారంలో మనం జీరో మార్క్స్ ఉన్నాయి ఇప్పుడు నిర్వాణంలో అప్పుడు అది మళ్ళ కింద పడుతుంటాం నిర్వాణంలో ఏం పెద్ద మన షైన్ కాము ప్రోగ్రెస్ కాము ఎందుకు ఇక్కడన్ని జీరోలో ఉన్నాం కాబట్టి నెగిటివ్ లో ఉన్నాం యాక్చువల్గా ఇక్కడి నుంచి పారిపోయాం కాబట్టి సంసారం నుంచి పారిపోతే మళ్ళ ప్రాబ్లమే కాబట్టి రంబుడు కరంబుడు ఇద్దరు కూడా రెండు స్థితుల్ని సాధకుడు ఏం చేస్తాడంటే బ్యాలెన్స్ చేసుకోవాలంట రెండు ఇంపార్టెంటే ఏది చదించకూడదు"],"minutes":5,"words":742},{"title":"హల్వా · కమలం · వాసనలు","paras":["కామి కానివాడు మోక్ష కామికాడు హల్వా తినాలని ఉంది మీకు దాన్ని సన్యాసం తీసుకున్నారు హల్వా తినను హల్వా సన్యాసం చేశారు మీరు కానీ లాగుతూ ఉంటుంది మెడిటేషన్ లో కూర్చుంటే ఫస్ట్ హల్వానే గుర్తొస్తది హల్వా కనిపించడం కూడా స్టార్ట్ అవుతుంది.","హల్వా ఎక్స్పీరియన్స్ వస్తుంది ఏదైతే మనం ఎక్స్క్లూడ్ చేసుకుంటామో ఫిజికల్ ప్లేన్ లో అవన్నీ కూడా ఇంక్లూడ్ కాబడతాయి అన్నీ మళళా ఇక్కడ సాధనలో మనకి అడ్డంకులుగా వస్తాయి.","అందుకే బ్యాలెన్స్ చేసుకోవాలి సంసారము నిర్వాణము సంసారంలో మనం తామరాకు మీద నీటి బిందువులాగా నీటి బొట్టు లాగా ఉండాలంట తామరాకు మీద నీటి బొట్టు అంటి అంటకుండా ఉండాలి సంసారంలో ఉండాలి కచ్చితంగా ఉండాలి కానీ ఎప్పుడు దానిలోనే రమించుకుంటే ఇంకా మనం మన ఆత్మ క్షేత్రంలో ఎప్పుడు రమిస్తాం ఎప్పుడు మనం ఆత్మ క్షేత్రంలో ఉంటాం భౌతిక క్షేత్రంలోనే ఎప్పుడు ఇండల్జ్ అయిపోతుంటే ఇక్కడయే ఇక్కడయే అంటే కాదు మనం నిజమైన గోల్ మర్చిపోతాం. అందుకే మై డియర్ ఫ్రెండ్స్ ఈ రెండు స్థితులని కూడా మనం గుర్తుపెట్టుకోవాలి.","మన డిస్ట్రాక్షన్స్ ఎక్కడ డిస్ట్రాక్ట్ అవుతున్నామ అనేది సో ఒకసారి రమణాశ్రమంలో దొంగలు పడ్డారు ఆశ్రమంలో దొంగలు పడడం కూడా జరుగుతుంది చూడండి నిజంగా జరిగిన సన్నివేశం అప్పుడు రామ రమణ భగవాన్ శ్రీ రమణ మహర్షి గారు ఉన్నారు ఆరోజు రాత్రి దొంగలు పడ్డారు వాళ్ళ అక్కడ ఆశంలో ఏముంటాయి పూజా సామాగ్రి కొంచెం ఎవరో అందరూ తెచ్చిన ఫలాలు ఉన్నాయంట ఫ్రూట్స్ ఉన్నాయి దొంగలకేమో కోపం వచ్చింది. దొంగలు కూడా ఒక పర్పస్ ఉంటుంది ఇంటెన్షన్ ఉంటుంది సంకల్పం ఉంది వాళ్ళు అప్సెట్ అయిపోయారు చాలా కోపంతో కొట్టడం స్టార్ట్ చేశారు. భగవాన్నని కూడా కరలతో కొడడానికి సిద్ధమయ్యారు.","ఆయన సైలెంట్ గా మౌనంలో ఉన్నారు. అక్కడ ఉండే వారి శిష్యులంతా కూడా స్వామిని ఇట్లా అంటారా ఇట్లా చేస్తున్నారు అని చెప్పి కోపంగా వాళ్ళ మీద ఉద్రోకంగా వెళ్తుంటే అప్పుడు రమణ మహర్షి గారు ఏమన్నారంటే ఆయన వాళ్ళు వాళ్ళ పని చేసుకొని వాళ్ళు వాళ్ళ ధర్మం వాళ్ళు చేసుకుంటున్నారు వాళ్ళ ధర్మం అది మన ధర్మం మనం చేద్దాం మన ధర్మం మౌనంలో ఉంటూ ఓర్పుతో ఉంటూ శాంతంగా ఉండడం మన ధర్మం వాళ్ళు చేసుకొని తీసుకోవాల్సింది తీసుకుంటాం మేమ ఎందుకు వాళ్ళని అంటావు గనీ వాళ్ళు ఫలాలు ఏమున్నాయో అన్ని వస్తువులన్నీ తీసుకని వెళ్ళిపోయారు.","సో అప్పుడు తర్వాత చెప్పారంట రమణ మహర్షి గారు అందరికంటే పెద్ద దొంగ మనసుఅంట మీ ఆనందాన్ని కిడ్నాప్ చేసేస్తది. మీ ఆనందాన్ని లేకుండా ఆ మూమెంట్ లో తీసుకువెళ్ళిపోతుంది. దుఃఖాన్ని సృష్టి చేస్తుంటది. ఎన్నెన్నో చేస్తుంటుంది పెద్ద మనసు అనే దొంగని పట్టుకోండి మీరు ఇవన్నీ చిల్లర దొంగలు ఇన్నీ కాదు ఎంత గొప్పగా చెప్పారో మాస్టర్ చూడండి ఒక బ్రహ్మజ్ఞాని యొక్క దృష్టికోణం ఏ దృష్టిలో చూస్తారు ఆత్మ దృష్టిలో చూస్తారు. నిజంగా అయినటువంటి ఆ వారికి ఎలా నెలగాలి ఈ ఫిజికల్ ప్లేన్ లో ఎలా ఉండాలి అనేది ఎంత గొప్పగా చేస్తుంటారు.","సో మై డియర్ ఫ్రెండ్స్ ఈ దేవీ నవరాత్రులలో మనం మొదటగా మనం మన అంతర శత్రువులను మనం ఎదుర్కోవాలి బాహ్యంలో శత్రువులు లేరు మన దుఃఖానికి మిగతావారు బాధ్యులు నా దుఃఖానికి హేతువు నా మొగుడు నా పెళ్ళాం లేకపోతే నా పిల్లలు లేకపోతే ఈ పరిస్థితులు అవి కాదు మన దుఃఖానికి హేతువు మన దుఃఖానికి హేతు మన అజ్ఞానము మన గురించి మనకి సంపూర్ణమైన జ్ఞానం లేకపోవడమే ఈ ఇంటర్ప్రిటేషన్ సాఫ్ట్వేర్ ద్వారా మన మనసులో ఉన్నటువంటి ఏదైతే ప్రీలోడెడ్ నాలెడ్జ్ ఉందో ఆ నాలెడ్జ్ ద్వారా మనకు తెలిసిన నాలెడ్జ్ ద్వారా పరిమితమైన","జ్ఞానం ద్వారా దానిలో నుంచి చూస్తుంటాం ఆ కోణాల్లో నుంచి చూస్తుంటాం ఆ లెన్స్ నుంచి చూస్తుంటాం ఈ లోకాన్ని మన ఇంటర్ప్రిటేషన్ అలానే ఉంటుంది అలా కనిపిస్తుంటుంది ఇది మాయా ప్రపంచం అని చెప్పుకున్నాం అది రంభస్థితి రంభుడు ఆ దృష్టికోణంలో చూస్తుంటాడు.","మాయలో ఇరుక్కున్నాడు అసు గుణాలు కరంబుడు తనకి సాధన చేసుకుంటున్నాడు కానీ అసుర గుణాలు ఇంకా ఉన్నాయి సో పున్నామ నరకం నుంచి ఈ జనన మరణ చక్రాల నుంచి దాన్ని బయటపడాలని సాధన చేస్తూ వచ్చాడు. సో ఈ నవరాత్రులు కూడా మనకి ఎన్నో ఈ యొక్క మన లోపల మనం ఎన్నో గుర్తిస్తాం మనలో రంబుడు లాంటి స్థితి మనకు కూడా వచ్చింది ఒకప్పుడు నేను పొందాను మీరు పొందారు అందరూ పొందుతుంటారు.","వస్తు ప్రపంచం మనల్ని చాలా మాయా ప్రపంచం మనల్ని లాగుతూ ఉంటుంది బయటకి బాహ్యంలో బాహ్యంలోకి బాహ్యంలోకి పరిగెత్తాలని మనం ప్రయత్నం ఈ తొమ్మిది రోజులు మనం అంతరంలోకి కావాలి మనకి ఆ అమ్మ దగ్గరికి వెళ్ళాలి అమ్మ అంటేనే శక్తి ఆ శక్తి స్వరూపిని అయినటువంటి ఆ అమ్మ అమ్మ కుండల్ని శక్తిగా ఉంది మనలో వెయిట్ చేస్తుంది మనం ఎప్పుడు కళ్ళు మూసుకొని ధ్యానం చేస్తామా అని కళ్ళు మూసుకొని చేస్తామా అనేది వెయిట్ చేస్తుంది అమ్మ దాగి నిద్రపోతుంది అమ్మ నీకోసం వెయిట్ చేస్తుంది ఎంత కాలం నుంచో వెయిట్ చేస్తుంది పాపం అమ్మ దగ్గరికి వెళ్ళాల అప్పుడు ఆ కుండల్ని శక్తి మేలుకుంటుంది.","ఊర్ముఖంగా వెళ్తుంది. సో ఏ గోల్స్ కొట్టాల అన్ని నెరవేరుతాయి. కానీ మనసు అనే పెద్ద దొంగని మనం దాని నుంచి బయటపడాలి. ఆ మనసు అనే పెద్ద దొంగని పట్టుకోవాల.","సో ఇక్కడ లోపల అంతర్శుద్ధి ఈ అంతర్శత్రువులని మనం జయించాలి అదే మహిషాశు వర్ధిని మహిషాసుర మర్ధిని మహిషాసుర మర్ధిని మహిషాసురుని వధ చేసినటువంటి ఆ శ్రీదేవి మాత సో మరి ఈరోజు రంబుడు కరముడు వరకు మనం చెప్పుకున్నాము తర్వాత మనం మహిషాశుడు గురించి మహిషాశుడు ఉద్భవం ఎలా జరిగింది అనేది కూడా తెలుసుకుందాం కరంబుడికి ఒక వరం ఇవ్వబడింది ఇక్కడ మనం కొంత పాస్ చేస్తాం ఈరోజు ఈ స్టోరీలో ఇక్కడ డాష్ డాష్ డాష్ డాష్ అంటే కామాలు పెడదాం కామా ఫుల్ స్టాప్ లేదు ఇక్కడ రేపు టు బి కంటిన్యూడ్ ఎందుకంటే కరంబుడు వరం","కోరుకుంటాడు కదా వరం ప్రకారం వస్త ఇవ్వబడుతుంది ఏ వరం కోరుకున్నాడు మరి తర్వాత ఎలా మహిషాశురుడు పుట్టాడు ఎందుకు ఈయన కరంబుడు హ్యూమన్ బాడీ కానీ ఆయనకేమో ఆ గేద శరీరం మహీషం అంటే ఒక దున్నపోతు శరీరంతో పుట్టాడు ఎందుకు అట్లా పుట్టాడు ఇవన్నీ కూడా ఎందుకు వేదవ్యాసి ఏ సంకేతాన్ని రూపంలో మనకు తెలియజేస్తున్నాడు మహిషాశుడు ఏ జ్ఞానం మనక ఇస్తున్నాడు మనం అలా కాకూడదు మహిషాశుడులా కాకూడదు ఎలా ఎలా దేవి మాత మహిషాశుని వద చేస్తుంది సంహరిస్తుంది మనలో కూడా ఒక మహిషాశుడు ఉన్నాడు రంబుడు ఉన్నాడు కరంబుడు ఉన్నాడు","మహిషాశురుడు కూడా ఉన్నాడు.","ఈ మహిషాశురుడు గురించి కూడా మనం తెలుసుకుందాం. ఇది ఎట్లా అంటే ఒక సిద్ధ పురుషుడు దగ్గరికి ఒకాయన వెళ్ళాడంట. ఏదో క్లీన్ చేసిన ఒక గుడ్డం ఉంది మురికి గుడ్డ అంటే ఆ సిద్ధ పురుషుడు ఆ మాస్టర్ ఏదో నేర్పించడానికి ఆ మురికి గుడ్డని ఇచ్చి దాన్ని శుభ్రం చేయని ఇచ్చాడట ఈ స్టోరీ సంకేత రూపంలో ఉంది. ఆ మురిక గుడ్డని వాటర్ లో ముంచి తెచ్చాడు అన్నమాట. ఆ మురికి అట్లానే ఉంది ఏదో కొంచెం పోయింది మురికి కానీ అలానే ఉంది. అప్పుడు ఆ పురుష ఆ మాస్టర్ ఏం చెప్పాడంటే వెళ్లి మళ్ళా కొంచెం బాగా సబ్బుతో వేసి రుద్దు బాగా అన్నాడు."],"minutes":6,"words":807},{"title":"మురికి వస్త్రం · సంస్కారాలు","paras":["చబుతా వెళ్లి రుద్దాడు ఒ రెండు మూడు సార్లు పోయింది మురికంతా పోయింది మళ్లా వచ్చాడు కానీ వాసన పోలేదు వాసనలు ఇంకా ఉన్నాయి ఇంకా వెళ్లి ఉతుకు బాగా అప్పుడు ఆ మాస్టర్ చెప్పిన విధంగా ఉతికాడంట బాగా అప్పుడు ఆ దుర్వాసన కూడా ఆ బ్యాడ్ ఆర్డర్స్ కూడా వెళ్ళిపోయినాయి. సో ఇది సంకేత రూపంలో ఉన్న కథ.","మనం కూడా ఎన్నో సంస్కారాలు ఎన్నో వాసనలు ఉంటాయి వాసన అనే ఈ పదము సంస్కారములు వాసనలు ఎన్నో జన్మలు పట్టి మనం ఉంటాయి అన్నమాట వాసనలు ఈ అసుర గుణాలు వాసనలే అవి కూడా తమో గుణాలు తమ తమస్సుకు చెందినటువంటి గుణాలు రజో గుణానికి సంబంధించిన అహంకారం అనే గుణాలు ఇలాంటివన్నీ కూడా ఎన్నో జన్మలుగా మనకు ఉన్నాయి మురికి కూడా ఉంది చాలా మురికి ఉంది మనం చూసే దృష్టికోణం సరిగ్గా లేదు ఇందాక చెప్పుకున్నాం ఒక పాయింట్ ఈరోజు అదే మెయిన్ పాయింట్ మనం ప్రాక్టీస్ చేద్దాం మన దుఃఖానికి కారణం ఎవ్వరూ కాదు నా దుఃఖానికి","కారణం నా అవిద్యే నా అజ్ఞానమే ఎప్పుడైనా దుఃఖం వచ్చింది ఎవరో తిట్టినట్టు తిట్టారు మిమ్మల్ని ఏదో అన్నారు క్రిటికల్ గా మాట్లాడారు మీ పట్ల ఆర్ మీతో మాట్లాడలేదు మీరు కొంచెం డిసపాయింట్ అయ్యారు లేకపోతే కొంచెం అప్సెట్ అయ్యారు వెంటనే ఈ పాయింట్ గుర్తుపెట్టుకోవాలి.","మన దుఃఖానికి కారణం వేరేవాళ్ళు కాదు మన దుఃఖానికి కారణం మనమే మన ఆనందానికి కారణం మనమే ఈ ఒక్క సత్యం తెలుసుకోవాలి. ఈ పాయింట్ ని పట్టుకోవాలి మురికి వదిలించుకోవాలి మనలో ఉన్న అంతరంలో ఉన్న మురికిని వదిలించాలి. మనలో ఉన్న పెద్ద బంగారు గాని ఉందంట. పెద్ద ట్రెజర్ ఉంది మనలో అందరిలో కూడా ఒక పేదరికంలో ఒకాయన జీవిస్తూ ఉన్నాడు రోజు చాలా కాయ కష్టం చేయాలి.","ఒక సిద్ధ పురుషుడు అక్కడ ఉన్నాడు చెట్టు కింద రోజు వెళ్తాడు స్వామికి ఒకసారి నమస్కారం చేసుకున్నాడు స్వామి చెప్పాడు ఏమయ్యా నీకు తెలియదా మీ ఇంట్లోనే పెరట్లో ఉన్న అక్కడ తవ్వు మూడు గంటలు గుంటలు లోపలికి వెళ్ళు 3 ఫీట్ తవ్వు అక్కడ ఒక నీకు లంక బిందలు దొరుకుతాయి గని ఉంది మీకు మీ ఇంట్లో అని చెప్పాడంట ఈ పేదవాడు నమ్మలేదు మా ఇంట్లో ఏంటి ఏంటి లంక వెన్నెలు నా మామూలు ఒక యోగేశ్వరుడు ఒక మాస్టర్ చెప్తాడు నీలో ఉంది అంతా ఉంది నీలో గొప్ప ఆత్మతత్వం ఉంది నీ ఆత్మ అన్నీ దొరుకుతాయి నీకు నీకు చింతామణి","దొరుకుతుంది అక్షయ పాత్ర దొరుకుతుంది కామధేనువు దొరుకుతుంది నువ్వు ఏదనుకుంటే అది జరుగుతుంది నువ్వు చాలా గొప్పవాడివోయ్ అని మాస్టర్ చెప్తాడు మనం నమ్మం నమ్మసక్యంగా లేదు అది సో ఆయన కూడా నమ్మలేదు ఆ పావర్టీలోనే ఆ పేదరికంలోనే జీవించి ఒకరోజు మరణిస్తాడు.","కానీ ఆల్రెడీ ఎంతో మందికి ఈ విషయం ఆ గురువు చెప్పిన విషయం తెలుసన్నమాట. సో నెక్స్ట్ ఆ ఇంట్లో ఆ ఇల్లు కొనుక్కుని ఆ ఇంట్లోకి వచ్చిన ఇంకొక ఆయన ఆ గురువు చెప్పాడు కదా నమ్మాడు వెళ్లి తవ్వాడు తొలితే పెద్ద బంగారు గని లభించింది అక్కడ సో మనలో కూడా ఒక పెద్ద గని ఉంది గురువులంతా చెప్పేది ఇదే ఈ విషయమే మనలో బ్యాడ్ అనేది గుడ్ అనేది రజోగుణం తమోగుణం సత్వగుణంతో పాటు దైవిక గుణాలు ఉన్నాయి మనం దేవుళ్ళము మనం ఆత్మలము పరమాత్మ తత్వంతో ఉన్నవాళ్ళము సో ఈ విషయాన్ని మనం గుర్తుపెట్టుకోవాలి దేవీ నవరాత్రుల్లో ఆ స్థితిని మనం పొందాలి.","అనంతమైనటువంటి శక్తి నిద్రాణంగా నిదురిపోతూ ఉంది మనలో ఆ జగన్మాత ఆదిశక్తి మనం సాధన చేస్తే అంత శత్రువులందరినీ ఒక్కొక్కరిని మనం జయించగలుగుతాం. ఈ మనసఅనే ప్రధానమైనటువంటి ఈ యొక్క శత్రువు ఈ మాయను కూడా జయిస్తాం. మన ఆనందానికి హేతువు మనమే అని తెలుసుకుంటాం. ఒకసారి ఒక ఏనుగు ఒక చెట్టు కింద నిలబడి ఉంది. చెట్టు నీళ్ళు అలా ఉంది పెద్ద ఏనుగు చాలా పెద్ద ఏనువు దోమ కూడా వచ్చింది అక్కడ ఒ దోమ కూడా ఆ దోమ వచ్చి తన మీద వాలి తను కూడా రెస్ట్ తీసుకుంది.","సో రెస్ట్ తీసుకున్న తర్వాత కొంసేపు అయిన తర్వాత అయ్యను అక్కడి నుంచి వెళ్ళడానికి ప్రారంభం స్టార్ట్ ఆ చెట్టు నుంచి ఇంకో ప్లేస్ కి వెళ్ళాలని అనుకుంటుంది. ఆ టైంలో దోమ గారు కూడా నిద్ర నుంచి లేచారు వెస్ట్ నుంచి లేచారు ఆ దోమ ఇప్పుడు మాట్లాడింది. ఏనుగు ఏం చెప్పిందంటే ఓ ఏనుగు గారు ఏనుగు గారు థాంక్యూ థాంక్యూ థాంక్యూ మీ మీద ఉండి రెస్ట్ తీసుకున్నాను నా బరువు కూడా మీకు ఇచ్చాను ఎక్కువ బరువు ఇచ్చేసాను నా వల్ల కూడా మీకు ఎంతో బరువు అనిపించింది.","సారీ మీకు క్షమాపణ చెప్పుకుంటున్నాను మీకు ఇబ్బంది కలుగజేశాను అసలు ఏనుగు అంటుంది ఆ ఏనుగు గారు ఏం చెప్తున్నారు అంటే అసలుకి నువ్వు ఉన్నావని కూడా నాకు తెలిీదు నా మీద వాలావు నీ బరువు ఉందని అని ఏనుగు అనుకుంటుంది. ఏనుగ గారు చెప్పారు ఈ దోమలు అనేవి మన జీవితంలో కూడా సమస్యలు అన్నమాట.","మనం ఏనుగంతటి వాళ్ళం అంట మన ఆత్మ పెద్ద ఏనుగే అంటే ఏనుగ అంటే పెద్ద చాలా గొప్పగా మాత్రంగా ఉంటుంది మహోన్నతంగా ఉంటుంది బలవంతంగా ఉంటుంది మహాబలుడు మహాశక్తివంతుడు మన ఆత్మ అన్నీ ఉన్నాయి గుణాలు సో మనం దోమ స్థితిలో ఉంటామా లేకపోతే ఈ ఏనుగు స్థితిలో ఉంటామా మనం నిర్ణయించుకోవాలి సమస్యలు వస్తుంటాయి వెళ్ళిపోతుంటాయి దోమ వస్తుంది మళ్ళ వెళ్ళిపోతుంది. కానీ ఇప్పుడు మనసు అనేది వచ్చిందా దోమ నా మీద వాలింది దోమ కుట్టింది దాని గురించి ఆలోచన చేసి దాని గురించి ధ్యానించి మనం టైం వేస్ట్ చేసుకుంటాం.","సో ఫ్రెండ్స్ మరి ఈరోజు మన క్లాస్ లో ఈ పాయింట్స్ ఏవైతే తెలుసుకున్నామో ఇది ఈరోజు ప్రాక్టీస్ మనకి మన దుఃఖానికి హేతువు ఎవరూ కాదు మన ఆనందానికి మనమే కారకులము రంబుడు కరంబుడు ఈ రెండు సంసారము నిర్వాణము రెండు ఇంపార్టెంటే ఫస్ట్ తర్వాత ఒకటి డ్రాప్ అయిపోతుంది ఆటోమేటిక్ గా రమ్ముడు డ్రాప్ అయిపోతాడు అంటే మన సంసారము ఒక స్లోగా స్లోగా మనకి తామరాకు మీద నీటి బొట్టులాగా ఉండడం జీవించగలడం నేర్చుకుంటాం సాధన ద్వారా ఏది చేజించకూడదు. మనం ఈ దేనికోసం పుట్టామో దానికి ట్యూన్ కావాలి ఇంకొన్ని పాయింట్స్ మనం ఈరోజు నేర్చుకుందాం.","సో నాకు ఇంకొక క్లాస్ ఉండడం వల్ల ఈరోజు తొందరగా మనం ముగిస్తున్నాం క్లాస్ ని హారిక గారు ఆ మీతో సంభాషణ చేస్తారు తర్వాత క్లాస్ తర్వాత సో మరొక్కసారి దేవి సమర్పణం ఏదైతే సరెండర్ ఆ దేవి మాతకు ఒకసారి అది చేద్దాం మనం అందరం కూడా సో సో హాయిగా లక్ష్మీ ముద్ర అంటే మీ ఎడమ కాలు ఎడమ చెయి గాని పైన ఉండాలి ఇప్పుడు ఎందుకంటే శక్తికి మనం ప్రాధాన్యం ఇస్తున్నాం ఎందుకంటే ఫస్ట్ మనం శక్తిని తెలుసుకోవాలి రెండు కళ్ళు మూసుకొని మన యొక్క ఎడమ నాసికారంద్రం ద్వారా కుడి ముక్కుని మూసి ఎడమ నాసికారంద్రం తొమ్మిది","సార్లు సక్సెసివ్ గా లోపల బ్రీదింగ్ చేయాలి తొమ్మిది రోజులు కాబట్టి తొమ్మిది సార్లు లోపల తీసుకుంటాము తర్వాత నిదానం హోల్డ్ చేయాలి నేను టెక్నిక్ చెప్తున్నాను ఫస్ట్ దాని తర్వాత నమస్కార ముద్రలో ఉంటూ బ్రీతింగ్ స్లోగా వదులుతూ మనం మన శిరసుని వంచి భూమికి తాగితే ఓకే లేదా చేతులు తాకించి అక్కడ మళ్లా హోల్డ్ చేసి మన లోపల శ్రీం శ్రీం శ్రీం ఇన్నీ కూడా ఉచ్చారణ అక్కర్లేదు బయటకి చెప్పక్కర్లేదు మనసులో మనం రిపీట్ చేసుకోవాలి శ్రీమ శ్రీం అంటే అంటే ఆ మహాశక్తిని గురించే మనం అంటున్నాం వైబ్రేషనల్","లెవెల్లో పరా లెవెల్లో పశ్యంతి పరా లెవెల్లో మనం లోపల రిపీట్ చేస్తున్నాం తొమ్మిది సార్లు ఆ తర్వాత నిదానంగా మన శిరస్సుని మళ్ళా తిరిగి యదాస్థానానికి తీసుకురావాలి."],"minutes":6,"words":868},{"title":"దేవీ సమర్పణ · తొమ్మిది రౌండ్లు","paras":["మళ్లా ఇది తొమ్మిది సార్లు మనం చేద్దాం ఓకే ఫ్రెండ్స్ లెట్స్ స్టార్ట్ తొమ్మిది సార్లు మీ యొక్క ఎడమ నాస్కారం ద్వారా ఓన్లీ ఇన్హలేషన్స్ అంటే ఒకటేసారి లోపల తీసుకోకుండా ఎట్లా అంటే అట్లా లోపలికి ఎక్సలేషన్ లేకుండా ఓన్లీ ఇన్హలేషన్స్ తొమ్మిది సార్లు తీసుకోవాలి కొత్తవారు ఎవరైతే జాయిన్ అయ్యారో వాళ్ళ కోసం తర్వాత నమస్కార ముద్ర పెట్టి తర్వాత మన శిరస్సుని వంచేటప్పుడు మనం బ్రీదింగ్ అవుట్ చేయాలి.","శ్వాసని బయటకి పంపిస్తూ నిదానంగా కంప్లీట్ బ్రీత్ అవుట్ చేసిన తర్వాత శిరస్సు భూమిని స్పర్శించిన తర్వాత సరెండర్ అన్నమాట దేవీ సమర్పణం మనం కంప్లీట్ గా ఆ మాతకి జగన్మాతకి ఆదిశక్తికి కొండల్లిని మాతకి మనం సరెండర్ కంప్లీట్ గా మన అన్నిటిని సరెండర్ చేసేస్తాం. అప్పుడు ఆ టైంలో శ్రీం శ్రీం శ్రీం శ్రీం అని చెప్పేసి ఆ వైబ్రేషన్ కి చూనదాం తొమ్మిది సార్లు అనుకోవాలి. తర్వాత తిరిగి యదా పదంగా మీరు మామూలు పాస్టర్ లోకి రావాలి. కంటిన్యూ చేయండి మీ పేస్ట్ లో మీరు చేయండి. తొమ్మిది సార్లు ఈరోజు చేయాలి.","మన శరస్సు వంచేటప్పుడు మన అహంకారాన్ని త్యాగం చేసే అహంకారాన్ని కంప్లీట్ గా సరెండర్ చేసేస్తాం.","బవిబింగ్ డౌన్ అంట టు బౌ డౌన్ టు ద దట్ గ్రేట్ మదర్ మదర్ ఆఫ్ మదర్స్ అమ్మల గంగా అమ్మ మూల పుటమ్మ మన జగన్మాత ఆ పరాశక్తి వండర్ఫుల్ ఫ్రెండ్స్ హరిక మేడం మీరొక చాంట్ దేవి స్తుతి ఏదైనా సరే ప్రతిరోజు కూడా హారిక మేడం నుంచి మనం చక్కగా కావ్యమైనటువంటి అందమైనటువంటి స్వరంతో వారిని వింటున్నాం ఈరోజు కూడా మనం విందాం శామలేమినా మీనాక్షి సుందరీశ్వర సాక్షి [పాడటం] శ్యామలే మీనాక్షి సుందరేశ్వర సాక్షి శంకరి గురుగుహ సముద్భవేశివేవా శంకరి గురుగుహ సముద్భవేశివేవా పామరమోచని [పాడటం] పంకజలోచని పద్మాసనవాణి","హరిలక్ష్మి వినుతే శాంభవి శామలే మీనాక్షి [పాడటం] సుందరేశ్వర సాక్ష const nav=document.getElementById('nav'),mobileNav=document.getElementById('mobile-nav'),columns=document.getElementById('columns');let chapter=0,spreadIndex=0,spreadCount=1;
function makeNav(root){chapters.forEach((c,i)=>{let li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+c.title+'<small>~'+c.minutes+' min read</small></span>';b.onclick=()=>{chapter=i;spreadIndex=0;render();document.getElementById('mobile-side').classList.remove('open')};li.append(b);root.append(li)})}makeNav(nav);makeNav(mobileNav);
function render(){let c=chapters[chapter];document.getElementById('heading').textContent=c.title;document.getElementById('time').textContent='~'+c.minutes+' min';columns.innerHTML='';let title=document.createElement('h2');title.className='section-title';title.textContent=c.title;columns.append(title);for(let p of c.paras){let el=document.createElement('p');el.textContent=p;columns.append(el)}document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i%chapters.length===chapter));requestAnimationFrame(()=>requestAnimationFrame(measure))}
function measure(){const width=columns.clientWidth;const one=window.matchMedia('(max-width:800px)').matches;const total=Math.max(width,columns.scrollWidth);spreadCount=Math.max(1,Math.ceil((total-2)/width));spreadIndex=Math.min(spreadIndex,spreadCount-1);columns.scrollLeft=spreadIndex*width;document.getElementById('position').textContent='Section '+(chapter+1)+' / '+chapters.length+' · '+(one?'Page ':'Spread ')+(spreadIndex+1)+' / '+spreadCount;document.getElementById('prev').disabled=chapter===0&&spreadIndex===0;document.getElementById('next').disabled=chapter===chapters.length-1&&spreadIndex===spreadCount-1}
function move(dir){if(dir===1){if(spreadIndex<spreadCount-1)spreadIndex++;else if(chapter<chapters.length-1){chapter++;spreadIndex=0;render();return}}else{if(spreadIndex>0)spreadIndex--;else if(chapter>0){chapter--;spreadIndex=9999;render();return}}measure()}
document.getElementById('next').onclick=()=>move(1);document.getElementById('prev').onclick=()=>move(-1);document.getElementById('font').onclick=()=>{document.body.classList.toggle('font-large');spreadIndex=0;requestAnimationFrame(measure)};document.getElementById('menu').onclick=()=>document.getElementById('mobile-side').classList.toggle('open');window.addEventListener('resize',()=>{spreadIndex=0;requestAnimationFrame(measure)});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});render();</script></body></html>
