</style></head><body><div class="app lang-en"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-04-en.html">Prev</a><a href="day-06-en.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">Two Navaratris · Aham and Sarvam · Devi Navaratri · Day 5 (English)</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">Two Navaratris · Aham and Sarvam</span></div><div class="tools"><span class="lang-switch"><a href="day-05-te.html">TE</a><a href="day-05-en.html" class="active">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-04-en.html">Prev</a><a href="day-06-en.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"Opening Meditation · Sahasrara Pyramid","paras":["Welcome to the 565th day of the Jnanodayam programme conducted by Quantum Life University. We are on the fifth day of Navaratri, learning from Dr. Newton Kondaveti what Devi means, what the Mother means, and how a human being surrenders — with practicals and with processes. Before that knowledge is received, we sit as we did yesterday. The practice is Anapanasati, mindfulness of the natural breath.","Sit in sukhasana, on a chair or on a mat. On a chair the feet may be crossed. Close the eyes, and with a small smile observe the breath. It is already happening. Nothing is to be controlled or held. Noticing it as it is is the whole work. Continue for another twenty minutes.","Stay with the breath. In the last ten minutes, turn toward the welfare of the world and carry the energy to the Sahasrara Pyramid, meant to serve everyone. With the divine eye, see it: a temple of knowledge, energy coming from the divine realm toward this earth. This age needs peace, self-knowledge, maitri, and karuna. Through the pyramid these are to be awakened in everyone, at the highest level.","With the sankalpa that the self-knowledge in each person should wake, let us become partners in this creation. Feel that we are seated around the pyramid. By the common resolve and the sense of oneness, the building proceeds. People changed by it come from the four corners of the world, practise, and attain self-knowledge. For some hundreds of years it is to serve, and that we may be partners is our fortune. Let it be completed soon, in the right way, the right people and the resources gathering without strain. On the 24th of November, 2027, we see ourselves seated inside it and meditating, the inauguration held with Dr. Newton and Dr. Lakshmi.","With the faith that the universe itself brings this about in the right manner, release the sankalpa, and return to the breath. The last two minutes are simply the breath, slowing, aware. In the last minute: five, four, three, two, one, zero. Place both hands over the eyes for a few moments, and open the eyes with a small smile.","The fifth day is given in person by Brahmarshi Chakravarti Dr. Newton Kondaveti, who shows what a true celebration is. Cameras on, and with a smile we welcome him. Thank you, Sir. Over to you. Thank you, Harika madam. Good morning, dear friends. Jnanodayam. Devi Navaratri we dedicate specially for sadhana."],"minutes":4,"words":413},{"title":"Two Navaratris · Aham and Sarvam","paras":["Every day we are learning many things, and the special nature of this festival, from the spiritual side. Navaratri comes twice. The Navaratri that comes with Ramanavami is Chaitra Navaratri. The one we are in now is Ashwayuja Navaratri, falling in this season, around September and October. Both have a very special place in India. Of the Navaratri observed in April, at the time of Sri Ramanavami, a story is told: how Sri Rama, after the slaying of Ravana, celebrated Vijayotsava, and how he took part in those Devi Navaratri days.","Chaitra Navaratri was established for the sadhana of Aham Brahmasmi — ‘I am Brahman.’ Our rishis and yogis celebrate those spring nights in order to know that state. Sadhana is done then. The meaning is this. Whichever god I am searching for, whichever Brahman, whichever Krishna, whichever Vishnu — whatever I am searching for — that itself is me. To know this is the first step.","The speciality of the Navaratri that comes in Ashwayuja is different, and it is twin to the first. These nights are for knowing, by direct experience, Sarvam khalvidam Brahma — ‘All this, verily, is Brahman.’ Both are important. They are twin aspects. If a person knows only Aham Brahmasmi, a spiritual ego can arise. I am God; everyone else is a demon; everyone else is ignorant; I am the very form of knowledge — and the rest are looked down upon as ignorant. That is not enough. That is not knowledge. It is not pure knowledge.","Sarvam khalvidam Brahma says: as I am, so is everyone. The sorrow I undergo, everyone undergoes. Like me, everyone is striving for mukti, for moksha, for enlightenment, for jnanodayam — the dawn of knowledge. Everyone wants to be free of sorrow. The divinity in me is in everyone. All the nature we see is filled with Paramatma, the Supreme. Otherwise a notion remains: this nature is one thing, and Paramatma is something else.","From that split, destruction follows. For his own gains man cuts trees, forests perish, and hills are torn open for gold, diamonds, or copper. River waters are polluted for a small profit, because Sarvam khalvidam Brahma is not known. This nature itself is Paramatma. The trees are gods. The hill is God. Stones and rocks are divine forms. In every atom, in every particle, he is there. Hiranyakashipu asked Prahlada where this Vishnu was, this Narayana. Prahlada answered: everywhere — in the atom, in the particle, wherever one looks.","Prahlada’s state is Sarvam khalvidam Brahma. He had already attained Aham Brahmasmi, and this as well. The Navaratri we are in now is for this second sadhana. Every kingdom of nature is included: mineral, plant, animal, human, deva, yaksha, kinnara, gandharva, and the angelic kingdom. All are part of this nature, filled with divinity and shining with it. Yogis and rishis prescribed the sadhana. They did not set it down casually."],"minutes":4,"words":486},{"title":"Rambha and Karambha · Two Desires","paras":["Behind the stories there is an inner meaning, a hidden meaning, and it has to be known. Yesterday we learned of Rambha and Karambha. Rambha stands for aihika vanchas — desires of this world. There are two directions of desire, iha and para. Iha means here, this earth-realm. Here certain wants arise: this is wanted, that is wanted. Para is the desire turned toward what is not visible. I want to see what these eyes cannot see. I want to hear what these ears cannot hear. Both desires live in a jiva. In the jiva, Rambha is there, and Karambha is there too.","Rambha makes the material desires of samsara arise. After this body is taken, they are born through the five senses and the mind. They are temporary, and still hope fastens on money: earn more, and for twenty-four hours there is no other sadhana. People meditate on money, or on a job, or on this want and that. That is Rambha. Even there a longing remains — I must know what has to be known, the unknown reality. This is not it; all this is maya — and awareness stays caught. Yesterday: Indra, and mind itself is Indra, came as an old woman, seized Rambha, and destroyed him. She keeps pulling us. Suppress those desires, press them down, and sometime they come out again.","That is why the sadhaka’s Karambha-state is different. The desires are still there, but he has done sadhana in the midst of the panchagnis, the five fires — meaning, amid the five organs of knowledge, and in nature. The banyan, in that telling, is nature: the Paramatma-principle present in nature. He has already started, in seed form, the sadhana of Sarvam khalvidam Brahma. I must attain the knowledge of moksha, enlightenment, the one knowledge after which no other knowledge is required. With that he began meditation.","Karambha’s sankalpa is intense: moksha, mukti, the crossing of birth and death. In yesterday’s story both did tapas for putra-labha, a son. That word, taken here, means the crossing of the cycle. Both live in us, and both are asuras. Asura-guna is the binding quality of nature, chiefly tamas. Tamoguna makes a prisoner of us. Rajoguna does the same: captivity to praise, fame, position, money, property, gold, and people — mine, I, mine — until ahankara and mamakara stay. Tamoguna is also total identification with the body, and laziness for sadhana. Other work does not bring sleep. Meditation does. Many fall asleep as soon as practice begins. And yet a divine radiance is in me.","On the first day someone asked about the eighteen shakti-pithas. All of them are in this body. In the commentary the Ajna chakra is the city of Kashi. Kashi means that which shines — our Ajna. Immerse there, as one immerses in the Ganga. The physical Ganga is not a mistake; those waters are sacred, because the commentary is representing, in symbol, what is within. The seventy-two thousand nadis are spoken of as seventy-two thousand rivers, and the rivers of India carry those names. All the jyotirlingas are inside. What is searched for outside has to be seen inside: darshan, knowledge, experience. Held only outside, it never leaves, and contentment never comes. Contentment comes when buddhi blossoms. What is asked is material contentment together with spiritual discontent."],"minutes":5,"words":554},{"title":"Contentment · The Zero State","paras":["Paramahamsa Yogananda used to give this statement. In the material world, in the wheel of samsara, we should live with contentment. Be content with what is. Do not scramble after what is not there. A disciple once came to a guru with the question everyone carries: how is ananda to be gained? We are all searching only for joy. We want to abide in joy. One day there is joy; the next day depression, sorrow, pain. These swings come. We call them mood swings. We travel from this side to that. There is no single step that stays, nothing that is permanent.","The guru did not answer at once. He asked the disciple: if something precious is with you, how do you feel? Very good — joy. If you lose it? Pain comes. If you gain it back? Joy returns. Then the guru said: see to it that whatever you have remains with you, in you. Contentment will come. Joy will come. Do not scramble after what you do not have.","‘I don’t have this, I don’t have this’ — that itself is the cause of sorrow. That creates the sorrow. ‘I don’t have this; I want that; I want that.’ This is why material contentment is paired with spiritual discontent. On the spiritual side a certain discontent should always remain. Otherwise ego arrives. It can arrive at any time. It is like a game in which the snake may swallow us at any moment. The moment we think, I have come to know everything, our story is finished. Our own ego is what brings the fall. We should always remain in the zero state.","Rambha has many material desires, and he is making an effort toward sadhana, but he is stuck in maya. This is a maya-world; the whole of this is a maya-world. Here addictions crowd in. Everything becomes an addiction. We talk about the outer ones we know — alcohol, smoking — but there is also approval addiction. Everyone’s approval must be won. Everyone’s praise must be had. Everyone should support me. They should say that I am great. Many people are addicted to approval. There is relationship addiction too: the bond with other people is needed; I must have the tie. We get bound. When do bonds bind? Only atma-bandha, the bond of the Self, brings us out. It is a bond that is not a bond.","After coming onto the path of meditation we regard one another as atma-bandhus, kin of the Self. That is all. It does not bind. Souls living in bodies — nothing here is permanent — and we hold that awareness, that consciousness, that prajna. Through that alone, continuously, like Karambha, the attention stays there, on one main goal above the rest: moksha-jnana, enlightenment, atma-jnana, Brahma-jnana. Remaining in the zero state, we practise and we continue, because there are many steps. The infinite that has to be known keeps being known. Humility is required. Vinaya is required.","Taken in essence, Rambha is destroyed first. The sadhaka overcomes him. The material desires that were pulling and pressing are dissolved into Paramatma, and clarity about the goal comes. Karambha grows alert: am I caught in this? The old woman will seize me and I will perish. Sadhana has to continue carefully, amid the five fires. The two in us have to be balanced, and the first rule is not to suppress. Material desires are not crushed. As knowledge grows they slip away, one by one.","There is nothing in the outer stuff. We will not carry even one paisa. What comes with us is the dharma we have done, the knowledge we have gathered, and our experiences — inner experiences, meditation experiences. That knowledge, that sadhana, is what we carry. When sadhakas realise this, Rambha departs and Karambha practises more carefully. The cycles of birth and death are not a place to get stuck. They have to be crossed. That is the sadhana Karambha did. Amid the five fires he severed his own head and offered it to Agni: he offered everything in him, all the desires. Caught by desire, destroyed by the old woman, the sadhana stopped, pain came, and then it was begun again. Karambha continued. The two brothers are two states in the jivatma. From the Karambha-state, the Mahisha-state comes."],"minutes":7,"words":720},{"title":"Mahishasura · The Hidden Yoga","paras":["Karambha offered his head to Agni and was told to ask a boon. He asked to cross birth and death. Outwardly the story says he asked for an unconquerable son of great strength. Misread, the effort looks like the ordinary wish for a child: as soon as people marry, when will the children come; a girl is born and there is disappointment; a boy is wanted, then another. It is symbolic. Every Puranic story in India is written that way. Karambha’s sadhana is deliverance from Punnama Naraka, the hell of dying without a son. The seed was planted, and the practice was intense.","Agni said: whoever appears first, whomever the mind first touches, through that one a son will come. He opened his eyes. A mahishi appeared, a she-buffalo. Mahi is the earth, this nature, and what is in nature is the Paramatma-principle, so Sarvam khalvidam Brahma appeared as the mahishi. He united with her and merged with her. The inner meaning is tadatmya, identity with that nature — a yoga secret in the language of sadhana.","She became pregnant: a knowledge ripening in him, a fruit coming ready. At that moment another buffalo, driven by lust, attacks and falls on her by force. Told as a violation, the subtle sense is an obstacle. Even in meditation a residue that had stayed inside comes out and is about to interrupt. Karambha fights, and Karambha is slain. The mahishi alone, the sadhana alone, is protected by the yakshas — the knowledge-power present invisibly, which keeps the practice distinct, subtle, and unperished.","When Karambha is placed on the pyre, Mahishasura is born from her womb: the passage from the Karambha-state to the Mahishasura-state. The sadhana was still a seed. It had not matured. The same story says Karambha came out of that pyre again as Raktabija. Without the keys, only the outer sense is taken. The firangis, the Westerners who made India a land of slaves, laugh at this culture and at this spiritual science. They say these people have this kind of encounter even with a beast. Vedavyasa did not write idly. He classified the Vedas and the Upanishads, and they are still within our reach. He is verily the form of Vishnu. Behind every story there is an inner meaning.","Mahishasura is an asura. Asura, asvara, nasvara: that which perishes and destroys, what is not good, what keeps destroying sadhana. Asuras disturb meditators, yogis, yajnas and homas — pouring blood from above, as the stories say. Whatever bad quality interrupts practice is asura-guna, and it is in us. Tamas and rajas are these. In us are Rambha, Karambha, and Mahishasura, and also Shumbha and Nishumbha, Vritrasura, Raktabija, and all the Ravanas. The deva-guna, the divinity, is in us as well, and the rakshasas destroy that. Sadhakas propitiate the Devi Shakti within and enter oneness with her. She slays them. These nine days eliminate, one by one, whatever rakshasa quality is left in a corner.","Once arisen, Mahishasura declared war on Indra, fought, and threw the gods into terror. They pleaded with the Trimurtis. Vishnu came on Garuda. Garuda was struck and fell; taking Vishnu, he fled. Garuda is the symbol of Veda-knowledge and of Upanishad-knowledge. Indirect knowledge, paroksha jnana, does not serve in sadhana. Mere theory — all the Vedas read — scores zero. Practice is required. Rituals and ceremonies are good, and nothing is wrong in doing them, but the inner meaning has to be known. Many get stuck there. That is why Garuda falls. Mahishasura defeats Indra and rules Indraloka.","From all the worlds they came to one congregation, Vishnu leading, and he told the secret: except by a woman, death does not come to Mahishasura. A female form endowed with every amsha arose. The portion came from Lakshmi, from Mahalakshmi; then from Mother Durga; then from Mother Saraswati; and from the devatas who were there, every power came to her. She arose with eighteen arms. Mahishasura learned that this power had arisen to destroy him. Everyone was speaking of her beauty. At once he fell into moha and sent six rakshasas as his envoys. An envoy is ordinarily one person, or two. He sent six. These are yoga secrets, and Vedavyasa has told them with great care."],"minutes":6,"words":710},{"title":"Six Envoys · The Arishadvargas","paras":["The six are symbols of the arishadvargas, the six inner enemies. Their names are striking: Bhashpala, Durmukha, Tamra, Chichchura, Asiloma, and Bidala. Bhashpa means tears. Bhashpala is the desire that produces tears and sorrow. If the want is not fulfilled, sorrow comes. This is kama — the first of kama, krodha, lobha, moha, mada, matsarya: desire, anger, greed, delusion, pride, and jealousy. These are the principal enemies in sadhana. We practise in order to attain enlightenment, and first these have to be faced. Devi Shakti arose for that. She slays all six. The first event of sadhana is their destruction, dissolved back into our own Shakti. Bhashpala is Kama, the one who brings tears.","Durmukha is the second, krodha, anger. The face has to be seen in a mirror. When anger is there, let the face be looked at. Put on, even once, that terrible look, and see what the face has become: distorted, cruel. The one with that distorted, cruel face is Durmukha. It comes when anger comes. The lines of the face change. Anger keeps coming. It definitely comes to everyone.","The third is Tamra, and he belongs to lobha, greed. Tamra means the colour red. It indicates rajoguna, and the infatuation with wealth. I want this. Miserliness, extreme greed — we call such a person a miser. Tamra is lobha, the third of the six. The fourth is Chichchura. Split the name: chit and chura. Chit is knowledge. Chura is the sword that cuts. What cuts away the discriminating knowledge within is Chichchura. That is moha, delusion. Where there is moha, ignorance grows, and attachment grows.","Dhritarashtra is the picture. Duryodhana does wicked things, and the father has no eye of knowledge: my son, my son. Gandhari, like her husband, bound her own eyes. If children go on a wrong track they should be told so, and guided. Moha encouraged them instead. The Kauravas were misguided. Through the parents themselves, wrong parenting happened. Conscious parenting did not. Chichchura is moha. It binds, and the way to knowledge is closed.","Asiloma is mada, ahankara. In the explanation given here, asi is terrifying with a sword, la is seizing, and uma is bringing nature’s wealth under control. It lives as ‘I alone am great,’ and with that feeling we do what we ought not to do. Duryodhana had this. Even Sri Krishna was accessible — a way to go and learn — and he could not learn. With ‘I alone am great’ he lost all of it. This is the fifth.","The sixth is matsarya, and the asura is Bidala, a cat. It makes no sound, comes with a treacherous mind, and drinks the milk while people sleep, without a footfall. Jealousy in us is like that. We do not know it is there, and an enmity forms. Someone more beautiful, a longer braid, greater earnings, another person’s third eye opening sooner, a companion in meditation reaching further — all of it is matsarya, and it stays subtle.","These enemies are nowhere outside. Vedavyasa put them into the embassy for that reason. The Devi Shakti whom Mahishasura desired is not someone else. She is Prakriti, the Mother, the divine power of Sarvam khalvidam Brahma, and through her the Lord’s principle pervades the creation. The mind fell toward her: I must attain that state. These six stand as obstacles. She slays them and dissolves them. When we meditate, one by one they leave."],"minutes":5,"words":573},{"title":"Inner Enemies · Three Living Pictures","paras":["Bhashpala is kama, and a person has many desires, not one. A merchant had a house. In the next town he saw a palace and resolved to build one like it. Beyond what he had, he took every kind of debt, raised the palace, and in the end sold all his properties. Desire mixed with greed remained only as tears, as bhashpa. Unovercome, this enemy keeps us weeping. Devi Shakti is what makes the conquest.","Durmukha is anger. A sculptor in a village had wonderful skill, and anger at everything. He does not see his own face. He looks at others and thinks he is fine. He carved a splendid image of a deity, and one finger came out a little crooked. Anger rose until he smashed the image he himself had made. Anger toward others is one thing. Anger toward oneself is self-sabotage, stabbing oneself with that knife. As a mere story, none of this appears.","Tamra is lobha. A rich man loved gold as his life, piled the house with ornaments and coins, and spent nothing. Greed hides: bank accounts, black money, a bank somewhere far off. He hesitated even to eat well. Except how to conceal the wealth — thieves might come; income tax might take it — there was no other thought. One night the thieves carried the hoard away, and he became a beggar. The money had left neither comfort nor peace. It went like rosewater poured into ashes. A master is generous, in the knowledge given and in conduct. If we hide, we are robbed. If we share, we are increased.","Chichchura is moha, present without our knowing. Duryodhana’s parents had it, gave the wrong guidance, and he went the wrong way. A tender plant not bent while small will not bend as a tree. Meditation has to be taught first. A child should hear that self-knowledge exists. What is said instead is: become an engineer, a doctor, study, earn, become a magnate — speech about what perishes and what brings sorrow. That moha binds the children, and they live in ignorance. Earning need not be refused. A good doctor, a good engineer — but the foundation first, and meditation is the foundation. Upanayana was established for this. Even in childhood, Aham Brahmasmi and Tat Tvam Asi: you are not this, dear one; you are That. Said again and again, it still has to come down into practice.","Asiloma is pride. Ego makes us fall, and to break it the universe itself sends lessons. If wrong is done in ego, nature does not stay quiet. An illness comes, and the head has to bow. Cancer comes. This is not to say that everyone with cancer is an egotist. Causes differ, and much is not in our hands. What ego produces is ‘I alone am great.’ The more we learn, the more humbly we can abide.","Bidala is matsarya. A husband meditating well was told by the divine power to ask a boon, on one condition: whatever you ask, double of it goes to your wife. He asked for jewels, for gold, and the double came to her. The second boon was a great deal of money, and again the double came to her. At the third, a murderous jealousy rose. Give me a small heart attack — not so as to die. That much envy can sit in us without our knowing.","The embassy failed. The six were slain, and the arishadvargas were crossed. Mada remained in Mahishasura: ahankara, and the intense subtle ego. Those who do this sadhana get ego more than others. The subtle, and the ego subtler than the subtle, has to be cut as well. Devi Shakti destroyed that too, and slew Mahishasura. While we practise, a great awareness has to be kept. The state to remain in is ‘I do not know’ — what has been known is a grain of sand, and what is still to be known is a mountain. Learning continues in that humility. Thanks are due to Vedavyasa. He gave us the Devi Bhagavatam, and through these stories set the secrets of yoga and of meditation in our hands, so that we may attain Sarvam khalvidam Brahma. This entire nature is that Paramatma-principle."],"minutes":6,"words":708},{"title":"Equal Vision · Jivanmukti","paras":["Today let us mark the practice as well. However we look, the seeing should be like this. Whatever tree we see, a devata should appear there. The Lord himself should appear. Paramatma has appeared in that tree. A mango tree is seen — an ordinary tree — and a devata has appeared. To Gomata, the mother cow, a devata has appeared. To a dog, a devata. Animals, birds, whatever appears: an ant appears, and the ant is the devata. A mosquito appears, and it is the devata. The whole of nature as divine form — that is the vision we need. Sarvam khalvidam. Whomever we see.","In your house, in our own house, there are enemies. Even when we see the enemies in the house, we have to see this same thing inside them. They too are divine forms. They have not yet known. While they are in the state of not knowing, in ignorance, they keep creating sorrow for everyone. Everyone lives in himsa, in violence. A person in whom the eye of knowledge has come, whose buddhi has blossomed, with equal vision and equal feeling, does not judge anyone. Their time will come. They too will one day become masters. They too will do the sadhana of meditation. If not this birth, another birth. That is all.","There is no need that everything happen in this birth itself. This is a journey of many births. For some, many births are taken. In this birth seeds are planted. In another birth they sprout. There is no such rule that within another ten years, in this life, they must attain enlightenment. According to each one’s sadhana, they attain those states and that knowledge.","In today’s class we are speaking of victory over the arishadvargas, the inner enemies. The six rakshasas are the six in us: kama, krodha, lobha, moha, mada, matsarya. They have to be recognised. Has each one been recognised? Identified? Diagnosed? It is easy to think, there is nothing in me, all is well. Many people are like the ostrich, hiding the head in the sand: nothing is there, all is fine, all is fine. It should not be so. As long as we wear this physical body, some faults are also there. They have to be corrected here. In the Atman there are no faults. In the field of the Atman we are all gods: Aham Brahmasmi, Aham Shivosmi, Aham Krishnosmi. But with the delusion of the body, this personality — body, mind, chitta, buddhi, and ahankara joined together — flaws are there. Toward these we have to be vigilant. Awareness has to be there. Otherwise we get stuck, and sadhana is interrupted.","The state of jivanmukti, as Adi Shankaracharya has said: if we are to be jivanmuktas, free while living, then while we are in this body itself we must know. What has to be known must be known. The one knowledge by which all knowledges become known — that knowledge. A single point: Aham Brahmasmi, Tat Tvam Asi, Sarvam khalvidam Brahma. Aham Brahmasmi is to be known, and Sarvam khalvidam Brahma. These two. Every meditation sadhaka’s fruit is these two. They come to know them by experience."],"minutes":5,"words":532},{"title":"Devi Samarpan · The Ninefold Offering","paras":["Wonderful, friends. Today let us once again do the Devi Samarpan we have been practising from the first day. Sit at ease in Lakshmi mudra. More of our attention is for the Shakti: the divine Shakti in us, Devi Shakti. She is present in us as Kundalini. We have to surrender to that Shakti. That is Devi Samarpan. That same Shakti is this entire creation. She is all of nature. Close the right nostril, and through the left nostril draw the breath inward nine times. Nine times means up to a count of nine, and not as one breath. Successive sips. This is being said for those who are new. Inhale inward nine times. If the breath is taken in a rush, by the third or the fourth you cannot inhale, because the lungs are already full. Draw it slowly, gently, nine times. Nine, to match the nine nights of Navaratri.","Then the hands come into namaskara mudra. The breath is held. With sharanu, sharanu — I take refuge — Devi Samarpan is made as a complete bowing down. One must become surrendered to the Devi Mother. The Shakti in us must be surrendered. That Shakti slays everything the six enemies are doing. She slays Mahishasura. All the bad qualities in us go. That Shakti washes them clean.","After the bow has touched, Shreem, Shreem, Shreem is repeated — at the para level, in the mind, not pronounced outwardly — nine times inside. If that bija is not to your liking, then a stream of counting: one, two, three, four, any single sequence, nine times. The count matters. Nine is matched to nine. Then you may return to the original position. Friends, this is to be done nine times.","Let us do it. Sit comfortably. Slowly let the breath go outward as the head bows. Bend the head. Then hold. Stop the breath, and within: Shreem, nine times. Slowly take the breath again and come back to your place. The feeling is what matters. With what feeling it is done — that is the important thing. Devi Samarpan is complete surrender. Become surrendered to that Shakti. To the Kundalini Shakti, to the Shakti of the universe. To the Shakti of Prakriti, the Mother. To the Shakti of Jagannmata, Mother of the world. Do it at your own pace, in your own way. The bhava is what matters.","Those who have finished the nine rounds, remain seated in silence. Sit like a statue, without fidgeting, still — an achala state. In the mind too there is no movement. No thoughts are needed. Those whose breath has settled, simply be. The others, complete the remaining rounds. The offering itself cleanses. What the six enemies do in us, the Shakti to whom we have bowed brings to an end."],"minutes":4,"words":466},{"title":"Tripura Sundari · Ocean of Compassion","paras":["Wonderful, friends. Let us hear a fine chant from Harika madam. In Devi Navaratri it is very beautiful: a stuti of the Devi, of the Mother, of that Parashakti. Harika madam sang of Tripura Sundari. Thank you, Harika madam. Tripura Sundari ma, dayasagarima — Mother Tripura Sundari, ocean of compassion. What abides in her is karuna, daya. Tripura Sundari means she who is in the three cities, the three puras: our Atman, the supreme principle of Paramatma. She herself dwells in the three puras. The quality of compassion in her, the daya — there is nothing that Shakti cannot do. For that Shakti nothing is impossible.","One must surrender to that Shakti. We give a name and a form and say ‘our Devi Mother.’ Actually, when we are sitting in meditation, we have to become surrendered to the Shakti. The Shakti knows. She is a mother-power of great compassion. The chant is the recognition of that, and the practice is the surrender."],"minutes":2,"words":162},{"title":"Questions · Addiction and Healing","paras":["Wonderful, friends. Let us take a few sharings. Yesterday some hands were raised, and two or three of them can be given the chance. Siddu garu. Namaskaram. Thank you, Sir. Maharaj, greetings. His question: toxic people are as if intoxicated — how are such people to be handled? Should we ourselves remain in a meditative state? And a second question, from the Anastasia book. In that book the grandfather tells Anastasia that when the mother, in order to heal a woman, sends forth her own force and heals, that should not be done. That one point had raised a doubt.","Wonderful, Siddu. Very good. The first question is about addiction, about vice, about addiction to intoxicating substances. Many people fall into these addictions because of the pain in them. They are covering it. They do not know how to come out of the pain. They do not know how to come out of sorrow. For some the pain is severe. For some it has lain there from childhood. They have been carrying it from the past, from a long time back. Alcohol, or drugs, whatever is being taken, is used like a temporary pacifier. They carpet over the pain. That is all. This has to be understood. There is intense sorrow in them.","They are using this method. Addiction to intoxicants. The young generation, from childhood itself: drugs, or alcohol, or smoking. Temporarily some kind of state arises. And that too because of chemical dependence. Through those chemicals a light feeling comes. It conceals the sorrow to some extent. It hides the pain, inside. This is very dangerous. How long can it be carried? Day by day the dependence, the intoxicant, destroys the body completely. It destroys the mental system as well. Clear thinking does not come. A criminal mind sets in. When the substance is not to be had, for the sake of money they start stealing. It has to be bought, and so everything that should not be done, every adharma, gets done.","The solution is one: meditation, and counselling with it. Meditation first — even if they are asked to sit, they cannot sit. Counselling has to be given. In them there is what is called a shame-wound. There is toxic shame. Healthy shame is one thing; toxic shame is another. To cover that toxic shame they habituate themselves to alcohol and drugs. Through counselling, awareness has to be brought about in them. What painful events are in the life — unable to tell anyone, they keep them inside. They swallow everything. Many do not even know how to express it, do not know how to say it. All of this is very useful. If counselling is done first, they become able to come into meditation.","Have they meditated? Have they caught hold? For these vices, meditation is called a good addiction. A good vice: every day turning inward. It corrects us in many ways. One by one we separate what is inside, and the Shakti corrects every fault that is in us. A meditation sadhaka cannot do adharma. Corruption, any of it — he cannot. That state, that Shakti in us, creates awareness. It creates the knowledge.","The second question is healing. Healing is possible, because great masters have that power. The power to heal is in everyone. But we should not heal. Why? Each person has, in themselves, the power and the capacity to heal themselves. There are exceptions to the rule. For a rule, ninety-nine percent: he should not heal. In the one percent, if this person is of use for the uplift of the world — if a guru sees that everything obstructing him can be taken out, that he will be of use, that if he lives another fifty years then through him a great good will come to crores of people — then the guru heals him. He is the right person. The lifespan is expanded, extended. In some specific circumstances and conditions, healing is done for some people. In general, self-healing is the right method. Everyone: we have to bring health to ourselves.","Through meditation, through knowledge, and through grasping this Shakti, three things come. When the mind becomes zero, the body recuperates. Psychosomatic diseases slowly leave, and stress goes. Then the cause has to be known: why this illness is there, which conflict brought it. That knowledge comes in meditation itself, in an altered state of consciousness, and that is what heals. When the eye of knowledge opens, the karma-vasanas and the conflicts are burnt to ash. Many find that even as the third eye is opening, the old troubles shatter — finished, the shop closed. If it has opened, the goal is as good as struck. Prarabdha karma and sanchita karma go. Swasthata, health, follows swasthiti, one’s own natural state. Know that state, and health comes.","So Anastasia: she has the capacity to heal, and healing is done. But a guru considers to whom it should be done. Suppose someone is healed, and afterwards he commits a hundred murders. We heal a person, and he goes and does a hundred murders, and many corruptions, many scandals. That papa we would be taking on. This is why, whoever comes to us, the first word is: dear one, do meditation. Attain awareness. Find out why this came in you. This illness, these diseases, are also indirect teachers — paroksha gurus. There is something you have to learn from that teacher. Therefore the illness came. Know what it is. If they do the sadhana, they will certainly attain it. Siddu garu asked a good question. Thank you."],"minutes":9,"words":936},{"title":"Sharings · Tithi and Tomorrow","paras":["Kalpana garu, and then Kavita garu, had raised a hand the day before. Through Jnanodayam a great change had happened in Kalpana. She attended Sampurna Mahila twice, the programme Harika madam conducted. Within a few months of meditation her arthritis reduced. Complaints about her mother-in-law, and about the other women of the house, loosened, and she came out of them. Only with her husband do quarrels remain. Small things trigger her. With everyone else she can understand and accept. Near him she feels her emotion is not understood, and shouting and crying follow. Later she goes into the room and meditates, and tells herself that this is his stage, that perhaps he is a man of knowledge who came for her sake. She sees it that way, and still cannot come out of the reaction. The burning stays: nirvana in the midst of samsara, Brahma-jnana, atmananda and Brahmananda, to teach and to share the self-knowledge she has, to balance household life and grow. That aspiration remains.","You have already overcome many things, Kalpana. The effort was made, the sadhana was done, and experiential knowledge came, which is why those earlier knots opened. The triggering around the husband will open too. If one sankalpa has been accomplished, the second is easy, and even a thousand can be. That confidence comes. One thing: regard the husband as a guru. The people who trigger us most are our gurus. There is a lesson of the soul in learning what has to be learned from them. The reaction is our experience, not theirs. It arose inside the ‘I’, and that has to be caught — why the trigger, why the loss of peace. Recognise what pain arises, and freedom from it is that awareness.","Those who praise us are never the gurus. Praise sticks us in one place. We swell, we go to cloud nine, and we fall under again. Those who trigger us are the real gurus, and with that feeling we can remain humble. Sadhana stays on. You are attending Jnanodayam even while doing pranayama, even from the car. Prasanna asked to share an experience, and was welcomed to do so when the time was there.","Kavita offered namaskarams to Sir, to Lakshmi madam, to the Quantum Life University sangha, and to everyone. Her son’s birthday had fallen the day before, which is why she had raised her hand. He was born on Mahanavami, and this year the 14th of October also came, so both would be kept. Someone had asked her whether the tithi or the calendar date was the one. The answer already given was that twice is even better, because that is what is done here.","Either way is ordinarily fine. Our roots are in India, not in a Western numerology that says the number of the birthday is the whole of it. That is very superficial. Dr. Newton was born on Kartika Purnima and celebrates that day with joy. It is the day he loves. For the world, the birth is the 24th of November — for Western countries, for the English reckoning. Here, the best is the tithi: the nakshatra, the lagna, the weekday, the day of birth. People born this way have a bonus of two birthdays. If enlightenment is attained, that day is a third birthday. We have been born anew. Good wishes to her son — a belated happy birthday. The time had reached 7:36. Tomorrow the others can share. We are in these Navaratri days in order to practise, and to learn the awakenings of sadhana. Thank you, friends. We meet again tomorrow morning at five."],"minutes":5,"words":603}];
const nav=document.getElementById('nav'),mobileNav=document.getElementById('mobile-nav'),columns=document.getElementById('columns');let chapter=0,spreadIndex=0,spreadCount=1;
function makeNav(root){chapters.forEach((c,i)=>{let li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+c.title+'<small>~'+c.minutes+' min read</small></span>';b.onclick=()=>{chapter=i;spreadIndex=0;render();document.getElementById('mobile-side').classList.remove('open')};li.append(b);root.append(li)})}makeNav(nav);makeNav(mobileNav);
function render(){let c=chapters[chapter];document.getElementById('heading').textContent=c.title;document.getElementById('time').textContent='~'+c.minutes+' min';columns.innerHTML='';let title=document.createElement('h2');title.className='section-title';title.textContent=c.title;columns.append(title);for(let p of c.paras){let el=document.createElement('p');el.textContent=p;columns.append(el)}document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i%chapters.length===chapter));requestAnimationFrame(()=>requestAnimationFrame(measure))}
function measure(){const width=columns.clientWidth;const one=window.matchMedia('(max-width:800px)').matches;const total=Math.max(width,columns.scrollWidth);spreadCount=Math.max(1,Math.ceil((total-2)/width));spreadIndex=Math.min(spreadIndex,spreadCount-1);columns.scrollLeft=spreadIndex*width;document.getElementById('position').textContent='Section '+(chapter+1)+' / '+chapters.length+' · '+(one?'Page ':'Spread ')+(spreadIndex+1)+' / '+spreadCount;document.getElementById('prev').disabled=chapter===0&&spreadIndex===0;document.getElementById('next').disabled=chapter===chapters.length-1&&spreadIndex===spreadCount-1}
function move(dir){if(dir===1){if(spreadIndex<spreadCount-1)spreadIndex++;else if(chapter<chapters.length-1){chapter++;spreadIndex=0;render();return}}else{if(spreadIndex>0)spreadIndex--;else if(chapter>0){chapter--;spreadIndex=9999;render();return}}measure()}
document.getElementById('next').onclick=()=>move(1);document.getElementById('prev').onclick=()=>move(-1);document.getElementById('font').onclick=()=>{document.body.classList.toggle('font-large');spreadIndex=0;requestAnimationFrame(measure)};document.getElementById('menu').onclick=()=>document.getElementById('mobile-side').classList.toggle('open');window.addEventListener('resize',()=>{spreadIndex=0;requestAnimationFrame(measure)});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});render();</script></body></html>
