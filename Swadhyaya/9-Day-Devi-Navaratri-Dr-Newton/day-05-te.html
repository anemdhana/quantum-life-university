</style></head><body><div class="app lang-te"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-04-te.html">Prev</a><a href="day-06-te.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">రెండు నవరాత్రులు · అహం · సర్వం · దేవీ నవరాత్రులు · Day 5</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">రెండు నవరాత్రులు · అహం · సర్వం</span></div><div class="tools"><span class="lang-switch"><a href="day-05-te.html" class="active">TE</a><a href="day-05-en.html">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-04-te.html">Prev</a><a href="day-06-te.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"ధ్యాన ప్రారంభం · సహస్రార పిరమిడ్","paras":["జ్ఞానోదయం కార్యక్రమంలో 500 65వ రోజుకి స్వాగతం నవరాత్రుల్లో ఐదవ రోజులో ఉన్నాం. అండ్ చక్కగా మనము క్వాంటం లైఫ్ యూనివర్సిటీ వ్యవస్థాపకులు డాక్టర్ న్యూటన్ కొండవీటి గారి నుంచి ఈ నవరాత్రుల జ్ఞానాన్ని తెలుసుకుంటున్నాం. దేవి అంటే తల్లి అంటే ఏంటి అండ్ మనం ఎలాగ సరెండర్ అవ్వాలి ఎన్నో విషయాలు ఎంతో చక్కని ప్రాక్టికల్స్ తో ప్రాసెసెస్ తో తెలుసుకుంటున్నాం. ఈరోజు కూడా మనము ఆ జ్ఞానాన్ని స్వీకరించే ముందు రోజు లాగానే ధ్యానంలో కూర్చుందాము. అందరము ఆనాపానా సిద్ధి ధ్యానానికి సిద్ధమైపోదాము.","చక్కగా సుఖాసనంలో కూర్చోండి కుర్చీలో అయినా కూర్చోవచ్చు కింద మటమ వేసుకొని కూర్చోవచ్చు కుర్చీలో కూర్చున్న వారి పాదాలు క్రాస్ చేసుకు ముందు నీళ్ళలో వేడి పెట్టుకొని అల రెండు మూసుకొని చక్కని ఒక చిరునవ్వుతూ శ్వాసని గమనిద్దాం. సహజంగా జరిగే ఉచ్వాస నిశ్వాసం ఏ మ్యాప్లో చేయనవసరం లేదు ఉన్నది ఉన్నట్లుగా గానించడమే మన పని be holding a నా ఎంతో పని లేదు ఆ ఇంకా సహజంగా జరిగే శ్వాస మీదనే ధ్యాస ఓం ఓం ఓం ఆ ఓం ఓం ఆమెన్ ఓ ఆ ఓం ఓం ఓం ఆ ఓం ఓం ఆ ఓం ఓం ఓం ఆ ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఆ ఓం ఓం ఓం ఓం మరి 20 నిమిషాలు ఈ ధ్యానాన్ని కొనసాగిద్దాం.","శ్వాసతో ఉందాం ఆ ఆ ఆ ఆ ఓం ఓం ఓం ఆ ఓం ఓం ఓం ఓం నీకరి 10 నిమిషాలు మన ధ్యాసని లోక కళ్యాణం వైపుకి తీసుకువెళ్దాం. మన శక్తిని అందరికీ ఉపయోగపడే సహస్రార పిరమిడ్ వైపు తీసుకోన ఈ ధ్యాన స్థితిలో దివ్య లోకం నుండి ఈ భూలోకం వైపుకి వస్తున్న ఒక శక్తి రూపమైన జ్ఞాన ఆలయం సహస్రారా పిరమిడ్ ని ఈ దివ్య నేత్రంతో చూడండి ఈ ప్రపంచంలో ఈ కాలంలో ఎంతగానో అవసరమైన శాంతి ఆత్మజ్ఞానం మైత్రి కరుణ ఇవన్నీ కూడా ఈసారి సహస్రార పిరమిడ్ ద్వారా ఈ భూమండలంపై ఎంతగానో అత్యున్నతంగా అందరిలో మేలుకొలుపుతూ ఉంటుంది.","ఈ ఒక్కరిలో ఉన్న ఆత్మజ్ఞానం మేల్కోవాలని సంకల్పంతో తీసుకోవచ్చే అద్భుతమైన పిరమిడ్ సహస్రారా పిరమిడ్ మనమంతా సామూహికంగా ఈ సంకల్పం చేసుకుందాం. ఈ సృష్టిలో ఈ సహసృష్టి కార్కలమ మనం కూడా భాగస్వాములమ అవుదాం. సహస్రారా పిరమిడ్ చుట్టూరా మనమంతా కూర్చున్నట్లుగా భావించండి. మనందరి సంకల్పంతో మనందరి సమిష్టి ఏకత్వ భావంతో ఈ సహస్రారా ఫిల్మెంట్ నిర్మాణం అత్యద్భుతంగా జరుగుతుంది. ఆ ఇతరాలలో ఎంతో మంది పిరమిడ్ మారా మారిన వారు తెలుసుకుంటూ ఉన్నారు ప్రపంచ నలమూలల నుండి ఇక్కడికి వచ్చి ధ్యాన సాధన చేసి ఆత్మజ్ఞానాన్ని పొందుతూ ఉన్నారు.","కొన్ని వందల సంవత్సరాల పాటు ఈ నిర్మాణం ఎంతో మందికి ఉపయోగపడుతూ ఉంది. ఇటువంటి మనమంతా భాగస్వాములు అవ్వడం మన అదృష్టం ఈ ఆనందంతో చక్కగా మనమంతా ఈ పిరమిడ్ అతి త్వరలో పూర్తి కావాలని సంకల్పిద్దాం సరైన విధంగా సరైన వ్యక్తులు వచ్చి అన్నీ రిసోర్సెస్ సమకూరి ఎంతో సునాయాసంగా అనున్నీ జరుగుతూ ఉన్నాయి. నవంబర్ 24 2027 2027 నవంబర్ 24వ తేదీన మనమంతా ఈ పిరమిడ్ లో కూర్చుని ధ్యానం చేసినట్టున్నాం.","చక్కగా ఇనాగరేట్ చేసుకొని డాక్టర్ న్యూటన్ గారు డాక్టర్ లక్ష్మి గారులతో సుందరాలు జరుపుకుంటున్నాం ఓం విశ్వమే సరైన విధానం ధంగా ఈ సృష్టిని జరిగేలాగా చేస్తుందనే నమ్మకంతో ఈ సంకల్పాన్ని విశ్వానికి విడుదల చేద్దాం. తిరిగి మీ ధ్యాసని శ్వాస మీదకి తీసుకురండి. ఈ ప్రస్తుత క్షణంలోకి వచ్చేద్దాం.","ఆఖరి రెండు నిమిషాలు శ్వాసతో ఉందాం గమనిస్తూ ఉందాం ఓం ఆ ఓం ఆ ఓం ఆ ఆ ఓం ఓం ఓం ఓం ఆ నెమ్మదిస్తూ ఉందాము ఎరుకుతూ ఉందాము ఓం ఓం ఓం ఎరుకతో ఉందా ఆఖరి ఒక్క నిమిషం ఫైవ్ సెకండ్లు 10 సెకండ్లు ఐదు నాలుగు మూడు రెండు ఒకటి సున్నా నెమ్మది నెమ్మదిగా మీ చేతులు రెండు కొద్ది క్షణాల పాటు కళ్ళ మీద ఉంచుకొని నెమ్మది నెమ్మదిగా ఒక చిరునవ్వుతూ నలు రెండు తెరుద్దాం. వెల్కమ్ బ్యాక్ ఎవ్రీవన్ మరొక్కసారి అందరికీ స్వాగతం. ఈరోజు మనం అప్పుడే ఐదవ రోజుకి వచ్చేసాం.","నవరాత్రుల్లో ఐదవ రోజు అండ్ మన సెలబ్రేషన్స్ క్యూఎల్యూ వ్యవస్థాపకులు బ్రహ్మశి చక్రవర్తి డాక్టర్ న్యూటన్ కొండవేటి గారు ప్రతిరోజు స్వయంగా వచ్చి మనకి ఈ జ్ఞానాన్ని అందిస్తూ ఉన్నారు. నిజమైన సెలబ్రేషన్స్ అంటే ఏంటో తెలియజేస్తూ ఉన్నారు. ఒక బ్యూటిఫుల్ వేలో రోజునే మనం ఆరంభించడము జీవితాన్ని జీవించడం గురించి మనం తెలుసుకుంటూ ఉన్నాము. ఇంకా ఎంతో జ్ఞానం ఆత్మజ్ఞానం గురించి మరి ఈరోజు కూడా అందరూ సిద్ధమే అయితే మీ కెమెరాస్ అన్ని ఆన్ చేసుకోండి అండ్ ఒక చిరునవ్వుతో మనమంతా డాక్టర్ న్యూటన్ గారిని స్వాగతిద్దాం.","థాంక్యూ సో మచ్ సర్ బీయింగ్ హియర్ టుడే ఓవర్ టు యు థాంక్యూ హారిక మేడం థాంక్యూ మై డియర్ ఫ్రెండ్స్ శుభోదయం జ్ఞానోదయం సో దేవీ నవరాత్రులు అనే ఈ పండగ సాధన కోసం ప్రత్యేకంగా ంగా మనం డెడికేట్ చేసుకుంటాం.","మనం రోజు ఎన్నో విషయాలు తెలుసుకుంటున్నాం ఈ పండగ గురించిన విశేషాల గురించి తెలుసుకుంటున్నాం ఆధ్యాత్మిక పరంగా సో రెండు సార్లు ఈ నవరాత్రులు వస్తాయి రామనవమి అప్పుడు వచ్చే నవరాత్రులు చైత్ర నవరాత్రులు ఇప్పుడు ఆశ్రయజ నవరాత్రులు ఈ మాసంలో సెప్టెంబర్ అక్టోబర్ అప్రాక్సిమేట్ గా ఈ టైంలో వచ్చే నవరాత్రులు వీటి రెండిటికీ కూడా చాలా ప్రత్యేకమైన స్థానం ఉంది భారతదేశంలో మనం ఎప్పుడైతే ఏప్రిల్లో చేసుకునే నవరాత్రులు శ్రీరామన నవమి సందర్భంగా ఆ టైంలో చేసుకునే నవరాత్రులు వాటి కథ ఒకటి చెప్పుకుంటూఉంటాం శ్రీరాములు వారు ఎలా విజయోత్సవాన్ని ఆ రావణ సంహారం అయిన తర్వాత ఎలా సెలబ్రేట్ చేసుకున్నారు ఆ దైవీ నవరాత్రుల్లో ఎలా పార్టిసిపేట్ చేశారు అనేది కూడా మనం చెప్పుకుంటుంటాం.","అది అహం బ్రహ్మాస్మి సాధన కోసంగా పెట్టబడిందంట. మన ఋషులు యోగులు అహం బ్రహ్మాస్మి అనే ఆ స్థితిని తెలుసుకోవడానికి ఆ నవరాత్రులు చైత్ర నవరాత్రులని మనం సెలబ్రేట్ చేసుకుంటాం. అప్పుడు సాధనలు చేస్తాం.","అంటే నేను ఏ దేవుడి కోసం వెతుకుతున్నాను ఏ బ్రహ్మ కోసం వెతుకుతున్నాను ఏ కృష్ణుడి కోసం వెతుకుతున్నాను ఏ విష్ణువు కోసం వెతుకుతున్నాను నేను దేనికోసం వెతుకుతున్నా అదే నేను అని తెలుసుకోవడం మొదటి మెట్టు అంట మరి ఈ చైత్ర ఈ ఆస్వయజ మాసంలో వచ్చేటటువంటి ఈ నవరాత్రులకి యొక్క ప్రత్యేకత ఏంటంటే సర్వం కల్విదం బ్రహ్మ అనే ఆ యొక్క జ్ఞానాన్ని అనుభవపూర్వకంగా తెలుసుకోవడానికే ఈ సాధన ఈ రెండు కూడా ఇంపార్టెంటే ఇవి ట్విన్ ఆస్పెక్ట్స్ అహం బ్రహ్మాస్మి అని మాత్రమే తెలుసుకుని ఉంటే మనలో ఒక ఆధ్యాత్మిక అహంకారం","కూడా రావచ్చు నేను దేవుని మిగతా వాళ్ళంతా రాక్షసులు మిగతా వాళ్ళంతా అజ్ఞానులు నేను జ్ఞాన స్వరూపుడిని మిగతా వాళ్ళంతా అజ్ఞానుల కింద చూస్తుంటాం సో అది సరిపోదు అది జ్ఞానం కాదు ఆ శుద్ధ జ్ఞానం కాదు సర్వం కల్విదం బ్రహ్మ నేను ఎలానో అందరూ అలానే నేను పొందిన దుఃఖం అందరూ పొందుతున్నారు.","నాలాగే ముక్తి మోక్షము ఎన్లైటన్మెంట్ జ్ఞానోదయము ఇవన్నీ కావాలని అందరూ కూడా తప్పిస్తున్నారు. దుఃఖ రాహిత్యం పొందాలని అందరూ కోరుకుంటున్నారు. నాలో ఉన్న దివ్యత్వమే అందరిలో ఉంది. ఈ ప్రకృతి మనం చూసే ప్రకృతి అంతా కూడా పరమాత్మతో నిండి ఉంది. లేకపోతే పరమాత్మ ఈ ప్రకృతి వేరు పరమాత్మ వేరు అనే భావన మనకు ఉంటుంది. ఇప్పుడు ఎన్నో విధ్వంసాలు చేస్తుంటాం ప్రకృతి పట్ల ప్రకృతిని నాశనం చేస్తున్నాడు మనిషి తన ఫలాభాల కోసం చెట్లను నరికేస్తుంటాడు అరణ్యాలు అడవులు నశించిపోయాయి కొండలు తవ్వేసేసి గనుల కోసం కొండల్ని తవ్వేస్తుంటాడు.","వాడు బంగారం కావాలి వజ్రాలు కావాలి లేకపోతే రాగి కావాలి ఎన్నెన్నో వీటి కోసం అని కొండల్ని తవ్వేస్తుంటాడు మనిషి విద్వంసం ప్రకృతిని నాశనం చేస్తున్నాడు స్వలాభాల కోసం నదుల జలాలు కల్షితం చేసేస్తున్నాడు.","ఎందుకంటే ఒకటే ఒక పాయింట్ ఇక్కడ సర్వం కలియుగం బ్రహ్మ అనే స్థితి తెలియదు కాబట్టి జ్ఞానం లేదు ఈ ప్రకృతే పరమాత్మ ఈ వృక్షాలే దేవుళ్ళు ఆ కొండ దేవుడే రాయి రప్పలు అనుకుంటున్న అవన్నీ దేవతా స్వరూపాలే సర్వం కల్విదం బ్రహ్మ మనం చూసే సర్వం అంతా కూడా ఆ పరమాత్మ తత్వం నిండి ఉంది ఆ భగవంతుడు ఎక్కడా లేడు అంతా నిండి ఉన్నాడంట అణు అణువులోనూ పరమాణువులోనూ ఎక్కడ చూసినా ఆయనే అంట మరి ఆ కథలు కూడా మనం పౌరాణిక కథలు విన్నాం ప్రహ్లాదుని అడిగినటువంటి ప్రశ్న వారి తండ్రి గారు ఎన్విషకుడు మీ విష్ణువు మీ నారాయణుడు","ఎక్కడున్నాడు అంటే అంతటా ఉన్నాడు అన్నాడు అణువులో ఉన్నాడు కణంలో ఉన్నాడు ఎక్కడ చూసినా ఆయనే ఉన్నాడు అని చెప్పారు సర్వం కల్విదం బ్రహ్మ ప్రహ్లాద స్థితి సర్వం కల్విదం బ్రహ్మ అహం బ్రహ్మస్మితి స్థితి ఆల్రెడీ పొంది సర్వం కల్విదం బ్రహ్మ అనే స్థితిని కూడా పొందినటువంటి మాస్టర్ ఆయన ప్రహ్లాదుడు ఈ దేవీ నవరాత్రులు మనం ఏదైతే చేసుకుంటున్నామో ఇది సర్వం కల్విదం బ్రహ్మ ఈ సాధన కోసంగా ా మనం చేసుకుంటున్నది.","ఈ ప్రకృతి అంతా కూడా ప్రకృతిలో భాగమైనటువంటి అన్ని కింగ్డమ్స్ కూడా అన్ని సామ్రాజ్యాలు ఖనిజ సామ్రాజ్యము వృక్ష సామ్రాజ్యము జంతు సామ్రాజ్యము మానవ సామ్రాజ్యము దేవ సామ్రాజ్యము యక్ష సామ్రాజ్యం కిన్నెర సామ్రాజ్యం గాంధర్వ సామ్రాజ్యాలు ఏమఉన్నాయో ఏంజలిక్ కింగ్డం అన్నీ కూడా ఈ ప్రకృతిలో భాగమే ఈ ప్రకృతి అంతా కూడా ఆ దివ్యత్వంతో నిండి ఉంది ప్రకాశిస్తుంది. ఈ సర్వం కల్విదం బ్రహ్మ అనే సాధన చాలా ప్రత్యేకమైనటువంటి ఈ సాధనల్ని ప్రిస్క్రైబ్ చేశారు.","యోగులు ఋషులు ఊరికే పెట్టలేదు ఈ స్టోరీస్ కూడా ఏ కథలైతే మనం నిన్న కూడా చెప్పుకున్నామో ఈరోజు కొన్ని పౌరాణిక కథల గురించి చెప్పుకుంటున్నాము మహిషాశురుడిని వధించడం సంహరించడం దాని గురించి మనం మాట్లాడుకుంటున్నాము ఈ కథల వెనకాల ఒక అంతరార్థం ఉంది గూడార్థం ఉంది వాడిని తెలుసుకోవాలి కచ్చితంగా సో నిన్న రంబుడు గురించి కరంబుడు గురించి మనం తెలుసుకున్నాం. రంబుడు ఐహిక వాంఛలు ఇహ పర రెండు ఉన్నాయన్నమాట. ఇహం అంటే ఇక్కడ ఈ భూమండలం ఇక్కడ కొన్ని ఉంటాయి మనకి కోరికలు ఉంటాయి. కొన్ని ఇచ్చలు ఉంటాయి. ఇది కావాలి అది కావాలి ఇవన్నీ ఉంటాయి.","పర అంటే మనకు కనిపించినటువంటిది వాటి పట్ట కూడా మనకు కోరిక ఉంటది. అది తెలుసుకోవాలి నాకు ఈ కంటి ద్వారా చూడని నేను చూడాలి అని అనుకుంటాం. ఈ చెవుల ద్వారా వినపడని నేను వినాలి అనుకుంటాను. ఇవన్నీ కూడా రెండు కోరికలు ఒక జీవుడిలో ఉంటాయి. జీవుడిలో రంబుడు ఉన్నాడు కరంబుడు కూడా ఉన్నాడు. రంబుడు ఏం చేస్తాడు అంటే ఈ మెటీరియల్ సంసార సంబంధించినటువంటి కోరికల్ని మనలో వచ్చేట్లు చేస్తాడు. ఉంటాయి అందరికీ ఉంటాయి. ఈ భూమండంలో ఈ ఫిజికల్ బాడీ తీసుకున్న తర్వాత దీంతో పాటు పంచజ్ఞానేంద్రియాల ద్వారా ఈ మనసు ద్వారా అన్ని కోరికలు జన్మ తీసుకుంటాయి. ఎన్నో కోరికలు ఉంటాయి.","కానీ రంబుడికి కూడా ఆ కోరికలు ఉన్నప్పటికీ సంసారంలో ఈ కోరికలు ఉన్నప్పటికీ అవి ఇవి తాత్కాలికమ డబ్బుల మీద ఆశ ఉంటుంది బాగా బాగా డబ్బులు సంపాదించాలి ఇంకా దానికోసమే ఇప్పుడు 24 గంటలు డబ్బు తప్పనే సాధన లేదు వేరేది లేదు డబ్బు డబ్బు గురించి ధ్యానం చేస్తున్నారు."],"minutes":8,"words":1229},{"title":"రెండు నవరాత్రులు · రంభ · కరంభ","paras":["మనిషి డబ్బు డబ్బు డబ్బు డబ్బు డబ్బు ఉద్యోగం ఉద్యోగం ఉద్యోగం ఉద్యోగం లేకపోతే ఇది ఈ కోరికలు అది రంబుడు స్థితి ఉన్నప్పటికీ ఎక్కడో ఉంది ఒక హోసాన నేను ఏది తెలుసుకోవాలో అది తెలుసుకోవాలి ఏ జ్ఞానం పొందాలో తెలియనటువంటి అవిధిత యదార్థం గురించి తెలుసుకోవాలి ఇది కాదు ఇది నాకు తెలుసు ఇదంతా మాయా ప్రపంచం అని తెలిసి కూడా అక్కడే ఎరుకని ఉంటాడు. నిన్న చెప్పుకున్నాం రమ్ముడిని ఆ ఇంద్రుడు మనసు అంటేనే ఇంద్రుడు ఆ ఇంద్రుడు ముసలి రూపంలో వచ్చి పట్టుకొని సంహరించేసాడు.","ఆ ముసలి పట్టుకొని లాగుతుంటుందంట మనల్ని ఇక్కడ ఈ వీటిని సప్రెస్ చేశమా ఒకవేళ ఆ రమ్ముడు యొక్క కోరికలు రమ్ముడు అంటే మనలో ఉన్న జీవాత్మలో ఉన్నటువంటి ఈ సంసారపరంగా ఉండే కోరికలు ఆ కోరికలన్నీ కూడా మనం ఒకవేళ సప్రెస్ చేశమ అనుకోండి తీవ్రంగా దాన్ని అణచి తొక్కి పెట్టేసామ అంటే ఎప్పుడోకప్పుడు మళ్లా బయటకి వస్తాయి.","అందుకే సాధకుడు కరంబుడు స్థితి ఏంటంటే ఇన్నీ ఉంటాయి కానీ పంచాజ్ఞల మధ్యన సాధన చేశాడని చెప్పుకున్నాం పంచాజ్ఞలు అంటే పంచజ్ఞానేంద్రియాల మధ్యన ప్రకృతిలో అది కూడా వటవృక్షం అంటే ప్రకృతి ప్రకృతిలో ఉన్నటువంటి ఆ పరమాత్మ తత్వమే అంటే సర్వం కల్వినం బ్రహ్మ అనే సాధన ఆయన ఆల్రెడీ ఒక బీజ రూపంలో స్టార్ట్ చేశాడు. నేను మోక్ష జ్ఞానాన్ని పొందాలి ఎన్లైటన్మెంట్ పొందాలి ఏ జ్ఞానం పొందితే ఇంకా వేరే జ్ఞానాలు ఏవి అవసరం లేదో ఆ జ్ఞానాన్ని నేను పొందాలని ధ్యాన సాధన స్టార్ట్ చేశాడు.","కరంబుడు తీవ్రమైనటువంటి ఆ సంకల్పం ఉంది కోరిక ఉంది మోక్షాన్ని పొందాలి ముక్తిని పొందాలి వీటి నుంచి జనమరణ చక్రాలని దాటాలి ఎందుకంటే నిన్న కథలో చెప్పుకున్నాం వీళ్ళద్దరు కూడా సంతానం కోసం అని పుత్ర లాభం కోసం ధ్యానం చేశారు పుత్ర లాభం కోసం తపస్సు చేశారు అని చెప్పుకున్నాం. పుత్ర లాభం అంటేనే నేను ఆ పదం గురించి చెప్తున్నాం అంటే మనం ఈ జనమరణ చక్రాలని దాటడమే దాన్ని దాటాలి కచ్చితంగా సో కరంబుడు రంబుడు ఇద్దరు కూడా మనలో ఉన్నారు.","వాళ్ళఇద్దరు కూడా అసురులే ఎందుకు అసుర గుణము అంటేనే ఇక్కడ ప్రకృతికి సంబంధించినటువంటి త్రిగుణాలలో మెయిన్ గా ప్రధానమైనటువంటిది తామసిక గుణము మనల్ని ఇక్కడ బైండ్ చేస  లేదు ఏది తీసుకెళ్ళు సో ఇది సాధకుల్లో ఆ యొక్క ఒక స్థితిలో వాళ్ళు ఇది రియలైజ్ అవుతారు అప్పుడు రమ్ముడు వెళ్ళిపోతాడు కరముడు ఇంకొంచెం జాగ్రత్తగా సాధన","చేసుకుంటాడు ఇరుక్కోకూడదు ఈ జనమరణ చక్రాలు ఇరుక్కో ోకూడదు దీన్ని దాటాలి ఆ సాధనే ఇక్కడ కరంబుడు చేశారని మనం విన్నాం కరంబుడు చేసిన ఈ సాధన ద్వారా పంచాజ్ఞల మధ్యన తన శిరస్సుని ఖండించి ఇచ్చేసాడు అగ్నిదేవుడికి శిరస్సుని ఖండించడం అంటే తనలో ఉన్న అంతా సమర్పించేసాడు కోరికలన్నీ కూడా బ్రహ్ముడిని గురించి కొంత అలర్ట్ అయ్యాడు బ్రహ్ముడు ఇలా సంహరించబడ్డాడు తన కోరికల ద్వారా ఇరుక్కున్నాడు ముసలి సంహరించేసింది కొంత బాధ కలిగింది తన సాధన ఆగిపోతుంది ఆగిపోయింది తర్వాత మళ్లా ప్రారంభించాడు కరంబుడు కంటిన్యూ","చేశరు వాళ్ళ అన్నదమ్ములు అంటే జీవాత్మలో రెండు ఉన్నాయి రెండు సహోదరులు రంబుడు కరంబుడు మనలో ఉన్న స్థితులు కంబ స్థితిని కరంబ స్థితి కరంబ స్థితిని మహిష స్థితి ఇన్ని స్థితులు సో సో కరంబుడు సాధన చేసుకుంటూ ఉన్నాడు తన తల వచ్చిన తర్వాత తన శిరస్సును ఖండించి అగ్నిదేవుడికి ఇస్తే అగ్నిదేవుడు వరం కొరకో అంటే నేను ఆ యొక్క జన మరణ చక్రాలను దాటాలనే కోరిక కోరాడు ఏమని కోరాడు కథలో ఏం చెప్పబడింది పుత్రుడు కావాలి మహాబలుడైనటువంటి అజయుడైనటువంటి కొడుకు కావాలి పుత్రుడు కావాలని కోరుకున్నాడు కథ ఆ విధంగా"],"minutes":9,"words":1262},{"title":"సంకేత కథలు · పుత్రకామేష్టి","paras":["చెప్పింది మనం మిస్అండర్స్టాండ్ చేసుకుంటే ఓన్లీ సన్ కోసం మనం ప్రయత్నం చేస్తుంటారు అందరూ కూడా ఇప్పుడు పెళ్లి అవ్వంగానే అందరూ ఇదే ప్రశ్న అన్నమాట మీ పిల్లలు ఎప్పుడు మీ పిల్లలు ఎప్పుడు అనుకుంటున్నారు మీ పిల్లలు ఎప్పుడు అనుకుంటున్నారు పిల్లలు పుట్టిన తర్వాత ఆడబిడ్డ ఇంకా ఆడబిడ్డ డిసపాయింట్ అవుతుంటారు మగబిడ్డ ఇంకొక మగబిడ్డ కావాలి ఇంకొక మగబిడ్డ కావాలి సో ఇది సంకేత రూపం అనేది మనం తెలుసుకోవాల.","మన భారతదేశంలో ఉన్న ప్రతి పౌరాణిక కథ కూడా ఒక సంకేత రూపంలో రాయబడింది. ఒక గ్రేట్ విస్డం ప్రెజెంట్ చేశారు యోగులు ఇది పున్నామ నరకం నుంచి తప్పించడం అనే సాధన కరంబుడు చేస్తున్నాడు. ఆ విత్తనం నాటబడింది కరంబుడిలో తీవ్రమైన సాధన చేశాడు.","సో అగ్నిదేవుడు చెప్పాడు నీకు ఎవరు కనిపిస్తారో ముందు నీ మనసు ఎవరితో తగులుకుంటుందో వారి ద్వారా నీకు పుత్రుడు కలుగుతారు అన్నాడు ఆయన కళ్ళు తెరిచాడు చూసాడు చూస్తే ప్రకృతి కనిపించింది ప్రకృతి కాదు కథలో ఏం చెప్పాడు అంటే మహిషి కనిపించింది మహిషి అంటే గేద మహి అంటే భూసంబంధమైన నా ప్రకృతికి సంబంధమైన ఈ ప్రకృతిలో ఉన్నది ఆ పరమాత్మ తత్వమే అంటే సర్వం కల్విదం బ్రహ్మ అనే సాధన మహిషికి అనిపించింది ఫస్ట్ మహిషితో రమించాడు అని చెప్తారు కామించాడు తనతో కలిసాడు అంటే ఆ ప్రకృతితో తాదాత్మం చెందాడు అని","ఇక్కడ తీసుకోవాలి అంతరార్థం ఇదంతా కూడా అంటే ఇది ఓ సాధన పరంగా యోగ రహస్యాన్ని అని చెప్పారు ఇక్కడ వేదవ్యాసుల వారు సో ఆయన మహిషి తో సంగమించిన తర్వాత గర్భవతి అయింది అంతలోకి గర్భవతి అవ్వడం అంటేనే తనలో ఒక జ్ఞానం పండడం ఒక చక్కని కాయ పండు అవ్వడం అన్నమాట పండంటి బిడ్డ కలగడం అనే స్థితి వస్తుంది ఎవరు ఎవరు సాధన చేసినా కూడా సో కరంబుడు మరి ఆ టైంలో చూస్తున్నప్పుడే ఇంకొక మహిషుడు కామోద్రేకుడై అటాక్ చేస్తాడు ఆ అటాక్ చేయడం అంటే బలవత్కరంగా ఈ మహిషిని మీద వచ్చి పడతాడు.","ఇది వైలేషన్ అంటే ఇది కూడా మనం అంతరార్థపరంగా తీసుకోవాలి. సూక్ష్మార్థం ఉంది ఇక్కడ అంటే ఎన్నో విఘ్నాలు వస్తాయి మనం ధ్యాన సాధన చేసేటప్పుడు కూడా మనకి ఎన్నో విఘ్నాలు వస్తాయి ఇది విఘ్నము అంటే ఎక్కడో లోపల ఎక్కడో రెసిడ్యువల్ గా మిగిలినటువంటి ఏదో ఒకటి బయటక వచ్చింది అది విఘ్నంగా అంతరాయం కలిగించబోయింది. ఆ మహిషిని ఆ సాధ సాధనకి విఘ్నం కలగబోయింది. అప్పుడు ఏం చెప్పబడింది అంటే ఈ సాధకుడైనటువంటి కదంబుడు ఆ దున్నపోతుతో ఆ మహిష్యుడితో ఆ ఆ ఎవరైతే దున్నపోతున్నాడో వాడితో యుద్ధం చేశాడు కానీ కరంబుడు సంహరించబడ్డాడు.","మహిషిని మాత్రం ఆ సాధనను మాత్రం యక్షులు రక్షించారని చెప్పబడింది కథలో అంటే యక్షులు అంటేనే మన జ్ఞాన అదృశ్యంగా ఉన్న జ్ఞాన శక్తి అంట అందులో అది ఎప్పుడూ కూడా సాధనని ఎప్పుడూ జరిగేట్టుగా భేదరూపంలో ఉంచుతూ సూక్ష్మంగా ఉంచుతూ అది నశింపుకోకుండా ఉండేట్లు జాగ్రత్తగా చూస్తూఉంటుంది. ఈ కథలో ఎన్నో చక్కని విషయాలు ఈ యోగ రహస్యాల గురించి చెప్పబడ్డాయి.","తర్వాత కరంబుడిని ఆ చితి మీద పెట్టి దహన క్రియలు చేసేటప్పుడు అప్పుడు మహిషి గర్భంలో నుంచి మహిషాసురుడు ఉద్భవం జరిగింది మహిషాసురుడు జన్మ తీసుకున్నాడు అంటే కరంబుడు స్థితి నుంచి మహిషాసుర స్థితికి వెళ్ళాడు అంటే కరంబుడు సాధన చేశాడు బీజ రూపంలో ఉంది సాధన అదేం పరిపక్వత చెందలేదు ఇంకా ఫుల్గా రాలేదు సాధన అంటే సర్వం కల్విదం బ్రహ్మ అనే సాధన స్టార్ట్ చేసుకున్నాడు ఆ స్థితిని పొందడానికి ప్రయత్నం చేస్తున్నాడు సాధన చేస్తున్నాడు అది ఇంకా బీజ రూపంలో ఉంది. తర్వాత నెక్స్ట్ స్టేట్ కి వెళ్ళాడు మహిషాసురుడు ఉద్ధవం జరిగింది.","తర్వాత ఈ కథలోనే ఏం చెప్పబడింది అంటే ఈయన కరంబుడు రక్తబీజుడుగా మళ్లా ఆ చిత్తునుంటి బయటిక వచ్చారు. సో వేదవ్యాసుల వారు ఈ కథలో ఎన్నో అంతరార్థాలని చొప్పించి ఎన్నో యోగ రహస్యాలని పెట్టారు ఇక్కడ అంతా కూడా ధ్యాన రహస్యాలు ఇవన్నీ ఇవన్నీ మనకి ఆ కీస్ ఉండాలన్నమాట తాళం చెవితో ఓపెన్ చేసుకోవచ్చు ఒక్కొకటి లేకపోతే మనకి తెలియదు బాహ్యర్థం మాత్రమే తీసుకుంటాం.","సో ఇన్నీ ధ్యానం కోసం చెప్పినవి లేకపోతే మనము చాలామంది అవహేలన చేస్తుంటారు ఏ ఫార్మనర్స్ ఫిరంగి వాళ్ళు ఫిరంగలు అంటే మన భారతదేశాన్ని బానిసలుగా చేసి పాశ్చాత్యులు వాళ్ళంతా ఫిరంగలు వాళ్ళకి ఏమి తెలియదు వాళ్ళంతా నవ్వుతుంటారు మన కల్చర్ గాని మన చక్కని సంస్కృతి మన భారతదేశంలోని విజ్ఞాన శాస్త్రం మన ఆధ్యాత్మిక శాస్త్రం నుంచి నవ్వుకుంటారు వాళ్ళు ఈ కథలు ఓ వీళ్ళు ఆ ఒక బీస్ట్ తో కూడా వాళ్ళు దే హావ్ దిస్ కైండ్ ఆఫ్ సెక్షువల్ ఎన్కౌంటర్స్ అని చెప్పేసి వాళ్ళకి అర్థం కాదు ఇవన్నీ అంతరార్థ సహితంగా తెలుసుకోవాలి.","లేకపోతే ఈ సాధకుడు మరి సంగమించడం ఏంటి ఒక మహిషతో ఒక గేదతో దాంతో మహిషాసురుడు దున్నపోతులాగా ఉన్నటువంటి ఒక అసురుడు పుట్టడం ఏంటి ఇవన్నీ కూడా చాలా చోద్యంగా అనిపిస్తాయి.","వాళ్ళు నవ్వుతూ ఉంటారు చాలా మంది తెలియని వాళ్ళు మన భారతదేశం యొక్క గొప్పతనం ఏంటంటే ఇవన్నీ కూడా అంతరార్థ సహితంగా ఉన్నవి వేదవ్యాసుల వారు ఊరికే రాయలేదు ఇవన్నీ ఆయన గ్రేటెస్ట్ గ్రాండెస్ట్ మాస్టర్ వేదాల్ని ఉపనిషత్తుని అన్నీ కూడా క్లాసిఫై చేసి అందరికీ ఇప్పటికి మనకి అందుబాటులో ఉన్నాయి అంటే ఆయన కాంట్రిబ్యూషన్ అది సాక్షాత్ విష్ణు భగవాన్ స్వరూపం ఆయన వేదవ్యాసుల వారు ప్రతి కథ వెనుక ఒక అంతరార్థం ఉంది. సో ఇప్పుడు మహిషాశురుడు ఉద్భవం జరిగింది. సో మహిషాశురుడు అసురుడు అని తెలుసు అసు అనే పదం ఫస్ట్ తెలుసుకోవాలి.","అసుర అసుర అస్వర పస్వర ఇంకొకటి నస్వర నశించేది అని నాశనం చేసేది ఏదైతే మంచిది కాదో నాశనం చేసింది ఉంటుందో అది అసుర అన్నమాట అంటే ఎప్పుడు సాధనలని నాశనం చేస్తుంటది ఎవరు సాధకుడు ఉన్నా కూడా ఈ అసురులు వచ్చి రాక్షసులు వచ్చి వాళ్ళ వాళ్ళని డిస్టర్బ్ చేస్తుంటారు ధ్యానుల్ని యోగుల్ని యజ్ఞ హోమాల్ని పైనుంచి ఆ రక్తాన్ని పోయడము వాళ్ళు చాలా డిస్టర్బ్ చేస్తుంటారు ఇవన్నీ కూడా మనం ఆ చదువుతుంటాం కథల్లో అంటే అసురము అంటే అసుర అంటేనే ఏ దుర్గుణాలైతే మనిషిలో ఉన్నాయో అవన్నీ కూడా సాధనకు అంతరాయం","కలిగిస్తున్నాయో అదంతా అసురమే అసుర గుణాలే అందుకే అసురులు ఎక్కడో లేరు మనలోనే ఉన్నారు మనలో ఉన్న గుణాలే తమోగుణము రజోగుణానికి సంబంధించినవే అసుర గుణాలు ఎక్కడో లేరు ఇవన్నీ మన ఆస్పెక్ట్స్ే మనలోనే రమ్ముడు ఉన్నాడు కరముడు ఉన్నాడు మహిషాశురుడు ఉన్నాడు మరి ఆ శంబుడు ఉన్నాడు నిసంబుడు ఉన్నాడు వృత్తాశరుడు ఉన్నాడు రక్తబీజుడు ఉన్నాడు అందరూ రావణాసురులు అందరూ రాష్ట్రలంద మనలో ఉన్నారన్నమాట దుర్గుణాలే మనలో ఉన్న తమోగుణ రజోగుణ సంబంధించినటువంటి ఇవే మనలో ఆ గొప్ప దేవగుణం కూడా ఉంది దైవిక గుణం దివ్యత్వం","ఉంది దాన్ని ఇది సంహారం చేసేస్తుందట ఈ యొక్క రాక్షసులు సంహారం చేసుకుంది.","సాధకులు దీన్ని సాధించగలుగుతారు. తనలో ఉన్న ఆ దేవీ శక్తిని ప్రసన్నం చేసుకుంటారు దేవీ శక్తితో తాదామ్యం ఏకత్వం చెందుతారు ఆ దేవీ శక్తిని తెలుసుకుంటారు ఆ దేవీ శక్తి ఈన్నిటిని కూడా సంహరించేస్తుంది. ఈ తొమ్మిది రోజులు మనం చేసేది ఇదే ఈ సాధన ఏదైతే చేస్తున్నామో మనలో ఉన్నటువంటి ఏ కొసాన ఉన్నటువంటి ఆ రాక్షస గుణాలు ఏదైతే ఉన్నాయో అసురులు ఉన్నారో మనలో ఒక్కొక్కటి ఎలిమినేట్ చేస్తూ ఉంటుంది.","ఆ దేవతా శక్తి ఆ శ్రీదేవి కాదు శ్రీదేవి శక్తి సో మహిషాసురుడు మరి ఏం చేశాడు ఆయన ఉద్భవం అయింది ఇంద్రుని మీద యుద్ధాన్ని ప్రకటించాడు ఫైటింగ్ చేశాడు యుద్ధం చేశాడు దేవగణాల్ని మొత్తం దేవతలందరినీ భయభ్రాంతులకు గురి చేశాడు వాళ్ళంతా త్రిమూర్తులక వెళ్లి విన్నపించుకున్నారు ఇలా చేస్తున్నాడు ఇలా చేస్తున్నాడు విష్ణువు గరుత్మంతుడి మీద వచ్చాడు గరుత్మంతుడు కూడా ఆ ఒక్క ఇట్లా పొడగే ఆ గరుత్మంతుడు కూడా పక్కన పడిపోయాడు విష్ణుమూర్తిని తీసుకొని మళ్లా పలాయనం చేశాడు అని రాయబడింది కథలో అంటే మీనింగ్","తెలుసుకోవాలి ఇది కూడా గరుత్మంటుడు అంటేనే ఈ వేదజ్ఞానానికి ఉపనిషత్ జ్ఞానానికి సంకేత రూపం వేదజ్ఞానానికి సంకేత రూపం ఆ వేదజ్ఞానం కూడా సాధనలో పనికి రాదు సాధన సాధన పరోక్ష జ్ఞానం ఎప్పుడు పనికి రాదు అంటే ఒట్టి థియరీ మనం నేర్చుకుంటాం వేదాలన్నీ చదువుతాం ఏమి సున్నా జీరో మార్క్స్ మనకి థియరీ బాగా తెలుసుకుంటాం కానీ ప్రాక్టీస్ ప్రాక్టీస్ అందుకే రిచువల్స్ సెరిమోనీస్ ఇవన్నీ బాగుంటాయి అంతరార్థ సహజం తెలుసుకోవాల చేయడంలో తప్పేం లేదు కానీ అక్కడ స్టక్ అయిపోతారు చాలామంది అందుకే గృహత్మంతుడిని కూడా","కొట్టాడు పడిపోయాడు అని చెప్పి చెప్పబడింది ఇంద్రుని గెలిచాడు ఇంద్రుని జయించాడు ఇంద్రలోకాన్ని పరిపాలిస్తున్నాడు.","అప్పుడు వాళ్ళంతా వెళ్లి మొరపెట్టుకున్నారు అందరూ కలిసి ఒక కాంగ్రిగేషన్ ఒక మీటింగ్ జరుపుకున్నారు అన్ని లోకాల్లో అందరూ కలిసి ఒక దగ్గరికి వచ్చారు విష్ణుమూర్తి లీడర్ గా అందరికీ లీడ్ చేస్తూ విష్ణుమూర్తి గారు చెప్పారు ఈ మహిషాశురుడి యొక్క మరణ రహస్యం గురించి అందరికీ చెప్పాడుఅన్నమాట ఎవరి పాపం అందరికీ తెలియదు స్త్రీమూర్తితో తప్పితే ఎవరి ద్వారా మరణం రాదు ఈ మహిషాశురుడికి అందుకే ఒక స్త్రీ మూర్తి కావాలి సో అన్ని అంశలతో ఉన్నటువంటి స్త్రీమూర్తి ఆవిర్భావం జరిగింది.","అక్కడ లక్ష్మీదేవి మహాలక్ష్మి నుంచి ఆ అంశ వచ్చింది ఆ శక్తి యాడ్ అయింది దుర్గామాత నుంచి తర్వాత సరస్వతీ మాత నుంచి ఎంతో మంది అక్కడున్న దేవతల నుంచి అన్ని శక్తులన్నీ ఆమెక వచ్చాయి ఆమె అష్టాదశ భుజాలతో ఒక శక్తి సూరపునిగా ఉద్భవించింది.","ఈ విషయం మహిషాశురుడు తెలుసుకున్నాడు నన్ను సంహరించడానికి ఉద్భవం చెందింది ఆవిర్భవించింది ఈ దేవతా శక్తి కానీ అందరూ చెప్పుకున్నారు ఆమ అందచందాల గురించి చెప్పుకుంటున్నారు చాలా అందంగా ఉంటుందని సో వెంటనే మోహంలో పడిపోయాడు రాయిభారం పంపాడు తన దగ్గర ఉన్న ఆరుగురు రాక్షసుల్ని పంపాడంట ఇవన్నీ చాలా జాగ్రత్తగా మనం తెలుసుకోవాలి ఎందుకంటే ఇవన్నీ యోగ రహస్యాలు ఎంత గొప్పగా వేదవ్యాసుల వారు మనకి చెప్పారో మనం తెలుసుకోవచ్చు ఇక్కడ ఈ రాక్షస రాయభారాలు అంటే ఏంటి ఆరుగురిని రాక్షసులని పంపించడం అంటే ఏంటి ఎందుకు"],"minutes":8,"words":1104},{"title":"అరిషడ్వర్గాలు · ఆరు రాయభారులు","paras":["ఆరుగురినే పంపించాడు ఒకళళని పంపించొచ్చు మామూలుగా రాయభారం పంపిస్తే ఒకళళనో ఇద్దటో పంపిస్తారు ఒకళళని పంపిస్తారు మామూలుగా రాయభారం ఆరుగురిని పంపించాడంట సో ఇవన్నీ అరిషడ్ వార్గాలకి ప్రతీకగా మనం తీసుకోవాలి ఈ ఆరు ఆరుగురు రాక్షసుల పేర్లు కూడా చాలా ఆ తమాషాగా ఉంటాయి భాష్పలుడు అనే ఒక రాక్షసుడు ఉన్నాడు దుర్ముఖుడు అంట ఇంకొక పేరు తామ్రముడు చుచ్చురుడు అసిలోనుముడు ఈ పేర్లు తమాషగా ఉన్నాయి బిడాలుడు విచిత్రమైన పేర్లు ఇవన్నీ అంతరార్థ సహితంగా తెలుసుకుంటే చాలా విషయాలు మనకు బోధపడతాయి భాష్పలుడు దానిలో","భాష్మం అంటే అంటే కన్నీరు భాష్పం లాతి గృహనాతి కన్నీటిని దుఃఖాన్ని కలుగచేసే కోరికలు కన్నీటిని కలుగచేసే కోరికలు దుఃఖం కూడా కలుగుతుంది.","కోరిక తీరలేదా దుఃఖం వస్తుంది. అంటే ఏంటంటే కామము అరిషడ్ వర్గాల్లో కామ క్రోధ లోభ మోహ మద మాత్సర్యాలు మన సాధనలో వచ్చే ప్రధానమైనటువం రు కొంతమంది మాత్సర్యము ఇది అవేష ద్వారాగాలు ఇవన్నీ సటిల్ గా ఉంటాయి","తెలియకుండా ఉంటాయి మన అంతర శత్రువులు అంటారు వీన్ని శత్రువులు ఎక్కడా లేరు బాహ్యంలో లేరు మన అంతర శత్రువులే అందుకే వేదవ్యాసుల వారు ఈ కథలో లో ఇది చెప్పారు ఆ మహిషాసురుడు రాయిభారానికి అంటే ఆ దేవీ శక్తి అంటేనే ఆ యొక్క ప్రకృతి సంబంధమైన సర్వం కల్విదం బ్రహ్మ ఆ దేవతా శక్తి ఎవరో కాదు ఈ ప్రకృతి మాత ఆ పరమాత్మ తత్వం అంతా ఈ ప్రకృతి మాత ద్వారా ఇక్కడ సృష్టి మొత్తం అంతా వ్యాపించి ఉంది భగవత్తత్వము ఆ దేవి శక్తి పట్ల మోహించాడు అంటే మనసుపడ్డాడు నేను ఈ సర్వం కల్విదం బ్రహ్మాని స్థితిని పొందాలి కానీ ఈ","ప్రధాన శత్రువులు విఘ్నంగా ఉన్నాయి ప్రధాన శత్రువులని సంహరించబడాలి ఆ దేవతా శక్తి సంహరించేసింద లీనం చేసేస్తుంది.","అందుకే మనం ధ్యానం చేస్తే ఒక్కొక్కటి వెళ్ళిపోతాయి మననుంచి సో బాష్పలుడు అంటే కామము అంటే మనలో ఉండే కోరికలు ఎన్నో కోరికలు మనిషికి ఒకటి కాదు ఎన్నెన్నో ఉన్నాయి ఎన్నో కోరికలు సో ఒక వ్యాపారికి ఒక ఇల్లు ఉంది కానీ ఆ పక్కబూర్లో ఒక రాజభవనాన్ని చూశాడండి తాను కూడా అట్లాంటిది కట్టాలి రాజభవనం మీద కోరిక పడింది.","నేను కూడా అంత పెద్ద రాజభవనాన్ని కట్టాలని చెప్పి తనకు ఉండే అన్నిటిని అంటే ఎంత కష్టపడ్డాడు అంటే కష్టపడుతున్నాడు కష్టపడుతున్నాడు డబ్బులు సంపాదించి అది కట్టాలి అది కట్టాలి రాజభవనం కట్టుకోవాలి ఆ కోరిక ఏం చేసింది తన దగ్గర ఉండే అయే కాకుండా అన్ని అప్పులన్నీ చేసేసి పెద్ద రాజభవనాన్ని కట్టాడు మొత్తానికి ఆస్తులన్నీ అమ్ముకున్నాడు ఈ దురాశతో కూడిన కోరికలు చివరికి కన్నీటి భాష్పాలుగా మాత్రమే మిగిలిపోయారు భాష్పలుడు అంటే ఇదే భాష్పల స్థితి ఈ అరిషడ్ వర్గం గాని మనం ఓవర్కమ్ చేయకపోతే మనం ఎప్పుడు కన్నీటితోనే ఉంటాం అన్నమాట ఎప్పుడు ఏడుస్తూ ఉంటాం ఈ అంతర శిశువులని మనం జయించాలి ఈ శక్తే చేస్తుంది దేవి శక్తి చక్కగా వాని జయించేట్టు చేస్తుంది.","దుర్ముఖుడు క్రోధం అని చెప్పుకున్నాం ఒక శిల్పి ఉన్నాడు ఒక ఊర్లో సో చక్కని అద్భుతమైన శిల్పి నైపుణ్యం ఉంది కానీ ముక్కు మీద కోపం ప్రతిదానికి కోపం అన్నమాట దుర్ముఖడు కోపం వచ్చినప్పుడు ముఖం మారిపోతుంది. తన ముఖం చూసుకోడు కదా మిగతా వాళ్ళని చూసుకోండి బానే ఉన్నాడు అనుకుంటాడు.","సో ఎంతో కష్టపడి ఒక గొప్ప దేవతా విగ్రహాన్ని సృష్టి చేశాడు ఆ శిల్పి చెక్కాడు మంచిగా చెక్కాడు ఒక చిన్న పొరపాటు జరిగింది ఒక చేతి వేలు కొద్దిగా వంకరగా వచ్చింది ఏదో పొరపాటు చేశాడు కానీ ఆ శిల్పికి చాలా కోపం వచ్చేసింది ఎంత కోపం వచ్చింది అంటే ఆ విగ్రహాన్ని పగలగొట్టేసాడు తను తయారు చేసినటువంటి ఆ విగ్రహాన్ని పగలగొట్టేసాడు కోపంతో అబ్బా తన మీద తనకే కోపం వచ్చింది. మిగతా వాళ్ళ కోపం అంటే అది ఓకే కొంచెం కోపం వస్తుంటుంది. మన మీద మనకు కోపం వస్తే మాత్రం అది మరింత ఇంకా మనం సెల్ఫ్ సాబటాజింగ్ అంటాం.","మనని మనమే డెస్ట్రాయ్ చేసుకుంటున్నాడు ఆ కత్తితో మనల్ని మనం పొడుచుకున్నట్టు సో దుర్ముఖుడు ఈ అంతర్శత్రువుని కూడా మరి ఈ శక్తి ద్వారా ఈ నవరాత్రుల్లో ఇవన్నీ ఎంత గొప్పగా చెప్పారండి వేదవ్యాసుల వారు ఒట్టి కథ చదివితే మనక ఏమీ తెలియదు సో తామ్రముడు మూడవ వాడైన లోభం గురించి చెప్ కోబడింది సో ఒక ధనవంతుడు ఉండేవాడు బంగారం అంటే చాలా ఇష్టం ప్రాణం బంగారం బంగారం ఇంట్లో అన్ని పెట్టినిండ బంగారు నగలన్నీ పోచేసుకున్నాడు బంగార నాణాలు ఏది ఖర్చు పెట్టేవాడు కాదు లోభం లోభం ఏం చేస్తుందంటే మన దాచిపెడుతుంది బ్యాంక్ అకౌంట్స్ మన బ్యాంకులో అన్ని అన్ని దాచుకుంటాం నల్లధనం బ్లాక్ మనీ సిస్ బ్యాంక్ ఎక్కడో బ్యాంకుల్లో పెట్టేసి దాచుకుంటూ ఉంటాం.","సో కనీసం మంచి ఆహారం తినడానికి కూడా వెనకాడేవాడంట ఇతను త్రామ్రము అంటే వ్యామోహం రజోగుణం నుంచి వచ్చింది ఎల్లప్పుడూ ధనాన్ని ఎలా దాచాలో అనే ఆలోచన తప్పితే వేరే ఆలోచన లేదు. ఈ ధనాన్ని ఎలా దాచాలి దొంగలు పడతారేమో అని భయము చాలామందికి ఇన్కమ్ టాక్స్ వాళ్ళు డబ్బులు వచ్చిన తర్వాత ఇన్కమ్ టాక్స్ గొడవలు ఇన్కమ్ టాక్స్ ఎలా చూపించాలి ఎలా వాళ్ళు వచ్చి తీసుకెళ్ళిపోతారు మళల టాక్స్లు కట్టాలి మొత్తం వెళ్ళపోద్ది ఇదే ఆలోచన ఇదే ఆలోచన ఇదే ఆలోచన నిజంగానే ఒక రాత్రి దొంగలు వచ్చి మొత్తం పెట్టని ఎత్తుకొని వెళ్ళిపోయారు. ఆ ధనవంతుడు భికారి అయిపోయాడు.","ఆ ధనం అతనికి సుఖాన్ని ఇవ్వలేదు ప్రశాంతతను మిగల్చలేదు. సో లోభత్వం వల్ల సంపాదన అంతా పోయింది. బుడిదిలో పోసిన పన్నీరు ఇది తామ్రుడు తామ్రముడు లోభత్వము పిసినారితనము అందుకే ఒక మాస్టర్ ఎప్పుడూ కూడా జనరస్ గా ఉంటారు. వారు ఇచ్చే జ్ఞానంలో కానీ వారు ప్రవర్తనలో గాని ఏదైనా సరే వారు ఎప్పుడు కూడా చాలా జనరస్ గా ఉంటారు."],"minutes":8,"words":1201},{"title":"అంతఃశత్రువులు · మోహం","paras":["దాచి పెట్టుకోరు వాళ్ళ డబ్బులు గాని ఏదైనా సరే వాళ్ళ దగ్గర ఏదైనా సరే దాచుకుంటే దోచుకోబడతాం అని చెప్తాం కదా దాచుకుంటే దోచుకోబడతాం పంచితే పెంచబడతాం పంచడం ద్వారా పెంచబడతాం దాచుకుంటే దోచుకోబడతాం ఇది అంతర్శత్రువు అండి తామ్రముడు అని అంతర్శువు చిచ్చరుడు ఈ మోహం గురించి చెప్పుకున్నాం కదా చిచ్చరుడు మన తెలియకుండానే మోహం మనకు ఉంటుంది.","మనం చెప్పుకున్నాం కదా ఆ దుర్యోధనుడు పట్ల ఎంత మోహమో వాళ్ళ తల్లిదండ్రులకి రాంగ్ గైడెన్స్ రాంగ్ మార్గంలోకి వెళ్ళపోయాడు రైట్ గా చిన్నప్పుడే చిన్నయి మొక్కయ వంగనది మానే వంగదు చిన్నప్పుడే అన్ని కరెక్ట్ విద్యా బుద్ధులు నేర్పించాలి తల్లిదండ్రులు ధ్యానం నేర్పించాలి ఫస్ట్ ధ్యానం చిన్న పిల్లలకి ధ్యానం కావాలి ఈ ఆత్మజ్ఞానం అనేది ఉందనేది చెప్పాలి వాళ్ళకి వాళ్ళకి వాక ఏమీ తెలియదు వాళ్ళు చిన్నప్పటి నుంచి నువ్వు ఇంజనీర్ కా డాక్టర్ కా బాగా చదువుకో డబ్బులు సంపాదించాలి నువ్వు బిజినెస్ మాగ్నెట్ కావాలి ఇవి చెప్తారు.","ఏది మనకి ఎక్కువ దుఃఖాన్ని కలుగజేస్తుందో ఏది నశింపబడుతుందో దాని గురించి చెప్తారు కానీ నిజమైన అసలైన వాటి గురించి పేరెంట్స్ చెప్పట్లేదు. దానివల్లనే చాలామందికి ఆ మోహం వలనే పేరెంట్స్ యొక్క మోహం పిల్లల పట్ల మోహం వాళ్ళని బంధించేస్తారు వాళ్ళు కూడా ఇగ్నోరెంట్ గా అజ్ఞానంలో బతుకుతుంటారు.","అవన్నీ రాకూడదుఅని కాదు అన్ని సంపాదించకూడదుఅని కాదు మంచి డాక్టర్ కావచ్చు ఇంజనీర్ కావచ్చు కానీ ఫస్ట్ ఫౌండేషన్ స్ట్రాంగ్ గా ఉండాలి ధ్యానం ఫౌండేషన్ అందుకే ఉపనయనం అని పెట్టారు చిన్నప్పుడే ఉపనయనంలో అహం బ్రహ్మాస్మి తత్వమసి నువ్వు ఇది కాదు నాయనా అది అని పరోక్షంగా ఆ సెంటెన్స్ చెప్తారు తత్వమసి తత్వమసి తత్వమసి దాన్ని ప్రాక్టీస్ లోకి దిగాలి తర్వాత చిన్నప్పుడు ఇప్పుడే మనం ప్రాక్టీస్ లో ధ్యాన సాధన ద్వారా దాన్ని తెలుసుకోవాలి.","సో అసిలోముడు గురించి చెప్పుకున్న మదము అహంకారం మనం ఎంత అహంకారం ఉంటుందో మన అహంకారం మనల్ని పతనం చేసేస్తుందంట డిస్ట్రాయ్ చేస్తుంది అహంకారం మన గర్వం మన అహంకారాన్ని నాశనం చేయడానికి ఎప్పుడు కూడా ఎన్నో విశ్వం నుంచే ఎన్నో వస్తాయి ఎందుకంటే అహంకారంలో మనం ఏవో దుర్మార్గాలు చేస్తున్నాం అనుకోండి ఆ ప్రకృతి ఊరుకోదు మన పాఠం నేర్చుకోవాల అహంకార రాహిత్యము అందుకే ఒక జబ్బు తెప్పిస్తుంది ఆ జబ్బుకు మనం తల వంచాల్సిందే క్యాన్సర్ వస్తుంది. అంటే క్యాన్సర్ వచ్చినవాళ్ళంతా అహంకారులు అని కాదు అక్కడ చెప్తున్నాను వేరు వేరు కారణాలు ఉంటాయి. ఎన్నో కారణాలు ఉంటాయి.","మన చేతుల్లో లేనివి ఎన్నో ఉన్నాయి. మన అహంకారం ఏం చేసినా నేనే గొప్ప నాకంటే గొప్ప ఏది లేదు అనే ఫీల్ అవుతాం. ఇది అంతర్ శత్రువు అండి మనం ఎంతగా నేర్చుకుంటాం అంత సౌమ్యంగాను అంత మరి వినయంతోను మనం ఉండగలుగుతాం. విడాలుడు అంటే మాత్సర్యం అని చెప్పుకున్నాం కదా ఒక భర్త బాగా ధ్యానం చేస్తా ఉన్నాడు. దేవతా శక్తి ప్రత్యక్షమైంది ఏం మదం కావాలో కోరుకో అంటే నాకు నగలు కావాలని కానీ ఆ దేవతా శక్తి ఒక కండిషన్ పెట్టింది. ఏ కండిషన్ అంటే నేను నువ్వు ఏది కోరుకుంటావో దానికి డబుల్ మీ భార్యకి ఇస్తాను అని చెప్పాడు అన్నమాట ఆ దేవతాశక్తి సో ఈయన బంగారం కావాలని కోరుకున్నాడు.","డబుల్ బంగారం భార్యకి వచ్చేసింది మరి మూడు వరాలు ఇచ్చాడు దేవతాశక్తి రెండో వరం నాకు బాగా డబ్బులు కావాలి అన్నాడు డబ్బులు వచ్చాయి దానికి డబుల్ బోనస్ లాగా మరి డబ్బులు వచ్చేసింది వాళ్ళ భార్యకి ఇప్పుడు మూడో వారం కోరుకునేటప్పుడు ఆ భర్తకి కొంచెం ఈ మార్చర జెలసీ వచ్చింది ఆమెకి డబుల్ వచ్చేస్తున్నాయి రెండు వచ్చేస్తున్నాయి అన్ని నేను ఏది కోరుకుంటే దానికి రెండు వస్తున్నాయి కదా నాకు చిన్న హార్ట్ ఎటాక్ ఇవ్వండి చిన్నగా చనిపోయే విధంగా కాదు చిన్న హార్ట్ అటాక్ అని కోరుకున్నాడంట మాత్సర్యం చూడండి","తెలియకుండానే ఎంత ఈర్ష ద్వేషం ఎంత మనలో అసూయ ఉంటుందో ఇన్ని అంతర్శత్రువులు సో మహిషాశుడు రాయిభారానికి ఆరుగురు రాక్షసులని పంపాడు అంటే ఇది ఆంతర్యం ఇది అంతరార్థం సూక్ష్మమైనటువంటి అంతరార్థం ఆ తర్వాత అది ఫెయిల్ అయింది అంటే ఫెయిల్ అవ్వడం అంటే వాళ్ళు సంహరించబడ్డారు అంటే అరిషద్ వర్గాలని దాటేసాడు కానీ ఈ మహిషాశురుడు అహంకారానికి మదం ఆ తీవ్రమైనటువంటి సూక్ష్మ అహంకారం కూడా వచ్చేస్తుంది ఈ సాధన చేసే వాళ్ళకే ఎక్కువ వస్తాయి అహంకారాలు ఆ అహంకార సూక్ష్మంగా ఉన్నట్టు సూక్ష్మా సూక్ష్మమైనటువంటి అహంకారం","కూడా నరకబడాలి.","ఈ మహిష ఆశరుడు కూడా అసూక్ష్మ అహంకారం ఎంటర్ అయింది. సో ఆ సూక్ష్మమైన అహంకారాన్ని కూడా మరి ఆ దేవీ శక్తి సంవరించేసింది మధ్యని ఆ మహిషాశుర మధ్యని వధ చేసేసింది. సో ఫ్రెండ్స్ చూడండి ధ్యాన సాధకులు చేస్తున్నప్పుడు ఎంతో ఎరుకని కలిగి ఉండాలి ఎప్పుడు కూడా ఆ యొక్క ఐ డోంట్ నో అనే స్టేట్ లోనే ఉండాలి.","నాకు అన్నీ తెలుసు నేను ఎన్లైటన్డ్ మాస్టర్ కాకుండా నేను తెలుసుకున్నది రవ్వ అంతా తెలుసుకోవాల్సింది కొండంతా ఈ విషయం ఎప్పుడూ మన పెట్టుకోవాల్సి లోపల మనం తెలుసుకుంటూ ఉండాలి ఎప్పుడు అది ఉండాలన్నమాట మీకు తెలియంది కొండంత ఉంది తెలిసింది రవ్వ అంతా అంతే ఎప్పుడు మనం ఆ హంబుల్నెస్ తో నేర్చుకుంటూ ఉండాలి నేర్చుకుంటూ ఉండాలి. సో నవరాత్రులకి ఎంత గొప్ప వేదవ్యాసుల వారికి థాంక్స్ ఈ దేవీ భాగవతాన్ని మనకు ప్రసాదించారు చక్కని కథల ద్వారా ఎంత గొప్ప యోగ రహస్యాలు ధ్యాన రహస్యాలన్నీ పొందుపరిచి మనక ఇచ్చారు.","ఎంత గ్రాండ్ మాస్టర్ ఆయన ఇవన్నీ కూడా మనల్ని మనం ఆ సర్వం కల్విదం బ్రహ్మ అనే స్థితిని పొందడానికే ఈ ప్రకృతి అంతా మొత్తం అంతా కూడా ఆ పరమాత్మ తత్వమే ఈరోజు ఆ ప్రాక్టీస్ కూడా మనం గుర్తుపెట్టుకుందాం మనం ఏది చూసినా మనం చూసే దృష్టి ఎలా ఉండాలంటే ఏ చెట్టు చూసినా అక్కడ దేవత కనిపించాలి అక్కడ భగవంతుడే కనిపించాలి ఆ పరమాత్మే కనిపించింది ఆ వృక్షంలో మామిడి చెట్టు చూశారు మామూలు చెట్టు దేవత గోమాతకు కనిపించింది ఒ దేవత ఒక కుక్కకు కనిపించింది దేవతే జంతువులు పక్షులు ఏమి కనిపించిన చీమ చీమ కనిపించింది","దోమ కనిపించింది దేవతే ప్రకృతి అంతా దేవతా స్వరూపంగా మన ఆ దృష్టి కావాలి మనకి సర్వం కల్విదం ఎవరిని చూసినా మీ ఇంట్లో మన ఇంట్లోనే శత్రువులు ఉంటారు మన మన ఇంట్లో ఉన్న శత్రువులను చూసినప్పుడు కూడా వాళ్ళు కూడా వాళ్ళ లోపల కూడా ఇవే చూడాలి వాళ్ళు కూడా దేవతా స్వరూపాలే కానీ ఇంకా తెలుసుకోలేదు తెలియని స్థితిలోనే అజ్ఞాన స్థితిలోనే అందరికీ దుఃఖాన్ని క్రియేట్ చేస్తుంటారు అంతా హింసలో ఉంటారు.","కాకపోతే ఒక జ్ఞాన దృష్టి కలిగిన వారు బుద్ధి వికసించిన వారు సమదృష్టితో సమభావంతో ఎవరిని జడ్జ్ చేయరు. ఓకే వాళ్ళ టైం వస్తుంది వాళ్ళు కూడా ఎప్పుడో మాస్టర్ గా తయారవుతారు వాళ్ళు కూడా ధ్యాన సాధన చేస్తారు ఈ జన్మ కాకపోతే ఇంకొక జన్మ అంతే ఈ జన్మలోనే అన్ని కావాలంటే అవసరం లేదు ఎన్నో జన్మల ప్రయాణం ఇది కొంతమంది ఎన్నో జన్మలు పడతాయి ఈ జన్మలో విత్తనాలు నాటబడతాయి ఇంకొక జన్మలో మొలకెత్తుతాయి. ఈ జన్మలోనే ఇంకో 10 సంవత్సరాల్లో వాళ్ళు ఎన్లైటన్మెంట్ పొందేయాలి అఏమీ లేవు ఎవరి వారి సాధన ప్రకారం వారు అవి ఆ స్థితుల్ని ఆ జ్ఞానాన్ని పొందుతూ ఉంటారు.","సో ఈరోజు మన క్లాస్ లో మరి అర్షద్వర్గాలు మన అంతర శత్రువులపై విజయం గురించి మాట్లాడుకుందాము.","ఈ ఆరుగురు రాక్షసులు అంటే మనలో ఉన్న ఆరు ఆరుగురు ఈ అర్షడ్ వర్గాలు ఆరు అర్షడ్ వర్గాలు కామ క్రోధ లోభ మోహ మొద మాత్సర్యాలు వీటిని గుర్తించాలి ఒకొక్కటి గుర్తించామా ఐడెంటిఫై చేసుకున్నామా డయాగ్నోస్ చేశమా ఈజీ నాలో ఏమి లేవు అంత బాగుంది అనుకుంటుంటాం చాలామంది ఆస్ట్రిచ్ లాగా ఇసుకలో తన తలని లోపల దాచి పెట్టేసి ఏమ లేని ఏం లేదు అంతా బాగుంది అంతా బాగుంది అనుకుంటే అలా ఉండకూడదు ఎప్పుడు కూడా మనలో ఈ భౌతిక దేహాన్ని మనం ధరించినప్పుడు కొన్ని లోపాలు కూడా ఉంటాయి ఇక్కడ కరెక్ట్ చేసుకోవాల్సి ఉంటాయి ఆత్మలో లోపాలు ఉండవు ఆత్మ క్షేత్రంలో మనమందరం దేవుళ్ళమే అహం బ్రహ్మాస్మి అహం శివోస్మి అహం కృష్ణోస్మి కానీ ఈ దేహ భ్రాంతితో ఈ వ్యక్తిత్వము ఏదైతే శరీరము మనసు చిత్తము బుద్ధి అహంకారం ఇన్నీ కలిసి పడినటువంటి దీనిలో ఉంటాయి ఫ్లాస్ ఉంటాయి.","వీటి పట్ల మనం జాగరూకతతో ఉండాలి. ఎరుకని కలిగి ఉన్నాం లేకపోతే స్టక్ అయిపోతాం మన సాధనకి అంతరాయం కలుగుతుంది.","జీవన్ముక్త స్థితి అని ఆదిశంకరాచార్యుల వారు చెప్పినట్టుగా జీవన్ముక్తులం కావాలంటే అంటే ఈ బొందులో పరమం ఉన్నప్పుడే మనం తెలుసుకోవాలి ఏది తెలుసుకోవాలో అది తెలుసుకోవాలి ఏ జ్ఞానం పొందితే సర్వ జ్ఞానాలు తెలిసిపోతాయి అన్ని జ్ఞానాలు మీ దగ్గర ఉంటాయో ఆ జ్ఞానం తెలుసుకోవాలి ఒకటే ఒక పాయింట్ అహం బ్రహ్మాస్మి తత్వమస్మి సర్వం కలియుదం బ్రహ్మ అహం బ్రహ్మాస్మి అని తెలుసుకోవాలి సర్వం కలియుదం బ్రహ్మ ఈ రెండే ప్రతి ధ్యాన సాధకుడు వారి యొక్క ధ్యాన ఫలం ఏంటంటే ఈ రెండు తెలుసుకుంటారు వాళ్ళు అనుభవపూర్వకంగా తెలుసుకుంటారు.","వండర్ఫుల్ ఫ్రెండ్స్ ఈరోజు మరి మనంఅందరం కూడా ఆ దేవీ సమర్పణ ఏదైతే మనం మొదటి రోజు నుంచి ప్రాక్టీస్ చేస్తున్నామో ఒకసారి చేద్దాము హాయిగా లక్ష్మీ ముద్రలో కూర్చోవాలి అంటే మీ ఎక్కువగా మనం శక్తికి మనలో ఉన్న ఆ దివ్య శక్తి దేవీ శక్తి ఆవిడే మనలో కుండలిని శక్తిగా ఉంది. ఆ శక్తికి మనం సరెండర్ కావాలి దేవి సమర్పణ ఆ శక్తే ఈ సృష్టి అంతా ఉంది ప్రకృతి అంతా ఆమె ఉంది. సో అందుకే లక్ష్మీ [గురకలు] ముద్ర తర్వాత మన కుడి నాసికా రంద్రాన్ని మనం క్లోజ్ చేసి ఎడమ నాసికా రంద్రం ద్వారా తొమ్మిది సార్లు లోపలికి గాలి పీల్చుకోవాలి.","తొమ్మిది సార్లు అంటే తొమ్మిది అంకల వరకు ఒకటేసారి కాదు సక్సెసివ్ గా కొత్తవాళ్ళ కోసం చెప్తున్నా అట్లా తొమ్మిది సార్లు లోపల పిలుచుక నిదానంగా పిలుచుకుంటే మీరు తొమ్మిది సార్లు పిలుచుక లేకపోతే మూడోసారికే నాలుగోసారి పిల్చలేరుఅన్నమాట ఎందుకంటే ఆల్రెడీ లంగ్స్ ఫుల్ అయిపోతాయి స్లోగా పిలుచు నిదానంగా నిదానంగా తొమ్మిది సార్లు అంటే నవరాత్రులు తొమ్మిది సార్లు దీనికి మ్యాచింగ్ చేసుకుంటున్నాం తర్వాత నమస్కార ముద్ర చేస్తాము మనం హోల్డ్ చేయాలి అప్పుడు నమస్కార ముద్ర చేసి మనం శరణు శరణు దేవీ సమర్పణ కంప్లీట్ గా బౌవింగ్ డౌన్ యాక్ట్ అనేది చేస్తాం.","ఆ దేవీ మాతకు సరెండర్ గా అయిపోవాలి అంటే మనలో ఉన్న శక్తి సరండర్ అయిపోవాల ఆ శక్తి అరిషడ్ వర్గాలు చేస్తున్న అన్నిటిని సంహరించేస్తుంది మహిషాశుని సంహరించేస్తుంది. మనలో ఉన్న అన్ని దుర్గుణాలు అన్నీ వెళ్ళిపోతాయి ఆ శక్తి ప్రక్షాళన చేస్తుంది."],"minutes":8,"words":1179},{"title":"దేవీ సమర్పణ · శ్రీం","paras":["సో తాకిన తర్వాత అప్పుడు శ్రీం శ్రీం శ్రీం అంటే పరా లెవెల్లో మనసులో మనం రిపీట్ చేసుకుంటాం బయటకి బాహ్యంగా ఉచ్చరించం రిపీట్ చేయాలి లోపల తొమ్మిది సార్లు ఒకవేళ మీకు అది ఇష్టం లేదు వచ్చా స్ట్రీమ్ అనేది అంకె లెక్క పెట్టండి ఒకటి రెండుమూడు నాలుగు ఏదైనా ఒకటే తొమ్మిది సార్లు అది కూడా అంకే ఇంపార్టెంట్నైన్ నైన్ నెంబర్ మ్యాచింగ్ చేస్తాం తర్వాత మళలా మనం యదాస్ స్థానానికి వచ్చేయొచ్చు ఇది మనం తొమ్మిది సార్లు చేయాలి ఫ్రెండ్స్ ఓకే లెట్స్ డ ఇట్ అందరం కూడా హాయిగా కూర్చుని నిదానంగా గాలిని బయటకి వదులుతూ మీ బవింగ్ డౌన్ మీ తలని వంచాలి శరస్సుని వంచాలి.","అప్పుడు హోల్డ్ చేయాలి మీ బ్రెత్ ని ఆపండి ఆపి లోపల శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం నిదానంగా గాలిపించుకుంటూ మళ్ళ యదాస్థానానికి వచ్చేసి భావాలు ఇంపార్టెంట్ ఏ భావంతో చేస్తున్నారో అది ఇంపార్టెంట్ దేవీ సమర్పణ సరండర్ కం కంప్లీట్ ఆ శక్తికి సరెండర్ అయిపోవాల కుండలిని శక్తి విశ్వ శక్తికి సరెండర్ అయిపోవాల ప్రకృతి మాత శక్తికి ఆ జగన్మాత శక్తికి సరెండర్ అయిపోవాల మీ ఓన్ ఫేస్ లో చేయండి మీ ఓన్ విధంతో చేయండి.","ఆ భావన ఇంపార్టెంట్ తొమ్మిది సార్లు అయిపోయిన వారు అలా మౌనంలో కూర్చ ఉండండి ఒక స్టాచూ లాగా కూర్చుంది కడలిక లేకుండా నిశ్చలంగా ఒక అచల స్థితి అంట మనసులో కూడా అచలనం అక్కలేదు ఏ ఆలోచనలు వద్దు ఉచ్చువాసన శ్వాస అయిపోయిన వాళ్ళు చేయండి. మిగతా వాళ్ళు మిగతా రౌండ్స్ కూడా కంప్లీట్ చేసుకోండి. వండర్ఫుల్ ఫ్రెండ్స్ హారిక మేడం నుంచి మనం ఒక చక్కని ఛాంట్ మనం విందాం.","దేవీ నవరాత్రుల్లో చాలా అద్భుతంగా ఉంటుంది ఆ దేవీ స్తుతి ఆ మాత గురించి ఆ పరాశక్తి హరిక మేడం త్రిపుర సుందరి రిమా [పాడటం] అంబదయా సాగరిమా త్రిపుర సుందరి మా అంబదయా [పాడటం] సాగరిమా సుందర [పాడటం] వదనీమా అంబసుగుణ మనోహరిమా [పాడటం] సుందర వదనీమా [పాడటం] అంబసుగుణ మనోహరిమా [ఆశ్చర్యం] జయ జగజనని మా [పాడటం] అంబ జగదోధారిణిమా జయ జగజనని మా అంబ జగదోధారిణి [పాడటం] మా సుందర [పాడటం] వదనేమా అంబసుగుణ మనోహరిమా [పాడటం] సుందర వదనేమా అంబసుగుణ మనోహరిమా [ఆశ్చర్యం] త్రిపుర సుందరి మా అంబదయ దయాసాగరిమా [పాడటం]","త్రిపుర సుందరి మా అంబదయా [పాడటం] సాగరే మా అంబదయా సాగరేమా [పాడటం] థాంక్యూ హారిక మేడం త్రిపుర సుందరి మా దయాసాగరిమా ఆమెలో ఉండేది కరుణా దయ ఆ మాత తిపుర సుందరి అంటేనే మన ఆత్మ పర పరమాత్మ తత్వం మూడు పురాల్లో ఉండేది ఆవిడే ఆవిడలో ఉండే దయాగుణం కరుణ ఆ శక్తి చేయలేనిది ఏది ఉండదు అసాధ్యల ఏమీ లేదు ఆ శక్తికి సరెండర్ అవ్వాలి ఆ ఆ దేవీ మాత సరెండర్ మన దేవీ మాత అని మనం నామ నామరూపాన్ని ఇచ్చుకుంటున్నాం కానీ యాక్చువల్ గా మనం ధ్యానంలో కూర్చున్నప్పుడు మనం ఆ శక్తికి సరెండర్ అయిపోవాల ఆ శక్తికి తెలుసు","ఎంతో దయా కరుణ కలిగినటువంటి మాతా శక్తి వండర్ఫుల్ ఫ్రెండ్స్ ఇప్పుడు మరి కొన్ని షేరింగ్స్ చేసుకుందాం నిన్న కొంతమంది చెయ్యి ఎత్తారు గారు వారికి ఆపర్చునిటీ ఇవ్వచ్చు ఇద్దరం ముగ్గురు వారు డిజిటల్ హ్యాండ్ రైస్ చేశారు ఎస్ సార్ సిద్దు గారు నమస్కారం సార్ నమస్కారం అండి సిద్దు గారు ధన్యవాదాలు సార్ మహారాజ్ శుభాశయాలు సార్ ఆ నా ప్రశ్న ఏమంటే ఒక టాక్సిక్ పీపుల్ మత్తు మదార్తలా ఉండారు కదా అలాంటి పీపుల్ ని ఎలా హ్యాండల్ చేయాల మేము ఒక ధ్యాని స్థితిలో ఉండాలి ఆ ఇంకొకటి ప్రశ్న ఆ అనాస్తేష బుక్లో ఉన్నది","కదా సర్ అనాస్తే ఆ బుక్ లో వారు అనాస్తేష మేడం కి వారి తాతగారు చెప్తారు ఆ అమ్మ ఒక లేడీకి హీల్ చేసేకి తన అరేని పంపించి హీల్ చేస్తారు అది చేయరాదు అంటా చెప్పేస్తారు సర్ అది ఒక్క నాకు సందేహం కలిగింది సార్ ఓకే వండర్ఫుల్ సిద్దు మాస్టర్ గారు వెరీ గుడ్ వెరీ గుడ్ సో అడిక్షన్ వ్యసనాలు మాదక ద్రవ్యాలు పట్ల అడిక్షన్ గురించి మీరు ఫస్ట్ అడిగారు చాలామందికి ఈ అడిక్షన్స్ వస్తుంటాయి ఎందుకంటే వారు వారిలో ఉన్న బాధ దాన్ని కప్పి పుచ్చడానికి వాళ్ళకి బాధని ఎలా దానినుంచి బయటపడాలో తెలియదు దుఃఖం నుంచి ఎలా","బయటపడాలో తెలియదు తీవ్రమైనటువంటి బాధ ఉంటది కొంతమందికి చిన్నప్పుడే పడిపోయిఉంటాయి గతం నుంచే ఎప్పుడో క్యారీ చేస్తుంటారు.","ఈ ఆల్కహాల్ గాని లేకపోతే డ్రగ్స్ గాని ఏదైతే తీసుకుంటున్నారో ఆ వ్యక్తులంతా కూడా దీన్ని తాత్కాలికంగా ఉపసమనంలా దాని పైన కారప్ చేసేస్తున్నారు అంతే ఇది తెలుసుకోవాలి మనం అంటే వాళ్ళలో తీవ్రమైనటువంటి దుఃఖం బాగా ఉంది.","వారు ఈ మెథడ్ ని ఉపయోగించుకుంటున్నారు మాదక ద్రవ్యాలకి అడిక్షన్ ఇప్పుడైతే యంగ్ జనరేషన్ అంతా కూడా వాళ్ళకి చిన్నప్పుడే వాళ్ళు ఈ మాదక ద్రవ్యాలు డ్రగ్స్ డ్రగ్స్ డ్రగ్స్ లేకపోతే ఆల్కహాల్ ఆల్కహాల్ స్మోకింగ్ స్మోకింగ్ స్మోకింగ్ తాత్కాలికంగా వాళ్ళకు ఏదో ఒక విధమైన స్థితి కలుగుతుంటుంది తాత్కాలికంగా అది కూడా డ్రగ్ యొక్క ఆ కెమికల్ డిపెండెన్సీ వలన ఆ కెమికల్స్ ద్వారా వాళ్ళకి ఒక తేలికమైనటువంటి ఒక భావన కలుగుతుంది ఆ దుఃఖంని బాధని కొంత అది కన్సీల్ చేస్తుంది దాన్ని హైడ్ చేసేస్తుంది లోపల సో ఇది చాలా డేంజరస్ మనం ఇది ఎంతకాలమని రోజు ఆ డ్రగ్ డిపెండెన్సీ ఆ మాదక ద్రవ్యాలు మన శరీరాన్ని కంప్లీట్ గా నాశనం చేస్తాయి మన మానసిక ఈ వ్యవస్థను కూడా నాశనం చేస్తుంది.","ఒక సేమ్ థింకింగ్ రాదు వాళ్ళకి ఒక క్రిమినల్ మైండ్ అయిపోదు వాళ్ళకి మాదక ద్రవ్యాలు దొరకలేదు వాళ్ళు డబ్బుల కోసం దొంగతనం చేయడం స్టార్ట్ చేస్తారు. మాదక ద్రవ్యాలు కొనుక్కోవాలి కాబట్టి ఏమి చేయకూడదో అన్నీ అధర్మాలన్నీ చేసేస్తుంటారు. దానికి సొల్యూషన్ ఒకటే మెడిటేషన్ మెడిటేషన్ ప్లస్ కౌన్సిలింగ్ ఎందుకంటే మెడిటేషన్ వాళ్ళే ఫస్ట్ కూర్చోమన్నా కూర్చోలేరు వాళ్ళకి కౌన్సిలింగ్ ఇవ్వాలి వాళ్ళకి వాళ్ళలో ఒక షేమ్ వండ్ అనేది ఉంటుందన్నమాట అంటే టాక్సిక్ షేమ్ అనేది ఒకటి ఉంటుంది.","వాళ్లో టాక్సిక్ షేమ్ హెల్దీ షేమ్ వేరు టాక్సిక్ షేమ్ వేరు ఆ టాక్సిక్ షేమ్ కవర్ప్ చేసుకోవడానికి ఆల్కహాల్ డ్రగ్స్ ఇవన్నీ అలవాటు చేసుకుంటారు వాళ్ళు కౌన్సిలింగ్ ద్వారా వాళ్ళకి ఆ అవేర్నెస్ ని మనం కలుగచేయాలి. వాళ్ళ జీవితంలో ఏమేమి బాధ బాధించే సంఘటనలు ఉన్నాయి అని ఎవరికీ చెప్పుకోలేక వాళ్ళు లోపల పెట్టుకుంటారు అన్ని మింగేస్తుంటారు వ్యక్తపరచడం కూడా చాలామందికి తెలియదు ఎలా చెప్పుకోవాలో కూడా తెలియదు.","ఇవన్నీ చాలా ఉపయోగపడతాయి ఫస్ట్ కౌన్సిలింగ్ చేస్తే వాళ్ళు ధ్యానంలోకి రాగలుగుతారు చాలామంది ధ్యానం చేశారా పట్టుకున్నారా ఈ వ్యసనాలకి ఇది ధ్యానం అనేది మంచి అడిక్షన్ అంటారున్నమాట ధ్యానం అనేది గుడ్ అడిక్షన్ మంచి వ్యసనం అంటే రోజు మన లోపలికి అంతర్ముఖం కావడం అది ఎన్నో చాలా మనల్ని మనం కరెక్షన్ చేసేస్తున్నాం లోపలన్నిటిని ఒక్కొక్కటి చేదించుకొని ఆ శక్తి మనల్లో లో అన్ని లోపాలు ఉన్నాయో అన్నీ కరెక్ట్ చేసేస్తుంటాడు.","అధర్మం చేయలేరు ఒక ధ్యాన సాధకుడు అధర్మం అవినీతి ఇవన్నీ ఏది చేయలేడుఅన్నమాట ఎందుకంటే ఆ స్థితి ఈ శక్తే మనలో ఆ శక్తి మన చైతన్యం కలుగజేస్తుంది ఆ జ్ఞానం కలుగచేస్తుంది. రెండో ప్రశ్న హీలింగ్ గురించి మన హీల్ చేయగలదు ఎందుకంటే గొప్ప మాస్టర్స్ కి ఆ శక్తి ఉంటుంది. హీల్ చేయగలిగే శక్తి అందరికీ ఉంటుంది. కానీ మనం హీల్ చేయకూడదు ఎందుకు ప్రతి ఒక్కళ్ళు వాళ్ళని వాళ్ళు స్వస్థత పరుచుకునే ఆ శక్తి సామర్థ్యాలు వాళ్ళకే ఉన్నాయి.","కానీ ఎక్సెప్షన్స్ టు ద రూల్ అనేది ఉంటుంది ఎప్పుడు కూడా ఒక రూల్ కి 99 శాతం హి షుడ్ నాట్ హీల్ కానీ 1% లోకోద్ధారణకి ఈ వ్యక్తి ఉపయోగపడతాడు అంటే ఒక గురువు ఏం చేస్తాడంటే తనలో ఉన్నది అన్ని తీసేస్తాడు వీడు పనికొస్తాడు వీడు వీడు ఇంకో 50 సంవత్సరాలు బతికితే వీడి ద్వారా కోట్ల మందికి చాలా మేలు జరుగుతుంది అంటే వాడిని హీల్ చేస్తాడు గురువు హి ఇస్ రైట్ పర్సన్ వాడి లైఫ్ స్పాన్ వాడు ఎక్స్పాండ్ చేస్తాడు ఎక్స్టెండ్ చేస్తాడు ఎందుకంటే ఎక్సెప్షన్స్ టు ద రూల్ అందుకే కొన్ని స్పెసిఫిక్ సర్కమస్టాన్సెస్","కండిషన్స్ లో ఆ హీలింగ్ అనేది చేస్తారు కొంతమంది కానీ సెల్ఫ్ హీలింగ్ే రైట్ మెథడ్ ఇన్ జనరల్ అందరూ కూడా సెల్ఫ్ హీలింగ్ మనల్ని మనం స్వస్థత చేకూర్చుకోవాలి ధ్యానం ద్వారా జ్ఞానం ద్వారా ఈ శక్తిని గ్రహించడం ద్వారా ఈ మూడు వస్తాయి మనకి ధ్యానంలో ధ్యాన సాధన చేసుకుంటూ ఉంటే మనసు జీరో అయినప్పుడు ఫస్ట్ మన బాడీ రెక్యుపిరేట్ అయిపోద్ది బాడీ చక్కగా సైకోసోమాటిక్ డిసీస్ అన్ని స్లోగా వెళ్ళిపోతాయి స్ట్రెజర్ అంతా వెళ్ళిపోద్ది స్ట్రెస్ అంతా వెళ్తుంటుంది చక్కగా మేలు జరుగుతుంటుంది కొన్ని జ్ఞానం","సంపాదించాలి ఆ జబ్బు ఎందుకు ఉంది ఆ కార్యకారణ సంబంధం తెలుసుకోవాలి.","మూల కారణం ఏంది ఏ కాన్ఫ్లిక్ట్ ద్వారా ఈ జబ్బు నాకు వచ్చింది ఆ జ్ఞానం పొందుతారు ధ్యానంలోనే ఒక ఆల్టర్డ్ స్టేట్ ఆఫ్ కాన్షస్నెస్ లో అది వస్తుంది అది హీల్ చేసుకుంది. ఎన్లైటన్మెంట్ ద్వారా హీల్ అవుతాయి. ఈ జ్ఞాన చక్షువు ఓపెన్ అయినప్పుడు ఈ జ్ఞాన చక్షువులో అన్ని బూడిద అయిపోతాయంట.","మన కర్మ వాసనలు కాన్ఫ్లిక్ట్స్ మనలో ఉన్నటువంటి ఏదైతే అన్ని ఉన్నాయో అవన్నిటిని భస్మం చేసేస్తుంది థర్డ్ అందుకే చాలామందికి ధ్యాన సాధన చేస్తారు థర్డ్ ఓపెన్ కాన అన్ని అంతవరకు ఉన్న ఇబ్బందులు బాధలు దుఃఖ అన్ని పటా పంచలు అయిపోయాయి మొత్తం ఖతం కేల్ ఖతం దుకాన్ బంద్ అయిపోయాయి మొత్తం వెళ్ళిపోయాయి ఈ థర్డ్ ఐ ఓపెన్ అయిందా గోల్ కొట్టేసినట్టే ఎందుకు అన్ని బూడిదయపోతాయి కర్మ వాసనలు కర్మ క్షయం ప్రారబ్ధ కర్మలు సంచిత కర్మలు అన్ని వెళ్ళిపోతాయి.","సో అందుకే స్వస్థత స్వస్థితి స్వస్థత మన స్వస్థితిని తెలుసుకుంటే స్వస్థత వస్తుంది అందుకే అనస్తే గారు ఆమె హీల్ చేసే కెపాసిటీ ఉంది చేస్తారు కానీ గురువులు ఎవరికి చేయాలి ఇప్పుడు ఒకడిని హీల్ చేశారు వాడు ఒక 100 మర్డర్లు చేస్తాడు వాడు హీల్ చేసిన తర్వాత మనం హీల్ చేస్తాం ఒకడిని వాడు వెళ్లి 100 మర్డర్లు చేస్తాడు.","ఎన్నో అవినీతులు కుంభకోణాలు చేస్తాడు వాడు ఆ పాపం మనం చెప్పుకుంటూ అందుకే మనం ఎప్పుడు కూడా మన దగ్గరికి వచ్చిన ఫస్ట్ నాయనా ధ్యానం చెయ్ ఎరుకని సాధించు నీలో ఎందుకు వచ్చిందో అది కనుక్కో ఈ జబ్బు అనేది ఈ రోగాలు అనేవి కూడా ఇవన్నీ ఇండైరెక్ట్ టీచర్స్ పరోక్ష గురువులు ఆ గురువు నుంచి నువ్వు నేర్చుకోవాల్సింది ఉంది కాబట్టి జబ్బు వచ్చింది నాయనా ఇదేదో తెలుసుకో నువ్వు అని చెప్తాం మనం వాళ్ళు సాధన చేసుకుంటే వాళ్ళు కచ్చితంగా పొందుతాడు సో ఈ విషయాన్ని మనం సిద్దు గారు మంచి ప్రశ్న అడిగారు థాంక్యూ"],"minutes":8,"words":1207},{"title":"అనుభవాలు · ప్రశ్నలు","paras":["వండర్ఫుల్ వండర్ఫుల్ నమస్కారం నెక్స్ట్ థాంక్యూ సార్ నిన్న హ్యాండ్ రైస్ చేసినవారు కల్పన [గొంతు సవరించుకోవడం] గారు కవిత గారు ఓకే కల్పన గారు నమస్కారం సార్ నమస్కారం మేడం థాంక్యూ సార్ నాకు ఈ ఆపర్చునిటీ ఇచ్చినందుకు సార్ నేను జ్ఞానోదయం వల్లనే ఆ చాలా నా లోపల ట్రాన్స్ఫర్మేషన్ జరిగింది.","సంపూర్ణ మహిళ రెండు సార్లు అటెండ్ అయ్యాను సార్ హారిక మేడం చేసింది. దానివల్ల నా లోపల ఎంతో ట్రాన్స్ఫర్మేషన్ వచ్చింది. ధ్యానంలోకి వచ్చిన కొన్ని నెలలకే నాకు ఆర్థరైటిస్ తగ్గిపోయింది సార్ ఆర్థరైటిస్ తగ్గిపోయింది. ఆ సంబంధ బాంధవ్యాలలో కూడా అంటే అత్తమ్మ మీద ఆడపడుచుల మీద ఎక్కువ కంప్లైంట్స్ ఉండేటివి వాటిలో నుంచి కూడా నేను బయట పడగలిగాను.","కానీ ఇంకా హస్బెండ్ తో మాత్రము గొడవలు అవుతున్నాయి సార్ అంటే చిన్నదానికి ట్రిగర్ అయిపోతున్నాను అది దాని మీద కూడా వర్కవుట్ చేస్తున్నాను అంటే అందరితోన బాగానే అనిపిస్తుంది అంతా బాగానే ఉంది అర్థం చేసుకోగలుగుతున్నాను యక్సెప్ట్ చేయగలుగుతున్నాను కానీ హస్బెండ్ దగ్గర చిన్న చిన్న వాటికి దగ్గర అయిపోయి నా ఎమోషన్ ని అర్థం చేసుకోవట్లేదని ఆ గట్టిగా అరవడం ఏడవడం జరుగుతుంది.","ఆ మళ్ళీ దానికి కారణం నేను మళ్ళీ కాసేపటికి రూమ్లోకి వెళ్లి ఆ మెడిటేషన్ చేసుకొని అది తన ఉన్న స్టేజ్ అలాంటిది అలా అని అలా కాదు కదా తను తను ఎంతో జ్ఞాని ఉండొచ్చు నాకోసమే వచ్చిందని ఇలా అర్థం చేసుకుంటున్నాను కానీ తనలో నుంచి బయట పడలేకపోతున్నాను కానీ నా లోపల ఎప్పుడు ఒక తపన ఏముంటది అనిఅంటే నేను సంసారంలో నిర్వాణం చెందాలి నాకు బ్రహ్మజ్ఞానం కావాలి ఆత
