</style></head><body><div class="app lang-en"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-05-en.html">Prev</a><a href="day-07-en.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">Parashakti · Mahishasura Mardini · Devi Navaratri · Day 6 (English)</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">Parashakti · Mahishasura Mardini</span></div><div class="tools"><span class="lang-switch"><a href="day-06-te.html">TE</a><a href="day-06-en.html" class="active">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-05-en.html">Prev</a><a href="day-07-en.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"Opening Meditation · The Empty Vessel","paras":["Welcome to the 566th day of the Jnanodayam programme from Quantum Life University. For 566 days — almost more than a year and a half — we have been learning, through these Devi Navaratri days, the knowledge of the Devi and of that divine power. Brahmarshi Chakravarti Dr. Newton, founder and chairman, is himself conducting the classes, closing each day with a practice, and showing how the knowledge is to be lived.","Before the knowledge can be received, we have to become an empty vessel. So today, as on every other day, we sit for forty to forty-five minutes of meditation, and only then do we receive. Sit comfortably in sukhasana. Cross the legs, bring the fingers together, close the eyes, and with a small smile let the music play. Turn inward. Make the journey into yourself, and watch the breath — inhalation and exhalation, just as they are happening. When a thought comes, smile, and bring the attention back to the breath.","If the mind slides toward yoga nidra, return, and remain aware. For these forty minutes there is no other work. Watching the breath is the work.","In the final ten minutes this meditation and this knowledge are offered for the welfare of the world. Very soon a pyramid is to appear upon this earth. Let the light of knowledge at the Sahasrara, the crown, shine through the world and bring a feeling of unity in every person. Let this earth become a divine mandala. Let every living being live in oneness, joined to Prakriti, Nature, and moving in knowledge of the Self. We release that resolve into the universe with complete trust that it will take form.","On the 24th of November, 2027, we will gather and inaugurate this Sahasrara together. In a collective meditation, the true aim of the resolve — the play itself — begins. With this energy and this joy, bring the attention back to the breath, and stay joined to it.","For the last minute, remain with the breath. Five, four, three, two, one, zero. Slowly rest both hands over the eyes for a few moments. With a smile, open the eyes. Welcome again.","Today is the sixth day of Devi Navaratri. For five days an extraordinary knowledge has been coming. Whatever insights and realisations are shared across the whole of Jnanodayam were learned from Dr. Newton and from Lakshmi. To hear him directly, all the way through to Dashami, the tenth day, is the good fortune of everyone here. He is welcomed with a smile.","Dr. Newton thanks Harika, and wishes the friends of Jnanodayam a good morning. This is the sixth day. Holding these classes, staying inside the sadhana that belongs to them, and remaining in that state of energy: this is what matters. We return to it every day."],"minutes":4,"words":469},{"title":"Parashakti · Shiva Cannot Move Without Her","paras":["There is a power that drives this entire creation, and without that power creation itself would stop. We are speaking of the sadhana by which that power is known in experience. The meditation is necessary. In the Puranas, every single thing that is told is a form of knowledge. Every detail carries a great spiritual science.","In the Soundaryalahari, Adi Shankaracharya says: Shivah shaktya yukto yadi bhavati shaktah prabhavitum. If Shiva is not joined with Shakti, he is not able to act. Without that power even Shiva cannot move, and cannot do anything. This is the Mother of the world. Without her the Trimurtis themselves are not there. Brahma too carries on his head one tiny particle of the dust of her feet, and because of that particle he is able to carry out the whole of creation. The very principle of the Trimurtis rests in her — in this Mother of the world, in this Parashakti, the supreme power.","For this sadhana a verse is given. Na mantram no yantram tad api cha na jane stutim aho. I do not know mantra, Mother. I do not know yantra. I do not know tantra. I know nothing. I do not even know how to speak your name. I do not know invocation, and I do not know meditation, and I do not know how your praise is to be told. How am I to praise you? Even your name will not turn upon my tongue. She has many names. One of them is Tribhuvaneshwari, she who rules the three worlds. I cannot utter even those names. I do not know how to praise you.","I do not know your mudras, your sacred gestures. I do not know how to cry out to you. The one thing I know, O Mother, is following you — and that this following removes sorrow. O Mother of the world, the Mother who is full of compassion and full of mercy already knows us. We do not need to know anything. We have to surrender to her. We have to surrender to that Shakti. What is required is the trust that she will look after us, and the feeling of sharanagati, of having taken refuge.","We do not have to know how to perform worship. We do not have to know how to recite hymns. Take it that we are still at the beginning. Even there, inside meditation itself, this Mother helps us. She is in us as Kundalini Mother, as Kundalini Shakti."],"minutes":4,"words":418},{"title":"Mahishasura · The Summit of Meru","paras":["Today, the sixth day, the teaching is Mahishasura Mardini — the Mother who overcomes Mahishasura, the buffalo-formed power. Yesterday we saw how the Mother of the world took that form, and how many divine powers united in her. The powers of the deities came together and arose as one great power. She is shown with eighteen arms, and she slays Mahishasura. All of this is given as a symbol, and the symbol has to be read.","The first thing told of Mahishasura, after he is born, is that he goes to the summit of Mount Meru and performs tapas. He sits there and meditates. That too is a symbol.","The inner enemies, the arishadvargas, the band of six, were spoken of yesterday. He sends six demons as his messengers. He is seized by moha, infatuation. The inner sense of that infatuation is that he is trying to know the Mother, and so he sends an embassy. But every one of these messengers is an inner enemy. Until they are removed, he cannot come near her. The Mother destroys them all. That same Shakti is what removes the six.","Many enemies lie hidden in us, and many blocks. Kama, desire; krodha, anger; lobha, greed; moha, delusion; mada, pride; matsarya, jealousy — all six are present without our knowing. Even when we tell ourselves that everything is fine, they are there. Victory over the inner enemies comes only through this Shakti, through the power that is lying dormant within.","Mahishasura meditating on the summit of Meru is itself a sign. Meru danda, the staff of Meru, is the spine. The summit is the Sahasrara, the crown. The crown is sarvam khalvidam Brahma: all this is Brahman. At the Ajna, the centre between the eyebrows, we come to know Aham Brahmasmi — I am Brahman. At the Sahasrara we come to know that everyone is divine. Not I alone. Everyone. Even those who play the villain are divine. The asuras too are divine. What lives inside is only divinity. There are asuric qualities; that is all. In one small story, and from how many sides, in how many symbolic forms, Vyasa has given this knowledge.","In the Muladhara, the root centre, she is present as mula shakti, the root power, asleep. It is the same power we meet in the Ramayana: Sita herself, it is said, granted Hanuman the eight siddhis and the nine nidhis. That Sita is this root. In the Dwapara age she is Radha. Here she is Sita. Here she is Mahishasura Mardini, the Mother of the world, Tripureshwari, Lalita. All of them are one. There is no difference. As Kundalini Shakti she abides in the Muladhara."],"minutes":4,"words":447},{"title":"The Boon · Death Only Through the Mother","paras":["When sadhana begins and the attention rests on the breath, on inhalation and exhalation, the sushumna, the central channel, becomes active, and the chakras open one by one. Sometimes a person has no experience at all of a chakra opening. At some moment the experiences of the third eye simply start. How can that be known? If the other chakras have not opened, the third eye does not open. For some people the energy arrives directly at the crown. Just as Mahishasura sat at the summit of Meru and meditated, many meditators feel the crown and enter the state of the Sahasrara.","At each centre, as each state is crossed, she herself is present — as Parashakti, the supreme power, and as Aparashakti, the power that works in the manifest world. As the energy rises into the higher centres, she herself becomes Parashakti. When the Sahasrara is reached, she is a power that gives birth to worlds, a power present everywhere. And yet each chakra has its own power. She herself is every one of those powers. She herself is the support of them all.","Mahishasura, out of his meditation, asks Brahma for a boon. He asks that he should die only through a woman. What he means is: I do not want death. I want to remain immortal. That cannot be given. Anyone who has put on this body — anyone who has put on this garment — must at some time vacate it. It is against the rule. A person may live twenty thousand years in a body, or thirty thousand, and still, at some time, the body has to be vacated and left.","Mahavatar Babaji is living now, embodied. Many live embodied. Many are chiranjivis, and many yogis of the Himalaya are among them. Even if one of them lived for a hundred thousand years, a day would come when the body had to be laid down. So Mahishasura is told to ask for a different boon. This one cannot stand. In the state of the Atman, deathlessness can be gained. A person can come to know: I am deathless; the Atman does not die. What cannot be had is the demand to remain in this body forever. This body will be left. It will certainly be left.","Then he says: I choose death through a woman. By the outer meaning, he is looking at woman as the lesser. By the inner meaning, only this Mother — Tripurasundari, Tribhuvaneshwari — can bring us to the Sahasrara at the crown. Without this Shakti we cannot move even an inch. We cannot meditate. We cannot do anything."],"minutes":4,"words":438},{"title":"Eighteen Arms · Weapons Against the Inner Enemy","paras":["When she slays Mahishasura she is said to bear many weapons. In ancient India, people went to the ashrams and to the gurus in order to learn what these weapons are. Say Rama, and the arrow comes to mind. Say Krishna, and his discus comes to mind, the Sudarshana chakra, and with it the conch, the Panchajanya. Each divine power has a weapon — one, or two, or three, or four. There are many. Vishnu has his. Subrahmanya is called the lord of the spear, and the one who holds the staff. Hanuman too has weapons. He holds a mace, and it is said that a single stroke of that mace breaks even mountains into pieces and grinds them to powder.","Why should they need weapons? All of these are symbols. Outwardly, in a battle, there is a sword and a shield, and stranger instruments as well — something like a ball covered with thorns. They are the weapons that finish the inner enemies. Those enemies are in us, and Kundalini Mother is in us. Bearing the weapons, she brings that end about.","The Sudarshana chakra means seeing clearly. Through the chakra of the third eye, ignorance is cut away. What removes ignorance is the Sudarshana. Of Vishnu's two weapons, one is the conch and the other is the discus. The discus is the opened third eye, seeing well. The conch is sound, the nada of sound, and sound too is a weapon.","During the First World War, in Russia, many psychic experiments were made, and many experiments in parapsychology, among them experiments with sound. Without anyone knowing, ultrasonic waves were created — sounds that cannot even be heard — and sent upon the enemy camps, so that the soldiers would fall into depression, be seized by fear, and be unable to sleep. The experiment succeeded. It was used in a negative way, to stop an enemy: upon bases of war, upon an enemy kingdom, waves of sound were turned as a weapon. The same waves that can lift us can also drag us down.","She carries many weapons because Mahishasura will not keep one form. Once he is the buffalo. Before the trishula can pierce him, he has taken another form inside. He comes as a man, with a sword. He takes many forms after that. He becomes a lion. He becomes an elephant. It is said that he came in four forms, and so she begins to use the weapons, one after another.","The principal weapon is the trishula, and it came to her from Shiva, who bears it. The Sudarshana chakra came from Vishnu. The vajra, the thunderbolt that Indra holds, was given by Indra. The bow and the inexhaustible arrows came from Vayu, lord of the wind. The sword came from Yama. The mace was taken from Kubera. The shakti, a weapon like a spear, came from Agni. The noose and the conch were given by Varuna. The axe was given by Vishwakarma, the craftsman of the gods. With her eighteen arms she bears them all.","A change of form is the six inner enemies changing form. This is what the mind does. Its movements can look wholesome, and it changes shape so that we fail to recognise it. We think: all the anger in me left today. It has only changed face. It is still inside. The Mahishasura in us does the same, and we cannot even detect him. There is a stranger within, arriving in disguise. He is in everyone, including those who meditate.","Mahishasura also climbed Meru and sat in tapas at the summit. He too is a meditator, and the six are complete in him. Tamas is full, and rajas is there. Until those depart, and the defect of sattva with them, he cannot cross the three gunas or receive from the Mother what he is meant to receive. Kundalini awakening is not mere alertness. The whole process has to happen inside. In every meditator an inner war goes on. This Shakti takes the leading role, and in each chakra one inner enemy comes forward."],"minutes":6,"words":683},{"title":"Three Defects · The Trishula and the Fourth","paras":["While we are at the Muladhara, the struggle is physical. It is survival. Enemies of that kind can be conquered when this Shakti is being known, when she is moving, when the awakening is happening at the level of the body.","Then comes the Swadhisthana, called the chakra of maya. Everything there is emotion, the surge of feeling. Dramas arrive — emotional dramas — and we are caught in them, badly caught. They do not end.","Crossing that centre, we come to the Manipura. Here we are meant to shine like a jewel. The Manipura has to blossom. What lives in it has to go: the trait of being the victim, the traits of the one who harms, the quality of injuring everyone, the principle of violence.","In each centre the Mother herself, as Shakti, fights. It is spoken of as a fierce battle. After the Anahata, the heart centre, is crossed, the movement enters the Vishuddha, the centre of the throat. Up to the Vishuddha she is Aparashakti. That Aparashakti then becomes Parashakti. Once the Ajna is crossed, she is Parashakti in a great measure. The Mother joins the Father. It is consciousness — pure consciousness.","Mahishasura, and the Mother who overcomes him, also mean mastery over animal nature. There is a great deal of it in us. Animals are not being slighted: they live by survival and carry many fears, and so do we. For the sake of survival there is room to slip into violence. When an animal is afraid, it attacks, and out of that fear it does harm.","We walk toward a snake and assume the fear is ours. In fact the snake is afraid of the human being: do not come near. If someone approaches without knowing, it bites. The violence is born from the fear, and fear is a form of ignorance. Those who are in knowledge cross fear first. As our own nature is known, fear is the first thing to leave.","Human beings carry the same animal nature. Tamas, rajas, and sattva, three defects, have hold of the jiva, the living being. Even a person strong in sattva comes to a defect: no one is as good as I am; I alone am good; everyone else is wicked; this whole world is wicked. He declares it to himself. This too has to be crossed. Mahishasura Mardini means the Shakti that removes all three.","Tamas comes first. Whatever is tied to bare survival, she breaks apart. Through tamas comes sleep, unconsciousness, a complete laziness, postponement, procrastination: I will do it tomorrow, tomorrow, tomorrow. We keep postponing ourselves. Rajas seizes us as well. Only the person who has crossed these understands. The body is needed, and while it is here the three are here and the experiences keep coming. Living beyond the three gunas means staying in the play, in contact, and yet not clinging.","As Kundalini Mother she abides in the Muladhara, and there she is first present as retas, the vital essence. The eight bodily constituents are spoken of alongside her. Eight arms name the Divine Mother who bears eight. Eighteen arms mean the five organs of knowledge, the five organs of action, and the eight constituents: the Mother present through all of them, the divine power that rules them. We have long heard of the seven dhatus. Speaking of them in the body, he names rasa, the plasma; rakta, the blood; mamsa, the muscle; medas, the fat; asthi, the bone; majja, the marrow; and shukra, the reproductive essence. When these are present, and rightly present, they become retas. Retas becomes ojas, the vital splendour. Ojas becomes tejas, radiance. Kundalini Shakti is first retas, then a great power as ojas, then light as tejas.","At the end she slays him with the trishula, and this too is a symbol. The trident speaks of the fourth state, the state that has crossed the three gunas. That is the inner meaning of the weapon. With it she destroys the three defects in Mahishasura, and the Kundalini Mother does the same in us. So we turn toward the state beyond the three gunas.","If the Shakti that supports this entire creation is not known, there is no spiritual progress. She has to be known. She is everywhere, and she is in us as Kundalini Shakti. Knowing her is not difficult. Whoever meditates comes to the experience of this Devi Shakti."],"minutes":7,"words":736},{"title":"Triputi · Waking, Dream, and Turiya","paras":["We also call this Mother, this Shakti, Triputi. Triputi means that she governs three states. The waking of every living being is under her. The dream of every living being is under her. The deep sleep of every living being is under her. All three rest in her charge.","In the waking state we are called Vishva Purusha, the person of the universe. Whatever is in the Brahmanda, the great cosmos, is also in the Pindanda, the small cosmos of this body. What is in the macrocosm is what is in the microcosm. The name Vishva belongs only to the waking state. Enter the dream, and we are Taijasa Purusha, the person made of light. Enter deep sleep, and we are Prajna, the person of wisdom. She presides over all three. That is why she is Tribhuvaneshwari, and why she is Triputi.","The sadhana of Triputi is to cross the three and enter Turiya, the fourth. For a meditator this is made simple. We travel the three states. Waking is familiar. In dream the subtle body is awake, and dream-experiences come: experiences of meditation, astral experiences, a conscious dreaming. All of that belongs to the dream state. When that too is crossed, we enter deep sleep as Prajna. There, nothing is known. We do not know that we are meditating. We do not know how much time has passed. We do not even know whether we are present. Nothing else is known.","Sometimes a meditator crosses all three and enters Turiya. If that absorption happens unconsciously, it is sushupti, deep sleep. If it happens consciously, it is Turiya. There is only that one difference. When deep sleep has become conscious, that same state is called samadhi, and it is called Turiya. If in that condition we are not conscious, it is ordinary deep sleep.","Because she holds the three, the practice carries us beyond them, and we abide in Turiya. There, whatever has to be known becomes known. It is the state that has crossed every limit: time and space, body and mind, all three gunas, all three states. She is Tripurasundari, the beauty of the three cities. Another name of our own Atman is Tripurasundari. She herself is Tribhuvaneshwari. The Mother has many names. Each context, each situation, each experience, drew one name, when a yogi or a rishi saw her in that way. We are not to be confused by the names. It is one Shakti. This is what a meditator has to know."],"minutes":4,"words":416},{"title":"The Sadhaka's Path · Purity, then Awakening","paras":["The first thing meditation brings is an experience of Shakti. A vast, measureless power is invoked in us. After that, the root power — Parashakti as she sleeps, dormant, in the form of Kundalini Mother — is awakened. Many conditions come while the practice is going on.","At the beginning everything is waking: thoughts, and thoughts about the outer world. Then comes what can be called an altered state of consciousness. It is the dream state. Consciousness shifts. Visions arrive — colours, landscapes, things seen and not understood. Sometimes a rishi appears, and there is no knowing why. We are sitting here, and it feels as though we are somewhere else. A company of rishis seems to meet us and to give messages. These are dream experiences. They are experiences of the subtle body. The gross body corresponds to waking. The subtle body creates the dream. Deep sleep is seen from the causal body. The Shakti who holds all three in her charge is Parashakti. In meditation we come to experience her, and she carries us past the whole arrangement into Turiya.","The weapons of this day are for the meditator as well. Certain weapons come as a gift. They are not held in the hand on the outside. They come inwardly, for victory over the inner enemies. We do not attack anyone. We do not strike back. We do not take up an outer war. The war is inside, and there is a great deal in there that has to be faced. The obstacles are like speed-breakers on a road. Or they are like the high jump of school days: one jump, then the bar raised a little, then another jump. Each crossing reveals, at a subtler level, a larger asura within. Mahishasura is a very great one. The Mother destroys him, and she destroys him with the trishula.","Destruction, for the meditator, means absorption. The asuras in us dissolve. They enter laya. In that Shakti, in that consciousness, the inner enemies and the inner blocks merge, one by one, and disappear. That feeling is the inner meaning. Meditation first creates inner purity. Only after purity comes inner perfection. After shuddhi, purity, comes siddhi. After siddhi comes buddhi, awakened intelligence. First the purified one, the shuddha. Then the perfected one, the siddha. Then the awakened one, the buddha. A meditator grows through these states, and the growth happens through Shakti. These nine days have been set apart for this. See how much it matters.","Ahankara, the I-sense, is a very great inner enemy, and subtle ahankara is greater still. Gross pride can be seen from outside. People say it plainly: you are full of ego. Then we notice. Often we do not know it is in us at all. Subtle ahankara is so fine that its presence is unknown, and it too has to be purified. The state to be reached is freedom from ahankara and from mamakara, the sense of mine."],"minutes":4,"words":493},{"title":"Four Stages · Salokya to Sayujya","paras":["The Upanishads give a map. First, salokya: being in the same world. To know this Mother we must live in the loka where she is, and for that the fitness has to be earned. Meditation itself is the fitness. That is salokya. Then samipya, nearness: we draw closer to that Shakti.","Think of a Guru. First we hear of him, and the wish arises: I must meet him. Meeting him requires a fitness. The moment we arrive, he asks one thing: what is your question? We freeze. A thousand questions are waiting, and there is no time for them. He allows one question. A filter has to be passed. Fumble there, and he turns us away. Salokya is the earning of that fitness. To sit near him and learn, we have to be ready. It is like school. The earlier classes have to be completed before the tenth can be entered. In the same way, once a meditative state has come, salokya deepens into samipya and we move closer. Practice brings us closer still. We serve the Guru. Or we serve in the ashram, given over to seva.","Then sarupya, likeness of form. The manifestations of the Mother, her form, her qualities, are inculcated in us. We fill ourselves with them. The same happens with a Guru, and with Sri Krishna. His qualities enter us. Love toward everyone, a love without limit. When the cows appear he plays the flute. So much love in him toward Gomata, the mother cow: love, and love without end. Taking those qualities into ourselves is sarupya. In the language of our time it is role-modelling. What the Guru did, we also do. He practised meditation. If he sits for three hours, we sit for four.","Every disciple is to become a Guru on some day. In this world there are only two kinds of people: those who know, and those who do not. The ones who do not know must go and learn from the ones who know. Sayujya means you yourself become that. You become the Guru, and the sadhana continues.","The same four belong to Kundalini Mother. In salokya some fitness has been met and the practice is going on, but without devotion and attention — without vinaya, humility — it does not hold. Then samipya, then sarupya, then sayujya: we become as she is. At first what we see feels other than ourselves. Sayujya is oneness. She herself is you. You have become the Mother. Every meditator comes to this.","Today the four are practised, not only explained. Everyone wants a vision of the Mother, and it is said that she has no form and no name. We gave the names. If they are not known, Amma is enough. However she is called from the heart, she answers. She is Mother to everyone, Mother even of mothers, because she is the Mother of this creation. The process is simple. We try it now."],"minutes":4,"words":492},{"title":"Devi Samarpan · The Four Gears","paras":["We begin with Devi Samarpan, the offering of oneself to the Mother. It is sharanagati. New friends are joining each day, so the practice is repeated for them. Someone may have come today for the first time. Toward that Shakti we are to be entirely in the feeling of offering, entirely in refuge. Kundalini Mother is already in us.","Even the way of sitting gives her importance. This is called Lakshmi mudra. Seated cross-legged, place the left leg on the right — outside, or above. The left leg rests upon the right. Then the breath: the left nostril, Chandra nadi, the lunar channel, and Chandra svara, the lunar current of the breath. That current is what leads us. Through it, draw the air in nine times, one inhalation after another, with no exhalation between them. Do not draw too deeply. Slowly: one, two, slowly. If the breath is quiet, all nine can be taken. Then hold gently.","Now join the hands in namaskara. In this land, namaskara is the culture itself. The two palms meet. What is held in that gesture is the feeling that I and you are one. Namaskara means Advaita. I, and the one before me, are not two. I bow to you. I bow to the Atman in you. To this Mother we say: I take refuge.","Slowly lower the head. Bend. The I-sense is surrendered completely. Everything is placed at her feet. This is samarpana. With the exhalation, releasing the air slowly, the floor may be touched. If it cannot, touch the ground with the hands. Stay there. Hold the breath out. Do not breathe in. Inwardly, in the mind alone, repeat Shrim nine times. Then slowly raise the head, bring the spine straight, and return to the first position. This is done nine times. That is Devi Samarpan. Those who finish — having offered pride, the sense of mine, and the blocks at her feet — sit in silence. The others complete their nine.","Then the four states are entered in the body, not only in explanation. Salokya, samipya, sarupya, sayujya. You are seated. You will sit in four directions, in four ways, like the four gears of a car.","For salokya, change posture and direction. Shift a little, and sit facing one way. This is the first gear, the gear of eligibility. To be fit for Lalita, for Tribhuvaneshwari, for the Mother of many names, what is required is devotion, attention, humility, and obedience. For one minute, eyes closed, feel the Kundalini Mother in you. Salokya here means a complete focus on the Shakti that drives us, drives the breath, and drives the whole creation. If attention, on a scale from one to ten, is sitting at five, move it to six, to seven, then eight, nine, ten. The offering has just been made. Now be joined to her.","Shift into the second gear. Change the direction, and sit another way. This is samipya. We are drawing near. The vibrations increase. If the Mother is close, how does that feel? She has no form. When that nirguna Shakti, the power without attributes, appears as saguna — with a name, with a form — and we are near, what is the feeling? Feel it completely, and remain in samipya for one minute. Going to the Himalaya, we meet the cool winds and drink them in. The coolness touches the skin. The vibration touches us. Nearness to this Adishakti, this Parashakti, is like that. The vibrations become known because we are close. She is not elsewhere. She is in us, and until now she was unrecognised. Recognise her. Come a little closer. The step is ours. We keep waiting for her to come to us. Let us go to her, as a child runs to the mother — Amma, Amma, Amma. We have to run.","The third direction is sarupya, the third gear. Change the posture again. Whatever qualities are hers, whatever vibration, whatever form of Shakti, integrate them within. The feeling of this third state is that she and we are not other. Her qualities are filling us. As Aparashakti, this same power is of use in ordinary life. Many things can be brought into being through her. Many obstacles can be removed. Victories come through this Shakti alone. Tune to her completely, and then more completely.","The fourth direction is sayujya. Change once more. Sayujya means that you become the Mother herself. Put on the form of the power on whom this creation runs: Mahishasura Mardini, the trishula in her hand, many weapons, eighteen arms. We too hold the trishula. The trishula is tamas, rajas, and sattva crossed — the state beyond the three gunas, and the state beyond waking, dream, and deep sleep, which is Turiya. Become the Mother who bears it.","Tune completely. Until now the Mother was seen from outside. Now let Mother and ourselves be one. Once, we were one. As an infant in the womb, as an embryo, we were not other than our mother. We are in that same state of ekatva, oneness. Become that Mother. Observe the energy. In the hand, symbolically, imagine a trishula, and feel what it is to hold it. Remain in this feeling: I am the Shakti who has crossed the defects of tamas, rajas, and sattva, and who stands beyond the three gunas. I am the Shakti who has crossed waking, dream, and sleep, and who stands in Turiya. The Mother and I are one. Stay in that energy, in that posture, for one minute. Then, slowly, return to the waking state."],"minutes":8,"words":931},{"title":"The Hymn · The Surge Is Not Danger","paras":["Harika then offers a hymn to Sri Rajarajeshwari. The line that returns asks the compassionate Mother, she whose nature is pure consciousness, for protection: Sri Rajarajeshwari sadaye chinmatrike pahi mam. She is addressed as Tripurasundari in the chakra that is all bliss, as Shiva-Shankari of peaceful essence, as the one formed of the five Brahmas, and as Satchidananda. He receives the hymn and turns to those who wish to speak.","One friend says that speaking with him feels like good fortune. For a long time he has been singing a song whose words are salokya and samipya — are these not of this very world? — and no one had ever told him what the words mean. Today the meaning arrived, and the joy with it. He speaks also of Durga. He had watched cocks, and other animals, being sacrificed before her, and had lived with the feeling: why should she be worshipped at all? Across these nine days, and in the detail of this class, he has been learning who she is. Every day he is practising with the feeling of samarpana. He says he will come of his own accord on the 24th of November, to serve. He is welcomed. Come. Seva is the way.","Dhana speaks next. He met Dr. Newton in person for the first time in Hyderabad, at the national gathering for ahimsa, non-violence, and the meeting itself made him happy. These six days of class he is able to feel, and he is taking up what has been said. There is ego even at the subtle level, and in the sadhana of offering, a great part of it leaves. With his mother he is now able to speak without violence. A real connection is forming. Even when she scolds, somewhere in it there is love, and if that love is held, the connection becomes easy.","His question is about the beginning of meditation, and about the udvrtti, the upsurge. He used to be afraid when it came. What is this? At that time the knowledge was not yet in place. He would be frightened, and he would scold himself: why is this Shakti giving so much trouble? Now, however strong the upsurge, he is happy. However much force arrives, it feels as though something is being repaired, and he is at ease. The Mother who slew Mahishasura — are these inner blocks even worth counting? They will go. To that extent he has surrendered, and the fear is no longer there. Even in sleep, dreams are coming, and he is watching them clearly. The practice of the gears, from the first through to the last, went completely in. It amazes him.","Dr. Newton answers that the knowledge being learned is being integrated. First there is shravana, hearing. Then manana, reflection. Then nididhyasana, deep contemplation. What is learned has to become anubhava, a lived experience, an inner feeling. Only when it arises inside is it truly gained, and that is why these states are being reached. However intense the upsurge, a great understanding has come with it: this is not danger. It is a safe feeling — the safest feeling of all. Many people are badly afraid of the surging of Parashakti, badly afraid of the rising of Kundalini. She is the kindest master. She is a master with the quality of a mother. The integration is wonderful.","A smaller doubt follows. While the process is happening, the body grows tired. He tells himself he will get up and sit again, and the moment he thinks it, relaxation comes. It feels as though he is being told: all right, come back; we will see each other again. Is this all right? It is all right. After a deep state, the pull to return to the outside is natural. What is asked is that the moment be prolonged — one minute, two minutes. Do not come out at once. Remain a little, and return gradually. Never snap back into fear, and never come back in a hurry. It is a brink. The moment is very precious. Sometimes it has to be held. We speak of walking one extra mile. In sadhana, one extra minute. The level of tolerance has to rise. It will feel like time to come back. Wait one minute more. In that single minute, a great deal happens."],"minutes":7,"words":725},{"title":"Anand and Mallareddy · Everything Is Joy","paras":["They had met the day before yesterday, at the great assembly of meditation on ahimsa. Dr. Newton asks that an experience from that day be told to everyone. He and Lakshmi were to give a class there, on non-violence and on a vegetarian world. Harika came, and Pavan came. A car had been brought to take them. The car would not run. Time was short, and in Hyderabad the journey to that place takes forty-five minutes, or an hour. A cab was booked.","Harika asked the natural question. We are going with a good resolve. Why has it happened like this? There is a reason for everything. Such happenings are co-created events, and they are extraordinary. Wait, and see. Simply accept. They got into the cab and went. The driver was under heavy stress. For about ten minutes he was on the phone with someone, speaking in distress. Then the conversation in the car turned to the assembly, and to meditation. It reached his ear. His name was Anand. At once he began to ask questions. My brother-in-law is always talking about meditation. I never really attended to it. I never gave it my mind. He had told me he was coming to Hyderabad, and that he would be at this vegetarian gathering for meditation. You are going to the very place he is going. I will come too.","He was invited to sit in the class for an hour, and he was there while the class was given. Meditation was conducted. When it was over, Anand said: from today I am leaving meat. He had been a meat-eater. What he had seen in the meditation was that animals too are small children. He himself has a child of three. When an animal is killed for food, that animal also loses a family. He declared it. From today, vegetarian food. He had other cab bookings waiting. He did not accept them. He stayed until the programme was finished, and he drove them home.","What astonished them was the way the universe works. It changed the design. They were meant to travel in their own car. Why it failed, they still do not know: the battery was down. For all of this to arrange itself around Anand — what merit he has brought, how fortunate he is, through how many births — the plan was rewritten so that a real transformation could happen in him that day. We call certain events bad. There is no bad. It had to happen in that way. Co-created events are a wonder. This Shakti keeps driving all of it, and none of it should be interpreted through the mind. Seen with the vision of the Atman, it is simply astonishing.","Anand said, that same day, that he would meditate, that from then on his food would be vegetarian, and that he was taking up the practice. All the stress in him had gone — completely. Until then he had been in such a state that life itself felt as though it should end. Financial stress, debts, bank loans, trouble upon trouble. The stress left.","Mallareddy then speaks. From the first day he came, from the Inner Child programme, a transformation has been under way, and it has been wonderful. In the inner life of that discipleship he learned a great deal, and in Family Constellation he learned still more. He used to arrive with a feeling: if I come to you, you will heal me, and in a single day, in a single moment, I must be changed. That feeling was not right. He has come instead to the state in which he himself does the healing. The healing is happening. He understands his own condition. He is meeting every moment with joy, growing each thing joyfully, doing his own healing. Across these nine days it has also become clear how the six inner enemies work, how they are to be gone beyond, and why, in the midst of meditation, they attack even more. Inside the attack itself, the way of facing it, the way growth is asked for, the way healing is done — all of this has become clearer. He offers his gratitude.","Face it with joy. On the very first day it was said: these nine days we are in the state of ananda. Ananda, practised. Practice happens, and joy happens. Practise joy, and there is still more joy. Everything is ananda.","The hour has reached half past seven. What remains can be taken tomorrow, which will be easier for everyone. Early in the morning we meet again, and Surya is asked to share the screen."],"minutes":7,"words":774}];
