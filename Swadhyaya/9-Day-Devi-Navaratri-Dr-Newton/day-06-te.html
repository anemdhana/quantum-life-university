టమైన విషయం ప్రతిరోజు ఒక ప్రాసెస్ తో క్లోజ్ చేస్తూ ఉన్నారు.","అండ్ ఈ జ్ఞానాన్ని మనము ఎంతో చక్కగా జీవితంలో ఎలా ఆచరణలో పెట్టాలో కూడా చెప్తూ ఉన్నారు. సో ఈరోజు కూడా ఆ జ్ఞానం తీసుకోవడానికి అందరూ సిద్ధమే అనుకుంటున్నాను. మన సిద్ధం అవ్వడానికి ముందు మనం ధ్యానం చేయాలి జ్ఞానాన్ని స్వీకరించాలఅంటే ఖాళీ పాత్రగా తయారవ్వాలి. సో అదే చేద్దాం ఈరోజు మనం ప్రతిరోజు లాగానే 40 నిమిషాలు 45 నిమిషాలు ధ్యానం చేద్దాం ఆ తర్వాత జ్ఞానాన్ని స్వీకరిద్దాం. చక్కగా అందరం సుఖాసనంలో కూర్చుందాం. కాళ్ళు రెండు క్రాస్ చేసుకొని వేళ్ళలో వేలు పెట్టుకొని కళ్ళు రెండు మూసుకొని ఒక చిరునవ్వుతో చక్కని సంగీతం తింటూ మన మనం అంతర్ముఖులం అవుదాం.","మనలోకి మనం ప్రయాణిద్దాం. శ్వాసని గమనిద్దాం. సహజంగా జరుగుతున్న ఉచ్వాస విశ్వాస ఆలోచనలు వస్తే తిరిగే ఒక చిరునవ్వుతో శ్వాస మీదకి ధ్యాస తీసుకుంటాను.","యోగ నిద్రలోకి వెళ్తున్నట్లయితే తిరిగి ఎరుకతో ఉందా చే 40 నిమిషాల పాటు మరే పని లేదు ఆలోచన శ్వాసతోనే మన పని గమనించడమే మన పని ఓం ఆ ఆ ఆ ఆ ఓం ఓం ఓం ఆ ఆ ఓం ఆ ఆ ఆ ఆ ఓం ఆ ఓం ఆ ఆ ఆ ఓం ఓం ఓం ఆ ఓం ఆ ఆ ఆ ఓం ఓం ఆ ఓం ఆ ఓం ఓం ఓం ఆ ఓం ఆ ఓం ఆ 10 నిమిషం ఈ ఆఖరి 10 నిమిషాలు మన నా కర్పాన్ని జ్ఞానాన్ని లోక కళ్యాణం ఎంతో అద్భుతమైన ఒక కళ్యాణ కార్యం చేస్తూ ఉన్నారా పిరమిడ్లో అతి త్వరలో ఈ భూమిమీద ఆవిర్భవించి ఈ సహస్రార రం యొక్క జ్ఞానపు వెలుగు ప్రపంచమంతా స్కరించి ప్రతి ఒక్కరిలో ఐక్య భావాన్ని తీసుకురా ఈ భూమండలం అద్భుతమైన మైన దివ్యమైన మండలంగా తయారవ్వాల ప్రతి జీవరాశి అందరూ సమైక్య భావంతో ఉంటూ ప్రకృతితో అనుసంధానం అవుతూ అనుతనం మనకు తెలుసు అవుతూ ఆత్మ జ్ఞానంతో మెలగాలని సంకల్పిద్దాం.","ఓం ఆ ఓం ఆ ఆ అద్భుతమైన సంకల్పాన్ని ఎంతో నమ్మకంతో విశ్వానికి విడుదల చేద్దాం. అతి త్వరలో ఈ సంకల్పం సాకారం అవుతుందని పూర్తి విశ్వాసం ఉంచుకుందాం. 2027 నవంబర్ 24న ఈ సహస్రారా మనమంతా కలిసి ఇగ్నామిరేట్ చేసి అందులో సామూహిక ధ్యానంతో సంకల్పం యొక్క సరైన లక్ష్యం నాటకం మొదలవుతుంది ఈ శక్తితో ఈ ఆనందంతో తిరిగి మీ ధ్యాసన్ని శ్వాస మీదకి తీసుకోండి. ఉద్యక్షించాల పాటు ఆ ఆ ఓం ఓం ఆ ఓం ఆ ఆ ఆ నాశతో అనుసంధానమై ఉందాం.","హల్లెలూయ ఓం ఓం ఓం ఓం నాకరి ఒక్క నిమిషం శ్వాసతో ఉన్నారు మై సెకండ్ అది సెకండ్ ఐదు నాలుగు మూడు రెండు ఒకటి సున్నా నెమ్మదిగా మీ చేతులు రెండు కొద్ది క్షణాల పాటు కళ్ళ మీద ఉంచుకొని ఒక చిరునవ్వుతూ కళ్ళు రెండు మెరుపుదాం. అందరికీ మరొక్కసారి స్వాగతం ఈరోజు దేవీ నవరాత్రిలో ఆరవ రోజు అండ్ మనం గత ఐదు రోజుల నుంచి ఎంతో అద్భుతమైన జ్ఞానాన్ని తెలుసుకుంటూ ఉన్నాను.","క్వాంటం లైఫ్ యూనివర్సిటీ వ్యవస్థాపకులు డాక్టర్ న్యూటన్ కొండరెడ్డి గారి నుంచి మరి ఆయన మన రూ ఈ జ్ఞానోదయం ప్రోగ్రాం మొత్తంలో ఏవేవైతే ఇన్సైట్స్ రియలైజేషన్స్ మేమంతా షేర్ చేస్తున్నాము ఇదంతా కూడా న్యూటన్సర్ లక్ష్మీ మేడం వారిద్దరి నుంచి నేర్చుకున్నదే ఈ క్వాంటం లైఫ్ యూనివర్సిటీ నుంచి మరి ఆయన నుంచి డైరెక్ట్ గా వినగలగడం ఈ నవరాత్రుల్లో దశమి దాకా కూడా మనందరి అదృష్టం చక్కగా మన ఆనందాన్ని ఒక చిరునవ్వతో వ్యక్తపరుస్తూ డాక్టర్ యూటన్ గారిని స్వాగతించుకుందాం థాంక్యూ సో మచ్ సర్ నథింగ్ హర్ టుడే","ఓవర్ టు యు థాంక్యూ హారిక గారు థాంక్యూ మై డియర్ ఫ్రెండ్స్ శుభోదయం జ్ఞానోదయం సో ఆరో రోజు ఈ నవరాత్రుల్లో మనం ఈ క్లాసులు నిర్వహించుకోవడం ప్లస్ దానికి సంబంధించినటువంటి సాధన లో ఉండడం ఆ ఎనర్జీ స్టేట్ లో మనం ఉండడం అనేది చాలా ముఖ్యం ప్రతిరోజు దీని గురించి మాట్లాడుకుంటున్నాం.","ఏ శక్తి అయితే ఈ సర్వ సృష్టిని నడిపిస్తుందో ఏ శక్తి అయితే లేకపోతే ఈ సృష్టే ఆగిపోతుందో ఆ శక్తిని గురించి అనుభవపూర్వకంగా తెలుసుకునే ఆ సాధన గురించి మనం చెప్పుకుంటున్నాం. ఆ ధ్యాన సాధన మనకు కావాలి. మన పురాణ గ్రంథాల్లో పౌరాణిక గ్రంథాల్లో చెప్పబడిన ప్రతి ఒక్కటి కూడా ఒక జ్ఞాన స్వరూపం ప్రతి అంశం కూడా ఒక గొప్ప ఆధ్యాత్మిక శాస్త్ర జ్ఞానం తెలియజేయబడింది.","సౌందర్య లహరిలో ఆదిశంకరాచార్యుల వారు చెప్పారు శివ సత్యాయుక్తో యదిభవతి సక్తః ప్రభవితం అంటే ఆ శక్తి లేకపోతే శివుడు కూడా ఎక్కడికి కదలలేడు ఏమి చేయలేడు ఈ జగన్మాతే ఈ తల్లినే ఆమె లేకపోతే ఈ త్రిమూర్తులు కూడా లేరంట ఆ బ్రహ్మదేవుడు కూడా ఆమె పాద రేణువు ఆ చిన్నది ఏదో తల మీద పెట్టుకున్నాడు కాబట్టి సృష్టి అంతా చేస్తున్నాడుంట బ్రహ్మ కూడా ఈ త్రిమూర్త తత్వం కూడా ఈమలోనే ఉంది ఈ జగన్మాతలోనే ఉంది. ఈ పరాశక్తిలోనే ఉంది.","సో మనమందరం కూడా ఆ జగన్మాత ఏ శక్తి గురించి ప్రతి ఒక్కరు కూడా అర్థం చేసుకోవడానికి ప్రయత్నం చేస్తుంటారో ఆ శక్తి గురించే ఈ సాధనలన్నీ కూడా ఈ నవరాత్రి సాధన ఒక శ్లోకం చెప్పబడింది అదేంటంటే నమంత్రం నో యంత్రం తదపి చన జానే స్తుతిమ మహో అంటే నాకు మంత్రం రాదమ్మా తల్లి యంత్రం రాదు తంత్రం రాదు ఏమి రాదు నేను నాకేమీ తెలియదు నీ పేరు చెప్పాలన్నా నాకు తెలియదు నచవానం ధ్యానం తదపి జాన జానే స్తుతి కదా నిన్ను ఎలా స్తుతించాలి నీ పేరు కూడా నా నోరు తిరగదు చాలా పేర్లు ఉన్నాయి ఆవిడకి త్రిభవ భువనేశ్వరి అనే","పేరు కూడా ఉంది ఒక పేరు ఆ పేర్లు కూడా పలకడం రాదమ్మా నాకు ఎలా స్తుతి చేయాలో నిన్ను తెలియదు నజానే ముద్రాస్తే తదపిచన జానే విలపనం పరంజానే మాతస్వ అనుసరణం క్లేషహరణం ఓ తల్లి ఓ జగన్మాత ఆ తల్లి దయామయి కరుణామయి మన గురించి తెలుసు మనకి ఏమీ తెలియక్కర్లే ఆ తల్లికి మనం సరెండర్ కావాలి.","ఆ శక్తికి సరెండర్ కావాలి అంతే ఆ తల్లి చూసుకుంటుందనే ఆ నమ్మకం కావాలి ఆ శరణాగతి భావం కావాలి. మనకు పూజలు చేయడం రావక్కర్లేదు స్తోత్రాలు చదవడం రావక్కర్లేదు నేను మనం ప్రారంభ దశలో ఉన్నామ అనుకోండి ధ్యానంలో అయినా కూడా ఈ తల్లి మనకి హెల్ప్ చేస్తుంది ఆమె కుండలిని మాతగా కుండలిని శక్తిగా మనలో ఉంది. మనం మహిషాసుర మర్ధిని గురించి చెప్పుకుంటున్నాము ఈరోజు ఆరో రోజు సో నిన్న మనం చెప్పుకున్నాం ఎలా ఈ మాత ఈ జగన్మాతే మహిషాశుల మధ్యనే ఆ రూపాన్ని ధరించి ఎన్నో శక్తులు ఆమెలో ఐక్యమయ్యాయి దేవతా శక్తులు ఆ శక్తులన్నీ కలిసి ఒక పెద్ద శక్తిగా ఆవిర్భవించాయి.","ఆవిర్భవించి మరి అష్టాదశ భుజాలతో ఇవన్నీ కూడా సంకేత రూపంలో తెలియజేయబడింది ఆ మహిషాశుని వధ చేసింది. సో మహిషాశుడు పుట్టిన తర్వాత ఫస్ట్ ఒక విషయం చెప్పారు అదేంటంటే ఆయన మేరుగిరి మేరు పర్వతం శిఖరాగ్రంలోకి వెళ్లి తపస్సు చేశాడంట అక్కడికి వెళ్లి ధ్యానం చేశను దీని సంకేత రూపం తెలుసుకోవాలి.","సో అంతర్శత్రువులైనటువంటి అర్షడ్ వర్గాలఅన్నీ కూడా మనం నిన్న చెప్పుకున్నాము ఆరుగురు రాక్షసులు రాయిభారాన్ని పంపించాడు ఈ మాత దగ్గరికి తను మోహించాడు అంటే ఆ జగన్మాతను తెలుసుకోవాలనే ప్రయత్నం చేశాడు అన్నమాట రాయబారను పంపించాడు కానీ ఇవన్నీ అరిషడ్ వర్గాలు ఇన్నీ తొలగిపోతేనే గాని ఆ మాత దగ్గరగా వెళ్ళలేడు సో ఆ మాత అన్నిటిని సంహరించేసింది ఆ శక్తియే అరిషడ్ వర్గాలను తొలగించేసింది.","మనలో ఉన్న అంతరంగా దాగి ఉన్నటువంటి ఎన్నో శత్రువులు ఉన్నారు ఎన్నో బ్లాక్స్ ఉన్నాయి మనలో కామ క్రోధ లోభ మోహ మదమాత్సర్యాలు అన్నీ కూడా మనకు తెలియకుండానే ఉన్నాయి మనం అంతా బాగుంది బాగుంది అనుకున్నా కూడా ఇవన్నీ ఉంటాయి. అంతర్శత్రువులపై విజయం సాధించడం ఇది ఈ శక్తి ద్వారానే జరుగుతుంది. ఈ ఏ శక్తి అయితే మనలో నిద్రాణంగా ఉందో దాని ద్వారానే జరుగుతుంది. సో ఈ మహిషాశురుడు ఆ మేరు పర్వతం శిఖరాగ్రంలో ఉండి ధ్యానం చేయడం అంటే కూడా ఒక సంకేత రూపం ఇది మేరు పర్వతం అంటే ఏంటి అదిలో కూడా మేరు పర్వతం శిఖరాగ్రంలో కూర్చుని ధ్యానం చేస్తాడు.","అంటే ఈ మేరు పర్వతం అంటే మేరుదండం అంటేనే మనం వెన్నుపూస మేరుదండం అంటేనే వెన్నుపూస శిఖరాగ్రం అంటే సహస్రారం సహస్రారం అంటే సర్వం కల్విదం బ్రహ్మ ఆజ్ఞా చక్రంలో అహం బ్రహ్మాస్మి నేను దేవుడిని అని తెలుసుకుంటాం సహస్రారంలో అందరూ దేవుళ్ళ అని తెలుసుకుంటాం ప్రతి ఒక్కళ్ళ దేవుళ్లే నేను ఒక్కడినే కాదు అందరూ దేవుళ్లే ప్రతి ఒక్కళ్ళు దేవుళ్లే విలన్ పాత్ర పోషించే వాళ్ళు కూడా దేవుళ్లే ప్రతి ఒక్కళ్ళు దేవుళ్లే అసురులు కూడా దేవుళ్లే లోపల ఉండేది ఓన్లీ దివ్యత్వమే అసర గుణాలు ఉన్నాయి అంతే సో ఇది చాలా చక్కగా సంకేత రూపంలో వేదవ్యాసుల వారు తెలియపరిచారు మనకి ఒక చిన్న స్టోరీలోనే ఎన్ని డైమెన్షన్స్ ని ఎన్ని కోణాల నుంచి ఎన్ని సంకేత రూపాల్లో ఎంత మహా జ్ఞానాన్ని వేద వ్యాసుల మహర్షి వేదవ్యాస మహర్షి మరి మనకి అందించారు.","సో మూలాధారంలో నిద్రాణంగా ఉన్నటువంటి మూల శక్తిగా ఉంది ఈ తల్లినే ఆ తల్లియే మూల శక్తిగా ఉంది. ఆ శక్తే మనం రామాయణంలో చెప్పుకుంటాం హనుమంతులు వారికి అష్టసిద్ధులు నవనిధులు కూడా సీతామాతే ప్రసాదించిందంట ఆ సీతామాతే ఈ మూలశక్తి మనం అన్ని యుగాల్లో చెప్పుకునేటటువంటి రాధామాత ద్వాపర యుగంలో రాధామాత ఇక్కడైతే సీతామాత ఇక్కడైతే మరి మహిషాశుర మర్ధిని ఈ జగన్మాత ఆ త్రిభునే ఈశ్వరీ దేవి లలితా మాత వీళ్ళంతా కూడా ఒకటే బేదభావం ఏమీ లేదు ఏ వ్యత్యాసం లేదు మూలశక్తిగా కుండలిని శక్తిగా మరి మూలాధార చక్రంలో ఆవిడ ఉన్నారు."],"minutes":8,"words":1157},{"title":"మహిషాసురుడు · మేరు శిఖరం","paras":["సో ఎప్పుడైతే మనం సాధనకు ధ్యాన సాధనకు ఉపక్రమిస్తామో శ్వాస మీద ధ్యాస పెడతామో మనం ఉచ్వాస నిశ్వాసాలు మీద ధ్యాస ఉంటుందో అప్పుడు ఈ సుషుమణ నాడి యక్టివేషన్ ద్వారా ఒక్కొక్క చక్రము ఓపెన్ అవుతుంది దాని మనకి ఒక్కోసారి కొంతమందికి అనుభవాలు కూడా రావు ఆ చక్రం ఓపెన్ అయిందని కూడా అనుభవం రాదు డైరెక్ట్ గా ఎప్పుడో థర్డ్ ఐ ఎక్స్పీరియన్స్ స్టార్ట్ అవుతాయి నాకు ఎలా తెలుసు మరి నా మిగతా చక్రాలను ఓపెన్ అయిన మిగతా చక్రాలు ఓపెన్ కాపోతే థర్డ్ ఐ ఓపెన్ కాదు.","కొంతమంది డైరెక్ట్ గా సహస్ర స్థితికి వచ్చేస్తుంది ఎనర్జీ అంతా ఇక్కడ ఆ ఈ మహిషాశురుడు ఏ విధంగా మేరు పర్వతం శిఖరాగ్రంలో కూర్చుని ధ్యానం చేశాడో అలానే చాలామందికి ధ్యాన స్థితిలో వాళ్ళు శిఖరాగ్రహాన్ని ఫీల్ అవుతుంటారు. వారి సహస్రార స్థితిని అనుభూతిని చెందుతూఉంటారు. సో ఒక్కొక్క స్థితిని దాటుకుంటూ ఈ చక్రాలు ఇవన్నీ కూడా ఆ చక్ర స్థానాల్లో ఆ చక్ర కేంద్రాలలో మరి ఆవిడే పరాశక్తిగా ఉన్నారు అపరాశక్తిగా ఉన్నారు. పై చక్రాలు ఊర్ధ చక్రాలక వెళ్ళేసరికి ఆవిడే పరాశక్తిగా మారుతారు.","ఈ సహస్రారాన్ని చేరుకున్నప్పుడు ఆవిడ పరాశక్తి ఒక విశ్వజనీయమైనటువంటి అంతటా ఉన్నటువంటి ఒక శక్తిగా మారుతారు.","కానీ ఈ చక్రాల్లో ఒక్కొక్క చక్రంలో ఒక్కొక్క శక్తి ఆవిడే అన్ని శక్తులు ఆవిడే అన్నిటికీ ఆధారం ఆవిడే సో ఇక్కడ అష్టాదశ భుజాలతో మరి మహిషాశుడు ధ్యానం చేశాడు బ్రహ్మ నుంచి ఒక కోరిక కోరాడు వరం కోరుకున్నాడు నాకు ఓన్లీ స్త్రీ ద్వారానే చావు కావాలి అంటే మరణం నాకు వద్దు అమరుడుగా ఉండాలి అని కోరుకున్నాడు అది వీలు కాదు ఎవరైనా సరే ఈ శరీరం ధారణ చేసిన తర్వాత శరీరం ధరించిన తర్వాత ఈ వస్త్ర ధారణ చేసిన తర్వాత ఎప్పుడోకప్పుడు ఈ శరీరాన్ని చేదించేయాల్సిందే ఇది అగైన్స్ట్ ద రూల్ అది నువ్వు 20 30 వేల సంవత్సరాలు జీవించిన ఈ శరీరంలో అయినప్పటికీ ఎప్పుడోకప్పుడు నువ్వు మళ్లా వెకేట్ చేసి వెళ్ళాల్సిందే ఇప్పుడు మనవతార్ బాబాజీ ఉన్నారు సశీరులుగా ఉన్నారు ఎంతో మంది ఉన్నారు శశీరులుగా చిరంజీవులుగా ఎంతో మంది హిమాలయ యోగులు ఉన్నారు.","కానీ ఎప్పుడో ఒకప్పుడు ఒక లక్ష సంవత్సరాలు జీవించినా కూడా అప్పుడు తర్వాత అన్నా కూడా వాళ్ళు ఒకానప్పుడు శరీరాన్ని చదించాల్సిందే సో ఇంకొక వరం కోరుకోమన్నాడు ఇది మాత్రం కూడద్దు. ఆత్మ స్థితిలో నువ్వు అమరత్వం పొందొచ్చు అమరత్వం నేను అమరున్నని ఆత్మకు చావు లేదు అనే స్థితిని నువ్వు తెలుసుకోవచ్చు కానీ ఈ శరీరంలో నేను ఎప్పుడు ఉండాలి అంటే కుదరదు.","ఈ శరీరాన్ని వదిలేయాల్సిందే కచ్చితంగా వదిలేయాల్సింది ఎప్పుడోకప్పుడు అప్పుడు ఆయన స్త్రీ ద్వారా నేను చావును కోరుకుంటున్నాను అంటే ఆయన అనుకున్నాడు స్త్రీ అంటే రెండు బాహ్యార్థం ప్రకారం అయితే మనం స్త్రీని తక్కువగా చూశడు అన్నమాట కానీ అంతరార్ధ సహితంగా అయితే ఈ జగన్మాత ఈవిడే త్రిపుర సుందరి త్రిభువనేశ్వరి ఈ తల్లి మాత్రమే ఆ శిఖరాగ్రహంలో ఉన్న సహస్రార స్థితికి చేర్చగలిగేది మనల్ని ఈ శక్తినే ఈ శక్తి లేకపోతే ఏమి ఒక ఇంచ్ కూడా మనం కదలలేం ధ్యానం చేయలేం ఏమి చేయలేం సో ఈ శక్తిని మరి ఆ మహిషాశుని","వధించినప్పుడు ఎన్నో ఆయుధాలని ధరించిందంట ఎన్నో ఆయుధాలు మన భారతదేశంలో ఇంతకుముందు ప్రాచీన కాలంలో ఆశ్రమాల్లో గురువుల దగ్గరికి ఆశ్రమాలకి వెళ్లేవారు ఎందుకంటే ఈ ఆయుధాల గురించి తెలుసుకోవడానికి రాముడు అంటేనే మనకి బాణం గుర్తొస్తుంది కృష్ణుడు అంటేనే ఆయన చక్రం గుర్తొస్తుంది సుదర్శన్ చక్రం లేతే శంఖం గుర్తొస్తుంది పాంచజన్యం ఒక్కొక్క దేవతా శక్తి దగ్గర ఒక ఆయుధం ఉంటుంది ఒకటో రెండో మూడో నాలుగో ఎన్నో ఆయుధాలు ఉంటాయి.","విష్ణుమూర్తి దగ్గర విష్ణు భగవాన్ దగ్గర ఉంటాయి ఆయన దగ్గర కూడా ఆయన ఆయుధాలు ఆయనకు ఉన్నాయి.","సుబ్రహ్మణ్యేశ్వ స్వామి దగ్గర చూస్తే వేలాయుధం వేలాయుధ స్వామి అంటాం దండాయుధ ప్రాణి అంటాం దండం కూడా ఉంటుంది ఆయన దగ్గర ఎన్నో రకరకాల ఆయుధాలు ఇప్పుడు హనుమంతుల వారి దగ్గరికి వెళ్తే హనుమంతుల వారి దగ్గర కూడా ఉన్నాయి ఆయుధాలు గద ఆయన గద పట్టుకొని ఉంటాడు ఒక గదతో అలా అన్నాడంటే పర్వతాలు సైతం ముఖము ముక్కలు అయిపోతాయి పిండి పిండి అయిపోతాయి ఎన్నో ఆయుధాలు ఎందుకు వాళ్ళ ఆయుధాలు ఎందుకు కావాలి డౌట్ వస్తుంది మనకి ఇవన్నీ సంకేత రూపాలు ఇవన్నీ సంకేత రూపాలు వాళ్ళు బాహ్యంగా యుద్ధంలో ఈ ఆయుధాలు ఖడ్గం ఉంటుంది వాళ్ళ దగ్గర కత్తి డాల్ ఉంటుంది తర్వాత విచిత్రమైనటువంటివి కూడా ఉంటాయి ఒక బాల్ లాగా ఉంటుంది దానికి ముళ్ళలాగా ఉంటుంది అవి కూడా ఉపయోగిస్తారు.","ఎన్నో రకరకాల ఆయుధాలు ఇవన్నీ సంకేత రూపాలు ఇవన్నీ కూడా మన అంతర శత్రువులని తుదము మొట్టించడానికి ఉపయోగించే ఆయుధాలుంట అంతర శత్రువులు మనలోనే ఆ జగన్మాత శక్తి ఉంది. నా శక్తి కుండల్ని మాత మనలో ఉంది. ఈ ఆయుధాలను ధరించి ఈ సంహారం చేస్తుంది. సుదర్శన చక్రం అంటే చక్కగా చూడడం థర్డ్ ఈ చక్రం ద్వారా అన్ని అజ్ఞానం అనే అంతా కూడా ఈ చక్రం తొలగించేస్తుంది. అజ్ఞానాన్ని తొలగించేదే సుదర్శన చక్రం. సో విష్ణుమూర్తి దగ్గర రెండు ఆయుధాలు ఉంటాయి ఒకటి శంఖము ఒకటి రెండవది సుదర్శన చక్రం చక్రం ఒకటి ఉంటుంది.","విష్ణు చక్రం రెండు అంటే విష్ణు చక్రం అంటే చక్కగా తడైద ఓపెన్ చేసుకొని చూడడము శంఖం అంటే శబ్దం శబ్దనాదం అది కూడా ఒక ఆయుధం ఇప్పుడు మొదటి ప్రపంచ యుద్ధంలో రష్యాలో చాలా సైకిక్ ఎక్స్పెరిమెంట్స్ చేశారు పారాసైకాలజీ గురించి చాలా ఎక్స్పెరిమెంట్స్ చేశారు దాని లో శబ్దం గురించి చాలా ఎక్స్పెరిమెంట్స్ చేశారు ప్రయోగాలు చేశారు.","వారు ఏం చేశారంటే శత్రువుల్ని ఎవరికీ తెలియకుండా అల్ట్రాసోనిక్ వేవ్స్ అది వినపడవు కూడా అలాంటి శబ్దాలని సృష్టి చేసి వాళ్ళ మీద పంపించేవాళ్ళు వాళ్ళ క్యాంప్స్ ఎక్కడఉన్నాయో వాళ్ళ దగ్గరికి ఈ శబ్దాల్ని శబ్ద తరంగాలని పంపించి వాళ్ళ డిప్రెషన్ లోనేట్లు భయభ్రాంతులు కొదిపేట్లు నిద్ర పట్టకుండా చేసేట్లు ఆ విధంగా చేశారు ఇది సక్సెస్ఫుల్ ఎక్స్పెరిమెంట్ రష్యా వేసిన వారు ఈ విధంగా నెగటివ్ గా ఉపయోగించారు శత్రువుల్ని వాళ్ళు స్టాప్ చేయడానికి యుద్ధ స్థావరాలపై శత్రు రాజ్యంపై శత్రువులపై ఈ శబ్ద తరంగాలను ఉపయోగించేవారు.","ఎలా అయితే శబ్ద తరంగాలు మనల్ని అప్లిఫ్ట్ చేస్తుందో ఆ శబ్ద తరంగాలు కూడా మనల్ని కూడా తక్కువ స్థాయికి కూడా తీసుకుని వెళ్తుంది. సో ఈవిడ దగ్గర ఎన్నో ఆయుధాలు ఉన్నాయంట ఎన్నో ఆయుధాలు ఎందుకంటే ఆ మహిషాశురుడు ఎన్నో రూపాంతరాలు చెందుతున్నాడు ఎన్నో రూపాలు ధరిస్తున్నాడు. ఒకసారి దున్నపోతు రూపం మళ్లా ఆమె వచ్చి త్రిశూలంతో పొడిచే లోపల వేరే రూపాన్ని ధరించేస్తున్నాడు మనిషి రూపం మనిషి ఖడ్గంతో వచ్చేస్తున్నాడు. ఆ తర్వాత ఆ ఎన్నో రకరకాల రూపాలు ఆయన తీసుకున్నాడు. ఒక సింహ రూపం కూడా తీసుకున్నాడు.","ఒక ఏనుగు రూపాన్ని తీసుకున్నాడు చెప్పబడింది నాలుగు రూపాల్లో ఆయన ఉన్నాడు వచ్చాడంట. సో ఆవిడకి ఈ యొక్క ఆయుధాలని ఉపయోగించడం స్టార్ట్ చేశారు. మెయిన్ గా త్రిశూలం ఆ త్రిశూల ధారి శివుడి దగ్గర నుంచి ఆమె త్రిశూలం వచ్చింది. సుదర్శన చక్రం విష్ణువు దగ్గర నుంచి వచ్చింది వజ్రాయుధం ద్రేవేంద్రుడి దగ్గర ఉన్నటువంటి వజ్రాయుధం ఆయన ఇచ్చాడు.","అట్లా ఒక్కొక్క శక్తి ఆమె దగ్గర ఉన్నాయన్నమాట ఇవన్నీ ధనస్సు మరియు అక్షయ భాణాలు ఇవన్నీ కూడా వాయుదేవుడి నుంచి వచ్చినాయంట ఖడ్గం యమధర్మరాజు నుంచి వచ్చింది గద కుబేరుడి నుంచి తీసుకున్నాం శక్తి ఆయుధం అగ్నిదేవుడి నుంచి అంటే ఈట లాంటిది ఒక ఈట పాసము మరియు శంఖము వరుణదేవుడు ఇచ్చాడంట గొడ్డలి ఇది దేవశిల్పి విశ్వకర్మ ఇచ్చారు సో అష్టాదశ భుజ లతో ఆవిడ ఈ యొక్క ఆయుధాలఅన్నిటిని ధరించి మహిషాశుడు ఆ రూపాంతరం చెందడం అంటే రూపాలు మార్చుకోవడం అంటే అరిషడ్ వర్గాలు ఎన్నో రూపాలు మారుస్తూఉంటుంది మన మనసు చేసే ఆ క్రియలు ఇన్ని ప్రక్రియలు మంచిగా కనిపిస్తుంటుంది మనసు ఎన్నో రూపాలు మార్చుకుంటుంది.","మనం గుర్తించలేకుండా ఉండేట్టుగా మనం అనుకుంటాం ఓ నాలో ఉన్న క్రోధం అంతా వెళ్ళిపోయింది ఈరోజు కానీ అది రూపాంతరం చెందింది వేరేగా వేరే రూపంలో అది ఇంకా ఉంది లోపల రూపం మారింది అంతే కానీ అది ఉంది మహిషాశురుడు కూడా అంతే మనలో ఉన్న మహిషాశురుడు కూడా ఇలా రూపాంతరం చెందుతూ ఉంటాడు మనం డిటెక్ట్ కూడా చేయలేము వాడు ఉన్నాడు అని చెప్పేసి కూడా రోజుకఒక రూపంలో లోపల అపరిచితుడు అంటాం కదా అపరిచితుడు ఉంటాడు మనలో తెలియకుండానే మారవేషాల్లో వస్తుంటాడు అపరిచితుడు ప్రతి ఒక్కళలో ఉంటారు ధ్యాన సాధకుల్లో కూడా ఉంటారు.","ఇప్పుడు ఈయన మహిషాశరుడు కూడా మేరు పర్వతం ఎక్కి అక్కడ శిఖరాగ్రహంలో తపస్సు చేశాడు ధ్యానం చేశడు ఆయన కూడా ధ్యానినే ఆయనలో కూడా అర్షడ్ వర్గాలు అన్ని ఉన్నాయి. తమోగుణం ఫుల్ తమోగుణం రజోగుణం అవి పోతే గాని ఈ సత్వగుణ దోషంతో పాటు అన్ని పోతే గాని ఆయన త్రిగుణాత్మకంగా కాలేడు త్రిగుణాల్ని దాటలేడు త్రిగుణాతీత స్థితిని పొందలేడు. ఆ జగన్మాతతో ఆ జగన్మాత నుంచి ఆయన ఏం పొందాలో అవి పొందలేడు.","ఆ కుండలిని శక్తి జాగరణ జాగృకత కాదు ఆ కుండలిని జాగరణ కాదు ఇవన్నీ కావాలి లోపల ఇవన్నీ ప్రాసెస్ అంతా జరగాలి ప్రతి ధ్యాన సాధకుడులో జరిగే ఈ ప్రాసెస్ే ప్రతి సాధకుడిలో ఇవే జరుగుతుంటాయి. మనలో అంతర్యుద్ధం పోరు జరుగుతుంటుంది. ఈ శక్తి ఆ అంతర్యుద్ధంలో మెయిన్ రోల్ తీసుకొని లీడ్ రోల్ తీసుకొని ఒక్కొక్క అంతర్శత్రువుని మనం జయిస్తూ ఉంటాం ఒక్కొక్క చక్రంలో ఒక్కొక్క అంతర్శత్రు వస్తూ ఉంటారు."],"minutes":7,"words":1044},{"title":"పద్దెనిమిది బాహువులు · అంతఃశత్రువులు","paras":["మనం మూలాధారంలో ఉన్నప్పుడు అన్ని ఫిజికల్ గా సర్వైవల్ రిలేటెడ్ ఇష్యూస్ అన్నీ ఇలాంటి శత్రువులన్నీ మనం జయించడానికి మనకి వీలవుతుంది ఈ శక్తిని ఎప్పుడైతే మనం తెలుసుకుంటూ ఉంటామో ఈ శక్తి సంచాలనం ఎప్పుడైతే అవుతుంటుందో శక్తి ఎప్పుడైతే జాగరణ జరుగుతుందో ఫిజికల్ లెవెల్లో అది స్వాధిష్టానం మాయ మాయా చక్రం అంతా భావోద్వేగాలు భావవేశాలు అవి డ్రామాలు అన్నీ చాలా డ్రామాలు వస్తాయి మనకి ఎమోషనల్ డ్రామాస్ అని అంటాం దానిలో ఇరుక్కుంటాం చాలా ఇరుక్కుంటాం అవి నెవర్ ఎండింగ్ ఆ డ్రామాస్ నెవర్ ఎండింగ్ ఈ చక్ర దాటి మణిపూర్వంలో వెళ్లి మణిలాగా వెలగాలి అంటే మణిపూర్వకం విక్షసించాలి అంటే మరి అక్కడ ఉండేటటువంటి నేను విక్టిం ని ఆర్ మన పెర్పెట్రేటర్ ట్రేట్స్ మనలో ఉన్నటువంటి గొప్ప అందరినీ హాని చేసే గుణం హింస తత్వం ఇవన్నీ తొలగిపోవాలి.","ఒక్కొక్క దానిలో మనం అంతర్శత్రువులన్నీ శక్తినే జగన్మాతే యుద్ధం చేస్తుంది అంటాడు భీకర పోరాటం అనాధ చక్రం దాటి తర్వాత విశుద్ధంలోకి వెళ్లి అపరాశక్తి అంతవరకు విశుద్ధం వరకు అపరాశక్తినే ఆ అపరాశక్తి పరాశక్తిగా మారుతుందంట ఆజ్ఞా చక్రాన్ని దాటిందా అది చాలా పరాశక్తిగా ఒక ఈ అమ్మవారు ఆ అయ్యవారిని కల్పిస్తుంది. చైతన్యం శుద్ధ చైతన్యం సో మనం మహిషాశురుడు అంటేనే మహిషాశురు మధిని అంటేనే ఈ జంతు స్వభావం పైన కూడా ఆధిపత్యం మనలో జంతు స్వభావం చాలా ఉంటుంది.","తక్కువ అని కాదు అవి కానీ జంతువులంతా మనుగడ కోసం సర్వైవల్ ద్వారా ఎన్నో ఫియర్స్ ఉంటాయి మనకి ఎన్నో సర్వైవల్ ఫియర్స్ సర్వైవల్ ఇన్స్టింక్షువల్ ఫియర్స్ అంటే ఇక్కడ మనుగడ కోసం మనం ఎన్నో హింసా మార్గంలోకి వెళ్ళిపోవడానికి ఆస్కారం ఉంటుంది. సర్వైవల్ రిలేటెడ్ ఒక జంతువుని మనం చూస్తే మనకు తెలుస్తుంది ఈ విషయం జంతువు భయం వేసినప్పుడు అటాక్ చేస్తుంది. భయం కలిగిందా ఆ భయం నుంచి వెళ్లి ప్రతిఘటిస్తుంది వెళ్లి ఆ హింస ద్వారా హింసతో ఏదో ఒకటి చేస్తుంది హాని చేస్తుంది. పాము దగ్గరికి వెళ్ళారు మనిషి పామును చూసి భయపడడం కాదు యాక్చువల్ పామే మనిషిని చూసి భయపడుతుంది.","చాలా భయం మనిషి అంటే భయపడి నా దగ్గర రావద్దు అంటే వాడు తెలియకుండా వచ్చాడు అనుకోండి అది కాటేస్తుంది. కానీ భయం ఆ భయం నుంచే పుట్టిందే ఈ హింసా తృత్వం భయం అజ్ఞాన స్వరూపం భయం ఎందుకుంది అజ్ఞాన స్వరూపం అజ్ఞానం నుంచే పుట్టిందే భయం జ్ఞానంలో ఉన్నవారికి జ్ఞానంలో మొదట భయాన్ని దాటేస్తాం ఎప్పుడైతే జ్ఞాన స్వరూపం మన జ్ఞానాన్ని మనం తెలుసుకుంటూ ఉంటామో ఫస్ట్ భయాన్ని ఓవర్కమ్ చేస్తాం భయం వెళ్ళిపోతుంది మనం సో ఇక్కడ అనిమల్ కింగ్డమ లో జంతు సామ్రాజ్యంలో లాగానే మనుషుల్లో కూడా జంతు స్వభావం ఉంటుంది.","ఈ తమోగుణము, రజోగుణము, సత్వగుణము ఈ మూడు దోషాలు మనల్ని పట్టుకొని ఉంటాయి. మూడు దోషాలు ఉన్నాయి మనలో.","ఇప్పుడు మంచివారు సత్వగుణంలు కూడా సత్వగుణం ఉండే వాళ్ళు కూడా వాళ్ళ కూడా దోషం వచ్చేస్తది వాళ్లో నా అంత మంచివాడు ఇంకఎవ్వరు లేరు నేనే చాలా మంచివాడిని మిగతా వాళ్ళంతా దుర్మార్గులు ఈ ప్రపంచం అంతా దుర్మార్గులు నేను ఒక్కడినే మంచివాడిని ఇది సత్వగుణ దోషం ఇది వాడు వాడికి డిక్లేర్ చేసుకుంటాడు నేను చాలా మంచివాడిని అందరికంటే చాలా మంచివాడిని అనుకుంటాడు దీన్ని కూడా దాటాలి ఈ మూడు దోషాలు ఉంటాయి పట్టుకొని ఉంటాయి జీవుణని మహిషాశుర మధిని అంటేనే ఈవిడ ఈ శక్తి వీటినన్నిటిని తొలగిస్తుంది.","ఈ మూడు దోషాల్ని తమోగుణం ఫస్ట్ సర్వైవల్ రిలేటెడ్ ఏదైతే ఉన్నాయో అవన్నీ కూడా పటాపంచలు చేసేస్తుంది. తమోగుణం ద్వారా మనకి నిద్ర ఎప్పుడు నిద్ర అన్కాన్షియస్నెస్ అంటేనే నిద్ర అన్కాన్షియస్ గా ఉండడం కాన్షస్ గా లేకపోవడం సోమరితనం బట్ కంప్లీట్ లేజీనెస్ పోస్ట్పోన్మెంట్ ప్రోక్రాస్టినేషన్ ఇవన్నీ కూడా వచ్చేస్తాయి అంటే రేపు చేస్తాను రేపు చేస్తాను రేపు చేస్తాను అన్ని మనల్ని మనం రేపటికి వాయిదా వేస్తుంటాం.","ఇవన్నీ కూడా మరి ఈ తమోగుణం రజోగుణం ఆ దోషం కూడా మనల్ని పట్టి పీడించేస్తుంది ఎప్పుడు కూడా వీటిని దాటిన వాడికి అర్థంవుతుంది మనం ఎవరమో మనం త్రిగుణాల్లో ఉంటూనే నాటకం ఆడుతూనే త్రిగుణాతీతంగా ఉండాలి. ఎందుకంటే వీటిని ఈ శరీరం కావాలి శరీరంలో ఉన్నప్పుడు ఈ మూడు ఉంటాయి. అన్ని అనుభవాలు వస్తుంటాయి మనకి కానీ త్రిగుణాతీత స్థితిలో ఉంటూ ఇక్కడ ఉండే వాటిని అంటి అంటకుండా జీవిస్తూ ఉండాలి. సో ఈ జగన్మాత మరి కుండల్ని మాతగా మూలాధారంలో ఉంటూ మూలాధారంలో ఫస్ట్ రేతస్సుగా ఉంటుంది.","వేతస్సు అష్టధాతువులు అష్టాభుజాలు అంటే ఆ దేవతా శక్తికి అష్టాభుజ ఉన్నటువంటి దేవీ మాత కాబట్టి అష్టాదశ భుజాలు అంటేనే పంచజ్ఞానేంద్రియాలు పంచ కర్మేంద్రియాలు అష్టధాతువులు వీటన్నిటి ద్వారా ఉన్నటువంటి మాత వాటి పైన ఆధిపత్యం ఉంటూ వాటిపై ఆధిపత్యం ఉన్నటువంటి దేవతా శక్తి అంటే పంచజ్ఞానేంద్రియాలు పంచకర్మేంద్రియాలు దశేంద్రియాలు అవే కాకుండా అష్టధాతువులు మనలో నిరంతరం సప్త ధాతువుల గురించి విన్నాం అష్టధాతువులు అంటే మన శరీరం ప్రకారం అయితే రస రక్త మాంస మే మేదో అస్తి మధ్య శుక్ర ఇవన్నీ కూడా సప్త ధాతువులు ఎప్పుడైతే ఈ ధాతువులన్నీ ఉంటాయో సరిగ్గా ఉంటాయో అవన్నీ కూడా రేతస్సుగా మారుతుంది.","అదే ఓజస్సుగా మారుతుంది. అదే తేజస్సుగా మారుతుంది. ఈ కుండల్ని శక్తినే ఫస్ట్ రేతస్సు తర్వాత పైన ఓజస్సుగా మారుతుంది అంటే మనలో ఒక గొప్ప శక్తిగా రూపాంతరం చెందుతుంది అలా ఓజసే తేజస్సుగా మారుతుంది. ఇవిడే మహిషాశుర మర్తిని అష్టాదశ భుజాలతో ఆయుధాలు ధరించి ఎన్నో రూపాలు మారుతున్నటువంటి ఆ మహిషాశుని వధించింది. ఫైనల్ గా ఎలా మదించింది ఎలా వధ చేసింది అంటే త్రిశూలంతో ఇది కూడా సంకేత రూపమే త్రిశూలం అంటేనే ట్రైడెంట్ అంటేనే దానికి మూడు గుణాలుని దాటినటువంటి నాలుగవ స్థితి గురించి చెప్పబడింది.","త్రిగుణాతీత స్థితినే త్రిశూలం ఆయుధం యొక్క అంతరార్థం ఈ విషయం మనం తెలుసుకోవాలి. అందుకే త్రిశూలం తో ఆ మూడు గుణాల్ని మూడు దోషాల్ని త్రిగుణ దోషాల్ని ఈ ఏదైతే మూడు దోషాలు ఉన్నాయో మహిషాశురులో వాటిని సంహరించేసింది. మనలో కూడా ఇదే జరుగుతుంది. ఈ మనలో ఉన్నటువంటి ఆ కుండల్ని మాతా శక్తి మనలో తమోగుణ దోషము రజోగుణ దోషము సత్వగుణ దోషము ఈ త్రిశూలంతో సుస్థకుల ధారి అయి ఈవిడ సంహరిస్తుంది. సో ఇప్పుడు మనం త్రిగుణాతీత స్థితిని మనం పొందుదాం. సో ఏ శక్తి ఈ సర్వ సృష్టికి ఆధారమై ఉందో ఆ శక్తి గురించి మనం తెలుసుకోకపోతే మన ఆధ్యాత్మికంగా ఏ పురోవృద్ధి మనం చెందాం.","ఏ పురోగతి మనకి ఉండదు. కచ్చితంగా ఈ తల్లి గురించి తెలుసుకోవాల్సిందే. ఈ జగన్మాత గురించి తెలుసుకోవాల్సింది ఆ జగన్మాత కుండలని శక్తి రూపంలో మన మనలోనే ఉంది. అంతటా ఉంది మనలో కూడా ఉంది. సో మనలో ఉన్నటువంటి ఈ శక్తిని తెలుసుకోవడం చాలా ఈజీ ధ్యానం చేస్తుంటాం చాలా సులభం ఎవరు ధ్యాన సాధన చేసినా కూడా ఈ దేవీ శక్తి మనము ఆ అనుభవం మనకి వస్తుంది. ఈ శక్తి యొక్క అనుభవాలు మనకి వస్తుంటాయి. ఈ జగన్మాతని ఈ శక్తిని మనం త్రిపుటి అని కూడా అంటాం. త్రిపుటి అంటే మూడు స్థితులను కూడా ఆమె కంట్రోల్ చేస్తుంది.","ఏ మూడు స్థితులు ఒకటి జాగృతవస్థ జాగ్రతావస్థ ఆమ ఆమె అధీనంలోనే ఉంది అన్ని ప్రాణుల యొక్క జాగృతవస్థ అన్ని ప్రాణుల యొక్క స్వప్నావస్థ అన్ని ప్రాణుల యొక్క సుషుప్త అవస్థ వీటన్నిటిని కూడా ఆమె ఆధీనంలోనే ఉన్నాయి ఆశక్తి మనం జాగృత అవస్థలో ఉన్నప్పుడు మనం విశ్వ పురుషుడు అంటాం అంటే ఏదైతే తే బ్రహ్మాండంలో ఉందో అది పిండాండంలో కూడా ఉంది. అక్కడ ఏది ఉందో మక్రోపాజం లో ఏది ఉందో మైక్రోపకాజం లో అదే ఉంది. సో మనల్ని విశ్వ పురుషుడు అంటాం జాగృతవస్థలో మాత్రమే అంటే స్వప్నావస్థలోకి మనం ఎంటర్ అయితే తేజో పురుషుడు అంటాం.","ఎప్పుడైతే సుషుప్తిలోకి మనం వెళ్తామో ప్రాజ్ఞుడు ప్రాజ్ఞ పురుషుడు అంటాం. ఈ మూడు స్థితులకి కూడా ఆవిడ ఇంచార్జ్ అందుకే ఆవిడని త్రిభువనేశ్వరి త్రిపుటి అని కూడా అంటారు. త్రిపుటి సాధన ఈ మూడు స్థితులని దాటి ఏ స్థితికి వెళ్ళాలి మనం తురీయ స్థితికి వెళ్ళాలి తురీయంలోకి వెళ్ళాలి.","ధ్యాన సాధకులకి అది చాలా సులభం చేస్తుంటారు ధ్యానం చేస్తుంటారు ఈ మూడు స్థితుల్లో మనం నావిగేట్ చేస్తుంటాం ప్రయాణం చేస్తుంది జాగృతవస్థలో ఉంటాం స్వప్నావస్థలో మన సూక్ష్మ శరీరం స్వప్నావస్థ అనుభవాలన్నీ వస్తుంటాయి స్వప్న స్థితి మెడిటేషన్ ఎక్స్పీరియన్సెస్ ఆస్ట్రల్ ఎక్స్పీరియన్సెస్ ఇవన్నీ వస్తుంటాయి అవన్నీ స్వప్న స్థితి ఒక డ్రీమ్ స్టేట్ కాన్షియస్ డ్రీమింగ్ దాన్ని కూడా దాటిన తర్వాత ఒక ప్రాజ్ఞుడుగా మనకి సుషిప్తావస్థలోకి వెళ్తాం.","అక్కడ ఏమీ తెలియదు ధ్యానం చేస్తున్నామో తెలియదు ధ్యానం ఎంత టైం అయిందో తెలియదు ఉన్నామా లేదా అనేది కూడా తెలియదు మనం ఇంకే తెలియదు. సుషుప్తిలోకి వెళ్తాం. కానీ ఒకానొకప్పుడు ధ్యాని ఒక ధ్యాన సాధకుడు ఈ మూడు స్థితిని దాటి తురియంలోకి వెళ్తాడు. తురీయ స్థితి అప్పుడు ఏదైతే మనం అన్కాన్షియస్ గా సుషుప్త స్థితిలో మనం ఉన్నామో సమాధి స్థితి అన్కాన్షియస్ గా జరిగితే అది సుషుప్తి కాన్షియస్ గా జరిగితే అది తురీయం ఒకటే ఒక డిఫరెన్స్ సుషుప్తి కాన్షియస్ అయిందా కాన్షియస్ గా అయ్యామా ఆ సుషుప్తినే సమాధి స్థితి తురియం అంటాం.","సమాధి స్థితి మనం కాన్షియస్ గా లేమా అది సుషుప్తి నిద్రపోతున్న స్థితి గాఢ నిద్ర సో ఈ మూడు స్థితులని కూడా ఆమె ఇంచార్జ్ త్రిపుటి అందుకే మనం సాధన చేసేటప్పుడు ఈ మూడు స్థితులని కూడా అధిగమిస్తాం. అది నుంచి తురియ స్థితిలో ఉంటాం. ఆ తురీయంలో మనం అన్ని ఏది తెలుసుకోవాలో అన్ని తెలుస్తుంటాయి.","అన్నిటిని దాటినటువంటి స్థితి ట్రాన్సెండెంటల్ స్టేట్ వ ట్రాన్సెండ్ బ్యారియర్స్ ఆఫ్ లిమిటేషన్స్ ఆఫ్ టైం అండ్ స్పేస్ బాడీ అండ్ మైండ్ ఆల్ త్రిగుణాస్ ఆల్ ద త్రీ డిఫరెంట్ స్టేట్స్ ఇవన్నీ దాటినటువంటి స్థితి మూడు అవస్థలను దాటినటువంటి స్థితి ఆవిడ త్రిపుర సుందరి మన ఆత్మకు ఇంకొక పేరు త్రిపుర సుందరి ఆవిడే త్రిభువనేశ్వరి ఎన్నో పేర్లు ఆ మాతకే ఎన్నో పేర్లు ఒక్కొక్క సందర్భంలో ఒక్కొక్క పరిస్థితిలో ఒక్కొక్క అనుభవంలో ఒక్కొక్క పేరు మరి ఆ యోగి ఆ ఋషి దర్శించాడు ఆ విధంగా దర్శనం చేశాడు."],"minutes":8,"words":1118},{"title":"శక్తి అనుభవాలు · తురీయం","paras":["మనం అందుకే కన్ఫ్యూజ్ కాకూడదు ఒకటే ఒక శక్తి ధ్యాన సాధకులుగా మనం అందరం తెలుసుకోవాల్సింది ధ్యాన సాధన చేస్తే ఫస్ట్ మనలో వచ్చేటటువంటి అనుభవము శక్తి అనుభవాలు అపారమైనటువంటి అవిశ్య శక్తి మనలో ఆవాహనం చెందుతుంది. ఆ తర్వాత మన మూల శక్తి ఆ పరాశక్తి ఆవిశక్తి ఎలా ఏ విధంగా కుండల్ని మాతగా నిద్రాణంగా నిద్రిస్తూ ఉందో ఆ శక్తి మేలుకొల్పబడుతుంది. ఎన్నో అవస్థల్లో మనం ఒక ధ్యాన సాధకుడు అభ్యాసం చేసేటప్పుడు సాధన చేసేటప్పుడు ఎన్నో అవస్థలు వస్తుంటాయి. ఫస్ట్ అంతా కూడా జాగృత అవస్థ బాహ్యంలో ఆలోచనలు బాహ్యం గురించి ఆలోచన చేస్తున్న జాగృత అవస్థలో ఉంటాయి.","తర్వాత కొంత మెడిటేషన్ ఆల్టర్డ్ స్టేట్ ఆఫ్ కాన్షస్నెస్ అని అంటాం అంటే స్వప్నావస్థ మన కాన్షస్నెస్ కొంచెం చేంజ్ అవుతుంది షిఫ్ట్ అవుతుంది.","స్వప్నావస్థలోకి వెళ్తాం స్వప్నంలో ఎన్నోఎన్నో దర్శనాలు రంగులు ప్రకృతి దర్శనాలు ఎన్నెన్నో ఏవో చూస్తుంటాం అర్థం కాదు ఒకోసారి ఒక ఋషి కనిపిస్తాడు మనకఏమో అర్థం కాదు ఎందుకు కనిపించాడో తెలియదు ఫస్ట్ మనం ఎక్కడికో ఒక ప్రాంతంలో ప్రదేశంలో ఇక్కడ కూర్చుని ఉన్నాము ఎక్కడో ఉన్నట్టుగా ఉంటుంది అక్కడ ఒక ఋషి సముదాయాన్ని సమూహాన్ని మనం కలిసినట్టు ఆ ఋ ి. ఈ విషయమే మనం ఇన్నినైన్ డేస్ దీనికోసం డెడికేట్ చేశరంటే చూడండి ఎంత ఇంపార్టెంట్ో అహంకారం అనేది చాలా పెద్ద అంతరశత్రువు అహంకారం [గొంతు సవరించుకోవడం] సూక్ష్మ అహంకారం చాలా పెద్ద శత్రువు అది స్థూల అహంకారం అన్న మనకి బయట కనిపిస్తూఉంటుంది. అందరూ ఫీడ్బ్యాక్ ఇస్తారు నువ్వు చాలా అహంకారంతో ఉన్నావు అంటే మనం గుర్తించుకుంటాం మనం ఇది మనలో ఉన్నట్టు కూడా తెలియదు. సూక్ష్మ అహంకారము మనలో ఉన్నట్టు కూడా తెలియదు.","చాలా సూక్ష్మంలా ఉంటుంది అది అది కూడా సంహరింపబడాలి అది కూడా శుద్ధి కావాలి అహంకార రాహిత్య స్థితిని మనం పొందాలి. మమకార రాహిత్య స్థితిని పొందాలి. సో ఈ అసురులు వాళ్ళపై విజయం అనేది చూడండి ఎంత అద్భుతమైనటువంటి జ్ఞానాన్ని ప్రదం చేశారు. సో మన ఉపనిషత్తుల్లో చెప్పబడినటువంటిది ఒక కాన్సెప్ట్ ఒకటి ఉంది. అదేంటంటే ఫస్ట్ సాలోక్యము అంటే మనమంతా కూడా ఒక ఇప్పుడు దేవతా శక్తి ఈ మాత జగన్మాతను మనం తెలుసుకోవాలని అనుకుంటున్నాము అనుకుంటే ఫస్ట్ మనం స్థాలోక్యము ఆమె ఏ లోకంలో ఉందో ఆ లోకంలో మనం ఉండాలి. ఆ లోకంలో ఉండడానికి మనం అర్హతను సంపాదించాలి.","ఫస్ట్ అంటే ధ్యాన సాధనే అర్హత ధ్యాన సాధన ద్వారానే యోగ్యత వస్తుంది. ఆ శక్తిని తెలుసుకోవడానికి అదే సాలోక్యం సామీప్యం తర్వాత అంటే కొంచెం సమీపంగా వెళ్ళాలి ఆ శక్తి మాతకి ఆ జగన్మాత దగ్గరికి వెళ్ళాలి సామీప్యం కొంచెం దగ్గరగా వెళ్ళాలి.","ఓ గురువు ఉన్నారు ఫస్ట్ ఆ గురువు గురించి మనం తెలుసుకుంటాం ఓ ఆ గురువుని నేను కలవాలి ఆ గురువుని కలవాలి అంటే కొంత అర్హత కావాలి క్వాలిఫికేషన్ ఆ గురువు వెళ్ళంగానే ఫస్ట్ వాట్ ఇస్ యువర్ క్వశ్చన్ అంటాడు నీ ప్రశ్న ఏంటో అడుగు అంటాడు భయపడతాం ప్రశ్నలు 1000 ఉన్నాయి మనకి అన్ని అడగడానికి టైం ఉండదు ఒకే ఒక్క క్వశ్చన్ అడగమంటాడు ఫిల్టర్ ఎంటర్ చేయాలంటే కుద అక్కడ తడబడితే కొడతాడు తిప్పుతాడు గురువు సాలోక్యం అర్హత సంపాదించాలి కొంత ఆ ఎలిజిబిలిటీ రావాలి ఆ గురువుని ఆయన దగ్గర కూర్చుని ఆ గురువుని మనం నుంచి నేర్చుకోవడానికి అర్హత కావాలి.","ఇప్పుడు మనం 10ెన్త్ క్లాస్ కి అర్హత ఏంటిటెన్త్ క్లాస్ రావాలి అంటేటెన్త్ క్లాస్ లో జాయిన్ కావాలంటే అర్హత మిగతా క్లాసులన్నీ కంప్లీట్ కావాలి మనకి అలానే ఒక ధ్యాన స్థితి వచ్చిన తర్వాత సాలోక్యం సామీప్యం తర్వాత సామీప్యం ఇంకొంచెం దగ్గరగా వెళ్తాం సాధన చేసుకుంటే ఇంకొంచెం దగ్గరగా వెళ్తాం ఆ గురువుకి సేవ చేసుకుంటాం లేకపోతే ఆశ్రమంలో సేవ చేస్తూంటాం సేవా కార్యక్రమంలో నిమగ్నమై ఉంటాం.","తర్వాత సారూప్యం అంటే మనం ఆ జగన్మాత ఆ శక్తి ఉంది సారూప్యం అంటే ఆ జగన్మాత ఏవైతే ఆ మనిఫెస్టేషన్స్ ఉన్నాయో ఏ రూపం అయితే ఉందో ఏ క్వాలిటీస్ ఉన్నాయో అవన్నీ కూడా మనలోకి ఇన్కల్కేట్ చేస్తుంది మనలోకి నింపుకుంటాం. ఇప్పుడు ఒక గురువు ఉన్నారు శ్రీకృష్ణ పరమాత్మ ఉన్నారు.","ఆ శ్రీకృష్ణ పరమాత్మ గుణాలు మనం కూడా మనలోకి వచ్చేస్తుంటాయి సారూప్యం ఆయన ఎలా ఏ గుణాలతో ఉన్నారో అందరి పట్ల ఆయనకి ప్రేమ అనంతమైనటువంటి ప్రేమ ఆ గోమాతలు కనిపిస్తే చాలా ఫ్లూట్ వాయిస్తుంటారు గోమాతల పట్ల ఎంతో ప్రేమ ఆయనలో ఉండేది ప్రేమ అనంతమైనటువంటి ప్రేమ సో సో ఆ గుణాలన్నీ మనలోకి నింపుకుంటాం అదే సారూప్య స్థితి సారూప్యం అంటే ఆ రూపం వారిలాగా మనం కావడం అన్నమాట రోల్ మోడలింగ్ అనుకోవచ్చు మనం మన ఈ సైంటిఫిక్ టర్మ్స్ లో ఇప్పుడు ఉండే టర్మ్స్ లో మనం మాట్లాడుకుంటే రోల్ మోడల్ వాళ్ళు రోల్ మోడల్ చేసుకొని మనం వాళ్ళలాగా మనం మనం కావడం ఆ గురువు ఏం చేసాడు మనం కూడా అదే చేయాల గురువు గురువు సాధన చేశాడు ధ్యాన సాధన మనము ధ్యానంలో కూర్చోవాలి ఆ గురువు మూడు గంటలు చేస్తాడు మనం నాలుగు గంటలు చేయాలి.","గురువు మనం ప్రతి శిష్యుడు గురువు కావాలి ఒకరోజు ఒకానొక రోజున ఈ లోకంలో రెండే ఇద్దరు ఉన్నారు తెలిసినవారు తెలియని వారు తెలియని వారు తెలిసిన వారి దగ్గరికి వెళ్లి నేర్చుకోవాలి తెలియని వారు అంటే శిష్యులు తెలిసిన వారు అంటే గురువులు తెలిసిన వారి దగ్గరికి వెళ్లి కూర్చోవాలి ఫస్ట్ సాలోక్యం ఫస్ట్ వెళ్లి కూర్చోడానికి కూడా ఫస్ట్ ఎలిజిబిలిటీ తెచ్చుకోవాలి తర్వాత సామీప్యం దగ్గరగా వెళ్ళాలి తర్వాత సారూప్యం వారు ఏం చేస్తారు మనం కూడా అదే చేయాలి తర్వాత సాయుజ్యము అనే స్థితి ఉంది సాయుద్యం అంటే నువ్వే","అయిపోతావు ఆ గురువు నువ్వే అయిపోతావ్ సాధన చేస్తుంటావు ఇప్పుడు జగన్మాత ఉంది ఆ శక్తిని కుండల్ని మాత కుండల్ని మాత మనం సాలోక్యం ఆ మాత ఎలిజిబిలిటీ క్రైటీరియా కొన్ని మనం తెచ్చుకున్నాం సాధన చేస్తున్నాం మనలో ఏం కావాలో ఆమె పట్ల భక్తి శ్రద్ధ లేకపోతే మనకి ఆ వినమత వినయము ఇవన్నీ సంపాదించుకుందాం.","సాలోక్యం సామీప్యం సారూప్యం తర్వాత సాయుద్యం ఆమెలాగా అయిపోవాలి ఆమె అయిపోతాం మనం ఆ శక్తి స్వరూపం ఫస్ట్ మనం ఏదైతే దర్శిస్తున్నామో వేరుగా భావన చేస్తున్నామో తర్వాత సాయిధ్యమే వన్నెస్ వన్నెస్ ఆవిడే మీరు అమ్మే మీరు అమ్మ అమ్మాయి మీరు అయిపోయారు. ఇది ప్రతి ధ్యాన సాధకుడికి కూడా ఎన్నో అవస్థల్లో ఎన్నో స్థితుల్లో ఇవన్నీ వస్తుంటాయి అనుభవాలు వస్తుంటాయి. సో ఈరోజు మనం ఒక ప్రాసెస్ నేర్చుకుందాం.","దీన్ని అప్లై చేద్దాం నాలుగు స్థితులు మొదట సాలోక్యము ఓకే ఇప్పుడు అమ్మవారిని దర్శించాలని అందరికీ ఉంటుంది అమ్మవారికి రూపం లేదంట రూపం లేదు నామం లేదు మనం పేర్లు పెట్టాం అమ్మకి మనకి ఆ పేర్లు కూడా తెలియకపోతే అమ్మ అనుకుందాం అంతే ఆని ఎలా ఏ భావంతో మన హృదయంలోనుంచి ఎట్లా పిలిచినా పలుకుతుంది ఆవిడ అందరికీ అమ్మ అమ్మలకే అమ్మ ఈ సృష్టికే అమ్మ కాబట్టి మనం సాలోక్యం ఫస్ట్ సాలోక్యం తర్వాత ఆ అమ్మ దగ్గరికి వెళ్దాం సామీప్యం తర్వాత సారూప్యం ఆ అమ్మ ఎలా ఉందో అలా అయిపోదాం మనం కూడా రోల్ మోడలింగ్ తర్వాత ఆ"],"minutes":7,"words":1078},{"title":"దేవీ సమర్పణ · శరణాగతి","paras":["అమ్మే నువ్వు ఆ అమ్మ ఒకటే సాయుద్యం ఈ ప్రాసెస్ చాలా సింపుల్ గా చేయొచ్చు ప్రయత్నం చేద్దాం ఇప్పుడే సో మొట్టమొదటిగా మనం మన దేవీ సమర్పణం చేసి అంటే శరణాగతి భావం కొత్త కొంతమంది కొత్తవారు జాయిన్ అవుతున్నారు రోజు వారి కోసంగా మళ్ళా నేను రిపీట్ చేస్తాను ఏమ అనుకోవద్దు ఎందుకంటే కొత్తవారు కూడా ఫస్ట్ డే వచ్చి ఉంటారు ఈరోజు ఎలా అంటే ఆ శక్తికి మనం కంప్లీట్ గా సమర్పణ భావంతో శరణాగతితో ఉండాలి.","జగన్మాత ఆవిడ కుండలిని మాతే మనలో ఉన్నారు. సో అందుకే మనం లక్ష్మీ ముద్ర అంటే ఫస్ట్ కూర్చునే విధానం కూడా ఆవిడకి ఇంపార్టెన్స్ ఇవ్వాలి ఇప్పుడు మనం శక్తికి ఇంపార్టెన్స్ ఇవ్వాలి.","అమ్మవారికి ఇంపార్టెన్స్ ఇవ్వడానికి మనం లెఫ్ట్ లెగ్ ని అవుట్ సైడ్ మీరు కూర్చుని ఉంటే లెఫ్ట్ లెగ్ రైట్ లెగ్ పైన పెడతారున్నమాట క్రాస్ చేసుకని అలానే కూర్చునున్నా కూడా అంతే అవుట్ సైడ్ గాని పైన గాని ఉంచాలి రైట్ లెగ్ పైన ఉంచాలి కుడికాలు మీద ఎడంకాలు పెట్టాలి ఓకే తర్వాత మన నాసికాంద్రం లెఫ్ట్ నాసికాంద్రం చంద్రనాడి చంద్రస్వరం చంద్రస్వరం మనల్ని నడిపిస్తాము చంద్రస్వరం ద్వారా మనం చంద్రనాడి ద్వారా తొమ్మిది సార్లు లోపలికి గాలి పీల్చాలి ఎట్లా అంటే సక్సెసివ్ గా అంటే ఫస్ట్ ఒకసారి పిల్చాలి మళ్లా ఎక్సలేషన్ వద్దు ఇన్హలేషన్స్ే ఫస్ట్ ఒకసారి రెండోసారి మూడోసారి అంటే మరీ ఎక్కువగా పిలుచుకోవద్దు స్లోగా వన్ టూ స్లో స్లోగా పిలిస్తే ఎక్కువ ఆ తొమ్మిది మీరు పిల్చగలుగుతారు.","ఆ తర్వాత స్లైట్ గా హోల్డ్ చేయాలి తర్వాత నమస్కార ముద్ర ఎందుకంటే మనకి నమస్కారం అనేది భారతదేశంలో మన సంస్కృతి మన అందరికీ మన సంప్రదాయం మనం అందరం కూడా ఈ రె ుకుంటారు మూడవది మూడో మళ్ళ మారుస్తారు మీ పాస్చర్","నాలుగవది సాయుజ్యం అయిపోతాం సారూప్యం తర్వాత సాయుజ్యం అంటే ఆ అమ్మవారే మనం అయిపోవాలి ఈరోజు మనం త్రిశూల దారి అయినటువంటి అంటే ఆ త్రిశూలాన్ని కూడా పట్టుకుంటాం త్రిశూలం ఉంటేనే ఈ త్రిగుణాలని దాటినటువంటి స్థితి ఈ మూడు అవస్థలని దాటినటువంటి స్థితి జాగృత స్వప్న సుషుక్తి దాటి తురియంలో ఉన్న స్థితి త్రిశూల ధారి అయినటువంటి అమ్మవారుగా అయిపోదాం సో అందరం కూడా రెడీ అవుదాం ఇప్పుడు హాయిగా కూర్చోవాలి తర్వాత ఫస్ట్ సాలోక్యం హాయిగా కూర్చుని ఫస్ట్ ఆ అమ్మవారు జగన్మాత మనలోనే ఆ కుండలిని శక్తిగా మనలో","ఉన్నది అన్న భావన ఆ అమ్మని ఆ తల్లిని ఆ జగన్మాత ఆ లలితామాత త్రిపు భువనేశ్వరి దేవి ఎన్నో పేర్లతో ఉన్నటువంటి ఆ మాత ఎలిజిబిలిటీ క్రైటీరియా మనం పొందాలంటే మనకి ఆ భక్తి శ్రద్ధ ఆ వినయము విధేయత ఈ పాస్టర్లో కూర్చుని సాలోక్యం ఆమెకి ట్యూన్ కావాలి.","ఆ శక్తికి చూవాలి మనలో ఉన్నటువంటి శక్తి అది మనలో ఉన్నటువంటి కుండల్ని మాత జస్ట్ వన్ మినిట్ ఫీల్ అండి.","ఆ స్థితిలో వన్ మినిట్ కళ్ళు మూసుకుంటే ఇంకా శ్రద్ధగా మీరు చేయగలుగుతారా వన్ మినిట్ చూడండి సాలోక్యము అంటే కంప్లీట్ గా ఫోకస్ చేయడము ఏ శక్తి అయితే మనల్ని నడిపిస్తుందో మన శ్వాసను నడిపిస్తుందో మన ఈ సృష్టి అంతా ఆవిడే నడిపిస్తుంది ఏ శక్తి అయితే ఉందో ఆ శక్తిని ట్యూన్ కావడం ఫోకస్ చేయడం ఇంటెన్స్ గా ఫోకస్ చేయడం ఇప్పుడు మీ ఫోకస్ లెవెల్స్ ఒకటి నుంచి 10 దానిలో ఐదు లో ఉందనుకోండి ఒకటి రెండుమూడు నాలుగు ఐదు ఫోకస్ లెవెల్స్ మీ యొక్క ధ్యాస యొక్క క లెవెల్ ఐదవ దానిలో ఉంది.","ఇప్పుడు ఆరు లోకి వెళ్దాం ఏడు లోకి వెళ్దాం ధ్యాసని ఏడు అంకెవరకు పెంచుదాం ధ్యాసని ఇంకా పెంచుదాం ఎనిమిది తొమ్మిది 10 కంప్లీట్ గా ధ్యాస ఇద్దాం ఈ జగన్మాత ఈ కుండల్ని మాత ఏ శక్తి అయితే మనల్ని నడిపిస్తుందో ఆ శక్తికి చూయిపోవాలి నిసంధానం అయిపోవాలి. మనం ఇప్పుడే సమర్పణ చేసుకున్నాం శరణాగతి అన్నాం ఇప్పుడు రెండవ గేర్ లోకి మార్చుకుంటూ అంటే రెండవ స్థితిలోకి వెళ్తూ మనం మీ డైరెక్షన్ ని కొంచెం మార్చండి పాస్టర్ ని వేరే డైరెక్షన్ లో కూర్చోండి రెండవది రెండవ గేర్ ఇది సామీప్య సామీప్యంగా అవుతున్నాం ఇంకొంచెం సమీపంగా అవుతున్నాం.","ఆవిడ దగ్గరగా అవుతున్నాం ఆ శక్తి మనము చాలా దగ్గరగా ఉన్నాం. ఆ వైబ్రేషన్స్ మరీ ఇంకా పెరుగుతాయి మనలో ట్యూన్ చేయండి అమ్మవారే మన దగ్గర ఉంటే మనం ఎలా ఫీల్ అవుతాం ఆ జగన్మాతే ఏ రూపం లేదు ఆ జగన్మాతకి ఆ శక్తికి ఒక రూపాన్ని ధరిస్తే ఒక రూపంలో వస్తుంది ఆవిడ నిర్గుణంగా ఉన్నటువంటి ఆవిడ ఆ జగన్మాత సగుణంగా ఒక రూపంతో ఒక నామంతో ఒక రూప రూపంతో కనిపిస్తే మనం సమీపంగా ఉంటే ఎలా ఫీల్ అవుతామో అది కంప్లీట్ గా ఫీల్ అవుదాం.","సామిప్య స్థితి ఒక్క నిమిషం ఆ స్థితిలో ఉందాం ఇప్పుడు మనం హిమాలయ పర్వతాలక వెళ్తే ఆ చల్లని రుత్పవనాలు ఆ చల్లని ఆ అక్కడి నుంచి వస్తున్నటువంటి అన్నీ కూడా మనం తాగుతాయి. చలదనం మనకు తగులుతుంది ఆ వైబ్రేషన్ మనకు తగులుతుంది. అలానే ఈ జగన్మాత ఈ ఆదిశక్తి పరాశక్తి మన సామీప్యం అయినప్పుడు ఆ వైబ్రేషన్స్ మనకు తెలుస్తూ ఉంటుంది. ఎందుకంటే చాలా సమీపంగా ఉన్నాం ఆమె ఎక్కడో లేదు మనలోనే ఉంది. మనం గుర్తించలేదు ఇంతవరకు ఇప్పుడు గుర్తిద్దాం. కొంచెం సమీపంగా వెళ్దాం. మన స్టెప్ మనం ఆవిడ దగ్గరికి వెళ్ళాలి ఆవిడని మనం ఎక్స్పెక్ట్ చేస్తున్నాం ఆమె నా దగ్గర రావాలి.","మనమే వెళ్దాం ఆ అమ్మ దగ్గరికి ఒక బిడ్డ తల్లి దగ్గరికి ఎలా పరిగెత్తుకొని వెళ్తాడో అమ్మ అమ్మ అమ్మ అనుకుంటూ అలా అమ్మ దగ్గరికి వెళ్దాం మనం పరిగెత్తుకొని వెళ్ళాలి. ఇప్పుడు మూడవ స్థితి అయిన సారూప్య స్థితిలోకి వెళ్తాం ఇప్పుడు మూడవ డైరెక్షన్ లో కూర్చోండి మూడు కొంచెం చేంజ్ చేసి మీ పాస్టర్ ని మీ డైరెక్షన్ ని మార్చండి ఇది మూడో గేర్ ఇది సారూప్య స్థితి సారూప్యం ఆ అమ్మకి ఏ గుణాలు ఉన్నాయో ఆ అమ్మకి ఏ వైబ్రేషన్ ఏ శక్తి స్వరూపినియో ఆ రూపు అవన్నీ కూడా ఆమె గుణాలన్నీ కూడా మనం కూడా లోపలికి ఇంటిగ్రేట్ చేసుకుందాం.","అంటే ఇప్పుడు మూడవ స్థితిలో మనం ఇంకొంచెం ఇంకా ఆమె మనము వేరు కాదనే భావనే ఆమె గుణాలు ఏవైతే ఉన్నాయో అన్నీ మనలో నింపుకుంటున్నాం. ఈ శక్తి ఈ పరాశక్తి అపరాశక్తిగా మనం ఎన్నో సృష్టి చేయడానికి మన జీవితంలో ఉపయోగపడుతుంది. ఎన్నో అడ్డంకుల్ని మనం తొలగించుకోగలుగుతున్నాం. ఈ శక్తి ద్వారానే ఈ శక్తి ద్వారానే ఎన్నో విజయాలని మనం పొందుతున్నాం.","సామిప్య స్థితి కంప్లీట్ గా ఆ అమ్మకి కంప్లీట్ గా ట్యూన్ అయిపోదాం కంప్లీట్ మరింతగా ఇప్పుడు మనం నాలుగవ స్థితిలోకి వెళ్దాం నాలుగవ డైరెక్షన్ లో నాలుగో పాస్చర్ చేంజ్ పాస్చర్ ఇప్పుడు మీరు సాయుద్యం అంటే ఆ అమ్మే మీరు అయిపోవాలి ఇప్పుడు ఆ కుండలిని మాత ఏ శక్తి ఆధారంగా ఈ సృష్టింతా నడుస్తుందో ఏ మహిషాశుర మధ్యనే త్రిశూలాన్ని పట్టుకొని ఎన్నో ఆయుధాలు ధరించి అష్టాదశ భుజాలతో ఉందో ఆ రూపాన్ని మనం ధరిద్దాం మనం కూడా త్రిశూలంతో త్రిశూలం అంటేనే తమోగుణము రజోగుణము సత్వగుణము వీటిని దాటి టి త్రిగుణాతీత"],"minutes":8,"words":1089},{"title":"సాయుజ్యం · త్రిశూలం","paras":["స్థితి ఈ త్రిగుణ దోషాల్ని సంహరించి దాటి అతీతంగా ఉన్నటువంటి తురీయ స్థితి ఆ స్థితిలో ఇప్పుడు ట్యూన్ అయిపోదాం కంప్లీట్ గా సాయుదజ్యం అమ్మవారే మనం అయిపోదాం అమ్మవారే మనం ఇంతవరకు మనం అమ్మని దర్శించాం బాహ్యం నుంచి ఇప్పుడు సాహిత్యంలో మనం అమ్మ మనం ఒకటే అయిపోదాం ఒకప్పుడు ఒకటిగానే ఉన్నాం మన చిన్నప్పుడు తల్లి గర్భంలో మనం శిశువుగా ఉన్నప్పుడు ఒక పిండంగా ఉన్నప్పుడు మనం మన తల్లి మనం వేరు కాదు ఆ తల్లి గర్భంలో మనం ఉన్నాం అలానే ఇప్పుడు ఆ తల్లి మనం వేరు కాదనే ఈ స్థితిలో ఉన్నాం ఏకత్వ స్థితిలో","ఉన్నాం ఆ తల్లే మనం అయిపోదాం మీలో మీలో ఉన్నటువంటి ఎనర్జీని గమనించండి మీరు త్రిశూ సూలం పట్టుకుంటే ఎలా ఉంటుందో పట్టుకునే చూడండి.","మీ చేతిలో ఒక త్రిశూలాన్ని సంకేత రూపంలో భావన చేయండి. మీరు ఆ త్రిశూలాన్ని పట్టుకుంటే ఎలా ఉంటుందో ఆ భావన చేయండి. ఆ అనుభూతిని చెందండి. నేను నా తమోగుణ రజోగుణ సత్వ గుణ దోషాలను దాటి త్రిగుణాతీత స్థితిలో నేను ఉన్నటువంటి శక్తి స్వరూపుని నేను జాగృత స్వప్న సుషుప్తావస్థలను దాటి ఉన్నటువంటి తురియా స్థితిలో ఉన్నటువంటి శక్తి స్వరూపుని ఈ భావనతో మనం ఉందాం ఏ సాయుదజ్యం కంప్లీట్ గా మన అమ్మవారు మనం ఒకటే ఆ ఎనర్జీ పాస్చర్ లో మనం ఉందాం.","ఒక్క నిమిషం ఓకే మై డియర్ ఫ్రెండ్స్ నిదానంగా తిరిగి జాగ్రత్త అవస్థలోకి తిరిగి వచ్చేద్దాం దట్స్ వండర్ఫుల్ ఫ్రెండ్స్ ఇప్పుడు మనం చక్కగా ఒక జగన్మాత ఈ దేవీ శక్తిని ఒక ఛాంట్ హారికా మేడం ద్వారా మనం విందాం. థాంక్యూ సార్.","సహస్రారసరోజంమే కురుబిందుమయంతే చక్రాగ్రం సహస్రారసరోజంమే కురుబిందుమయంతే చక్రాగ్రం అభిన్న నిజాత్మ పరాత్మ విశుద్ధ స్వరూప విరాజితాత్వాంహి అభిన్న నిజాత్మ పరాత్మ విశుద్ధ స్వరూప విరాజితాత్వాంహి శ్రీ రాజరాజ రాజేశ్వరి సదయే చిన్మాత్రికే పాహిని శ్రీరాజరాజేసిమాం [పాడటం] కృపయ చిత్కుండజేపాలయ శ్రీ రాజరాజేశ్వరి [పాడటం] సదయే చిన్మాత్రికే పాహిమ శ్రీరాజరాజేసిమా [పాడటం] కృపయ చిక్కుండజేపాలయ ముద్రా సాఖిలయోనిస్తే నత బృందావని విఖ్యాత ముద్రా సాఖిలయోనెస్తే నత బృందావని విఖ్యాత పంచబ్రహ్మమహి [పాడటం]","శివశంకర రిశాంతరసా సచ్చిదానంద పంచబ్రహ్మమహి శివ శంకరి శాంతరసా సచ్చిదానంద శ్రీ రాజరాజేశ్వరి [పాడటం] సదయే చిన్మాత్రికే పాహిమ శ్రీ రాజరాజేసిమాం కృపయా చిత్కుండజేపాలయ సర్వానందమయి చక్రే త్రైపుర సుందరి త్వంహాసి సర్వానందమయి చక్రే త్రైపుర సుందరిత్వంహాసి యోగిన్యస్తు పరాత్పర పూర్వక రాహస్య అనుయాంతిత్వం యోగిన్యస్తు పరాత్పర పూర్వక రాహస్య అనుయాంతిత్వం శ్రీ రాజరాజేశ్వరి [పాడటం] సదయే చిన్మాత్రికే పాహిని శ్రీరాజరాజేసిమా [పాడటం] కృపయ చిత్కుండజే పాలయ సతయే చిన్మాత్రికే పాహిమ కృపయ చిక్కుండజే పాలయ","థాంక్యూ హరిక మేడం వండర్ఫుల్ వండర్ఫుల్ వండర్ఫుల్ కొన్ని షేరింగ్ చేసుకుందాం ఎస్ సార్ మూడే ఆగి సార్ నమస్కారం సార్ నమస్కారం అండి నమస్కారం మీతో మాట్లాడడం ఒక అదృష్టంగా భావిస్తున్నాను సార్ ఓకే నేను ఎన్నో రోజుల నుంచి సాలోక్యము సామిప్యము ఈ లోకములోనివే కదని ఒక పాట పాడుతుంటాను సార్ ఇంత వివరంగా ఈరోజు అర్థమైంది సార్ దాని అర్థం చాలా రోజులు నుండి పాట పాడుతున్నా దాని అర్థం ఎవరు చెప్పేవారు లేరు సార్ చాలా ఆనందంగా ఉంది సార్ ఈరోజు వండర్ఫుల్ అదేవిధంగా దుర్గామాత పైన కూడా అమ్మవారు కోళ్లు కోస్తారు","గోల్డ్ కోస్తారు ఈమె అంత పూజించవలసిన అవసరం ఏందనే భావనలో ఉన్నాను సార్ నేను ఈ తొమ్మిది రోజుల నుంచి ఈ క్లాస్ చాలా నుంచి ఆమె గురించి చాలా వివరంగా [గొంతు సవరించుకోవడం] తెలుసుకున్నాను.","ఆ సమర్పణ భావంతో ప్రతిరోజు సాధన చేస్తున్నాను సార్ [గొంతు సవరించుకోవడం] అలాగే నవంబర్ 24 వాలంటరీగా వస్తాను సార్ నేను ఓకే సార్ ఇంకు వేరేవాళ్ళ వెల్కమ్ సార్ వెల్కమ్ వెల్కమ్ చక్కగా రండి ఓకే సార్ సేవ చేసుకోవాలి థాంక్యూ వండర్ఫుల్ ఓకే సార్ థాంక్యూ సార్ నిన్న ధనా గారు హ్యాండ్ రైస్ చే యా ధనా గారు నమస్తే న్యూటన్ సార్ నమస్కారం నమస్కారం మిమ్మల్ని ఫస్ట్ టైం ఫిజికల్ గా కలిసాను సార్ ఇక్కడ హైదరాబాద్లో జాతీయ అహింసా ఈవెంట్ లో సో చాలా హ్యాపీ అనిపించింది.","సో ఈ ఆరు రోజుల క్లాస్ నాకు చాలా బాగా బాగా ఫీల్ అవ్వగలుగుతున్నాను సార్ సో ఐ యామ్ టేకింగ్ అప్ ఎవ్రీథింగ్ మీరు అన్నారు కదా సూక్ష్మంగా కూడా అహంకారం ఉంటుందని ఆ సమర్పణ సాధనలో చాలా వరకు వెళ్ళిపోతుంది.","మా మదర్ తో కూడా నేను నాన్ వైలెంట్ గా వైలెంట్ లేకుండా బాగా మాట్లాడగలుగుతున్నాను సర్ నౌ వి ఆర్ మేకింగ్ ఏ గుడ్ కనెక్షన్ సర్ సో ఐ యమ్ సో హ్యాపీ అంటే ఆవిడ కొంచెం తిడుతున్నా కూడా అక్కడ ఎక్కడో ప్రేమ ఉంది సర్ సో దాన్ని పట్టుకుంటే చాలా ఈజీగా ఉంది సర్ కనెక్షన్ సో ఎక్సలెంట్ నా ప్రశ్న ఆ ధ్యానంలో స్టార్టింగ్ లో ఆ ఉద్రృతికి నేను భయపడేవాడిని ఆ అలా రావడము అరే ఏంటిది అప్పుడు నాకు జ్ఞానం సరిగా ల const nav=document.getElementById('nav'),mobileNav=document.getElementById('mobile-nav'),columns=document.getElementById('columns');let chapter=0,spreadIndex=0,spreadCount=1;
function makeNav(root){chapters.forEach((c,i)=>{let li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+c.title+'<small>~'+c.minutes+' min read</small></span>';b.onclick=()=>{chapter=i;spreadIndex=0;render();document.getElementById('mobile-side').classList.remove('open')};li.append(b);root.append(li)})}makeNav(nav);makeNav(mobileNav);

function measure(){const width=columns.clientWidth;const one=window.matchMedia('(max-width:800px)').matches;const total=Math.max(width,columns.scrollWidth);spreadCount=Math.max(1,Math.ceil((total-2)/width));spreadIndex=Math.min(spreadIndex,spreadCount-1);columns.scrollLeft=spreadIndex*width;document.getElementById('position').textContent='Section '+(chapter+1)+' / '+chapters.length+' · '+(one?'Page ':'Spread ')+(spreadIndex+1)+' / '+spreadCount;document.getElementById('prev').disabled=chapter===0&&spreadIndex===0;document.getElementById('next').disabled=chapter===chapters.length-1&&spreadIndex===spreadCount-1}
