</style></head><body><div class="app lang-en"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-06-en.html">Prev</a><a href="day-08-en.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">The Sword of Knowledge · Sumbha and Nisumbha · Devi Navaratri · Day 7 (English)</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">The Sword of Knowledge · Sumbha and Nisumbha</span></div><div class="tools"><span class="lang-switch"><a href="day-07-te.html">TE</a><a href="day-07-en.html" class="active">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-06-en.html">Prev</a><a href="day-08-en.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"Opening Meditation · Breath and Sahasrara","paras":["Welcome to the 567th day of the Jnanodayam programme. Today is the seventh day of Devi Navaratri. Each day we receive this knowledge from Dr. Newton and put it into practice, and we close with Devi Samarpan, the offering of oneself to the Mother. To be able to receive it, we begin every morning in meditation. Sit comfortably, all of you, in sukhasana, an easy seated posture.","Cross the feet. Let the fingers rest together. Close the eyes, and watch the breath as it moves of itself. With full awareness, keep the attention there. There is a greatness in this breath, and secrets lie hidden in it. The breath is the path by which we reach our true nature and come to know it. It awakens the knowledge already in us. Do not leave it. The mind invents the illusion that other things matter more. Wake from that illusion, and stay with the breath.","For the last ten minutes, remain at the crown. Experience there the light of knowledge, the power of the sahasrara, the thousand-petalled centre. The moment attention rests here, watch that power. Like a stream it moves outward, and in this collective sitting it joins every person who is here. We are drawn together into feeling.","Let us set a sankalpa, a resolve, and see it. On the University campus the Sahasrara is being built. Soon it will be complete, and this power will shape the whole region into knowers of the Self, sounding the start of a new age. All of us are partners in it. We are watching the manifestation with our own eyes. On the 24th of November, 2027, we inaugurate the pyramid together, as a festival.","Seventy-two thousand crystals. The pyramid stands in the lotus of the sahasrara, and around it a globe, the highest of the feminine power and the masculine power. Sacred geometric forms are set inside it. With the five elements the work is being completed, and the landscaping around it is underway. Seeing this, and glad in it, we meditate within it.","Let the experience be whole. From the mind and from the body, release this resolve into the universe. With the breath, at the last moment: five, four, three, two, one, zero. Lay both hands over the eyes for a few moments. With a small smile, open the eyes. Welcome back.","We are on the seventh day of the Navaratri celebration, and everyone is ready to receive the knowledge. Turn the videos on. With a smile, let us welcome the founder and chairman of Quantum Life University, Brahmarshi Chakravarti Dr. Newton Kondaveti. Thank you, Sir. Over to you."],"minutes":4,"words":440},{"title":"Saptami · The Sword of Knowledge","paras":["Jnanodayam. Good morning. Wonderful, my dear friends. Today is Saptami, the seventh day. Saptami, Ashtami, and Navami, the last three days of Navaratri, are felt and celebrated as very great, and there is a reason. The fruits of the sadhana we have been doing come into experience in these three days. In the first six days we have already spoken of what that sadhana is.","We spoke of iccha shakti, kriya shakti, and jnana shakti — the powers of will, of action, and of knowledge — and of Mahadurga, Mahalakshmi, and Mahasaraswati. These last three days belong to Mahasaraswati, the form of knowledge. An inner purification has been going on, and this too is purification. It happens now through the sword called knowledge.","The stories we have been using are those of the Devi Bhagavatam, written by Maharshi Markandeya in the Markandeya Purana, and the narratives of the Devi Mahatmyam. We have been learning them with their inner meaning. How Mahishasura was slain became a way of speaking about the enemies inside us. Every one of these stories is telling us a single thing.","Taken only on the outside, a story gives a little entertainment and a little joy, because a story is being heard, and nothing more. The benefit is in the inner meaning. These tales were written full of it. Today we take up the stories that carry the same teaching further. Many asuras were destroyed by the divine power, by Kalika, by Chandi, under many names. Read as symbols, they are the inner enemies. With the power in us that has been awakened, we destroy them first in ourselves."],"minutes":2,"words":272},{"title":"Sumbha and Nisumbha · Pleasure, Pain, and the Four","paras":["Sumbha and Nisumbha are called brothers, and they stand as a pair. In the sadhaka, Sumbha is the circling tendency of the pleasure-impression, and Nisumbha the tendency of sorrow. They are vrittis. The word has to be heard carefully: vritta means a circle. Pleasure and pain spin us and do not leave one another. In pain we resolve upon pleasure; when pleasure comes, pain comes back. We ask why the pain comes if the pleasure was what we wanted. The root is ahankara and mamakara, the sense of I and the sense of mine.","These are mental tendencies seated in the subconscious, always turning: I want this, I want that, and the mind leans toward pleasure, and pain arrives with it. In the story Sumbha is a king and Nisumbha his brother, and it is said that Nisumbha was destroyed fighting Indra. Others then entered Sumbha's court: Chanda, Munda, Dhumralochana, and Raktabija. We have heard of Raktabija before. When Karambha was seized upon his own funeral pyre, he came out again as Raktabija. All of this is symbol.","If the circles of pleasure and pain are in us, and if I and mine are there, the others come and join them. The bad qualities arrive in a crowd. Chanda is deceit, a frightening crookedness of mind. We cheat ourselves; that is self-deception. Munda is the tendency that wrecks everything. Mundana is the clean shaving of the head, and in the inner sense it is destruction: self-sabotage. We do all that success requires, and then we destroy ourselves. We climb ninety-nine steps and fall at the ninety-ninth.","Dhumralochana: dhumra is smoke. In smoke nothing ahead can be seen. This is the tendency of maya, which makes what exists seem absent and what is absent seem to exist. Raktabija is the subtle ego. One drop of his blood on the ground becomes a thousand of him. Even a fine ahankara breeds Raktabijas without end. They all joined Sumbha's court. Where pleasure and pain, I and mine, are kept, these others arrive without a limit.","We meditate every day, with the help of this Shakti, in order to win over those inner enemies. Meditation is how the power is gathered. We do not misuse what is in us. We connect with it, and we trust the Mother completely."],"minutes":4,"words":385},{"title":"The Golden Image · Ego and the Spiritual Mask","paras":["Trust and surrender go together. Without trust there is no surrender, and no sharanagati, no taking of refuge. We do not trust the power that is already in us, yet that power does what we cannot do by ourselves. This is why meditation is spoken of. Through it the power is awakened, and the power does the work. Its first work is to finish the inner enemies. Sumbha and Nisumbha, Chanda and Munda, Raktabija and Dhumralochana are in this life. Only the inner meaning gives the clarity, and the sword of knowledge, by which they are conquered.","Begin with the ahankara and mamakara that manufacture our pleasure and our pain. There is gross ego, and there is subtle ego, and both have to be recognised. A story. In a village a great sculptor carved a golden image so well that he thought: there is no sculptor like me in the world. Excellence in a profession brings this. It comes without our noticing. It comes among meditators. Sumbha and Nisumbha were practisers. Mahishasura, whom we have already studied, did tapas. Seekers of knowledge are not exempt.","The danger is the spiritual mask. I meditate, I meditate — and the ego is large, and nothing has changed. The same anger, the same tendencies, the same self-destruction. Families see it. The more meditation is talked about, the further they step back. First change yourself, they say, and then I will believe you. The mask is worn without our knowing. Ego and mamakara sit in us, subtle and subtler.","After the golden image, a sadhu came to the sculptor's house. Proudly the images were shown. See how finely I have made them, Swami; see my skill. The sadhu laughed, and pointed to a small clay lamp in a corner. My son, these golden figures are beautiful, but drop them and they break, and thieves may carry them off at any time. This clay lamp takes the darkness away and bears the light. It has no pride, no fear, no ego. Your ego is like the golden image. It can shatter at any moment. Light the clay lamp of Self-knowledge.","Pride of that kind says there is no hero like me, and no sun. The shapes of it are many."],"minutes":3,"words":375},{"title":"Ahankara · Doership and the Throat","paras":["There is the ego of money. Without money we are one person; after it arrives we are another. A post arrives, a status, and ego comes with it. There is ego about beauty, and intellectual arrogance: the PhD, the gold medal, the feeling of knowing more than everyone, the degrees, the English well spoken. Education can be an ego, and so can wealth. Birth in a caste or a lineage is an ego too, once we identify with it and look down. So is the claim that no one is stronger, or more in the flush of youth.","Sadhana itself grows an ego. I have meditated for thirty years, and that person for ten; I have done this for thirty-five years; I am the senior. A subtle ego. The count is not the years. It is the quality of the sitting. Many have practised a long time, in a general way, and have not moved, because the knowledge was not what they grasped. Grasp the ego, and it spins you. A vritti is a circle. It repeats, and we fall back into it.","When we are in the higher worlds we think: these tendencies are mine; this time I will break the pattern. We choose a design for the life. We are born, and we fall into the same pit. It is like the pit on the path away from the house. We fell once. We say, this time I will not, and we walk carefully, and we fall into it again. Birth after birth. Chiefly it is ahankara: I did all of this. That is the ego of doership. No one, we feel, could have done it better.","True service is done with no sense of being the doer. Some people do not know that dimension. They want to be praised, to have it recognised that they served, to be known for it in society. That too is ego. Spirituality means becoming zero, shunya, because these are what stop us. Otherwise we rise as far as the vishuddha, the centre at the throat, and fall back beneath it. To go above, I and mine have to be released. If they are not, the energy stays below the throat. The whole of life is lived there. We do not reach ajna, the centre above, and the energy is lost where we are."],"minutes":4,"words":392},{"title":"Mamakara · Mine, and the Hand in the Pit","paras":["Mamakara is mine, my people, and it travels as a pair with ahankara. For a sadhaka these two are the most dangerous. They are Sumbha and Nisumbha in another dress: pleasure and pain, I and mine. There is mamakara of the body. This body will be destroyed and will one day go. Hang onto it and the sadhana is forgotten. Caring for the body is right. Giving it all twenty-four hours is not. The body is a rented hut. We took it on rent, and we must leave it. How long does one stay in a rented place? We go home, to our own house.","Identity breeds the same thing. I am a great doctor, a great engineer, a great architect, a great IAS officer, a great minister: I, and mine, and how great my work is. Mamakara toward children is why people are said to change after marriage. Before it, the hold is lighter. After the children come, they become the world. My son, my daughter-in-law, my people. However the boy behaves, even if he is doing wrong, the mamakara encourages him. While that remains, enlightenment is not possible. The energy sticks there.","Then husband and wife. My wife, my husband: a clinging, a possessiveness. She must not laugh or speak with anyone. He must be good to no one but me, and must praise only me. Each takes the other's freedom. The two bind each other. This is a great bondage, and it is why many fear marriage. In other births they married and got stuck. Fear of getting stuck is not a reason to refuse marriage. There is a dharma of Nature here. In this body these bonds exist, and they have to be crossed. Marry. Have children. Come out of mamakara.","True love is not the binding of one by the other. It is unconditional. However you are, I accept you: your past, your present, your future. I love you as you are, and I love your freedom. You were born with a purpose, and that purpose is encouraged. Each helps the other fulfil a life, without the clutch of mine. Bonds must not bind.","Kanaka is gold, and many have a madness for it. However much there is, contentment does not come. Keep gold if it is actually needed. Do not heap it up and hang on. It will go. A knower of the Self lets it go if it goes, and welcomes it if it comes. Things come and go. There is also mamakara of relations and friends. We are universal beings, cosmic human beings; the universe is ours, and everyone is our relation. Mamakara separates us from that. All countries, all planets, the many universes: everyone is our own. Clinging to past memory is mamakara too, whether the memory is of honour or of disgrace.","Opinions are held the same way. Only what I say is correct, and everyone else is wrong. But each person sees with his own sight, if not with insight then with his own angle, and his opinions are his. To be tied to one's own view, and to call the other wrong by reflex, is mamakara. So is the hold on pleasures and enjoyments.","A man fell into a pit and struggled, shouting for help. Someone came and said, give me your hand. He would not. All his life the mamakara of holding money had been strong. He knew how to take. Giving was not in his language. Why should I give my hand? To give, he felt, is to lose something. Another man arrived and changed the sentence. Do not say give. Say take. Take my hand. Then the hand came up. Taking he could do. Giving he could not. This is how I and mine bind us and make us prisoners."],"minutes":6,"words":635},{"title":"Kaushiki · The Drop That Becomes a Thousand","paras":["In these three days we also have to see how Mahasaraswati emerged, because Chanda, Munda, Sumbha, Nisumbha, Dhumralochana, and Raktabija were destroyed by her. From the Devi who had arisen with all the powers, one form came out. Her name is Kaushiki. Kaushiki is Mahasaraswati, the form of knowledge: many weapons, eight arms, and she began to destroy them one by one. For each inner enemy the power puts on a form. Here the form to put on is knowledge. I and mine are cut. The dualities of pleasure and pain, in which we are crushed, are cut. Then there is Raktabija.","Desires in us are not one. After one, ten more come. They do not end, and a human being has no contentment. The other day we called it a good formula: contentment on the material plane, discontent on the spiritual one. Outwardly, be content with what is there. Inwardly, always feel that there is more to learn, and go faster. Raktabija is this multiplication. One desire, one drop of blood, becomes a thousand. Life is spent on the material world alone. When do we realise, and obtain the true education, atma-vidya, brahma-vidya?","Kaushiki took many forms. As Chamundeshwari, as Chandi, she first destroyed Chanda and Munda: the nature that gives pain to everyone, deceit, and the impulse to ruin. She destroyed Dhumralochana, maya. Mind itself is maya. Thoughts are maya, and they keep building a world of it. The defects of the asura rise from tamas and from rajas, from the three gunas. Sattva does not overflow in the same way. But the defect of sattva, when it appears, becomes a subtle ego, and that is especially dangerous.","When Raktabija is to be destroyed she is Kalika. Different names, one Mother. She spread her tongue over the whole earth, so that not a drop of his blood could fall and replicate him in hundreds and thousands. With both hands she took the sword, the sword of knowledge, and she drank the blood. There is a yoga kriya of this moment. It is called Simha Kriya, or Simhasana Kriya. Many do it seated in vajrasana, the kneeling posture. The tongue is put out, large; the eyes are opened wide; the gaze is set at the centre, at the midpoint between the brows. Breath is let out, and the place is toned. Kali drank every desire. On the material plane desire has no end. Right desires may be satisfied. The trouble is the sequence: one crore earned, and a hundred crores wanted; a hundred, and then thousands. Fulfilled, we rejoice. Refused, we suffer, and we are ground between the two. One small desire is enough to bring us back through birth after birth."],"minutes":4,"words":453},{"title":"What to Ask · Bondage, Buddha, and Janaka","paras":["So a life can be comfortable and still content. What is needed is a small hut, not a mansion. For sadhana, a good hut in the midst of Nature is enough. Ten houses do not add contentment. We do not live in all of them at once. One apartment here and another there: a human being is not filled by the number.","Done fully in vajrasana, Simha Kriya bears on the thyroid, and the thyroid on the vishuddha chakra. The power there clears the blocks, so that what the place creates can heal. Kali's form is fierce, and it frightens enemies. Toward sadhakas there is kindness. She gives whatever is asked: the enjoyments, and moksha as well. She is the giver of liberation. That Mother is the great power in us. Whatever we ask, she gives. The clarity we have to acquire is what to ask. From today we tune to Kaushiki Mahasaraswati. She is Self-knowledge, Brahma-knowledge. That is the direction.","What stops us are the tendencies that bind. Some bonds are all right, and some are kept on purpose. T. Lobsang Rampa, a great yogi, said he carried ninety-nine illnesses. He needed them. Hypertension, a cardiovascular disease: they gave him the feeling of having a body. They anchored him. Without that anchor, he said, he would not stay; he would leave. Some sadhakas and some knowers keep a bondage for that reason. Otherwise the body is simply left.","So look at what is binding you, and why it is still kept. If the sword of knowledge can remove it, remove it. Moksha is freedom, complete freedom. Nothing should bind. In this very moment, be ready to drop anything. With that readiness, enlightenment is in this moment. The Buddha left a kingdom as a blade of grass, in one second. He might have been an emperor. Wealth, all of it, he dropped as if it were grass. No ego, no mamakara, no greatness. No bond held him. He cut them one by one and went to meditate, and he taught the same.","Our homework, these three days, is to see what binds us and to come out of it, whatever it is. Through these nine days the power is ready to give what we ask. There are further stories. Tomorrow we will take King Suratha and the merchant Samadhi. The names already say a great deal. The Mother gave each what he asked. Samadhi, whose name is meditation, asked for Brahma-knowledge and received it. Suratha asked to be a great king, with sovereignty and royal enjoyment, and received exactly that.","A saying carries the same point. One who holds 'I am free' is free; one who holds 'I am bound' is bound. The line is: yā matiḥ sā gatir bhavet. As the mati is, so the gati becomes — as the conviction is, so the course. Ask for bondage and bondage comes. Ask for a kingdom, a post, money, and the life goes that way. Ask for moksha, for Self-knowledge, and she gives that. Ask for both, and she gives both, but then discernment is required, to hold the two in balance. We can live as King Janaka lived. Without Self-knowledge the balance cannot be kept, nor equanimity, nor samata, the even mind and the equal eye."],"minutes":5,"words":547},{"title":"The Unripe Fruit · Avadhutas","paras":["She destroyed each of them, and they are our inner enemies. There is much to know about ourselves, including the mask we wear even on this path. Do not think, I am a great meditator. Do the sadhana. The stories have one structure: enemies, a divine power that ends them, and at the last a celebration. The sadhana of the jiva, the obstacles, the victory: the essence does not change. A meditator also has to conquer the inner enemies, and not ignore them, and not wear the badge of 'I meditate.' The action is great. The mask is not.","We have spoken of the arishadvargas, the band of six inner enemies. Right wisdom is needed, and right knowledge. Two things run together. Meditation goes on, and inner purification goes on beside it, and the person moves. Both are required. At the beginning a sadhaka is unripe fruit: a raw mango, a sitaphalam, a custard apple, still raw. Only the ripe fruit is sweet. The raw one is bitter. As purification happens and the inner forces are met with the help of Shakti, the raw fruit ripens. That ripening is enlightenment, maturity in it. Knowledge sprouts, becomes a tender fruit, and must become ripe. The Devi Bhagavatam says these subtleties by way of story. These three days are that ripening.","Fruit now is often ripened with carbide and chemicals, in a hurry. Nothing nourishing remains. It has to be organic, ripened in its own time. A raw mango cannot be ordered to become fruit in two days. There is no crash course that delivers enlightenment in forty days. If there were, the world would long ago have been full of knowers. This is a journey of many births. There is no shortcut.","We already know what state we are in, and we know our inner enemies. Every meditator can feel the blind areas, the darkness inside that is walked around and not faced. This Navaratri is for facing what we have been avoiding. The Mother purifies it. She ends the inner enemy. The raw fruit has to become ripe.","People call a serious meditator mad. Near Nellore there was Venkayya Swami, whom they called Erri Swami, the mad swami. No one understood his speech. Everyone else was mad for money, or for something else. He was mad for God, and only God. I have seen many avadhutas, masters who have let the outer signs fall away. They sit at the side of the road, and from close up we take them for beggars. The world calls them mad. The world is what is mad.","A fellow sadhaka, Chandrashekhar Sharma, used to come to meditate in that region in 1992. He was a good friend, and he practised so deeply that he came to an avadhuta's clarity. Sit in front of him and he would tell past, present, and future; it was crystal clear to him. In Hyderabad he lived on the road, covered with gunny sacks, day and night, through the heat of summer, and the heat did nothing to him. People called him mad.","Once, in 1991 or 1992, he was cooking. The oil boiled over onto his hand. Boiling oil is a severe pain. At that moment someone knocked, wanting to learn meditation. He forgot the burn, sat them down, and taught for two hours. While they sat, the swelling went down and the burned body healed. There was no pain. Ordinarily that skin turns black. It had not. A great master. Many meditators look mad because they have dropped the other desires and kept one: Self-knowledge, Brahma-knowledge. In these Navaratri days the common asking is money, property, this and that. That asking is not wrong. Ask, along with it, for the knowledge of moksha. The Mother is the giver of liberation. She gives all of it."],"minutes":6,"words":638},{"title":"Devi Samarpan · Nine Breaths and the Hymn","paras":["Let us do the Devi Samarpan we practise each day. Place the left foot on the right. The alignment is with the energy; through these nine days we stay aligned with that dimension. Through the chandra nadi, the lunar channel, take nine breaths in. Close the right nostril and inhale nine times, slowly. Do not breathe out between them, and do not pull hard. After the ninth, pause, and gather the breath a little. Then join the palms in namaskara.","Do the rest with the feeling of offering. We are surrendering to Jagadamba, the Mother of the world, and to the dimension of energy, with sharanagati, the feeling of refuge, and with complete trust. Bow the head. Let the air out slowly, and touch the ground if you can. If you cannot, that is enough. In that gap, as in kumbhaka, the pause where the breath is held, do not take a breath. Inwardly, nine times, say the bija Shrim — the seed-sound of the Mother. Then bring the head back up, and while rising fill the breath in. Nine rounds, for the nine nights. Those who have finished, remain in silence. Those who have not, continue.","While that goes on, Harika madam sang a hymn of the Mother — of Ambika, Mahasaraswati, Mahagauri, and Mahalakshmi. It opens: Varavīṇā mṛdupāṇi vanaruhalochanā rāṇi — the queen of the excellent veena, the soft hand, the lotus eyes. Every day her music fills that energy in all of us. And then a few people shared."],"minutes":2,"words":252},{"title":"Questions · Likeness, and Nachiketa","paras":["Sai Sudha had raised her hand the day before. Her question: from the moment of birth we are not received as ourselves. You are like your father, like your mother. Why? On the physical plane, in some families, comparison is the first response. They match the child to someone. They look at the form, and at the colour: their colour has come. The comparison itself can become a block.","A block forming is not the mistake. The mistake is to go on living inside it after a certain age, after ordinary understanding, after this path has been found. The responsibility is ours. The power to come out of the block is in us, and so is the knowledge. Blocks come through other people to everyone, because this is the physical dimension. We imagine the world as a rose petal, all fragrance. Life is difficult. It is a path of thorns, and we walk on them. The sooner that is known, the sooner a spiritual level and a level of knowledge make it so that nothing here hurts in the old way. We fear death. There is no death for the atma. Whatever happens, the body is what is left. With that seeing, the blocks go. Parents are not all enlightened, and not all wise, and so they compare. Removing what that comparison became is our work. It is inner purification. We ourselves create our ways, and our karmas. Meditation is how we come to know it.","Mahati then asked about Nachiketa in the Kathopanishad. He went to the heavenly world by astral travel, and for three days he was with Yama without hunger or thirst. How can they be without hunger and thirst? And can we, travelling in that same subtle way, go there? When the fire of knowledge is at work, there is the Vishnu granthi, the knot named for Vishnu. If that knot is pierced, can we go?","What Nachiketa gave the world is a great teaching, the principle of the immortal. The atma does not die and cannot be destroyed. He made it known from his own experience, very young, by going to another dimension. Subtle worlds exist. Yamaloka, the world of Yama, is one of them. He waited there, met Yama, spoke with him, and returned. That is not a small thing for a boy. The power and the vibration were in him, so Yama came and spoke. Yama first tried to turn him aside. Ask for something else. Whatever you want, I will give. A thousand years of life. Money. A kingdom. Everything. Nachiketa said that was nothing. He wanted the answers, and he held on. What are these worlds? How do they remain without hunger and thirst? He found it out. The knowledge that actually has to be known is there.","We treat the gross world as the only world. There is a subtle world, a causal world, and beyond them the mahakarana lokas, the great-causal worlds. He grasped that knowledge finely. A meditator can do what he did, and become a Nachiketa: astral travel, the journey of the subtle body. Scientists say these things are not there, because they look from their own angle. A microscope or a telescope cannot bind the atma. No one can produce a photograph of it, or an instrument that measures it. Science does not reach this, and the subtle body is not known there, because the research is research of the gross. A meditator goes into the subtle and learns a great deal: life after death, and life between lives, and what is done before another birth is taken. Those experiences come. What Nachiketa obtained is available. The story has inner meaning. Nachiketa's fire burns ignorance. The Kathopanishad has to be taken with that meaning. Any one Upanishad, held rightly, brings us to Brahma-knowledge. It was already past 7:15, and one more question was taken, from someone who had not spoken in these last days."],"minutes":6,"words":658},{"title":"The Inner Master · An Extra Hour on Saptami","paras":["Krishna Chaitanya was outside, and left the video off so that the question could be held in focus. What is the difference between coming to know the truth and being caught in over-analysis? From childhood, whenever the atma was spoken of, it could not be seen, and so it was skipped, and many things were skipped in the same way. A daughter of thirteen had recently said: you listen to so many classes and learn so much; if you cannot see it, that does not mean it is not there. It means you have not seen it yet. How to receive that was not clear.","The question went on. We keep saying that inner-child blocks must be removed, and wounds, and traumas. One apparent truth after another is uncovered, and none of them is the Truth. Then there is a life purpose. A process from the day before had been missed, and would be written down from the video and done. When Jamila was asked what brings contentment of the Self, a further doubt appeared: do we design the life purpose as we come here? If the block is a truth, and the trauma, and what was brought from the parents, and the family constellation, which of them is the truth? What is final? Where is the line between a life purpose and the search for truth?","The daughter is a wonderful master. Not seeing a thing does not mean it is absent. We are the ones who cannot see, and this is true of many things. It is also not true that everyone carries inner blocks. Some may. Some may not. What we can understand is our own life. Difficulties come. Emotions come. We react, we are triggered, and behind that are inner enemies, which we are calling blocks. They count as present because the world mirrors us, and we estimate ourselves from the reflection. In meditation we can see what has to be set right. A word comes out hollow. An emotion is expressed. We sink, we suffer, we take every remark personally. That personal taking is subtle ego. Someone spoke from their own emotional state; we heard it as ours, because the ego is still there. These are wounds. They are not a rule.","Hard circumstances do not write the same wound in everyone. Think of thirty children whose parents were not there, left with a grandmother while the parents went abroad to earn. Distance from the parents does not plant a block in all thirty. In five, or in ten, it may. It depends on how the thing is interpreted. On this path the requirement is to be open, and to watch. Self-observation shows what is still there: ego, mamakara, a place that hurts, a reaction, a void. Where did the void come from? From whatever was not received in childhood. We then search for it outside. Freedom was refused, and only restrictions were given, so now freedom is hunted in the world. Approval was not given, so now we wait to be approved and appreciated. Seeing this is part of the purification. Do not decide beforehand that the blocks are there. See the life. Feelings are indicators. With a little meditation, thoughts can be seen as well. They pass like waves. At first the feelings are what everyone can catch. Behind an emotion is a thought, behind the thought a belief, behind the belief a memory, a past that has to be understood and set right. From that, a sadhaka knows what change to bring. Do not generalise that blocks are universal.","Krishna was born in a prison. Did the blocks come to him? He was born a master, with knowledge, and there was no inner-child block in him. From childhood, rakshasas and dramas, and not one of them touched him. Through a hundred and twenty years, a hundred and thirty, people came to destroy him, and every day was a hell, and he was joyful. He had no blocks. Our own awareness is what tells us about ourselves. The spiritual mask is related. Many say that all is well, and live as escapists, running from problems into sannyasa: I will not carry these responsibilities; I will renounce and go. That is not the path. Meditation means facing, with this power, whatever problem or challenge has come, and resolving it. Knowledge gives the strength to do that. The mask that says everything is fine is a defence. Be open. Do not sit wondering how many unseen blocks you must be carrying. Simply be open.","Then the question was put plainly. Searching for a root cause is not over-analysis, is it? Only if there is a problem. If there is no problem, a root cause is not required. Where difficulty and sorrow are actually happening, look for the cause. Where they are not, there is nothing to dig up. Then go toward knowledge, and do the sadhana. Along the way, blocks do appear. Procrastination, laziness, a practice that will not stay steady: that is a block. So is the feeling of being less. Everyone else meditates well; I cannot; I am not good enough; I am inferior. That is an inner block, and it has to be overcome, because every person is a great master. Around the inner master, layer on layer has covered what is there. Recognise the layers.","The remaining questions, from Lakshmi Kalyan and from Swapnajyoti, can wait until tomorrow. Today is Durga Saptami, a sacred day. Add an hour to the meditation. Walk the extra mile. In sadhana, stay a step ahead. We have talked a great deal. Without experience the talk is nothing. Sit. Sit in silence. Sit still. We meet again tomorrow morning.","Whoever wishes to be on Zoom will see a QR code after this; the slide can be shared. Scan it and join the WhatsApp community, where a post goes up every day. Divya may share the slide. There are courses, and many activities at Quantum Life University. The One Maitriya programme is held every month; the details and the codes are on the website. If you are with us on YouTube, like the videos and share them with people you know. You may also contribute toward the courses. One Maitriya itself is on the 24th and 25th of October. Dr. Newton and Lakshmi will be there, and whenever he can, Sir takes a class himself. It is usually a Saturday, and it begins at five in the morning, so come on Friday evening. The dates of the later gatherings are on the slide. Plan from them. Thank you. Tomorrow morning at five. Om."],"minutes":10,"words":1106}];
const nav=document.getElementById('nav'),mobileNav=document.getElementById('mobile-nav'),columns=document.getElementById('columns');let chapter=0,spreadIndex=0,spreadCount=1;
function makeNav(root){chapters.forEach((c,i)=>{let li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+c.title+'<small>~'+c.minutes+' min read</small></span>';b.onclick=()=>{chapter=i;spreadIndex=0;render();document.getElementById('mobile-side').classList.remove('open')};li.append(b);root.append(li)})}makeNav(nav);makeNav(mobileNav);
function render(){let c=chapters[chapter];document.getElementById('heading').textContent=c.title;document.getElementById('time').textContent='~'+c.minutes+' min';columns.innerHTML='';let title=document.createElement('h2');title.className='section-title';title.textContent=c.title;columns.append(title);for(let p of c.paras){let el=document.createElement('p');el.textContent=p;columns.append(el)}document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i%chapters.length===chapter));requestAnimationFrame(()=>requestAnimationFrame(measure))}
function measure(){const width=columns.clientWidth;const one=window.matchMedia('(max-width:800px)').matches;const total=Math.max(width,columns.scrollWidth);spreadCount=Math.max(1,Math.ceil((total-2)/width));spreadIndex=Math.min(spreadIndex,spreadCount-1);columns.scrollLeft=spreadIndex*width;document.getElementById('position').textContent='Section '+(chapter+1)+' / '+chapters.length+' · '+(one?'Page ':'Spread ')+(spreadIndex+1)+' / '+spreadCount;document.getElementById('prev').disabled=chapter===0&&spreadIndex===0;document.getElementById('next').disabled=chapter===chapters.length-1&&spreadIndex===spreadCount-1}
function move(dir){if(dir===1){if(spreadIndex<spreadCount-1)spreadIndex++;else if(chapter<chapters.length-1){chapter++;spreadIndex=0;render();return}}else{if(spreadIndex>0)spreadIndex--;else if(chapter>0){chapter--;spreadIndex=9999;render();return}}measure()}
document.getElementById('next').onclick=()=>move(1);document.getElementById('prev').onclick=()=>move(-1);document.getElementById('font').onclick=()=>{document.body.classList.toggle('font-large');spreadIndex=0;requestAnimationFrame(measure)};document.getElementById('menu').onclick=()=>document.getElementById('mobile-side').classList.toggle('open');window.addEventListener('resize',()=>{spreadIndex=0;requestAnimationFrame(measure)});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});render();</script></body></html>
