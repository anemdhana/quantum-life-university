</style></head><body><div class="app lang-te"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-06-te.html">Prev</a><a href="day-08-te.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">జ్ఞాన ఖడ్గం · శుంభ నిశుంభులు · దేవీ నవరాత్రులు · Day 7</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">జ్ఞాన ఖడ్గం · శుంభ నిశుంభులు</span></div><div class="tools"><span class="lang-switch"><a href="day-07-te.html" class="active">TE</a><a href="day-07-en.html">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-06-te.html">Prev</a><a href="day-08-te.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"ధ్యాన ప్రారంభం · ఆనాపానసతి","paras":["ఓం ఓం ఓం ఓం ఓం ఓం ఓం ఆ ఆ జ్ఞానోదయ కార్యక్రమంలో 567వ రోజుకి స్వాగతం. ఈరోజు నవరాత్రుల్లో ఏడవ రోజు అండ్ మనం ప్రతిరోజు కూడా డాక్టర్ న్యూటన్ గారి నుంచి ఈ దేవీ నవరాత్రుల జ్ఞానాన్ని తెలుసుకుంటూ ఉన్నాము ఆచరణలో పెడుతూ ఉన్నాము ప్రతిరోజు లాస్ట్ లో ఒక ప్రాసెస్ కూడా చేస్తూన్నాం దేవీ సమర్పణం అండ్ ఇదంతా స్వీకరించడానికి మనమంతా ప్రతిరోజు పొద్దున్నే ధ్యానంతో ప్రారంభించుకుంటూ ఉంటాం మరి ఈరోజు కూడా ధ్యానంతో ప్రారంభించుకుందాం అందరం చక్కగా చక్కగా సుఖాసనంలో కూర్చుందాం.","పాదాలు రెండు క్రాస్ చేసుకొని వేళ్ళలో వేలు పెట్టుకొని కళ్ళు రెండు ఉంచుకొని హాయిగా సహజంగా జరిగే శ్వాసక్రియని గమనిద్దాం. పూర్తి ఎరుకతో మన ధ్యాసని శ్వాస మీద ఉంచుదాం. ఆ ఆ ఈ శ్వాసలో మహత్యం ఉంది రహస్యాలు దాగి ఉన్నాయి. ఈ శ్వాసే మన దారి మన నిజ తత్వానికి చేరుకునేందుకు తెలుసుకునేందు మనలో ఉన్న జ్ఞానాన్ని మేలుకొనిపోయింది శ్వాసిని వదలకూడదు మనసు పరి ఎంత ముఖ్యమైనవేమో ఉన్నాయని మాయ కలిగిస్తుంది. నాయ నుండి మేలుకోవాలి. శ్వాసతోనే ఉందాం.","ఓం ఆ ఆ ఆ ఆ ఆ ఓం ఆ ఓం ఓం ఆ ఓం ఓం ఓం ఓం ఆ ఓం ఆ ఆ ఓం ఆ ఓం ఓం ఓం ఆ ఆ ఆ ఆ ఓం ఓం ఓం ఆ ఓం ఆ ఓం ఆ ఓం ఓం ఓ ఆ ఆ ఆ 10 నిమిషాలు ఈ 10 నిమిషాలు ఇది హాసిని నా పై భాగం ఉండండి పై భాగంలో ఉన్న నీ శక్తి జ్ఞానపు వెలుగు సహస్రార శక్తిని అనుభవం పొందండి ఓం మనం ఈ శక్తి ఎప్పుడైతే మన ధ్యాసని ఇక్కడ పెడతామో ఆ శక్తిని మనం చెప్పి నల పై భాగం నుండి నీ శరీరం నన్ను అలా నన్ను బాగా గమనించండి గజాతం లాగా శక్తి ప్రభావం ఈ నుండి బయటికి ప్రవహిస్తూ ఈ సామూహిక ధ్యానంలో ఉన్న ప్రతి ఒక్కరితో కనెక్ట్ అవుతుంది. మనందరం అనేక భావంలోకి వెళ్తూ ఉన్నాం.","ఏంట శక్తి ఈ సహస్రారా పిరమిడ్ గురించి సంకల్పిద్దాం దృశ్యకర అన్నమాట యూనివర్సిటీ క్యాంపస్ లో నిర్మాణం జరుగుతున్న సహస్రారా అతి త్వరలో పూర్తయి మండలమంతా ఆత్మ జ్ఞానులుగా తయారు చేస్తూ ఈ శక్తి అద్భుతంగా ఒకొత్త యుగానికి నాంది పలుకుతూ మనమంతా ఇందులో భాగస్వాములమే ఓం ఓం ఈ సహస్రారా మనిఫెస్టేషన్ మన కళ్ళారా మనం చూస్తూ ఉన్నాం నవంబర్ 24 2027 మనమంతా కలిసి ఒక ఉత్సవంగా ఈ పిరమిడ్ ని ఇనాగరేట్ చేసుకుంటూన్నాం.","ఎంతో అద్భుతంగా 72వేల క్రిస్టల్స్ తో ఎయిరేకుల కమలంలో ఉన్న ఈ సహస్రార పిరమిడ్ అండ్ దాని చుట్టూరా ఉన్న గ్లోబ్ స్త్రీ శక్తి పురుష శక్తి కి అత్యున్నతమైనది ఎన్నో పవిత్రమైన జామెట్రిక్ స్ట్రక్చర్స్ ఇందులో నిక్షిప్తమై ఉన్నాయి. పంచకూతాలతో ఈ సహస్రారా విరమించుట లాండ్ స్కెల్పింగ్ కూడా జరుగుతుంది. ఎంతో అద్భుతంగా ఈ దృశ్యాన్ని చూసి ఆనందిస్తూ మనమంతా ఇదిలో ధ్యానం చేస్తూన్నాం.","మీ అనుభవాన్ని పూర్తిగా ఉందండి మీ మనసులో శరీరంలో ఈ సంకల్పాన్ని మనం విశ్వానికి విడుదల చెందాం ఇది శ్వాస ఆఖరిత కనిష ఆ బై సెకండ్ అది సెకండ్ ఐదు నాలుగు మూడు రెండు ఒకటి సున్నా నెమ్మది నెమ్మదిగా మీ చేతులు రెండు కొద్ది క్షణాల పాటు కళ్ళ మీద ఉంచుకొని ఒక చిరునవంతు కళ్ళు రెండు తెరతా వెల్కమ్ బ్యాక్ ఎవ్రీవన్ మరొక్కసారి అందరికీ స్వాగతం. ఈ దేవీ నవరాత్రుల సెలబ్రేషన్ లో ఈరోజు ఏడవ రోజులో ఉన్నాం. అండ్ అందరూ కూడా ఈ జ్ఞానాన్ని స్వీకరించడానికి సిద్ధమే అనుకుంటున్నాను.","మరి వీడియోస్ ఆన్ చేసుకొని జూమ్ లో ఉన్న ప్రతి ఒక్కరు కూడా చక్కని చిరునవ్వుతో మన క్వాంటం లైఫ్ యూనివర్సిటీ వ్యవస్థాపకులు అండ్ చైర్మన్ బ్రహ్మర్షి చక్రవర్తి డాక్టర్ న్యూటన్ కొండవెట్టి గారిని ఆహ్వానించుకుందాం. థాంక్యూ సో మచ్ సర్ ఓవర్ టు యు జ్ఞానోదయం శుభోదయం వండర్ఫుల్ మై డియర్ ఫ్రెండ్స్ సో ఈరోజు ఏడవ రోజు సప్తమ రోజు సప్తమి అష్టమి నవమి ఈ ఆఖరి మూడు రోజులు కూడా నవరాత్రుల్లో చాలా గొప్పగా భావన చేస్తారు సెలబ్రేట్ చేసుకుంటారు. దానికి కారణం ఉంది.","ఎందుకంటే మనం ఏదైతే సాధన చేసుకుంటూ వస్తున్నామో ఆ సాధన ఫలాలన్నీ కూడా ఈ మూడు రోజులు మనం ఆ అనుభవంలోకి మనకు వస్తాయి. మనం ఒకానొక రోజున ఈ తొమ్మిది రోజుల్లోనే మొదటి ఆరు రోజుల్లో మనం చెప్పుకున్నాం.","ఇచ్ఛా శక్తి క్రియాశక్తి జ్ఞానశక్తి అని చెప్పేసి మహాదుర్గా మహాలక్ష్మి మరి మహాసరస్వతి ఈ ఆఖరి మూడు రోజులు కూడా మహాసరస్వతి జ్ఞాన స్వరూపం అంతవరకు మన లోపల అంతర్శుద్ధి అన్నీ జరుగుతుంది ఇది కూడా అంతర్శుద్ధి జరుగుతుంది కానీ జ్ఞానం అనే అనే ఖడ్గం ద్వారా జరుగుతుందట మహా సరస్వతి సో దేవీ నవరాత్రుల్లో దేవీ భాగవతం మార్కండేయ మహర్షి మార్కండేయ పురాణం లో రాయబడినటువంటి ఎన్నో కథలు దేవీ మహత్యం వీరిలో చెప్పబడినటువంటి ఎన్నో కథల్ని మనం ఆధారంగా ా తీసుకొని అంతరార్థ సహితంగా తెలుసుకుంటూ వస్తున్నారు.","మహిషాశురుడు ఎలా వధింపబడ్డాడు సంహరింపబడ్డాడు మనలో ఉన్న అంతర్శత్రువుల గురించి చెప్పుకుంటూ వచ్చాం. ఈ కథలన్నీ ఒక్క విషయానికి ఒక్క విషయాన్ని మనకఅందరికీ తెలియజేస్తున్నాయి. ఈ బాహ్యార్థం తీసుకుంటే మనం దాని నుంచి ప్రయోజనం ఏమీ ఉండదు. కథ కొంత ఎంటర్టైన్మెంట్ మనకు క్రియేట్ చేస్తుంది కొంత కథలో కొంత ఆనందాన్ని వస్తుంది ఒక స్టోరీ వింటున్నాం కాబట్టి కానీ అంతకంటే ఏమి రాదు కానీ అంతరార్థాలు ఉన్నాయి ఇవన్నీ కూడా చాలా అంతరార్థ సహితంగా రాయబడినటువంటి కథలు ఈరోజు మరి ఆ ఎక్స్టెన్షన్ కథలు కూడా తెలుసుకుందాం.","ఎంతో మంది అసురులు ఆ దేవతా శక్తితో ఆ కాళికా మాతతో ఆ చండీ మాతతో ఎన్నో పేర్లతో ఆవిడ మరి ఈ శత్రులందరినీ కూడా సంహరించారు ఈ అసురుల రాక్షసులను సంహరించాడు. అంటే ఇవన్నీ కూడా మనం సంకేత రూపంలో తీసుకోవాలి మన అంతరంగా ఉన్నటువంటి అంతర శత్రువులు ఈ దివ్య శక్తితో మనలో ఉన్నటువంటి మేలుకొల్పబడిన ఆ శక్తితో మనం ఫస్ట్ సంహరించేసుకుంటాం. ఎన్నో శత్రువులు ఎంతో మంది అసురులు దానిలో ఈరోజు మనం తెలుసుకుందాం.","సుంభుడు నిస్సుంభుడు వీరు అన్నదమ్ములు అంటారు ఇవి కూడా ద్వయం లాగానే ఉన్నాయి అంటే రెండు రెండు సుంభుడు నిసుంభుడు సాధకుడులోని సుఖ వాసనా వృత్తి ఏదైతే ఉంటుందో అది సుంభుడికి ప్రతీకగా తీసుకోవాలి నిసంబుడు అంటే దుఃఖ వాసన ప్రవృత్తి ఇవన్నీ వృత్తులే వృత్తి అంటేనే ఏదైతే వృత్తము అంటే ఆ పదము మనం జాగ్రత్తగా అర్థం చేసుకుందాం వృత్తం అంటే సర్కిల్ ఇవి సుఖ దుఃఖ వాసనా వృత్తులు అంటే ఇవి కూడా ఒక సర్కిల్ గా మనల్ని ఎప్పుడూ అవే తిప్పుతూ ఉంటాయి. సుఖంతో పాటే దుఃఖం కూడా ఉంటుంది.","సుఖం ఎక్కడ ఉంటుందో దుఃఖం కూడా వస్తుంది దుఃఖం కూడా ఉంటుంది అక్కడ సుఖ దుఃఖాలు ఒకదాన్ని ఒకటి విడిచి ఉండవంట మనం దుఃఖంలో ఉన్నప్పుడు సుఖం నాకు కావాలనుకని కోరుకుంటాం సంకల్పాలు చేసుకొని సుఖం వైబం సుఖం వచ్చిన తర్వాత మళ్లా దుఃఖం కూడా వచ్చేస్తది ఈ సుఖ దుఃఖాలు కూడా అన్నదమ్ములు లాంటివి అంట సోదరులు నిసుంభుడు నిసుంభుడు కానీ సుఖ దుఃఖాలు నాకు ఈ సుఖం కావాలి దుఃఖం ఎందుకు వస్తాయి అంటే దానికి మూలం అహంకారము మమకారం అందుకే రెండు అర్థాలు చెప్పుకోవాలి ఇక్కడ సుంభుడు అంటే అది సుఖ వాసన ప్రవృత్తి ఇవన్నీ మన టెండెన్సీస్ ఈ మెంటల్ టెండెన్సీస్ మన సబ్కాన్షియస్ మైండ్ లో ఉన్నటువంటి వృత్తులు మనోవృత్తులు అవే ఎప్పుడు తిరుగుతూ ఉంటుంది నాకు ఇది కావాలి అది కావాలి సుఖం వైపు వెళ్తుంది.","ఆ సుఖంతో పాటే దుఃఖం కూడా మన దగ్గర వస్తుంది నిసుంభుడు కూడా వస్తాడు. సో సుంభుడు ఒక రాజు నిసుంభుడు సోదరుడు సో ఇంద్రుడితో పోరాడి నిసుంభుడు సంహరించబడ్డాడని చెప్పబడింది స్టోరీలో ఈ సుంభుడి ఆస్థానంలోకి ఆ కులువులోకి ఇంకా కొంతమంది వచ్చి చేరారు వాళ్ళలో చండుడు ముండుడు ధూమరులోచనుడు రక్తబీజుడు ఈ స్టోరీ రక్తబీజుడు గురించి ఇంతకుముందు కూడా విన్నాం. కరంబుడు తన చితిమీద గ్రహించబడినప్పుడు ఆ టైంలో రక్తబీజుడుగా మళ్లా బయటిక వచ్చాడు అని చెప్పి చెప్పుకున్నాం ఇవన్నీ సంకేత రూపంలో చెప్పబడ్డాయి.","ఈ నలుగురు కూడా ఎవరైతే ఉన్నారో ఈ నలుగురు చండ్రుడు ముండుడు ధూమ్రలోచండు రక్తవీదుడు ఈ నాలుగురు అసురులు కూడా సుంబుడు దగ్గరికి వచ్చి చేరారంట అంటే మనం సుఖ దుఃఖ వాసనా వృత్తులు మనకు ఉంటే అహంకారము మమకారం అని ఉంటే మిగతావి కూడా అన్ని వచ్చి చేరుతాయి దాంతో ఆకలులోకి అన్ని వచ్చి చేరుతాయి ఎన్నో ఎన్నో దుర్గుణాలు వచ్చేస్తాయి వాటితో నుంచి ఆ చుండుడు చండుడు లాగా ముండ  చేయగలిగేట్టు చేస్తుంది. అందుకే ధ్యానం ఎందుకు చెప్తాం అంటే ధ్యానం ద్వారానే శక్తి వస్తుంది. ధ్యాన సాధన ద్వారానే మన శక్తిని కూడ తీసుకుంటాం శక్తిని మేలుకొలుపుకుంటాం. ఆ శక్తే ఎన్నో కార్యాలను చేసేట్లు చేస్తుంది.","సో మనలో ఉన్నటువంటి అంతర్ శత్రువులని తుదముట్టించడము ఈ శక్తి చేసే మొదటి కార్యం సో ముందు సుంభుడు నిశుంభుడు మన జీవితంలో కూడా మనం వీటి గురించి మనం చూస్తే మనకు అర్థంవుతుంది మన జీవితంలో కూడా ఈ సుమ్ముడు ఉన్నాడు నిసింహుడు కూడా ఉన్నాడు చండ ముండులు ఉన్నారు భక్తబీజుడు ఉన్నాడు మనలో ధూమర్రలోచండు ఉన్నాడు వీళ్ళంతా ఉన్నారు ఇవన్నీ అంత అద్భుతంగా తెలియజేయబడ్డాయి అంటే మనం అంతరార్థాలు తీసుకుంటేనే మనం ఆ క్లారిటీతో ఆ స్పష్టతతో ఆ శక్తితో జ్ఞానం అనే అనేక ఖడ్గంతో మనం ఈ అంతర్శత్రువుని మనం జయిస్తాం.","సో ఒక్కొక్క విషయం గురించి మనం ఇప్పుడు తెలుసుకుందాం ఫస్ట్ ఈ అహంకారము మమకారము ఏదైతే సుఖ దుఃఖాలని మనకి క్రియేట్ చేస్తున్నాయో వాటి గురించి తెలుసుకుందాం. మనలో ఎన్నో సూక్ష్మ అహంకారాలు ఉంటాయి. మనకు తెలియకుండానే స్థూల అహంకారం గురించి చెప్పుకున్నాం సూక్ష్మ అహంకారం గురించి కూడా మనం కొంత చెప్పుకున్నాం. అవి గుర్తించాలి ఎన్నో రకరకాలైనటువంటి ఈగోస్ మనలో ఉంటాయి. ఒక చిన్న కథ చెప్పుకుందాం. ఒక ఊర్లో ఒక గొప్ప శిల్పి ఉండేవాడు ఆయన ఒక బంగారు బొమ్మని అద్భుతంగా చెక్కాడంట ఆయనక ఒక అహంకారం వచ్చేసింది నాలాంటి శిల్పి ఈ ప్రపంచంలోనే లేడు అనుకున్నాడు.","చాలామంది ఒక ప్రొఫెషన్ లో ఒక ఎక్సలెన్స్ వచ్చిన తర్వాత అహంకారం వస్తుంది. తెలియకుండానే వాళ్ళకి తెలియకుండానే నా అంతటి వాడు లేడు నేనే చాలా గొప్పవాడిని ధ్యాన సాధకుల్లో కూడా వస్తుంది ఇది వీళ్ళంతా అంత వీళ్ళంతా ధ్యాన సాధకులే సుంభుడు సాధన చేసుకునేవాడు నిశంభుడు చేసేవాడు వాళ్ళంతా తపస్సు చేశారు మహిషాశవుడు గురించి తెలుసుకున్నాం మనం ఆయన కూడా తపస్సు చేశాడు. జ్ఞాన సాధకుల్లో కూడా ఇవన్నీ ఉంటాయి. కానీ ఒక డేంజర్ ఏంటంటే చాలామందికి ఆధ్యాత్మిక ముసుగు అనేది వేసుకుని ఉంటారు.","ధ్యానం అనే ముసుగు నేను ధ్యానని నేను ధ్యానని కానీ చాలా అహంకారం అందుకే చాలామందికి వీరిలో ఏం మార్పు లేదు ఇప్పుడులాగా అట్లానే ఉన్నారు ధ్యానం చేస్తాను అంటారు అదే కోపం అదే టెండెన్సీస్ అదే సెల్ఫ్ డిస్ట్రక్షన్ అదే ఇవే ఉన్నాయి ఏ మార్పు లేదు చాలా మంది ఫ్యామిలీ మెంబర్స్ అందుకే ధ్యానం చేయడం ఇష్టం ఉండదు. ధ్యానం మనం చెప్తున్న కొద్ది వాళ్ళు ఇంకా వెనక్కి వెళ్తారు. నీలో ఫస్ట్ నీ మార్పు నువ్వు తెచ్చుకో అప్పుడు నేను నమ్ముతాను అంటారు.","ఏంటే ఆధ్యాత్మిక ముసుగు అనేది కూడా మనకు తెలియకుండానే ఉంటుంది మనలో సూక్ష్మం సూక్ష్మా సూక్ష్మంగా అహంకారం ఉంటుంది మమకారం ఉంటుంది. సో ఈ శిల్పి ఆ బంగారు బొమ్మ అని చెక్కిన తర్వాత అహంకారం వచ్చిందంట. సో ఒకరోజు ఒక సాధువు ఆయన ఇంటికి వచ్చాడు. ఆ శిల్పి గర్వంతో ఆ బంగారు బొమ్మలన్నీ చూపించాడు ఎంత ఈ బొమ్మల్ని ఎంత చక్కగా చేశాను చూడండి స్వామి నా ప్రతిభని చూశరా నేను గర్వంగా చెప్పుకుంటున్నాను. సాధువు కూడా నవ్వాడు నవ్వి ఒక చిన్న మూల ఉన్నటువంటి మట్టి ప్రమిదను చూపించాడు.","దీపాన్ని మట్టి దీపాన్ని చూపించి నాయనా ఈ బంగారు బొమ్మలు చాలా అందంగా ఉన్నాయి కానీ వీటిని కింద పడేస్తే ముక్కలు అయిపోతాయి పైగా దొంగల భయం దొంగలు ఎప్పుడు ఎత్తికెళ్తారు అనే భయం కానీ ఈ మట్టిప్రీమీద చీకటిని పోగొట్టి దీపాన్ని మోస్తుంది దానికి గర్వం లేదు భయం లేదు అహంకారం లేదు నీ అహంకారం కూడా ఈ బంగారు బొమ్మ లాంటిదే ఎప్పుడైనా పగిలిపోవచ్చు ఆత్మజ్ఞానం అనే మట్టి ప్రమిదిను వెలిగించు అన్నారు ఆ సాధువు అంటే మనకి ఎంత మనలో ఎంత గర్వం వస్తుందంటే ఒకసారి మనం నాకంటే వీరుడు లేడు సూర్యుడు లేడు అని ఒక విధమైనటువంటి అహంకారం వచ్చేస్తుంది.","ఎలాంటి అహకారాలు మనలో ఉంటాయి అంటే ఎన్నో రకరకాలుగా ఉంటాయి. సో డబ్బు అహంకారం ధన అహంకారం అంటాం. మనకు బాగా డబ్బులు వచ్చాయి ఒక అహంకారం వచ్చేస్తుంది. డబ్బులు లేనప్పుడు ఒక విధంగా ఉంటాం డబ్బులు వచ్చిన తర్వాత వేరే ఉంటాం. అంతవరకు మనం ఏ పదవిలో లేము ఒక పదవి వచ్చిన తర్వాత మళ్ళ అహంకారం ఒక స్టేటస్ స్టేటస్ వచ్చేస్తే ఒక పదవి దానితో పాటు అహంకారం మన అందం గురించి అహంకారం ఉంటుంది.","నేను చాలా అందగాని అందగత్తని అనే అహంకారం ఇంటలెక్చువల్ అరిగెన్స్ అనేది కూడా ఉంది విద్య భాజాను నేను పిహెచ్డి నేను యూనివర్సిటీలో గోల్డ్ మెడలిస్ట్ అందరికంటే నేను బాగా ఇంటలెక్చువల్ గా నాకు చాలా నాలెడ్జ్ ఉంది చాలా డిగ్రీస్ ఉన్నాయి నాకు ఇన్ని డిగ్రీలు ఉన్నాయి ఇన్ని చదివాను నేను నేను ఇంగ్లీష్ బాగా మాట్లాడతాను ఇదొక అహంకారం సో విద్య అనే అహంకారం ధనం అనే అహంకారం లేకపోతే నేను ఒక కులంలో పుట్టుంటారు వంశంలో పుట్టుంటారు అది కూడా అహంకారమే అది కూడా ఒక అహంకారం ఐడెంటిఫై అయిపోయిఉంటాం దాంతో మిగతా వాని తక్కువగా చూడడం సో నాకంటే బలవంతుడు లేడు నాకంటే యవ్వనవంతుడు లేడు అనే అహంకారం కూడా ఉంటుంది.","నేన ్వతి రూపం అంటే జ్ఞాన రూపం ఆ కౌసికా మాత ఎన్నో ఆయుధాలని ధరించి అష్టభుజాలతో అంటే ఎనిమిది భుజాలతో ఎన్నో ఆయుధాలు ఉన్నాయంట దగ్గర ఆయుధాలను ధరించి వీళ్ళందరినీ ఒక్కొక్కరిని సంహరించడం స్టార్ట్ చేసింది అంటే ఒక్కొక్క రాక్షసుడు అసురుడు ఎవరైతే ఉన్నారో అంతర్శత్రులు ఉన్నారో ఆ శక్తి ఆ రూపాన్ని ధరించడం అన్నమాట ఇక్కడ ఇక్కడ జ్ఞానం అనే రూపాన్ని ధరించాలి ఇక్కడ అహంకారం మమకారాలని మనం కట్ చేయాలి తర్వాత ఈ యొక్క ద్వంద్వాలు ఏతే మనం ఉండి నలిగిపోతుంటాం ద్వంద్వాల మధ్య సుఖ దుఃఖాలు అనే ద్వంద్వాలు కాదు తర్వాత రక్తబీజుడు అంటే కూడా మనం చెప్తున్నాం.","మనలో ఎన్నో కోరికలు ఉంటాయి ఒకటి కాదు ఒక కోరిక తర్వాత ఇంకా 10 కోరికలు వస్తాయంట దానికి నెవర్ ఎండింగ్ మన డిజైర్స్ కి మన కోరికలకి ఎప్పుడూ కూడా అంత ఉండదు ఒకదాని తర్వాత ఇంకొకటి ఇంకొకటి ఇంకొకటి తృప్తి అనేదే లేదు మనిషికి అందుకే ఒకానొక రోజు మొన్న మనం చెప్పుకున్నాము మెటీరియల్ కంటెంట్మెంట్ స్పిరిచువల్ డిస్కంటెంట్మెంట్ ఇస్ ఏ గుడ్ ఫార్ములా గుడ్ రెసిపీ మెటీరియల్ ప్లేన్ లో ఎంత తృప్తిగా అంటే బాహ్యంగా మన భౌతిక ప్రపంచంలో మనం ఎంత తృప్తిగా మనం ఉన్నదానితో మనం తృప్తిగా ఉండాలి ఆధ్యాత్మికంగా మనం ఎప్పుడు కూడా ఎంత ఎంత అసంతృప్తితో ఇంకా నేర్చుకోవాల్సి ఉంది ఇంకా ఉంది ఇంకా ఉంది ఎప్పుడు వెళ్ళాలన్నమాట ఇంకా తొందరగా వెళ్ళాలి.","ఇది చాలా గుడ్ ఫార్ములా అంటారు. సో రక్తబీజుడు కోరికలు ఒక కోరిక తర్వాత ఇంకో కోరిక ఒక్క కోరిక ఒక రక్తపు బొట్టువెయి రక్తపు బొట్టులుగా 1000 రక్తపు రక్త బీజులుగా తయారైపోతుంది. ఒక కోరికే 1000 కోరికలుగా అయిపోతుంది. మల్టిప్లై అయిపోతుంటుంది. అందుకే చాలామంది ఈ కోరికలు కోరికలు జీవితంంతా దానికే అయిపోతుంది. ఈ భౌతిక ప్రపంచం కోసమే మనం జీవించేస్తాం. ఇంకెప్పుడు మనం రియలైజ్ అవుతాం ఎప్పుడు మనం మన గురించి మనం తెలుసుకుంటాం.","నిజమైన విద్య ఎప్పుడు మనం సాధన చేస్తాం నిజమైన విద్యను ఎప్పుడు పొందుతాం ఆత్మవిద్య బ్రహ్మవిద్య ఈ రక్తబీజుడు అనే ఈ రాక్షసుడు సంహారం కూడా ఎలా జరిగిందో తెలుసుకుందాం. ఈ కౌసిక మాత ఎన్నో రూపాలను ధరించింది మళ్ళ చుండ ముండుల్ని వారిని ఫస్ట్ సంహరించింది. మనం అని చెప్పుకున్నాం బాధను కలుగచేసేది బాధన అంటే మనలో ఉన్నటువంటి అందరిని బాధించే స్వభావం ఈ అసురులంతా అందరూ బాధ కలుగచేస్తారు. మనకి మనకే బాధ వస్తూఉంటుంది అందరికీ బాధ కూడా కలుగజేస్తాం అసురు గుణాలు దుర్గుణాలు తమోగుణం నుంచి రజోగుణం నుంచి వచ్చేస్తాయి సత్వగుణం నుంచి మూడు గుణాల నుంచి వచ్చేస్తాయి.","సత్వగుణం అంత ఎక్కువగా రాదు కానీ సత్వగుణ దోషం వచ్చేస్తే మాత్రం అది కూడా ఒక సూక్ష్మ అహంకారంగా తయారై అది కూడా టూ డేంజరస్ సో ఈ అసురులందరినీ సంహరించడానికి కౌసికా మాత చాముండేశ్వరిగా ఆవిర్భవించి చండీ మాత చాముండేశ్వరి చండ్రుడు ముండుడు వాళ్ళద్దరిని సంహరించింది. భయంకరమైనటువంటి వంచనా మనోవృత్తి గలన చండుడు ఎప్పుడు కూడా వినాశకారం వలిపెట్టేటటువంటి ముండుడు వారిద్దరిని సంహరించేసింది. ధూమ్రలోచనుని సంహరించేసింది. అంటే మాయా ప్రవృత్తి ధూమ్రలోచన అంటే మాయ అంటే మనసు అంటేనే మాయ మన ఆలోచనలే మాయ మాయా ప్రపంచాన్ని సృష్టి చేస్తుంటాయి.","ఒక కాళికామాత లాగా ఆవిర్భావం చేసి ఆ కాళికామాత ఒక్కొక్క రాక్షసి సంహారం చేసుకుంటూ అంటే వేరు వేరు పేర్లు ఇవ్వబడ్డాయి ఒకటే మాతకి ఈ మాతకే చాముండేశ్వరుని చండుడిని ముండుడిని సంహరించేటప్పుడు రక్తబీజుని సంహరించేటప్పుడు ఆవిడ కాళికామాతగా నాలుకని ఈ ఉమన్ల అంతా పరిచేసిన ఎందుకంటే రక్తబీజుడు ఆయన నుంచి ఒక్క రక్త బొట్టు వస్తే ఆయన వందల కొలది వేల కొలది రాక్షసులు ఆయన లాంటి వాళ్ళు రెప్లికేట్ అయిపోతుంటారు. అందుకే ఆవిడ నాలుకని భూమండలం అంతా పరిచేసిందంట.","నాలుకని మొత్తం పరిచేసేసి ఖడ్గంతో తీసుకొని రెండు చేతులతో ఖడ్గంతో జ్ఞానం అనే ఖడ్గంతో మరి రక్తబీజుని సంహరించేసింది. ఆ రక్తం అంతా తను తాగేసింది. సో ఒక క్రియ ఉంది. యోగక్రియ దాన్నే సింహ క్రియ సింహాసన క్రియ సింహ క్రియ అంటారు.","అది ఈ కాళికామాత ఈ రక్తబీజుని సంహరించే క్రమంలో ఆవిడ ఏ పాస్చర్ అయితే తీసుకున్నారో వజ్రాసనంలో కూర్చుని చాలామంది చేస్తారు ఇది మనం నాలుకని బయట పెట్టినప్పుడు పెద్దగా చేసి కళ్ళు పెద్దగా చేయాలి తర్వాత మన దృష్టిని ఈ భూమధ్యంలో పెడతారు సింహ సింహ క్రియ ఆ కాళికామాత లాగే ఆ కాళికామాత నాలుకని అంత పెద్దగా చేసి పరిచేసి మొత్తం రక్తాన్ని తాగేసిందంట అంటే ఆ కోరికల్ని మనలో ఉన్న అన్ని కోరికలు ఈ కాళికా మాతే మొత్తం ఎందుకంటే ఆ మెటీరియల్ ప్లేన్ లో ఎప్పుడు కోరికలకి ఎండ్ ఉండదు తప్పని కాదు సరైన కోరికలు తృప్తి పడాల మనం ఒక కోటి రూపాయలు సంపాదించిన తర్వాత నాకు 100 కోట్లు కావాలనిపిస్తుంది.","100 కోట్లు వేల కోట్లు కావాలనిపిస్తది దానికి ఎప్పుడు అంతు ఉండదు కోరిక తీరినప్పుడు ఆనంద పడతాం మళ్లా మనం కోరింది రాకపోతే దుఃఖ పడుతుంటాం. దాంట్లో నలిగిపోతుంటాం. కోరిక కోరికలు ఎన్నో జన్మలు మనం మళ్లా తిరిగి తిరిగి వచ్చేట్లుగా చేస్తుంది. ఎన్నో జన్మలు తీసుకుంటుంటాం. ఒక చిన్న కోరికతో మళ్లా పుడుతుంటాం."],"minutes":8,"words":1129},{"title":"తృప్తి · రక్తబీజుడు · బ్లాక్స్","paras":["తృప్తి లేదు మనకి మనిషికి తృప్తి లేదు ఎండ్లెస్ ఎండ్లెస్ డిజైర్స్ అందుకే ఇక్కడ తృప్తిగా కంఫర్టబుల్ లైఫ్ ఉన్నదానితో తృప్తిగా ఉండొచ్చు మనం మనకు కావాల్సింది ఒక చిన్న హట్ కావాలి అంతే ఒక చిన్న హట్ు మనం మన్షన్ అక్కర్లేదు మన సాధన కోసం ఏం కావాలి ప్రకృతిలో చక్కని ఒక గుడిసే చాలు ఇప్పుడు 10 ఇల్లు కొనుక్కున్నా కూడా మనకి ఏం తృప్తి ఉంది ఇక్కడ అన్ని హౌసెస్ లో మనం ఉంటామా ఒకటే కాలంలో ఉంటామా అన్ని అపార్ట్మెంట్లు ఇక్కడ ఒక అపార్ట్మెంట్ అక్కడఒకటి ఇక్కడఒకటి అక్కడఒకటి ఏం చేసుకుంటాం తృప్తి లేదు మనిషికి ఏమి తృప్తి ఉండదు ఎన్ని ఉన్నా తృప్తి ఉండదు సో చాలామంది వరకు ఈ సింహ క్రియ చేసేటప్పుడు వజ్రాసనంలో పూర్తి చేసేటప్పుడు మామూలుగా థైరాయిడ్ ప్రాబ్లమ్స్ కి ఈ థైరాయిడ్ అనేది ఈ విశుద్ధ చక్రానికి సంబంధించింది.","ఆ ప్రాబ్లమ్స్ క్రియేట్ దాన్ని హీల్ చేసుకోవడానికి ఆ శక్తి ఇక్కడ ఉండే బ్లాక్స్ అన్ని రిమూవ్ చేసేస్తుందంట. నాలుకని బయట పెట్టి వి బ్రీత్ అవుట్ అని మనం టౌన్ చేస్తాం ఇదిఒక క్రియ ఆ జగన్మాత కాళికామాత రక్త బీజం ఎలా సంహరించింది నాలుకని పరిచి ఒక రక్త బొట్టు కూడా కింద పడలేదు తాగేసింది మొత్తం కాళికామాత ఆమె భీకర స్వరూపమే గానీ శత్రువులకు భయం కల్పించే రూపం కానీ ఎవరైతే సాధకులు ఉంటారో వారి పట్ల దయ కరుణ ధ్యాన సాధకులు ఉన్నారు మనం అన్ని నేర్చుకోవడానికి సిద్ధంగా ఉన్నాం ఆవిడ అంట మనకి అన్ని ఇచ్చేస్తుందంట అన్ని ఏది కావాలన్నా ఇస్తుంది.","మన ఎన్నో కోరికలు ఉంటాయి అన్ని నెరవేరుస్తుందంట సకల భోగాలు ప్లస్ మోక్ష ప్రదాయని కూడా ఆవిడ మోక్ష జ్ఞానం కూడా ఇస్తుంది. ఆ తల్లి అంటే మనలో ఉన్న ఈ గొప్ప శక్తినే ఎన్నో రూపాలుగా ఈ శక్తి మనక ఎన్నో ఇస్తుంది. మనం ఏది అడిగినా ఇస్తుంది. కానీ ఏమ అడగాలో మనకి ఆ క్లారిటీని మనం సంపాదించుకోవాలి. సో ఈరోజు నుంచి మనం ఈ నవరాత్రుల్లో ఆ జ్ఞాన స్వరూపమైనటువంటి కౌశిక మహాసరస్వతి ఆమ ఎనర్జీకి ట్యూన్ అవుతుంటాం ఆత్మజ్ఞానం ఆమె అంటేనే కౌసిక మాత అంటేనే ఆత్మ జ్ఞానం బ్రహ్మ జ్ఞానం ఆ వైపు మనం వెళ్ళాలి.","మనల్ని ఏవి ఆపుతున్నాయి అంటే ఇవే మనం చెప్పుకున్నటువంటి మనో ప్రవృత్తులు మనల్ని బంధించేవి ఏదైనా సరే ఆ బంధనాల్ని మనం గుర్తించాలి ఫస్ట్ ఆ బంధనాల నుంచి కొన్ని బంధనాలు బ ట సమాధి అనే వ్యాపారికి సమాధి అని పేరులోనే ఉంది ఆయనకి మెడిటేషన్ పరంగా నాకు బ్రహ్మజ్ఞానం కావాలని కోరుకున్నాడు అదే ఆయనకి పొందాడు. సురధుడు నేను గొప్ప రాజుని కావాలి గొప్ప రాజ్యాధికారం కావాలి రాజభోగాలు కావాలి అన్ని కోరుకున్నాడు అవే ఇచ్చింది. ఆ తల్లి మనం ఏం కోరుకుంటే అది ఇస్తుంది.","ముక్తోభిమాని ముక్తోి బద్ధో బద్ధో మాన్యపి కింవదంతి సత్యేవ యామతి సాగతిర్భవేత్ మన మతి అలా ఉంటే మన గతి అలా ఉంటుంది మనం ఏం కోరితే ఆ అమ్మ అదే కరుణిస్తుంది అదే ఇస్తుంది ఆ శక్తి అదే ప్రసాదిస్తుంది. మనం బంధనాలు కావాలి బంధించబడాలి అంటే ఆ బంధనాలే మనకి వస్తాయి అంతే నాకు రాజ్యం కావాలి రాజు కావాలి నాకు పదవి కావాలి డబ్బులు కావాలి అని అవి వస్తాయి. ఆ డైరెక్షన్ లో వెళ్తాం.","నాకు మోక్షం కావాలి నాకు ఎన్లైటన్మెంట్ కావాలి ఆత్మజ్ఞానం కావాలి బ్రహ్మజ్ఞానం కావాలి అది ఇస్తుంది రెండు కావాలంటే రెండు కూడా ఇస్తే కానీ ఆ వివేక బుద్ధి జ్ఞానం కలిగి ఉండాలి బ్యాలెన్స్ చేయడానికి రెండు ఉంటే ఆ రెండిటిని బ్యాలెన్స్ చేయడానికి మరి అది కావాలి ఒక జనక మహారాజు ఎలా జీవించాడో అలా జీవించగలం కానీ ఆ జ్ఞానం కావాలి ఆత్మజ్ఞానం లేకపోతే రెండు బ్యాలెన్స్ చేసుకోలేరు. ఈక్వైర్మెంట్ తో ఉండలేరు. సమద సమభావంతో సమదృష్టితో ఉండలేరు.","సో మై డియర్ ఫ్రెండ్స్ మరి శుంభుడు నిసుంభుడు చండుడు ముండుడు ధూమ్రలోచనుడు రక్తవేజుడు వీరందరినీ కూడా ఒక్కొక్కరిని సంహరించేసింది మన అంతర్ శత్రువులే వీళ్ళు జ్ఞానపరంగా మనం తెలుసుకోవాల్సినవి చాలా ఉన్నాయి మన గురించి మనం ఏవైతే మనల్ని ఈవెన్ ఆధ్యాత్మిక పరంగా ా కూడా ఒక ముసుగు అనేది మనం వేసుకున్నామో ఆధ్యాత్మిక ముసుగు నుంచి బయటికి వచ్చేద్దాం.","ధ్యానం అనే ముసుగు నేను చాలా గొప్ప ధ్యానిని అని మనం అనుకోకూడదు సాధన చేసుకోవాలి అంతే ఎందుకంటే ఈ అంతరార్థ సహితమైనటువంటి కథల్లో అన్నీ కూడా ఒక స్ట్రక్చర్ ఉంది మనం చూడగలుగుతున్నాం అక్కడ అన్ని కథల్లో కూడా శత్రువుల గురించి చెప్పారు ఒక దేవతా శక్తి వాళ్ళని సంవరిస్తుంది. ఫైనల్ గా వాళ్ళకంతా కూడా చాలా అద్భుతంగా ఆ సెలబ్రేషన్ ఉంటుంది.","మనలో జరిగే జీవుడు చేసే సాధన వచ్చే అంతరాయాలు అంతర శత్రువులు వాళ్ళపై విజయం సంపాద సాధించడం ఇవన్నీ కూడా ఒకటే కథల యొక్క సారాంశం అంతా ఒకటే ఇదే తెలుసుకోవాల్సింది అంటే సాధకుల్లో కూడా ధ్యాన సాధకులు కూడా అంతర్శత్రువులని జయించాలి అంత శత్రువులని విస్మరించకూడదు ఊరికే చేస్తున్నాం చేస్తున్నామ అనే ఒక బ్యాడ్జ్ పెట్టుకోకూడదు. నేను ధ్యాన సాధన చేస్తున్నాను ధ్యానం చేస్తున్నాను చాలా మొత్తం చాలా గ్రేట్ యాక్షన్ మెడిటేట్స్ రియలీ గ్రేట్ కానీ ముసుగ వేసుకోకూడదు.","ఎప్పటికప్పుడు అంతర్శుద్ధి అంతర్ శత్రువులు అరిషడ్ వర్గాలు గురించి చెప్పుకున్నాం అందుకే రైట్ విస్డమ రైట్ విస్డమ మనకు కావాలి రైట్ నాలెడ్జ్ కావాలి. కాన్స్టెంట్ గా రెండు జరుగుతుంటాయి మన ధ్యాన సాధన చేసుకుంటూ ఉంటాం అంతర్శుద్ధి పారలల్ గా జరుగుతుంటుంది మళ్లా మనం ఆధ్యాత్మికంగా దానిపరంగా పురోగతి చెందుతూ ఉంటాం. రెండు జరగాల ధ్యానం చేస్తున్నప్పుడు సాధకులు ప్రారంభంలో కాయలుగా ఉంటాం మనం కాయ మామిడి కాయ సీతాఫలం సీతాఫలం కాల సీతా ఫలం ఇంకా కాయ స్టేట్ లోనే ఉంది. అది పండు కావాలి. పండు అయితేనే కదా మనం తినగలిగేది మధురంగా ఉంటుంది.","కాయ ముట్టం కూడా ముట్టం చేదుగా ఉంటుంది తినాలంటే సో ధ్యాన సాధన చేసుకుంటుంటే మనం అంతర్శుద్ధితో అన్ని ఏదైతే జరుగుతుంటాయో అంతర్శక్తుల్ని మనం విజయం సాధిస్తామో ఈ శక్తి సహాయంతో శక్తి స్వరూపని సహాయంతో మనం కాయ పండు అవుతుంది. మనం పండాలి బాగా పండాలి కాయ పండుకోవడమే ఎన్లైటన్మెంట్ మెచూరిటీ ఇన్ ఎన్లైటన్మెంట్ మనం జ్ఞానం చిగురిస్తుంది ఫస్ట్ కాయ అవుతుంది కాయ వస్తుంది పిండి వస్తుంది.","అది పండు కావాలి ఇవన్నీ కూడా ఈ సూక్ష్మాలన్నీ కూడా వీటి సటిల్ పాయింట్స్ ని ఈ అంతరార్థ సహితంగా దేవీ భాగవతంలో చెప్పబడ్డాయి ఇవన్నీ కూడా ఈ మూడు రోజులు కూడా కాయ పండు కావడమే ఈ మధ్యన మన ఫ్రూట్స్ అన్నీ ఎట్లా అంటే కార్బైడ్ వేసి కెమికల్స్ పెట్టేసి ఫాస్ట్ గా పండు కావాలని తయారు చేస్తారు కెమికల్ అయన్నీ కూడా మనం దానిలో ఏమి పోషకాలు గాని ఏమి ఉండవు అన్ని పోతాయి ఆర్గానిక్ గా కావాలి దానికి అదే పండాలి మన మనం చేసే పని సాధన చేసుకుంటూ ఉండాలి అంతర్శుద్ధి జరుగుతూ ఉంటుంది.","సాధన చేసుకుంటూ ఉంటాము కాయ పండు అవుతుంది ఆర్గానిక్ గా కావాలి దానిలో ఫాస్ట్ గా అయిపోవాలి రెండు రోజుల్లో పండించుకోవాలి నేను మామిడికాయను పండు చేసేయాలి అంటే కుదరదు. క్రాష్ కోర్స్ ఇన్ ఎన్లైటన్మెంట్ 40 రోజుల్లో మీకు ఎన్లైటన్మెంట్ అ ఏం లేదు జన్మలు జన్మలు ఎన్నో జన్మలు 40 రోజుల్లో ఎన్లైటన్మెంట్ వస్తే ఇవన్న ఎప్పుడో మొత్తం అంతా బ్రహ్మజ్ఞానులతో నిండిపోయిఉండేది ఒక ప్రయాణం ఇది ఆత్మ ఎన్ని జన్మలు తీసుకొని ఎన్నో జన్మల ప్రయాణం ఇది షార్ట్ కట్ లేదు సో కాయ పండు కావాలి.","మనం ఏ స్థితిలో ఉన్నామో మనకి అంతరంగా మనకి తెలుసు ప్రతి ఒక్క స్ట్ రూపం చూస్తారున్నమాట సో కలర్ చూస్తారు కలర్ కూడా వాళ్ళ కలర్ వచ్చింది ఇవన్నీ ఆ పోలిక చేయడం వల్ల ఒకోసారి అది కూడా బ్లాక్ అయిపోతుంది.","ఈ బ్లాక్స్ కలగడం తప్పేం కాదు మనం ఒక వయసు వచ్చిన తర్వాత సాధారణ తెలిసిన తర్వాత ఈ ఆధ్యాత్మిక మార్గం దొరికిన తర్వాత ఆ బ్లాక్స్ తో ఇంకా అలానే కొనసాగి జీవించడం అనేది తప్పు మన రెస్పాన్సిబిలిటీ తీసుకోవాలి బాధ్యత తీసుకొని స్వీయ బాధ్యత తీసుకొని ఆ బ్లాక్స్ నుంచి మనం బయట పడగలిగే ఆ శక్తి మనలోనే ఉంది ఆ జ్ఞానము మనలోనే ఉంది సో అవి మనలో కలగడం అనేది ఆ బ్లాక్స్ వేరే వాళ్ళ ద్వారా మనకి రావడం అనేది తప్పేమి కాదు అందరికీ వస్తాయి ఎందుకంటే ఈ ఫిజికల్ డైమెన్షన్ కదా చాలామంది అనుకుంటాం ఈ ప్రపంచము ఒక రోజ్","పెటల్ అన్నీ కూడా చాలా సువాసనతో అద్భుతంగా ఉంటుంది అని మనం అనుకుంటాం కాదు లైఫ్ ఇస్ డిఫికల్ట్ ఇక్కడన్నీ ముళ్ళ ముళ్ళ బాటే ఇక్కడ ఆ ముళ్ళ మీద నడవాల మనం ఎంత తొందరగా మనం తెలుసుకుంటామో ఆ ముళ్ళు కూడా మనం ఒక స్థితిలో ఒక ఆధ్యాత్మిక స్థాయి వచ్చిన తర్వాత జ్ఞాన స్థాయి కలిగిన తర్వాత ఏది బాధించదు మనం ఇక్కడ ఏది భయపడం మనం చా చావుకే మనం భయపడం ఎందుకంటే మనకు మరణం లేదు మన ఆత్మకు మరణం లేదు ఏం జరిగిన కూడా ఈ శరీరాన్ని ఇక్కడ వదిలేస్తున్నాము అంతే ఆ భావన ఆ బ్లాక్స్ అన్ని వెళ్ళిపోతాయి సో అందరూ","తల్లిదండ్రులు ఎన్లైటన్మెంట్ తో ఉండరు అందరూ బుద్ధితో కాదు అందుకే వాళ్ళ కొలుస్తారు అన్నమాట అవే బ్లాక్స్ అయిపోతాయి కానీ ఆ బాక్స్ ని తొలగించుకునే బాధ్యత మనది సాధన తెలిసిన తర్వాత ఇవన్నీ వెళ్ళిపోతాయి అంతర్శుద్ధి ఇవన్నీ కూడా అంతర్శుద్ధే వండర్ఫుల్ తెలుసుకుంటున్నారు సార్ తెలుసుకుంటున్నారు కదా వెరీ గుడ్ వెరీ గుడ్ మన పద్యతలకి మన కర్మలకి మనమే సృష్టికర్తలం మన ధ్యానం చేసి తెలుసుకోవడం తెలుసుకుంటాం తెలుసుకున్నారు వండర్ఫుల్ వండర్ఫుల్ ఆల్ ది బెస్ట్ నెక్స్ట్ థాంక్యూ అండి అండ్ మహతి గారు నమస్తే","మాస్టర్ ఈ అవకాశం ఇచ్చినందుకు చాలా చాలా ధన్యవాదాలు రోజు మాకు హారిక మేడం చేత చక్కగా పాట వినిపిస్తున్నందుకు చాలా చాలా థాంక్యూ నా ప్రశ్న ఏంట ఏంటంటే అటోపనిషత్తులో నచ్చకేతని గురించి కొంచెం నాకు చిన్న చిన్న డౌట్స్ ఉన్నాయి అది నాకు క్లియర్ చేయాలి అడగండి క్వశ్చన్ అడిగి అంటే ఆయన చెప్పింది నచ్చకేతురు స్వర్గ లోకానికి వెళ్ళారు ఆ ఆస్ట్రోల్ ట్రావెల్ చేసి వెళ్ళిపోయాడు మళ్ళీ అక్కడికి వెళ్లి యమధర్మరాజుని ఆకలి దప్పలిక లేకుండానే ఉన్నాడు అక్కడ మూడు రోజులు మళ్ళీ అదే ప్రశ్న ఎందుకు ఎందుకు వేసాడు ఆక"],"minutes":8,"words":1100},{"title":"నచికేత విద్య · ప్రశ్నలు","paras":["ఆకలి దప్పిలక లేకుండా ఎలా ఉన్నారు అని ఎలా వేశడు సరే అది అదా లేకపోతే అక్కడ స్వర్గ లోకంలో ఉన్న వాళ్ళందరూ కూడాను ఆకలి దప్పికలు లేకుండా ఉన్నారు ఎలా ఉంటున్నారు అని చెప్పేసి అడుగుతున్నారు అది నాకు కొంచెం క్లారిటీ నాకు అర్థం కాలేదు సార్ ఇంకా మనక సంబంధించింది ఆ చెప్పారు ఆ అయితే అది ఇప్పుడున్న మనం నాచురల్ ట్రావెల్ చేస్తున్నప్పుడు మనం కూడా ఆ రకంగా వెళ్ళొచ్చా ఓకే అది జ్ఞానగ్ని చేస్తున్నప్పుడు అక్కడ మనకి విష్ణు గ్రంధి ఉంది ఆ విష్ణు గ్రంధి భేదించుకుంటే మనం కూడా వెళ్ళొచ్చా అనేది కొంచెం","డౌట్స్ ఉన్నాయి సార్ వండర్ఫుల్ మహితి మేడం థాంక్యూ ఎందుకంటే నచికేత విద్య నచికేతుడు ద్వారా ఈ లోకానికి అందించబడిన జ్ఞానం నచికేత విద్య ఒ గొప్ప విద్యని ప్రసాదించారు.","అమృత తత్వం గురించి ఆయన ద్వారా లోకానికి అందింది. అంటే ఆ ఆత్మకు చావు లేదు ఆత్మ నశింపజాలదు ఈ విషయాన్ని నచికేతుడు తన స్వానుభవం తన అనుభవం ద్వారా అందరికీ తెలియపరిచారు. సో ఆయన నచికేతుడు అతి చిన్న వయసులోనే అదర్ డైమెన్షన్ కి వెళ్ళడము ఆ స్టోరీ మనకఅందరికీ తెలుసు అంటే ఈ సూక్ష్మ లోకాలు ఉన్నాయి.","ఈ యమలోకం అనేది ఒక లోకం అదిఒక డైమెన్షన్ ఒక ఒక లోకం సూక్ష్మ లోకం ఆ సూక్ష్మ లోకంలోకి వెళ్లి ఆయన అక్కడ యమధర్మరాజుతో వెయిట్ చేసి యమధర్మరాజుని కలిసి సంభాషణ చేసి వచ్చాడు యముడితో అట్లా సంభాషణ చేయడం అంటే నాట్ ఏ జోక్ ఒక చిన్న బాలుడు ఆ విధంగా చేసిన ఎంత గొప్ప మాస్టర్ ఎంత గొప్ప ధ్యాన సాధన చేస్తే ఆ యొక్క శక్తి ఆ వైబ్రేషన్ ఆయనలో ఉంది కాబట్టి యమధర్మరాజు కూడా వచ్చి మాట్లాడాడు. వచ్చి ఫస్ట్ మభ్య పెట్టడానికి ట్రై చేశాడు.","నువ్వు అడిగే ప్రశ్నలు వాటికంటే వేరే ప్రశ్నలు అడుగు నీకు ఏం కావాలన్న ఇస్తాను నీకు 1000 ఇయర్స్ బతికేట్టు కూడా నేను నీకు ఎక్స్టెన్షన్ చేపిస్తాను భౌతిక దేహంలో నీకు డబ్బులు ఇస్తాను రాజ్యం వస్తుంది నీకు అన్ని వస్తాయి అంటే ఏం కాదు నాకు ఈ ఆన్సర్స్ కావాలని పట్టుకొని కూర్చుంటాడు. ఈ లోకాలు ఏంటి ఆకలి డప్పులు లేకుండా ఇక్కడ ఎందుకుఉంటాయి ఎట్లా ఉండగలుగుతారు ఇవన్నీ కనుక్కున్నాడు వివరాలు కనుక్కున్నాడు అదే జ్ఞానం నిజ నిజంగా తెలుసుకోవాల్సిన జ్ఞానం అంతా కూడా అక్కడే ఉంది.","మనం ఈ యొక్క స్థూల జగత్తే జగత్తు అనుకుంటున్నాం కానీ సూక్ష్మ జగత్తు ఉంది కారణ జగత్తు ఉంది దాన్ని మించినటువంటి మహాకారణ లోకాలు ఉన్నాయి. సో వాటి గురించి ఎంతో క్షుణణంగా ఆ విద్యనంతా ఆయన పట్టుకున్నాడు. అది ప్రతి ధ్యాన సాధకుడు చేయగలుగుతాడు. ప్రతి ధ్యాన సాధకుడు కూడా ఒక నజ్యకేతుడు అయిపోతాడు. నచ్చికేతుల్లాగా ఆ సూక్ష్మ లోకాలకి ఆస్ట్రల్ ట్రావెల్ సూక్ష్మ శరీర యానం అనేది చేయగలుగుతారు.","మామూలుగా సైంటిస్టులు ఇవి లేవు అవి లేవు అంటుంటారు వాళ్ళు ఎందుకంటే వైజ్ఞానికులు వాళ్ళ కోణంలో వాళ్ళు చూస్తారు మైక్రోస్కోప్లోన టెలిస్కోపుల్లోనో పరికరాలతో పరికరాలు ఏమి బంధించలేవు ఆత్మని ఎవరు ఎవిడెన్స్ చూపించగలరు ఆత్మ ఉందని ఏమనా ఫోటోగ్రాఫ్ తీయగలుగుతామా లాస్ట్ వాటర్ తీసి మొదలో ఏ పరికరంతో మనం మెజర్ చేయగలుగుతామా ఏమి చేయలేం ఇవి అందదు సైన్స్ కి అందనటువంటి విషయాలు సూక్ష్మ శరీరం ఉందనేది అనేది కూడా వాళ్ళకి తెలియదు.","ఎందుకంటే స్థూలాన్ని వాళ్ళు రీసెర్చ్ అంతా స్థూల జగత్తు గురించే కాబట్టి ఈ సూక్ష్మ జగత్తు గురించి ఒక ధ్యాన సాధకులు చక్కగా అక్కడికి వెళ్లి ఎన్నో విషయాలు తెలుసుకుంటారు లైఫ్ ఆఫ్టర్ డెత్ లైఫ్ బిట్వీన్ లైఫ్ జన్మ తీసుకోకుం ఇంకొక జన్మ తీసుకునే ముందర అక్కడ మనం చేసే చాలా ఉంటాయి వాటి ఆ విషయాలని చక్కగా మనం అర్థం చేసుకుంటాం అక్కడ అనుభవాలన్నీ కూడా ధ్యాన సాధకులకి ఒకానొక స్థితుల్లో వాళ్ళక కలుగుతాయి ఈ ధ్యానానుభవాలు వస్తాయి. నచ్చికేతుడు ఏదైతే పొందాడో అందరికీ వస్తాయి.","సో దీనికి ఎంతో అంతరార్థాలు ఉన్నాయి మేడం ఈ స్టోరీ కూడా నచికేత విద్య నచికేత అగ్ని ఆ అగ్ని స్వరూపంతో ఎన్నో మనలో ఉన్నటువంటి అజ్ఞానం వెళ్ళిపోతుందంట దాని అంతరార్థ సరి సహితంగా కతోపనిషత్ని మనం చెప్పుకోవాలి దానిలో అద్భుతమైనటువంటి జ్ఞానం ఇవ్వబడింది ఏ ఒక్క ఉపనిషత్తు పట్టుకున్నా కూడా మనం ఆ బ్రహ్మజ్ఞానమే కొట్టేస్తాం ఒక్క కథోపనిషత్తు అక్కడికి వెళ్ళిపోతుంది తీసుకని వెళ్తుంది పట్టుకోవాల దాన్ని కరెక్ట్ గా అంతరార్థాలను పట్టుకోవాల ఓకే మేడం థాంక్యూ వండర్ఫుల్ నెక్స్ట్ అండ్ 7:15 దాటింది సర్ యు వాంట్ టు టేక్ యా ఇంకొకళ్ళ తీసుకుందాం కొత్తవాళ కొత్త వాళ్ళు ఎవరైనా యా ఇప్పటిదాకా మాట్లాడని వాళ్ళు ఎవరైనా మాట్లాడాలనుకుంటే మీరు హ్యాండ్ రైస్ చేయండి.","ఐ థింక్ కృష్ణ చైతన్య గారు ఈసారి ఈ లాస్ట్ ఫ్యూ డేస్ లో మాట్లాడలేదు అనుకుంటా కృష్ణ చైతన్య గారు వీడియో ఆన్ చేస్తారండి.","అండ్ డివైన్ మార్నింగ్ సార్ కొంచెం ఉండడం వల్ల అంటే ఆ ప్రశ్న అడగడానికి ఫోకస్ తబ్బ తింటదని వీడియో ఆన్ చేసుకోవట్లేదు బయట ఉన్నాను సార్ చెప్పండి మేడం థాంక్యూ సార్ ఫస్ట్ అఫ్ ఆల్ మీతో మాట్లాడడానికి అవకాశం వచ్చినందుకు థాంక్యూ థాంక్యూ వెరీ మచ్ సర్ నా క్వశ్చన్ ఏంటంటే సార్ ఇప్పుడు మనం సత్యాన్ని తెలుసుకుంటున్నాము అన్నదానికి ఓవర్ అనాలసిస్ లో ఉన్నాము అన్నదానికి డిఫరెన్షియేషన్ ఏమ ఉంటుంది సార్ ఎందుకంటే ఈ క్వశ్చన్ ఎందుకు అడిగాను అంటే చాలాసార్లు నా చిన్నతనం నుండి నాకున్న ఒక ఇమాజినేషన్ ఏంటంటే ఒక","ఆటం గురించి నాకు తెలియజేసినప్పుడు ఆటం అనేది నేను చూడలేదు అది కనపడట్లేదు కాబట్టి దాన్ని నేను స్కిప్ చేస్తూ వచ్చాను అలా చాలా విషయాలను స్కిప్ చేశాను మొన్న రీసెంట్ గా మా అమ్మాయి 13 ఇయర్స్ సార్ మా అమ్మాయికి మా అమ్మాయి ఒక క్వశ్చన్ నన్ను అడిగింది అన్నమాట నువ్వు ఇన్ని ఇన్ని క్లాసెస్ వింటున్నావు ఇంత ఆధ్యాత్మికత గురించి నేర్చుకుంటున్నావు అయితే నీకు కనపడలేదు అంటే అర్థం అది లేదని కాదు నువ్వు ఇంకా దాన్ని చూడలేదని అర్థం అని చెప్పింది.","అంటే చాలా అంటే దాన్ని ఎలా తీసుకోవాలి అన్నది కూడా నాకు ఇది కాలేదుఅన్నమాట.","అయితే నా ఉద్దేశం ఏంటంటే సర్ ఇప్పుడు మన ప్రకారం ఆధ్యాత్మిక ప్రకారంగా ప్రతిసారి మనం ఏం చెప్పుకుంటున్నాం మనలో ఇన్నర్ చైల్డ్ బ్లాక్స్ ఉన్నాయి వాటిని తొలగించుకోవాలి ఆ కొన్ని గాయాలు ఉన్నాయి ట్రోమాస్ ఉన్నాయి వీటన్నిటిని తీసేసుకోవాలి ఇలా చెప్పుకుంటూ చెప్పుకుంటూ ప్రతిదాన్ని ఒక్కొక్కసారి ఒక్కొక్క నిజం రివీల్ అవుతూ వస్తుంది కానీ అది ఏది సత్యం కాదు తర్వాత లాస్ట్ ఒక లైఫ్ పర్పస్ ఉంటుంది ఆ లైఫ్ పర్పస్ తర్వాత మళ్ళీ మీరు నిన్న ఒక ప్రాసెస్ చేయించారు నిన్న నిన్న మొన్న అంటే నేను మిస్ అయ్యాను","మళ్ళీ వీడియో ఆన్ చేసుకొని నిదానంగా ఎక్కడెక్కడ మీరు ఏ పాయింట్స్ చెప్పారో అవన్నిటిని రాసుకొని అలా చేసుకుంటాను అన్నమాట తర్వాత మీరు కొన్ని పాయింట్స్ చెప్పారు అంటే జమిలా మేడం లైక్ ఎవరికో మీరు క్వశ్చన్ అడిగినప్పుడు మీరు ఏం చేస్తే మీకు ఆత్మ సంతృప్తి అనేది కలుగుతుంది అన్నప్పుడు అంటే లైఫ్ పర్పస్ అన్నది మనం డిజైన్ చేసుకుంటామా ఇక్కడికి వచ్చేటప్పుడు అలాంటప్పుడు ఇప్పుడు మనం రివీల్ చేసుకుంటున్నవన్నీ ఈ బ్లాక్స్ అనేది ఒక నిజం ఆ ట్రోమ అనేది ఒక నిజం పేరెంట్స్ నుంచి తెచ్చుకున్నది అన్నది ఒక నిజం","ఫ్యామిలీ కాన్స్టలేషన్ అంటే అక్కడి నుంచి తెచ్చుకున్నవన్నీ ఒక నిజం ఏది సత్యం ఇందులో మన ఫైనల్ మన ఫైనల్ అన్నది ఏంటి సార్ అన్నది నాకు తెలియట్లేదు ఓకే అది లైఫ్ పర్పస్ కి ఈ ఫైనల్ గా సత్యాన్ని వెతుక్కోవడానికి ఏంటి డిఫరెన్షియేషన్ అన్నది కొంచెం కన్ఫ్యూజన్ వస్తుంది సార్ అందుకు ఇక్కడ మిమ్మల్ని అడిగాను సో మీ డాటర్ కి చాలా అద్భుతమైనటువంటి మాస్టర్ మనకు కనిపించట్లేదంటే అది లేదని కాదు మనం చూడలేకపోతున్నాము అలానే ఎన్నో విషయాలు కూడా మనకు కనిపించట్లేదు కాబట్టి లేవని కాదు సో మనలో లో అందరిలో అంతర్","బ్లాక్స్ ఈ ఇన్నర్ బ్లాక్స్ ఉంటాయని కాదు అందరిలో కూడా బ్లాక్స్ ఉండవచ్చు కొంతమందిలో లేకపోవచ్చు కూడా కానీ మన జీవితమే మనకు అర్థం పడుతూ ఉంటుంది.","మన జీవితంలో కొన్ని ఇబ్బందులు వస్తున్నాయి మనలో కొన్ని ఎమోషన్స్ కలుగుతున్నాయి రియాక్ట్ అవుతున్నాము ట్రిగ్గర్ అవుతున్నాము అంటే దాని వెనకాల కొన్ని అంతర శత్రువులు మనం అంతర శత్రువులనే బ్లాక్స్ అని అనుకుంటున్నాం ఇక్కడ అవి ఉన్నట్టు లెక్క ఎందుకంటే ఈ వరల్డ్ అంతా కూడా ఈ ప్రపంచం అంతా ఇప్పుడు మిర్రర్ చేస్తుంది మనకి రిఫ్లెక్ట్ చేస్తుంది మన గురించి మన దాన్ని బట్టి మనం అంచనా వేసుకుంటున్నాం.","తర్వాత మనం ధ్యాన స్థితిలో ఉన్నప్పుడు మనం చూడగలుగుతాం కూడా మనలో ఉన్నటువంటి ఏవి సరిదిద్దుకోవాలి మన నుంచి ఒక మాట వచ్చింది పొల్లిపోతుంది మాట మాటికి లేకపోతే ఒక ఎమోషన్ వ్యక్తపరచబడుతుంది లేకపోతే మనం ఎప్పుడు కుంగిపోతున్నాము బాధపడుతున్నాము ఎవరు ఏమన్నా కూడా పర్సనల్ గా తీసేసుకుంటున్నాము దాన్ని అంటే మనలో అహంకారం డెఫినెట్లీ ఉంది న్నట్టే అహంకారము సూక్ష్మ అహంకారం ఏంటంటే అన్ని పర్సనల్ గా తీసేసుకుంది ఎవర ఏమన్నా అనగానే వెంటనే మనం కొంచెం చెప్పబోతాం ఒక మాట ఒక నింద వేశారు దాన్ని పర్సనల్ గా తీసేసుకుంటాం."],"minutes":7,"words":1017},{"title":"అంతఃశత్రువులు · ముగింపు","paras":["వాళ్ళ ఎమోషనల్ స్టేట్ బట్టి వాళ్ళు ఆ మాట అన్నారు కానీ మనం వేరే విధంగా తీసుకుంటాం ఎందుకంటే మనలో ఇంకా అంతర శత్రువు ఆ అహంకారం అనేది ఇంకా ఉంది కాబట్టి సో ఇవన్నీ కూడా ఎక్కడో మనలో పడినటువంటి గాయాలు అందరిలో కూడా ఎన్నో దుర్భర పరిస్థితులు వాళ్ళ జీవితంలో వాళ్ళకి సంభవించి ఉంటాయి కానీ ఆ పరిస్థితిలో గాయాలు అందరిలో కలుగుతాయి అంటే కాదు అందరిలో కలగవు ఒక 30 మందికి వాళ్ళ తల్లిదండ్రులు అవైలబుల్ గా లేరు 30 మందిలో తల్లిదండ్రులు వాళ్ళ బిడ్డల్ని నానమ్మ దగ్గరో అమ్మమ్మ దగ్గరో వదిలేసేసి వారు ఎక్కడికో వెళ్ళారు అనుకుందాం ఫారెన్ కంట్రీకి వెళ్లి అక్కడ సంపాదన కోసం అక్కడ జీవిస్తూ వచ్చారు.","తల్లిదండ్రులకి దూరంగా అవ్వడం వలన ఈ బ్లాక్స్ వాళ్ళ 30 మందిలో పడతాయంటే కాదు. దానిలో ఒక ఐదు మందో 10 మందికో బ్లాక్స్ రావచ్చు ఎందుకంటే మనం దాన్ని ఏ విధంగా దాన్ని మనం ఇంటర్ప్రెట్ చేసుకుంటున్నాము ఏ విధంగా తీసుకుంటున్నామ అనే దాని మీద ఆధారపడి ఉంటుంది. అందుకే అందరిలో అంతర్గాయాలు అవుతాయి అనేది రూల్ ఏమీ లేదు. అందుకే మనము ఈ మార్గంలో ఉన్నప్పుడు మనం ఓపెన్ గా ఉండాలి. చాలా ఓపెన్ గా ఉండాలి. మనకే మనం అబ్జర్వేషన్ చేసుకుంటే సెల్ఫ్ అబ్జర్వేషన్ సెల్ఫ్ అవేర్నెస్ కల్టివేట్ చేసుకుంటున్నప్పుడు మనకే అర్థంఅవుతుంది.","నాలో ఇంకా అహంకారం ఉంది మమకారం ఉంది ఏదో ఎక్కడో నన్ను బాధిస్తుంది ఎక్కడో రియాక్ట్ అవుతున్నాను ఎక్కడో నాకు వెలితి ఉంది వాయిడ్ ఉంది. ఈ వెలితి ఎక్కడి నుంచి ఉంది అనే ప్రశ్న కూడా మనలో వస్తుంది. ఓ చిన్నప్పుడు నాకు ఏదైతే నేను పొందలేదో ఆ వెలితి అక్కడి నుంచి వస్తుంది. నేను దానికోసం వెతుకుతున్నాను బాహ్యంలో వెతుకుతున్నాను. నాలో ఈ వాయిడ్ అనేది ఏర్పడింది వెలితి ఏర్పడింది.","ఓ నాకు చిన్నప్పుడు స్వేచ్ఛ ఇవ్వలేదు ఎప్పుడు రెస్ట్రిక్షన్స్ పెట్టేవాళ్ళు అందుకే ఇప్పుడు అన్నీ కూడా నాకు స్వేచ్ఛ స్వేచ్ఛ అని బయట వెతుక్కుంటున్నాను స్వేచ్ఛ కోసం లేకపోతే అప్రూవల్ నాకు ఎవరు నన్ను నేను ఆమోదించబడలేదు ఇప్పుడు ఆమోదం కోసం చూస్తున్నా ఎవరు నన్ను ఆమోదిస్తారు ఎవరు నన్ను అప్రిషియేట్ చేస్తారు అని ఎదురు చూస్తున్నాను ఇన్నీ మనం అర్థం చేసుకుంటాం.","ఇవే పార్ట్ అఫ్ ది అంతర్శుద్ధి అన్నమాట సో ఈ మార్గంలో మనం ఎప్పుడు కూడా ఓపెన్ గా ఉండడము మనం మనం నిర్ధారణ అక్కర్లేదు నాలో బ్లాక్స్ ఉన్నాయి మనం ముందుగానే అనుకోక్కర్లే ఓపెన్ గా ఉండాలి మన జీవితాన్ని మనం అర్థం చేసుకోవాల మన జీవితంలో ఏం జరుగుతుంది మన పరిస్థితులు ఏంటి మనం ఎలా ఎమోషనల్ గా రియాక్ట్ అవుతున్నాము మన ఎమోషన్స్ మన ఫీలింగ్స్ అనేవి ఇండికేటర్స్ ఎలా ఫీల్ అవుతున్నాము అనేది మనం గుర్తించగలుగుతాం. కొంత సాధన ధ్యాన సాధన చేసుకుని మన ఆలోచనలు కూడా గుర్తించగలుగుతాం ఎందుకంటే సటల్ గా అవి పాస్ అవుతుంటాయి వేవ్స్ లాగా వెళ్తుంటాయి.","ఈ ఆలోచన తరంగాలు వాటిని కూడా మనం గుర్తించగలుగుతాం. కానీ మొదట్లో మనం ఫీలింగ్స్ మాత్రం బాగా గుర్తించగలరు అందరూ కూడా నాకు ఈ ఎమోషన్ కలిగింది. ఆ ఎమోషన్ కి వెనకాల ఒక థాట్ ఉంది థాట్ వెనకాల ఒక బిలీఫ్ సిస్టమే ఉంది బిలీఫ్ సిస్టం వెనకాల ఒక మెమరీ ఉంది ఒక జ్ఞాపకం ఉంది ఒక గతం ఉంది. ఏ గతన్న అయితే అవగతం చేసుకుని వ్యవతం చేసుకో
