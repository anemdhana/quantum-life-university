</style></head><body><div class="app lang-en"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-07-en.html">Prev</a><a href="day-09-en.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">Devi Shakti · Nature and the Power of Words · Devi Navaratri · Day 8 (English)</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">Devi Shakti · Nature and the Power of Words</span></div><div class="tools"><span class="lang-switch"><a href="day-08-te.html">TE</a><a href="day-08-en.html" class="active">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-07-en.html">Prev</a><a href="day-09-en.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"Opening Meditation · Anapanasati","paras":["Welcome to the 568th day of the Jnanodayam programme conducted by Quantum Life University. Today is also the eighth day of Devi Navaratri. Every day we are receiving this knowledge directly from our Guru, Dr. Newton. We are celebrating the Devi Navaratri days beautifully through sadhana.","While learning about sadhana, we are also understanding how much it is useful in life. Every day, under the direct guidance and supervision of the Guru, we are practising. Today also, before Dr. Newton arrives, let us begin with meditation practice. The meditation we do is Anapanasati meditation — a simple process. Sit comfortably in a stable posture.","You may sit on the floor or on a chair. Place the thumb and forefinger together, cross the legs if possible, remove glasses if you are wearing them, close the eyes, and simply observe the natural flow of the breath for the next 45 minutes. There is no need to engage with any thoughts, and no need to engage with the outer world. All our attention is only on the inner journey — on the breath.","We simply observe the breath as it is. Soft music is playing. Whenever a thought arises in between, with a gentle smile we bring the attention back to the breath. Om… Om… Om… In the final 10 minutes, let us use this meditative energy for the welfare of all.","Bring the attention to the top of the head — the Sahasrara region — and experience the light of knowledge there. This energy, this light of knowledge, slowly flows like a stream from the top of the head throughout the body. This same energy is present in all of us, in every living being, in every object, and all around us. It is nourishing all of us.","Feel this energy flowing from the crown of the head downward, purifying and illuminating every part. Let the awareness remain soft and steady. No effort is needed — only gentle observation and offering.","As the meditation deepens, the sense of a separate observer begins to soften. What remains is simply the flow of breath and the presence of awareness. This is the natural state we are returning to each day through practice.","In these final moments, offer the entire meditation — the stillness, the breath, and whatever has arisen — to the Mother. Let it benefit all beings.","Slowly bring the awareness back. When you are ready, gently open the eyes with a smile. Welcome once again."],"minutes":3,"words":413},{"title":"Devi Shakti · Respect for Nature","paras":["Welcome back everyone. Today we have reached the eighth day. The outer Dussehra holidays may be over, but the inner celebration continues. If everyone is ready to receive the knowledge, please turn on your cameras and, with a smile, let us welcome our Guru — Brahmarshi Chakravarti Dr. Newton Kondaveti.","Thank you, Sir, for being here today. Over to you. Dear friends of Jnanodayam, today we have arrived at Ashtami — the eighth day of Navaratri sadhana. Devi Navaratri was instituted only for sadhana. Through this practice, and through the power of Devi Shakti, we are to bring about whatever changes are needed within ourselves.","Today’s focus is the reverence we must have toward Prakriti — Nature. Devi is Prakriti. When we respect Nature, we are respecting the Mother. Every element — earth, water, fire, air, and space — is Her form.","When we pollute or misuse the elements, we are disrespecting Her. The sadhana of this day is to consciously honour the five elements and the Mother who is present as them.","Every morning when we wake up, the first act can be a simple recognition: the air we breathe is Her, the water we drink is Her, the earth that supports us is Her. This recognition itself is worship.","In the outer world we see so much disregard for Nature. But the change begins within. When the sadhaka begins to see Devi in every form of Prakriti, his relationship with the world transforms.","The five elements are not outside us. They are the very substance of the body and mind. Honouring them is honouring the body-temple in which the Mother dwells.","Today, as part of the practice, let us consciously offer gratitude to the five elements. Even a few moments of sincere recognition changes the quality of the day.","Devi Shakti is not separate from the world. She is the power that moves everything. When we align with Her through respect and surrender, that same power begins to work for our inner transformation.","The eighth day reminds us that knowledge without reverence remains incomplete. Reverence toward Prakriti is the foundation on which true knowledge stands.","Whatever we do today — eating, walking, speaking — can be done with the awareness that it is happening within the Mother’s field. This is practical sadhana.","Many people wait for special occasions to remember the Divine. But the Mother is available in every breath and every element. The eighth day invites us to remember this continuously.","When the mind is restless, return to the elements. Feel the solidity of the earth, the coolness of water, the warmth of fire, the movement of air, the spaciousness of space. Each one can bring the mind back.","This is not philosophy. It is a living practice. The more we honour Prakriti, the more the inner Prakriti — the mind and emotions — begins to settle.","Dr. Newton often says that the outer world is a reflection of the inner state. When we begin to treat Nature with reverence, the inner nature also starts responding with greater clarity and peace.","Let this eighth day be a day of conscious reverence. Even small acts done with awareness become offerings.","Now, with this understanding, let us continue the sadhana of the day."],"minutes":5,"words":544},{"title":"Anger · The Power of Words","paras":["There was a small boy whose father noticed that he had a lot of anger. Whenever he became angry, he would shout and create a lot of noise. To help the boy develop awareness of his anger, the father said: ‘Whenever you get angry, there is an empty wall in our house. Drive a nail into that wall.’","So every time anger arose, the boy would immediately go and hammer a nail into the wall. On the first day alone he drove 36 nails — meaning he became angry 36 times. He continued this process for several days. Gradually, awareness of anger increased.","Later the father said: ‘Now, whenever you control your anger, pull one nail out.’ Over time the wall became full of holes. The father then showed him: ‘See, even after the nails are removed, the holes remain. In the same way, angry words leave scars even after the anger is gone.’","This is the teaching: words spoken in anger create lasting impressions. Awareness is the first step. Once awareness is there, the power to choose differently appears.","In sadhana, anger is not suppressed. It is seen. When it is seen clearly, its power to control us reduces. The nail story is a simple method to develop that seeing.","Today, whenever anger or irritation arises, instead of reacting immediately, pause and notice it. That pause itself is the beginning of freedom."],"minutes":2,"words":233},{"title":"Time · Experiences · Liberation","paras":["Time is not linear in the way we usually think. Experiences keep repeating until the lesson is learned. Every trigger that appears in life is an opportunity.","The first time we hear about meditation or Self-knowledge, a desire arises within us — ‘I too must attain this Brahma-jnana.’ That desire itself is the beginning of the journey.","Liberation (moksha) is not somewhere else. It is the recognition that what we are seeking is already the nature of the Self. Until that recognition happens, experiences continue to appear as teachers.","Many people feel that spiritual life and worldly life are separate. But every experience in the world is material for the sadhana. Nothing is wasted.","When the same situation repeats, it is not punishment. It is the opportunity to respond differently. The response is what changes the pattern.","In the higher understanding, there is no separate time in which liberation happens. The moment the identification with the limited self drops, what remains is already free.","Until then, the practices — meditation, self-inquiry, Devi Samarpan — prepare the ground. They reduce the density of identification.","Experiences of joy and sorrow both have a purpose. They show us where we are still holding on. When the holding loosens, the experience no longer binds.","The seeker often asks, ‘When will I be free?’ The more accurate question is, ‘What is still being held as mine?’ The answer to that question is the next step.","Time appears long only when we are waiting for something outside. When the attention turns inward, the sense of waiting reduces.","Every day of Navaratri is such a turning. The outer festival ends, but the inner turning can continue.","Liberation is not the destruction of the world. It is the end of the mistaken belief that the world is separate from the Self.","Until that end happens, we continue the practices with patience. Patience itself is a form of surrender.","The stories and teachings we hear are not for entertainment. They are mirrors. Whatever touches us is pointing to something within.","Today, notice one repeating pattern in your life. Instead of resisting it, offer it in the evening Samarpan. See what happens.","This is practical spirituality. It does not require special conditions. It requires only honesty and willingness.","As the days of Navaratri progress, the cumulative effect of the practices becomes more visible. Small shifts compound.","Let us continue with that understanding."],"minutes":5,"words":402},{"title":"Mahasaraswati · Self-Knowledge","paras":["On this eighth day we also remember Mahasaraswati. She is the form of knowledge. True Self-knowledge is not information; it is the direct seeing of one’s own nature.","Saraswati’s veena represents the harmony that appears when the mind becomes still and the light of knowledge shines without obstruction.","Knowledge that remains only in the intellect does not transform. Knowledge that is lived becomes wisdom. Saraswati blesses both, but the second is the real fruit.","In the Navaratri sadhana, each day corresponds to a deepening. The eighth day invites us to let knowledge settle into being.","Many seekers collect teachings. Few allow the teachings to dissolve the collector. That dissolution is the work of Saraswati’s grace.","When the mind is full of concepts, even true concepts become obstacles. The practice is to use the concept and then release it.","Mahasaraswati is also the power of speech that is aligned with truth. When speech becomes truthful and non-harming, it becomes an instrument of knowledge.","Today, observe your speech. Is it creating clarity or confusion? Even this observation is part of the sadhana.","Offer the faculty of speech and the desire for knowledge to the Mother. Let them be purified."],"minutes":3,"words":197},{"title":"King Suratha · The Story of Samadhi","paras":["The story of King Suratha from the Devi Mahatmyam is relevant here. After losing his kingdom, he went to the forest and met the merchant Samadhi. Both were suffering from attachment.","Through the guidance of the sage Medhas, they performed intense sadhana and ultimately had the vision of the Mother. The story shows that even those who are deeply entangled in worldly life can attain the vision of Devi when they turn toward Her with sincerity.","King Suratha represents the mind that has lost its outer supports and is forced to look within. Samadhi represents the one who has already begun to turn inward.","Their meeting is the meeting of two seekers at different stages. Both are accepted by the Mother.","The sage Medhas does not give them complicated practices. He points them to the worship of the Mother and to self-inquiry. Simplicity is the mark of true guidance.","When the vision of Devi arises, the earlier losses no longer appear as losses. They appear as the necessary conditions for the vision.","This is the secret of the story: what the world calls failure can be the doorway. The Mother uses every situation.","In our own lives, the moments when outer supports fall away are often the moments when the inner support becomes visible — if we turn toward Her.","The story also shows that sadhana done with others has its own power. Suratha and Samadhi supported each other’s practice.","Today, if any outer situation feels like a loss, offer it to the Mother with the same sincerity. See whether it begins to reveal a deeper purpose.","The Devi Mahatmyam is not ancient history. It is a map of the inner journey that repeats in every sincere seeker.","Let us take the essence of the story into today’s practice."],"minutes":4,"words":299},{"title":"The Seven Planes of Knowledge (Sapta Jnana Bhumikas)","paras":["This is one of the most important sections of today’s talk. The seven planes of knowledge (Sapta Jnana Bhumikas) give a clear map for the sadhaka.","The first plane is Shubheccha — the arising of a pure desire for liberation. Without this desire, the journey does not begin. It is a gift.","The second plane is Vicharana — inquiry. The mind begins to ask, ‘Who am I? What is the nature of this world?’ This inquiry is sustained by the earlier desire.","The third plane is Tanumanasa — the attenuation of the mind. Gross identifications weaken. The mind becomes thinner, less reactive.","The fourth plane is Sattvapatti — the predominance of sattva. The light of the Self begins to shine through. Peace and clarity increase.","The fifth plane is Asamsakti — natural non-attachment. Things are seen, but they no longer bind in the same way.","The sixth plane is Padartha-bhavana — the recognition that the world has no independent reality apart from the Self. The sense of separation thins further.","The seventh plane is Turiya — the state beyond waking, dream, and deep sleep. Here the notions of karma, rebirth, and doership do not arise.","Until one reaches the higher planes, karma and the sense of individuality continue to operate. The map helps the sadhaka understand where he or she stands.","These planes are not rigid stages that one climbs like a ladder in a fixed time. They are descriptions of shifts in understanding and identification.","A person may touch a higher plane momentarily and then return. The practice is to stabilise the higher seeing.","The first three planes are more accessible through effort and grace. The later planes are more the result of grace, though effort prepares the ground.","Many seekers remain in the early planes for a long time. There is no fault in this. Each plane has its own beauty and lessons.","The danger is to claim a higher plane prematurely. Honesty about one’s actual state is itself a sign of progress.","In the Turiya state, the questions of karma and rebirth do not arise because the one who would be bound by them is not found. This is not a theory; it is the report of those who have stabilised there.","For those of us who have not reached that plane, the practices remain essential. They are the means by which the density of identification is reduced.","The Sapta Jnana Bhumikas also help in understanding the experiences that arise in meditation. Some experiences belong to the early planes; some indicate a shift.","When sattva increases, the mind naturally becomes more meditative. Forcing meditation when rajas or tamas dominate is less effective than first cultivating sattva.","Asamsakti does not mean running away from responsibilities. It means performing them without the earlier heavy sense of ‘I am the doer and the enjoyer.’","In the sixth plane, the world continues to appear, but it is known as non-separate. This is different from denying the world.","The seventh plane is not a blank state. It is the natural state in which the three ordinary states are seen as appearances within awareness.","Dr. Newton presents these planes so that sadhakas have a clear reference. Without a map, one can mistake temporary experiences for final realisation.","The map also prevents discouragement. If one knows that the early planes involve struggle, the struggle is not taken as failure.","Grace operates at every plane. The desire for liberation itself is grace. The appearance of a teacher is grace. The capacity to practise is grace.","Today, reflect quietly: which plane feels closest to your current understanding? There is no need to announce it. Just see honestly.","The purpose of the map is not to create a new identity (‘I am on the fourth plane’). The purpose is to support the journey.","As we continue the Navaratri sadhana, these planes can be remembered. Each day’s practice contributes to the movement through them.","In the evening, when you do Devi Samarpan, you can offer even the desire to progress through the planes. The Mother knows the right pace.","The seven planes ultimately point beyond themselves. The highest teaching is that the Self is already free, and the planes describe the falling away of what was never real.","Until that falling away is complete, the planes remain a compassionate guide.","Let us keep this map in the background as we practise.","Many questions about rebirth, karma, and liberation are answered differently depending on the plane from which one speaks. This resolves many apparent contradictions in the scriptures.","From the early planes, karma is real and must be worked through. From the seventh plane, karma is not found. Both statements are true in their context.","The sadhaka’s task is to move from the context in which bondage is real to the context in which it is not. The practices are the bridge.","Patience is required because the movement is not always linear. There can be periods of apparent stagnation that are actually integration.","When integration happens, the next shift occurs more naturally. Forcing creates tension that slows the process.","The seventh plane is sometimes called the natural state because nothing new is added. Only the superimposed limitations are no longer believed.","In practical terms, this means that the problems which seemed central begin to lose their centrality. They may still appear, but they no longer define the person.","This is the fruit that the Navaratri sadhana is oriented toward — not a change in outer circumstances alone, but a change in the sense of who is experiencing them.","The Sapta Jnana Bhumikas give language to that change so that it can be recognised and stabilised.","Today’s teaching is an invitation to use this language gently, without turning it into another concept to hold.","Offer the entire map, and the desire to understand it, to the Mother. Let Her guide the actual movement.","This completes the main exposition of the seven planes.","We will now move to the practice of Devi Samarpan, which is the living application of everything that has been said.","Remember: the planes are descriptions. The practice is the reality.","With this clarity, let us enter the practice."],"minutes":14,"words":1031},{"title":"Devi Samarpan · The Practice","paras":["Even if one asks Lord Rama or a great sage about rebirth and karma, the answer from the highest state is: ‘There is no rebirth, there is no karma — you only think there is.’ That is the vision from Turiya. But since most of us have not yet reached that plane, the practices remain necessary.","Therefore, the Sapta Jnana Bhumikas are a valuable structured reference for every sadhaka.","Now let us do Devi Samarpan once again. Sit comfortably. Devi Samarpan means offering oneself to the Mother — to the Kundalini Shakti who is already present within.","With the feeling of surrender (traditionally associated with the left nostril in this lineage), we offer the body, the breath, the thoughts, and the sense of ‘I’ to Her. Whatever arises — restlessness, emotion, or silence — is offered without holding anything back.","There is no need to reach a special state first. The offering itself is the practice. Even the inability to offer fully can be offered.","Remain in this offering for a few minutes. Let the breath be natural. Let the attention rest in the heart or at the crown, as feels natural.","When the mind wanders, gently bring it back by renewing the sense of offering. No force is required.","At the end of the practice, remain quiet for a moment. Then slowly open the eyes. The effect of the offering continues."],"minutes":2,"words":232},{"title":"The Devi Chant · Shared Experiences","paras":["Harika madam then led a beautiful chant: Yā Devī sarva-bhūteṣu Viṣṇumāyeti śabditā. Namastasyai namastasyai namastasyai namo namaḥ.","Every line of this chant carries deep meaning. It is not merely an external namaskara to the Mother. It is the recognition that all states of life — longing, energy, peace, anxiety, hope, indifference, light, wealth, memory, compassion, contentment, the form of the Mother, delusion, activity, Prakriti itself — are Her forms.","When we listen to or chant this, we are acknowledging that everything we experience is the Mother appearing in different ways.","After the chant, participants shared their experiences from the previous days of sadhana — the effect of the practices, the shifts in the mind, and the growing sense of surrender.","One participant spoke of how the daily Samarpan had reduced the intensity of old reactions. Another mentioned a greater sense of quiet even in the midst of work.","These sharings are not for comparison. They are reminders that the practices work in ordinary lives, not only in ideal conditions.","Each person’s experience is unique, yet the underlying movement is the same: a gradual loosening of identification and a growing trust in the Mother’s presence.","Dr. Newton listened and occasionally clarified points, emphasising that consistency matters more than dramatic experiences.","The chant and the sharings together create a field in which the individual practice is supported by the collective.","Even those who only listened reported feeling a quieting of the mind. This is the power of sincere collective sadhana.","The eighth day thus combined clear teaching, direct practice, and the living testimony of fellow sadhakas.","Such a combination is rare and precious. It is the hallmark of this Navaratri series.","As the session moved toward its close, the atmosphere remained one of quiet gratitude.","Many expressed the intention to continue the practices beyond the nine days.","This intention itself is Shubheccha — the first plane — renewing itself.","The chant continued to resonate in the background as people prepared to leave the session.","In the traditional understanding, the sound of the Devi’s names continues to work even after the audible chant has ended.","Participants were encouraged to carry one line of the chant into the day and repeat it softly whenever remembered.","This simple continuation links the formal session with ordinary life.","The sharings also revealed that many had begun to see daily difficulties as part of the sadhana rather than as obstacles to it.","This shift in perspective is one of the practical fruits of the teaching.","With these reflections, the main body of the session came to a close.","The final announcements followed."],"minutes":7,"words":434},{"title":"Closing · Upcoming Programmes","paras":["Thank you, friends. Tomorrow we will meet again early in the morning at 5 a.m. If everyone shares briefly, more people will get the chance to speak, and we can all hear one another’s experiences.","We will also meet in person at the end of this month (24–25) at the Quantum Life University campus for the One Maitriya programme. There is also a special two-day residential programme exclusively for doctors on ‘Inner Child – Pregnancy to Birth and Holistic Well-being,’ conducted by Dr. Newton and Dr. Lakshmi. Limited seats are available. Those who know doctors may share the information. Contact: 9849492098.","There are many more programmes coming, including the Soulco Transformation programme, which will conclude with the celebration of Dr. Newton’s birthday on Kartika Purnima. Everyone is welcome to join with family and friends.","Until tomorrow morning, let us spend more time in sadhana. The effect of today’s teaching and practice will continue to unfold.","Thank you once again for your presence and sincerity. May the Mother’s grace remain with all of us.","Om. We will meet tomorrow at 5 a.m."],"minutes":2,"words":181}];

function makeNav(root){chapters.forEach((c,i)=>{let li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+c.title+'<small>~'+c.minutes+' min read</small></span>';b.onclick=()=>{chapter=i;spreadIndex=0;render();document.getElementById('mobile-side').classList.remove('open')};li.append(b);root.append(li)})}makeNav(nav);makeNav(mobileNav);
function render(){let c=chapters[chapter];document.getElementById('heading').textContent=c.title;document.getElementById('time').textContent='~'+c.minutes+' min';columns.innerHTML='';let title=document.createElement('h2');title.className='section-title';title.textContent=c.title;columns.append(title);for(let p of c.paras){let el=document.createElement('p');el.textContent=p;columns.append(el)}document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i%chapters.length===chapter));requestAnimationFrame(()=>requestAnimationFrame(measure))}
function measure(){const width=columns.clientWidth;const one=window.matchMedia('(max-width:800px)').matches;const total=Math.max(width,columns.scrollWidth);spreadCount=Math.max(1,Math.ceil((total-2)/width));spreadIndex=Math.min(spreadIndex,spreadCount-1);columns.scrollLeft=spreadIndex*width;document.getElementById('position').textContent='Section '+(chapter+1)+' / '+chapters.length+' · '+(one?'Page ':'Spread ')+(spreadIndex+1)+' / '+spreadCount;document.getElementById('prev').disabled=chapter===0&&spreadIndex===0;document.getElementById('next').disabled=chapter===chapters.length-1&&spreadIndex===spreadCount-1}
function move(dir){if(dir===1){if(spreadIndex<spreadCount-1)spreadIndex++;else if(chapter<chapters.length-1){chapter++;spreadIndex=0;render();return}}else{if(spreadIndex>0)spreadIndex--;else if(chapter>0){chapter--;spreadIndex=9999;render();return}}measure()}
document.getElementById('next').onclick=()=>move(1);document.getElementById('prev').onclick=()=>move(-1);document.getElementById('font').onclick=()=>{document.body.classList.toggle('font-large');spreadIndex=0;requestAnimationFrame(measure)};document.getElementById('menu').onclick=()=>document.getElementById('mobile-side').classList.toggle('open');window.addEventListener('resize',()=>{spreadIndex=0;requestAnimationFrame(measure)});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});render();</script></body></html>
