</style></head><body><div class="app lang-te"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-07-te.html">Prev</a><a href="day-09-te.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">దేవీ శక్తి · ప్రకృతి · మాటల ప్రభావం · దేవీ నవరాత్రులు · Day 8</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">దేవీ శక్తి · ప్రకృతి · మాటల ప్రభావం</span></div><div class="tools"><span class="lang-switch"><a href="day-08-te.html" class="active">TE</a><a href="day-08-en.html">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-07-te.html">Prev</a><a href="day-09-te.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"ధ్యాన ప్రారంభం · ఆనాపానసతి","paras":["ఆ క్వాంటం లైఫ్ యూనివర్సిటీ నిర్వహిస్తున్న జ్ఞానోదయం కార్యక్రమంలో 568వ రోజుకి స్వాగతం. ఈరోజు దేవీ నవరాత్రుల్లో కూడా ఎనిమిదవ రోజు అండ్ మనం ప్రతిరోజు కూడా డాక్టర్ న్యూటన్ గారి నుంచి డైరెక్ట్ గా మన గురువు నుంచి ఈ జ్ఞానాన్ని తీసుకుంటూ ఉన్నాం. దేవీ నవరాత్రుల సంబరాలు చాలా చక్కగా సాధనతో చేసుకుంటూ ఉన్నాం.","సాధన గురించి తెలుసుకుంటూ మనకి ఎంత జీవితంలో ఉపయోగపడుతుంది అనే విషయాన్ని అర్థం చేసుకుంటూ ప్రతిరోజు డైరెక్ట్ గురు పర్యవేక్షణలో ఆయన గైడెన్స్ తో మనం సాధన చేస్తూ ఉన్నాం. ఈరోజు కూడా మరి డాక్టర్ న్యూటన్ గారు వచ్చే ముందర ధ్యాన సాధనతో ఆరంభిద్దాము. ధ్యానం మనం చేసేది ఆనాపానసతి ధ్యానం అండ్ చక్కగా సింపుల్ ప్రాసెస్ హాయిగా సుఖాసనంలో కూర్చోవాలి.","కిందనైనా కూర్చోవచ్చు కుర్చీలోనైనా కూర్చోవచ్చు వేళ్ళలో వేలు పెట్టుకోవడం పాదాలు రెండు క్రాస్ చేసుకోవడం కళ్ళజోడు ఉంటే కళ్ళ కళ్ళజోడు తీసేయడం కళ్ళు మూసుకొని హాయిగా సహజంగా జరిగే స్వా శ్వాసక్రియని గమనించడమే వచ్చే 45 నిమిషాలు మరి ఇంకేమి ఆలోచనలతో పని లేదు బాహ్య ప్రపంచంతో మనకి పని లేదు. మన ధ్యాస అంతా మన అంతర ప్రయాణం వైపే మన శ్వాస వైపేంది.","శ్వాస ఉన్నది ఉన్నట్లుగా గమనిస్తూ ఉంటాము. చక్కని సంగీతం శ్రావ్యంగా వినిపిస్తూ మధ్య మధ్యలో ఆలోచన వస్తే తిరిగి ఒక చిరునవ్వుతో మన ధ్యాసని శ్వాస మీదకి తీసుకొస్తుంది. ఆ ఓం ఓం ఆ ఆ ఆ ఓం ఆ ఓం ఆ ఓం ఆ ఓం ఆ ఆ ఓం ఆ ఓం ఓం ఆ ఓం ఆ ఆఖరి 10 నిమిషాలు. ఈ 10 నిమిషాలు మన ఈ ధ్యాన శక్తిని అందరికీ ఉపయోగపడేలాగా కథ సృష్టి కోసం ఉపయోగిద్దాం.","ఈ ధ్యాసని ఈ తల పై భాగంపై తీసుకెళ్ళండి సహస్రార స్థితి జ్ఞానపు వెలుగు ఈ తల పై భాగంతో అనుభవం పొందండి. ఈ శక్తి ఈ జ్ఞానపు వెలుగు మీ తలపై భాగం నుండి నెమ్మదిగా ఒక ప్రవాహం లాగా మిరమంతా ప్రవహిస్తుంది. నీ శక్తే మన అందరిలోనూ ఉంది. ప్రతి జీవిలోనూ ఉంది. ప్రతి వస్తువులోను ఉంది. మన చుట్టూ కూడా ఉంది. మనందరినీ నలుపుతూ ఉంది.","ఈ శక్తి ద్వారా మనమంతా ఒక ఏకత్వ భావంలోకి వెళ్తూ ఉన్నాం. మన నామము రూపం ఐడెంటిటీ అన్ని ఒక్కటే విడిచిపెట్టి ఈ ఏకత్వ భావంలో మనమంతా ఈ సహజ సృష్టిలో భాగం అవుతున్నాం. ఈ సహస్రార పిరమిడ్ యొక్క సంకల్పంలో మనమంతా భాగమవుతున్నాం. ఈ స్థితి నుండి ఈ సహస్రారా పిరమిడ్ ని ఊర్ధ్వ లోకాల నుండి ఆహ్వానిద్దాం.","ఈ భౌతిక ముఖంలోకి మన పాండమ లైట్ యూనివర్స్ రాంగడం ఇదివరకు ఈ శక్తి రూపం ఇక్కడ ఉంది మనకి వెళ్ళాడు అక్కడే మనం ఇతంగా కూడా చేసుకుంటూ మనందరి సామూహిక శక్తి సత్సంకల్పం ఈ పిరమిడ్ యొక్క నిర్మాణాన్ని మరింత త్వరితంగా చేస్తుంది. పిరమిడ్ ఏ రేకుల ఆ క్రిస్టల్స్ తో అద్భుతమైన రాక్స్ చెప్తాను సీక్రెట్ జామెట్రిక్ స్ట్రక్చర్ అన్ని నిక్షిప్తమై అద్భుతమే. సహస్రారా పిరమిడ్ గుర్తవుతూ ఉన్నట్లుగా మనమంతా ఈ అద్భుతమైన దృశ్యాన్ని చూసి విరబెట్టు.","ఈశ్వ నాగు జలాలకి కూడా శవాల దేశ విదేశాలకు ఆత్మజ్ఞానులుగా అవుతూ ఉన్నారు. తమని తాము తెలుసుకుంటూ ఉన్నారు. ప్రతి జీవన రాసితో సాన్నిత్యంగా నిలుపుతూ ఒక అద్భుతమైన ప్రపంచాన్ని సృష్టి చేస్తూ దీనికి కారణమైన ఒకానొక కారణమైన అద్భుతమైన మన సహస్రారా పిరమిడ్ నమస్కరిస్తూ ఈ బహుమానాన్ని మనకి అందించిన డాక్టర్ న్యూటన్ డాక్టర్ లక్ష్మీ గారుకి నమస్కరిస్తూ కృతజ్ఞతలు తెలియజేస్తూ ఈ సంకల్పాన్ని విశ్వానికి విడుదల చెందాం.","తిరిగి మీ ధ్యాసని శ్వాస మీదకి తీసుకురండి. ఈ అద్భుతమైన అనుభవం నీ లోపలే ఉంచుకో ఈ శక్తిని అనుభవం పొందుతూ మరి కొద్ది నిమిషాలు శ్వాసతో ఉందా ఓం ఆ ఆ ఆ ఓం ఆ ఓం ఆ ఓం ఓం ఆ ఓం ఆఓ ఆ ఓం మన స్థితిలోనే ఉండా ఆ నిమిషం ఐదు ఒకటి రెండు ఒకటి సున్నా నెమ్మది నెమ్మదిగా మీ చేతులు రెండు కొద్ది క్షణాల పాటు కళ్ళ మీద ఉంచుకొని ఒక చిరునవ్వుతో నెమ్మదిగా చేతులు తీసేస్తూ కళ్ళు రెండు తెరుద్దాం."],"minutes":3,"words":457},{"title":"దేవీ శక్తి · ప్రకృతి పట్ల గౌరవం","paras":["వెల్కమ్ బ్యాక్ ఎవ్రీవన్ మరొక్కసారి అందరికీ స్వాగతం. ఈరోజు ఎనిమిదవ రోజుకి వచ్చేసాం అప్పుడే దసరా హాలిడేస్ అయిపోవచ్చాయి. అండ్ ఈరోజు కూడా మనం చక్కగా జ్ఞానాన్ని స్వీకరించడానికి సిద్ధంగా ఉన్నట్లయితే అందరూ కెమెరాస్ ఆన్ చేసుకొని ఒక చిరునవ్వుతో మన గురువు గారిని వెల్కమ్ చేసుకుందాం. బ్రహ్మశ్రీ చక్రవర్తి డాక్టర్ న్యూటన్ కొండవేటి గారిని స్వాగతిద్దాం.","థాంక్యూ సో మచ్ సర్ హవింగ్ హియర్ టుడే ఓవర్ టు యు జ్ఞానోదయం వండర్ఫుల్ ఫ్రెండ్స్ ఈరోజు అష్టమి దినంక వచ్చాము. ఎనిమిదవ రోజు నవరాత్రుల సాధనలో ఎనిమిదవ రోజు దేవీ నవరాత్రులు ఓన్లీ సాధన కోసమే పెట్టబడింది. సాధన చేసి మనము ఆ శక్తి ద్వారా ఆ దేవీ శక్తి ద్వారా మనం ఏ మార్పులు మనలో తీసుకురావాలో అన్ని తీసుకురావడానికే ఈ దేవీ నవరాత్రుల సాధన.","సో ప్రతిరోజు కూడా కొన్ని కొన్ని విషయాలు మనం తెలుసుకుంటూ వస్తున్నాం. ప్రారంభం నుంచి మనం ఏదైతే పురాణ కథల్లో రాక్షసులు అసురులు అని భావిస్తున్నాము దేవతలు అని భావిస్తున్నాము వారిందరినీ మనం అంతరాల్లో దర్శించాలి. ఏదైతే ఒక ఎప్పుడు కూడా దేవతలు రాక్షసుల మధ్య యుద్ధం జరిగిందని రాస్తుంటారో మన తమో రజో గుణాలు సత్వగుణాల మధ్యన జరుగుతున్న యుద్ధమే అని భావన చేయాలి.","ఎందుకంటే ఇవన్నీ సంకేత రూపంలో ఋషులు మనకి తెలియజేసినటువంటి జ్ఞానం అంతరార్థం పరంగా తీసుకోవాలి. బాహ్యంలో ఏదైతే ఉందో అంతరంలో అదే జరుగుతుంది. యస్ విత ఇన్ సో వితౌట్ ఈ విషయాలు రోజు ఇదే విషయం గురించి మనం తెలుసుకుంటూ వస్తున్నాం.","మనం ఎక్కువమంది శత్రువుల్ని బాహ్యంగా మనం అట్రాక్ట్ చేస్తున్నాం అనుకుంటే మన అంతరంలో శత్రువులు ఉన్నారని మనం తెలుసుకోవాలి ఎందుకంటే అదే ఇండికేట్ చేస్తుంది మన బాహ్యంలో పరిస్థితులు. మన అంతరంలో ఏం మార్పులు మనం తీసుకురావాలి అనే దాని గురించి చెప్తూ ఉంటుంది. ఇప్పుడు ఒక విషయం ఇప్పుడు భూమండలం మీద ఎక్కువగా కాలుష్యం ప్రకృతిని ధ్వంసం చేస్తుంటారు.","అడవుల్ని నరికేయడము నదుల్ని కలుషితం చేసేయడము సముద్రాలని కూడా కలిషితం చేసేయడము ఇవన్నీ చేస్తున్నాం ప్రకృతిని నాశనం చేస్తున్నాం విధ్వంసం చేస్తున్నాం. సో దాని పర్యావసానాలన్నీ కూడా కలెక్టివ్ గా అందరూ భరించాల్సిందే. ఈ దేవీ నవరాత్రులు అంటే కూడా ఈ పరమాత్మ తత్వము అంతా కూడా ఈ ప్రకృతిలో ఉంది.","ఈ ప్రకృతిలో ఉన్నేదంతా కూడా పరమాత్మే మనం ధ్వంసం చేస్తున్నప్పుడు మనకి ఎరుక లేదు ఏం చేస్తున్నామో మనకు తెలియదు. జ్ఞానం లేదు బుద్ధి లేదనే చెప్పుకోవాలి. ఇప్పుడు మనం ప్లాస్టిక్ బాటిల్లు ప్లాస్టిక్స్ ఇవన్నీ కూడా మనం సముద్రాల్లో కూడా నదుల్లో కూడా వేసేసుకుంటాం. మనకి తెలిీదు వాటి ఏమవుతుంది ఆ ప్లాస్టిక్ ఏమవుతుంది చాలామంది చాలా చేపలు అవి ఊపి రాడకుండా చచ్చిపోతుంటాయి అవి నోట్లో ఇరుక్కోవడమో ఏదో ఒకటి జరిగి చాలా జంతువులు చనిపోతుంటాయి.","సో మనిషిగా మనము ప్రకృతికి ఏ హాని చేయకుండా మనం ఉండాలి. ఈ ప్రకృతి అంటేనే ఆ మాత ఆ దేవతా శక్తే కదా మనం ఎవరినైతే రోజు మహిషాశుర మర్ధిని గురించి మాట్లాడుకుంటున్నామో ఏ చాముండేశ్వరి గురించి మాట్లాడుకుంటున్నాము చండీ మాత దుర్గామాత ఎన్నో పేర్లతో పెంచుకుంటున్నటువంటి ఆ మాత ఎవరో కాదు. ఈ ప్రకృతి అంతా ఉంది ఆవిడే ధ్వంసం చేస్తున్నాం ఒక పక్కన మనం వెళ్లి మళ్ళా పూజలు చేసుకుంటాం అక్కడనే ప్లాస్టిక్ మళ్ళా అక్కడే వేసేసుకుంటాం.","సో మనం ఎవరైతే మొట్టమొదటిగా వారి తల్లిని గౌరవిస్తుంటారు వారు ఈ ప్రకృతిని కూడా గౌరవిస్తారు. తల్లి పట్ల గౌరవం లేని వారికి ఇది మనం ఎంత చెప్పినా అర్థం కాదు. మనకు జన్మనిచ్చిన తల్లి పట్ల మనకి ఫస్ట్ ఆ కనెక్షన్ ఉండాలి ఆ కనెక్షన్ లేకపోతే ఏమీ లేదు. ఈ ప్రకృతితో చాలామందికి కనెక్షన్ లేదు. ఇప్పుడు ఉండే జనరేషన్ ఫోన్లతో కనెక్షన్ ఉంటుంది.","ఆర్టిఫిషియల్ ఇంటెలిజెన్స్ రోబోటిక్ టూల్స్ ఆల్ ఇంజనీరింగ్ అంతా సోఫిస్టికేటెడ్ టెక్నాలజీస్ అన్నీ కూడా కనెక్షన్ వాటితో ఉంటుంది. ప్రకృతితో కనెక్షన్ లేదు. ప్రకృతి అంటేనే తెలివి లేకపోతే వాళ్ళంతా కూడా వాళ్ళ తల్లితో కూడా కనెక్షన్ పోగొట్టుకున్నారు. మన తల్లితో మనం కనెక్షన్ మనకి లేకపోతే కనెక్షన్ అంటే ఆవిడతో మనం ఉండక్కర్లేదు కూడా కనెక్షన్ అంటే ఒక డీప్ రెస్పెక్ట్ ఒక బాండ్ అది గుర్తించాలి.","మన జన్మనిచ్చిన తల్లి పట్ల మనకి ఆ గౌరవం ఉండాలి ప్రేమ ఉండాలి ఆ గ్రాటిట్యూడ్ ఉండాలి గ్రేట్ఫుల్నెస్ ఉండాలి కృతజ్ఞత భావం ఉండాలి. ఇది లేకపోతే మనం ఆ దేవతా మాత ఆ మాతో కూడా కనెక్ట్ కాలేము. ఆ దివ్యశక్తి గురించి మాట్లాడుకుందాం శక్తితో కనెక్షన్ ఫామ్ చేసుకోలేదు ఈ ప్రకృతిని ఇలానే మనం ధ్వంసం చేస్తుంటాం చేయకూడని ఎన్నో చేస్తుంటాం మనకి ఎందుకంటే మనకి ఆ కామన్ సెన్స్ ఆ బుద్ధి ఎరుక ఇవన్నీ లోపం ఉన్నాయి.","మన మదర్ తో మనకు కనెక్షన్ లేదు. భూమి అంటే ఏంటంటే మట్టి అంటారు చాలామంది భూమి అంటే మట్టి కాదు భూమి అంటే అది మాత మన తల్లి భూమి అంటేనే భూదేవి మన తల్లి. మన తల్లి ఒడిలో మనం ఉన్నాం కానీ కనెక్షన్ లేదు. చాలామందికి మట్టి అంటారు ఇక్కడ మట్టి కాదు తల్లి మన తల్లి. సో ఈ నవరాత్రుల్లో కూడా మనము ఈ ప్రకృతి సర్వం కల్విదం బ్రహ్మ పరమాత్మే ఆ శక్తియే ఏ సృష్టినంతా చేసిందో ఆ శక్తియే ఈ ప్రకృతిలో కూడా ఉంది.","సర్వం కల్విదం బ్రహ్మ మొత్తం ఆత్మమయమే ఈ జగత్తంతా ఆత్మమయమే. మనం ఏదైతే పదార్థం వస్తువు ఇవన్నీ చూస్తున్నామో దానిలో కూడా శక్తినే ఉంది. ప్రతి ఒక్కటి శక్తియే ప్రతి ఒక్కటి ఆటమే. మాలిక్యూల్స్ ఉన్నాయి ఆటమ్స్ ఉన్నాయి దానిలో సబాటామిక్ పార్టికల్స్ ఉన్నాయి ఎలక్ట్రాన్స్ ప్రోటాన్స్ న్యూట్రాన్స్ ఎన్నో 150 సబాటామిక్ పార్టికల్స్ ఓ పెద్ద అంతర్ ప్రపంచం ఉంది.","ఒక చిన్న ఆటమ లోపల పరమాణువు లోపల అణువు కంటే చిన్నది పరమాణువు పరమాణువులో కూడా ఎన్నో ఉన్నాయి ఒక పెద్ద విశ్వమే ఉందంట. ఈ రచన ఈ డిజైన్ ఈ సృష్టి అంతా కూడా చూడండి. ఇదొక పెద్ద లీల ఆ శక్తి ఆ దేవత శక్తి ఇవన్నీ సృష్టి చేస్తుంది. ఆవిడతో కనెక్ట్ కావాలంటే ఫస్ట్ మన బయలాజికల్ మదర్ తో మనకు కనెక్షన్ ఉండాలి. ఈ విషయాన్ని మనం చూడగలం.","మన చుట్టూరా చూస్తే మన ఇంట్లోని చెత్తంతా క్లీన్ చేసుకుంటాం శుభ్రం చేస్తాం. ఏదటంటి వాళ్ళ దానిలో గుమ్మం మీద వేసేస్తాం అంటే చెత్తం మన ఇంటి ఆ వీధిలో వేసేస్తాం వెళ్లేసి అది కూడా మనదే ఏ నేనైతే మనలో ఉన్నాడో ఆ నేనే అందరిలో ఉన్నాడు. ఏదైతే ఏకం గా ఉందో ఒకటిగా ఉందో అది అనేకంగా ఉంది అంతే అనేకంగా ఉన్నది ఒక మాయ అనేకమని భావిస్తున్నాం అలా కనిపిస్తుంది.","ఒక స్క్రీన్ మీద అనేకంగా కనిపిస్తుంది. అందరూ మనమే ఈ నేను అందరిలో ఉన్నారు. ఈ నేను మాట్లాడుతుంటే ఆ నేనులన్నీ వింటున్నారు అంతే ఆ నేను ఆ నేను మాట్లాడుతుంటే ఈ నేను వింటుంటాడు. ఒకటే నేను ఉండేది ఒక్కటే అదే సత్యం. అది ఈ మహాశక్తి మహాదుర్గా మహాకాళి మహాసరస్వతి మహాలక్ష్మి వారితో కనెక్షన్ ఏర్పడితేనే వారితో కనెక్షన్ ఏర్పడంటే మన బయలాజికల్ మదర్ తో కనెక్షన్ ఏర్పడాలి. మన తల్లితో మన కనెక్షన్ ఉండాలి.","అప్పుడే ఇవన్నీ మనకి తెలుస్తాయి. ఒకటే నేను ఇన్ని విధాలుగా ఇన్ని రూపాలుగా ఉంది అప్పుడు మనం మన చెత్తని వేరే వాళ్ళ దగ్గర వెయ్యమే వెయ్యయం వేరే వాళ్ళ మీద మనకు కోపం వచ్చింది మన మీద మనకు కోపం వచ్చినట్టే అక్కడ ఉండే నేను నువ్వే నువ్వే నేను నేనే నువ్వు అట్లాంటప్పుడు ఒకళ్ళ మీద మనం తిడుతున్నాము మనల్ని మనం తిట్టుకున్నట్టే."],"minutes":5,"words":837},{"title":"కోపం · మాటల ప్రభావం","paras":["ఒక చిన్న పిల్లవాడికి వాళ్ళ ఫాదర్ గుర్తించారు వాడు చాలా కోపం ఉందని కోపం వచ్చినప్పుడు చాలా తిట్టేస్తుంటాడు చాలా గోల చేసేస్తుంటాడు. ఎరుకని పెంచడానికి ఆ యాంగర్ గురించి ఎరుకని పెంచడానికి ఆ తండ్రి ఏం చెప్తాడంటే నీకు కోపం వచ్చినప్పుడల్లా ఇదిగో ఈ గోడ ఉంది కదా మన ఇంట్లో ఖాళీగా ఉంది ఆ గోడలో మేకుని కొట్టాలి అని చెప్పాడు.","ఎప్పుడు కోపం వచ్చినా కూడా వెంటనే వెళ్లి ఒక మేకుని కొట్టాలి. సరే నాన్నగారు చేస్తాను అని చెప్పేసి ఆ రోజు రోజంతా కోపం వచ్చిందని 36 మేట్లు కొట్టాడుట 36 సార్లు కోపం వచ్చింది. అలా కొన్ని రోజులు ఆ ప్రాసెస్ చేశారున్నమాట. తండ్రి చెప్పినటువంటి కోపం ఎరుక గురించి బాగా అవేర్నెస్ వచ్చేసింది.","తండ్రి ఇప్పుడు తీసుకని వెళ్లి ఆ మేకుల్ని ఒక్కొక్కటి తీయించాడు. ఆ గోడ అంతా ఎట్లా ఉందిరా బాబు అంటే బాగుందండి. ఇప్పుడు ఈ మేకులు లేకపోతే కానీ అక్కడక్కడ కొంచెం డామేజ్ అయింది. ఈ మేకులు కొట్టడం వలన రంద్రాలు పడ్డాయి అప్పుడు చెప్పారు నాన్నగారు చెప్పారు మనం ఎప్పుడు కోపగించుకున్నా ద్వేషించినా కోపంతో క్రోధంతో ఎన్నో దుర్భాషలాడుతూ ఉంటాం.","ఆ మాట మళ్ళా వెనక్కి తీసుకోలేం అది డామేజ్ చేసేస్తుంది. కోపంలో ఏదో వచ్చిన మాట నోట్లో నుంచి వచ్చేస్తుంది కదా అది వెళ్లి పొడుచుకుంటుంది రంద్రాలు అవుతాయికి వర్డ్ ఇస్ కాల్డ్ స్వర్డ్. వర్డ్ స్వర్డ్ సూలం లాగా పొడుచుకుంటుంది కత్తిలాగా వెళ్లి పొడుచుకుంటుంది. అది డామేజ్ అవుతుంది. ఇది గోడలాగా ఎరుక ఎరుక ఎరుక. సో మనతో మన కనెక్షన్ సత్యం ఏదైతే తెలుసుకుంటున్నామో ఈ శక్తియే ఈ సృష్టి అంతా చేసింది ఆ శక్తితో కనెక్షన్ కావాలి అంటే మన తల్లితో కనెక్షన్ కావాలి.","బైపాస్ చేయలేం చాలామంది చాలా స్ట్రగుల్ అవుతుంటారు. థియరటికల్ గా ఇంటలెక్చువల్ గా వాళ్ళకి ఆ శక్తితో ఇంటలెక్చువల్ గా తెలుసు అంటే జ్ఞానపరంగా సిద్ధాంతపరంగా సిద్ధాంతాలు తెలుసు థియరీ తెలుసు ఆ శక్తి ఇలా ఉంటుంది ఆ శక్తి స్వరూపిని నిరూపాలు ఆ శక్తి మూలశక్తి ఈ సృష్టి అంతా చేసింది ఇవన్నీ తెలుసు కానీ సిద్ధాంతపరంగా ఆ థియరీ మనక ఏమీ పెద్ద హెల్ప్ చేయదు.","అందుకే మన తల్లితో మనకి కనెక్షన్ ఉన్నప్పుడు ఆ తల్లితో పెద్ద తల్లి పెద్దమ్మ మన మూల కుటుంబ అమ్మలగమ్మ అమ్మ అమ్మతో కనెక్షన్ ఫామ్ అవుతుంది అప్పుడు అప్పటివరకు ఏదైతే థియరీ ఉంటుందో ఆ థియరీ నిజంగా మనం ప్రాక్టికల్ గా మనం ఆ కనెక్షన్ మనం ఫీల్ అవుతాం. ఆ తల్లి ఎప్పుడు మనల్ని విడవలేదు ఆ తల్లి వడిలోనే ఉన్నాం మనం. ఇప్పుడు అనేకంగా ఉన్నటువంటి ఇక్కడ తేడా ఏంటి?"],"minutes":2,"words":295},{"title":"కాలం · అనుభవాలు · మోక్షం","paras":["ఒకళ్ళకి ఇంకొకళ్ళకి తేడా ఏంటి? నాకు నీకు ఉన్న తేడా ఏంటి? ఇది ఇంకొక ప్రశ్న ఎన్నో ఆన్సర్స్ వస్తాయి. ఇదేదో రూపాల్లో ఉన్నాం తేడా మన బాడీ తేడాగా ఉంది. ఒకటేగా లేము ఒకొక్క శరీర నిర్మాణం డిఫరెంట్ గా ఉంది. ఒకోళ్ళ పేర్లు డిఫరెంట్ గా ఉన్నాయి నామరూపాలు డిఫరెంట్ గుణాలు డిఫరెంట్ మన జీవాత్మ ఆత్మ పరిణామ స్థాయి కూడా డిఫరెంట్ ఇవన్నీ ఎన్నో ఆన్సర్స్ కానీ ఒక్క ఆన్సర్ నేను చెప్తాను.","మన టైం డిఫరెంట్ మీ టైం వేరుగా ఉంది నా టైం వేరుగా ఉంది. ఒక కామన్ గా మనం చెప్పుకుంటుంటాం వాడుక భాషలో టైం బాలేదండి ఏంటండీ సమ్మయ్య గారు ఎలా ఉన్నారండి ఏంటండీ టైం బాలేదండి. టైం బాగుంటే అన్ని కలిసి వస్తాయండి. టైం గురించి మాట్లాడతాం.","మన టైం అంటే టైం అంటే ఏంటి కాలం అంటే ఏంటి ఒకే యూనిట్ డైరెక్షనల్ గా వెళ్తుంది. అది ఒక పామ్ ఎప్పుడు యూని డైరెక్షన్ గా వెళ్తుంది కదా అలాగే కాలం అనే సర్పం కూడా యూని డైరెక్షన్ ఒకే డైరెక్షన్ లో గతం నుంచి ఈ వర్తమానంలోకి వర్తమానం నుంచి భవిష్యత్తులోకి వెళ్తుంది. భవిష్యత్తు నుంచి ఈ వర్తమానంలోకి వర్తమానం నుంచి భూతకాలంలోకి వెళ్ళదు.","కాలం అట్లా వెళ్ళదు ఈ డైరెక్షన్ యూని డైరెక్షన్ నదులు ఎలా డైరెక్షన్ ఏ డైరెక్షన్ లో వెళ్తాయి నదులన్నీ కూడా ఏవైతే భారతదేశం చెప్పుకున్న జీవ నదులన్నీ కూడా ఏ డైరెక్షన్ లో వెళ్తాయి వాటి గమ్యం ఏంటి వాళ్ళ లక్ష్యం ఏంటి అన్నీ కూడా వాటికి ఎట్లా ఎట్లా తెలుసో ఎవరు చెప్తారో ఏమో గాని అన్ని వెళ్లి సముద్రంలో కలుస్తాయి.","ఆ మహాసాగరంలో కలుస్తాయి. యూనిడైరెక్షన్ అందుకే కాల ప్రవాహము అంటాం కాలాన్ని కూడా నదితో పోలుస్తారు. నదుల్లాగే కాలం కూడా ఎక్కడికి వెళ్ళాలో ఆ డైరెక్షన్లో తీసుకెళ్తుంది. మనల్ని మనం మనిషిగా మన జీవాత్మగా ఇక్కడికి వచ్చాము ఎన్నో అనుభవాలు పొందుతున్నాము.","మన జీవితంలో అనుభవాలు భౌతిక ప్రపంచంలో మన స్వప్న ప్రపంచంలో కూడా డ్రీమ్ వరల్డ్ లో కూడా మనం ఎన్నో అనుభవాలు వస్తాయి. రాత్రి నిద్రపోయినప్పుడు కలల్లో ఎన్నో అనుభవాలు మనం ధ్యానంలో కూర్చుంటే మళ్ళా ఎన్నో అనుభవాలు రకరకాల అనుభవాలు మన డైరెక్షన్ ఏంటి మన అందరి యొక్క డైరెక్షన్ ఏంటి ఏంటి ఎక్కడికి వెళ్తున్నాము.","ఎలా అయితే నదులు సావేరంలో కలుస్తున్నాయో అలానే మనం కూడా మోక్షం వైపు వెళ్తున్నాం అంతే ఎన్లైటన్మెంట్ వైపు వెళ్తున్నాం బ్రహ్మజ్ఞానం వైపు వెళ్తున్నాం. ఆల్ రోడ్స్ లీడ్స్ టు రోమ్ అని అంటారు. ఒక సామతం ఉంది. ప్రతి మార్గం కూడా ఒకటే డైరెక్షన్ లో తీసుకెళ్తుంది. అన్ని ఎక్కడ ఎక్కడికి నడిచి ఎటు అటు తిరిగి తిరిగి తిరిగి రౌండ్లు తిరిగి ఒకటే దగ్గరికి వెళ్తాం.","ఫైనల్ గా అదే బ్రహ్మజ్ఞానం మోక్షం వైపు వెళ్తాం. ఇంకొంచెం భౌతికంగా ఈ ఫిజికల్ ప్లేన్ లో చెప్పుకోవాలంటే మనమంతా చావు వైపు వెళ్తున్నాం అంతే మరణం వైపు వెళ్తున్నాం. ఆ డైరెక్షన్ లో వెళ్తున్నాం అంటే భౌతికంగా పుట్టాము పుట్టంగానే మన చావు కూడా సర్టెనిటీ డెఫినటివ్ నిర్ణయించబడిపోయింది డిజైన్ అయిపోయింది.","ఆ డైరెక్షన్ లోనే వెళ్తుంటాం మనమేమి ఒకటేగా ఉండం 40 సంవత్సరాలు 50 సంవత్సరాలు 60 సంవత్సరాలు దాటంగానే జరామరణ దుఃఖాలన్నీ వచ్చేస్తాయి. మన శరీరం ముడతలు పడుతుంది క్షీణంలోకి వెళ్తుంది క్షీణిస్తూ ఉంటుంది. అప్పటివరకు శక్తి శరీరం అంటాము ఆ తర్వాత దేహం అంటాం దేహం అంటే దహింపబడేదే దేహం అది క్రమమైన శ్రింక్ అవుతూ ఉంటది.","మన టిష్యూస్ మన శరీర కణాలు ప్రతి ఒక్కటి వాటి ఫంక్షన్ అన్నీ కూడా తగ్గుతూ ఉంటాయి. అది నేచర్ లో డిజైన్ే శివుడు ఎప్పుడు లయం చేసుకుంటాడు బ్రహ్మ సృష్టి చేస్తాడంట త్రిమూర్తి తత్వాలు అంటే బ్రహ్మ సృష్టి చేసుకుంటున్నాడు ఆయన కార్యక్రమం ఆయన చేసుకుంటున్నాడు విష్ణువు మెయింటైన్ చేస్తుంటాడు. అన్ని హోమియోస్టాసిస్ ని బాలెన్స్ గా అన్ని చూస్తూ ఉంటారు.","ఈ అన్నీ కూడా సమంగా జరిగే విధంగా ఒక రిథంలో జరిగే విధంగా చూసుకుంటున్నారు శివుడు లయం చేసుకుంటాడు. మనం ఏ డైరెక్షన్ లో వెళ్తున్నాం భౌతిక ప్రపంచంలో అంటే మనం చావు వైపు వెళ్తున్నాం. ఎప్పుడైనా కావచ్చు 10 రోజులు కావచ్చు 100 రోజులు కావచ్చు ఒక 30,000 రోజులు కావచ్చు 300 సంవత్సరాలు కావచ్చు. ఆ డైరెక్షన్ లో మనం వెళ్తాం.","అలానే మన జీవాత్మ ఏ సాధకుడు ఉన్నాడంటే ఏ డైరెక్షన్ లో వెళ్తున్నాం అంటే ఎవరైనా సరే మన ఆత్మ ఏ డైరెక్షన్ లో వెళ్తుంది అంటే పరమాత్మ వైపు పూర్ణాత్మ వైపు మహాసాగరం వైపు మోక్ష జ్ఞానం వైపు అదే డైరెక్షన్. అందుకే మనకి చేదు అనుభవాలనే మనం లేబుల్ చేస్తాం. అబ్బా ఎంత డిఫికల్ట్ ఎక్స్పీరియన్సెస్ నాకు చాలా కష్టాలు అబ్బా చాలా అవన్నీ కూడా ఆ డైరెక్షన్ే మోక్షం వైపే తీసుకువెళ్ళేదే.","ప్రతి ఒక్క అనుభవం కూడా మనిషికి చాలా ఇంపార్టెంట్ ఇక్కడ అన్ని అనుభవాలు మనం మనసు పరంగా వాటిని కంపేర్ చేసుకుంటాం ఎక్స్పీరియన్సెస్ ని గుడ్ బ్యాడ్ లేబులింగ్ చేస్తాం. సోల్ పరంగా అన్ని అనుభవా వాలన్నీ ఇంపార్టెంటే. సోల్ కి అక్కడ ఓన్లీ అనుభవం అంటుంటది. చెడు మంచి మంచి అనుభవం చెడు అనుభవం ఏమీ లేదు.","అనుభవాలు ఎన్ని అనుభవాలు ఉంటే అంత అనుభవజ్ఞుడు అయతాం అంత జ్ఞానం వస్తుంది. అన్ని రకాల అనుభవాల నుంచి మనం నేర్చుకుంటుంటాం. ఎందుకంటే ఆత్మకి మంచి చెడు అనే లేదు. అక్కడ దేర్ ఇస్ నో నథింగ్ కాల్డ్ గుడ్ అండ్ బాడ్ ఫర్ సోల్. గుడ్ ఎక్స్పీరియన్స్ బ్యాడ్ ఎక్స్పీరియన్స్ ఏమీ లేదు ఇక్కడ ఉంటుంది.","మనకి ఈ శరీరంలో ఇక్కడ మనం ఉన్నప్పుడు మాత్రం ఇది మంచిది ఇది నాకు హాని చేస్తుంది వీళ్ళ మాటలు నచ్చలేదు నా మాటలు వాళ్ళకి హాని చేస్తున్నాయి నాలో ఈ లోపాలు ఉన్నాయి ఇవన్నీ మనం గుర్తిస్తాం. ఇక్కడ మంచి చెళ్లు ఉంటాయి ఆత్మపరంగా అనుభవాలు మాత్రమే ఉంటాయి. అనుభవం ఈన అనుభవాలన్నీ కూడా జ్ఞానాన్ని ప్రసాదిస్తాయి.","ప్రతి అనుభవం కూడా అన్ని అనుభవాలు నేర్పిస్తాయి. మన భౌతికంగా ఏ పరిస్థితుల ద్వారా పొందిన అనుభవాలు గాని ఆధ్యాత్మిక పరంగా సాధన చేసుకున్నప్పుడు గాని స్వాధ్యాయం చేసినప్పుడు పుస్తకం చదివినప్పుడు వచ్చే మీకు అజ్ఞానపరంగా అనుభవాలు గాని సజ్జన సాంగత్యం మీరు చక్కగా అందరితో కలిసి జ్ఞాన మిత్రులతో వారితో చర్చలు చేసుకున్నప్పుడు. వారితో చర్చించినప్పుడు మీకు కలిగే జ్ఞానం కానీ ఇవన్నీ కూడా అనుభవాలే.","అన్ని అనుభవాలు ఒకటే డైరెక్షన్ మోక్షం వైపు తీసుకెళ్తున్నాయి. అంటే ఎన్లైటన్మెంట్ మోక్ష జ్ఞానము బ్రహ్మ జ్ఞానము ఆ డైరెక్షన్ లో తీసుకుంటుంది. అన్నిటికంటే మనిషికి అతి పెద్ద భయం ఏంటంటే మామూలుగా మనం ఏమనుకుంటాం చీకట అనుకుంటాం అవునా కాదా చీకటి అంటే భయం. మనిషికే చీకటిలో ఏమున్నాయో తెలీదు అంధకారంలో ఉండడం ఎవరికీ ఇష్టం లేదు.","అక్కడ దీపం వెలిగించాలి. చీకటి అంటే భయం అందుకే మరణం కూడా భయమే మనకి మరణం కూడా ఒక చీకటే ఏముందో తెలియదు. అక్కడ డార్క్నెస్ అందుకే చాలామంది శూన్యం అంటే కూడా భయమే. కానీ మనం అనుకున్న విధంగా మనం భయపడేది నిజంగా చీకటి గురించి కాదు మనలోని వెలుగు గురించి భయం అంటారు."],"minutes":5,"words":786},{"title":"మహాసరస్వతి · ఆత్మజ్ఞానం","paras":["మన అంతరంగంలో ఉన్న మహత్తును అతి గొప్ప వెలుగు మన ఆత్మ నుంచి దివ్యమైనటువంటి వెలుగుని మనం స్వీకరించలేం మనల్ని మనం యాక్సెప్ట్ చేసుకోలేం. సిద్ధాంతపరంగా మనం తెలుసుకుంటాం అహం బ్రహ్మాస్మి అని అది అనుభవం కలుగుతుంది మీకు అహం బ్రహ్మాస్మి అనే ఒక గొప్ప అనుభవం వస్తుంది కానీ అది యాక్సెప్ట్ చేయం. నేనెంత నేను గొప్పవాడిని ఎట్ల అయితే నేను లేదు మన ఆత్మ యొక్క గొప్పతనం మనం స్వీకరించడం చాలా కష్టం.","మనల్ని మనం అండర్ వాల్యూ చేసుకుంటాం అండర్ ఎస్టిమేట్ చేసుకుంటాం మనల్ని మనం తక్కువగా భావిస్తాం. మనంగా నిజంగా భయపడేది మనలో ఉన్న వెలుగుని గురించి మనలో ఉన్న దివ్య ప్రకాశం మనలో ఉన్న చీకటి గురించి కాదు. మన భయం నిజమైన భయం ఇదే. మన దీన్నే ఇన్నర్ మాగ్నిఫిసెన్స్ అని అంటాం. మనలో ఉన్న మాగ్నిఫిసెన్స్ మన ఆత్మ తత్వం అందరిలో ఉన్న ఆ పరమాత్మ ఒకటే పరమాత్మ ఉన్నాడు అందరిలో ఆ పరమాత్మ వెలుగుతూ ఉంటాడంట. వెయి సూర్యుల కాంతితో ఆ దివ్య ప్రకాశమే మనకి యక్సెప్ట్ చేయలేం తీసుకోలేం.","మనల్ని మనం జడ్ చేసుకుంటాం మనల్ని తక్కువగా అనుకుంటాం. ఇప్పుడు మహాసరస్వతి ఎనిమిదవ రోజుక వచ్చాం. నిన్నటి నుంచే ఆ సరస్వతీ మాత ఆ శక్తియే ఆదిశక్తియే ఈ రూపాలుగా ఇన్ని రూపాలుగా మనకి ఈ నవరాత్రుల్లో కనిపిస్తుంది. మొదటి మూడు రోజులు మహాదుర్గగా రెండో మూడో రోజులు రెండవ సెట్ ఆఫ్ డేస్ లో మహాలక్ష్మిగా మూడవ సెట్ లో మహాసరస్వతిగా.","ఈ మహా సరస్వతి మనకు చెప్పేది మనలో ఉన్న వెలుగుని మనం దర్శించాలి ఆత్మని దర్శించాలి. ఆత్మ అనుభవం చెందాలి. నా ఆత్మ నేను ఆత్మను అనే అనుభవం మనం చెందాలి పొందాలి. ఆ ఆత్మే దేవుడు అనే అనుభూతి అనుభవం పొందాలి ఆ జ్ఞానం పొందాలి. ఇదే మహాసరస్వతి.","మన ఇంట్లో ఎలాంటి వారి ఫొటోస్ మనం పెట్టుకుంటాం ఎవరి ఫొటోస్ పెడతాం సల్మాన్ ఖాన్ ఐశ్వర్య రాయ్ కాదు బుద్ధుడు ఫోటో పెట్టుకుంటాం లేకపోతే పత్రీసారి ఫోటో పెట్టుకుంటాం లేకపోతే గొప్ప గొప్ప మాస్టర్స్ ఫొటోస్ పెట్టు మహాత బాబాజీ ఫోటో పెడతాం యుక్తేశ్వర గిరి గారి ఫోటో పెడతాం లాహిర్ మహాశయ గారి ఫోటో పెడతాం పరమహంస యోగానంద గారి ఫోటో పెట్టుకుంటాం. ఎందుకు వారికి సరస్వతీ మాతో కనక్షణం ఉంది.","సరస్వతి మాత తాళ్ళకి వాళ్ళ ఆత్మజ్ఞానం బ్రహ్మజ్ఞానం పొందేట్లుగా చేసింది. సరస్వతీ కటాక్షం అంటాం సరస్వతి పుత్రులు వీరంతా వారిని వాళ్ళు అలాంటి జ్ఞానులు ఎప్పుడు గౌరవింపబడతారు. జ్ఞానం ఎక్కడ ఉంటుందో ఆ జ్ఞానం ఎప్పుడు గౌరవింపబడుతుంది. డబ్బులు ఉన్నా లేకపోయినా డబ్బులతో వచ్చే గౌరవం వేరు కానీ విద్యతో ఆత్మవిద్య బ్రహ్మ విద్యతో వచ్చే గౌరవం ఎప్పటికీ చెదరదు ఎప్పటికీ చిరస్థాయిగా అందరిలో ఉండిపోతుంది.","ప్రతి ధ్యాన సాధకుడు ఆత్మజ్ఞాన పిపాసకులు బ్రహ్మజ్ఞానం పొందాలనే తీవ్రమైనటువంటి ఆ సంకల్పం ఉన్నవారందరూ కూడా ఈ సరస్వతీ మాత వైపుకు వెళ్తున్నాం. మనం ఫైనల్ గా ఆ శక్తి సరస్వతీ మాత రూపంలో మనకి ఆ విద్య అంతా మనలో యక్టివేట్ అయ్యేట్టు చేస్తుంది ఆత్మ ఆత్మ ఆత్మ గురించి తెలియజేస్తుంది.","మనక ఆత్మజ్ఞానం బ్రహ్మ జ్ఞానం కలిగేట్లు చేస్తుంది. చాలామంది సరస్వతి కటాక్షం ఉంది వారికి అని అంటుంటారు. రోజు మనం హారిక మేడం నుంచి మంచి సంగీతం పాట వింటున్నాం. ఆమె పైన సరస్వతి మాత కటాక్షం ఉంది. అఫ్కోర్స్ ఆమె సాధన చేశారు సాధన చేయకుండా ఏది రాదు కానీ చాలామంది సాధన చేస్తారు కానీ పాడలేరు నేను పాడలేను నేను సాధన చేశాను నేను పాడలేను ఏం చేద్దాం మరి సరస్తి కటాక్షం లేదు.","ఆవిడ పైన సరస్తి మాత కటాక్షం ఉంది చక్కగా పలుకు ఆ మాట ఆ మెలోడీ సంగీతం రెండు నుంచి వస్తుంది అంటే కటాక్షం సరస్వతి మాత మహా సరస్వతి ఆవిడ ఈ మహా జ్ఞానాన్ని బ్రహ్మ జ్ఞానాన్ని మనకి ప్రెసెంట్ చేస్తుంది తీసుకొని వస్తుంది యాక్టివేట్ చేస్తుంది మనలో. సో నిన్న మనం కొన్ని సుంభుడు గురించి నిసుంభుడు గురించి మరి చెప్పుకున్నాం."],"minutes":3,"words":441},{"title":"సురథుడు · సమాధి కథ","paras":["వారి దగ్గర ఉన్నటువంటి చండుడు ముండుడు రక్తబీజుడు ధూమ్రలోచనుడు అనే ఈ అసురుల గురించి కూడా మనం నిన్న చెప్పుకున్నాం. దాంతో పాటు ఈ దేవి మహాత్యం ఏదైతే మార్కండేయ పురాణంలో ఉందో దానిలో కూడా ఒక స్టోరీ చెప్పబడింది. మంచి కథ ప్రారంభంలోనే ఉంటుంది. ఆ స్టోరీ సురధుడు అనే ఒక రాజు కథ సమాధి అనే ఒక వ్యాపారి అంటే ఒకటే కథలో వీళ్ళంతా ఉంటారు.","మేధా మేదస్సు అనే మహర్షిక వీళ్ళంతా ముగ్గురు ఉన్నటువంటి కథ. ఒక రాజు సురధుడు అనే ఆయన చక్కగా పరిపాలన చేస్తున్నాడు రాజులక ఎప్పుడు కూడా శత్రు రాజులు ఉంటారు వాళ్ళు వేరే రాజులు వచ్చేసి ఆకుపై చేసుకుంటారు యుద్ధం చేసి వాళ్ళు ఈ రాజుని తన దగ్గర ఉన్న మంత్రులే తన దగ్గర ఉండే వారే మోసం చేసి శుత్రు రాజులతో చేతులు కలిపి ఈ రాజుని ఓడించేశరు.","ఈ రాజు ఓడిపోయాడు సురధుడు ఇంకా అడవికి పారిపోయాడు. అడవిలో తలుచుకుంటున్నాడు ంట నా రాజ్యం అంతా పోయింది నా రాజ్యం పోయింది నా ప్రజలు నన్ను తలుచుకుంటున్నారా రాజుని కదా నేను నన్ను తలుచుకుంటున్నారో లేదో అని రోజు తలుచుకొని చింతిస్తున్నాడు. ఇవి సురద్రుడు గురించి ఒక వ్యాపారి ఉన్నారు. ఆ వ్యాపారి పేరు సమాధి అని బాగా డబ్బులు అన్నీ ధనార్జన చేశారు బిజినెస్ లో బాగా డబ్బులు వచ్చాయి కానీ భార్య పిల్లలే మోసం చేశారు.","భార్య పిల్లలే మోసం చేసి ఇంటి నుంచి గంటే గెంటేసారు. ఇంకా ఇంట్లో నుంచి బయటక వచ్చేసి అడవిలోకి వెళ్ళిపోయాడు. ఇంత మోసం చేశారు కదా వాళ్ళు భార్యా పిల్లలు అయినా వ్యామోహం మోహం ఉంది మమకారం ఉంది ఆ మమ్మకారంతో మరి ఇలా ఆలోచిస్తున్నాడు అంట నా భార్య పిల్లలు ఎలా ఉన్నారో ఏం చేస్తున్నారో నా స్కిన్ చక్కగా చూసుకుంటున్నారా లేదా ఆ మోహం ఇది వ్యాపారి గురించి సో అదే అడవిలో ఒక ఋషి ఉండేవారు ఆయన పేరు మేదస్సు అంట.","మేదస్సు అనే మహర్షి ఆశ్రమం కూడా ఉంది. సో ఈ రాజు ఈ వ్యాపారి వారిద్దరు కూడా సురధుడు సమాధి అనే వ్యాపారి ఈ మేదస్సు అనే మహర్షి దగ్గరి ఆశ్రమానికి వెళ్ళారు. ఏదైనా సమస్య వచ్చింది వీళ్ళకి రోజు ఇదే ఆలోచనతో శతమతం అవుతున్నారు. ఆశ్రమానికి వచ్చారు మేదస్సు ఇవన్నీ పేర్లు చూడండి చాలా గమ్మత్తుగా ఉంటాయి.","ఎందుకంటే అంతరార్థ సహితంగా ఇవన్నీ చెప్పబడ్డాయి. సురధుడు మంచి పరిపాలకుడు రధుడు రాజ్యాన్ని పరిపాలిస్తున్నవాడు సమాధి అంటే సమాధానాలు పొందిన స్థితి సమాధి అనే వ్యాపారి మేదస్సు మేదస్సు అంటే తెలివి ఇంటెలిజెన్స్ జ్ఞానము మహాజ్ఞానము ఇన్నీ కూడా సో ఈ ఆశ్రమంలో ఆ గురువుగారి దగ్గర సాధన చేయమన్నారు.","ఓకే మీకు ఎన్ని ఆలోచనలు వస్తున్నాయి మనసులో ఎన్ని చింత తలు ఉన్నాయా ఇన్ని కష్టాలు ఉన్నాయా మీకు సాధన చేయండి సాధన చేశారు మంచి శక్తి అనుభవాలు వచ్చినయి ఆ వారికి ఈ దేవీ మాత ప్రత్యక్షమైంది. ఏం కావాలో కోరుకోమంది మనం ఎప్పుడైతే మనం ధ్యాన సాధన చేస్తుంటామో ఊర్ముఖంగా ఎప్పుడైతే డైరెక్షన్ చేంజ్ చేసుకొని మన శక్తి ఊర్ముఖంగా ప్రవహించి ఈ ఆజ్ఞ చక్రం చేరుకుంటుందో అక్కడ అన్ని వరాలే వస్తాయి మనకి అక్కడ అన్నీ కూడా వరాలే.","మన ఏ ఉన్నాయో సంకల్పాలఅన్నీ కూడా అయిపోతాయి ఆజ్ఞే ఇక్కడ ఆజ్ఞ చక్రం ఇది అందుకే ఇక్కడ కూడా వారు సాధన చేశారు బాగా తీవ్రమైన సాధన చేశారు మరి చేస్తే సురధుడు మరి ఈ సమాధి అనే వ్యాపారి ఇద్దరు కూడా వారిని కోరుకోమంటే సురధుడు నేను ఒక రాజుని అన్ని కోల్పోయాను మరి ఏదైనా ఒక రాజ్యం గాన ఇట్లాంటివి ఉంటే బాగుంటుంది నాకు కావాలని ఉంది అని కోరుకున్నాడు.","సరే గ్రాంటెడ్ ఎవ్రీ విష్ ఇస్ గ్రాంటెడ్ మనం అడిగిన ఏదైనా సరే కామధేను ఏం చేస్తుంది కామధేను మనం ఏదైతే కోరుతామో అన్ని కల్పతెరువు కామధేనువు అక్షయ పాత్ర ఇవన్నీ గిఫ్ట్స్ మనకి చింతామణి ఇంకొ గిఫ్ట్. సో ఇప్పుడు ఈ సమాధి అనే వ్యాపారి ఏం కోరుకున్నాడు అంటే నాకు అన్నిటికంటే ఆ జ్ఞానం కదా కావాల్సింది ఏ జ్ఞానం ఉంటుందో ఆ జ్ఞానం ద్వారా ఈ దుఃఖమే ఉండదు కదా ఆ జ్ఞానం కావాలి నాకు ఆత్మజ్ఞానం కావాలి బ్రహ్మజ్ఞానం కావాలి ఆవిడ.","సో ఇట్ ఇస్ సో బి ఇట్ తథాస్సు తథాస్తు తథాస్సు అనింది ఆయనకి చక్కని సాధనలో సమాధి స్థితి పొందారు ఆయన నిర్విక కల్ప సమాధి పొందారు. సురదరుడు సురధుడు చక్కగా మహారాజు అయిపోయాడు. ఆ నెక్స్ట్ యుగంలో మళ్లా మనువయ్యాడు ఆయన ఇది స్టోరీ అంటే మనంఅంతా కూడా సాధన చేస్తుంటాం.","ఎవరి ఆత్మ పరిణామ స్థాయిలో మనం వారు ఉన్నారు. దాన్ని బట్టి మన పరిణామ స్థాయి బట్టి ఎంత ఎవాల్వ్ అయ్యాము అనే దాన్ని బట్టి మనం మాట్లాడే మాట ఉంటుంది మన కోరుకునే కోరికలు ఉంటాయి మన సంకల్పాలు ఉంటాయి మన నడవడిక ఉంటుంది మన ప్రవర్తన ఉంటుంది. మన మన ఎవల్యూషన్ బట్టే ఉంటుంది.","ఇది బ్రహ్మర్షి పితామహ పత్రీజి గారు వాక్ేత్రం గురించి చాలా చెప్పేవారు. ఎందుకంటే ఈ వాక్యే మన యొక్క ఆత్మ యొక్క ఎవల్యూషన్ గురించి చెప్తుందంట. ఈ నోటి నుంచి రావాల్సిన సత్య వాక్కులు దుర్భాషలు కాదు సత్యవాకులు రావాలి. అది ఎవరైతే సత్యాన్ని తెలుసుకుంటారు వాళ్ళకి ఈ నోటి నుంచి సత్యమే వస్తుంది."],"minutes":4,"words":587},{"title":"సప్త జ్ఞాన భూమికలు","paras":["ఎప్పుడు కూడా సత్యమే పలుకుతారు. అందుకే మనం మాట గమనిస్తే వాళ్ళు మాట్లాడే మాటలు బట్టి వారి ఆత్మ స్థాయి మనకు తెలుస్తుంది. మన మనం ఎక్కడున్నామో మనం తెలుసుకోవాలి. మనం ఈ పరిణామ క్రమంలో ఈ నిచ్చన ఒక నిచ్చన ఉందనుకుంటే ఈ నిచ్చన ఎన్ని మెట్లు మనం ఎక్కాంము ఈ నిచ్చనలో తెలుసుకోవాలి.","ఇప్పుడు ధ్యాన సాధన చేస్తాం ఫస్ట్ మనక ఏదో ఒక ట్రిగ్గర్ పాయింట్ మన జీవితంలో సంభవించి ఉంటుంది. ఏదో ఒకటి ఫస్ట్ టైం మన చెవిలో పడతాయి ధ్యానము ఆత్మజ్ఞానము ఇవన్నీ మనకి చెవు మీద చెవిలో వస్తాయి. మనకు కూడా ఒక కోరిక కలుగుతుంది. ఒక ఇచ్చ వస్తుంది. నేను కూడా ఈ బ్రహ్మజ్ఞానం పొందాలి.","ఈ గురువుగారు ఎంతో ఆనందంగా ఉన్నారు ఈయన ఎన్లైటన్ మాస్టర్ నేను కూడా ఈ ఆనందాన్ని ఇంత ఈ స్థితిని నేను కూడా పొందాలి. నాకు ఎందుకు ఇంకా దుఃఖం ఉంది ఆనందం వైపు ఎలా దుఃఖ రాహిత్యాన్ని పొందాలి ఎలా బ్రహ్మజ్ఞానం పొందాలి ఇలా ఆలోచన చేసేవారు ఎవరైతే ఉంటారో తీవ్రంగా ప్రయత్నం చేసి ఆ ఇంటెన్షన్ పెట్టుకున్నవారు సంకల్పించిన వారు వాళ్ళంతా శుభేచ్చ స్థితిలో ఉన్నవారు.","శుభే శుభ ేచ్ఛ అంటాం శుభమైనటువంటి ఇచ్చ అలా మనం ఆలోచన చేస్తాం కదా మనకు వస్తాయి ఆలోచన వస్తుంది మనం చక్కగా ఆత్మజ్ఞానం బ్రహ్మజ్ఞానం పొందాలి ఈ దుఃఖ రాహిత్యం ఈ దుఃఖం పట్టి పీడిస్తుంది ఎందుకు వస్తుందో తెలియదు. దీన్ని తాడ పీడ తీర్చుకోవాలని సాధన కూర్చుంటాం కదా సాధన చేయాలని అని నిర్ణయించుకుంటాం కదా అప్పుడు విచారణ అనే స్థితి వస్తుంది మనకి.","విచారణలో మనం ఎలా పొందాలి ఆ బ్రహ్మజ్ఞానం ఎంక్వైరీ చేస్తాం విచారణ చేస్తాం ఇన్వెస్టిగేషన్ చేస్తాం విచారణ చేయాలి ఆత్మ విచారణ ధ్యానం ధ్యాన ఇలా ధ్యానం చేయమంటారు ఆ టెక్నిక్ ఏంటి ధ్యానం ఎలా చేయాలి అవన్నీ మనం తెలుసుకోవాలి ఇంకా తెలుసుకుంటాం ఓ స్వాధ్యాయం చేయాలి సజ్జన సాంగత్యం చేయాలి.","మూడు చేస్తే మనం ముందరకి వెళ్తాం. ఈ విచారణలో ఇవన్నీ కనుక్కుంటాం వివరాలు కనుక్కుంటాం. ఫస్ట్ ఇవన్నీ థియరీ తెలుసుకోవాల విచారణ తర్వాత మళ్ళా మనం ఏదైతే తెలుసుకున్నామో మూడవ స్థితిలో మనం ప్రాక్టీస్ చేయడానికి ప్రయత్నం చేస్తాం. ఇంతవరకు అదంతా థియరీ ధ్యానం ఫస్ట్ థియరీ చదువుతాం పుస్తకాలు చదువుతాం అన్ని చదువుతాం తర్వాత ప్రాక్టీస్ తనుమానసి అంటాం.","ప్రాక్టీస్ స్టేట్ ని తనుమానసి తనువు రెండు పదాలు ఉన్నాయి ఇక్కడ తను రెండు విధాలుగా అంతరార్థ పరంగా తీసుకోవచ్చు. దీన్ని తనువు మనసు అని చూడండి. తనువు అంటే శరీరము మనసు అంటే మనసు. మనకు తెలిసిందే. ఇప్పుడు మనసులో బాధ కలిగింది మీ శరీరంలో కూడా బాధ ఉంటుందా లేదా? మనసులో బాధ ఉంది భారంగా ఉంది మీ శరీరం కూడా భారంగా ఉంటుంది కచ్చితంగా. యస్ ఇస్ యువర్ మైండ్ సో ఇస్ యువర్ బాడీ.","మీ బాడీలో ముల్లు గుచ్చుకుంది బాగా నొప్పి వస్తుంది. మీ మనసు ఎలా ఉంటుంది ఎవరైనా వచ్చి ఏవండీ మెడిటేషన్ చెప్పండి అంటే కొంచెం కొంచెం ఇరిటేట్ అవుతారు. ఇప్పుడు కాదండి నాకు ఇక్కడ దెబ్బ తగిలింది రక్తం కాదు మీకు నొప్పి వస్తుంది మనసు కొంచెం కదులుతుంది. ఇర్రిటేట్ అవుతారు. సో మనసులో జరిగేది మన శరీరం పట్ల శరీరం మీద ప్రభావితం చూపిస్తుంది. శరీరంలో జరిగేది కూడా మనసు ప్రభావితం చూపిస్తుంది.","ఈ రెండు ఒకటిగానే ఉంటాయి. కానీ తనుమానసి అనే స్థితిలో మనం ఈ తనువు మనసు రెండు కలిపి మనం సాధనలో కూర్చోబెట్టాలి. వీడిని నిశ్చలంగా కూర్చోబెట్టాలి. ఈ శరీరాన్ని కాళ్ళ మీద కూర్చోబెట్టాలి నిశ్చలంగా ఉండాలి అటు ఇటు కదులుతూ కదులుతూ కాదు మనం నడుస్తూ చేయలేము.","ధ్యానం హాయిగా సుఖసనంలో కూర్చోవాలా కళ్ళు మూసుకోవాలా శ్వాస మీద జాస ఉచ్వాస నిశ్వాసాలను గమనించడం ఇది చేస్తూంటాం తను మానసి ప్రాక్టీస్ నిరంతరం ప్రాక్టీస్ లో ఉంటాం చాలా ప్రాక్టీస్ చేసుకుంటాం. ఇప్పుడు నాలుగో స్థితికి వెళ్తాం. ఈ నాలుగో స్థితిలో మనకు అనుభవాలు వస్తాయి చాలా అనుభవాలు వస్తాయి.","థడై వరకు వెళ్ళిపోతుంటాం విశుద్ధం నుంచి దాటి త్రడై ఎక్స్పీరియన్స్ వచ్చేంత వరకు వెళ్ళిపోతుంటాం మనకి శక్తి ప్రవాహం ఎన్ని తెలుసుంటుంది. నాడీ మండల శుద్ధి జరుగుతుంటుంది. ఈ స్థితినే సత్వాపత్తి అంటాం. సత్వాపత్తి అనే స్థితి ఇక్కడ తమోగుణము రజోగుణాన్ని దాటి కంప్లీట్ గా వాటిని దాటగలుగుతావు శుద్ధ సాత్వికుడుగా ఉండగలుగుతావు.","సత్వాపత్తి సాత్వికము శుద్ధ సాత్వికం అంతర్శుద్ధి జరుగుతుంది. కానీ సిద్ధాంతపరంగా మనం అహం బ్రహ్మాస్మి అని తెలుసుకుంటాం. సిద్ధాంతపరంగా అంటే థియరటికల్ గా మనం అహం బ్రహ్మాస్మి అని తెలుసుకుంటాం కానీ ఇంకా ప్రాక్టికల్ అనుభవం లేదు మనకి ఇంకా థియరటికల్ గా తెలుసుకున్నాం. అహం బ్రహ్మాస్మి వీరందరినీ బ్రహ్మవిధుడు అంటారు. బ్రహ్మవిధుడు ఈ సత్వాపత్తి నాలుగవ స్థితిలో మన నిత్యం నాలుగవ మెట్టు మిచన్లో నాలుగో మెట్టుక ఎక్కాం.","ఈ నాలుగో మెట్టులో నుంచే మన ఎన్లైటన్మెంట్ స్టార్ట్ అవుతుంది అంతవరకు సాధనే కానీ సిద్ధాంతపరంగా థియరటికల్ గా తెలుసుకున్నాం అహం బ్రహ్మాస్మి వాళ్ళని బ్రహ్మవిధుడు అంటారు. దాని తర్వాత ఇంకా సాధన బాగా పెరుగుతుంది. ఆజ్ఞా చక్రంలోకి వెళ్ళిపోతాం స్టెబిలైజ్ అవుతాం. ఇక్కడ మన ఎనర్జీ మాట మాటికి కింద పడిపోకుండా ఇక్కడ స్టెబిలైజ్ అవుతుంది.","ఈ ఆజ్ఞా చక్రంలో ఉన్నప్పుడు మనం అసంశక్తి అనే స్థితికి వస్తాం. అసంశక్తి అనాసక్తి ఆసక్తి అంటే ఏంటి ఇంట్రస్ట్. మనం దేని పైన కొన్ని విషయాల పైన మనకి చాలా ఆసక్తి ఉంటుంది. ఎన్నో ఆసక్తులు ఉంటాయి ఎన్నో ఆసక్తులు ఉంటాయి. మనకి ఇక్కడ అనాసక్తి అసంశక్తి ఎందుకంటే థర్డ్ ఐ ఎక్స్పీరియన్స్ వచ్చిన తర్వాత బాహ్యం పట్ల మనకి ఆసక్తి తగ్గుతుంది.","బాహ్య సంపదలు బాహ్యం బాహ్యం బాహ్యం ఎప్పుడు బాహ్యంలో అంత ఇంట్రెస్ట్ ఉండదు లోపల అన్నీ అంత ఇంట్రస్ట్. ఒకసారి సూక్ష్మ శరీర ధ్యానం చేయాలి ఒక్కసారి ఆ ఏవైతే నాకు కనిపించినవి నేను చూడాలి కొన్ని దర్శనం చేసుకోవాలి కొన్ని దర్శనాలు కావాలి నాకు ఆత్మానుభవం కావాలి. ఇవి ఉంటుంది వీటిపైన ఆసక్తి మల్లుతుంది మనకి మన లోపల ప్రపంచంలోకి మనం వెళ్తాం.","బాహ్య ప్రపంచం పట్ల అనాసక్తి అసంశక్తి దీన్నే మరి శ్రీకృష్ణ భగవాను వారు పద్మపత్ర మివాంభసా అని అన్నారు. తామురాకు మీద నీటి బొట్టు లాగా జీవించడము ఇక్కడ ఉంటాం సాధన చేస్తాం మన ఇంట్రెస్ట్ తగ్గుతుంది. ఇక్కడ అన్నం తినాలన్నా ఇంట్రస్ట్ ఉండదు కాస్మిక్ ఎనర్జీ తినాలని ఉంటుంది.","మనకి ధ్యానం కూర్చుని కాస్మిక్ ఎనర్జీ లోపల ప్రపంచం మనల్ని ఎంత ఇంటాక్సికేటింగ్ గా ఉంటుంది అంటే అదే బా ఈరోజు ధ్యానంకి టైం దొరకట్లేదు నాకు మెడిటేషన్ కి వెళ్ళిపోవాలి మెడిటేషన్ లో కూర్చోవాల. ఈరోజు మనం అంతర్ మౌన స్థితి ఇష్టపడతాం. మౌన స్థితి చాలా హాయిగా ఉంది. లోన్లీనెస్ ఇస్ కాల్డ్ లగ్జరీ అలోన్స్ ఇస్ కాల్డ్ లగ్జరీ మనకు తెలిీదు ఆ వాల్యూ చాలామంది లోన్లీనెస్ తో బాధపడుతుంటాం.","అలోన్స్ నేను ఏకాగ్ని నాకు ఎవరు లేరు ఎవరు లేరు ఎవరు లేకపోతే ఇంకా మంచిది సాధన ఎంత హాయిగా చేసుకోవచ్చుఅంటే ఏ ఒక్కడు ఇచ్చకు లేదు చింతా లేదు ఎవ్వడు ఇది ఒక్క మాట లేదు. హాయిగా నో కంప్లైంట్స్ నో ప్రాబ్లమ్స్ డిస్ట్రాక్షన్స్ లేవు నేచర్ మీకు యూనివర్స్ చాలా డిజైన్ చేసి పెట్టింది. అక్కడ సో అదిఒక లగ్జరీ అందరికీ రాదు.","ఆ ఆస్కారం చాలామంది ఈ స్థితిలో చాలా ఎంజాయ్ చేస్తారు ఆ ప్రెసెన్స్ వాళ్ళ హాయిగా సాధనని ఎంజాయ్ చేసుకుంటారు. మౌన స్థితి మౌనంలో ఉంటారు తాహాయిగా ఉంటారు. లోపల ఎన్నో జరుగుతుంటాయి ఎన్నో ఆత్మానుభవాలు ఎన్నో ఆత్మానుభవాలు మౌనంలోనే వచ్చే.","ఆత్మానుభవాలన్నీ మౌనమే మాటలు తగ్గించాలి. వెయ్యి మాటలు బదులు ఒక్క మాట మన సాధన కంప్లీట్ అయ్యేంత వరకు తర్వాత మాట్లాడండి. నాలుగు స్థితులు సీకర్స్ ఫస్ట్ స్టేట్ సీకింగ్ సీకర్ తర్వాత సియర్ సియర్ తర్వాత తవాత స్పీకర్.","ఒక సీయర్ ఎవరైతే ఆత్మ దృష్టి ఆజ్ఞ చక్రం తెచ్చుకొని అనుభవాలన్నీ తెలుసుకుంటారో ఎన్నో అనుభవాలు ఎన్నో అనుభవాలు ఆత్మానుభవాలు ఇంకా వాళ్ళు సైలెంట్ గా ఉంటారా ఉండరు. అందరికీ మైకులు పెట్టుకొని చెప్పాలా ప్రపంచంఅంతా వినబడే లౌడ్ స్పీకర్స్ లో గట్టిగా మాట్లాడాల్సిన విషయాలు లే ఆత్మ గురించి వక్తలు అవుతారు ప్రవక్తలు అవుతారు.","సో మనం ప్రారంభంలో మనం సాధనలు చేసుకున్నప్పుడు మౌనం మెడిటేషన్ ఇస్ ఆల్వేస్ జర్నీ ఆఫ్ ఏ వన్ సింగిల్ పర్సన్. 10 మంది కలిసి లోపల లోపలికి వెళ్ళలేరు. ఓన్లీ యు కెన్ జర్నీ ఇన్వర్డ్ మీ జర్నీలో ఇన్వర్డ్ జర్నీలో మీ అంతర్ముఖమైన అంతర్ముఖ ప్రయాణంలో మీతో పాటు నా భార్యను కూడా నేను తీసుకెళ్తాను అంటే కుదరదు.","ధ్యానంలో కుదరే కుదరదు మీరు ఒక్కలే వెళ్లాలి. దీనికి మరణానికి ఒక పోలిక ఉంది. మరణం కూడా అంతే మీ భార్యని మీరు అడగండి నాతో పాటు రా నాకు తోడు రా అదే లేరు లోగా ఫీల్ అవుతున్నారు అని ఎవరైనా అడుగుతారా అడగరు ప్లస్ అది వీలు కాదు కూడా ఎవరి టైం వారిది మనం టైం గురించి చెప్పుకున్నాం.","ఎవరి టైం వారిది ఉంది ఎవరి టైం వారిదే ఆ టైం బట్టే అన్ని జరుగుతాయి. ఎవరి సమయం వాళ్ళది అంతే. సో అసంశక్తి ఎవరైతే ఈ స్థితిలో ఉన్నవారు ఉన్నారో వాళ్ళంతా బ్రహ్మ విద్వరుడు అంటాం. వారిని బ్రహ్మ విద్వరుడు. సో సత్వాపత్తి స్థితిలో బ్రహ్మ విధుడు అంటే థియరటికల్ గా బ్రహ్మజ్ఞానం పొందాడు థియరటికల్ గా తెలుసుకున్నాడు. అంతా బుకిష్ నాలెడ్జ్ అంతా వచ్చేసింది.","వేదాలు ఉపనిషత్తులు అన్ని చదివాడు సీనియర్ మాస్టర్ సీనియర్ అందరిని మెడిటేటర్స్ నుంచి తెలుసుకున్నారు విషయాలన్నీ తెలుసుకున్నప్పుడు ఇవన్నీ కూడా థియరటికల్ బ్రహ్మ విధుడు తర్వాత అసంశక్తి స్థితిలో థర్డ్ ఐ ఎక్స్పీరియన్స్ అన్ని బ్రహ్మాండంగా పొందుతారు. వాళ్ళు ఒక అసంశక్తి ఏర్పడుతుంది. అనాసక్తి ఏర్పడుతుంది వారిని బ్రహ్మ విద్వరుడు అంటాం.","ఎందుకంటే ఇంటాక్సికేటింగ్ స్పిరిచువల్ ఎక్స్పీరియన్స్ ఉంటాయి వాళ్ళకి మెడిటేషన్ మిస్ కావడం ఇష్టం లేదు. వారికి టైం దొరికితే కళ్ళు మూసుకుంటారు. టైం దొరికితే కళ్ళు మూసుకోవాలి. కళ్ళు తెరిస్తే బాహ్యంలోకి వెళ్ళిపోతున్నాం. కళ్ళు మూసుకొని హాయిగా మన అంతర ప్రపంచంలో మన ఆత్మ ప్రపంచంలో మనం ఒక సాధకుడు రమిస్తూ ఉంటాడు. టైం దొరికినప్పుడు అల్లా కళ్ళు మూసుకోవాల శ్వాస మీద ధ్యాస కళ్ళు మూసుకొని శ్వాస మీద ధ్యాస అంతర్మౌన స్థితి హాయిగా.","బ్రహ్మ విద్వరుడు రెండవ స్థితి అంటే ఇది నాలుగవ ఐదవ స్థితి అయినప్పటికీ నాలుగు ఐదు నుంచే మన నిజ నిజమైనటువంటి ఈ ధ్యాన సాధన యొక్క ఫలాలన్నీ మనకు వస్తుంటాయి. తర్వాత మనం ఇంకొంచెం డీప్ గా వెళ్తాం సబ్జెక్టు లోకి ఎన్నో అనుభవాల ద్వారా అనుభవ యొక్క జ్ఞానం కలుగుతుంది. సమాధి స్థితులు వస్తుంటాయి.","కాని సవికల్ప సమాధి ఇంకా కొన్ని డౌట్స్ ఉంటాయి. అప్పుడప్పుడు టచ్ అవుతూ ఉంటుంది హైట్ అండ్ కాన్షస్నెస్. హైట్ అండ్ అవేర్నెస్ ఒక అతీతమైనటువంటి గొప్ప ధ్యాన స్థితులు సవికల్ప సమాధి సిద్ధ స్థితి ఒక చిన్న ఆలోచన రాగానే సంకల్పం రాగానే అది అయిపోతుంది. ఎనర్జీ లెవెల్స్ హైగా ఉంటాయి ఈ స్థితిలో. దీన్నే పదార్థ భావన అంటారు.","పదార్థ భావన దీన్ని విడగొడితే పదము అర్థము పదార్థము పదార్థాన్ని పదము అర్థము అంటే మనం మేటర్ అని పదార్థం అంటే మేటర్ మేటర్ అని ఏదైతే అనుకుంటున్నామో మేటర్ ని క్రియేట్ చేసింది ఎనర్జీ. ఆల్బర్ట్ ఐన్స్టీన్ గారు చెప్పినటువంటి సిద్ధాంతమే ప్రూవ్ చేయబడింది. ఎనర్జీ క్రియేట్స్ మేటర్ శక్తియే పదార్థంగా మేటర్ గా రూపాంతరం చెందుతుంది.","పదార్థంలో ఉన్నది మేటర్ లో ఉండేది ఓన్లీ ఎనర్జీనే బండల్ ఆఫ్ ఎనర్జీ. అక్కడ ఉండేది ఎలక్ట్రాన్స్ ప్రోటాన్స్ న్యూట్రాన్స్ ప్రతి పదార్థంలోనూ పదము అర్థము అంటే ప్రతి పదము కూడా మనం మాట్లాడే ప్రతి పదము కూడా పదార్థంగా అయిపోతుంది. మేటర్ గా అవుతుంది మనిఫెస్ట్ అవ్వడం తద్భావం తద్భవతి. ఈ జ్ఞానం అంతా మనం తెలుసుకుంటాం.","హౌ వరల్డ్ వర్డ్ క్రియేట్స్ వరల్డ్ వర్డ్ క్రియేట్స్ వరల్డ్ పదమే పదమే మన పదమే పదార్థాన్ని సృష్టి చేస్తుంది. మన సంకల్పాలే రూపాంతరం చెంది ఏదైతే ఇక్కడ సిద్ధింపబడతాయి సాధింపబడతాయి సాధ్యమవుతుంది మేనిఫెస్ట్ అవుతుంది భావం భవం భవంతి. మన భావాలన్నీ కూడా భవతి ఒక రూపాన్ని ధరిస్తాయి తీసుకుంటాది మేనిఫెస్ట్ అవుతుంది.","ఇదే పదార్థ భావన అంటే సిద్ధుడు సిద్ధుడు సిద్ధుడు స్థితి ఇది ఇవన్నీ చూడండి మనం మన ప్రయాణంలో ఆత్మజ్ఞానం గురించి చేసే ప్రయాణంలో మన స్థితులని మనం గుర్తించాలి. ఏ స్థితిలో మనం ఉన్నామో అనేది గుర్తుంచుకోవాలి నెక్స్ట్ స్టేట్ లోకి మనం వెళ్ళాలి. ఇది ఆరో స్థితి ఎవరైతే ఈ స్థితికి చేరుకున్నారో వాళ్ళని బ్రహ్మ విద్వరీయుడు అని అంటాం.","బ్రహ్మ విద్వరీయుడు పదార్థ భావన స్థితికి చేరుకున్న వారంతా బ్రహ్మద్వియులు దీని తర్వాత స్థితి ఒకటి ఉంది అది నిర్వికల్ప సమాధి. అంతవరకు సవికల్ప సమాధిలో ఇంకా సంశయాలు ప్రశ్నలు ఇవన్నీ ఉంటాయి. కొన్ని ఉంటాయి. కానీ ఇవన్నీ కూడా క్వశ్చన్స్ వెళ్ళిపోయాయి. అనుకుందాం మీకు క్వశ్చన్స్ పోయాయి అంత ఫస్ట్ లో అడిగేవాళ్ళ క్వశ్చన్లు ఈ క్వశ్చన్ అడుగుదాం ప్రశ్న అన్నీ వెళ్ళిపోయాయి.","ఇప్పుడు నిర్వికల్ప సమాధి వీళ్ళనే బుద్ధులు అంటారున్నమాట. సహస్ర దళ కమలం విచ్చుకుంది వాళ్ళకి వాళ్ళ పని ఏంటంటే ఎప్పుడు అందరిని యోగులుగా మలచాలి అందరిని మాస్టర్స్ తయారు చేస్తుంటారు వాళ్ళు మాస్టర్స్ మాస్టర్స్ ని తయారు చేస్తుంటారు. వాళ్ళు ఈ ఏడవ స్థితిలో ఉన్నవారు వీళ్ళు తురీయగా తురియగ స్థితి తురియాన్ని చేరుకున్నవారు బుద్ధులు. సహస్రదల కమలము వేడగల పాము వీళ్ళందరినీ బ్రహ్మ విద్వరిష్టుడు అంటారు.","బ్రహ్మ విద్వరిష్టుడు ఈ వర్డ్స్ మనం తెలుసుకోవాలి ఎందుకంటే ఇవన్నీ ఉపయోగించబడ్డాయి. సో ఈ మూడో రోజులు మూడు రోజులు కూడా ఆఖరి మూడు రోజులు మహా సరస్వతి ఇవన్నీ కూడా మన జ్ఞానం వైపు తీసుకెళ్తుంది. ఆ తల్లి జ్ఞాన ప్రసాదిని సర్వ జ్ఞానాలు ప్రసాదించేస్తుంది. ఆ తల్లి ఇప్పుడు మనం చెప్పుకున్న ఏడు స్థితులు కూడా వీటిని మనం సప్త జ్ఞాన భూమికలు అంటాం ఎందుకంటే ఇది ఒక మంచి డయాగ్నోస్టిక్ టూల్.","అన్నమాట మనల్ని మనం డయాగ్నోస్ చేసుకోవడం సెల్ఫ్ డయాగ్నోసిస్ మనం ఏ స్థితిలో ఉన్నామో తెలుసుకోవడానికి మహర్షులు ఒక ఒక చార్ట్ ప్రిపేర్ చేశారు. ఒక చార్ట్ మనకు కావాలి కదా మనం ఏ స్థితిలో ఉన్నామో మనం తెలుసుకుంటూ ఉండాలి. శుభేక్ష ఉంది కోరిక ఉంది బ్రహ్మజ్ఞానం తెలుసుకోవాలి.","ఒట్టి మాటలే కానీ ఇంకా ఏం ప్రయత్నం కూడా చేయదు. మంచి ఇచ్చ అయితే ఉంది మంచి కోరిక ఉంది కానీ అది ఆ తీవ్రమైన కోరిక ఉంటే మాత్రం అది శుభేక్ష అనబడుతుంది. తీవ్రమైన నేను ముముక్షువు కావాలి బ్రహ్మజ్ఞాని కావాలి తీవ్రంగా సంకల్పించుకుంటాడు. విచారణ జరుపుతాడు రెండవ స్థితి. అందరూ ఇదే చెప్తారు ఒకటే ఫార్ములా ఇస్తారు.","బుద్ధుడి దగ్గరికి వెళ్ళినా ఎవరి దగ్గరికి వెళ్ళినా ధ్యానం స్వాధ్యాయం సజ్జన సాంగత్యం చేయండి. ధ్యానం చేయండి స్వాధ్యాయం చేయండి ఒక గంట ధ్యానం ఒక గంట స్వాధ్యాయం ఒక గంట సజ్జన సాంగత్యం కొంచెం ప్రారంభంలో అది తర్వాత తర్వాత ఇంకొంచెం ఇంక్రీస్ చేయండి. టైం ఒక గంట ఎక్కువ చేయండి రెండు గంటలు మూడు గంటలు చేయండి.","విచారణ చేసుకుంటాం ఓ ధ్యానం ఎట్లా శ్వాస మీద జాసి పెట్టాలి ఎలా గమనించాలి గట్టిగా పీల్చుకోవాలి అన్ని డౌట్స్ వస్తాయి విచారణ చేసుకోవాలి టెక్నిక్ నేర్చుకోవాలి సుఖసనం అంటే ఏంటో సుఖాసనం ఎలా కూర్చోవాలి చేతులు ఎలా కట్టుకొని కూర్చోవాలి గట్టిగా బీసుకని కూర్చోవాలా రిలాక్స్డ్ కూర్చోవాలా ఎలా కూర్చోవాలి.","కళ్ళు మూసుకొని కూర్చోవాలా కళ్ళు తెరుచుకొని కూర్చోవాలా విచారణ చేస్తాం ఇవన్నీ తెలుసుకోవాలి. రాంగ్ మెథడ్ లో మనం వెళ్ళకూడదు రాంగ్ కరెక్ట్ మెథడ్ తెలుసుకోవాలి. ఇన్నీ విచారణలో ఇన్నీ తెలుస్తాయి. చేతులు పెట్టుకొని ఓపెన్ పెట్టుకొని చేస్తే ఏమవుతుంది క్లోజ్ చేస్తే ఏమవుతుంది మీ డౌట్స్ అన్నీ క్లారిఫై చేసుకుంటారు.","ఓపెన్ పెడితే మన ఎనర్జీ అంతా వచ్చిన ఎనర్జీ అంతా పోతుంది క్లోజ్ చేసుకుంటే సర్క్యూట్ ఫామ్ అవుతుంది ఇవన్నీ తెలుసుకుంటాం విచారణ తర్వాత తనుమానసి స్థితి. తనుమానసం మన మనసుని కంప్లీట్ గా నిశ్చలం చేసుకోవడానికి సాధన చేస్తాం. ధ్యాన సాధన అంటే ఫస్ట్ ఒక మీనింగ్ చెప్పుకున్నాం తనువు అంటే శరీరము మనసు ఈ రెండిటికీ కనెక్షన్ ఉంటుంది.","రెండిటిని హాయిగా పెట్టుకొని సాధన చేసుకోవాల సుఖసనంలో కూర్చుని కళ్ళు మూసుకొని శ్వాస మీద ధ్యాస సాధనలోకి దిగడం. ఇది మూడో స్థితి తనుమానసం శ్రద్ధగా సాధన చేయడం. ఇంకొక మీనింగ్ కూడా తను అంటే తను అనే వర్డ్ కూడా పల్చన అంటే మనసు ఎప్పుడు సాంద్రతతో ఉంటుంది డెన్స్ గా ఉంటుంది హెవీగా ఉంటుంది ఎక్కువ ఆలోచనలు దాన్ని పల్చగా చేయడం అంటే తక్కువ చేయడం నిశ్చలం చేసుకోవడం మౌనం అంతర్మౌన స్థితి.","ఈ అంతర్మౌన స్థితి గురించి చెప్పడం జరిగింది. ఇక్కడ ఈ తనుమానంసంలో మనం అంతవరకు ఏమైతే ప్రిస్క్రైబ్ చేయబడ్డదో ఇన్స్ట్రక్షన్స్ మనం తీసుకున్నామో వాటన్నీ తూచా తప్పకుండా పాటిస్తాం ధ్యానము స్వాధ్యాయము సజ్జన సాంగత్యం. ఇక్కడి నుంచి మనం అసంశక్తి అసంశక్తి స్థితికి వెళ్తాం మన సత్వాపత్తి స్థితికి వెళ్తాం అంటే మనలో ఉన్న రజోగుణము తమోగుణము వెళ్ళిపోవడం.","ఈ సత్వాపత్తి స్థితిలో చక్కని అనుభవాలు ప్రారంభంలో ప్రతి ధ్యానికి వచ్చే అనుభవాలన్నీ వస్తుంటాయి. నాడీ మండల శుద్ధి జరుగుతుంటుంది ఇవన్నీ జరుగుతుంటాయి. ఇది నాలుగవ స్థితి సప్తజ్ఞాన భూమికల్లో నాలుగవ స్థితి ఐదవ స్థితి మనం చెప్పుకున్న అసంశక్తి తామరాకు మీద నీటి బొట్టు లాగా పద్మపత్ర విభాంబస ఆ స్థితి పదార్థ భావన ఆరో స్థితి వారిని సిద్ధుడు అంటాం.","మరియు తదుపరి తురీయము బుద్ధి బుద్ధుడు స్థితి ఇక్కడ ఓన్లీ మనం ఎక్కువగా మన కంప్లీషన్ అయిపోతుంది మన జర్నీ మనం ఎక్కువగా అందరికీ ఈ జ్ఞానాన్ని పంచడంలో నిమగ్నం అయిపోయి ఉంటాం. ఈ జ్ఞానాన్ని అందరికీ చెప్పాలి అందరికీ చెప్పాలి అందరికీ చెప్పాలి. తురియగా ఇది మనం అసెస్ చేసుకోవాలి ఏ స్థితిలో ఉన్నామో తెలుసుకొని నెక్స్ట్ మెట్టు మనం ఎక్కాలి.","ఈ దేవీ నవరాత్రుల్లో ఇవన్నీ మనకి పాసిబుల్ ఓన్లీ తురీయ స్థితిలో మాత్రమే మనం కర్మలు ఏమి ఉండవు. ఆ తురీయగ స్థితి వచ్చిన తర్వాతనే మనకి ఏ కర్మలు మనకు ఉండవు. ఎందుకంటే దాటాం కాబట్టి జాగృతావస్థలో స్వప్నావస్థలో సుషుప్తవస్థలో ఇంకా మన కర్మలు ఉంటాయి మనకి కర్మలు పట్టుకొని ఉంటాయి.","అన్ని దోషాలు త్రిగుణ దోషాలు అన్ని దోషాలు మన పట్టుకొని ఉంటాయి. కర్మ దోషాలు పట్టుకొని ఉంటాయి. తురయం ఎప్పుడైతే తురియం అంటే రైజింగ్ అబవ్ తురయం అంటేనే రైజింగ్ అబవ్ ట్రాన్సెండెంటల్ అని చెప్పుకున్నాం తురీయ స్తుతి దాన్ని రీచ్ అయిన తర్వాత మనకి ఓన్లీ మనం విట్నెస్ చేస్తుంటాం. విట్నెస్ చేసేవాడికి ఏమి అంటం ఇప్పుడు చాలామంది ఆధ్యాత్మిక సాధకులు ప్రారంభంలో చాలా డౌట్స్ వచ్చేస్తాయి.","కొన్ని పుస్తకాలు లో కర్మ అసలు లేవు అంటారున్నమాట కర్మల గురించి మాట్లాడుతున్నారు కర్మ అసలు లేనే లేదు తురీయ స్థితిలో ఎవరైతే జ్ఞానం ఇస్తారో వారు కర్మ లేదని చెప్తారు. కానీ జాగృతావస్థలో ఉన్నప్పుడు మనక ఆ కర్మ పట్టుకొని ఉంటుంది ఆ గతం తాలూకు చిహ్నాలు మన మీద పడి ఉంటాయి కచ్చితంగా ఉంటుంది.","అందుకే రమతా గారి పుస్తకాలు ఓపెన్ చేస్తే మనం కన్ఫ్యూస్ అయిపోతాం. కర్మ లేదు దర్ ఇస్ నో రన్కార్నేషన్ ఓన్లీ వన్ లైఫ్ టైం వారు ఏ స్థితి నుంచి చెప్తున్నారుఅంటే తురియక స్థితి నుంచి చెప్తున్నారు వాళ్ళకి అసలు రన్కార్నేషన్ లేదు అక్కడ రన్కార్నేషన్ రాంగ్ అక్కడ కాన్సెప్ట్ రాంగ్ అయిపోతుంది ఎందుకంటే ఏమి ఇంకార్నేషన్ ఏమి లేదు నాటకం ఇదంతా ఇస్ ఆల్ అన్రియల్."],"minutes":14,"words":2130},{"title":"దేవీ సమర్పణ · సాధన","paras":["భగవాన్ శ్రీరామ మహర్షిని అడిగితే కూడా అదే చెప్తారు నో రింకార్నేషన్ పునర్జన్మ లేదు పాడలేదు కర్మలు లేవు పాడలేదు నువ్వు అనుకుంటున్నావు అంతే. ఎందుకంటే తురియ స్థితిలో వాళ్ళు అలా చెప్తారు కానీ ఆ స్థితిలో మనం రీచ్ కాలేదు కాబట్టి మనం ఉన్నాయి. ఆ ఒకసారి ఆ మెట్టు ఎక్కామా ఏడో మెట్టు ఎక్కామా లేనే లేదు కర్మలు లేవు పాడలేదు జన్మలు లేవు పాడలేదు అన్ని ఖతం ఎండ్ అయిపోయింది స్టోరీ ఎండ్ మోక్షం.","సో మన ఈ సప్తజ్ఞాన భూమికలు అనేది మంచి రెఫరెన్స్ మనకి సాధకులకి మన గురించి మనం తెలుసుకోవడానికి ఒక మంచి స్ట్రక్చర్డ్ గా మనకి ఆ జ్ఞానం తెలియచెప్తుంది. సో ఫ్రెండ్స్ మరి ఈరోజు కూడా దేవీ సమర్పణ సారి మనం చేద్దాము. హాయిగా కూర్చోవాలి దేవీ సమర్పణ అంటే మనం సరెండర్ ఆ శక్తి దేవి అంటే ఆ మాత కుండల్ని మాతే మనలో ఉన్న శక్తి కంప్లీట్ సరెండర్ కావాలి.","ఈరోజు మనం చేసే క్రియలో కూడా ఏంటంటే మన తల్లికి కూడా బౌ డౌన్ చేస్తున్నట్టుగా భావన చేద్దాం. మన తల్లి ఆ తల్లి కూడా ఇద్దరు తల్లులు ఓకే ఎలా మనం హాయిగా కూర్చోవాలి. మన ఎడమకాలు పైన ఉండాలి కుడికాలు మీద పైన ఉండాలి. అదొకటి తర్వాత మీ కుడి ముక్కు నాసికరంద్రాన్ని క్లోజ్ చేసుకోవాలి దాన్ని క్లోజ్ చేసి ఎడమ ముక్కు ద్వారా తొమ్మిది సార్లు లోపలికి గాలి పిలుద్దాం.","ఎట్లా అంటే సక్సెసివ్ గా ఫస్ట్ ఒకసారి పిలిచాలి రెండోసారి మూడోసారి నాలుగోసారి ఐదోసారి ఆరోసారి ఏడోసారి ఎనిమిదోసారి తొమ్మిదోసారి. తొమ్మిది సార్లు జెంటిల్ గా పిలిచండి మరీ గట్టి గట్టిగా పిలిస్తే చివర గాలి ఉండదు. పిలిచడానికి ఏందంటే మన ఊపిరి స్థితులు ఫుల్ అయిపోతాయి కాబట్టి.","సో అట్లా ఒకసారి రెండోసారి మూడోసారి మళ్లా వదలకూడదు లోపలే పెట్టుకోవాలి ఆ గాలి తర్వాత హోల్డ్ చేయాలన్నమాట తొమ్మిది సార్లు పిలిచిన తర్వాత లోపలికి హోల్డ్ చేసి ఉంటాం ఆ టైంలో ఏ భావం అంటే సమర్పణ భావము మన తల్లి మనం మన తల్లితో కనెక్షన్ ఆ తల్లితో కనెక్షన్ మనం ఎస్టాబ్లిష్ చేసుకోవాలి.","మన తల్లికి కి పాద నమస్కారం చేస్తున్నాం మన బయలాజికల్ మదర్ కి తర్వాత ఆ తల్లికి ఏ సృష్టి అంతా చేసిన పెద్ద తల్లి ఉంది ఆ తల్లికి కూడా మనం పాద నమస్కారం శిరస్సు వంచి నమస్కారం చెప్తున్నాం. ఎప్పుడైతే మీరు శిరస్సు వంచారో గాలి వదులుతూ శిరస్సు వంచిన తర్వాత అక్కడ హోల్డ్ చేయాలి మీ బ్రెత్ ని ఆపేయండి ఆపేసి అప్పుడు శ్రీం అనే ఈ పదాన్ని ఆ ఈ తొమ్మిది సార్లు లోపల మనసులో ఉచ్చరించాలి బయటకి కాదు.","శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం శ్రీం ఇది ఇది వైబ్రేషన్ సౌండ్ ఎందుకంటే ఈ మూడు కూడా మహాదుర్గ మహాలక్ష్మి మహాసరస్వతి ఈ మూడిటికీ సంబంధించినటువంటి బీజ అక్షరం అది వైబ్రేషన్ శ్రీన్ తొమ్మిది సార్లు అన్న తర్వాత నిదానంగా మన శిరస్సుని మళ్లా తిరిగి యదాస్థానానికి పైకి తలని పైకి పెట్టి ఉంచాలి. ఇది ఒక్కసారి తొమ్మిది సార్లు ఇది చేద్దాం.","ఆ భావం ఇంపార్టెంట్ ఆ భావంతో చేయండి. మీరు ఒకవేళ ప్రయాణంలో ఉంటే బస్సులో గాని కార్లో గాని ఉంటే మీరు చేయొద్దు మీరు డ్రైవింగ్ చేస్తుంటారు కాబట్టి వద్దు మీరు లోపల చేయండి ఆ భావం లోపల ఆ భావంతో ఉండండి సమర్పణ భావం శశ కంప్లీట్ చేసినవారు మౌనంలో పైన కూర్చునండి."],"minutes":2,"words":387},{"title":"భక్తిగీతం · అనుభవాలు","paras":["వండర్ఫుల్ ఫ్రెండ్స్ ఇప్పుడు మరి హారిక మేడం నుంచి మనం ఒక చక్కని ఇదేవి మాత గురించి ఒక చాంట్ గాని ఒక పాట గాని విందాం. యా దేవి సర్వభూతేషు విష్ణుమాయేతి శబ్దిత యా దేవి సర్వభూతేషు విష్ణుమాయేతి శబ్దితా నమస్తస్యై నమస్తస్యై నమస్తస్యై నమో నమః...","ఎలా చెప్పుకోవలంటే ఈ పాటలో ప్రతి పంక్తిలో అర్థం చాలా లోతుగా ఉంది. ఇది మాతకు మన అరచేతి నమస్కారం మాత్రమే కాదు; ఇది మన జీవితంలోని అన్ని స్థితులు, తపన, శక్తి, సమాధానం, చింత, ఆశ, అశ్రద్ధ, కాంతి, లక్ష్మి, స్మృతి, దయ, తుష్టి, మాతృరూపం, భ్రాంతి, వృత్తి, ప్రకృతి—ఇవన్నీ ఆమె రూపాలే. విచిత్రం ఏమిటంటే ఈ పాటను వింటుంటే మనం కేవలం సంగీతం మాత్రమే కాదు, మన మనసు కూడా ఒక వేదన, శాంతి, ఆత్మీయత, మరియు దివ్య సంశ్లేషణలోకి నడుస్తుంది.","థాంక్యూ థాంక్యూ హారిక మేడం దట్స్ అమేజింగ్. అంటే మీరు సెలెక్ట్ చేసుకునే ప్రతి ఈ ఛాంట్స్ లోనూ ఈ పాటల్లోనూ ఎంతో అంతరార్థం దాగి ఉంది. అదే కాదు మీరు ఆ వైబ్రేషన్ శ్రావ్యమైనటువంటి ఆ పాట వింటుంటే ఈరోజు మా బ్రేక్ఫాస్ట్ అంతా కూడా అయిపోయిందని అనిపిస్తుంది ఎంతో తృప్తిగా ఆనందంగా అనిపిస్తుంది.","థాంక్యూ వండర్ఫుల్ వండర్ఫుల్. యాదేవి సర్వభూతేషు ధ్యాన రూపేన సంస్థిత ఆమె ధ్యానం కూడా ఆవిడే అంటారు కాంతి ఆవిడే శక్తి ఆవిడే తేజస్సు ఆవిడే కీర్తి ఆవిడే అన్ని ఆవిడే ప్రకృతి అంతా ఆవిడే. వండర్ఫుల్ ఫ్రెండ్స్ మరి వన్ ఆర్ టూ షేరింగ్స్ తీసుకుందాము.","ఈ రోజు చాలా ప్రజలు తమ అనుభవాలు చెప్పుకున్నారు. మీరు సార్ థాంక్యూ ఫర్ ద అపర్చునిటీ ఆ నిన్న హ్యాండ్ రైస్ చేసిన వారు ఎవరైతే వెయిటింగ్ లో ఉన్నారు. స్వప్న జ్యోతి గారు అందరం also షార్ట్ గా షేర్ చేద్దామండి. టైం కూడా అవుతుంది. గారి పాదపద్మాలకు అమ్మకి ముందుగా నమస్కారాలు సార్. సార్ అప్పుడే అయిపోయింది దసరా రేపుతో మీరు రారేమో అన్న బాధ కూడా అనిపిస్తుంది.","సార్ అప్పుడే అయిపోయింది వారం రోజులు సార్ ఆ జగన్మాత మా మీద ప్రేమ చూపించిందో చూపించలేదో ఇంకా మాకు తెలియలేదు కదా సార్. మీరు మాత్రం రోజు మాకు ఎన్నో నేర్పి మా మీద ప్రేమతో సార్ మేమేదో చిన్నపాకు తొడువు అంతా మేము సాధించాం అనగానే మాకంటే మీరే ఎక్కువ ఆనందపడిపోతున్నారు.","సార్ మీ ఆనందం చూసి ఈసారి ఇంకా ఇంకా సార్ ఇంకా సంతోషించే పని ఇంకా నేను నేర్చుకోవాలి ఇంకా చేయాలి అని అనే ఉత్సాహం కలుగుతుంది. సార్ నేను సాధించిన దానికి మీ ఆనందం చూస్తుంటే నేనేదో మా బాపట్ల జిల్లానే గెలిసినంత ఆనందం అనిపించింది. సార్ నాకు రెండు రెండు ప్రాబ్లమ్స్ ఉండేయి సార్ నాకు చిన్నప్పటి నుంచి ఉమ్మడి కుటుంబంలో పెరిగాను.","సార్ కొంచెం అన్యాయంగా కొంచెం మాటలు ఎక్కువ అనిపించుకునేవాళ్ళం. సార్ నేను గాని మా అమ్మ మా చెల్లెలు అందుకని నా కళ్ళ ఎదురున ఏదనా అన్యాయం జరిగితే గనుక నేను ఇక నాది ఆగదు. సార్ వెళ్లి నిలబడి ఆ మాట్లాడేస్తాను. సార్ అది కొంచెం మాట్లాడిన తర్వాత నాకు కొంచెం హార్ట్ బీట్ ఎక్కువ అనిపిస్తుంది.","సార్ ఈ మధ్యకాలంలో రెండు మూడు ఇన్సిడెంట్ దాని జరిగినప్పుడు కొంచెం ఒక ముసలత మీద అన్యాయంగా వేరే వాళ్ళు ప్రవర్తిస్తుంటే నేను ఆగలేక వెళ్లి నుంచున్నాను. సార్ ఎక్కడ అన్యాయం జరిగినా సరే నేను నేను నిలబడతాను. సార్ ఆ ఎదుటి వాళ్ళు ఎంత పెద్దోళ్ళయినా సరే నేను మాత్రం ఆగదు.","సార్ నా మనసు ఈసారి మొన్న కూడా ఒకటి జరిగితే ఒక అమ్మవారికి పూనకం వస్తే ఎలా వస్తదో అట్లా నాకు తెలియకుండానే విజృంబణ చేసేసాను. సార్ తర్వాత ఆ ఇక వాళ్ళు వచ్చిన పెద్ద పోలీస్ ఆఫీసర్లను కూడా నాకు అసలు ఆ భావన లేదు. సార్ నేను అనుకునేది ఏదో అనేసి ఇచ్చేసాను. తర్వాత అంతా అయిపోయింది బాగుంది.","అంతా అయిపోయిన తర్వాత ఇక హార్ట్ బీట్ ఎక్కువ అయిపోతుంది. సార్ సరికాని వెయ్యి నా బాడీ స్వీకరించట్లేదు. సార్ ఇక ఈ మధ్య ఇక అది తట్టుకోలేక హార్ట్ బీట్ ని పొట్టలోకి తీసుకొచ్చేసాను. సార్ ఇక పొట్టలోకి తీసుకొచ్చిన తర్వాత పొట్టలో కదలికలు ఎక్కువయపోయినాయి. సార్ విపరీతంగా మళ్ళీ రెండోది.","సార్ ఈ రమల్టాజి ఆర్థరైటిస్ అంటారు కదా సార్ అది ఎప్పటి నుంచో 10 ఏళ్ళ నుంచి ఉంది. సార్ ఈ మధ్య మానేసాను. సార్ టాబ్లెట్లు మానేసిన తర్వాత మరీ ఈ వారం నుంచి మూ:00ంటికి లేసి రెడీ అయి కూర్చోవడాన ఇంకొంచెం పని ఎక్కువయి అనిపించాయేమో మరీ చేతులు నెప్పులు అనిపిస్తున్నాయి.","సార్ ఇక రాత్రి తట్టుకోలేక నా సోల్ కి ఆర్డర్ వేసాను. సార్ నువ్వు నేను రేతుపోట పడుకునేటప్పుడు నన్ను నువ్వు నన్ను బాడీ వదిలి వెళ్లొద్దు నా బాడీ మొత్తం హీల్ చేసి వెళ్ళు ఒకవేళ నీకు తెలియకపోతే హనుమంతుల వారు హెల్ప్ తీసుకో తీసుకొని నా బాడీ హీల్ చేసిన తర్వాత నువ్వు సంచారానికి వెళ్ళు అప్పటిదాకా వెళ్ళమాకు అని చెప్పి కొంచెం గట్టిగా అనేతనికి కొంచెం నెత్తి తగ్గినట్టుంది.","సార్ ఇవాళ కొంచెం చెయి కూడా పర్వాలేదు. సార్ ఈ రెండు సార్ నా మెయిన్ ప్రాబ్లమ్స్. థాంక్యూ సార్ మీ అనుభవాలు చాలా బాగున్నాయి. మేడం స్వప్న జ్యోతి మేడం చాలా మీరు ఎప్పుడు చెప్పినా కూడా చాలా ఇన్స్పిరేషనల్ గా ఉంటుంది మీ మాటలు గాని. ఆ బాపట్ల జిల్లా గెలిచినంత అని చెప్పారు.","మీరు ఆ మీరు అందరి హృదయాల్ని గెలుచుకునే అంత గొప్ప ఆ ఆత్మ చైతన్య స్థాయిని పొందారు మీరు ఆల్రెడీ ఎందుకంటే అదే నిజమైన గొప్ప విజయం. నీ సాధన ఫస్ట్ మూడు గంటలకు లేచి రోజు సాధన కోసంగా లేచి రెడీ అయి కూర్చు చేయాలి ధ్యాన సాధన ప్లస్ మీరేమి విస్మరించట్లేదు మీ డ్యూటీస్ అన్నీ చేసుకొని ఇవన్నీ చేస్తున్నారు. సో ఈ రెండు సమస్యలు కూడా మీరు చక్కగా మీరే పరిష్కరించుకుంటున్నారు.","ఇప్పుడు ఒక విషయం ఎక్కడ అన్యాయం ఉన్నా కూడా ఎదిరించాల్సిందే ప్రశ్నించాలి వ హావ్ టు స్టాప్ దట్ ఎందుకంటే ఇక్కడ ఫిజికల్ ప్లేన్ లో అది ఇంపార్టెంట్ అన్నమాట. ఒక అర్జునుడు లాగా ఉండాలంట పంచపాండవులలో అర్జునుడు ఎక్కడ ఎలాంటి అన్యాయం మహిళకు ఎక్కడ అన్యాయం జరిగినా ఆగకూడదు.","ముసలివారు చిన్న పిల్లలు ధ్యానులు యోగులు ధ్యానులు వారికి అన్యాయం జరిగినప్పుడు ఎప్పుడు ఆగకూడదు వెళ్లి ఆపాల మిగతా వాళ్ళు వాళ్ళు ప్రొటెక్ట్ చేసుకుంటారు. కొంచెం పెద్దవాళ్ళు వాళ్ళంతా ప్రొటెక్ట్ చేశారు చిన్న పిల్లల్ని ప్రొటెక్ట్ చేసుకోలేరు. ఎక్కడ అన్యాయం ఏ అన్యాయం ఉన్నా కూడా అర్జునులాగా మనం ఫస్ట్ వెళ్లి మాట్లాడాల. అది మీరు చాలా చక్కగా చేస్తున్నారు కానీ రియాక్ట్ కాకుండా మీ సోల్ నుంచి చేస్తే మీకు ఆ హార్ట్ బీట్ ఎక్కువ కావడము అయన్నీ తర్వాత.","మీరు ఆ గిల్ట్ భావన అక్కర్లేదు అక్కడ మీరు చేయాల్సిన ధర్మం మీరు చేశారు అంతే. ఎక్కడ అధర్మం జరిగినా కూడా మనం మాట్లాడాలి ఇది అధర్మం అని చెప్పాలి. అది చెప్ మీరు అలా చేస్తున్నారు చాలా మంచి విషయం. ప్లస్ మీరు అన్ని ఆజ్ఞలే ఆజ్ఞా చక్రం దాటిన మాస్టర్ కాబట్టి మీరు అన్ని ఆజ్ఞలే మీ సోల్ కూడా ఆర్డర్ వేసేసారు శరీరంలో ఉండి చూసుకో నొప్పులు రాకుండా అని చెప్పి ఒక ఆర్డర్ ఆర్డర్ ప్రకారం జరిగిపోయింది.","అంతే మేడం మన ఈ శక్తి మన ఆత్మ చైతన్యాలు ఎప్పుడు కూడా ఏదైనా అద్భుతమైన ఏవి సాధ్యం కానీ ఉండవు అన్నమాట మీరు చక్కగా చేశారు. ఈ రుమటాయిడ్ ఆర్థరైటిస్ కూడా కారణంతో ఉంది మేడం వెళ్ళిపోతుంది. అది మీరు చేస్తున్న సాధనలో ఒకానప్పుడు ఏది ఎక్కడఉంది రుమటాయిడ్ ఆర్టిస్ వెతుక్కోవాల్సి వస్తుంది కనిపించదు అది వెళ్ళిపోతుంది. అంతే దాని పని అది ఒక కారణంతో ఉంది దాని పని అయిపోంగానే మీకు కొన్ని రావాల్సిన లెసన్స్ అందంగానే అది వెళ్ళిపోతుంది. అంతే వెళ్ళిపోయిందని కూడా గుర్తించే లోపల అది వెళ్ళిపోయింది.","వెతకాల్సి వస్తుంది ఎక్కడుంది ఎక్కడఉందిని అదొకటి సార్ మీరు మూడు సంకల్పాలు పెట్టుకొని అమ్మవారు ముందు పెట్టమన్నారు కదా నేను మూడు సంకల్పాలు ఫస్ట్ రోజు రాసి పెట్టాను. సార్ ఒకటేమో కృతిక సహాయకారునిగా జీవించాలని రాశను. సార్ రెండేదేమో యుఎస్ లో పిల్లలు ఇద్దరు ఉన్నారు కదా సార్ మా పిల్లలిద్దరు మా పిల్లలతో పాటు ఎంతో మంది ఎంత చేస్తున్నా కూడా వాళ్ళకి సరైన దారి దొరకట్లేదు వాళ్ళందరిక function measure(){const width=columns.clientWidth;const one=window.matchMedia('(max-width:800px)').matches;const total=Math.max(width,columns.scrollWidth);spreadCount=Math.max(1,Math.ceil((total-2)/width));spreadIndex=Math.min(spreadIndex,spreadCount-1);columns.scrollLeft=spreadIndex*width;document.getElementById('position').textContent='Section '+(chapter+1)+' / '+chapters.length+' · '+(one?'Page ':'Spread ')+(spreadIndex+1)+' / '+spreadCount;document.getElementById('prev').disabled=chapter===0&&spreadIndex===0;document.getElementById('next').disabled=chapter===chapters.length-1&&spreadIndex===spreadCount-1}
function move(dir){if(dir===1){if(spreadIndex<spreadCount-1)spreadIndex++;else if(chapter<chapters.length-1){chapter++;spreadIndex=0;render();return}}else{if(spreadIndex>0)spreadIndex--;else if(chapter>0){chapter--;spreadIndex=9999;render();return}}measure()}
document.getElementById('next').onclick=()=>move(1);document.getElementById('prev').onclick=()=>move(-1);document.getElementById('font').onclick=()=>{document.body.classList.toggle('font-large');spreadIndex=0;requestAnimationFrame(measure)};document.getElementById('menu').onclick=()=>document.getElementById('mobile-side').classList.toggle('open');window.addEventListener('resize',()=>{spreadIndex=0;requestAnimationFrame(measure)});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});render();</script></body></html>
