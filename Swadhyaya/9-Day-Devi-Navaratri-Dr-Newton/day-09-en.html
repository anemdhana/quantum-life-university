</style></head><body><div class="app lang-en"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-08-en.html">Prev</a><a href="day-10-en.html">Next</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">The First Principle · Shakti, Chaitanya, Knowledge · Devi Navaratri · Day 9 (English)</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">The First Principle · Shakti, Chaitanya, Knowledge</span></div><div class="tools"><span class="lang-switch"><a href="day-09-te.html">TE</a><a href="day-09-en.html" class="active">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-08-en.html">Prev</a><a href="day-10-en.html">Next</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"Opening Meditation · Anapanasati","paras":["Welcome to the 569th day of the Jnanodayam programme, and to the ninth day of Navaratri. We have almost come to the end. Tomorrow is the Dussehra celebration. How fortunate we all are. Each morning of these nine days we have been learning this Navaratri knowledge from Dr. Newton. Today too, let us become ready to receive it. Let us sit well in meditation for about forty-five minutes, and after that receive the knowledge.","The practice we all do is Anapanasati. It is a very simple method. Sit comfortably in a steady posture. You may sit on a chair and take the support of the back, or, if you wish, sit on the floor. Cross the feet. Those seated on a chair, rest the fingers on the knees. Close both eyes, and with a small smile watch the breath as it happens naturally.","Soft music will be playing. Whenever a thought comes, that music reminds us. It brings our attention back to the breath. We watch the breath exactly as it is. Without any other thought, we remain with this breath alone. Wherever the breath leads us, we go that way. This is an inner journey, a journey we make into ourselves.","Om. Om. Om.","Simply watching, we witness all of it. In this state of meditation, let us offer our power of knowledge and our sankalpa for a blessing. May this earth become a field of peace, of knowledge, and of power. Holding the Self that is in every person, let us invite the Sahasrara that is taking form at Quantum Life University, the Sahasrara of the lamp of knowledge.","May compassion and joy be tended with care. Let us take the sankalpa that what is natural in all of us may live in kinship with every living being on this earth. At the lotus of a thousand petals, and in its midst, together with the many secret geometric forms, we share all of this. Together we are meditating. Let us experience our true nature directly, and release this sankalpa to the universe. Seeing how wonderfully this has happened, bring the attention back, in every moment, to the breath.","One minute remains. Five, four, three, two, one, zero. Slowly rest both hands over the eyes for a few moments. With a small smile, let us open the eyes."],"minutes":3,"words":389},{"title":"Welcome · The Last Day of Navaratri","paras":["Welcome back, everyone. We have come to the ninth day, the last day of this Navaratri. Tomorrow is the Dussehra celebration. For us, though, every day is a celebration, because we begin the day with wonderful knowledge.","Today too, let us welcome Brahmarshi Chakravarti Dr. Newton Kondaveti. Everyone on Zoom, please turn your cameras on, and with a smile let us welcome Sir. Thank you, Sir. Over to you.","Good morning, my dear friends of Jnanodayam. I trust that all of you have been practising beautifully through these Navaratri days. It is with that very sankalpa that we celebrate this festival in India. We do it every year. For these nine days we dedicate ourselves. We do it in order to understand Devi Shakti, to go completely near that Shakti, to connect with it, and to fill ourselves with it. Every year we do this. In every practice, and in every meditation, we keep coming to know many things."],"minutes":1,"words":159},{"title":"The First Principle · Shakti, Chaitanya, Knowledge","paras":["Today let us learn seven principles about this Shakti. The Divine Mother, the Mother of the world, Adishakti, has made herself known in many forms. If we are to say it in scientific language, we call her Shakti. We see the Mother of the world as the form of energy.","Through meditation, Shakti. Through Shakti, Chaitanya. Through Shakti and Chaitanya, knowledge. This is the first principle. Whoever comes into meditation, this is the first thing we say. Meditate. You must fill yourself well with energy. First we invoke the cosmic energy. That cosmic energy flows in us. Once we are in a state free of thought, the Kundalini Shakti hidden within us also awakens. This Shakti comes to us through meditation. Principally, it comes through meditation.","Without this Shakti we cannot even understand Chaitanya. Of this whole creation we say that it arose from the union of Shakti and Chaitanya. We say that the whole creation is the union of Purusha and Prakriti. Prakriti itself is Shakti, that divine power. Chaitanya itself is Purusha. In this way our texts speak in symbols. When the union of Shakti and Chaitanya takes place, from the Ajna chakra, knowledge comes in us. The union of Shakti and Chaitanya is knowledge. This is the first principle. It is a principle everyone can understand.","After a person has come into meditation, this is the first point we give. This is the process that happens in every meditator. First Shakti. That Shakti itself leads toward Chaitanya. Chaitanya means remaining still, always in awareness. It is stillness, absolute stillness. If we look at Ishvara, we understand. Look at Parama Shiva. He is always seated in meditation, perfectly still.","Mother Parvati and Parama Shiva, and the sons of those two, Ganapati and Kumaraswami, are both forms of knowledge. The son of Shiva, born of Mother Parvati. We speak of the sons born to Shiva in this symbolic language, in a way everyone can understand. What we learn here in spiritual science, in the science of the Self, is this. Knowledge arises, knowledge is born, knowledge comes, from the union of Shakti and Chaitanya. Here it is not ordinary knowledge. It is not worldly knowledge. It is parajnana, knowledge belonging to the Self.","We contemplate that as Jnana Subrahmanya and as Jnana Vighneshwara. All of these are symbolic forms. This is the first principle, friends."],"minutes":3,"words":396},{"title":"The Second Principle · Give the Shakti a Direction","paras":["The second. We practise for nine days in these Navaratri days because the flow of that Shakti is very strong. Twice in the year this divine energy moves in this way. These nine days are the Sharad Navaratri, the Devi Navaratri that comes every year in September and October. Once more, in the month of April, with Sri Ramanavami, another Navaratri comes. At both of these times the availability of that Shakti is very great.","The Shakti we are receiving in this Navaratri practice, the Shakti that is being activated still more in us, must be given a direction. We must see in which direction that Shakti goes. Otherwise it is put to good use once, and misused another time. That is why these Navaratri days are here. The direction has to be set.","Let us speak of it as flowing in two directions. The second point is this. When we practise with great care, intensely, with some intensity, that Shakti certainly fills us completely. After it has filled us, setting the direction is the second principle. That energy needs a direction.","A great body of water has gathered in one place. A large reservoir has formed, water from the rain and, in other forms, water that has come from the mountains. However large that reservoir becomes, it must be given a direction. Otherwise, at any time, it can break its banks. There can be a flood. In whichever direction we send it, the Shakti flows that way.","There is a principle. Where attention goes, energy flows. If you have placed your attention outside, this Shakti goes outside. If you have turned your attention upward, it goes upward. If you are brooding, thinking, suffering — my whole life has gone this way, everyone is hurting me, I am alone — it flows in that direction, and all of it intensifies. In whatever direction we send it, the Shakti flows there. Where attention goes, energy flows. This must be set correctly.","We misuse a great deal of it without even knowing, through words, through actions, through thoughts, through our emotions. There are toxic emotions. Without our knowing, in those feelings, we keep wasting our energy, remaining in them. Through our patterns too it is wasted. Patterns mean certain events that keep repeating. We think we do not want them, and yet those situations keep coming. Not knowing how to deal with them, the pattern simply continues. The same pattern. If the direction is not set, the energy also goes that way, everything increases, and the same thing repeats. The Shakti must be put to right use."],"minutes":3,"words":435},{"title":"The Third Principle · Knowledge, and the Work to Be Done","paras":["The third principle. If it goes inward, if it remains inward and moves upward, this Shakti brings the attainment of knowledge. If it is kept outward, it brings success in the work. Through this Shakti, turned upward within, jnana siddhi. Gone outward, karya siddhi.","Hanuman had to wait even before Rama. He had come earlier, and from long before he was waiting for Rama. When the work of Rama came, the direction came. How mighty he is, how full of power. Hanuman means a bundle of energy, energy in full. Even as a child, taking the sun for a fruit, he thought he would eat it and nearly put it in his mouth. That is how powerful he is. But the work of Rama was needed. When he understood — this is the work I must do — because all of this is the life plan of so many, the plan of the soul. If we look at every episode of the Ramayana, the moment the work of Rama came, all the vanaras gathered in one place. Until then they were living in the ordinary way. Sugriva, Nila, and so many stalwarts, warriors. All of them are very strong, very powerful. Anjaneya is no ordinary being. They are very powerful. But the work of Rama — the moment that work came, his whole potential was released. Because there was a direction. That great work had to be accomplished. He could have done it alone. From here he flew, and in one leap he was there. He searched Lanka, found Mother Sita, recognised her, came back, and gave the whole report to Sri Rama. In the war of Rama and Ravana, through the whole Ramayana, the key role is Hanuman’s.","How great the work of Rama is. Sugriva has his role. Nila has his role. Jambavan has his role. All of them needed the work of Rama. There are many spiritual projects now. All of them are works like the work of Rama. Many great projects. They are not for one person to do. Rama could have done it alone. Rama has that much power. But that is not it. These are projects that everyone must do together. A great purpose. A great work. So, gone outward, there is success in the work. Remaining within us, the attainment of knowledge comes.","Both are important. Only when it goes upward within us does the attainment of knowledge come. If we have sent it downward, this energy can be misused. It should not be. When it goes upward, it reaches the Ajna chakra. The knowledge for which we take so many births can be known only while we are living on this earth, while we are in this body. After the body is left, all the knowledge is there. I am the Self. I have left the body. All of that is there. But we must come to know it here, with awareness, while we are in the body. That is the challenge.","So when the Shakti is within, it is the attainment of knowledge. When it has gone outward, a success in work comes to us through this Shakti. Direction is important. In the work to be done there are many kinds of work. Suppose we have placed most of our energy in worldly tasks. Some people are social butterflies. They are always giving parties. Always parties, always boasting, always talk. Everyone together, chatting, and they waste themselves in it. There is no useful talk in it. It is all talk of other people, of people who are not there. Always complaints. Complaints about someone. Judgements. When we speak of another person, we should never speak of someone who is absent in a negative way. Never. If you must speak, speak of their great qualities. There is at least one good quality. We must learn the art of appreciation. In every person there are good qualities. We must learn to appreciate them.","What is misused most is this socialising. Satsang is different. Satsang is not socialising. It has a great purpose. In satsang, everyone learns from everyone. They share all their experience. It creates a great field. So we must set our direction. It is very important. We must not misuse our energy. This is the third principle. If it goes inward, it is the attainment of knowledge. If it goes outward, it is success in the work. And we must also see for what kinds of work we should use our Shakti. We have taken this birth in order to do great work, as Hanuman did, and to leave having done great work. And within, we must gain that great knowledge, the knowledge of the Self."],"minutes":6,"words":785},{"title":"The Fourth Principle · Where the Energy Leaks","paras":["The fourth. Let us take an example, in a symbolic way. A water pipe is blocked. An obstruction has come. What happens there? All that water comes outside. It flows everywhere. Muddy water forms. Everything becomes a mess. We do not like it at all. It happens in our houses. Plumbing work. A plumber has to come and set it right. Within us, too, a great deal of plumbing is needed. We have many blocks in the Shakti.","Chiefly, because of our emotions, some problems come in giving this Shakti a direction. We are carrying chronic emotions. They are not from now. From childhood we have been clinging to one and the same thing. One emotion. One feeling. Let us say fear. That same fear. That same anger. That same sorrow. That same pain. That same depression.","The definition of emotion is energy in motion. Because there is an energy in emotion too. There is a great deal of energy in our feelings. There is a great deal of energy in our anger as well. The direction is different. It goes in another direction. A spiritual researcher set this out in the book Power versus Force, and published the whole inquiry there. It is a great inquiry. It is about measuring the units of these feelings, the units of energy and consciousness, through a test of applied kinesiology, through muscle testing. He discovered some great things. Each feeling has its own energy. Of all of them, gratitude has the greater energy. Gratitude has more units of consciousness. He researched this. We can observe it ourselves. When you are in joy, when you are living with a feeling of gratitude, how are your energy levels? How are your levels of consciousness? How are the levels of your Shakti and your Chaitanya? They are wonderful.","When we are in sorrow, when we are in fear, when a feeling of shame has come, when the feeling has come that I am less, how are our energy levels? As a balloon collapses when a hole comes in it, our energy collapses. Our units of energy are low. We can recognise this. Many of us do not know it. These emotions keep repeating. The same emotions. Through our awareness, through the meditation we are practising, we must be able to recognise these emotions. We must acknowledge them. We must not suppress them. We must not go and project them onto other people.","Many people do not know. They do not know how to deal with them. They suppress the emotions, or they go and project them. Rather than keep it inside, they go and scold someone else. They learned it that way from childhood. They do not know how to deal with these feelings. This is a great energy. There is a Shakti in each emotion. We must see what effect that emotion has on the Shakti. Some emotions deplete our units of energy. Chronic emotions mean what we have been carrying for a long time. Not this birth alone. We have been carrying the baggage of many births. We have brought a bundle. In it there is a great deal of fear. We are afraid of everything. Fear of losing our children. Fear of abandonment, the biggest fear. Everyone will leave me. I will be left alone. Fear of separation. Fear of not being approved. Fear of not being recognised. Or, I am weak. We are carrying so many, a bundle of many births. All of these keep depleting our Shakti.","Now we must recognise where our energy leaks. There is a water tank. A small hole is enough. From that small hole, drop by drop, the whole of it goes, and the tank becomes empty. This is very important. Where is our energy being misused? Where is it wasted? Where does it leak? Recognise it, and at once, with awareness, correct it.","When we understand the emotions rightly, through awareness, the direction is set. That anger itself turns into peace. The anger in us is one Shakti, expressed in many forms. The sorrow we are in, if we give it the direction of a great joy, becomes joy.","A situation has come. A family situation, a hard situation. A great pressure has come into you. You feel pressure. You feel stress. There are always quarrels at home. They quarrel with you. Whatever good you say, your feelings are all good, but everyone misunderstands you. Everything you say is a misunderstanding. Even if you trust, they misunderstand the trust. You think they are laughing at you in mockery. They are smiling in a friendly greeting, but you take them in another way. A situation has come. Many kinds of emotion can arise now. You may suffer. A hurt feeling may come. Why do they misunderstand me? This was not my intention. Why do they think of me wrongly? We suffer.","But some people take it in another way, from another point of view. This birth itself belongs to karma. Without a karma, this birth is not there. I have come to repay certain debts, whatever dues are there. In the family, that is all. The whole account is being cleared. Some people feel it that way. See the way they take it. Their angle of vision has changed, because they are meditating. They have gained Shakti. Chaitanya and knowledge are coming. The eye with which they see has changed. They have set the direction. In which direction does that Shakti go now? All the feelings go in a positive, uplifting direction.","Some emotions we call destructive. Some are constructive, feelings that build us. Love, joy, peace, gratitude, kindness, compassion, enthusiasm, optimism. All of these build us. They support us. They are life-enhancing, life-supporting emotions. Some feelings deplete our energy. They wear it down. They bring it to zero. In one anger, how much we lose. A person practises meditation for forty days. One situation. Anger came. You exploded like an atom bomb. That was all. The whole energy went. The Shakti of those forty days of meditation went. How many times this repeats.","All these emotions are in the subtle, in our mental field, in the field of feeling. If we do not recognise them properly, if we do not acknowledge them, if there is no awareness, if there is no understanding, all of them become blocks. In the field of feeling we make many interpretations. The angle from which we see situations is different. Seeing everything from a limited angle, understanding it as something limited, much fear comes, much sorrow, much pain. But a person of knowledge, a meditator, learns to interpret them in another way. He sees with another eye. If we see with the eye of knowledge, it is wonderful."],"minutes":8,"words":1129},{"title":"The Lotus in the Mud","paras":["To speak of this, a Guru took his disciple to a pond. There was so much mud there. And there some lotuses, these lotus flowers, had opened and were beautiful. Wonderful. A pink lotus, a red lotus, a white lotus, a yellow lotus. So many lotus flowers, wonderful, all through that place. And there was mud everywhere. He asked, what do you see?","The disciple thought, why has the Guru brought me here? What is he showing me? He understood what he was meant to learn. We can put our focus on the mud and think that it is all mud. But we can also enjoy the lotus flower, that wonderfully opened flower pouring out its light, and look at it. The feeling can also arise in us that the lotus came because of this mud. This very mud gave all the nourishment for the lotus to be. Our situations, our hard situations, the stressful situation, have moulded us, shaped us, and made us, wonderfully, into people of knowledge. We become able to appreciate that."],"minutes":1,"words":175},{"title":"Fully Appreciating Awareness","paras":["This is called fully appreciating awareness. This is the eye of knowledge. With the eye of knowledge, everything becomes appreciation. If we can see every situation with a great eye of knowledge, in that very moment the places where this Shakti was obstructed, where the flow of Shakti was blocked, the energetic blockages in us, begin to clear.","For many people now there are blocks in the Anahata chakra, because they keep every single hurt here. They say, let me keep all the pain in the heart, and they keep it all in the heart. Rejection. Loss. They went away from me. A very severe pain has come. They keep it in the heart. There is a problem in the Anahata chakra. For some people it is a problem of expression, a problem of communication. For some, all the energy blockages are in the Manipura chakra. For some, in Svadhisthana. For some, in Muladhara.","When the eye of knowledge comes, wherever the energy is entangled, wherever the energy is not flowing, where a pipe has become blocked, the plumbing is done. Now we ourselves are that plumber. We are the plumber internally. We give the direction again. Seeing with the eye of knowledge, we unblock the energy that was emotionally entangled there. We remove it. It goes. That is why, while we are meditating, Shakti comes, and that Shakti flows strongly, a wonderful energy, a wonderful current. At a certain stage, first there is inner purification, purification of the field of the nadis. It certainly happens. It happens in every person. Only through this Shakti does the purification of the nadis happen. Only after this has happened do we cross Vishuddha and enter the Ajna chakra.","Vishuddha means a great purification, a special purity. Here a greater understanding happens. A power of great understanding comes in us. Each energy block that has formed in us must be finished in this purification of the nadis and the mind. Seeing with the eye of knowledge sets the direction. For many people, while the field of the nadis is being purified, much pain comes. The software of interpretation that is loaded here, the lens through which we see, makes us feel: what a great sinner I am, what wrongs we have done, how many karmas of wrong there are, when will I ever come out, perhaps I never will, I am a great sinner. We feel in this way. Our angle of vision makes that pain come severely. For some people, much pain comes in meditation. Much pain comes in the body, like labour pains, at the various chakras, at the places where the energy is blocked. Among the seventy-two thousand nadis, blocks can be anywhere, because each person’s life is different. Our challenges are different. Our situations are different. All those blocks are there.","We know what is happening inside, in our inner world. If we see with the eye of knowledge, the moment that knowledge has reached us, the moment the angle from which we see this block has changed, the block is cleared. Otherwise we stay stuck right there. A breeze of knowledge comes. We call it an insight. Looking outside, what comes is an external sight. Insight is what comes when we look into ourselves. An insight is a ray of knowledge, a great knowledge. We become able to see the situations of our life from another angle.","Suppose there is a building of seven floors. Seen from the ground floor, it is all right. Go to the first floor and look, and it is another way. The second floor. The third. We have gone up to the seventh floor. Seen from the seventh floor, from another angle, everything is very beautiful, and we appreciate it. We very much like to be in the penthouse. Many people like to go up and look. However high we keep looking, the angle of seeing from above is that vast, that wide. We are able to see that well. We call it the big picture. Or else it is a narrow picture. If we keep looking from a narrow, contracted feeling, from that angle, everything looks narrow. Everything looks like trouble. Everything looks like a problem. Seen from above, we gain that wonderful eye of knowledge.","Friends, we are speaking of the quality of tamas and the quality of rajas. In these Navaratri days, Mahishasura, Shumbha, Nishumbha, Chanda, Munda, Dhumralochana, Raktabija, and so many asuras. All of them are nothing but tamas and rajas. These defects are being expressed in many ways. That is all. The asuras are conceived here in symbolic form."],"minutes":6,"words":771},{"title":"Durgamasura and Shakambhari","paras":["In the same way, we should also speak of another asura. His name is Durgamasura. Durgamasura too was full of tamas. It is said that he hid all the Vedas. He harmed them so that they were no longer with anyone. This must be understood in its symbolic form. Veda itself means knowledge. If there is no knowledge, there is only ignorance. Fear comes. Sorrow comes. The nature of knowledge is this. From knowledge comes joy. If we have gained knowledge, joy comes. If we have gained knowledge of the Self, the bliss of the Self comes. If we have gained the supreme knowledge, supreme bliss comes. If we have gained the knowledge of Brahman, the bliss of Brahman comes. As much knowledge as we have gained, that much joy. As much ignorance as there is, that much sorrow in our life.","This Durgamasura carried off all the Vedas. No one knew what he had done with them. Then what was the effect of Durgamasura on the earth? Famine came. Not one crop. Not one fruit. No plants. Nothing. Drought and calamity. Everyone was in sorrow. At that time, from this divine Shakti, from Mother Durga, she who is called Shakambhari took birth and came forth. Seeing this sorrow, tears came from her. We call it empathy. Someone speaks, and a response comes in us too. Seeing their difficulty, a response comes, and water flows from our eyes. For that Mother too, how dear children are. How much love, how much compassion. This love fell down in the form of tears. At once, vegetation came there. Branches, vegetables, fruits, and many great trees that give fruit. All of this came, and everyone was able to raise crops in plenty. The slaying of Durgamasura also took place. Many asuras are spoken of in this way.","In these Devi Navaratri days we read all of this. Ordinarily we keep telling them as stories. Vedavyasa has made all of this known to us, wonderfully, in symbolic form. A great symbolic language. All of this is not only the outer meaning. The inner meaning must be taken. It is all the victory over tamas and rajas. Sattva too must be crossed. The defect of sattva must also be crossed. Crossing these three qualities is the Navaratri practice that is taught here.","Only through the practice of meditation. Through the qualities of rajas and tamas, through these defects, there are many blockages in us now. There the Shakti leaks. It goes by a crooked path. The practice we are doing, meditation in particular, and this Navaratri practice too, is done intensely for this reason. By setting our own direction, there is success in the outer work, and inwardly there is the attainment of knowledge. In knowledge too there are many steps. Many attainments of knowledge. We must go from one level to another. Knowledge too is endless, and we must keep learning it."],"minutes":3,"words":488},{"title":"Mother Nature, and Our Own Mother","paras":["Friends, yesterday we spoke of this Prakriti, of Mother Nature. That divine Shakti appears to us here as Mother Nature. We should not see this Nature merely as nature. We should feel this Nature as the reality of the Supreme. The Mother of the world has filled this whole creation, as this tree, as the animals. We must be able to see with that feeling. We said it yesterday. However close our bond with our own mother is, that close we are able to go to the Mother of the world. We are able to take that Shakti to that extent. That connection is formed. The connection with Mother Devi, with that Shakti, with Mother Durga, is built in us.","How can we receive that Shakti? The feeling we have when we are near our own mother is the same feeling toward this Shakti. What is in the gross is also within. What is outside is also within. What is in the gross world is also happening in the subtle world. It is the same in the causal world.","That is why there is a question for all of us. It is about our bond with our mother. Suppose your mother is near you now. She may be in the body, or she may have left the body. If you think once about your connection with her, with your biological mother, how much distance is there between the two of you? Do you feel very close to her, or is she very far, and are you unable to connect? What are your judgements? There are many judgements of our mother. We judge her a great deal. Where there is judgement, we become separate. We go far. If we do not accept even this mother, where else will we accept that mother, the Mother of the world? First we must be able to accept this mother, our own mother.","Wherever there is a block, you feel a great distance between you and Amma. It is an emotional distance. Physically you may be in the same house. You may be speaking, and speaking well. But inside, you and your mother feel far, very far. It is not about the physical distance. Many people are very near. They speak every day. They meet every day. They live in the same house. You live with your mother. And still a great distance from Amma comes over you."],"minutes":3,"words":403},{"title":"A Practice · Meeting Your Mother","paras":["So let us do a process. It is a small process, but it is very useful. Useful for everyone. Sitting at ease, we are going to do this process in three stages. Sit peacefully in a steady posture. Let us feel that our mother, the mother who gave us birth, is near us. A few feet away from you. Let us feel that she is standing there. Feel that you are in front of her. In her presence, your biological mother, the mother who gave you birth, how are you feeling? What kinds of feeling are arising in you? Do you feel a connection with her, or do you feel far away? Is there a wish to go near Amma, or a wish to move away? Recognise it. We must recognise the feelings inside us.","First, with our mother, this biological mother, there is a connection from the navel. From our very birth. While we were in that mother’s womb, there was a connection at the navel, the connection of the umbilical cord. Through that cord, nourishment came, all the nourishment we needed, from that mother. Do you feel that connection of the cord with this mother? She may be in the physical body, or she may not. She may have left the body. Think once about your connection with your mother.","If it is difficult to see her face clearly, see a beam of light as a symbol, or see her symbolically. Because when we think of our mother, her form appears to us at once. We have a vision of her. Our mother’s form becomes visible to us. Now change the eye with which you are looking, a little. All through childhood there may have been many judgements in us. There may have been some gaps. Our distances may have grown. We may have been looking with the eye that says this mother knows nothing, that there is no knowledge. We may have been making some judgements of our mother. I am a meditator. My mother does not do it properly. My mother does not know. We may have been feeling her to be ignorant. But now, see your mother as a soul.","See the mother who was once a little girl, then a young woman, who in her life faced many limits, many challenges, who received some wounds, who received fears, who also met many difficulties. See her as a soul. In your mother too, she has faced many problems. From her childhood she has been according to the design of her life. She is as she is according to the plan she designed and came with, the plan of the soul. See the great Shakti in her. Now behold the great power that is in that mother. When we see the soul as a soul, we understand.","From your heart, form a connection with your mother. Not only from the navel now. Through your heart, from your heart to Amma’s heart, a ray of light, a fine bond. Feel the two of them forming like a bridge. Some bitter memories of what happened in the past. Some disappointments in you. Your expectations. There may be many expectations of your mother. At this time, seeing completely with the eye of the soul, with the eye of knowledge, keep saying this inwardly to your mother.","Amma, you gave me the highest gift on this earth, the gift called birth. Only through you did I set foot in this world. For that I am grateful to you all my life. Amma, seeing you with a limited eye, I also made some judgements. I looked with the feeling that you know nothing, that you are very small. I felt myself to be much bigger than you. But I am always, before everything, the smaller one. Now behold Amma greatly, as a soul. Shakti, Chaitanya, and knowledge. All three are in that mother.","Without your knowing, you have also taken many weights from your Amma. You took her emotions. You took her fear. You took some of her patterns. Now give them back to Amma herself. Whatever you took from her, whatever you downloaded, the fears, the emotions, her sorrow, none of these are yours. Amma gives back to you the Shakti that belongs to you, and takes back the Shakti that belongs to her. Honour this journey of life, and go forward on your own.","Now, feeling a golden light radiating through you, recognise that this light is melting the anger and the pain between the two of you, and leaving only love, a love without conditions, and freedom. Now see, on the face of that mother, a peaceful smile."],"minutes":6,"words":780},{"title":"A Practice · The Mother of the World","paras":["Now, just behind your mother, there is a great empty space, filled with a wonderful, divine light. Behind her are your grandmother, your father’s mother, and so many ancestors. And behind them is the Mother of the world. The Shakti that made this whole creation. The mother of everyone. The mother who created all souls. That very Mother of the world. Durga, Lakshmi, Saraswati. The mother who nourishes every living being in this creation. In her eyes is infinite compassion and love. The gaze falling from her upon you melts even the last pain remaining in your heart.","Go into her lap. Feel that you are going into the lap of the Mother of the world. If she is in a form, see that form. If not, feel her as light. Feel her as a radiance. Feel that the mother, the Mother of the world, has gathered you into her arms with her divine hands. Feel that you are completely safe in her lap.","Now listen to what Amma is saying. The Mother of the world says: O my beloved child, I have always been with you. I was there in the darkness before you were born. Now, in your every breath, I am there. Your birth mother is only a doorway. She is the doorway I chose in order to bring you, my creation, into this physical world. You never have to prove that you are worthy in order to receive my love. You do not have to be perfect in order to receive my protection. Lay at my feet every wound that has touched your inner being. Let me heal you with my love.","Now feel a light, rose-coloured and gold together, flowing like a liquid from the heart of the Mother of the world, straight into your heart. That divine light fills every emptiness, every lack, formed in your mind by human limits. Receive the feeling that this whole creation loves you beyond measure. For a few moments, remain peacefully in that divine light, in Amma’s lap. Notice your heart becoming vast. Observe it. In this stillness, for about two minutes, notice whatever insights are coming to you, whatever rays of knowledge.","Wonderful, friends. Slowly, slowly, come back outside, into the waking state. Our connection with our mother is very important. Whatever distance we have with our mother, that same distance is there too. If we set it here, we are near the Mother there. We go still closer."],"minutes":3,"words":412},{"title":"Devi Samarpan · Bowing Down","paras":["Friends, now let us bow down to that Mother. This is the Devi Samarpan we do each day. Today is the last day. Tomorrow is only the celebration. How we do it is this. We take the Lakshmi mudra. If we place the left foot over the right foot, it gives more place to Shakti. Then we close the right nostril, and through the left nostril, our Chandra nadi, we take nine breaths inward. Nine inhalations. Take them slowly. Do not draw too much in. Then we hold, in a namaskara mudra. Leave a little gap. Hold, with one feeling. The feeling of surrender. Sharanagati. Bowing down. The feeling that before that Mother we are always little children. Let us bow down, and bow down by dropping our arrogance, the ego.","To drop all of that, bend the head completely down, as far as you are able, until it touches, and hold there. Hold the breath, and nine times, inwardly, we repeat Shreem. Shreem, Shreem, Shreem, Shreem, Shreem, Shreem, Shreem, Shreem, Shreem. Nine times we pronounce it within. During this time, let us feel that we are offering in this way both to our own mother and to the Mother of the world. Then, in the natural way, we bring the cells back to their own state. Let us do it nine times, friends. Those who still have it to complete, please continue.","The feeling is important. The feeling of offering. The Mother of the world is in us as Shakti. We must connect with that Shakti. It must be a complete surrender. Through Harika Madam, let us listen to a beautiful hymn of this Devi Shakti, the Mother of the world."],"minutes":2,"words":282},{"title":"Durga Saptashloki","paras":["Harika Madam then sang the Durga Saptashloki. Shiva asks the Devi, who is easy for the devotee to reach and who accomplishes every work: in this age, tell me carefully the means for the work to be fulfilled. Devi answers: listen, and I will tell you the means by which every wish is fulfilled in this age. Out of my love for you, this praise of the Mother is revealed. The seer of the hymn is Narayana. The metre is anushtubh. The deities are Mahakali, Mahalakshmi, and Mahasaraswati. It is recited for the pleasure of Sri Durga.","The knower’s mind too is drawn by force and bewildered. She, the Devi, the Blessed One, Mahamaya, is the one who does this.","Remembered as Durga, you remove the fear of every living being. Remembered by those who are well, you give a mind, and great good. Who but you takes away poverty, sorrow, and fear? Your heart is always tender for the good of all.","O you who are the auspiciousness of all that is auspicious, the consort of Shiva, who fulfil every aim, the refuge, the three-eyed Gauri, Narayani, salutations to you. O you who are devoted to protecting the afflicted who have come for refuge, who remove the suffering of all, Devi, Narayani, salutations to you. O you who are the form of all, the ruler of all, endowed with every power, protect us from fears, Durga, Devi, salutations to you.","When pleased, you take away every disease. When displeased, you take away every desire that was longed for. Those who have taken refuge in you do not come to ruin. Those who take refuge in you themselves become a refuge. O ruler of all the three worlds, the pacifying of every affliction, and the destruction of what stands against us, must be accomplished by you in this way.","This is the Durga Saptashloki. Thank you, Harika Madam."],"minutes":2,"words":318},{"title":"Questions · Pilgrimage and the Journey Within","paras":["Thank you. Wonderful, friends. Let us take a few sharings. Last, Sri Lakshmi spoke. Thank you, Sir, for giving me the chance. I am connecting on YouTube today. I came into Zoom only today. I have also come to Quantum Life University once, and I met you once. I also took a personal session with Harika Madam. It was very good. I am still doing what Madam taught, and I am also clearing my emotional blockages.","I have a question. You once said that if we place our attention on the breath, liberation comes in the subtle. That settled in me so deeply. After that, many times, a chance came to go with some friends on the Char Dham, and to Manasarovar. But what I felt was this. Liberation is here. When Shiva and Shakti are within us, is there a need for us to go all the way there? You also said that we should connect with the energies by going to the great Shakti pithas, by going on such a pilgrimage. Sir, I have a doubt. If we stay at home and do this practice, if we keep connecting with our own Shakti, how necessary is that?","Very good, Madam. You have asked a good question, because many people have this doubt. Many people keep going on pilgrimages. A great many pilgrimages. There is nothing wrong in saying, go and bathe in the Ganga. If one is able to go, if it feels right, if all the means are there, one may go and do all of it. But the greater practices must be done there. One must meditate. And without going on any pilgrimage, staying in our own house, everything is available. This inner pilgrimage is a journey we make within. On this journey too, everything comes to us wonderfully.","Once, the whole war was over. The Mahabharata war was finished. The Pandavas planned a pilgrimage. Krishna is their kin, the Supreme. They invited him too. Please come on the pilgrimage. Krishna said: I have many appointments. I have some commitments. You go. But I will give you one thing as my symbol. I will give you a bottle gourd. Take the gourd with you. Wherever you go on this pilgrimage, immerse this too in the river, and bring it back. Their journey was forty days. After forty days they would return. Bring it back, he said. Wherever you worship, place the gourd there. Do it feeling that I myself am there. They did exactly this. They went, taking the gourd. They immersed it everywhere as Krishna. Wherever there was worship in the temples, wherever there was practice, they placed it there too.","Then they came back. Dharmaraja asked: Krishna, what should we do now? What will you do with the gourd? He said: cook a meal for everyone. Invite everyone in the town, and serve them a proper meal. They made sambar with that gourd. They cooked. And everyone vomited. All the Pandavas asked, how did it happen like this? This gourd came with us on the pilgrimage. It is sacred. Why has it made everyone vomit? When they went to Krishna to report, he was laughing. In that very laughter they understood. Through the pilgrimages, nothing changed even in the gourd. What change comes in a person? People wander about outside. They go here and they go there. When they bathe in the Ganga, the sins do not leave. However many bathe, nothing happens. All those ghosts called sins stay right there, and catch hold of them again.","There is nothing wrong in it. If one is able to go, it is excellent to go and practise. The main thing is the practice. For this great meditation there are fine experiments. It can be done sitting in our own house. Liberation in the subtle. We said this one day. This very body is the city of Kashi. This is Manasarovar. This is Mount Kailasa. Every Jyotirlinga is within us. Every place of Shakti is within us. And these outer places should not be made less of either. They are wonderful. Once, we were taking classes in Tamil Nadu. There I heard of Mother Kamakshi of Kanchi, and I felt I must go. We went to Kanchi. Adi Shankaracharya also did a process there. The divine Shakti in that place was so intense that people could not bear it. He made a shield. In many places he lessened the intensity of that Shakti for everyone and made a shield. Only sadhakas are able to receive it.","When we go there, we practise in the ordinary way. The moment we sat down in meditation, the Shakti was such that she appeared in the form of the Mother. She came together with a parrot. There is a parrot. She came with the parrot as her vehicle. She came seated on the parrot, a great form, and she asked me to sit with her too. This is an experience of knowledge. It is an experience that happened in the subtle. We should understand it as a symbol, in its symbolic form. She showed many things. It was a wonderful experience. After that, when the eyes were opened, I had never known much about her. A longing arose to know a little. We came out and were looking at everything. There are parrots everywhere there. There are many parrots in that temple. Then, coming outside, all the pictures were visible. In all those pictures there is a parrot beside her. Then I read her book. It is written there that sages and yogis remain near her in the form of parrots, near the Mother of the world, near Mother Kamakshi of Kanchi. I did not know this. I did not know that the parrot is her vehicle. I did not know that the parrots are there. But experiences of this kind do happen.","Whenever one goes, these great and wonderful fields of Shakti — Srisailam, where the Mother of the world is present as two, in the reality of Ardhanarishvara — and so it is in many places. All of this is wonderful. If one can go, it is wonderful. But all of this is also within us, inwardly, in the subtle. Everything is there. We must not forget this and do only the other. It will not do. We must gain this within.","Lakshmi said: when we go, we should meditate there and connect with the energies. If we meditate, that is enough. We should sit in a state free of thought, in inner silence. The vibration that is there, that whole field, helps us. The meditation we do ordinarily and the meditation we do in a pyramid are different. The Shakti is different, a wonderful Shakti. A pyramid itself is the Sri Chakra. A pyramid itself is Mount Meru. It is like meditating upon Mount Meru. A temple is the same. All of these are places of Shakti. In every temple there is a prana pratishtha. There is a great architecture. There is a sacred geometry. The sanctum itself is in the form of a pyramid. There is a wonderful science behind this. When you go, meditate well. Sit in a state free of thought. That is all. There is no need to visualise the form of the deity. Whatever is meant to come in that place will come to us. Experiences will be given. All the best.","She asked one more thing. On the 24th and 25th there is a workshop for doctors. May Ayurvedic physicians also come? Ayurveda, naturopathy, acupuncture — anyone may come. Anyone. Because we want the many people who are in the medical field to know this approach as well. Spiritual birth, pregnancy. There are so many caesareans, so many kinds. This method, from the spiritual angle too, spiritual healing. It is in order to give them this understanding that we are holding these two days for them. So invite all of them. They may come. Thank you.","A chance was then given to those who are new, who have never spoken. Vanajakshi garu, please speak now. Namaskaram, Sir. Namaskaram, Madam. Your hand is in the way, and you are not visible. Please come a little nearer to the camera. Now you are visible. Vanajakshi, please tell us.","She said: we come for meditation. I am doing it every day. My attention itself is on meditation. I like it very much. Today I wanted to speak with you, and with my son beside me. Very good, Amma. You said you like meditation very much. Those who like it are very dear to Sri Krishna. And then, very dear to the Mother of the world. Whoever is in meditation, whoever practises meditation, is, it is said, very dear to Shiva. How much you like it. You are practising so well. Wonderful, Amma. Thank you. All the best."],"minutes":11,"words":1483},{"title":"Questions · Health and a Repeating Illness","paras":["Prarthana garu. Namaste, Sir. Good morning. Happy Navaratri. Thank you, Amma. One question. I am actually in the practice of meditation. I am doing it all well. Even so, health issues keep coming repeatedly. You said that health is a lesson. But I am not able to understand what lesson it has come to teach.","Some karmas are long-standing. We should know that whatever has been troubling us for a long time belongs to karma. Karmas are lessons. We have understood karma as training. They are not there to punish us. They are not there to hurt us. They are training. What is to be learned from them must be learned. They teach us certain things. Until we have learned them, we must be patient for a while. The feeling to hold is this. Whatever is there is being washed away. It is leaving me. I let go. Whatever belonged to a past birth, whatever had grown large, is leaving through these symptoms. Then let your whole attention be a focus on joy. Practise joy. Be joyful in every moment. To live contented, we must remain immersed in that every moment. Be aware every moment. Keep practising it, Amma.","She said: for two years I am well, and every two years it returns. For girls there is the menstrual cycle, and there is PCOD. I am suffering in that matter. You should address this a little further with someone’s help, in the way of counselling. These are matters of the feminine. There are blind spots. We cannot see some things ourselves. Which lessons they are. When others, seniors, hold the space, when the stage is held, we become able to recognise them. Take that help and support. Wonderful, Prarthana garu. Thank you."],"minutes":2,"words":292},{"title":"Closing · Vijayadashami, and Meeting Again","paras":["It is half past seven. Tomorrow is the Vijayadashami celebration. At that time let us share all the rest. There is much to share. As part of tomorrow’s celebration, let us share. Thank you so much, Sir, for the time, for everything.","Friends, let us meet tomorrow morning at five. And in person, on the 24th and 25th, there is also the One Maitriya programme. On that day let us all meet here at Quantum Life University. Sir and Madam will be present. To be here in their presence, in that energy, to meditate, to connect with the plants in the gardens. It is a great opportunity. Do not miss it.","And the celebration of Dr. Newton’s birthday, and the annual day of Quantum Life University, falls this time on 24 November, on Kartika Purnima. On that day, at Quantum Life University, let all of us hold a Jnanodayam reunion. It will be an amazing opportunity. All of us should meet in person. This is an invitation to everyone who attends Jnanodayam, and to every person you know, your friends. Anyone may come. You are most welcome.","Thank you so much. And let us meet tomorrow morning."],"minutes":1,"words":197}];
