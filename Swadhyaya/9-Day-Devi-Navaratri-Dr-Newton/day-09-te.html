పుకోవడం ఇవన్నీ చేయాలి ప్రతి సంవత్సరం చేస్తుంటాం. సో ఎన్నో విషయాలు తెలుసుకుంటూ ఉంటాం ఎప్పుడు ప్రతి సాధనలో ప్రతి ధ్యాన సాధనలో ఎన్నో విషయాలు తెలుసుకుంటాం."],"minutes":1,"words":78},{"title":"మొదటి సూత్రం: శక్తి, చైతన్యం, జ్ఞానం","paras":["ఈ శక్తి గురించి ఒక ఏడు సూత్రాలు తెలుసుకుందాం ఈరోజు ఈ దేవీ శక్తి గురించి డివైన్ మదర్ ఆవిడ జగన్మాత ఆదిశక్తి ఎన్నో రూపాల్లో తను తాను ప్రకటించుకుంది. మన సైంటిఫిక్ టర్మ్స్ లో చెప్పుకోవాలంటే సైన్స్ భాషలో చెప్పుకోవాలంటే వారినే మనం శక్తి అంటాం. ఆ జగన్మాతని శక్తి రూపంగా మనం చూస్తాం. సో ధ్యానం ద్వారా శక్తి శక్తి ద్వారా చైతన్యము శక్తి చైతన్యముల ద్వారా జ్ఞానము మనకు లభిస్తుంది అనేది ప్రథమ సూత్రం ఇది ఎవరు ధ్యానంలోకి వచ్చినా కూడా ఫస్ట్ ఇదే చెప్తాం మనం ధ్యానం చేసుకోండి బాగా మీలో శక్తితో నింపాలి నింపుకోవాలి మిమ్మల్ని మీరు విశ్వశక్తిని ఫస్ట్ మనం విశ్వశక్తి ఆవాహనం ఆ విశ్వశక్తి మనలో ప్రవహిస్తుంది. ఎప్పుడైతే ఆలోచనా రహిత స్థితిలో ఉంది తర్వాత మనలో అంతర్గతంగా దాగి ఉన్నటువంటి కుండలిని శక్తి కూడా జాగరణ అవుతుంది.","ఈ శక్తి ధ్యానం ద్వారానే మనకి లభిస్తుంది. ప్రధానంగా ప్రధానంగా ధ్యానం ద్వారానే లభిస్తుంది. ఈ శక్తి లేకపోతే మనం చైతన్యాన్ని అర్థం చేసుకోలేము కూడా ఈ సృష్టి అంతా కూడా మనం ఏమని చెప్తాం అంటే శక్తి చైతన్యముల కలయకతోనే ఏర్పడింది ఈ సృష్టి అని మనం చెప్తుంటాం. సర్వ సృష్టి అంతా కూడా శక్తి చైతన్యముల కలయకే పురుషుడు ప్రకృతి ప్రకృతి పురుషుడి యొక్క కలయకే ఈ సృష్టి అంతా అని అంటాం. ప్రకృతి అంటేనే శక్తి ఆ దివ్య శక్తి ఆ చైతన్యం అంటేనే పురుషుడు ఈ విధంగా మనం సంకేత రూపంలో మాట్లాడుకుంటూ ఉంటాం మన గ్రంథాల్లో అన్నీ కూడా ఎప్పుడైతే శక్తి చైతన్యల కలయక జరుగుతుందో అజ్ఞా చక్రంలో అక్కడి నుంచి మనలో జ్ఞానం అనేది వస్తుంది. ఈ శక్తి చైతన్యముల యొక్క కలయకే జ్ఞానం ఇది మొదటి సూత్రం ఇది ప్రప్రధంగా అందరూ కూడా అర్థం చేసుకునే సూత్రం ఇది ధ్యానంలో వచ్చిన తర్వాత ఫస్ట్ మనం ఇదే చెప్తాం ఈ పాయింట్ ప్రతి ధ్యాన సాధకుడిలో జరిగే ప్రక్రియే ఇది ఫస్ట్ శక్తి ఆ శక్తే చైతన్యం వైపు తీసుకెళ్తుంది చైతన్యం అంటే తను నిశ్చలంగా ఉంటూ ఎప్పుడు చేతనత్వంలో ఉంటుందంట ఆ చైతన్యము స్టిల్నెస్ అబ్సల్యూట్ స్టిల్నెస్ ఆ ఈశ్వరుని చూస్తే మనకు అర్థమవుతుంది.","పరమశివుని చూస్తే ఎప్పుడు ధ్యాన స్థితిలో నిశ్చలంగా కూర్చుని ఉంటారు నిశ్చలంగా ఉంటారు ఈ పార్వతీ మాత పరమశివులు వారిద్దరి పుత్రులైనటువంటి గణేష్ మహారాజ్ గణేశుడు కుమారస్వామి వారిద్దరు కూడా జ్ఞాన స్వరూపులు ఆ శివపుత్రుడు పార్వతీ మాదికి మరి పుట్టినటువంటి వంటి శివుడికి పుట్టినటువంటి పుత్రుల కింద సంకేత రూపంలో ఆ భాషణ మాట్లాడుకుంటాం అందరికీ అర్థమయ్యే రీతిలో ఇక్కడ మనం స్పిరిచువల్ సైన్స్ లో ఏం నేర్చుకుంటాం అంటే ఈ ఆత్మ విజ్ఞాన శాస్త్రం ఆధ్యాత్మిక శాస్త్రంలో ఈ శక్తి చైతన్యముల యొక్క కలయక వలనే జ్ఞానం ఉద్భవిస్తుంది జ్ఞానం పుడుతుంది జ్ఞానం వస్తుంది పరాజ్ఞానము ఇక్కడ జ్ఞానం కాదు లౌకిక జ్ఞానం కాదు పరాజ్ఞానం ఆత్మకు సంబంధించిన జ్ఞానం వస్తుంది. దాన్నే మనం జ్ఞాన సుబ్రహ్మణ్యుడు జ్ఞాన విఘ్నేశ్వరుడు రూపంలో మనం భావన చేస్తాం. సంకేత రూపాలు ఇవన్నీ కూడా ఇది"],"minutes":2,"words":339},{"title":"రెండవ సూత్రం: శక్తికి సరైన దిశ","paras":["మొదటి సూత్రం ఫ్రెండ్స్ రెండవది ఈ నవరాత్రుల్లో మనం సాధన చేస్తున్నాం తొమ్మిది రోజులు ఎందుకంటే ఆ శక్తి ప్రవాహం చాలా ఉదృతంగా ఉంటుందంట ఆ దైవిక శక్తి సంవత్సరంలో రెండు సార్లు ఈ విధంగా జరుగుతుంది. ఈ తొమ్మిది రోజులు శరణ నవరాత్రులు సెప్టెంబర్ అక్టోబర్ లో వచ్చే ప్రతి సంవత్సరం వచ్చేటటువంటి దేవీ నవరాత్రులు మరి ఇంకొకసారి మళ్లా ఏప్రిల్ మాసంలో శ్రీరామనవమి అప్పుడు వచ్చేటువంటి నవరాత్రులు ఈ రెండు కూడా ఈ నవరాత్రుల సమయంలో చాలా అద్భుతంగా ఆ శక్తి అవైలబిలిటీ చాలా ఎక్కువగా ఉంటుంది ఈ నవరాత్రుల సాధనలో మనం మనం ఏ శక్తినైతే పొందుతున్నామో ఏ శక్తి అయితే మనలో ఇంకా ఎక్కువగా యక్టివేట్ అవుతుందో ఒక డైరెక్షన్ సెట్ చేసుకోవాలి. మనం ఏ డైరెక్షన్ లో ఆ శక్తి వెళ్తుందో చూడాలి ఒకసారి సద్వినియోగం కాను దుర్వినియోగం అవుతుంది శక్తి అందుకే ఈ నవరాత్రులు కూడా ఉన్నది.","దాన్ని సెట్ చేసుకోవాలి డైరెక్షన్ రెండు డైరెక్షన్లో ఫ్లో అవుతుందని మనం మాట్లాడుకుందాం ఒక క్లాస్ లో సో రెండవ పాయింట ఏదైతే మనం ఇంటెన్స్ గా చాలా శ్రద్ధతో తీవ్రంగా అంటే కొంత ఇంటెన్స్ గా మనం సాధన చేస్తామో కచ్చితంగా ఆ యొక్క ఆ శక్తి మనలో ఫుల్ గా నింపుకుంటాం ఫుల్గా నింపబడుతుంది తర్వాత డైరెక్షన్ సెట్ చేయడం రెండో సూత్రం ఒక దిశ ఆ శక్తికి కావాలి ఇప్పుడు ఒక దగ్గర చాలా వాటర్ బాడీ ఏర్పడింది. పెద్ద జలాశయం వచ్చేసింది అక్కడ నీరు వర్షం ద్వారాను వేరే రూపాల్లోనూ పర్వతాల నుంచి వచ్చినటువంటి నీరు ఒక పెద్ద జలాశయంగా ఏర్పడింది. సో ఆ జలాశయము ఎంత పెద్దగా అవుతుంది అంటే దాని డైరెక్షన్ ఇవ్వాలి. లేకపోతే ఎప్పుడైనా అది కట్టలు తెంచుకోవచ్చు. ఫ్లడ్ కావచ్చు ఏమనా కావచ్చు ఏ డైరెక్షన్ లో మనం వేస్తే ఆ శక్తి ఆ విధంగా ఫ్లో అవుతుంటుంది.","ఒక సూత్రం ఉంది వేర్ అటెన్షన్ గోస్ దేర్ ఎనర్జీ ఫ్లోస్ మన ధ్యాస ఎక్కడ పెడితే శక్తి ఆడ అక్కడికి వెళ్తుందంట మీ ధ్యాస బాహ్యంలోకి పెట్టారు అనుకోండి ఈ శక్తి బాహ్యంలోకి వెళ్తుంది. ఈ శక్తి మీ ధ్యాస ఊర్ధముఖంగా పెట్టారు ఊర్ధముఖంగా వెళ్తుంది. ఈ శక్తిని మీరు ఏదో చింతన చేస్తున్నారు ఏదో ఆలోచన చేస్తున్నారు ఏదో బాధపడుతున్నారు ఆ డైరెక్షన్లో ఆ జాస మీరు అక్కడ పెట్టారు. నా జీవితంంతా ఈ విధంగా అయిపోయింది. అందరూ నన్ను బాధ పెడుతున్నారు నేను ఏకాకిని ఆ డైరెక్షన్ లో ఫ్లో అవుతుంది అయన్నీ ఇంటెన్సిఫై అవుతాయి మొత్తం మనం ఏ దిశలో పంపిస్తే ఆ శక్తి అది అక్కడ ఆ డైరెక్షన్లో ఫ్లో అవుతుంది. వేర్ ఎనర్జీవర్ అటెన్షన్ గోస్ దర్ ఎనర్జీ ఫ్లోస్ దిస్ సెట్ చేసుకోవాలి కరెక్ట్ గా చాలా దుర్వినియోగ పరుస్తుంటాం మన తెలియకుండానే మాటల ద్వారా చేతల ద్వారా ఆలోచనల ద్వారా మన భావోద్వేగాల ద్వారా కొన్ని టాక్సిక్ ఎమోషన్స్ అని ఉంటాయి మనకు తెలియకుండానే భావావేశాలు ఎన్నో భావావేశాలు ఆ భావావేశాల్లో మన శక్తినంతా కూడా కొంత వేస్ట్ చేసుకుంటూ ఉంటాం దానిలోనే ఉంటూ దానిలోనే ఉంటూ దానిలోనే పాటర్న్స్ వలన కూడా వేస్ట్ అవుతుంటుంది మన పాటన్స్ అంటే పునరావృత్తం అవుతున్నటువంటి కొన్ని సంఘటనలు మనం వద్దుఅనుకుంటాం ఆ పరిస్థితులన్నీ వస్తూ ఉంటాయి కానీ దాన్ని ఎలా డీల్ చేయాలో తెలియక ఆ పాటర్న్ అలానే కొనసాగుతూ ఉంటుంది అదే పాటర్న్ అదే పాటర్న్ సో దిశ సెట్ చేసుకోకపోతే ఎనర్జీ కూడా ఆ డైరెక్షన్ లో వెళ్లి అన్నీ కూడా ఎక్కువ అవ్వడం అదే థింగ్ అదే పునరావృతం అవుతుంటుంది. సద్వినియోగ పరుచుకోవాలి శక్తిని"],"minutes":3,"words":398},{"title":"మూడవ సూత్రం: జ్ఞానసిద్ధి మరియు కార్యసిద్ధి","paras":["సో మూడవ సూత్రం అంతరంలోకి వెళితే అంతరంలో ఉంటే ఉర్ధ్వముఖంగా వెళ్తుంది ఈ శక్తి బాహ్యంలో ఉంచితే ఈ శక్తి కార్యసిద్ధి లభిస్తుంది. అంతరంలో ఉంటే ఉద్ముఖంగా వెళ్లి జ్ఞాన సిద్ధి లభిస్తుందంట. ఈ శక్తి ద్వారా జ్ఞాన సిద్ధి బాహ్యంలోకి వెళితే కార్యసిద్ధి హనుమంతుల వారు రాముల వారి కంటే ముందరే వెయిట్ చేయాలి ఆయన ముందుగా వచ్చేసి ఎప్పటి నుంచో వెయిట్ చేస్తున్నారు రాముల వారి కోసం ఎప్పుడైతే రామకార్యం వచ్చిందో డైరెక్షన్ వచ్చింది ఆయన శక్తి ఎంత బలశాలి ఎంత శక్తిమంతుడు ఒక ఉదాహరణగా తీసుకుందాము సంకేత రూపంలో ఒక వాటర్ పైప్ బ్లాక్ వచ్చింది అంతరాయం కలిగింది వాటర్ పైప్ అక్కడ ఏమవుతుంది అక్కడంతా కూడా ఆ యొక్క నీరు బాహ్యంలోకి వచ్చేస్తది అంతా ప్రవహిస్తది బురద నీరు తయారవుతది అంతా అస్తవ్యస్తంగా తయారవుతది మనకి ఇష్టమే లేదు మన ఇళ్లల్లో జరుగుతాయి ప్లంబింగ్ వర్క్ ఒక ప్లంబర్ రావాలి ప్లంబర్ వచ్చి దాన్ని సెట్ చేయాలి మన లోపల కూడా చాలా ప్లంబింగ్ వర్క్ కావాలి మనకి ఎన్నో శక్తి బ్లాక్స్ ఉంటాయి మనకి ఇప్పుడు ప్రధానంగా మన భావోద్వేగాలు వలన ఎన్నో ఈ శక్తి డైరెక్షన్ ఇవ్వడంలో కొన్ని ప్రాబ్లమ్స్ వస్తాయి మనకి ఒక క్రానిక్ ఎమోషన్స్ క్యారీ చేస్తున్నాం కొన్ని ఎప్పటినుంచో ఉన్నాయి కాదు అది ఇప్పటి నుంచి కాదు చిన్నప్పటి ంచి ఒకటే పట్టుకొని వేలాడుతున్నాం ఒకే ఎమోషన్ ఒకే భావావేశం భయము అనుకుందాం భయం అదే భయం అదే క్రోధం అదే దుఃఖం అదే బాధ అదే డిప్రెషన్ మన ఎమోషన్ కూడా భావావేశం కూడా డెఫినిషన్ ఏంటంటే ఈ ప్లస్ మోషన్ ఎనర్జీ మోషన్ అని అంటాం ఎందుకంటే ఈ ఎమోషన్ లో కూడా ఒక శక్తి ఉంది.","మన భావావేశాల్లో చాలా శక్తి ఉంది. మన కోపంలో కూడా చాలా శక్తి ఉంది డైరెక్షన్ వేరుగా ఉంది వేరే డైరెక్షన్ లో వెళ్తుంది కోపం ఒక స్పిరిచువల్ సైంటిస్ట్ రిచర్డ్ డాకిన్స్ అనే ఆయన చక్కని రీసెర్చ్ చేశారు. పవర్ వర్సెస్ ఫోర్స్ అని ఆ పుస్తకాన్ని ఆయన పరిశోధనని అన్నీ కూడా దానిలో ప్రచురించారు. పవర్ వర్సెస్ ఫోర్స్ గొప్ప రీసెర్చ్ అంటే ఈ భావావేశాల యొక్క యూనిట్స్ ఎనర్జీ కాన్షస్నెస్ యూనిట్స్ గురించి మెజర్ చేయడం ఇట్న కైనీసియాలజీ అనే ఒక టెస్ట్ ద్వారా మజల్ టెస్టింగ్ ద్వారా ఆయన కనుక్కున్నారు కొన్ని గొప్ప విషయాలను కనుక్కున్నారు అంటే ఒక్కొక్క భావావేశానికి కూడా ఒక్కొక్క శక్తి ఉందంట అన్నిటికంటే గ్రాటిట్యూడ్ కృతజ్ఞతా భావానికి ఎక్కువ ఎనర్జీ ఉంటుంది ఎక్కువ కాన్షియస్నెస్ యూనిట్స్ ఎక్కువ ఉంటాయి.","ఈ విషయాన్ని ఆయన రీసెర్చ్ చేశారు. మనం కూడా గమనించొచ్చు మనం ఎప్పుడైతే మీరు ఆనందంగా ఉన్నారో ఎప్పుడైతే మీరు కృతజ్ఞత భావంతో మీరు జీవిస్తున్నారో మీ ఎనర్జీ లెవెల్స్ ఎలా ఉంటాయి మీ కాన్షియస్నెస్ లెవెల్స్ ఎలా ఉంటాయి మీ శక్తి చైతన్యం యొక్క లెవెల్స్ ఎలా ఉంటాయి అద్భుతంగా ఉంటుంది. మనం ఎప్పుడైతే దుఃఖంలో ఉన్నామో భయంలో ఉన్నామో ఒక షేమ్ ఫుల్ ఫీలింగ్ కలిగిందో మనలో నేను తక్కువ అనే భావన కలిగిందో మన ఎనర్జీ లెవెల్స్ ఎలా ఉంటాయి బెలూను ఎలా దానికి హోల్ పడితే ఆ బెలూన్ ఎలా కుంచించక ని చెప్పుకుంటూంటాం. ఇవన్నీ సంకేత రూపంలో అద్భుతంగా వేదవ్యాసుల వారు మనకి తెలియజేశారు.","గొప్ప సంకేత భాషలో చెప్పబడినవి ఇవన్నీ కూడా బాహ్యార్థమే కాదు అంతరార్థం తీసుకోవాలి. అంతా ఈ తమోగుణము రజోగుణము యొక్క దానిపై విజయం సాధించడమే సత్వగుణం కూడా సత్వగుణం కూడా దాటాలి. సత్వగుణ దోషాన్ని కూడా దాటాలి ఈ త్రిగుణాలని దాటడం అనే ఈ నవరాత్రి సాధనే గురించి దీనిలో చెప్పబడింది. సో ధ్యాన సాధనతోనే ఈ ఇప్పుడు మనలో రజోగుణము తమోగుణాల ద్వారా ఈ దోషాల ద్వారా ఎన్నో బ్లాకేజెస్ ఉంటాయి. అక్కడ శక్తి లీకేజ్ అవుతుంది వక్రమార్గంలో వెళ్తుంది. సో దాన్ని ఈ యొక్క ఏదైతే సాధన చేస్తుంటామో ధ్యాన సాధన పర్టికులర్ గా ఈ నవరాత్రి సాధన కూడా అందుకే ఇంటెన్స్ గా చేయడం మనల్ని మనం దిశని సెట్ చేసుకోవడం వల్ల కార్యసిద్ధి బాహ్యంలో కార్యసిద్ధి అంతర్ముఖంగా జ్ఞాన సిద్ధికి జ్ఞానంలో ఎన్నో మెట్లు ఒక ఎన్నో జ్ఞాన సిద్ధులు ఎన్నో ఒక లెవెల్ నుంచి ఇంకొక లెవెల్ కి వెళ్ళాలి జ్ఞానంలో కూడా అన అనంతమైనటువంటి జ్ఞానం తెలుసుకుంటూ ఉండాలి. సో ఫ్రెండ్స్"],"minutes":3,"words":412},{"title":"ప్రకృతి మాత మరియు తల్లితో అనుబంధం","paras":["నిన్న మనం ఈ ప్రకృతి అంతా కూడా ప్రకృతి మాత గురించి మాట్లాడుకున్నాం. ఆ దేవతా శక్తే ప్రకృతి మాతక ఇక్కడ మనకి కనిపిస్తుంది ఇక్కడ ఈ ప్రకృతిని ప్రకృతిగా చూడకూడదు ఈ ప్రకృతిని పరమాత్మ తత్వంగా భావన చేయాలి ఆ జగన్మాత ఈ చెట్టుగాను జంతువులుగాను ఈ సృష్టి అంతా కూడా ఆవిడతోనే నిండిపోయింది ఆ భావనతో మనం చూడగలగాలి. నిన్న చెప్పుకున్నాం ఈ విషయం మన తల్లితో మనం ఎంత అనుబంధం ఉంటుందో ఆ జగన్మాతతో కూడా అంత దగ్గరగా మనం వెళ్ళగలుగుతాం. ఆ శక్తిని కూడా మనం అంతగా మన కనెక్షన్ ఏర్పడుతుంది. ఆ దేవీ మాత ఆ శక్తితో ఆ దుర్గామాతతో ఆ కనెక్షన్ మనకి బిల్డ్ అవుతుంది ఆ శక్తిని ఎలా తీసుకోగలం అంటే మన తల్లిని మనం ఎలా ఏ భావంతో మన తల్లి దగ్గర ఉన్నప్పుడు ఉంటుందో అదే భావన మన ఈ శక్తి పట్ల కూడా ఉంటుందంట.","స్థూలంలో ఏది ఉంటుందో బాహ్యంలో ఏది ఉంటుందో అంతరంలో కూడా అదే ఉంటుంది. స్థూల జగత్తులో ఏముందో సూక్ష్మ జగత్తులో కూడా జరుగుతుంది. కారణ జగత్తులో కూడా అదే ఉంటుంది. అందుకే మనం ఒక ప్రశ్న మనందరికీ కూడా అదేంటంటే మన తల్లితో మన అనుబంధం గురించి మీ తల్లి మీ దగ్గర ఇప్పుడు ఉన్నారు అనుకుందాం. ఆ తల్లి ఇప్పుడు బాడీలో ఉండిఉండొచ్చు బాడీ వెకేట్ చేసేనా ఉండొచ్చు కానీ ఆవిడతో మీ యొక్క కనెక్షన్ గురించి మీరు ఒకసారి ఆలోచన చేస్తే మీకు ఆవిడకి మీ యొక్క తల్లికి బయలాజికల్ మదర్ కి ఎంత డిస్టెన్స్ ఉంది మీ ఇద్దరి మధ్యన మీకు చాలా క్లోజ గా ఫీల్ అవుతారు లారా ఆవిడ చాలా దూరంగా ఉన్నారా కనెక్ట్ కాలేకపోతున్నారా మీ యొక్క తీర్పులు ఏంటి మీ యొక్క జడ్జ్మెంట్స్ ఏంటి అమ్మ పట్ల మన అమ్మని చాలా జడ్జ్మెంట్స్ ఉంటాయి ఆవిడకి ఆమెని చాలా జడ్జ్ చేస్తాం జడ్జ్ జడ్జ్మెంట్ ఎక్కడఉంది మనం సపరేట్ అవుతాం దూరంగా వెళ్తాం. జడ్జ్మెంట్ సపరేట్స్ మనం ఈ తల్లినే స్వీకరించకపోతే ఇంకా ఆ తల్లిని ఎక్కడ స్వీకరిస్తాం ఆ జగన్మాత ఆ తల్లిని ఎక్కడ స్వీకరిస్తాం ఈ తల్లినే ఫస్ట్ మన తల్లిని కూడా యాక్సెప్ట్ చేయగలరు ఏదైతే ఇక్కడ బ్లాక్ లాగా ఉందో మీ మధ్యన అమ్మకి అమ్మగారికి మధ్యన చాలా డిస్టెన్స్ ఫీల్ అవుతున్నారు ఎమోషనల్ డిస్టెన్స్ ఫిజికల్ గా ఒకటే ఇంట్లో ఉండొచ్చు మీరు మాట్లాడుకుంటూ ఉంటారు బాగానే కానీ లోపల మీకు మీ మదర్ కి ఎక్కడో దూరంగా చాలా దూరం చాలా దూరంగా ఫీల్ అవుతుంటారు.","ఇట్స్ నాట్ అబౌట్ ద ఫిజికల్ డిస్టెన్స్ చాలామంది దగ్గరగానే ఉంటారు రోజు మాట్లాడుకుంటారు రోజు కలుస్తారు రోజు ఒకటే ఇంట్లో ఉంటారు తల్లితోనే ఉంటారు మీరు కానీ మీకు అమ్మకి పట్ల చాలా దూరం వచ్చేస్తుంది."],"minutes":2,"words":311},{"title":"తల్లితో అనుబంధం గురించి సందేశం","paras":["మన తల్లితో మనం కనెక్షన్ వెరీ ఇంపార్టెంట్ ఈ డిస్టెన్స్ ఏ డిస్టెన్స్ అయితే మన తల్లితో మనం ఉందో అదే డిస్టెన్స్ అక్కడ కూడా ఉంటుంది. ఇక్కడ సెట్ చేసుకుంటే అక్కడ తల్లి దగ్గరగా ఉంటాం ఇంకా దగ్గరగా వెళ్తాం."],"minutes":1,"words":30},{"title":"ప్రశ్నోత్తరాలు: తీర్థయాత్ర మరియు అంతర్యాత్ర","paras":["వెరీ గుడ్ మేడం మంచి క్వశ్చన్ అడిగారు. ఎందుకంటే చాలా మందికి డౌట్ ఉంటుంది. ఇన్ని చాలా మంది తీర్థయాత్రలని చేస్తుంటారు చాలా తీర్థయాత్రలు చేస్తుంటారు. గంగలో వెళ్లి మునగాలని చెప్పేసి అన్నీ తప్పేం లేదు వెళ్ళగలిగితే ఒప్పికుంటే చక్కగా ఆ వనరులు అన్నీ ఉంటే చక్కగా వెళ్లి అన్నీ చేయొచ్చు కానీ అక్కడ ఆ ఎక్కువ సాధనలు చేయాలి ధ్యాన సాధన చేసుకోవాలి కానీ మన ఇంట్లో ఉండి ఏ తీర్థయాత్రల్లో వెళ్లకుండా కూడా మనం అన్నీ కూడా లోపల మన అంతర తీర్థ యాత్ర ఇదంతా కూడా మన లోపల చేసే యాత్ర ఇది ఈ యాత్రలో కూడా అద్భుతంగా అన్ని మనకు వస్తాయి ఒకసారి సారి అంతా యుద్ధం అంతా అయిపోయింది మహాభారత యుద్ధం అంతా అయిపోయింది. పాండవులంతా కూడా ఒక తీర్థ యాత్రకు ప్లాన్ చేసుకున్నారు వాళ్ళు శ్రీకృష్ణ పరమాత్మ బంధువు కదా మరి ఆయన కూడా ఇన్వైట్ చేశారు.","తీర్థయాత్రకు మీరు కూడా రండి అని చెప్పేసి శ్రీకృష్ణ పరమాత్మను కూడా ఇన్వైట్ చేశారు. శ్రీకృష్ణ పరమాత్మ ఏం చెప్పే కొంచెం నాకు అపాయింట్మెంట్స్ చాలా ఉన్నాయి కొన్ని కమిట్మెంట్స్ అన్ని ఉన్నాయి మరి మీరు వెళ్ళండి కానీ మీతో పాటు ఒకటి ప్రతీకగా నా ప్రతీకగా నేను ఒకటి ఇస్తాను ఒక గుమ్మడికాయ ఇచ్చాను గుమ్మడికాయని కూడా తీసుకెళ్లి మీరు ఎక్కడికి వెళ్తారో ఆ తీర్థయాత్ర దగ్గర రాకుండా ఉండే నదిలో దీన్ని కూడా ముంచండి. మళ్లా తీసుకురండి వాళ్ళు 40 రోజులు ప్రయాణం అన్నమాట 40 రోజుల తర్వాత బ్యాక్ వస్తారు. తీసుకురండి అని చెప్పారు పూజలు చేసిన దగ్గరల్లా గుమ్మడికాయ పెట్టండి ఎందుకంటే నేను ఉన్నట్టే భావన చేసి చేయండి సో ఈ విధంగానే చేశారంట వాళ్ళు వెళ్ళారు గుమ్మడికాయని పట్టుకొని వెళ్లి శ్రీకృష్ణ భగవాన్లా అన్నిటిలో ముంచారు అక్కడ దేవాలయాల్లో పూజలు చేసిన దగ్గరల్లా అక్కడ సాధనలు అది కూడా పెట్టారు.","తర్వాత మళ్ళా బ్యాక్ వచ్చేసారు వచ్చిన తర్వాత ఇప్పుడు మళ్ళా అడిగారన్నమాట ధర్మరాజు అడిగారు కృష్ణ భగవాన్ ఏం చేయాలి ఇప్పుడు గుమ్మడికాయని అంటే ఏం చేస్తారు ఇది అందరికీ వంట తెమ్మండి చక్కగా ఊర్లో అందరికీ పిలిచి చక్కగా భోజనాలు పెట్టండి. ఆ గుమ్మడికాయతో సాంబార్ చేశారు మరి వంట చేశారు. అందరూ వాంతి చేసుకున్నారంట. ఆ గుమ్మడికాయ తిని వాళ్ళందరిక పాండవులంతా కూడా ఏంటి ఇట్లా అయింది ఇది మాతో పాటు తీర్థయాత్రలు ఎంతో చేసింది పవిత్రమైనటువంటి గుమ్మడికాయి ఎంత పవిత్రమో ఇదేంటి వాంతి క్రియేట్ చేసింది అందరిలో అనిప శ్రీకృష్ణ పరమాత్మ దగ్గరికి వెళ్లి రిపోర్ట్ చేయడానికి వెళ్ళినప్పుడు నవ్వుతున్నారు ఆయన ఆ నవ్వులోనే దానికి వాళ్ళకి అర్థమయింది అన్నమాట విషయం అంటే అంటే తీర్థయాత్రల ద్వారా గుమ్మడికాయలోనే ఏ మార్పు లేదు మనిషిలో ఏ మార్పు వస్తుంది బాహ్యంలో అటు ఇటు తిరుగుతుంటారు ఇక్కడికి వెళ్తారు అక్కడికి వెళ్తారు ఈ ఊరికే అన్ని ఊర్తూ గంగలో మునిగినప్పుడు పాపాలు పోయట్లేదు ఎంతమంది మునుగుతున్నారు వాళ్ళు ఏమి లేదు మళ్ళా ఆ పాపమన దెయ్యాలన్నీ అక్కడే ఉంటాయంట అన్ని మళ్ళా పట్టుకుంటాయి.","తప్పేం కాదు వెళ్ళగలిగితే చాలా ఉత్తమోత్తం వెళ్లి సాధన చేయరు మెయిన్ గా సాధన చేయాలి ఇన్ని గొప్పయో ధ్యాన సాధన కోసం చక్కని ప్రయోగాలు ఉన్నాయి అది మన ఇంట్లోనే సూక్ష్మంలో మోక్షం మన ఇంట్లోనే కూర్చుని చేసుకొచ్చి ఇదే చెప్పుకున్నాం కదా ఒకరోజు ఇదే క const nav=document.getElementById('nav'),mobileNav=document.getElementById('mobile-nav'),columns=document.getElementById('columns');let chapter=0,spreadIndex=0,spreadCount=1;

function measure(){const width=columns.clientWidth;const one=window.matchMedia('(max-width:800px)').matches;const total=Math.max(width,columns.scrollWidth);spreadCount=Math.max(1,Math.ceil((total-2)/width));spreadIndex=Math.min(spreadIndex,spreadCount-1);columns.scrollLeft=spreadIndex*width;document.getElementById('position').textContent='Section '+(chapter+1)+' / '+chapters.length+' · '+(one?'Page ':'Spread ')+(spreadIndex+1)+' / '+spreadCount;document.getElementById('prev').disabled=chapter===0&&spreadIndex===0;document.getElementById('next').disabled=chapter===chapters.length-1&&spreadIndex===spreadCount-1}
function move(dir){if(dir===1){if(spreadIndex<spreadCount-1)spreadIndex++;else if(chapter<chapters.length-1){chapter++;spreadIndex=0;render();return}}else{if(spreadIndex>0)spreadIndex--;else if(chapter>0){chapter--;spreadIndex=9999;render();return}}measure()}
