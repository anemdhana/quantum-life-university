</style></head><body><div class="app lang-te"><aside class="side"><a class="brand" href="index.html">QUANTUM LIFE UNIVERSITY</a><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-09-te.html">Prev</a></nav><h2>Devi Navaratrula Jnanam</h2><p class="sub">విజయదశమి — దేవీ శక్తి, ఆత్మజ్ఞానం మరియు సాధన · Day 10</p><ul class="nav" id="nav"></ul></aside><main class="main"><header class="bar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="uk-button uk-button-default uk-button-small mobile" id="menu">☰</button><span class="bar-title" id="heading">విజయదశమి — దేవీ శక్తి, ఆత్మజ్ఞానం మరియు సాధన</span></div><div class="tools"><span class="lang-switch"><a href="day-10-te.html" class="active">TE</a><a href="day-10-en.html">EN</a></span><span class="read-time" id="time"></span><button class="uk-button uk-button-default uk-button-small" id="font" title="Toggle text size">A±</button></div></header><div class="reader"><div class="spread" id="spread"><div class="columns" id="columns"></div></div><footer class="bottom"><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button></footer></div></main></div><div class="mobile-side" id="mobile-side"><nav class="day-jump" aria-label="Days"><a href="index.html">Programme</a><a href="day-09-te.html">Prev</a></nav><ul class="nav" id="mobile-nav"></ul></div><script>const chapters=[{"title":"దేవీ శక్తి మరియు ఆత్మజ్ఞానం","paras":["శుభోదయం జ్ఞానోదయం వండర్ఫుల్ ఫ్రెండ్స్ ఈ నైన్ డేస్ శక్తి దేవీ శక్తి ఏ శక్తి అయితే అంతటా వ్యాపించి ఉందో ఆ శక్తి గురించే మనం తెలుసుకుంటూ వస్తున్నాం. శక్తి గురించి తెలుసుకోవడం వేరు శక్తిని తెలుసుకోవడం వేరు చాలా తేడా ఉంది ఆత్మ జ్ఞానం తెలుసుకోవడం వేరు ఆత్మ జ్ఞానం గురించి తెలుసుకోవడం వేరు లేరు సత్యం తెలుసుకోవడం వేరు సత్యం గురించి తెలుసుకోవడం వేరు. గురించి అని ఎప్పుడు వస్తుందో దాని గురించి మనం అనాలసిస్ విశ్లేషణ థియరీలోకి వెళ్ళిపోతాం. ఇదంతా ప్రాక్టీస్ వర్షాకాలంలో మనం పంటలు బాగా పండుతాయి అనుకూలంగా ఉంటుంది పంటలు పండడానికి రైతుకు తెలుసు అందుకే ఆ టైంలోనే పంటలు బాగా వేస్తారు. అలానే నవరాత్రులు కూడా ఒక ఆ శక్తి ప్రవాహం అద్భుతంగా ఉంటది అనుకూల పరిస్థితులు అందుకే ధ్యాన సాధకులకి ఇది పెద్ద పండుగ దసరా పండుగ ఈ నవరాత్రులు దసరా అందుకే మనం చాలా అద్భుతంగా చేసుకుంటాం.","ఎందుకంటే సాధనలు సాధనల కోసమే ఇవన్నీ కూడా సో దశమి రోజుకు వచ్చేసాం ఈరోజు నవరాత్రులు అయిపోయినాయి ఇంకా ఇప్పుడు మనం ఈ 10వ రోజు విజయదశమి అని కూడా మనం అనుకుంటుంటాం విజయదశమి పండగ దీని అంతరార్థం ఏంటి ఎందుకంటే అంతా అంతరార్థాలు ఉన్నాయి లేకపోతే మనం అన్నీ కూడా సెరిమోనియస్ గా లేకపోతే రిచువలిస్టిక్ గా ఏదో కర్మకాండలు చేస్తూ దాని యొక్క అర్థం తెలుసుకోకపోతే మీనింగ్ తెలుసుకోకపోతే మనం ఎందుకు చేస్తున్నామో తెలియదు. మన పూర్వీకులు చేశారు నేను కూడా అదే చేస్తున్నాను అనే భావన ఉంటుంది. ఈ విజయదశమి పండుగను ఎందుకు చేసుకుంటాం దసరా పండుగను ఎందుకు చేసుకుంటాం సో ప్రతిరోజు కూడా మనం ఈ శక్తి గురించి తెలుసుకుంటూ వస్తున్నాం. ఆ శక్తి ఎలా అనుభవపూర్వకంగా తెలుసుకోవాలో కూడా మనం తెలుసుకుంటున్నాం. మనమందరం కూడా ధ్యాన సాధకులం ఎప్పుడు ధ్యాన సాధన నిన్న మనం కొన్ని పాయింట్స్ చెప్పుకుందాం ఒక ఏడు సూత్రాలుగా ఏడు పాయింట్స్ గా మొదటిది ధ్యానం ద్వారానే శక్తి మనకు వస్తుంది.","ప్రకృతిలో అంతా శక్తి ఉంది వేరే విధంగా మనం ప్రకృతి నుంచి తీసుకుంటుంటాం. వినడం ద్వారా శక్తి వస్తుంది మంచి మ్యూజిక్ వినండి మంచి శబ్దాలు వినండి ఆహారం అది కూడా ఆహారమే ఆహారం అంటేనే శక్తిని ఇచ్చేది. పంచజ్ఞానేంద్రియాల నుంచి ఎప్పుడో తీసుకుంటున్నాం కానీ ప్రధానంగా ధ్యానం ద్వారా ప్రధానంగా అతి ముఖ్యంగా ఈ విశ్వశక్తిని ధ్యానంలోనే తీసుకుంటాం ఎక్కువగా శక్తి ద్వారానే చైతన్యాన్ని మనం తెలుసుకోగలుగుతాం. ఎప్పుడైతే మనలో ఆ శక్తి నింపబడిపోతుందో మనం శక్తి ముద్దలుగా తయారవుతామో అప్పుడు మన చైతన్యం గురించి తెలుస్తుంది. ఈ శక్తి చైతన్యం ఇప్పుడు రెండు కలిసిపోతాయి. ఫస్ట్ వేరుగా ఉంటాయి శక్తి వేరు చైతన్యం వేరు అనుకుంటాం కానీ యాక్చువల్ గా రియల్ గా అసలు సత్యం ఏంటంటే రెండు ఒకటే శక్తి చైతన్యాలు ఎప్పుడూ వేరు కాదు రెండు ఒకటే రెండు టూ డిఫరెంట్ ఎక్స్ప్రెషన్స్ గా అవుతున్నాయి ఇక్కడ ఈ పాయింట్ జాగ్రత్తగా పట్టుకోవాలి.","శక్తి చైతన్యము వేరుగా కనిపిస్తుంది ఇక్కడ మన యొక్క కుండలిని శక్తి ఎప్పుడైతే ఊద్యముఖంగా ప్రయాణించి ఎప్పుడైతే చైతన్యాన్ని చేరుకుంటుందో ఆ రెండు ఒకటే అయిపోతాయి అక్కడ అక్కడి నుంచి వేరు కాదు అర్ధనారీశ్వర తత్వం ఆ పార్వతీ మాతా శివుడు వేరు కాదు ఒకటే అక్కడ ఉండేది ఒకటే దాని నుంచి వచ్చే పుత్రుడు కూడా ఒకటే జ్ఞానం ఈ శక్తి చైతన్యము దాని తర్వాత ఈ రెండిటి కలయక వలన వచ్చే జ్ఞానం ఈ మూడే పాయింట్స్ ప్రతి ధ్యాన సాధకుల్లోనూ ఇది జరుగుతుంది. ప్రధానంగా ఈ నవరాత్రుల్లో అనుకూల పరిస్థితుల్లో సాధన చేస్తే ఆ విశ్వశక్తిని ఎంతో తీసుకుంటాం మనం ఆ శక్తి ద్వారా చైతన్యం చైతన్యం ద్వారా ఈ శక్తి చైతన్యం ద్వారా జ్ఞానం మనకి లభ్యమవుతుంది. ఆత్మజ్ఞానం కోసమే మన ప్రయాణం అంతా మన సాధన అంతా కూడా మన ప్రయత్నం అంతా కూడా మనల్ని మనం తెలుసుకోవడానికే నేను ఎవరిని నేను ఎవరిని నేను ఏం చేయాలి నా పర్పస్ ఏంటి ఇదే ప్రయత్నం సో ఈ నవరాత్రుల్లో మనం చేసే సాధన మనం దుర్వినియోగ పరుచుకోకూడదు.","ఈ శక్తి ఏదైతే మేల్కొనబడుతుందో మనలో ఎంతో శక్తి విశ్వశక్తి మనోని కుండల్ని శక్తి అంతర్గతంగా దాగి ఉన్నటువంటి శక్తి పెద్ద పెద్ద కార్యాలకి ఉపయోగిస్తాం హనుమంతుల వారి శక్తి రామ కార్యానికి వినియోగించాలి పెద్ద పర్పస్ అది గ్రాండ్ పర్పస్ ఇది రెండవది మనం ఎన్నో లీకేజెస్ ఉంటాయి మన శక్తి దుర్నియోగ పరచబడుతుంది. ఆ శక్తికి మనం కంటెన్ చేయగలగాలి మనలో ఒక రిజర్వాయర్ లాగా పెట్టుకొని ఉండగలగాలి. తర్వాత దానికి సద్వినియోగం చేసుకునేట్టుగా ఏదైతే మన పర్పస్ ఉంటుందో ఏదైతే మన గొప్ప లక్ష్యం ఉంటుందో ఆ లక్ష్య సాధనకి ఆ లక్ష్య సిద్ధి కోసంగా మనం ఈ శక్తిని వినియోగించుకోవాలి సద్వినియోగ పరుచుకోవాలి.","సో మూడవ పాయింట్ నిన్న చెప్పుకున్నాము ఒక ఏదైతే శక్తి మనలో అవేకన్ అయిందో సాధకులలో ఆ శక్తి ఒక డైరెక్షన్ తీసుకుంటుంది రెండు డైరెక్షన్ లో వెళ్తుంది అని చెప్పుకున్నాం ఒకటి అంతరంగానం రెండవది బాహ్యంగానం అంతరంలో ఉన్నప్పుడు దాన్ని ఎక్కువ స్త్రీ తత్వంతో మనం పోలుస్తాం ఫెమినిటీ ఫెమినైన్ ఎనర్జీ భాష్యంలోకి వెళ్ళేప్పుడు అది మాస్క్లైన్ ఎనర్జీగా ఎక్స్ప్రెస్ అవుతుంది."],"minutes":4,"words":572},{"title":"నవరాత్రుల సాధన మరియు అంతర్గత శక్తి","paras":["ఇది రెండు డైరెక్షన్స్ లో వెళ్తుంటుంది. ధ్యాన సాధకుడు కూడా ఈ నైన్ డేస్ నవరాత్రుల్లో మనం ఎక్కువగా బాహ్యంలో లేకుండా ఎక్కువ అంతరంలో ఉంటాం. ఎందుకంటే ఈ శక్తిని అనుభవం పూర్వకంగా తెలుసుకోవడానికి తర్వాత వినియోగిస్తాం విజయదశమి అంటేనే అది అందుకే విజయదశమి ప్రారంభం మనం విజయాలకి ప్రారంభం ఆరంభం మనం ఏదైతే శక్తిని మన లోపల కంటైన్ చేసి రిజర్వాయర్లో పెడుతున్నామో ఇప్పుడు బాహ్యంలోకి దాన్ని వినియోగించుకుంటాం సో అందరం ఇది ఈ ఈ టూ డైరెక్షన్స్ ఆఫ్ ఎనర్జీ మనం చూడగలుగుతాం. అంతరంగా ఉన్నప్పుడు ఊర్ధ్వము ముఖంగా ఏదైతే శక్తి వెళ్తుందో అది దానికి కూడా ఒక డైరెక్షన్ ఉంటుంది ఊర్ముఖంగా వెళ్లొచ్చు అదుర్ముఖంగా కూడా వెళ్లొచ్చు సో నాలుగో పాయింట్ నిన్న మనం చెప్పుకున్నది బాహ్యంలోకి వెళ్ళిన ఆ శక్తి ద్వారా మనం కార్యసిద్ధికి ఉపయోగపడుతుంది.","ఏ కార్యాలు మనం నిర్వహించదలుచుకున్నామో ఆ కార్యాలని సిద్ధింప చేసుకోవడానికి ఏదైనా సరే అజ్ఞాతవాసం అయిన తర్వాత పాండవులంతా కూడా వారి ఆయుధాలని జమ్మి చెట్టు దగ్గర దాచారని చెప్పేసి ఆ తర్వాత అన్ని తీసుకొని విజయదశమి నాడు వారు అప్పటినుంచి విజయాలే విజయాలు అంతవరకు అంతవరకు లేని విజయాలన్నీ అప్పుడు ప్రాప్తించారు. దీనికి ఒక అంతరార్థం ఉంది తెలుసుకోవాలి కచ్చితంగా తెలుసుకోవాలి. సో ఏదైతే సాధన ద్వారా మనలో యక్టివేట్ అయినటువంటి ఆ ఎనర్జీ మనం రెండిటిగా ఉపయోగించుకుంటూఉంటాము రెండు డైరెక్షన్స్ లో వెళ్తుంది కాబట్టి ఒకటి కార్యసిద్ధి కోసం ఒకటి రెండోది జ్ఞాన సిద్ధి కోసం మనం అంతరంలో ఉద్ధముఖంగా వెళ్ళినప్పుడు అది జ్ఞాన సిద్ధి వస్తుంది ఆత్మజ్ఞానం బ్రహ్మ జ్ఞానం ఇవన్నీ పొందగలుగుతాం. సో బాహ్యంలో ఈ స్థూల జగత్తులో ఎన్నో జరుగుతుంటాయి సంఘటనలు పరిస్థితులు ఎన్నో వస్తుంటాయి. మనం పరిష్కార మార్గాల కోసం వెతుకుతూ ఉంటాం.","మనక ఎప్పుడో ఒక ప్రశ్న కూడా ఉంటుంది ఎందుకు ఎందుకు జరుగుతున్నాయి ఎందుకు వస్తుంది ఎందుకు వచ్చింది ఎందుకు ఈ సందర్భాలు వచ్చాయి ఎందుకు ఈ పరిస్థితులు వస్తున్నాయి ఈ దుర్బర పరిస్థితి ఎప్పుడు పోతుంది ఎందుకు ఉంది ఇది నేను ఎందుకు సఫర్ అవుతున్నాను సో బాహ్యంలో జరుగుతున్నటువంటి సంఘటన యొక్క మూల కారణాలను మన అంతరంలో వెతకాలి బాహ్యంలో జరిగే ప్రతి ఒక్కటి అంతరంలో జరుగుతుంటుంది. స్థూల జగత్తులో ఏది జరుగుతుందో సూక్ష్మంలో అదే జరుగుతుంది సూక్ష్మ జగత్తు ఇంకా సూక్ష్మాతి సూక్ష్మంగా వెళ్లి కారణ జగత్తులో కారణాలను వెతకాలి దాన్నే కారణ శరీరం అంటాం కారణ శరీరంలో ప్రతిదానికి రచన ఉంటుంది దానికి సంబంధించినటువంటి ఒక రచన ఒక డిజైన్ ఒక ప్లాన్ ఇప్పుడు బాహ్యంలో జరుగుతున్న ప్రతి సంఘటనకి కారణాలు మన అంతరంలో వెతకాలం కారణాలు బాహ్యంలో వెతికామా ఎప్పటికీ దొరదు.","ప్రతి ఒక్కటి కార్యకారణ సంబంధమే కదా బయట ప్రతిదీ కూడా జరిగే విషయాలన్నీ కూడా దాని యొక్క కారణాలన్నీ మన కారణ శరీరంలో కారణ జగత్తులోనే ఉన్నాయి కదా ఓన్లీ ధ్యాన సాధన చేసినప్పుడు మాత్రమే మనం ఆ మహా కారణ స్థితిలో మనం ఉండగలుగుతాం కారణాలు దాటినటువంటి స్థితి అన్ని అవగాహనలోకి వస్తాయి ఓకే కార్యకారణ సంబంధం అది కూడా వెళ్ళిపోతుంది దాన్ని డీలింక్ చేసేస్తాం ఎప్పుడైతే కార్యము కారణము రెండు తెలుస్తాయో సొల్యూషన్ వచ్చేసింది దానికి సంబంధించినటువంటి జ్ఞానం మనలోకి వస్తుంది. అప్పుడే రిజల్వ్ అవుతాయి ఇష్యూస్ ఆల్బర్ట్ ఐన్స్టీన్ గారు చెప్పారంట ప్రాబ్లమ సమస్య వచ్చింది మన మనసు ద్వారా వచ్చింది మనసు నుంచి మనం ఎప్పుడు ఆ సమస్యను పరిష్కరించలేదు మనసుకు అతీతమైనటువంటి స్థితిలోకి వెళ్తేనే ఆ సొల్యూషన్ మనం వెతకగలం ఆ పరిష్కరించుకోగలం మనసు ద్వారా ఏమి చేయలేం సో దేవీ మహత్యంలో కూడా ఒక విషయం చెప్పబడింది. మహావిష్ణువు గారు ఒక యోగ నిద్రలో ఉంటారు.","యోగ నిద్ర సమయంలో ఆయన చెవిలో నుంచి ఏదైతే వాక్స్ వస్తుందో బులింగ వస్తుందో దాని ద్వారా మధుకైటములు జన్మ తీసుకున్నారు అని చెప్పి రాయబడింది. ఇద్దరు రాక్షసులంట ఇన్నీ సంకేత రూపం లేకపోతే మనకే నవ్వు వస్తుంది. ఈ కథలు వింటున్నప్పుడు అంతరార్థాలు తెలుసుకోకపోతే అన్ని ఏంటి ఈ కథలు ఈ చెవులో నుంచి ఏదో వచ్చిందంటే దానినుంచి రాక్షసులు పుట్టడం ఏంటి చాలా హాస్యాస్పదంగా ఉంటుంది. కానీ అంతరార్థాలు తెలుసుకోవాలి.","మల్ల మహావిష్ణువు గారు ఆ మధుకైటబులు చాలా డిస్టర్బ్ చేస్తున్నారు రాసురులు ఎప్పుడు కూడా డిస్టర్బ్ చేస్తుంటారు వారితో పోరాటం చేశారు 5000 సంవత్సరాలు నో ఆ యుద్ధం వెళ్లలేకపోతున్నారు 5000 సంవత్సరాలు అంటేనే అక్కడ ఆ సంకేత రూపంలో చెప్పబడింది అంటే ప్రొలాంగ్డ్ టైం దీర్ఘకాలికంగా కానీ ఆయన ఎప్పుడైతే మహావిష్ణువు గారు ఆ మహామాయ అయినటువంటి జగన్మాత ఆ దేవీ శక్తి గురించి సహాయం తీసుకున్నారో అప్పుడు మధుకైటబుల్ సంహారం జరిగిపోయిందంట అందుకే దేవి మహత్యంలో ఇది కూడా చెప్పారు ఈ విషయం కూడా అంటే మన మనసుని ఎప్పుడూ మనం గెలవలేము మైండ్ దాని ఫంక్షన్ అది చేసుకుంటూ ఉంటుంది ఆలోచన చేయడం దాని మైండ్ పని దాన్ని ఆపాలి అనచదతుంటాం ఆలోచనల్ని స్టాప్ చేస్తాం బలవంతంగా ఏమన్నా చేయండి దాంతో యుద్ధం ప్రకటిస్తే మనమే ఓడిపోతుంటాం మనసుతో యుద్ధం అంటేనే మనం ఓడిపోతుంది.","సో విష్ణువు గారు అక్కడ ఈ స్టోరీలో మనం తెలుసుకోవాల్సింది మనసుని మనం జయించలేం మనసుకి అతీతమైన స్థితికి వెళ్ళాలి మనం దైవీ శక్తిని తీసుకోవాలి సహాయం తీసుకోవాలి. ఓన్లీ శక్తి మనం అవేకన్ చేసుకోవడం వల్లనే ఈ మనసు పైన కూడా దానికి అతీతమైన స్థితిలోకి మనం వెళ్తాం వెళ్ళగలుగుతాం. ఈ కథలన్నీ పౌరాణిక కథలన్నీ కూడా ఎంతో అంతరాధ్యాలని ఎంతో జ్ఞానాన్ని మనకు ప్రసాదిస్తాయి ఈ విషయం మనం తెలుసుకోవాలి ఎప్పుడు గుర్తు తెచ్చుకుంటూ ఉండాలి ఈ పౌరాణిక గ్రంథాల్లో రాసినటువంటి అన్ని కథలన్నీ కూడా ఎంతో అంతరార్థంతో ఉన్నవి సో బాహ్యంలో జరిగే స్థూల జగత్తులో జరిగే సూక్ష్మ జగత్తులో జరుగుతున్నాయి సూక్ష్మ జగత్తు యొక్క ఏదైతే ప్లాన్ ఎనర్జిటిక్ టెంప్లేట్ ఎస్ట్రల్ టెంప్లేట్ రెడీ అయిందో దానికి సంబంధించిన రచన అంతా కూడా మూల కారణాలు అన్ని కూడా కారణ జగత్తులో ఉన్నాయి కారణ శరీరంలో ఉన్నాయి.","మన మహాకారణ స్థితికి వెళ్లేది ఓన్లీ ధ్యానంలోనే శక్తి సహాయంతో మహాకారణ బియాండ్ కాల్ అండ్ ఎఫెక్ట్ వెళ్తాం మనం రోజు చెప్పుకుంటూ ఉంటాం జాగృతవస్థ స్వప్నావస్థ సుశుక్తి అవస్థ దీన్ని దాటి తురియం వెళ్ళాలి తురియం వెళ్ళినప్పుడే కార్యకారణ సంబంధం సంబంధించినవన్నీ కూడా ఒక్కొక్కటి వెళ్ళిపోతుంటాయి."],"minutes":5,"words":684},{"title":"ఆధ్యాత్మిక కథలు మరియు అవగాహన","paras":["సో ఆరో పాయింట్ తమోగుణము రజోగుణం ఇప్పుడు ఈ తమోగుణము రజోగుణాల ద్వారా మన శక్తి ప్రవాహంలో కూడా ఆటంకం వస్తుంది. ఈ తమోగుణము రజోగుణాల ద్వారానే మనలో ఎన్నో సంభవిస్తున్నాయి. అవి ఎక్కువగా ఉండకూడదు తక్కువగా ఉండకూడదు. తమగుణం రజగుణం ఎక్కువ ఉందా మనం అసురులం అయిపోతాం సత్వగుణం ఎక్కువగా ఉండాలంట పర్సంటేజ్ ఎక్కువగా ఉండాలివన్ పర్స ఒకే తమ గుణం ఆవన్ పర్సన్ ఉండడంలో శుద్ధ సాత్విక స్థితిలో వెళ్ళిపోతుంది. శక్తి ఎవరిలో ఎక్కువ ఉంటుంది? ధ్యాన సాధకుల్లో ఎక్కువ ఉంటుంది. నిరంతరం నిత్యం చేస్తే చేస్తూంటున్నారు ధ్యానం వారిలో ఎక్కువ ఉంటుంది. సత్వగుణము చాలా ఉంటుంది. వాళ్లో లేజీనెస్ ఉండదు ధ్యాన సాధకుల్లో సోమరితనం ఉండదు నెగిటివిటీ పోతుంది. రజోగుణం అహంకారం స్లోగా తుదముట్టించబడుతుంది. మమకారాలు పోతాయి అహంకారం మమకారాలు పోతాయి రాగద్వేషాలు కూడా వెళ్ళిపోతాయి. ధ్యాన సాధకుల్లో ఇది జరుగుతుంది. ఈ తమో రజోగుణాలపై యుద్ధం అన్నమాట. ఈ మహిషాశుర మర్ధనం నవరాత్రుల్లో ఈ స్టోరీస్ అన్ని చెప్పుకుంటాం.","ఇవన్నీ కూడా శక్తికి ఆటంగ పరిచే బ్లాక్స్ కానీ శక్తి ఉద్రృతంగా ప్రవహించి ఈ తమోగుణాన్ని రజోగుణాన్ని శక్తి ప్రవాహం ఏదైతే వగ్రమార్గంలో వెళ్తుందో దాన్ని మళ్ల సెట్ చేస్తుంది. సో ఒక పైపు నేను ఈ ఉదాహరణ కూడా తీసుకున్నాం కదా ఒక పైపులో బ్లాక్ ఏర్పడితే దాన్ని అక్కడ ఎక్కువగా ఎనర్ ":4,"words":594},{"title":"అంతరంగ మార్పు","paras":["ఎన్నో కార్యాలు చేస్తారు ఎన్నో కార్యాలు తీసుకుంటారు కానీ వాళ్ళు ఆ ప్రారంభంలోనే అపశృతి లాగా వారు నేను చేయలేనేమో నాకంత శక్తి లేదేమో ఆత్మన్యూనత భావం వచ్చింది అనుకోండి అక్కడ విత్తన రూపంలో అక్కడ పడిపోయింది విత్తనం పడిపోయింది. మన శక్తి ప్రకటింపబడదు సరిగ్గా అక్కడే బ్లాక్ వచ్చేస్తుంది. ఒక గొప్ప భావంతో మనం ప్రాజెక్ట్స్ ని ఏదైనా సరే స్టార్ట్ చేయాలి. రెండవది మన బాహ్య ప్రపంచాన్ని గెలవడం కాదు మన లోపల అంతర ప్రపంచంలో ఉన్న ఎన్నో మనల్ని ఆటంక పరిచేవి చాలా ఉన్నాయి. మన దశేంద్రియాలతో పాటు ఈ మనసు అనే పెద్ద ఇంద్రియం ఎన్నో బ్లాక్స్ క్రియేట్ చేస్తుంది. మన ఎమోషన్స్ మన భావాలు మన సంకుచితమైనటువంటి ఆలోచనలు మన అహంకారం ఇవే బ్లాక్స్ సో బాహ్య ప్రపంచం గడం కాదు మన అంతర ప్రపంచాన్ని గెలుచుకోవాలి.","అందుకే ఈ నవరాత్రులంతా కూడా అంతర ప్రపంచంలో ఉన్న మహిషాశుని మర్ధించడము అందర రాక్షసులు ఒక్కొక్కళ సుంబుడు నిసంబుడు దోమరలోచనుడు రక్తబీజుడు మధుకైటవులు వృత్తాసురుడు ఒక రాక్షస ఎంత అందరు అసురులు మన లోపలే ఉన్నారు. వీళ్ళంతా లోపల ఉంటే ఏడ మనకి విజయం వస్తుంది ఏడ సక్సెస్ అవుతాం ఏ ప్రాజెక్ట్ వర్క్ తీసుకున్నా ఎక్కడ సక్సెస్ వస్తుంది లోపలంతా ఇంతమంది అసురులు అసురులు అంటే దుర్గుణాలు గుణాలు మన గుణాలు అంటే మన పట్ల మనకు ఉన్న భావనలు మనలో ఉన్న తమోగుణమే మహిషాశువుడు తమోగుణం తమ కూడా దోషాలు ఎన్నో రకరకాలుగా ఎక్స్ప్రెస్ అవుతుంది మూడో పాయింట చాలామంది అనుకుంటాం భవిష్యత్తులో చేస్తాను భవిష్యత్తు భవిష ఎవ్రీథింగ్ ఫ్యూచర్ లో ఫ్యూచర్ ఫ్యూచర్ ఆ ఫ్యూచర్ ఎప్పుడు రాదు ఈ వర్తమానంలోనే ఏ క్రియేట్ అనా జరిగేది కూడా ఏ విజయమైనా కూడా ఈ వర్తమానమే ఈ మూమెంట్ లో మనం సక్సీడ్ కావాలి. ఆ గతాన్ని ఆ నది వడ్డునే వదిలేయాలి. ఆ ఎప్పుడో గతం యొక్క గాయాన్ని మోస్తూ ఉంటే ఎప్పటికీ ఈ విజయాన్ని అందుకోలేము.","అందుకే కంపల్సరీగా ఎవరైతే నిజంగా సక్సీడ్ కావాలనుకుంటున్నారో నిజమైన సక్సెస్ వైపు చూసుకొని వెళ్ళాలనుకుంటున్నారో బాహ్యము అంతరము బాహ్యంలో కూడా అంతరంలో ఫస్ట్ గెలిస్తే బాహ్యంలో అంతా మీరే గెలుస్తారు యు విల్ బి ద విన్నర్ యు విల్ మేక్ మెనీ పీపుల్ విన్ మీ విజయం ద్వారా ఎంతో మందిని ఆ స్ఫూర్తిని ఇస్తారు విజయానికి స్ఫూర్తిని ఇస్తారు. సో మన అంతర్గత శత్రువుల యొక్క నిర్మూలన సూత్రం ఎప్పుడు కూడా ఇన్నర్ విక్టరీ ఈ తొమ్మిది రోజులు కూడా ఇన్నర్ విక్టరీనే మొత్తం చేసిందంతా కూడా ఇన్నర్ విక్టరీ ప్రతి సాధన కూడా సాధనలున్నీ కూడా ఇదే సాధనలన్నీ కూడా కష్టమే సంగీత విద్వాంసులు ఒక్క రోజులో సంగీత విద్వాంసులు కాలేదు. వారి వెనకాల ఎంత ఒక్క పాట పాడడానికి దాని వెనకాల ఎంత పరిశ్రమ ఉంటుందంటే చాలా వారు సాధన చేస్తారు. ఒక మ్యూజికల్ ఇన్స్ట్రుమెంట్ ఒక నాట్యము శిల్పము చెక్కాలన్నా ఏదైనా సరే ధ్యాన సాధన కూడా అంత సులభంలో కాదు ధ్యాన సాధన చేయాలి.","సాధన ఉంది సాధన చేయాలి ఏదైనా అంతరంలో గాని బాహ్యంలో గాని సాధన ఇంపార్టెంట్ చాలామంటే అంటారు ఆ ధ్యానానికి ఏ సాధన అక్కర్లేదు ధ్యానంలో కూర్చోవచ్చు ఎలా వీలవుతుంది ఈ మనసు ఇన్నీ లాగుతుంటాయి శరీరాన్ని కూర్చోబెట్టాలి కళ్ళు కళ్ళు మూసుకొని కూర్చోవాల ఒక స్థితి తర్వాత మనకేమి ఎఫర్ట్ లెస్ గా జరుగుతుంది మెడిటేషన్ అంతవరకు సాధన చేయాలి సో ఈరోజు ఆయుధ పూజ కూడా నవమి రోజున చేసుకుంటారు కొంతమంది కొంతమంది విజయదశమి రోజున కూడా ఆయుధ పూజ చేసుకుంటారు అంటే ఏంటి మీనింగ్ ఏంటి మనం మన వస్తువులన్నీ కూడా మనం ఈరోజు వాటికి థాంక్స్ చెప్పుకుంటాం ఒక గ్రాటిట్యూడ్ మన వెహికల్స్ కార్స్ బైక్స్ టెంపుల్ దగ్గరికి వెళ్లి గుమ్మడికాయ కొట్టిస్తారు. కొన్ని రిచువలిస్ట్ గా చేస్తాం మనం దాని వెనకాల మర్మం ఏంటి దాని వెనకాల ఆంతర్యం ఏంటి?","వర్ ఎక్స్ప్రెస్సింగ్ వఆర్ ట్ూనింగ్ టు దోస్ ఇన్స్ట్రమెంట్స్ డివైన్ ఇన్స్ట్రమెంట్స్ సో దట్ దే ఆర్ ఆల్ వెరీ యూస్ఫుల్ ఫర్ యువర్ అచీవింగ్ ద గోల్ మన లక్ష్య సాధనకి కార్యసిద్ధి కోసంగా ఈ ఆయుధాలన్నీ ఉపయోగిస్తాం అన్నిటికంటే మంచి గొప్ప ఆయుధాలు ఏంటంటే ఏంటంటే మన శరీరము మన మనస్సు అంట వీటిని కూడా మనం చూచేసుకోవాల మన బాడీకి కూడా మనం థాంక్స్ చెప్పుకోవాలా ఈ శక్తిని చక్కగా వినియోగించుకోవాలి మన కార్యసిద్ధి ఆత్మజ్ఞానము బ్రహ్మజ్ఞానము మనం మనం తెలుసుకోవాలి తర్వాత ధ్యానము ఈ అందరికీ మనం ఏదైతే నేర్చుకొని ఏ సాధన చేస్తామో అందరికీ తెలియ చెప్పాలి. ఈ జ్ఞానం అందరికీ పంచాలి. అంతరంలో మన మనమున ఆత్మజ్ఞానం బ్రహ్మజ్ఞానం బాహ్యంలో అందరికీ మనం తెలుసుకునేది నేర్పిస్తూ ఉండాలి సో మన విజయము ఎప్పుడూ కూడా ఈ కర్మయోగ సూత్రం మీదే ఆధారపడి ఉంటుంది మన సూత్ర డెడికేటెడ్ యాక్షన్ అది ఎఫర్ట్ ద్వారానే పాసిబుల్ ఫిజికల్ ప్లేన్ లో ఎఫర్ట్ కావాలి దేర్ ఇస్ ఏ గ్రావిటేషనల్ పుల్ చాలా పుల్లు ఉంటుంది.","తర్వాత కృతజ్ఞతా సూత్రం మన తల్లికి ఫస్ట్ మనం కృతజ్ఞత చెప్పుకోవాలి మన మొదటి విషయం మన తల్లితోనే ప్రారంభం ం అంతా నీటి బొట్టులోనే ఉంది ఇప్పుడు ఆ చిన్న నీటి బొట్టులో మహాసాగరం దాగి ఉంది."],"minutes":4,"words":547},{"title":"సాధన ద్వారా పరివర్తన","paras":["మీరు ఇప్పుడు రోజుకి 100 మందికి ధ్యానం నేర్పిస్తున్నారు. మీ లక్ష్యం నీ గోల్ ఈ జన్మలో కోటి మందికి ధ్యానం నేర్పించాలి ఓకే ధ్యానం ద్వారా వాళ్లో అంతర్ పరివర్తన వస్తది ఆత్మానందం వస్త జ్ఞానం వస్తది అన్ని వస్తాయి. సో కోటి మందికి చెప్పాలనుకున్నారు ధ్యానం అది పాసిబిలిటీ ఉందా లేదా ముందుగానే ఆ ఫ్యూచర్ ఏదైతే ఉందో భవిష్యత్తులో ఆ యొక్క విత్తన రూపంలో సూక్ష్మంగా ఇప్పుడే ఉంది. ఆ పాసిబిలిటీని ఇప్పుడు ఫీల్ కావాలి. మీరు మిమ్మల్ని ఆ రోజు చూసుకోవాలి.","కంప్లీట్ విజయం పొందిన ఆ రోజు కోటిమంది ధ్యానం నేర్పించారు మీరు కోటిమంది శాఖహరులు అయిపోయారు మీ ద్వారా కోటి యజ్ఞాలు చేశారు మీరు ధ్యాన యజ్ఞాలు ఇలాంటివి ఎన్నో గొప్ప గొప్ప విజయ విజయాలను పొందారు మీరు ఆ పాసిబిలిటీని ఇప్పుడే టాప్ చేయాలి హైయెస్ట్ పాసిబిలిటీ ఓకే ఫ్రెండ్స్ ఇప్పుడు మనమందరం కూడా మన రెండు కళ్ళని కూడా మూసుకొని ఒక నాలుగు నిమిషాలు అంతే ఈ ప్రక్రియ ఇదొక ప్రక్రియ మాత్రమే ఎందుకంటే ఈరోజు అద్భుతమైనటువంటి విజయదశమి విజయం మనం ఏదైతే పొందదల్చుకున్నామో మనం మన లోపల మనం కంప్లీట్ గా ట్యూన్ కావాలి మన శ్వాసతో అనుసంధానం అవుతూ మన ఉచ్వాస మన నిశ్వాస గమనిస్తూ మనసును శూన్యం చేసుకొని మొట్టమొదటిగా మన తల్లి మొదటి విజయాన్ని మనకు అందించింది మన తల్లి ద్వారా వచ్చింది మొదటి విజయం తల్లి గర్భం నుంచి బయటకి వచ్చాం బాహ్యంలోకి వచ్చాం ఈ జన్మ తీసుకున్నాం ఇది మొదటి విజయం మన రిలేషన్షిప్ విత్ అవర్ మదర్స్ ఇస్ ద ఫస్ట్ సక్సెస్ ఇన్ ద రిలేషన్షిప్ ఆ తల్లికి ధన్యవాదాలు చెప్పుకుందాం.","మన తల్లి మొదటి సక్సెస్ అని గుర్తిద్దాం. ఈ గుమ్మముండలానికి చక్కగా ఈ తల్లి ద్వారా మనం ఇక్కడికి వచ్చాం. ఇప్పుడు ఆ కృతజ్ఞత భావం ఏదైతే మీలో నింపబడి ఉందో ఆ వైబ్రేషన్ని కంప్లీట్ గా ఫీల్ అవుతూ మీరు మిమ్మల్ని కంప్లీట్ గా సంపూర్ణంగా పరిపూర్ణంగా ఏదైనా ఒక లక్ష్యము భవిష్యత్తులో ఆ లక్ష్యము సిద్ధి అయి కార్యసిద్ధి అయి ఒక విజయం మీరు పొందిన రోజు అంతిమ విజయం ఏదైనా కావచ్చు ఏ ప్రాజెక్ట్ వరకు అయినా కావచ్చు అది మీ ఆత్మజ్ఞానం కూడా కావచ్చు. లేకపోతే మీలో ఉన్నటువంటి ఒక టాలెంట్ కావచ్చు ఒక ఎక్స్ప్రెషన్ ఆఫ్ క్రియేటివిటీ కావచ్చు ఏదైనా కావచ్చు మిమ్మల్ని మీరు ఆ భవిష్యత్తు ఏ భవిష్యత్తులో అయితే మీరు ఆ ఫ్యూచర్ సెల్ఫ్ మీ భవిష్యత్తు ఆ సెల్ఫ్ ఆ విజయాన్ని అనుభూతిని చెందుతుందో ఆ ఫీలింగ్ ని ఎప్పుడు ఫీల్ కావాలి.","ఒక సూక్ష్మ జగత్తులో మీ లోపల మీ అంతరంలో మీ ఆ భవిష్యత్తులో సంపూర్ణంగా పరిపూర్ణులుగా మీరు ఉన్నప్పుడు మీ ఫుల్ పొటెన్షియల్ అంతా కూడా అవేకన్ అయ్యే ఒక విజయాన్ని మీరు మీ అంతర్విజయము బాహ్యంలో కూడా విజయం అది మీకు సంభవించిన రోజున ఏ ఫీలింగ్ కలుగుతుందో ఆ ఫీలింగ్ని ఈ క్షణంలో పొందండి ఆ భవిష్యత్తులో మిమ్మల్ని మీరు దర్శించుకుంటున్నప్పుడు ఆ భవిష్యత్తు ఫ్యూచర్ సెల్ఫ్ ఏ విధంగా ఉన్నదో గుర్తించండి ఆ భవిష్యత్ సెల్ఫ్ ఫ్యూచర్ సెల్ఫ్ మీరు ఈ క్షణంలో ఒకటే ఏకమైపోవాలి కంప్లీట్ గా ఈ మూమెంట్ లో ఏ భవిష్యత్తు అయితే పాసిబిలిటీ హైయెస్ట్ పాసిబిలిటీ మీ ఫుల్ పొటెన్షియల్ అవేకన్ అయ్యి ఒక గొప్ప విజయాన్ని మీరు పొందిన రోజు ఆ ఫీలింగ్ ని ఈ క్షణంలో మీరు పొందాలి. ఈ క్షణంలో ఈ ప్రస్తుత క్షణంలో మీరు పొందాలి.","నీలో ఉన్న సెల్ఫ్ డౌట్ ని ఆత్మన్యూనత భావం ఐయమ వర్త్లెస్ ఫెలో ఐ యమ అన్వర్ది ఐయమ ఇడిక్వేట్ నాట్ గుడ్ ఇనఫ్ ఇన్ని చదించేద్దాం ఇలాంటి ఆత్మన్యూనత భావాలన్నీ కూడా పక్కన పెట్టేద్దాం ఇది జరుగుతుందో లేదో ఆ డౌట్లన్నీ పక్కన పెట్టేద్దాం. కంప్లీట్ గా ట్యూన్ అవుతుంది మన ఆ గొప్ప ఆత్మానుభూతిని ఆత్మానుభవన్ని మన సెల్ఫ్ లో ఆ భవిష్యత్తుకు సంబంధించిన ఆ విజయాన్ని ఈ క్షణంలో విజయం పొందినప్పుడు మీరు ఏ ఫీలింగ్ పొందుతారో కొంతమంది ఆనందం పొందుతారు కొంతమంది శాంతి కలుగుతుంది పరిపూర్ణత భావం వస్తుంది ఫుల్ఫిల్మెంట్ నా జీవన జీవితము సార్ధకమైంది అనే అనే భావన కలుగుతుంది. అది ఏదైనా కావచ్చు ఆ ఫీలింగ్ ని ఈ క్షణంలో మీరు పొందండి. మీ శరీరంలో గుర్తించండి. చక్కగా శ్వాసించండి ఆ ఫీలింగ్ లోపలికి ఒక్క నిమిషం ఆ స్థితిలో ఉండండి. నేను విజేతను నాకు ఓటమి లేదు ఇప్పుడు మీరు నిదానంగా ప్రశాంతమైనటువంటి ఒక చిరునవ్వుతో ఓ గొప్ప భావంతో నిదానంగా మీ కళ్ళను తరవండి.","ఆ విజయాన్ని సక్సెస్ దేర్ ఇస్ ఓన్లీ సక్సెస్ దేర్ నో ఫెయిల్యూర్స్ ఈరోజు నుంచి మనం ఫెయిల్యూర్ అనే వర్డ్ ని మన డిక్షనరీ నుంచి డిలీట్ చేసేద్దాం ఎరేస్ చేసేద్దాం దే నో ఫెల్యూర్స్ ట్రూలీ నో ఫెయిల్యూర్స్ ఓన్లీ సక్సెస్ ఆఫ్టర్ ద సక్సెస్ ఒక విజయం తర్వాత ఇంకొక విజయం ఎన్నో శిఖరాలు విజయ శిఖరాలు అంతరంలోనూ బాహ్యంలోన నిదానంగా మీ కళ్ళను తెరవవచ్చు టేక్ యువర్ ఓన్ టైం మై డియర్ ఫ్రెండ్స్ విజయీభవ దిగ్విజీభవ శుభమస్తు వండర్ఫుల్ ఫ్రెం const nav=document.getElementById('nav'),mobileNav=document.getElementById('mobile-nav'),columns=document.getElementById('columns');let chapter=0,spreadIndex=0,spreadCount=1;
function makeNav(root){chapters.forEach((c,i)=>{let li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+c.title+'<small>~'+c.minutes+' min read</small></span>';b.onclick=()=>{chapter=i;spreadIndex=0;render();document.getElementById('mobile-side').classList.remove('open')};li.append(b);root.append(li)})}makeNav(nav);makeNav(mobileNav);
function render(){let c=chapters[chapter];document.getElementById('heading').textContent=c.title;document.getElementById('time').textContent='~'+c.minutes+' min';columns.innerHTML='';let title=document.createElement('h2');title.className='section-title';title.textContent=c.title;columns.append(title);for(let p of c.paras){let el=document.createElement('p');el.textContent=p;columns.append(el)}document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i%chapters.length===chapter));requestAnimationFrame(()=>requestAnimationFrame(measure))}
function measure(){const width=columns.clientWidth;const one=window.matchMedia('(max-width:800px)').matches;const total=Math.max(width,columns.scrollWidth);spreadCount=Math.max(1,Math.ceil((total-2)/width));spreadIndex=Math.min(spreadIndex,spreadCount-1);columns.scrollLeft=spreadIndex*width;document.getElementById('position').textContent='Section '+(chapter+1)+' / '+chapters.length+' · '+(one?'Page ':'Spread ')+(spreadIndex+1)+' / '+spreadCount;document.getElementById('prev').disabled=chapter===0&&spreadIndex===0;document.getElementById('next').disabled=chapter===chapters.length-1&&spreadIndex===spreadCount-1}
function move(dir){if(dir===1){if(spreadIndex<spreadCount-1)spreadIndex++;else if(chapter<chapters.length-1){chapter++;spreadIndex=0;render();return}}else{if(spreadIndex>0)spreadIndex--;else if(chapter>0){chapter--;spreadIndex=9999;render();return}}measure()}
document.getElementById('next').onclick=()=>move(1);document.getElementById('prev').onclick=()=>move(-1);document.getElementById('font').onclick=()=>{document.body.classList.toggle('font-large');spreadIndex=0;requestAnimationFrame(measure)};document.getElementById('menu').onclick=()=>document.getElementById('mobile-side').classList.toggle('open');window.addEventListener('resize',()=>{spreadIndex=0;requestAnimationFrame(measure)});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});render();</script></body></html>
